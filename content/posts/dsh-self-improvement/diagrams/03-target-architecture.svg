<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" fill="#ffffff"/>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<text x="720.0" y="46" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#0f172a">目标架构：四个新零件，全部挂在 DSH 外面</text>
<text x="720.0" y="74" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64748b">不改 core；评测、变体、归因、晋升各自是可替换的插件或脚本</text>
<rect x="80" y="110" width="1280" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110" y="145" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#0f172a">夜间控制器</text>
<text x="110" y="172" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">挖失败 → 生成变体 → 排队评测 → 汇总报告 → 等人工批准</text>
<text x="1330" y="145" text-anchor="end" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">cron / 手动</text>
<rect x="80" y="260" width="380" height="190" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="104" y="300" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16.5" font-weight="700" fill="#1d4ed8">Bench &amp; Runner</text>
<text x="104" y="334" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 任务集：30–50 个</text>
<text x="104" y="360" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· headless --json 跑</text>
<text x="104" y="386" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 确定性检查优先</text>
<rect x="500" y="260" width="380" height="190" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="524" y="300" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16.5" font-weight="700" fill="#7e22ce">Variant Registry</text>
<text x="524" y="334" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· variant.yaml + diff</text>
<text x="524" y="360" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 独立 DSH_HOME</text>
<text x="524" y="386" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 假设与预期效应</text>
<rect x="920" y="260" width="440" height="190" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="944" y="300" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16.5" font-weight="700" fill="#0f766e">Attribution</text>
<text x="944" y="334" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 交错 A/B + 配对 bootstrap</text>
<text x="944" y="360" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 按任务看 Δ 与回归</text>
<text x="944" y="386" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">· 记录混淆项</text>
<rect x="80" y="510" width="600" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="104" y="548" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#c2410c">Promotion Gate + Ledger</text>
<text x="104" y="578" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">门槛：Δpass ≥ +5pp 且 CI 下界 > 0；无任务回退 > 10pp</text>
<text x="104" y="602" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">账本：变体 id、评测报告、批准人、回滚命令</text>
<text x="104" y="626" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">人工批准后写入 profile 补丁</text>
<rect x="720" y="510" width="640" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="744" y="548" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#0f766e">Canary + Rollback</text>
<text x="744" y="578" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">先在 si-canary 跑一周，对比真实会话指标</text>
<text x="744" y="602" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">阈值破线自动回滚到上一份 profile 快照</text>
<text x="744" y="626" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">回滚演练每月一次</text>
<rect x="80" y="720" width="1280" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="104" y="756" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#0f172a">DSH 基座（已有）</text>
<text x="104" y="784" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">headless --json 事件流  ·  DSH_HOME 独立 profile  ·  session log  ·  forge PR</text>
<text x="104" y="806" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" fill="#64748b">原子能力都在，缺的是把它们串成一条带门槛的流水线</text>
