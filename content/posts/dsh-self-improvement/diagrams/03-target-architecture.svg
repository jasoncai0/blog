<polyline points="460,355 492,355" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<polyline points="880,355 912,355" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<polyline points="1000,452 1000,484 660,484 660,504" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<polyline points="684,585 714,585" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
</svg>
