<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
<rect x="0" y="0" width="1440" height="780" fill="#ffffff"/>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<text x="720.0" y="46" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#0f172a">DSH 的自改回路：执行器和传感器都在，中间少两件</text>
<text x="720.0" y="74" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64748b">改得动的地方很多，能判断「这次改动是否真的更好」的地方很少</text>
<rect x="130" y="150" width="250" height="118" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="255.0" y="190" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">① 提出变更</text>
<text x="255.0" y="220" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">插件、技能、提示、预设</text>
<text x="255.0" y="242" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">agent 写文件、装包</text>
<polyline points="388,209.0 428,209.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<text x="255.0" y="298" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">plugin_manager</text>
<text x="255.0" y="320" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">cordis</text>
<text x="255.0" y="342" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">skills</text>
<text x="255.0" y="364" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">AGENTS.md</text>
<rect x="440" y="150" width="250" height="118" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="565.0" y="190" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#7e22ce">② 部署</text>
<text x="565.0" y="220" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">profile 补丁 + HMR</text>
<text x="565.0" y="242" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">或 forge 提 PR 等评审</text>
<polyline points="698,209.0 738,209.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<text x="565.0" y="298" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">cordis.patch.yml</text>
<text x="565.0" y="320" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">hmr</text>
<text x="565.0" y="342" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">plugin install</text>
<rect x="750" y="150" width="250" height="118" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="875.0" y="190" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#c2410c">③ 运行</text>
<text x="875.0" y="220" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">agent loop 跑任务</text>
<text x="875.0" y="242" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">每个事件写进 session log</text>
<polyline points="1008,209.0 1048,209.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<text x="875.0" y="298" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">agent-loop</text>
<text x="875.0" y="320" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">sessions</text>
<text x="875.0" y="342" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">subagent</text>
<rect x="1060" y="150" width="250" height="118" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="1185.0" y="190" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#0f766e">④ 观测</text>
<text x="1185.0" y="220" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">日志、遥测、用户评分</text>
<text x="1185.0" y="242" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">token 与延迟统计</text>
<text x="1185.0" y="298" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">session-telemetry</text>
<text x="1185.0" y="320" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">message-feedback</text>
<text x="1185.0" y="342" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">stats</text>
<polyline points="1310,209.0 1372,209.0 1372,600 68,600 68,209.0 124,209.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="500" y="545" width="460" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
<text x="730" y="578" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">缺口：裁判与记账</text>
<text x="730" y="604" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">没有任务级成功标签，也没有变体登记</text>
<text x="730" y="626" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#334155">没有 A/B 归因，也没有晋升与回滚的账本</text>
<text x="130" y="690" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" fill="#64748b">彩色 = 已有零件；红色虚线 = 回路断点。断点不在「能不能改」，在「改完凭什么说它更好」。</text>
</svg>
