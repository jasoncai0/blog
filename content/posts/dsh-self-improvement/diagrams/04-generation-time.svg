<line x1="798.6175006027526" y1="150" x2="798.6175006027526" y2="500" stroke="#f1f5f9" stroke-width="1"/>
<line x1="994.1958186403298" y1="500" x2="994.1958186403298" y2="508" stroke="#94a3b8" stroke-width="1.2"/>
<text x="994.1958186403298" y="530" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" fill="#64748b">1mo</text>
