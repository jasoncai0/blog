<text x="720.0" y="46" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#0f172a">代际时间差三个数量级：harness 回路一年能转几十圈</text>
<text x="720.0" y="74" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64748b">横轴为对数时间；同样的 β，T 越小，一年内「评估→选择」的次数越多</text>
<line x1="110" y1="500" x2="1330" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
