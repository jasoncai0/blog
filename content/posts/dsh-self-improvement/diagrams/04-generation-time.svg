<text x="110" y="178" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">单次评测（一个任务）</text>
<line x1="110" y1="208" x2="203.15312928539024" y2="208" stroke="#ea580c" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
<circle cx="203.15312928539024" cy="208" r="7" fill="#ea580c"/>
<text x="219.15312928539024" y="212" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#ea580c">T ≈ 2 小时</text>
<text x="110" y="278" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">harness 变体（改一版→跑完）</text>
<line x1="110" y1="308" x2="684.7478213405172" y2="308" stroke="#0d9488" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
<circle cx="684.7478213405172" cy="308" r="7" fill="#0d9488"/>
<text x="700.7478213405172" y="312" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488">T ≈ 1–3 天</text>
<text x="110" y="378" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">模型下一代（预训练+后训练）</text>
<line x1="110" y1="408" x2="1196.331122839286" y2="408" stroke="#9333ea" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
<circle cx="1196.331122839286" cy="408" r="7" fill="#9333ea"/>
<text x="1212.331122839286" y="412" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#9333ea">T ≈ 3–6 个月</text>
<text x="110" y="556" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#334155">一代模型的时间里，harness 回路可以跑约 60–90 轮（按 1–3 天一轮）</text>
<text x="110" y="582" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64748b">这不是 β 的胜利，是 T 的胜利：样本量先多两个数量级。</text>
