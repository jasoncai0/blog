<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-hp-title f04-hp-desc">
  <title id="f04-hp-title">Claude Code 钩子事件到 DSH 事件的映射</title>
  <desc id="f04-hp-desc">六个受支持的钩子点各自落在 DSH 的一条事件上：会话创建、pre-step、pre-execute、post-execute、turn-stopping 与子 agent 生命周期。前五点会写 hook/invoked 与 hook/result 成对记录，脱离 turn 的生命周期点不写。钩子能拒绝、询问、阻断、注入上下文与强制续跑，改不了输入与系统消息。</desc>

  <defs>
    <marker id="f04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">09 / HOOK POINTS</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">钩子挂在哪条事件上</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">桥接层把外部命令的退出码与 JSON 输出，翻译成 DSH 已有的 waterfall 决策</text>

  <text x="40" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#8a93a6">CLAUDE CODE 事件</text>
  <text x="344" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#8a93a6">DSH 事件与落点</text>

  <!-- row 1 -->
  <rect x="40" y="124" width="236" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">SessionStart</text>
  <text x="54" y="157" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">会话开始</text>
  <line x1="278" y1="144" x2="338" y2="144" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="124" width="330" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="354" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">agent/created</text>
  <text x="354" y="157" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">串行等待，输出折进初始上下文</text>

  <!-- row 2 -->
  <rect x="40" y="174" width="236" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="192" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">UserPromptSubmit</text>
  <text x="54" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">用户提交</text>
  <line x1="278" y1="194" x2="338" y2="194" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="174" width="330" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="354" y="192" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">agent/pre-step</text>
  <text x="354" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">拒绝即返回 reject，本轮不进入</text>

  <!-- row 3 -->
  <rect x="40" y="224" width="236" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="54" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">PreToolUse</text>
  <text x="54" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">工具调用前</text>
  <line x1="278" y1="244" x2="338" y2="244" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="224" width="330" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="354" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">tools/pre-execute</text>
  <text x="354" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">deny 变成拒绝，ask 进入审批</text>

  <!-- row 4 -->
  <rect x="40" y="274" width="236" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">PostToolUse</text>
  <text x="54" y="307" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">工具调用后</text>
  <line x1="278" y1="294" x2="338" y2="294" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="274" width="330" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="354" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">tools/post-execute</text>
  <text x="354" y="307" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">阻断换成 feedback 与附加上下文</text>

  <!-- row 5 -->
  <rect x="40" y="324" width="236" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">Stop</text>
  <text x="54" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">准备收尾</text>
  <line x1="278" y1="344" x2="338" y2="344" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="324" width="330" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="354" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">agent/turn-stopping</text>
  <text x="354" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">拒绝即 steer，强制再跑一步</text>

  <!-- row 6 -->
  <rect x="40" y="374" width="236" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">SubagentStart / Stop</text>
  <text x="54" y="407" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">子 agent 起止</text>
  <line x1="278" y1="394" x2="338" y2="394" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f04-arrow)"/>
  <rect x="340" y="374" width="330" height="40" rx="4" fill="#f5f5f5" stroke="#d8d8d8" stroke-dasharray="4 3"/>
  <text x="354" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">子 agent 生命周期</text>
  <text x="354" y="407" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">脱离 turn 运行，不写调用记录</text>

  <!-- record card -->
  <rect x="692" y="124" width="228" height="290" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="708" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">每次调用记两条</text>

  <text x="708" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">hook/invoked</text>
  <text x="708" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">谁被叫、哪个点、匹配到什么</text>

  <text x="708" y="210" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">hook/result</text>
  <text x="708" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">退出码、决策、耗时、stderr 摘要</text>

  <line x1="708" y1="240" x2="904" y2="240" stroke="#e2e2e2"/>

  <text x="708" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">两条都只写入日志，</text>
  <text x="708" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不进模型上下文。</text>

  <text x="708" y="302" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">handlerId 形如</text>
  <text x="708" y="318" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">claude-code:PreToolUse:3</text>

  <text x="708" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">没有 session 或 turn 时</text>
  <text x="708" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不写，避免伪造时间线。</text>

  <rect x="708" y="374" width="196" height="28" rx="3" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="720" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">默认单条超时 600000 ms</text>

  <!-- can / cannot -->
  <rect x="40" y="434" width="420" height="128" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="58" y="456" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#2f6f5e">能改</text>
  <text x="58" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">拒绝当前调用（deny）</text>
  <text x="58" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">转人工审批（ask）</text>
  <text x="58" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">阻断结果并回灌反馈（block）</text>
  <text x="58" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">注入附加上下文（additionalContext）</text>
  <text x="58" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">强制再跑一步（Stop 拒绝 → steer）</text>

  <rect x="480" y="434" width="440" height="128" rx="6" fill="#fdf3ee" stroke="#bf4520" stroke-opacity="0.35"/>
  <text x="498" y="456" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">改不了</text>
  <text x="498" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">updatedInput：解析到就告警，然后忽略</text>
  <text x="498" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">systemMessage：告警，不进入模型</text>
  <text x="498" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">continue: false：记录，但不会真的停</text>
  <text x="498" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">never 策略下：钩子说 ask，审批服务直接拒绝</text>
  <text x="498" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">未覆盖的事件不注册，钩子文件里写了也不生效。</text>
</svg>
