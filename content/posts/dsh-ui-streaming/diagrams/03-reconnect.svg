<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f09-03-title f09-03-desc">
  <title id="f09-03-title">断线重连的两条修复路径</title>
  <desc id="f09-03-desc">日志缺口用一次替换窗口修复，帧缺口用一次 rebaseline 重建；两条路径互不替代</desc>
  <defs>
    <marker id="f09-03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
    <marker id="f09-03-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <circle cx="46" cy="40" r="3" fill="#bf4520"/>
  <text x="58" y="45" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" fill="#2d3142" font-weight="600" text-anchor="start">重连：两条游标分开修</text>
  <text x="58" y="72" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5a6580" font-weight="normal" text-anchor="start">日志游标 gap 与 assistant revision gap 分开处理，各自有独立的错误与恢复动作</text>
<rect x="40" y="100" width="430" height="400" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="124" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="start">日志游标</text><text x="56" y="146" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">RemoteJournalStream</text><rect x="56" y="174" width="398" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="197" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">follow(activate, resumeCursor)</text><line x1="255" y1="210" x2="255" y2="226" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="56" y="226" width="398" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="249" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">快照：entries + assistantStream 基线</text><line x1="255" y1="262" x2="255" y2="278" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="56" y="278" width="398" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="301" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">append：必须紧接上一条 seq</text><line x1="255" y1="314" x2="255" y2="330" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="56" y="330" width="398" height="36" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1"/><text x="72" y="353" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="normal" text-anchor="start">跳号 → replaceThrough(page)</text><line x1="255" y1="366" x2="255" y2="382" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="56" y="382" width="398" height="36" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1"/><text x="72" y="405" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="normal" text-anchor="start">合并 queued 帧，只发一次 replace</text><line x1="255" y1="418" x2="255" y2="434" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="56" y="434" width="398" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="457" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">回放排队的通知</text><text x="56" y="488" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="start">错误：carrier error / protocol violation</text><rect x="500" y="100" width="420" height="400" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="516" y="124" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="start">assistant revision</text><text x="516" y="146" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">SessionEventStream</text><rect x="516" y="174" width="388" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="532" y="197" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">上一帧 revision = 41</text><line x1="710" y1="210" x2="710" y2="226" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="516" y="226" width="388" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="532" y="249" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">期望 42，收到 47</text><line x1="710" y1="262" x2="710" y2="278" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="516" y="278" width="388" height="36" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1"/><text x="532" y="301" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="normal" text-anchor="start">RemoteStreamCarrierError</text><line x1="710" y1="314" x2="710" y2="330" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="516" y="330" width="388" height="36" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1"/><text x="532" y="353" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="normal" text-anchor="start">等连接换代</text><line x1="710" y1="366" x2="710" y2="382" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="516" y="382" width="388" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="532" y="405" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">从 resume 游标重新 open</text><line x1="710" y1="418" x2="710" y2="434" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f09-03-arrow)"/><rect x="516" y="434" width="388" height="36" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="532" y="457" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">基线 revision = 47</text><text x="516" y="488" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="start">错误：skipped revision；不补齐缺失帧</text><rect x="40" y="520" width="880" height="44" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="538" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">共同点：都从 resume 游标重开，都不尝试把缺口「填进」本地窗口。</text><text x="56" y="556" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">区别：日志缺口换窗口，帧缺口换基线；两者可以同时发生。</text>  <text x="40" y="586" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10" fill="#5a6580" font-weight="normal" text-anchor="start">依据 DSH 0.2.2-rc.1（commit fcc0ad46）源码绘制</text>
</svg>
