<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f09-04-title f09-04-desc">
  <title id="f09-04-title">流式渲染的三层批处理</title>
  <desc id="f09-04-desc">notifier 合帧、assembly 跨三次绘制、节点声明优先级；markdown 只重解析尾部两块</desc>
  <defs>
    <marker id="f09-04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
    <marker id="f09-04-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <circle cx="46" cy="40" r="3" fill="#bf4520"/>
  <text x="58" y="45" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" fill="#2d3142" font-weight="600" text-anchor="start">渲染批处理：三层调度</text>
  <text x="58" y="72" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5a6580" font-weight="normal" text-anchor="start">一层合并同一时刻的更新，一层跨三次绘制，一层决定每个节点何时发布</text>
<rect x="40" y="100" width="880" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="124" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#2d3142" font-weight="600" text-anchor="start">从 chunk 到一次可见更新</text><rect x="70" y="150" width="150" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="145" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="middle">绘制机会 0</text><text x="145" y="196" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="500" text-anchor="middle">chunk 到达</text><text x="145" y="212" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">markFrameDirty</text><line x1="220" y1="185" x2="280" y2="185" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-04-arrow)"/><rect x="280" y="150" width="150" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="355" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="middle">绘制机会 1</text><text x="355" y="196" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="500" text-anchor="middle">合帧</text><text x="355" y="212" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">复用已排 rAF</text><line x1="430" y1="185" x2="490" y2="185" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-04-arrow)"/><rect x="490" y="150" width="150" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="565" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="middle">绘制机会 2</text><text x="565" y="196" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="500" text-anchor="middle">合帧</text><text x="565" y="212" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">复用已排 rAF</text><line x1="640" y1="185" x2="700" y2="185" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-04-arrow)"/><rect x="700" y="150" width="150" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="775" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="middle">绘制机会 3</text><text x="775" y="196" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#bf4520" font-weight="600" text-anchor="middle">flush</text><text x="775" y="212" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">一次提交</text><text x="56" y="238" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6580" font-weight="normal" text-anchor="start">期间到达的 chunk 只更新累加器，不再排新的帧；immediate 发布取消整串并同步 flush。</text><rect x="40" y="270" width="282" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="294" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="start">1  notifier</text><text x="56" y="318" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">markDirty → microtask</text><text x="56" y="338" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">markFrameDirty → rAF</text><text x="56" y="358" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">generation 丢弃过期</text><rect x="338" y="270" width="282" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="354" y="294" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="start">2  assembly</text><text x="354" y="318" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">三次嵌套 rAF</text><text x="354" y="338" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">发布粒度 animation-frame</text><text x="354" y="358" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">immediate 取消并同步</text><rect x="636" y="270" width="282" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="652" y="294" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="start">3  publication</text><text x="652" y="318" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">none / animation-frame</text><text x="652" y="338" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">immediate</text><text x="652" y="358" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">取最高优先级</text><rect x="40" y="410" width="880" height="128" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="434" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#2d3142" font-weight="600" text-anchor="start">markdown：冻结前缀，只重解析尾部两块</text><rect x="56" y="452" width="152" height="42" rx="5" fill="#efeff1" stroke="#d8d8d8" stroke-width="1"/><text x="132" y="478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="500" text-anchor="middle">块 1（缓存）</text><rect x="224" y="452" width="152" height="42" rx="5" fill="#efeff1" stroke="#d8d8d8" stroke-width="1"/><text x="300" y="478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="500" text-anchor="middle">块 2（缓存）</text><rect x="392" y="452" width="152" height="42" rx="5" fill="#efeff1" stroke="#d8d8d8" stroke-width="1"/><text x="468" y="478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="500" text-anchor="middle">块 3（缓存）</text><rect x="560" y="452" width="152" height="42" rx="5" fill="#fdf1ec" stroke="#bf4520" stroke-width="1"/><text x="636" y="478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="500" text-anchor="middle">块 4（重解析）</text><rect x="728" y="452" width="152" height="42" rx="5" fill="#fdf1ec" stroke="#bf4520" stroke-width="1"/><text x="804" y="478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="500" text-anchor="middle">块 5（重解析）</text><text x="56" y="518" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6580" font-weight="normal" text-anchor="start">冻结块保留源偏移 key，React 复用元素；引用式链接跨边界时先显示字面量，定稿后修正。</text>  <text x="40" y="586" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10" fill="#5a6580" font-weight="normal" text-anchor="start">依据 DSH 0.2.2-rc.1（commit fcc0ad46）源码绘制</text>
</svg>
