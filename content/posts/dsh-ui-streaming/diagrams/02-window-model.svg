<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f09-02-title f09-02-desc">
  <title id="f09-02-title">会话窗口模型：分页、切点与拼接树</title>
  <desc id="f09-02-desc">服务端按消息数和 turn 边界切页，客户端用 concat 节点 prepend，不复制已加载的行</desc>
  <defs>
    <marker id="f09-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
    <marker id="f09-02-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <circle cx="46" cy="40" r="3" fill="#bf4520"/>
  <text x="58" y="45" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" fill="#2d3142" font-weight="600" text-anchor="start">窗口：Turn 对齐的分页与拼接树</text>
  <text x="58" y="72" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#5a6580" font-weight="normal" text-anchor="start">50 条消息 / 两个 turn start / 上限 500；向上翻页只加一个 concat 节点</text>
<rect x="40" y="100" width="420" height="430" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="56" y="124" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#2d3142" font-weight="600" text-anchor="start">会话日志：最近的消息在上</text><text x="72" y="152" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">turn/start · turn 12</text><text x="72" y="180" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">assistant/message</text><text x="72" y="208" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">tool result</text><text x="72" y="236" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">assistant/message</text><rect x="60" y="248" width="300" height="22" rx="3" fill="#fdf1ec" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="264" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="600" text-anchor="start">turn/start · turn 11</text><rect x="60" y="276" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="292" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">assistant/message</text><rect x="60" y="304" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">user/message</text><rect x="60" y="332" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="348" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">tool call</text><rect x="60" y="360" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="376" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">assistant/message</text><rect x="60" y="388" width="300" height="22" rx="3" fill="#fdf1ec" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="404" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="600" text-anchor="start">turn/start · turn 10</text><rect x="60" y="416" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="432" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">assistant/message</text><rect x="60" y="444" width="300" height="22" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="72" y="460" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="normal" text-anchor="start">user/message</text><text x="72" y="488" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">turn/start · turn 9</text><line x1="378" y1="248" x2="378" y2="478" stroke="#bf4520" stroke-width="2"/><line x1="372" y1="248" x2="384" y2="248" stroke="#bf4520" stroke-width="2"/><line x1="372" y1="478" x2="384" y2="478" stroke="#bf4520" stroke-width="2"/><text x="392" y="366" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#bf4520" font-weight="600" text-anchor="start">已加载窗口</text><text x="56" y="516" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6580" font-weight="normal" text-anchor="start">切点：至少 50 条消息 + 2 个 turn/start，最多 500 条</text><rect x="500" y="100" width="420" height="430" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="516" y="124" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#2d3142" font-weight="600" text-anchor="start">prepend 只新增 concat 节点</text><rect x="516" y="150" width="150" height="46" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="591" y="170" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="500" text-anchor="middle">leaf(新页)</text><text x="591" y="186" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">50 条</text><rect x="706" y="150" width="198" height="46" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="805" y="170" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#2d3142" font-weight="500" text-anchor="middle">window(已加载)</text><text x="805" y="186" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">500 条 / concat 节点</text><rect x="560" y="238" width="280" height="46" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1.4"/><text x="700" y="258" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#bf4520" font-weight="600" text-anchor="middle">concat</text><text x="700" y="274" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">O(1) 头部拼接</text><line x1="591" y1="196" x2="660" y2="238" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-02-arrow)"/><line x1="805" y1="196" x2="740" y2="238" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-02-arrow)"/><rect x="560" y="320" width="280" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="700" y="342" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">snapshot()</text><text x="700" y="360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">惰性物化，缓存 entries</text><text x="700" y="376" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5a6580" font-weight="normal" text-anchor="middle">append 不复制</text><line x1="700" y1="284" x2="700" y2="320" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f09-02-arrow)"/><text x="516" y="420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">只有 settleAssistant() 需要物化：</text><text x="516" y="440" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">过滤 transient 行，再按 seq 插入 durable 消息。</text><text x="516" y="470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">转义：切点落在成组事件中间时，sourceEventSeqs</text><text x="516" y="488" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6580" font-weight="normal" text-anchor="start">把起点回退到组头，避免拆开工具调用与结果。</text>  <text x="40" y="586" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10" fill="#5a6580" font-weight="normal" text-anchor="start">依据 DSH 0.2.2-rc.1（commit fcc0ad46）源码绘制</text>
</svg>
