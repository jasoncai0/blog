<svg xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img" aria-labelledby="t d" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif"><title id="t">2026-W47 分类占比</title><desc id="d">按类别统计项目数量与本周新增星数，色块长度表示项目数。</desc><rect width="960" height="354" fill="#f5f5f5"/><text x="40.0" y="46.0" font-size="11" fill="#bf4520" text-anchor="start" font-weight="600">01 / 分类占比</text><text x="40.0" y="76.0" font-size="21" fill="#2d3142" text-anchor="start" font-weight="600">十六个项目落在哪几类</text><text x="40.0" y="100.0" font-size="13" fill="#5a6580" text-anchor="start" font-weight="400">共 16 个上榜项目；条长 = 项目数，右侧数字 = 本周新增 ★</text><text x="40.0" y="118.0" font-size="11" fill="#5a6580" text-anchor="start" font-weight="400">项目数</text><rect x="40.0" y="128.0" width="385.0" height="34.0" rx="0" fill="#bf4520"/><text x="232.5" y="149.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">7</text><rect x="425.0" y="128.0" width="165.0" height="34.0" rx="0" fill="#3f6d8e"/><text x="507.5" y="149.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><rect x="590.0" y="128.0" width="55.0" height="34.0" rx="0" fill="#4a7c59"/><text x="617.5" y="149.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><rect x="645.0" y="128.0" width="110.0" height="34.0" rx="0" fill="#8c3b3b"/><text x="700.0" y="149.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><rect x="755.0" y="128.0" width="165.0" height="34.0" rx="0" fill="#8a8f98"/><text x="837.5" y="149.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><rect x="40.0" y="128.0" width="880.0" height="34.0" rx="0" fill="none" stroke="#d8d8d8" stroke-width="1"/><rect x="40.0" y="186.0" width="10.0" height="10.0" rx="2" fill="#bf4520"/><text x="58.0" y="196.0" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">AI 编程代理</text><text x="190.0" y="196.0" font