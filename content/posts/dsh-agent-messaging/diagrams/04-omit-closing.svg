<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">omitClosingText 什么时候成立</title>
<desc id="f04-desc">只有子代理干净地停在「刚给父发完消息」这一个状态，通知才省略 closing text。</desc>
<rect width="960" height="370" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">MESSAGING / CLOSING TEXT</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一条会被推翻的标记</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">后续的 claim、discard、tool/call 都会把它撤销。</text>
<line x1="80" y1="170" x2="880" y2="170" stroke="#d8d8d8" stroke-width="2"/><circle cx="120" cy="170" r="7" fill="#bf4520" stroke="#bf4520"/><text x="120" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">send_message 成功</text><text x="120" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">标记置位</text><circle cx="300" cy="170" r="7" fill="#ffffff" stroke="#bf4520"/><text x="300" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">又发生 tool/call</text><text x="300" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">撤销</text><circle cx="480" cy="170" r="7" fill="#ffffff" stroke="#bf4520"/><text x="480" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">又有输入被 claim</text><text x="480" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">撤销</text><circle cx="660" cy="170" r="7" fill="#ffffff" stroke="#bf4520"/><text x="660" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">input discarded</text><text x="660" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">撤销</text><circle cx="840" cy="170" r="7" fill="#bf4520" stroke="#bf4520"/><text x="840" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">子代理结束</text><text x="840" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">按标记生成通知</text><rect x="80" y="232" width="800" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="96" y="254" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">成立：通知写「It sent you a message just before finishing, so its closing message is omitted.」</text><text x="96" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不成立：附 closing text；为空则写「It left no closing message.」</text><text x="96" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">目的：同一段话不出现两次，也不把子代理没说过的话记到它头上。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / CLOSING TEXT</text>
</svg>
