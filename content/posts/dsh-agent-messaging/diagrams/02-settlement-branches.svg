<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">结算通知的三条路</title>
<desc id="f02-desc">同一个事件，由父 Agent 当时的状态决定投递方式；inject 只在父收尾时兜底。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">MESSAGING / SETTLEMENT</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">父状态决定投递</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三个分支都在 notifySettlement 里，条件只有两个。</text>
<rect x="60" y="210" width="190" height="84" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">child settles</text><text x="72" y="245" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">subagent-settled</text><text x="72" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">带 stopReason 与 output</text><rect x="300" y="204" width="210" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="316" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">父还在同一棵树里吗</text><text x="316" y="246" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">agents.get(parentId)</text><text x="316" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">rootOf(parent) === activation.root</text><text x="316" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">否：return，只写 warn</text><line x1="250" y1="252" x2="300" y2="252" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="600" y="70" width="230" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="612" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">收尾中</text><text x="612" y="105" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">parent.inject(message)</text><text x="612" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">next-step · 不唤醒</text><line x1="510" y1="252" x2="600" y2="108" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><text x="540" y="100" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">收尾中</text><rect x="600" y="212" width="230" height="76" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="612" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">idle</text><text x="612" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">parent.followup(message)</text><text x="612" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">next-turn · 唤醒</text><line x1="510" y1="252" x2="600" y2="250" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><text x="540" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">idle</text><rect x="600" y="354" width="230" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="612" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">running</text><text x="612" y="389" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">parent.steer(message)</text><text x="612" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">next-step · 唤醒</text><line x1="510" y1="252" x2="600" y2="392" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><text x="540" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">running</text><text x="60" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">三张卡片的差别只有两个参数：目标队列与是否唤醒；`inject` 是唯一不唤醒的分支。</text><text x="60" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">父状态取自 `parent.status`，收尾判定走 `closingTeardownFor(parent)`。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / SETTLEMENT</text>
</svg>
