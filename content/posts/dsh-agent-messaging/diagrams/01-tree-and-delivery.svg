<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">消息只沿树走</title>
<desc id="f01-desc">根、子代理、孙代理组成一棵树；send_message 可以发往任意成员，结算通知只发给直接父会话。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">MESSAGING / TOPOLOGY</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一棵树，两种消息</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">名字由路径与 session id 拼出，解析失败不会猜。</text>
<rect x="70" y="130" width="170" height="54" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="82" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">root 主 Agent</text><text x="82" y="169" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">root</text><rect x="340" y="80" width="170" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="352" y="102" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">reviewer</text><text x="352" y="119" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">reviewer</text><rect x="340" y="220" width="170" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="352" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">checker</text><text x="352" y="259" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">checker</text><rect x="630" y="80" width="190" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="642" y="102" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">helper</text><text x="642" y="119" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">reviewer/helper</text><line x1="240" y1="152" x2="340" y2="110" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><line x1="240" y1="168" x2="340" y2="240" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><line x1="510" y1="107" x2="630" y2="107" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><text x="252" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">spawn</text><text x="252" y="258" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">spawn</text><text x="546" y="98" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">spawn</text><rect x="70" y="330" width="400" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="86" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">两种消息</text><line x1="86" y1="374" x2="140" y2="374" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><text x="150" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">spawn：父创建子，子继承父的 root</text><line x1="86" y1="400" x2="140" y2="400" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="150" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">settlement：子结束，运行时通知直接父</text><text x="86" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">通知不按名字找：按创建谱系拿 parentSession。</text><text x="86" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">父不存在或不同树，静默丢弃并记 warn。</text><rect x="500" y="330" width="400" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="516" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">send_message：任意成员，除自己</text><text x="516" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">名字来自 list_agents；resolveName 失败即报错。</text><text x="516" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">发往已结束的可继续子代理：先恢复会话再投递。</text><text x="516" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">给自己发：UNAUTHORIZED。</text><text x="70" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">树只决定「谁认识谁」；投递参数决定「消息在哪里等、要不要唤醒」。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / TOPOLOGY</text>
</svg>
