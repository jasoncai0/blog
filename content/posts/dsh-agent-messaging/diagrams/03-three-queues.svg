<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">两条队列，三种投递</title>
<desc id="f03-desc">next-turn 每轮只领一条，next-step 每个 step 整批领走；唤醒只打开轮次。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">MESSAGING / QUEUES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">消息在哪里等</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">投递参数决定消息落在哪条队列，以及要不要叫醒驱动。</text>
<rect x="70" y="90" width="250" height="84" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="82" y="110" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">followup</text><text x="82" y="125" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">send(msg, next-turn, true)</text><text x="82" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">空闲时开新 turn</text><rect x="70" y="240" width="250" height="84" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="82" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">steer</text><text x="82" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">send(msg, next-step, true)</text><text x="82" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">运行中下一步领走</text><rect x="70" y="380" width="250" height="84" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="82" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">inject</text><text x="82" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">send(msg, next-step, false)</text><text x="82" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不唤醒</text><rect x="560" y="70" width="300" height="110" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="572" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">next-turn</text><text x="572" y="105" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">轮次边界领 1 条</text><text x="572" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">独占一轮，不与用户消息同批</text><text x="572" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">未被领走则留在队列</text><rect x="560" y="300" width="300" height="110" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="572" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">next-step</text><text x="572" y="335" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">每个 step 整批领走</text><text x="572" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">可与用户输入同批</text><text x="572" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">pre-step reject 时不回插</text><line x1="320" y1="132" x2="560" y2="120" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><line x1="320" y1="282" x2="560" y2="350" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><line x1="320" y1="422" x2="560" y2="392" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><text x="70" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">唤醒只保证 driver 被启动或继续，不保证消息被看见；是否消费看 inbox/claimed 或 inbox/discarded。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / QUEUES</text>
</svg>
