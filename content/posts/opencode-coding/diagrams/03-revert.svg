<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">revert 的三个阶段</title>
  <desc id="d3-desc">staged 时就按边界把文件恢复到各自的 start 树并记下元数据；committed 只删投影不动工作区；cleared 把文件恢复到 staged 之前的原始快照。</desc>

  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">REVERT</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">文件先回滚，历史后删——顺序和直觉相反</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">staged 时就已经改了工作区；committed 只是把对话砍到边界</text>

  <!-- timeline -->

  <!-- stage moment -->
  <line x1="560" y1="150" x2="560" y2="196" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="566" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">stage</text>

  <rect x="80" y="200" width="480" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="94" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">改动在磁盘上（S1…S3）</text>
  <text x="94" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">历史里也有对应消息</text>

  <rect x="560" y="200" width="320" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="574" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">文件已回到各自的 start 树</text>
  <text x="574" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">历史暂时没动，只是标记待回滚</text>

  <!-- three phases -->
  <rect x="80" y="292" width="270" height="120" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
  <text x="94" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">① staged</text>
  <text x="94" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">按边界找每个文件"最早的 start 树"</text>
  <text x="94" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">立刻 restore 工作区</text>
  <text x="94" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">记下元数据，供 clear 回退</text>
  <text x="94" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">所以"点回滚"那一刻文件就变了</text>

  <rect x="370" y="292" width="270" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="384" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">② committed</text>
  <text x="384" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">只删投影：消息、收件箱</text>
  <text x="384" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">rewind 指令状态、释放 blob</text>
  <text x="384" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">工作区一行都不碰</text>
  <text x="384" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">不显式 commit，下次 prompt 会自动提交</text>

  <rect x="660" y="292" width="220" height="120" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="674" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">③ cleared</text>
  <text x="674" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">把文件恢复到 stage 之前的</text>
  <text x="674" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">原始快照</text>
  <text x="674" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">撤销暂存，历史本就没动</text>

  <line x1="350" y1="352" x2="366" y2="352" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="640" y1="352" x2="656" y2="352" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#d3-arrow)"/>

  <text x="80" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">每个文件取"边界之后最早一次 start"，所以不同文件可能来自不同步。恢复按树分组 checkout，树里不存在的路径会被删除。</text>
  <text x="80" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">脏工作区里，回滚只覆盖 plan 内的文件；同一文件没有冲突检测，后写者赢。非 git 项目没有快照，文件级撤销静默失效。</text>
</svg>
