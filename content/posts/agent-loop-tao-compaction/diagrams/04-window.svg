<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="f4t f4d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f4t">压缩改写的是窗口，不是日志</title>
<desc id="f4d">事件日志保持追加；压缩把 keepID 之前的旧前缀替换成摘要，保留尾部，下一次请求看到的窗口由摘要与保留段拼成。</desc>
<defs>
  <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5a6580"/></marker>
</defs>
<rect width="960" height="430" fill="#f5f5f5"/>

<text x="56" y="44" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">COMPACTION / WINDOW REWRITE</text>
<text x="56" y="70" font-size="16" font-weight="600" fill="#2d3142">压缩改写的是窗口，不是日志</text>
<text x="56" y="90" font-size="10.5" fill="#5a6580">日志仍然 append-only；被替换的只是下一次请求的投影</text>

<!-- log strip -->
<text x="80" y="116" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.2" fill="#5a6580">EVENT LOG</text>
<g font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9.5" text-anchor="middle">
  <rect x="80" y="124" width="96" height="46" rx="2" fill="#ececec" stroke="#d8d8d4"/>
  <text x="128" y="152" fill="#8a8f9e">E1</text>
  <rect x="180" y="124" width="96" height="46" rx="2" fill="#ececec" stroke="#d8d8d4"/>
  <text x="228" y="152" fill="#8a8f9e">E2</text>
  <rect x="280" y="124" width="96" height="46" rx="2" fill="#ececec" stroke="#d8d8d4"/>
  <text x="328" y="152" fill="#8a8f9e">E3</text>
  <rect x="380" y="124" width="96" height="46" rx="2" fill="#ececec" stroke="#d8d8d4"/>
  <text x="428" y="152" fill="#8a8f9e">E4</text>
  <rect x="484" y="124" width="96" height="46" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="532" y="152" fill="#2d3142">E5</text>
  <rect x="584" y="124" width="96" height="46" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="632" y="152" fill="#2d3142">E6</text>
  <rect x="684" y="124" width="96" height="46" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="732" y="152" fill="#2d3142">E7</text>
  <rect x="784" y="124" width="96" height="46" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="832" y="152" fill="#2d3142">E8</text>
</g>
<line x1="476" y1="118" x2="476" y2="176" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="470" y="192" text-anchor="end" font-size="8.5" fill="#bf4520">keepID</text>

<text x="278" y="196" text-anchor="middle" font-size="9" fill="#5a6580">旧前缀 → 摘要</text>
<text x="682" y="196" text-anchor="middle" font-size="9" fill="#5a6580">keep → 原样保留</text>

<line x1="278" y1="204" x2="278" y2="244" stroke="#5a6580" stroke-width="1" marker-end="url(#f4a)"/>
<line x1="682" y1="204" x2="682" y2="244" stroke="#5a6580" stroke-width="1" marker-end="url(#f4a)"/>

<!-- window -->
<text x="80" y="230" font-size="9.5" font-weight="600" fill="#2d3142">下一次请求的窗口</text>
<rect x="80" y="248" width="260" height="62" rx="2" fill="#f3e3dc" stroke="#bf4520" stroke-width="1.2"/>
<text x="96" y="272" font-size="10.5" font-weight="600" fill="#2d3142">summary</text>
<text x="96" y="292" font-size="9" fill="#5a6580">目标 · pin 事实 · 状态 · 待办</text>

<g>
  <rect x="344" y="248" width="135" height="62" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="411" y="284" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" fill="#2d3142">E5</text>
  <rect x="479" y="248" width="135" height="62" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="546" y="284" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" fill="#2d3142">E6</text>
  <rect x="614" y="248" width="135" height="62" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="681" y="284" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" fill="#2d3142">E7</text>
  <rect x="749" y="248" width="135" height="62" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text x="816" y="284" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" fill="#2d3142">E8</text>
</g>

<!-- triggers -->
<text x="80" y="344" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.2" fill="#5a6580">TRIGGERS</text>
<g font-size="9.5" fill="#2d3142">
  <rect x="80" y="354" width="168" height="30" rx="2" fill="#ffffff" stroke="#d8d8d4"/>
  <text x="164" y="373" text-anchor="middle">预算接近 ceiling</text>
  <rect x="264" y="354" width="176" height="30" rx="2" fill="#ffffff" stroke="#d8d8d4"/>
  <text x="352" y="373" text-anchor="middle">provider 报 overflow</text>
  <rect x="456" y="354" width="152" height="30" rx="2" fill="#ffffff" stroke="#d8d8d4"/>
  <text x="532" y="373" text-anchor="middle">idle 时预计算</text>
</g>

<text x="80" y="414" font-size="10.5" fill="#5a6580">日志里 E1–E4 仍在，能回读；窗口里它们变成了一段模型自述。</text>
</svg>
