<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="f2t f2d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f2t">Thought、Action、Observation 分属两条消息</title>
<desc id="f2d">第 N 次生成同时产出 Thought 与 Action 两个内容块；harness 执行工具后写入一条 tool 消息作为 Observation；第 N+1 次生成读取它并重新决策。</desc>
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2d3142"/></marker>
</defs>
<rect width="960" height="360" fill="#f5f5f5"/>

<text x="56" y="44" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">THOUGHT / ACTION / OBSERVATION</text>
<text x="56" y="70" font-size="16" font-weight="600" fill="#2d3142">三要素不是三个步骤，而是两条消息</text>
<text x="56" y="90" font-size="10.5" fill="#5a6580">Thought 与 Action 共享同一次采样；Observation 由执行器写入，是下一次采样的输入</text>

<!-- assistant N -->
<rect x="56" y="112" width="256" height="160" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="72" y="134" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" letter-spacing="0.6" fill="#5a6580">assistant message #N</text>

<rect x="72" y="146" width="224" height="52" rx="2" fill="#ececec"/>
<text x="84" y="166" font-size="10.5" font-weight="600" fill="#2d3142">Thought</text>
<text x="84" y="184" font-size="9" fill="#5a6580">thinking / text：解释与策略</text>

<rect x="72" y="206" width="224" height="52" rx="2" fill="#f3e3dc"/>
<text x="84" y="226" font-size="10.5" font-weight="600" fill="#2d3142">Action</text>
<text x="84" y="244" font-size="9" fill="#5a6580">tool_use block：唯一副作用通道</text>

<!-- observation -->
<rect x="356" y="112" width="248" height="160" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="372" y="134" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" letter-spacing="0.6" fill="#5a6580">tool message #N</text>

<rect x="372" y="146" width="216" height="112" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
<text x="384" y="168" font-size="10.5" font-weight="600" fill="#bf4520">Observation</text>
<text x="384" y="188" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#2d3142">tool_result</text>
<text x="384" y="208" font-size="9" fill="#5a6580">status · stdout · stderr</text>
<text x="384" y="226" font-size="9" fill="#5a6580">由 harness 产生，模型只能读</text>
<text x="384" y="246" font-size="9" fill="#5a6580">可信度独立于生成</text>

<!-- assistant N+1 -->
<rect x="648" y="112" width="256" height="160" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="664" y="134" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" letter-spacing="0.6" fill="#5a6580">assistant message #N+1</text>
<text x="664" y="166" font-size="10" fill="#2d3142">读到 observation 之后</text>
<text x="664" y="188" font-size="9.5" fill="#5a6580">继续、改计划，或收尾</text>
<text x="664" y="218" font-size="9.5" fill="#5a6580">上一次的错误在这里</text>
<text x="664" y="236" font-size="9.5" fill="#5a6580">才第一次可被看见</text>

<line x1="312" y1="192" x2="348" y2="192" stroke="#2d3142" stroke-width="1.2" marker-end="url(#f2a)"/>
<text x="330" y="182" text-anchor="middle" font-size="8.5" fill="#5a6580">execute</text>

<line x1="604" y1="192" x2="640" y2="192" stroke="#2d3142" stroke-width="1.2" marker-end="url(#f2a)"/>
<text x="622" y="182" text-anchor="middle" font-size="8.5" fill="#5a6580">append</text>

<line x1="56" y1="292" x2="904" y2="292" stroke="#d8d8d4" stroke-width="1"/>
<circle cx="184" cy="292" r="2.5" fill="#2d3142"/>
<circle cx="480" cy="292" r="2.5" fill="#2d3142"/>
<circle cx="776" cy="292" r="2.5" fill="#2d3142"/>
<text x="184" y="312" text-anchor="middle" font-size="9" fill="#5a6580">第 N 次调用</text>
<text x="480" y="312" text-anchor="middle" font-size="9" fill="#5a6580">外部执行</text>
<text x="776" y="312" text-anchor="middle" font-size="9" fill="#5a6580">第 N+1 次调用</text>

<text x="56" y="342" font-size="10.5" fill="#5a6580">一次生成里可以只有 Thought，也可以只有 Action；Observation 永远来自循环外面。</text>
</svg>
