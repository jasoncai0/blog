<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-d4-title f04-d4-desc">
  <title id="f04-d4-title">三种失控形态</title>
  <desc id="f04-d4-desc">左栏父代理用查询代替等待，token 持续累积且永不 idle；中栏父子互相等待形成环，只能靠超时解开；右栏委派链逐层加深，在 maxDepth 处被拒绝。</desc>
  <defs>
    <marker id="f04-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
    <marker id="f04-arwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f04-arwg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#bf4520" text-anchor="start" letter-spacing="0.16em">RUNAWAY MODES</text>
<text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">三种失控，三种刹车</text>
<text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">前两种靠 wait 与超时，第三种靠深度上限在受理时拒绝</text>
<rect x="48" y="120" width="280" height="360" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="64" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">父空转</text>
<text x="64" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#8a93a6" text-anchor="start">查询代替等待</text>
<rect x="340" y="120" width="280" height="360" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="356" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">互相等待</text>
<text x="356" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#8a93a6" text-anchor="start">环</text>
<rect x="632" y="120" width="280" height="360" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="648" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">递归委派</text>
<text x="648" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#8a93a6" text-anchor="start">每层再开一层</text>
<rect x="64" y="200" width="100" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="114" y="227" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#2d3142" text-anchor="middle">父</text>
<rect x="212" y="200" width="100" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="262" y="227" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#2d3142" text-anchor="middle">list</text>
<line x1="164" y1="212" x2="212" y2="212" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arw)"/>
<line x1="212" y1="232" x2="164" y2="232" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arw)"/>
<text x="188" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">查</text>
<text x="188" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">结果为空</text>
<text x="72" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">+40k 输入 token</text>
<text x="72" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">+40k 输入 token</text>
<text x="72" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#bf4520" text-anchor="start">+40k 输入 token</text>
<text x="72" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#bf4520" text-anchor="start">父的 turn 永不结束</text>
<text x="72" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#4f5d75" text-anchor="start">宿主等不到 idle</text>
<rect x="364" y="210" width="96" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="412" y="237" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#2d3142" text-anchor="middle">父</text>
<rect x="500" y="210" width="96" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="548" y="237" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#2d3142" text-anchor="middle">子</text>
<line x1="460" y1="222" x2="500" y2="222" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arw)"/>
<line x1="500" y1="244" x2="460" y2="244" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arw)"/>
<text x="480" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">wait</text>
<text x="480" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">wait</text>
<text x="364" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">父等子回话，子等父下一步</text>
<text x="364" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">两条边都挂着，只有 timeout 解开</text>
<text x="364" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#bf4520" text-anchor="start">30 秒后各自超时</text>
<text x="364" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">这不是死锁检测，是兜底</text>
<rect x="680" y="196" width="110" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="694" y="221" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#2d3142" text-anchor="start">lead</text>
<text x="806" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">depth 0</text>
<rect x="680" y="258" width="110" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="694" y="283" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#2d3142" text-anchor="start">a</text>
<text x="806" y="283" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">depth 1</text>
<rect x="680" y="320" width="110" height="40" rx="4" fill="#fafafa" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="694" y="345" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">b</text>
<text x="806" y="345" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#bf4520" text-anchor="start">depth 2 → 拒绝</text>
<line x1="735" y1="236" x2="735" y2="258" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arw)"/>
<line x1="735" y1="298" x2="735" y2="320" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#f04-arw)"/>
<text x="660" y="341" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#bf4520" text-anchor="start">×</text>
<text x="680" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#bf4520" text-anchor="start">maxDepth = 1</text>
<text x="680" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" fill="#4f5d75" text-anchor="start">depth 2 在受理时抛错</text>
<text x="48" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">三条刹车都在受理或等待路径上，不需要模型自己数。</text>
<text x="48" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">真正难的是第一类：它不报错，只是慢、贵、永远不结束。</text>
</svg>
