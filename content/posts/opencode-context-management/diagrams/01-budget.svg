<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">上下文窗口预算与自动压缩触发线</title>
  <desc id="d1-desc">一条按 20 万 token 窗口绘制的横条：已用 16 万 token，触发线在 85% 即 17 万 token，右侧保留 3 万 token 给下一次回复与摘要输出。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">CONTEXT WINDOW BUDGET</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">窗口预算与自动压缩触发线</text>
  <text x="912" y="66" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">示例：window = 200k</text>

  <!-- bar segments -->
  <rect x="80" y="120" width="640" height="56" fill="#2d3142"/>
  <rect x="720" y="120" width="40" height="56" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <rect x="760" y="120" width="120" height="56" fill="#ececec" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>

  <text x="400" y="146" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#f5f5f5">已用 ≈ 160k</text>
  <text x="400" y="164" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="rgba(245,245,245,0.72)">measured + estimated</text>

  <text x="740" y="146" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">10k</text>
  <text x="740" y="162" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">余量</text>

  <text x="820" y="145" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">保留 30k</text>
  <text x="820" y="162" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">下一回复 / 摘要输出</text>

  <!-- threshold -->
  <line x1="760" y1="104" x2="760" y2="192" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="706" y="86" width="108" height="14" rx="2" fill="#f5f5f5"/>
  <text x="760" y="96" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.04em">ceiling 170k · 85%</text>

  <!-- ticks -->
  <line x1="80" y1="176" x2="80" y2="184" stroke="#4f5d75" stroke-width="1"/>
  <line x1="720" y1="176" x2="720" y2="184" stroke="#4f5d75" stroke-width="1"/>
  <line x1="760" y1="176" x2="760" y2="184" stroke="#bf4520" stroke-width="1"/>
  <line x1="880" y1="176" x2="880" y2="184" stroke="#4f5d75" stroke-width="1"/>
  <text x="80" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">0</text>
  <text x="720" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">160k</text>
  <text x="760" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">170k</text>
  <text x="880" y="198" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">200k</text>

  <!-- explanation -->
  <text x="80" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">measured = 上一响应的 input + cache.read + cache.write + output + reasoning；estimated = 其后每条消息按约 4 字符/token 估算。</text>
  <text x="80" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">两者之和达到 ceiling 时，在下一个 Step 发请求前自动压缩。</text>

  <line x1="80" y1="286" x2="880" y2="286" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <text x="80" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">ceiling = window − max(floor(window × 15%), 16k)</text>
  <text x="80" y="328" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">window  = min(input limit, context window)</text>
  <text x="560" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">window &lt; 32k 时只保留 15%，不强制 16k。</text>
  <text x="560" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">buffer 可用百分比或 token 数覆盖默认值。</text>
</svg>
