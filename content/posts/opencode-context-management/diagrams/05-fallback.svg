<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d5-title d5-desc">
  <title id="d5-title">压缩请求的三级发送顺序与被拒后的收缩阶梯</title>
  <desc id="d5-desc">左侧三级：原样发送、去掉保留尾部、扁平化为文本；右侧四级收缩：按首次被拒请求的 85%、70%、50%、35% 重试，四次后失败。</desc>

  <defs>
    <marker id="d5-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">FALLBACK LADDER</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">压缩请求放不下时，如何逐级降级</text>

  <!-- left title -->
  <text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">发送顺序：先试最省、最保真的形态</text>

  <!-- arrows -->
  <line x1="80" y1="200" x2="80" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d5-arrow)"/>
  <line x1="80" y1="324" x2="80" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d5-arrow)"/>

  <!-- card 1 focal -->
  <rect x="40" y="112" width="460" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="50" y="120" width="66" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
  <text x="83" y="129" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">CACHE-SAFE</text>
  <text x="56" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">① 原样发送整段对话</text>
  <text x="56" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">estimate ≤ fit：缓存命中，新增 token 最少</text>
  <text x="56" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">适合自动压缩刚越过阈值、对话尚未大幅超出时</text>

  <rect x="40" y="236" width="460" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="50" y="244" width="58" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="79" y="253" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">DROP TAIL</text>
  <text x="56" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">② 去掉保留尾部</text>
  <text x="56" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">estimate ≤ target：只发送 keepID 之前的请求</text>
  <text x="56" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">请求变短，但仍复用这段更短前缀的缓存</text>

  <rect x="40" y="360" width="460" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="50" y="368" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="76" y="377" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">FLATTEN</text>
  <text x="56" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">③ 扁平化为文本 transcript</text>
  <text x="56" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">清空 tools；旧交换按 L0 → L4 逐级降级</text>
  <text x="56" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">仍放不下才省略最旧交换；最新交换永不完全省略</text>

  <!-- arrows labels -->
  <rect x="88" y="208" width="34" height="14" rx="2" fill="#f5f5f5"/>
  <text x="105" y="218" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">仍超限</text>
  <rect x="88" y="332" width="34" height="14" rx="2" fill="#f5f5f5"/>
  <text x="105" y="342" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">仍超限</text>

  <!-- right panel -->
  <text x="600" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">压缩请求自身被 provider 判为 too long 之后</text>

  <line x1="880" y1="112" x2="880" y2="354" stroke="rgba(45,49,66,0.2)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="876" y="108" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">100% = 首次被拒请求</text>

  <text x="620" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">1st · 85%</text>
  <rect x="620" y="136" width="221" height="32" rx="4" fill="#2d3142"/>
  <text x="632" y="157" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#f5f5f5">85%</text>

  <text x="620" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">2nd · 70%</text>
  <rect x="620" y="198" width="182" height="32" rx="4" fill="#2d3142"/>
  <text x="632" y="219" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#f5f5f5">70%</text>

  <text x="620" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">3rd · 50%</text>
  <rect x="620" y="260" width="130" height="32" rx="4" fill="#2d3142"/>
  <text x="632" y="281" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#f5f5f5">50%</text>

  <text x="620" y="314" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">4th · 35%</text>
  <rect x="620" y="322" width="91" height="32" rx="4" fill="#2d3142"/>
  <text x="632" y="343" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#f5f5f5">35%</text>

  <text x="600" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">每次都以第一次被拒请求的估算大小为基准，</text>
  <text x="600" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">并从原始 transcript 重新缩短（而不是在上次结果上再截）。</text>
  <text x="600" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">四次之后仍失败，则 compaction 失败并返回错误。</text>

  <line x1="40" y1="470" x2="920" y2="470" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">payload too large 不进入这个阶梯：先改为纯文本重发、去掉内联媒体；若纯文本仍被拒，才按 too long 计数。</text>
</svg>
