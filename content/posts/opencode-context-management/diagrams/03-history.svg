<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">两次摘要压缩后的历史与 checkpoint 形态</title>
  <desc id="d3-desc">三行消息带：原始对话 E1 到 E19；第一次压缩后变成 S1 加保留的 E9 和 E10，再后续消息；第二次压缩后变成 S2 加保留的 E19。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">COMPACTION HISTORY</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">两次摘要压缩后的历史与 checkpoint 形态</text>

  <!-- Row A -->
  <text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">原始消息（只追加，不删除）</text>
  <rect x="40" y="108" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="400" y="108" width="120" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <rect x="520" y="108" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="800" y="108" width="80" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="134" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E1–E8</text>
  <text x="220" y="150" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">older conversation</text>
  <text x="460" y="134" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E9–E10</text>
  <text x="460" y="150" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">最近 15k</text>
  <text x="660" y="134" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E11–E18</text>
  <text x="660" y="150" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">later exchanges</text>
  <text x="840" y="134" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E19</text>

  <!-- Bracket A -->
  <path d="M40,184 V176 M40,184 H520 M520,184 V176" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <text x="40" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">1. 摘要 S1 覆盖 E1–E8；最近约 15k（E9–E10）作为 recent 保留</text>

  <!-- Row B -->
  <text x="40" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">第一次压缩后；E11–E19 随后陆续到达</text>
  <rect x="40" y="244" width="260" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="300" y="244" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="660" y="244" width="80" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="740" y="244" width="140" height="56" rx="6" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="170" y="268" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">S1 + E9,E10</text>
  <text x="170" y="284" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">one user message</text>
  <text x="480" y="268" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E11–E18</text>
  <text x="480" y="284" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">new messages</text>
  <text x="700" y="268" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">E19</text>
  <text x="810" y="268" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#4f5d75">后续…</text>

  <!-- Bracket B -->
  <path d="M40,320 V312 M40,320 H740 M740,320 V312" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <text x="40" y="338" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">2. 摘要 S2 覆盖 S1 与 E11–E18；E19 作为新的 recent 保留</text>

  <!-- Row C -->
  <text x="40" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">第二次压缩后</text>
  <rect x="40" y="380" width="340" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="380" y="380" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="560" y="380" width="140" height="56" rx="6" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="406" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">S2 + E19</text>
  <text x="210" y="422" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">summary + recent-context</text>
  <text x="470" y="406" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">新消息…</text>
  <text x="630" y="406" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#4f5d75">未来…</text>

  <line x1="40" y1="456" x2="880" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <text x="40" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">compaction 行保存 summary、model、native、metadata.keepID 与费用；recent-context 不落盘，读取时按 keepID 从仍保留的消息重建。</text>
  <text x="40" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">压缩不会删除旧消息：原始 transcript 仍在 DB 中，换模型或回退时需要它。每次压缩都会把上一个 checkpoint 当作普通历史再摘要一次。</text>
</svg>
