<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">一个 Step 的上下文装配与压缩回路</title>
  <desc id="d2-desc">流程图：从持久历史载入消息，组装 transcript 并估算 token，达到阈值时进入压缩并重新载入，否则发起请求、流式执行工具并持久化事件。</desc>

  <defs>
    <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">STEP PIPELINE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一个 Step 的上下文装配与压缩回路</text>

  <!-- arrows -->
  <line x1="500" y1="112" x2="500" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="500" y1="192" x2="500" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="500" y1="272" x2="500" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="410" y1="344" x2="316" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="500" y1="384" x2="500" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="500" y1="464" x2="500" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <line x1="500" y1="544" x2="500" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <path d="M206,304 V176 Q206,168 214,168 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d2-arrow)"/>

  <!-- A: store -->
  <rect x="380" y="64" width="240" height="48" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <rect x="388" y="70" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="405" y="79" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">STORE</text>
  <text x="500" y="95" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">载入历史</text>
  <text x="500" y="107" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">latest completed compaction 之后</text>

  <!-- B -->
  <rect x="380" y="144" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="150" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="403" y="159" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">BUILD</text>
  <text x="500" y="175" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">组装 transcript</text>
  <text x="500" y="187" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">system + tools + messages</text>

  <!-- C -->
  <rect x="380" y="224" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="230" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="411" y="239" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">ESTIMATE</text>
  <text x="500" y="255" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">估算 prompt</text>
  <text x="500" y="267" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">measured + estimated</text>

  <!-- D diamond -->
  <polygon points="500,304 590,344 500,384 410,344" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="500" y="340" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">达到阈值？</text>
  <text x="500" y="356" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">estimate ≥ ceiling</text>

  <!-- H focal -->
  <rect x="96" y="304" width="220" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="104" y="310" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
  <text x="126" y="319" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">COMPACT</text>
  <text x="206" y="340" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">压缩</text>
  <text x="206" y="356" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">摘要 / 原生</text>
  <text x="206" y="372" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">写入 compaction 消息后重载</text>

  <!-- E -->
  <rect x="380" y="416" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="422" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="403" y="431" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">SEND</text>
  <text x="500" y="447" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">发起请求</text>
  <text x="500" y="459" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">hooks · media · output limit</text>

  <!-- F -->
  <rect x="380" y="496" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="502" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="408" y="511" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">STREAM</text>
  <text x="500" y="527" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">流式响应 + 工具</text>
  <text x="500" y="539" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">tool output 截断后入库</text>

  <!-- G -->
  <rect x="380" y="576" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="388" y="582" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="410" y="591" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">PERSIST</text>
  <text x="500" y="607" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">持久化事件</text>
  <text x="500" y="619" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">下一 Step 重新载入</text>

  <!-- labels -->
  <rect x="352" y="324" width="22" height="12" rx="2" fill="#f5f5f5"/>
  <text x="363" y="333" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">是</text>
  <rect x="508" y="396" width="22" height="12" rx="2" fill="#f5f5f5"/>
  <text x="519" y="405" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">否</text>
  <rect x="214" y="228" width="76" height="14" rx="2" fill="#f5f5f5"/>
  <text x="252" y="238" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">重新载入</text>

  <text x="48" y="660" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5a6580">每个 Step 都从持久历史重新装载上下文；不存在一个在内存里持续修改、跨 Step 复用的对话数组。</text>
</svg>
