<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="d6-title d6-desc">
  <title id="d6-title">原生压缩的存储、回放与换模型回退</title>
  <desc id="d6-desc">流程图：会话历史送到 provider 的 compact 接口，返回加密 window 存入 native.messages；同一模型时直接回放，换模型时回退到原始 transcript。</desc>

  <defs>
    <marker id="d6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">NATIVE COMPACTION</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">原生压缩：存什么、怎么回放、换模型怎么办</text>

  <!-- arrows -->
  <line x1="220" y1="118" x2="260" y2="118" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <line x1="460" y1="118" x2="500" y2="118" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <path d="M580,146 V212 Q580,220 572,220 H358 Q350,220 350,228 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d6-arrow)"/>
  <path d="M640,146 V212 Q640,220 648,220 H802 Q810,220 810,228 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <!-- A -->
  <rect x="40" y="90" width="180" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <rect x="48" y="96" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="65" y="105" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">STORE</text>
  <text x="130" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">会话历史</text>
  <text x="130" y="138" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">消息始终保留</text>

  <!-- B -->
  <rect x="260" y="90" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="268" y="96" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="294" y="105" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">PROVIDER</text>
  <text x="360" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">provider compact</text>
  <text x="360" y="138" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">endpoint / trigger</text>

  <!-- C focal -->
  <rect x="500" y="90" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="508" y="96" width="42" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
  <text x="529" y="105" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">WINDOW</text>
  <text x="600" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">native.messages</text>
  <text x="600" y="138" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">加密 / 不透明 window</text>

  <!-- E -->
  <rect x="700" y="300" width="220" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="810" y="326" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">同模型：原样回放</text>
  <text x="810" y="342" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">window 直接进入下一次请求</text>

  <!-- F -->
  <rect x="200" y="300" width="300" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="350" y="326" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">换模型：回退到原始 transcript</text>
  <text x="350" y="342" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">从更早的 summary 或全量消息重载</text>

  <!-- labels -->
  <rect x="432" y="200" width="76" height="14" rx="2" fill="#f5f5f5"/>
  <text x="470" y="210" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">switch model</text>
  <rect x="818" y="240" width="106" height="14" rx="2" fill="#f5f5f5"/>
  <text x="871" y="250" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">same model</text>

  <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <text x="40" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">window 只在生成它的 provider + model 下可回放；不匹配或无法解码时，history 边界自动回退，不报错。</text>
  <text x="40" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">trigger 机制会把最近 keep 范围内的真实 user 消息追加在 checkpoint 之后；endpoint 机制直接使用 provider 返回的完整 replacement。</text>
  <text x="40" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">压缩完成后 instruction epoch 前进：当前指令值成为新基线，旧指令增量不再进入上下文。</text>
</svg>
