<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">正常请求、摘要请求与压缩后请求的组成与缓存复用</title>
  <desc id="d4-desc">三条请求组成条：正常请求是完整前缀；摘要请求在相同前缀后追加 summary prompt；压缩后的请求从一条 checkpoint user 消息开始，再跟新消息。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">REQUEST COMPOSITION &amp; CACHE</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">请求组成：压缩为什么能复用 prompt cache</text>

  <!-- Row 1 -->
  <text x="40" y="112" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">正常请求</text>
  <text x="40" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">第 N 步</text>
  <rect x="160" y="88" width="720" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="520" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">system + tools + messages（E1…E10，原样）</text>

  <!-- cache note -->
  <line x1="160" y1="172" x2="760" y2="172" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
  <line x1="160" y1="172" x2="160" y2="164" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
  <line x1="760" y1="172" x2="760" y2="164" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
  <text x="460" y="162" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">同一前缀：命中 prompt cache（按 cache.read 计费）</text>

  <!-- Row 2 -->
  <text x="40" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">摘要请求</text>
  <text x="40" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">前缀不变 + 追加</text>
  <rect x="160" y="188" width="600" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="760" y="188" width="120" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1"/>
  <text x="460" y="216" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">system + tools + messages（与上一行完全相同）</text>
  <text x="820" y="212" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#f5f5f5">summary</text>
  <text x="820" y="224" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#f5f5f5">prompt</text>

  <!-- Row 3 -->
  <text x="40" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">压缩后的请求</text>
  <text x="40" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">新前缀</text>
  <rect x="160" y="304" width="360" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <rect x="520" y="304" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="700" y="304" width="180" height="48" rx="6" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="328" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">checkpoint</text>
  <text x="340" y="342" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">summary + recent-context</text>
  <text x="610" y="332" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142">新消息</text>
  <text x="790" y="332" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#4f5d75">……</text>

  <text x="340" y="372" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">一条 user 消息；之后每一步都从它开始复用缓存</text>

  <line x1="40" y1="400" x2="880" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <text x="40" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">摘要请求只追加、不修改前面的任何字节，所以 provider 能把整段前缀当作缓存命中；这也是它优先“原样发送”的原因。</text>
  <text x="40" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">压缩完成后前缀被重写成 checkpoint，缓存需要重建一次；此后新增消息又形成稳定前缀。</text>
</svg>
