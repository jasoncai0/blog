<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="d1-title d1-desc">
<title id="d1-title">四层披露：Agent 每次只加载下一层需要的信息</title>
<desc id="d1-desc">L0 地图约 600 token，L1 子节点卡片约 2200 token，L2 资源清单约 500 token，L3 资源正文 2000 到 5000 token。导航预算 8k 花在前三层，正文按需读取。</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">PROGRESSIVE DISCLOSURE · ASSET CATALOG</text>
<text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">四层披露：每一层只买下一步需要的信息</text>
<text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">同样的目录，Agent 看到的是四个可展开的视图，而不是一棵树或一堆 chunk。右侧数字是本层的 token 预算。</text>
<rect x="48" y="112" width="824" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="66" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">L0</text>
<text x="66" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3142">地图</text>
<text x="66" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">顶层域 + 一句范围</text>
<text x="66" y="186" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">300–600 tk</text>
<text x="700" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">0.6k</text>
<text x="700" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">8 个域</text>
<rect x="48" y="214" width="824" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<rect x="48" y="214" width="3.5" height="92" rx="1.75" fill="#bf4520"/>
<text x="66" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">L1</text>
<text x="66" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3142">卡片</text>
<text x="66" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">子节点的判别式</text>
<text x="66" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">80–120 tk / 张</text>
<text x="700" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">2.2k</text>
<text x="700" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">18 张卡片</text>
<rect x="48" y="316" width="824" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="66" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">L2</text>
<text x="66" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3142">清单</text>
<text x="66" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">资源 manifest</text>
<text x="66" y="390" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">40–60 tk / 条</text>
<text x="700" y="346" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">0.5k</text>
<text x="700" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">8 条 manifest</text>
<rect x="48" y="418" width="824" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="66" y="444" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">L3</text>
<text x="66" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3142">正文</text>
<text x="66" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">内容 / 样例 / 血缘</text>
<text x="66" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">1–4k tk / 份</text>
<text x="700" y="448" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">2–5k</text>
<text x="700" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">1–2 份正文</text>
<text x="176" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">财务域</text>
<text x="232" y="136" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8b93a7">312</text>
<text x="292" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">核算 / 报表 / 口径 / 预算</text>
<text x="176" y="153" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">销售域</text>
<text x="232" y="153" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8b93a7">208</text>
<text x="292" y="153" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">客户 / 合同 / 订单 / 回款</text>
<text x="176" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">供应链域</text>
<text x="232" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8b93a7">176</text>
<text x="292" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">采购 / 库存 / 履约</text>
<text x="176" y="187" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">…</text>
<text x="232" y="187" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8b93a7">8 个域</text>
<text x="292" y="187" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580"></text>
<rect x="176" y="222" width="160" height="62" rx="5" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1"/>
<text x="188" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">指标口径</text>
<text x="188" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">回答「怎么算」</text>
<text x="188" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">34 项</text>
<rect x="348" y="222" width="160" height="62" rx="5" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1"/>
<text x="360" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">收入报表</text>
<text x="360" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">算好的数</text>
<text x="360" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">61 项</text>
<rect x="520" y="222" width="160" height="62" rx="5" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1"/>
<text x="532" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">预算</text>
<text x="532" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">不含实际发生</text>
<text x="532" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="400" text-anchor="start" fill="#8b93a7">18 项</text>
<text x="176" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#bf4520">兄弟卡片必须能互相区分，否则下一层就是掷硬币</text>
<text x="176" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" font-weight="500" text-anchor="start" fill="#2d3142">fin_rev_recog_rule_v3</text>
<text x="372" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">规则</text>
<text x="410" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">新准则收入确认口径</text>
<text x="176" y="371" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" font-weight="500" text-anchor="start" fill="#2d3142">dwd_fin_revenue_d</text>
<text x="372" y="371" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">表</text>
<text x="410" y="371" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">收入明细，日粒度</text>
<text x="176" y="390" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" font-weight="500" text-anchor="start" fill="#2d3142">ads_rev_region_m</text>
<text x="372" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">看板</text>
<text x="410" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">区域收入月报</text>
<rect x="176" y="430" width="470" height="66" rx="5" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1"/>
<text x="190" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">收入确认：渠道返利按净额法，冲减当期收入。</text>
<text x="190" y="466" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">区域拆分以签约主体所在地为准，不以发货地为准。</text>
<text x="190" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">例外：跨境业务按最终客户所在地，需附合同编号。</text>
<path d="M884,112 894,112 894,408 884,408" fill="none" stroke="#bf4520" stroke-width="1.2"/>
<text x="908" y="260" transform="rotate(-90 908 260)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">导航预算 8k</text>
<text x="884" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">正文另计</text>
<text x="884" y="466" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="start" fill="#8b93a7">2–5k</text>
<text x="48" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">一次典型导航 4.8k：0.6k 地图 + 2.2k 卡片 + 0.5k 清单 + 1.5k 回溯；8k 预算留 3.2k 重试。</text>
<text x="48" y="568" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#8b93a7">L2 之后是资源级检索，不再走树；L3 只在确定要看这一份时加载。</text>
</svg>