<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="d2-title d2-desc">
<title id="d2-title">一次查询的两条路径：树导航与平面混合并行</title>
<desc id="d2-desc">查询先做类型判定，然后同时走树导航和平面混合。树导航逐层展开、按 margin 决定提交或回溯，预算不足时逃逸到 scoped search；平面混合用词法和向量各取 top-50，RRF 合并后重排。两条路径在融合层汇合，输出带路径引用的回答。</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">QUERY ROUTING · TWO PATHS</text>
<text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">一次查询的两条路径：树缩小范围，向量挑出那一个</text>
<text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">两条同时起跑，谁先给出高置信结果用谁；树走进死胡同，就地从当前节点逃逸</text>
