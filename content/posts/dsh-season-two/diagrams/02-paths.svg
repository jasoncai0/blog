<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">三条阅读路径</title>
<desc id="f02-desc">三行分别是应用开发者、harness 开发者、准备自建的人；每行按顺序读。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON TWO / PATHS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">同一季，三种读法</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">不必按编号读；先选一条与当前问题最近的路径。</text>
<text x="40" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">应用开发者</text><text x="40" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">要接一个 Agent 进产品</text><rect x="300" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">01 解剖</text><line x1="413" y1="120" x2="423" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="437" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="449" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">03 输入</text><line x1="550" y1="120" x2="560" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="574" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="586" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">05 审批</text><line x1="687" y1="120" x2="697" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="711" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="723" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">S2-1 旅程</text><line x1="824" y1="120" x2="834" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="848" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="860" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">S2-3 客户端</text><text x="40" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">harness 开发者</text><text x="40" y="254" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">要改循环、工具或委派</text><rect x="300" y="210" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">02 日志</text><line x1="413" y1="230" x2="423" y2="230" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="437" y="210" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="449" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">06 状态机</text><line x1="550" y1="230" x2="560" y2="230" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="574" y="210" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="586" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">10 流水线</text><line x1="687" y1="230" x2="697" y2="230" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="711" y="210" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="723" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">13 子代理</text><line x1="824" y1="230" x2="834" y2="230" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="848" y="210" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="860" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">S2-8 组装</text><text x="40" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">准备自建</text><text x="40" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">要从零写一个</text><rect x="300" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">21 自建</text><line x1="413" y1="340" x2="423" y2="340" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="437" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="449" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">02 日志</text><line x1="550" y1="340" x2="560" y2="340" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="574" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="586" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">06 状态机</text><line x1="687" y1="340" x2="697" y2="340" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="711" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="723" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">19 压缩</text><line x1="824" y1="340" x2="834" y2="340" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f02-arr)"/><rect x="848" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="860" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">S2-10 全局图</text><defs><marker id="f02-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker></defs><line x1="40" y1="452" x2="920" y2="452" stroke="#d8d8d8"/><text x="40" y="474" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">每行最后一块是收口：应用开发者收在客户端，harness 开发者收在组装，自建者收在全局图。</text><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / PATHS</text>
</svg>
