"#4f5d75">S2-9 SDK / ACP / gateway</text><text x="40" y="512" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">THREE GLOBAL VIEWS</text><rect x="40" y="524" width="292" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="54" y="546" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">请求旅程</text><text x="54" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">S2-1 一次按键到首 token</text><rect x="348" y="524" width="292" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="362" y="546" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">状态所有权</text><text x="362" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">S2-10 谁写、谁读、怎么失效</text><rect x="656" y="524" width="292" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="670" y="546" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">扩展点地图</text><text x="670" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">S2-10 加功能该挂哪</text><text x="40" y="602" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / MAP</text>
