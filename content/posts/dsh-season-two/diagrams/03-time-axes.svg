<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">同一个机制，作用在不同时间尺度</title>
<desc id="f03-desc">横轴是它生效的位置，纵轴是四类能力；空格代表这个尺度上它不参与。</desc>
<rect width="960" height="580" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON TWO / TIME AXES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">五列时间，四行能力</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">很多设计争论其实是把不同列的东西放进了同一句话。</text>
<text x="216.0" y="94" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.08em" fill="#bf4520">会话建立</text><text x="376.0" y="94" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.08em" fill="#bf4520">一轮（turn）</text><text x="536.0" y="94" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.08em" fill="#bf4520">一步（step）</text><text x="696.0" y="94" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.08em" fill="#bf4520">一次调用</text><text x="856.0" y="94" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.08em" fill="#bf4520">跨轮</text><text x="40" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">输入</text><rect x="140" y="108" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="150" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">session/created</text><rect x="300" y="108" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="310" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">claim next-turn</text><rect x="460" y="108" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="470" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">splice next-step</text><rect x="620" y="108" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="630" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">user/message</text><rect x="780" y="108" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="790" y="147.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">followup 排队</text><text x="40" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">工具</text><rect x="140" y="188" width="152" height="72" rx="5" fill="#fafafa" stroke="#d8d8d8" stroke-dasharray="3 3"/><text x="150" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#5a6580">—</text><rect x="300" y="188" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="310" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">tools.resolve</text><rect x="460" y="188" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="470" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">assemble schema</text><rect x="620" y="188" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="630" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">pre → execute → post</text><rect x="780" y="188" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="790" y="227.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">developer/message diff</text><text x="40" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">委派</text><rect x="140" y="268" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="150" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">spawn / fork</text><rect x="300" y="268" width="152" height="72" rx="5" fill="#fafafa" stroke="#d8d8d8" stroke-dasharray="3 3"/><text x="310" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#5a6580">—</text><rect x="460" y="268" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="470" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">tool 调用</text><rect x="620" y="268" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="630" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">子会话独立 turn</text><rect x="780" y="268" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="790" y="307.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">回传与 wait_agent</text><text x="40" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">记忆</text><rect x="140" y="348" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="150" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">读 AGENTS.md</text><rect x="300" y="348" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="310" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">assemble sections</text><rect x="460" y="348" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="470" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">runtime 快照</text><rect x="620" y="348" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="630" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">结果剪枝</text><rect x="780" y="348" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="790" y="387.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">压缩与召回</text><text x="40" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">宿主</text><rect x="140" y="428" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="150" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">装载 profile</text><rect x="300" y="428" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="310" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">goal round</text><rect x="460" y="428" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="470" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">启动 job</text><rect x="620" y="428" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="630" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">schedule 触发</text><rect x="780" y="428" width="152" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="0"/><text x="790" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">重启恢复</text><text x="136" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">越往右，机制越频繁；越往上，机制的影响面越大。压缩与召回只在最右列，所以它们救不了单次调用的延迟。</text><text x="40" y="562" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / TIME AXES</text>
</svg>
