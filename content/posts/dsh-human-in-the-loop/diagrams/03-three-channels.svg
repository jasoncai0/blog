<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f03-d3-title f03-d3-desc">
  <title id="f03-d3-title">三条人机通道</title>
  <desc id="f03-d3-desc">命令面在模型之上直接执行注册表 handler；审批面在工具准入处做一次性决策；问答面在一次工具调用内部等待数据。三条通道共享界面，不共享协议。</desc>
  <defs>
    <marker id="f03-d3-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">THREE CHANNELS</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">共享界面，不共享协议</text>
  <text x="48" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#4f5d75">三条流水线的形状相似，失败语义完全不同。</text>

  <!-- row 1 label -->
  <text x="48" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#7a5aa8">COMMAND PLANE · 不进模型</text>

  <rect x="48" y="136" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="62" y="160" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">/compact</text>
  <text x="62" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">用户直接键入</text>

  <rect x="222" y="136" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="236" y="160" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">parseCommand</text>
  <text x="236" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">纯语法，不含 IO</text>

  <rect x="396" y="136" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="410" y="160" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">registry.execute</text>
  <text x="410" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">直接调 handler</text>

  <rect x="570" y="136" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="584" y="160" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">command/run</text>
  <text x="584" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">handler 之前</text>

  <rect x="744" y="136" width="150" height="64" rx="6" fill="#ffffff" stroke="#7a5aa8"/>
  <text x="758" y="160" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#7a5aa8">command/done</text>
  <text x="758" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">结果 + sourceEventSeq</text>

  <path d="M 198 168 H 222" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 372 168 H 396" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 546 168 H 570" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 720 168 H 744" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>

  <text x="48" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">整条路径不产生模型消息，也不打开 turn；只有两条仅日志事件。</text>

  <!-- row 2 label -->
  <text x="48" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">APPROVAL PLANE · 一次授权</text>

  <rect x="48" y="286" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="62" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">tool/call</text>
  <text x="62" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">参数已落盘</text>

  <rect x="222" y="286" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="236" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">pre-execute</text>
  <text x="236" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">hooks / gate / sandbox</text>

  <rect x="396" y="286" width="150" height="64" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="410" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">approval.request</text>
  <text x="410" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">问人，等四值之一</text>

  <rect x="570" y="286" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="584" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">guards</text>
  <text x="584" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">只 deny / abstain</text>

  <rect x="744" y="286" width="150" height="64" rx="6" fill="#ffffff" stroke="#2f6f5e"/>
  <text x="758" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">execute</text>
  <text x="758" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">allowed-once 才到这里</text>

  <path d="M 198 318 H 222" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 372 318 H 396" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 546 318 H 570" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 720 318 H 744" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>

  <text x="48" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">授权只覆盖这一次调用；guards 在 allow 之后跑，最终准入是两者的 AND。</text>

  <!-- row 3 label -->
  <text x="48" y="426" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#2f6f5e">QUESTION PLANE · 可等待的数据</text>

  <rect x="48" y="436" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="62" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">tool body</text>
  <text x="62" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">模型发起</text>

  <rect x="222" y="436" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="236" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">ask_user_question</text>
  <text x="236" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">生成 callId</text>

  <rect x="396" y="436" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="410" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">卡片 + attachWait</text>
  <text x="410" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">拿剩余毫秒</text>

  <rect x="570" y="436" width="150" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="584" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">answer(callId)</text>
  <text x="584" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">一段数据，不是许可</text>

  <rect x="744" y="436" width="150" height="64" rx="6" fill="#ffffff" stroke="#2f6f5e"/>
  <text x="758" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">steer → user/message</text>
  <text x="758" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">下一 step 准入</text>

  <path d="M 198 468 H 222" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 372 468 H 396" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 546 468 H 570" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>
  <path d="M 720 468 H 744" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-d3-a)"/>

  <text x="48" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">超时返回 pending，不是拒绝也不是同意；回答晚到也仍能回到这条流程。</text>

  <!-- bottom -->
  <rect x="48" y="552" width="846" height="1" fill="#d8d8d8"/>
  <text x="48" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">共同点：都在模型之外改变系统行为。差异：审批失败必须拒绝，提问失败必须保持可回答，命令失败只是一条 error 结果。</text>
</svg>
