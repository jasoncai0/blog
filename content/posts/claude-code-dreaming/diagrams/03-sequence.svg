<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">一次 dream 的时序</title>
<desc id="f3d">主会话在回复结束时触发 stop hook。runner 依次过六道检查、抢锁、fork 子代理。子代理读取记忆目录与 transcript，写回主题文件并更新索引，完成后通知主会话并释放锁。抢锁失败或中止时回退 mtime。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">CLAUDE CODE / AUTO DREAM</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">一次 dream 的时序：先抢锁，再 fork</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">主会话只发起，不等待；子代理在锁的保护下读写记忆目录</text>
<text x="912" y="86" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5a6580">FIRE AND FORGET</text>

<!-- 参与者 -->
<g>
  <rect x="50" y="104" width="120" height="48" fill="#ffffff" stroke="#3d5a80"/>
  <rect x="50" y="104" width="120" height="3" fill="#3d5a80"/>
  <text x="110" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">主会话</text>
  <text x="110" y="143" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#3d5a80">stop hook</text>
</g>
<g>
  <rect x="240" y="104" width="140" height="48" fill="#ffffff" stroke="#5b4b8a"/>
  <rect x="240" y="104" width="140" height="3" fill="#5b4b8a"/>
  <text x="310" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">runner</text>
  <text x="310" y="143" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5b4b8a">autoDream.ts</text>
</g>
<g>
  <rect x="440" y="104" width="100" height="48" fill="#ffffff" stroke="#9b4b52"/>
  <rect x="440" y="104" width="100" height="3" fill="#9b4b52"/>
  <text x="490" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">锁</text>
  <text x="490" y="143" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#9b4b52">.consolidate-lock</text>
</g>
<g>
  <rect x="620" y="104" width="150" height="48" fill="#ffffff" stroke="#bf4520"/>
  <rect x="620" y="104" width="150" height="3" fill="#bf4520"/>
  <text x="695" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">dream 子代理</text>
  <text x="695" y="143" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#bf4520">fork / auto_dream</text>
</g>
<g>
  <rect x="820" y="104" width="120" height="48" fill="#ffffff" stroke="#2f6f5e"/>
  <rect x="820" y="104" width="120" height="3" fill="#2f6f5e"/>
  <text x="880" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">记忆目录</text>
  <text x="880" y="143" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#2f6f5e">memory/</text>
</g>

<!-- 生命线 -->
<line x1="110" y1="152" x2="110" y2="520" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="310" y1="152" x2="310" y2="520" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="490" y1="152" x2="490" y2="520" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="695" y1="152" x2="695" y2="520" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="880" y1="152" x2="880" y2="520" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 5"/>

<!-- 消息 -->
<line x1="110" y1="170" x2="302" y2="170" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="120" y="164" font-size="9" fill="#2d3142">回复结束 · stop hook</text>

<path d="M310 196 h30 v22 h-30" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="350" y="212" font-size="9" fill="#2d3142">六道检查</text>

<line x1="310" y1="232" x2="482" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="320" y="226" font-size="9" fill="#2d3142">acquire()</text>

<line x1="490" y1="254" x2="318" y2="254" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f3a)"/>
<text x="480" y="248" text-anchor="end" font-size="9" fill="#5a6580">PID / mtime</text>

<line x1="310" y1="286" x2="687" y2="286" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="320" y="280" font-size="9" fill="#2d3142">fork(auto_dream)</text>

<line x1="695" y1="320" x2="872" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="705" y="314" font-size="9" fill="#2d3142">ls、读 MEMORY.md</text>

<line x1="695" y1="352" x2="872" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="705" y="346" font-size="9" fill="#2d3142">grep transcripts</text>

<line x1="695" y1="384" x2="872" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="705" y="378" font-size="9" fill="#2d3142">写主题文件、删过期</text>

<path d="M695 410 h28 v20 h-28" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="731" y="424" font-size="9" fill="#2d3142">Phase 4 更新索引</text>

<line x1="695" y1="442" x2="318" y2="442" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f3a)"/>
<text x="685" y="436" text-anchor="end" font-size="9" fill="#5a6580">filesTouched</text>

<line x1="310" y1="474" x2="482" y2="474" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="320" y="468" font-size="9" fill="#2d3142">释放 · mtime = now</text>

<line x1="310" y1="502" x2="118" y2="502" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="300" y="496" text-anchor="end" font-size="9" fill="#2d3142">Improved 通知</text>

<!-- 注释 -->
<g>
  <rect x="40" y="540" width="420" height="54" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="40" y="540" width="4" height="54" fill="#9b4b52"/>
  <text x="64" y="562" font-size="10" font-weight="600" fill="#9b4b52">抢锁失败</text>
  <text x="64" y="580" font-size="9" fill="#5a6580">skip(lock)，不排队；另一个进程继续跑。</text>
</g>
<g>
  <rect x="500" y="540" width="420" height="54" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="500" y="540" width="4" height="54" fill="#bf4520"/>
  <text x="524" y="562" font-size="10" font-weight="600" fill="#bf4520">中止或失败</text>
  <text x="524" y="580" font-size="9" fill="#5a6580">mtime 回退到 priorMtime，下一轮可以重试。</text>
</g>
</svg>
