<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">Agent 记忆的四个层级</title>
<desc id="f1d">从下到上依次是 transcripts、memory notes、wiki 表示、注入上下文。dream 在相邻层之间读写：对照 transcript 修正笔记，把笔记合并成 wiki 页，把重要条目提升为索引。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="660" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">CLAUDE CODE / AUTO DREAM</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">记忆分四层，dream 在层间搬运</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">越往上越小、越贵、每次会话都加载；越往下越大、越便宜、按需检索</text>
<text x="912" y="86" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5a6580">Claude Code 2.1.321</text>

<!-- 注入层 -->
<g>
  <rect x="100" y="118" width="600" height="84" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="100" y="118" width="4" height="84" fill="#3d5a80"/>
  <text x="124" y="140" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#3d5a80">L4 / INJECTED CONTEXT</text>
  <text x="124" y="164" font-size="12.5" font-weight="600" fill="#2d3142">注入层 · MEMORY.md 索引</text>
  <text x="124" y="186" font-size="9.5" fill="#5a6580">每次会话自动加载。只放指针，不放正文。</text>
</g>

<!-- 表示层 -->
<g>
  <rect x="100" y="242" width="600" height="84" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="100" y="242" width="4" height="84" fill="#3d5a80"/>
  <text x="124" y="264" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#3d5a80">L3 / REPRESENTATIONS</text>
  <text x="124" y="288" font-size="12.5" font-weight="600" fill="#2d3142">表示层 · wiki 页与链接</text>
  <text x="124" y="310" font-size="9.5" fill="#5a6580">一页一个主题，链接把记忆连成可走的地图。</text>
</g>

<!-- 笔记层 -->
<g>
  <rect x="100" y="366" width="600" height="84" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="100" y="366" width="4" height="84" fill="#2f6f5e"/>
  <text x="124" y="388" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#2f6f5e">L2 / MEMORY NOTES</text>
  <text x="124" y="412" font-size="12.5" font-weight="600" fill="#2d3142">笔记层 · 主题文件</text>
  <text x="124" y="434" font-size="9.5" fill="#5a6580">四类标签，写入时记一个 modified 时间戳。</text>
</g>

<!-- 事实层 -->
<g>
  <rect x="100" y="490" width="600" height="84" fill="#ffffff" stroke="#dfe4ee"/>
  <rect x="100" y="490" width="4" height="84" fill="#5b4b8a"/>
  <text x="124" y="512" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#5b4b8a">L1 / TRANSCRIPTS</text>
  <text x="124" y="536" font-size="12.5" font-weight="600" fill="#2d3142">事实层 · JSONL 会话记录</text>
  <text x="124" y="558" font-size="9.5" fill="#5a6580">只追加。记录当时看到的工具输出与对话。</text>
</g>

<!-- 向上的 dream 操作 -->
<line x1="380" y1="486" x2="380" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1a)"/>
<text x="396" y="475" font-size="9" fill="#2d3142">① 对照 transcript 改错、删过期</text>

<line x1="380" y1="362" x2="380" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1a)"/>
<text x="396" y="351" font-size="9" fill="#2d3142">② 合并重复，长成 wiki 页</text>

<line x1="380" y1="238" x2="380" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1a)"/>
<text x="396" y="227" font-size="9" fill="#2d3142">③ 提升索引，删失效指针</text>

<!-- 右侧成本列 -->
<line x1="712" y1="112" x2="712" y2="580" stroke="#d5dae4" stroke-width="1" stroke-dasharray="3 4"/>

<text x="728" y="142" font-size="9.5" font-weight="600" fill="#3d5a80">每个会话都加载</text>
<text x="728" y="160" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#3d5a80">200 行 / 25KB</text>
<text x="728" y="178" font-size="8.5" fill="#5a6580">贵，必须小</text>

<text x="728" y="266" font-size="9.5" font-weight="600" fill="#2d3142">按需打开</text>
<text x="728" y="284" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#3d5a80">103 → 222 页</text>
<text x="728" y="302" font-size="8.5" fill="#5a6580">链接就是地图</text>

<text x="728" y="390" font-size="9.5" font-weight="600" fill="#2d3142">按需读取</text>
<text x="728" y="408" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#2f6f5e">user / feedback</text>
<text x="728" y="426" font-size="8.5" fill="#5a6580">project / reference</text>

<text x="728" y="514" font-size="9.5" font-weight="600" fill="#2d3142">grep 窄查询</text>
<text x="728" y="532" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#5b4b8a">tail -50</text>
<text x="728" y="550" font-size="8.5" fill="#5a6580">不整读文件</text>

<text x="48" y="616" font-size="9.5" fill="#5a6580">一条索引的格式：<tspan font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" fill="#2d3142">- [Title](file.md) — one-line hook</tspan>；超过 150 字符说明内容放错了层。</text>
</svg>
