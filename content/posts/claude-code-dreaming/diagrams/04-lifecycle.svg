<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="f4t f4d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f4t">一条记忆的生命周期</title>
<desc id="f4d">记忆写入后进入活跃状态。时间或环境变化会让它漂移，transcript 里的反证会让它被推翻。dream 拿证据对账后，决定改写成对的、删除、提升为索引、降级为细节，或者保持原样。</desc>
<defs>
  <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="630" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">CLAUDE CODE / AUTO DREAM</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">一条记忆的生命周期：写、漂、审、改</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">dream 只在有证据时动手；证据不足就保持原样</text>
<text x="912" y="86" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5a6580">EVIDENCE OR NOTHING</text>

<!-- 顶层状态 -->
<g>
  <rect x="80" y="120" width="170" height="74" fill="#ffffff" stroke="#3d5a80"/>
  <rect x="80" y="120" width="170" height="3" fill="#3d5a80"/>
  <text x="98" y="142" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#3d5a80">WRITE</text>
  <text x="98" y="164" font-size="11.5" font-weight="600" fill="#2d3142">写入</text>
  <text x="98" y="182" font-size="8.5" fill="#5a6580">会话结束时提取</text>
</g>
<g>
  <rect x="290" y="120" width="170" height="74" fill="#ffffff" stroke="#2f6f5e"/>
  <rect x="290" y="120" width="170" height="3" fill="#2f6f5e"/>
  <text x="308" y="142" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#2f6f5e">ACTIVE</text>
  <text x="308" y="164" font-size="11.5" font-weight="600" fill="#2d3142">活跃</text>
  <text x="308" y="182" font-size="8.5" fill="#5a6580">下一轮可读</text>
</g>
<g>
  <rect x="500" y="120" width="170" height="74" fill="#ffffff" stroke="#9b4b52"/>
  <rect x="500" y="120" width="170" height="3" fill="#9b4b52"/>
  <text x="518" y="142" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#9b4b52">DRIFT</text>
  <text x="518" y="164" font-size="11.5" font-weight="600" fill="#2d3142">漂移</text>
  <text x="518" y="182" font-size="8.5" fill="#5a6580">代码或环境变了</text>
</g>
<g>
  <rect x="710" y="120" width="170" height="74" fill="#ffffff" stroke="#9b4b52"/>
  <rect x="710" y="120" width="170" height="3" fill="#9b4b52"/>
  <text x="728" y="142" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#9b4b52">REFUTED</text>
  <text x="728" y="164" font-size="11.5" font-weight="600" fill="#2d3142">被推翻</text>
  <text x="728" y="182" font-size="8.5" fill="#5a6580">transcript 有反证</text>
</g>

<line x1="250" y1="157" x2="282" y2="157" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="460" y1="157" x2="492" y2="157" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f4a)"/>
<text x="466" y="150" font-size="8.5" fill="#5a6580">时间</text>
<line x1="670" y1="157" x2="702" y2="157" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<text x="676" y="150" font-size="8.5" fill="#5a6580">反证</text>

<!-- 对账中心 -->
<line x1="375" y1="194" x2="420" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="585" y1="194" x2="540" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="795" y1="194" x2="660" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>

<g>
  <rect x="330" y="282" width="300" height="80" fill="#ffffff" stroke="#4f5d75"/>
  <rect x="330" y="282" width="300" height="3" fill="#4f5d75"/>
  <text x="480" y="304" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#4f5d75">DREAM / RECONCILE</text>
  <text x="480" y="326" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">dream 对账</text>
  <text x="480" y="344" text-anchor="middle" font-size="9" fill="#5a6580">transcript 是证据，记忆是待验证的假设</text>
</g>

<!-- 结果 -->
<line x1="480" y1="362" x2="145" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="480" y1="362" x2="355" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="480" y1="362" x2="565" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<line x1="480" y1="362" x2="775" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>

<g>
  <rect x="60" y="440" width="170" height="70" fill="#ffffff" stroke="#2f6f5e"/>
  <rect x="60" y="440" width="170" height="3" fill="#2f6f5e"/>
  <text x="78" y="462" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#2f6f5e">REWRITE</text>
  <text x="78" y="482" font-size="11.5" font-weight="600" fill="#2d3142">修正</text>
  <text x="78" y="499" font-size="8.5" fill="#5a6580">改写成对的</text>
</g>
<g>
  <rect x="270" y="440" width="170" height="70" fill="#ffffff" stroke="#9b4b52"/>
  <rect x="270" y="440" width="170" height="3" fill="#9b4b52"/>
  <text x="288" y="462" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#9b4b52">DELETE</text>
  <text x="288" y="482" font-size="11.5" font-weight="600" fill="#2d3142">删除</text>
  <text x="288" y="499" font-size="8.5" fill="#5a6580">不再成立</text>
</g>
<g>
  <rect x="480" y="440" width="170" height="70" fill="#ffffff" stroke="#3d5a80"/>
  <rect x="480" y="440" width="170" height="3" fill="#3d5a80"/>
  <text x="498" y="462" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#3d5a80">PROMOTE</text>
  <text x="498" y="482" font-size="11.5" font-weight="600" fill="#2d3142">提升为索引</text>
  <text x="498" y="499" font-size="8.5" fill="#5a6580">进下一次会话</text>
</g>
<g>
  <rect x="690" y="440" width="170" height="70" fill="#ffffff" stroke="#2f6f5e"/>
  <rect x="690" y="440" width="170" height="3" fill="#2f6f5e"/>
  <text x="708" y="462" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1" fill="#2f6f5e">DEMOTE</text>
  <text x="708" y="482" font-size="11.5" font-weight="600" fill="#2d3142">降级为细节</text>
  <text x="708" y="499" font-size="8.5" fill="#5a6580">从索引挪回主题文件</text>
</g>

<!-- 图例 -->
<line x1="48" y1="552" x2="88" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4a)"/>
<text x="98" y="556" font-size="9" fill="#5a6580">有证据的转换</text>
<line x1="210" y1="552" x2="250" y2="552" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f4a)"/>
<text x="260" y="556" font-size="9" fill="#5a6580">触发条件</text>
<text x="912" y="556" text-anchor="end" font-size="9" fill="#5a6580">证据不足 → 保持原样，不产生 diff</text>

<text x="48" y="596" font-size="9.5" fill="#5a6580">dream 不改 CLAUDE.md；发现记忆与它冲突，只在记忆里标注，交给用户裁决。</text>
</svg>
