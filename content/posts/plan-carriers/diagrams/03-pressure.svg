<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">四种压力下，两种载体各自的存活情况</title>
  <desc id="d3-desc">压缩、崩溃重启、开子会话、换人接手四种压力下，对话里的手稿与磁盘上的计划文件表现不同：文件活得更久，但不保证内容还正确。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">UNDER PRESSURE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">四种压力，两种载体</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">"计划还在不在"和"计划还对不对"，是两个问题</text>

  <!-- column headers -->
  <text x="220" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">COMPACTION</text>
  <text x="400" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">RESTART</text>
  <text x="580" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">SUBAGENT</text>
  <text x="760" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">HANDOVER</text>

  <text x="220" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">上下文被压缩</text>
  <text x="400" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">进程崩了重来</text>
  <text x="580" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">派了一个子会话</text>
  <text x="760" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">换个人接手</text>

  <!-- row A label -->
  <text x="48" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">对话里的手稿</text>
  <text x="48" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">模型自己写的那段话</text>

  <!-- row A cells -->
  <rect x="220" y="170" width="170" height="96" rx="6" fill="#f7f3f0" stroke="#bf4520" stroke-width="1"/>
  <text x="236" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">被摘要吞掉</text>
  <text x="236" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">提醒能补一条回来</text>
  <text x="236" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">补不回的是内容本身</text>

  <rect x="400" y="170" width="170" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="416" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">还在库里</text>
  <text x="416" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">事件是持久化的</text>
  <text x="416" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">但没在跑的那一步要重来</text>

  <rect x="580" y="170" width="170" height="96" rx="6" fill="#f7f3f0" stroke="#bf4520" stroke-width="1"/>
  <text x="596" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">不继承</text>
  <text x="596" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">子会话只有一句任务描述</text>
  <text x="596" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">计划得在 prompt 里重讲</text>

  <rect x="760" y="170" width="170" height="96" rx="6" fill="#f7f3f0" stroke="#bf4520" stroke-width="1"/>
  <text x="776" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">只能读历史</text>
  <text x="776" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">人得自己从 transcript 里</text>
  <text x="776" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">把计划重新提炼一遍</text>

  <!-- row B label -->
  <text x="48" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">磁盘上的计划文件</text>
  <text x="48" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">plans/ 下的一篇 markdown</text>

  <!-- row B cells -->
  <rect x="220" y="290" width="170" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="236" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">不受影响</text>
  <text x="236" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">压缩动的是上下文</text>
  <text x="236" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">不是磁盘</text>

  <rect x="400" y="290" width="170" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="416" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">还在</text>
  <text x="416" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">重启后按路径找回</text>
  <text x="416" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">前提是有人记得它</text>

  <rect x="580" y="290" width="170" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="596" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">可读</text>
  <text x="596" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">前提是父会话把路径</text>
  <text x="596" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">写进了子会话的 prompt</text>

  <rect x="760" y="290" width="170" height="96" rx="6" fill="#f7f3f0" stroke="#bf4520" stroke-width="1"/>
  <text x="776" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">能接手，但可能过期</text>
  <text x="776" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">文件不会自己宣告作废</text>
  <text x="776" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">得靠人再核一遍</text>

  <line x1="48" y1="424" x2="912" y2="424" stroke="#c9ccc6" stroke-width="1"/>

  <text x="48" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">左边一列是"载体活没活下来"，右边一列是"内容还对不对"。前者可以靠工程解决，后者不能。</text>
  <text x="48" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">所以真正值钱的不是"把计划存下来"，而是"存下来的计划在什么时候会被重新检查一遍"。</text>

  <text x="48" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">能扛住四种压力的载体只有文件；能发现"计划已经不对"的机制，两者都还没有。</text>
</svg>
