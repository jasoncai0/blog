<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="780" viewBox="0 0 1360 780" role="img" aria-label="β 与代际时间平面上的现状与演进路径">

<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.3" fill="#dfe4ec"/>
  </pattern>
  <filter id="soft" x="-8%" y="-12%" width="116%" height="132%">
    <feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#1b2440" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0,0 9,3.5 0,7" fill="#7c8798"/>
  </marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0,0 9,3.5 0,7" fill="#10b981"/>
  </marker>
  <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0,0 9,3.5 0,7" fill="#8b5cf6"/>
  </marker>
  <marker id="arrow-pink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0,0 9,3.5 0,7" fill="#e11d48"/>
  </marker>
  <marker id="arrow-dark" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0,0 9,3.5 0,7" fill="#2d3748"/>
  </marker>
</defs>

<rect width="1360" height="780" fill="#f7f8fa"/><rect width="1360" height="780" fill="url(#dots)" opacity="0.75"/><text x="40.0" y="46.0" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8b95a6" text-anchor="start" letter-spacing="0.18em">BETA × T · 两条边的收益不一样</text><text x="40.0" y="78.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="start">先抬 β，再缩 T</text><text x="40.0" y="100.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="400" fill="#8b95a6" text-anchor="start">T 减半只让曲线快一倍；β 过 1 才换形状。横轴对数刻度，纵轴线性</text>
