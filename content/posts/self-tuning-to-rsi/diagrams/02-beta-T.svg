<g transform="translate(152,408.0) rotate(-90)"><text x="0.0" y="0.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="500" fill="#4b5563" text-anchor="middle">改进弹性 β</text></g>
<circle cx="360.1" cy="485.3" r="7" fill="#1f2937"/>
<circle cx="360.1" cy="485.3" r="13" fill="none" stroke="#1f2937" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="378.1" y="489.3" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="600" fill="#1f2937" text-anchor="start">现状：T≈14 天，β&lt;1</text>
<text x="378.1" y="505.3" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8.4" font-weight="400" fill="#8b95a6" text-anchor="start">参数级弱闭环</text>
<path d="M360.1,469.3 V362.0" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
