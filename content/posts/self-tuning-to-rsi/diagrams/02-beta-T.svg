<rect x="314.1" y="342.0" width="92" height="17" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
<text x="360.1" y="354.0" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" fill="#7c3aed" text-anchor="middle">M2 扩空间</text>
<rect x="314.1" y="264.7" width="92" height="17" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
<text x="360.1" y="276.7" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" fill="#7c3aed" text-anchor="middle">M3 自生成任务</text>
<rect x="920" y="176" width="400" height="66" rx="10" fill="#f0fdf7" stroke="#34d399" stroke-width="1.1"/>
<text x="938.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="start">T 减半</text>
<text x="938.0" y="221.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#6b7280" text-anchor="start">曲线快一倍，形状不变</text>
<rect x="920" y="254" width="400" height="66" rx="10" fill="#f7f4ff" stroke="#a78bfa" stroke-width="1.1"/>
<text x="938.0" y="280.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="start">β 过 1</text>
<text x="938.0" y="299.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#6b7280" text-anchor="start">翻倍时间固定，增长换形状</text>
<rect x="920" y="332" width="400" height="66" rx="10" fill="#fff5f6" stroke="#fb7185" stroke-width="1.1"/>
<text x="938.0" y="358.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="start">M1 修闭合点</text>
<text x="938.0" y="377.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#6b7280" text-anchor="start">让 β 这个量可信，位置不动</text>
<text x="920.0" y="428.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="600" fill="#1f2937" text-anchor="start">为什么顺序是 M1→M2→M3→M4</text>
<text x="920.0" y="448.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#8b95a6" text-anchor="start">闭合点不独立时，β 量的是裁判的偏好，不是能力。</text>
<text x="920.0" y="466.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.8" font-weight="400" fill="#8b95a6" text-anchor="start">先修量具，再改空间，最后买速度。</text>
<line x1="40" y1="690" x2="1320" y2="690" stroke="#d9dee7" stroke-width="0.8"/><text x="40.0" y="707.0" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8b95a6" text-anchor="start" letter-spacing="0.16em">图例</text><rect x="100" y="699" width="11" height="11" rx="3" fill="#f7f4ff" stroke="#a78bfa" stroke-width="1"/><text x="117.0" y="708.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#4b5563" text-anchor="start">扩空间（抬 β）</text><rect x="203.35" y="699" width="11" height="11" rx="3" fill="#f0fdf7" stroke="#34d399" stroke-width="1"/><text x="220.3" y="708.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#4b5563" text-anchor="start">缩周期（乘速度）</text><rect x="314.35" y="699" width="11" height="11" rx="3" fill="#fff5f6" stroke="#fb7185" stroke-width="1"/><text x="331.4" y="708.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="8.5" font-weight="400" fill="#4b5563" text-anchor="start">修量具</text>
<text x="40.0" y="748.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="400" fill="#7c8798" text-anchor="start">箭头位置是方向示意，不是拟合值；β 与 T 目前都只能间接推断。</text>
</svg>