<rect width="1360" height="660" fill="#f7f8fa"/><rect width="1360" height="660" fill="url(#dots)" opacity="0.75"/><text x="40.0" y="46.0" font-family="'SFMono-Regular','JetBrains Mono','Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8b95a6" text-anchor="start" letter-spacing="0.18em">COVERAGE · 五段回路</text><text x="40.0" y="78.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="start">五段回路，这套系统只闭了三段</text><text x="40.0" y="100.0" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="400" fill="#8b95a6" text-anchor="start">上排是「谁在做」，下排是「谁在判断更好」；只有最后一段的闭合点站在环境上</text>
