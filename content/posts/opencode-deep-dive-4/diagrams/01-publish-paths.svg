<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">一次 publish 分出的两条路</title>
  <desc id="d1-desc">任何事件都会广播给 live 订阅者；只有 durable 定义且 Bus 层开着持久化时，才在同一个事务里跑投影、推进序号、写事件行，并产出读模型。</desc>

  <defs>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">PUBLISH PATHS</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">所有事件都广播，只有一部分落库</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">durable 与否在定义时就定了；能不能落库还要看 Bus 层的 persist 开关</text>

  <rect x="380" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="394" y="136" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">publish(event)</text>
  <text x="394" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">所有事件共用同一个入口</text>

  <line x1="430" y1="168" x2="290" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="530" y1="168" x2="670" y2="216" stroke="#bf4520" stroke-width="1.2" marker-end="url(#d1-arrow-accent)"/>

  <!-- left: live -->
  <rect x="70" y="220" width="340" height="86" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="84" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">notify：广播</text>
  <text x="84" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">listeners → live PubSub → 按 type 的订阅者</text>
  <text x="84" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">live 先发：让外部看到"因"在"果"之前</text>
  <text x="84" y="298" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">27 种 live 定义 + 47 种 durable 也会经过这里</text>

  <line x1="240" y1="306" x2="240" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <rect x="70" y="360" width="340" height="78" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="84" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">SSE / 插件 / 客户端</text>
  <text x="84" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">增量只在这里出现，不保证送达</text>
  <text x="84" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">断线就丢，靠消息分页重新拉投影</text>

  <!-- right: durable -->
  <rect x="550" y="220" width="340" height="86" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="564" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">事务（immediate）</text>
  <text x="564" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">① 按聚合取最新 seq → ② 跑投影 → ③ commit 钩子</text>
  <text x="564" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">④ 推进 event_sequence → ⑤ 写 event 行</text>
  <text x="564" y="298" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">前提：durable 定义 + persist 开启</text>

  <line x1="650" y1="306" x2="610" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="790" y1="306" x2="830" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <rect x="520" y="360" width="180" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="534" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">读模型</text>
  <text x="534" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">消息、分片、收件箱</text>
  <text x="534" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">由 projector 写</text>

  <rect x="740" y="360" width="170" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="754" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">event 表</text>
  <text x="754" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">只追加，带 versionedType</text>
  <text x="754" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">用于重放与审计</text>

  <text x="70" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两条路共用同一个事件对象：live 收到的是原始 payload，落库的是编码后的 JSON，读模型是投影的结果。</text>
  <text x="70" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这也解释了为什么"事件已发"等于"视图已更新"：投影与事件行在同一个事务里，要么都成，要么都不成。</text>
</svg>
