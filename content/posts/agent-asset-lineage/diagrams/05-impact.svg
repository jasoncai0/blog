<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="f5-t f5-d"><title id="f5-t">一次知识库变更的影响面与发布门禁</title><desc id="f5-d">refund-policy 11-02 重建后，影响沿依赖的反向传播：三个直接消费者、三个下游 Agent、三个产品面；发布门禁按生产环境、影响深度和影子依赖决定阻断、灰度或告警。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">IMPACT · REVERSE TRAVERSAL</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">一次 kb 重建，影响了谁</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">箭头是影响传播，方向和 depends_on 相反：从被改版本出发，找 src_version 指向它的边</text><text x="300" y="102" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">第 1 跳 · 直接消费者</text><text x="560" y="102" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">第 2 跳 · 调用方</text><text x="790" y="102" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">产品面</text><text x="60" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.08em">变更 · 起点</text><rect x="60" y="288" width="150" height="62" rx="6" fill="#faf3f0" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/><text x="71" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#bf4520">kb · refund-policy</text><text x="71" y="317" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#bf4520">11-02 重建 · diff +38 段</text><rect x="300" y="150" width="170" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="311" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">support-refund</text><text x="311" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">agent v7 · prod/cn</text><text x="459" y="165" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#bf4520">PROD</text><rect x="300" y="270" width="170" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="311" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">dispute-assist</text><text x="311" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">agent v3 · prod/us</text><text x="459" y="285" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#bf4520">PROD</text><rect x="300" y="390" width="170" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="311" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">cs-copilot</text><text x="311" y="419" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">agent v2 · staging</text><text x="459" y="405" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#9a6a1f">STAGING</text><text x="300" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.6" font-weight="500" text-anchor="start" fill="#9a6a1f">仅预发：告警，不阻断</text><rect x="560" y="110" width="170" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="571" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" text-anchor="start" fill="#2d3142">ticket-router</text><text x="571" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="400" text-anchor="start" fill="#5a6580">agent v1 · prod/cn</text><text x="719" y="125" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#bf4520">PROD</text><rect x="560" y="190" width="170" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="571" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" text-anchor="start" fill="#2d3142">refund-supervisor</text><text x="571" y="219" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="400" text-anchor="start" fill="#5a6580">agent v2 · prod/cn</text><text x="719" y="205" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#bf4520">PROD</text><rect x="560" y="330" width="170" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="571" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" text-anchor="start" fill="#2d3142">merchant-appeal</text><text x="571" y="359" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="400" text-anchor="start" fill="#5a6580">agent v4 · prod/us</text><text x="719" y="345" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#bf4520">PROD</text><rect x="790" y="110" width="110" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="801" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">客服工作台</text><text x="801" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#5a6580">8 个入口</text><rect x="790" y="190" width="110" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="801" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">自动退款</text><text x="801" y="219" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#5a6580">12% 流量</text><rect x="790" y="330" width="110" height="50" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="801" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">商家申诉</text><text x="801" y="359" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#5a6580">4 个租户</text><path d="M212,319 L298.02778546552685,180.182437089718" fill="none" stroke="#bf4520" stroke-width="1.15"/><polygon points="300,177 299.30120098636996,182.15283222495646 295.69655657098946,179.91896808021357" fill="#bf4520" stroke="none"/><path d="M212,319 L296.3677864794559,297.90805338013604" fill="none" stroke="#bf4520" stroke-width="1.15"/><polygon points="300,297 295.907964254479,300.20862017966886 294.8794413164608,296.0945284275962" fill="#bf4520" stroke="none"/><path d="M212,319 L297.4985386011747,414.21428162403544" fill="none" stroke="#9a6a1f" stroke-width="1.15" stroke-dasharray="4 3"/><polygon points="300,417 295.25005204865937,414.8838727685806 298.4053459016585,412.0505476760916" fill="#9a6a1f" stroke="none"/><path d="M470,177 L556.6072503238577,136.58328318219972" fill="none" stroke="#bf4520" stroke-width="1.15"/><polygon points="560,135 556.5940528627245,138.92931598348684 554.800718785793,135.08645724720495" fill="#bf4520" stroke="none"/><path d="M470,177 L556.5508416420757,213.5436886933209" fill="none" stroke="#bf4520" stroke-width="1.15"/><polygon points="560,215 554.8010909608145,215.10651198183461 556.4506080669456,211.19976094099744" fill="#bf4520" stroke="none"/><path d="M470,297 L556.8529020446094,352.9718702065261" fill="none" stroke="#bf4520" stroke-width="1.15"/><polygon points="560,355 554.8603174158374,354.21027667246386 557.1575149809777,350.64565976103916" fill="#bf4520" stroke="none"/><path d="M730,135 L786.256,135.0" fill="none" stroke="#5a6580" stroke-width="1.0"/><polygon points="790,135 785.251937510376,137.12035435590977 785.251937510376,132.87964564409023" fill="#5a6580" stroke="none"/><path d="M730,215 L786.256,215.0" fill="none" stroke="#5a6580" stroke-width="1.0"/><polygon points="790,215 785.251937510376,217.12035435590977 785.251937510376,212.87964564409023" fill="#5a6580" stroke="none"/><path d="M730,355 L786.256,355.0" fill="none" stroke="#5a6580" stroke-width="1.0"/><polygon points="790,355 785.251937510376,357.12035435590974 785.251937510376,352.87964564409026" fill="#5a6580" stroke="none"/><rect x="300" y="472" width="600" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="300" y="472" width="3.5" height="116" rx="2" fill="#bf4520"/><text x="320" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">发布门禁：按影响面算，不按感觉算</text><text x="880" y="496" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="500" text-anchor="end" fill="#8a93a6">6 个 Agent · 3 个产品面 · 3 个环境</text><rect x="320" y="512" width="3" height="3" rx="1.5" fill="#bf4520"/><text x="331" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">prod 且深度 ≤ 2 → 阻断：owner 审批 + 回滚演练 + 影子依赖清零</text><rect x="320" y="533" width="3" height="3" rx="1.5" fill="#9a6a1f"/><text x="331" y="539" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">影子依赖未声明 → 先补声明，再灰度 5%</text><rect x="320" y="554" width="3" height="3" rx="1.5" fill="#2f6f5e"/><text x="331" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">仅 staging → 告警 + 通知 owner，不阻断</text><text x="320" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#8a93a6">遍历方向与 depends_on 相反：src_version = 当前版本 → 继续找指向它的边；深度默认 2。</text><text x="60" y="618" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">影响面是「可能受影响」，不是「一定出错」；它决定先看谁、先拦谁，不替代评估。</text></svg>