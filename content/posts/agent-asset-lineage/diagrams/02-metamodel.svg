rovider</text><text x="76" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">agent v7 → tool v3 表示「v7 依赖 v3」。影响分析从被改的版本出发，反向走；不要在同一张表里混用两种方向。</text><rect x="60" y="572" width="840" height="54" rx="6" fill="#eef1f6" stroke="#c3cede" stroke-width="1"/><text x="76" y="594" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#3d5a80">解析约定：alias 只解析一次</text><text x="76" y="612" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">支持 latest / prod 这类别名，但解析必须发生在 run 开始时，结果写进 run.resolution；之后所有查询都按精确版本走。</text></svg>