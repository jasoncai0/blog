<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="f2-t f2-d"><title id="f2-t">Agent 资产血缘的元模型：资产、版本、边、运行与用量</title><desc id="f2-d">asset 通过 1:N 关系拥有不可变的 asset_version；asset_edge 的两端都指向版本，并携带 type、plane 与 confidence；run 只引用 agent 的精确版本，run_usage 记录这次运行用到的每个版本；usage_daily 保存按天聚合。边方向统一为 consumer 到 provider。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">METAMODEL · ASSET / VERSION / RUN</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">资产是身份，版本是不可变事实</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">边只连版本，不连资产；运行只引用版本，不引用 latest</text><rect x="60" y="120" width="214" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="120" width="214" height="31" rx="6" fill="#fafafa" stroke="none"/><rect x="60" y="142" width="214" height="9" fill="#fafafa" stroke="none"/><rect x="60" y="120" width="3.5" height="116" rx="2" fill="#2d3142"/><text x="73" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142" letter-spacing="0.06em">asset</text><text x="262" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="end" fill="#8a93a6">身份</text><text x="73" y="168" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">id</text><text x="152" y="168" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#8a93a6">kind:n