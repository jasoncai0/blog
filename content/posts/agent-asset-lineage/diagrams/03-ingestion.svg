<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="f3-t f3-d"><title id="f3-t">Agent 血缘的四路采集与三道处理</title><desc id="f3-d">发布流水线、网关与编排器、静态扫描、评估与事故记录四路数据进入归一化，再经身份解析写入图；上线门槛检查未解析率、声明覆盖率、影子边归属与断链率。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">INGESTION · FOUR SOURCES, ONE IDENTITY</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">四路采集，一条身份</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">声明、观测、推断、证据各自入图；版本 id 是唯一的汇合点</text><rect x="60" y="114" width="190" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="114" width="3.5" height="88" rx="2" fill="#bf4520"/><text x="74" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.12em">声明</text><text x="74" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" text-anchor="start" fill="#2d3142">发布流水线</text><text x="74" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">lockfile · image digest · CI 产物</text><text x="74" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#8a93a6">触发：deploy / promote</text><path d="M155,202 L155.0,242.256" fill="none" stroke="#bf4520" stroke-width="1.2"/><polygon points="155,246 152.87964564409023,241.251937510376 157.12035435590977,241.251937510376" fill="#bf4520" stroke="none"/><rect x="270" y="114" width="190" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="270" y="114" width="3.5" height="88" rx="2" fill="#2f6f5e"/><text x="284" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" text-anchor="start" fill="#2f6f5e" letter-spacing="0.12em">观测</text><text x="284" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" text-anchor="start" fill="#2d3142">网关 / 编排器</text><text x="284" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">OTel span · tool call · retrieval</text><text x="284" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#8a93a6">触发：实时流</text><path d="M365,202 L365.0,242.256" fill="none" stroke="#2f6f5e" stroke-width="1.2"/><polygon points="365,246 362.87964564409026,241.251937510376 367.12035435590974,241.251937510376" fill="#2f6f5e" stroke="none"/><rect x="480" y="114" width="190" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="480" y="114" width="3.5" height="88" rx="2" fill="#9a6a1f"/><text x="494" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" text-anchor="start" fill="#9a6a1f" letter-spacing="0.12em">推断</text><text x="494" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" text-anchor="start" fill="#2d3142">静态扫描</text><text x="494" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">AST · prompt 引用 · MCP manifest</text><text x="494" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#8a93a6">触发：合并 / 每日</text><path d="M575,202 L575.0,242.256" fill="none" stroke="#9a6a1f" stroke-width="1.2"/><polygon points="575,246 572.8796456440903,241.251937510376 577.1203543559097,241.251937510376" fill="#9a6a1f" stroke="none"/><rect x="690" y="114" width="190" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="690" y="114" width="3.5" height="88" rx="2" fill="#7a5aa8"/><text x="704" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" text-anchor="start" fill="#7a5aa8" letter-spacing="0.12em">证据</text><text x="704" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" text-anchor="start" fill="#2d3142">评估 / 事故 / 审批</text><text x="704" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.9" font-weight="400" text-anchor="start" fill="#5a6580">eval run · incident · approval</text><text x="704" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.7" font-weight="400" text-anchor="start" fill="#8a93a6">触发：事件</text><path d="M785,202 L785.0,242.256" fill="none" stroke="#7a5aa8" stroke-width="1.2"/><polygon points="785,246 782.8796456440903,241.251937510376 787.1203543559097,241.251937510376" fill="#7a5aa8" stroke="none"/><rect x="60" y="248" width="840" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="248" width="3.5" height="56" rx="2" fill="#3d5a80"/><text x="78" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="600" text-anchor="start" fill="#3d5a80" letter-spacing="0.1em">01</text><text x="78" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">归一化</text><circle cx="202" cy="276" r="1.8" fill="#3d5a80" opacity="0.65"/><text x="210" y="279" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">抽版本号 / digest</text><circle cx="382" cy="276" r="1.8" fill="#3d5a80" opacity="0.65"/><text x="390" y="279" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">算 content_hash</text><circle cx="562" cy="276" r="1.8" fill="#3d5a80" opacity="0.65"/><text x="570" y="279" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">alias → version_id</text><circle cx="742" cy="276" r="1.8" fill="#3d5a80" opacity="0.65"/><text x="750" y="279" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">补 tenant / env</text><rect x="60" y="326" width="840" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="326" width="3.5" height="56" rx="2" fill="#7a5aa8"/><text x="78" y="350" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="600" text-anchor="start" fill="#7a5aa8" letter-spacing="0.1em">02</text><text x="78" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">身份解析</text><circle cx="202" cy="354" r="1.8" fill="#7a5aa8" opacity="0.65"/><text x="210" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">同名不同物：repo + kind</text><circle cx="382" cy="354" r="1.8" fill="#7a5aa8" opacity="0.65"/><text x="390" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">同物不同名：digest / URL</text><circle cx="562" cy="354" r="1.8" fill="#7a5aa8" opacity="0.65"/><text x="570" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">低置信只做候选边</text><circle cx="742" cy="354" r="1.8" fill="#7a5aa8" opacity="0.65"/><text x="750" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">drift：声明 vs 观测</text><rect x="60" y="404" width="840" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="404" width="3.5" height="56" rx="2" fill="#2f6f5e"/><text x="78" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="600" text-anchor="start" fill="#2f6f5e" letter-spacing="0.1em">03</text><text x="78" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2d3142">入图</text><circle cx="202" cy="432" r="1.8" fill="#2f6f5e" opacity="0.65"/><text x="210" y="435" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">edge upsert，plane 分开</text><circle cx="382" cy="432" r="1.8" fill="#2f6f5e" opacity="0.65"/><text x="390" y="435" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">run_usage 批量写</text><circle cx="562" cy="432" r="1.8" fill="#2f6f5e" opacity="0.65"/><text x="570" y="435" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">usage_daily 日聚合</text><circle cx="742" cy="432" r="1.8" fill="#2f6f5e" opacity="0.65"/><text x="750" y="435" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">证据永久 / 观测 30 天</text><path d="M480,304 L480.0,320.256" fill="none" stroke="#5a6580" stroke-width="1.1"/><polygon points="480,324 477.87964564409026,319.251937510376 482.12035435590974,319.251937510376" fill="#5a6580" stroke="none"/><path d="M480,382 L480.0,398.256" fill="none" stroke="#5a6580" stroke-width="1.1"/><polygon points="480,402 477.87964564409026,397.251937510376 482.12035435590974,397.251937510376" fill="#5a6580" stroke="none"/><text x="60" y="490" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" text-anchor="start" fill="#8a93a6" letter-spacing="0.12em">上线门槛</text><rect x="60" y="500" width="200" height="34" rx="6" fill="#ffffff" stroke="#dedede" stroke-width="1"/><circle cx="74" cy="517" r="3" fill="#2f6f5e"/><text x="85" y="521" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#2d3142">未解析调用 &lt; 2%</text><rect x="272" y="500" width="200" height="34" rx="6" fill="#ffffff" stroke="#dedede" stroke-width="1"/><circle cx="286" cy="517" r="3" fill="#2f6f5e"/><text x="297" y="521" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#2d3142">声明覆盖 &gt; 95%</text><rect x="484" y="500" width="200" height="34" rx="6" fill="#ffffff" stroke="#dedede" stroke-width="1"/><circle cx="498" cy="517" r="3" fill="#2f6f5e"/><text x="509" y="521" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#2d3142">影子边必须有 owner</text><rect x="696" y="500" width="200" height="34" rx="6" fill="#ffffff" stroke="#dedede" stroke-width="1"/><circle cx="710" cy="517" r="3" fill="#2f6f5e"/><text x="721" y="521" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#2d3142">断链 = 0（阻断发布）</text><text x="60" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">原始 span / lockfile 进对象存储，边可重放；聚合表只服务看板与告警，不服务审计。</text><text x="60" y="584" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">低置信边保留来源与证据指针，默认不进发布阻断，也不进影响面排序的第一层。</text></svg>