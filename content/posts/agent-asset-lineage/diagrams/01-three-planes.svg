<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="f1-t f1-d"><title id="f1-t">同一个 Agent 的三张血缘图：声明、运行、证据</title><desc id="f1-d">声明图记录发布时承诺的依赖，运行图记录七天内实际发生的调用并暴露未声明的影子依赖，证据图记录评估、事故与审批。三张图共用版本 id，但边的语义与保留期不同。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">ASSET LINEAGE · THREE PLANES</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">同一个 Agent，三张图：承诺、事实、判断</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">共用一套 asset_id / version_id；边不共用语义，也不共用保留期</text><rect x="48" y="108" width="864" height="152" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="108" width="4" height="152" rx="2" fill="#bf4520"/><text x="68" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.12em">A · 声明图</text><text x="68" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">发布时，它承诺依赖谁？</text><text x="68" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">lockfile / CI 解析</text><text x="68" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.1" font-weight="400" text-anchor="start" fill="#5a6580">depends_on · derives_from</text><text x="68" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.1" font-weight="400" text-anchor="start" fill="#5a6580">保留：随版本永久</text><text x="68" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.3" font-weight="400" text-anchor="start" fill="#8a93a6">能回答：这次发布该带哪些依赖，缺哪一条不该上线</text><rect x="270" y="152" width="150" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="281" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="start" fill="#2d3142">support-refund</text><text x="281" y="181" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.3" font-weight="400" text-anchor="start" fill="#5a6580">agent v7 · prod/cn</text><rect x="560" y="118" width="300" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="571" y="134.4" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.7" font-weight="600" text-anchor="start" fill="#2d3142">prompt · support-system v12</text><text x="849" y="133" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#8a93a6">2.4k tok</text><path d="M420,176 L556.435605066548,132.14569837146672" fill="none" stroke="#5a6580" stroke-width="1.1"/><polygon points="560,131 556.128556797748,134.47158861787184 554.8308610004734,130.4343128041284" fill="#5a6580" stroke="none"/><rect x="560" y="148" width="300" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="571" y="164.4" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.7" font-weight="600" text-anchor="start" fill="#2d3142">tool · refund.create v2</text><text x="849" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" font-weight="500" text-anchor="end" fill="#8a93a6">json schema</text><path d="M420,176 L556.2773065277242,161.39886001488668" fill="none" stroke="#5a6580" stroke-width="1.1"/><polygon points="560,161 555.5048459759302