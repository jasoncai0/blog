<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-d18d-title f04-d18d-desc">
  <title id="f04-d18d-title">@file 的解析时序</title>
  <desc id="f04-d18d-desc">六步自上而下：用户输入 @ 引用、语法匹配、本地索引给出路径候选、选中值作为普通文本进入用户消息；随后模型显式调用 read 工具，内容与截断才出现在工具结果里。绿色是引用层，紫色是读取层。</desc>
  <defs>
    <marker id="f04-m18d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#bf4520">CONTEXT / FILE REFERENCE</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" font-weight="600" fill="#2d3142">@file：从按键到内容，中间隔着一次工具调用</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">引用层只产出路径；读取层负责内容、行号、截断与审计。两层不能合并</text>

  <!-- rows -->
  <rect x="40" y="106" width="4" height="56" fill="#2f6f5e"/>
  <rect x="52" y="106" width="620" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#2f6f5e">01 · INPUT</text>
  <text x="68" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">用户在输入框里敲下 @src/，一个尚未闭合的引用</text>

  <rect x="40" y="172" width="4" height="56" fill="#2f6f5e"/>
  <rect x="52" y="172" width="620" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#2f6f5e">02 · GRAMMAR</text>
  <text x="68" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">activeAtToken：@ 必须在行首或空白之后；引号形态允许空格</text>

  <rect x="40" y="238" width="4" height="56" fill="#2f6f5e"/>
  <rect x="52" y="238" width="620" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="260" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#2f6f5e">03 · CANDIDATES</text>
  <text x="68" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">本地索引返回路径候选：最多 20 条；索引只存路径，不存正文</text>

  <rect x="40" y="304" width="4" height="56" fill="#2f6f5e"/>
  <rect x="52" y="304" width="620" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="68" y="326" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">04 · PROMPT TEXT</text>
  <text x="68" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">选中的值作为普通文本进入 user/message；模型看到的只是路径</text>

  <rect x="40" y="370" width="4" height="56" fill="#7a5aa8"/>
  <rect x="52" y="370" width="620" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#7a5aa8">05 · READ</text>
  <text x="68" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">模型显式调用 read：参数是路径，读多少、从哪读由调用决定</text>

  <rect x="40" y="436" width="4" height="56" fill="#7a5aa8"/>
  <rect x="52" y="436" width="620" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="458" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#7a5aa8">06 · TOOL RESULT</text>
  <text x="68" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">内容、行号、截断进入 tool/result；超长输出由 spill 接管</text>

  <!-- arrows -->
  <line x1="80" y1="162" x2="80" y2="170" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-m18d)"/>
  <line x1="80" y1="228" x2="80" y2="236" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-m18d)"/>
  <line x1="80" y1="294" x2="80" y2="302" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-m18d)"/>
  <line x1="80" y1="360" x2="80" y2="368" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f04-m18d)"/>
  <line x1="80" y1="426" x2="80" y2="434" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-m18d)"/>

  <!-- side notes -->
  <rect x="700" y="106" width="220" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="716" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">只有路径</text>
  <text x="716" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">索引在 workspace 内，</text>
  <text x="716" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">排除 node_modules / .git /</text>
  <text x="716" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">dist；lib 不排除。</text>

  <rect x="700" y="206" width="220" height="130" rx="6" fill="#ffffff" stroke="#8a93a6" stroke-dasharray="4 3"/>
  <text x="716" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">为什么选中不读</text>
  <text x="716" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">· 不绕过 read 的审计面</text>
  <text x="716" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">· 选中不等于要读全文</text>
  <text x="716" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">· 预算决策属于读取层</text>
  <text x="716" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">prompt 里明确要求：不要</text>
  <text x="716" y="323" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">声称已检查未读过的文件。</text>

  <rect x="700" y="350" width="220" height="142" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="716" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">读取层的职责</text>
  <text x="716" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">行号、分页、编码处理</text>
  <text x="716" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">按预算截断，保留边界</text>
  <text x="716" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">超长内容写 spill 文件</text>
  <text x="716" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">结果回到 tool/result 落日志</text>
  <text x="716" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">模型据此决定下一步读哪里。</text>

  <text x="40" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">绿色是引用层，紫色是读取层。两者之间的虚线箭头代表一次由模型发起的工具调用，不是一个自动发生的注入。</text>
  <text x="40" y="546" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">如果引用层替模型读了文件，日志里会出现一段没有 tool/call 的「用户消息」，来源与审计同时失真。</text>
  <text x="40" y="576" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#8a93a6">@ = POINTER · READ = CONTENT · LOG = PROOF</text>
</svg>
