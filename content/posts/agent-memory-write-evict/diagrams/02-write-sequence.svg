<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f2-title f2-desc">
  <title id="f2-title">一次 turn 的写入时序</title>
  <desc id="f2-desc">事件把文本交给模型抽取候选，模型按主谓查候选并判定关系，策略层做阈值、否决和预算裁决，存储层提交并返回 id，决策日志异步落盘。维护任务独立于本次 turn。</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5a6580" letter-spacing="0.16em">WRITE PATH · ONE TURN</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一次 turn 的写入：模型给判断，策略给结论</text>
  <text x="40" y="82" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">实线是调用，虚线是返回；维护任务不在这次调用里，失败也不回滚已提交的记忆</text>

  <!-- lifelines -->
  <line x1="110" y1="132" x2="110" y2="545" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="320" y1="132" x2="320" y2="545" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="520" y1="132" x2="520" y2="545" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="720" y1="132" x2="720" y2="545" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="890" y1="132" x2="890" y2="545" stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- actors -->
  <rect x="50" y="100" width="120" height="32" rx="16" fill="#e8eef5" stroke="#3d5a80" stroke-width="1"/>
  <text x="110" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">事件 / 用户</text>

  <rect x="260" y="100" width="120" height="32" rx="16" fill="#ece9f4" stroke="#5b4b8a" stroke-width="1"/>
  <text x="320" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">LLM</text>

  <rect x="460" y="100" width="120" height="32" rx="16" fill="#ffffff" stroke="#8a93a6" stroke-width="1"/>
  <text x="520" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">检索</text>

  <rect x="660" y="100" width="120" height="32" rx="16" fill="#f6e7e1" stroke="#bf4520" stroke-width="1"/>
  <text x="720" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">策略（代码）</text>

  <rect x="830" y="100" width="120" height="32" rx="16" fill="#e6f0ec" stroke="#2f6f5e" stroke-width="1"/>
  <text x="890" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">存储</text>

  <!-- 1 -->
  <text x="215" y="157" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">turn 结束，提交文本</text>
  <line x1="112" y1="165" x2="316" y2="165" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 2 self -->
  <text x="375" y="213" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5b4b8a">抽取 Claim[]</text>
  <path d="M320 198 L365 198 L365 226 L324 226" fill="none" stroke="#5b4b8a" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 3 -->
  <text x="420" y="262" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">按 subject + predicate 查候选</text>
  <line x1="322" y1="270" x2="516" y2="270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 4 return -->
  <text x="420" y="297" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">top-k（≤ 10）</text>
  <line x1="518" y1="305" x2="324" y2="305" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2-arrow)"/>

  <!-- 5 -->
  <text x="520" y="352" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">关系 + 重要性 + 置信度</text>
  <line x1="322" y1="360" x2="716" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 6 self -->
  <text x="773" y="407" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">阈值 / 否决 / 预算</text>
  <path d="M720 395 L765 395 L765 423 L724 423" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 7 -->
  <text x="805" y="447" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">ADD / UPDATE / SUPERSEDE / NOOP</text>
  <line x1="722" y1="455" x2="886" y2="455" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2-arrow)"/>

  <!-- 8 return -->
  <text x="805" y="482" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">新 id + 状态</text>
  <line x1="888" y1="490" x2="724" y2="490" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2-arrow)"/>

  <!-- 9 -->
  <text x="415" y="527" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">决策日志（why：分数、命中的旧条、否决原因）</text>
  <line x1="718" y1="535" x2="114" y2="535" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2-arrow)"/>

  <!-- async note -->
  <rect x="40" y="560" width="880" height="36" rx="5" fill="#efefef" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="583" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">异步维护（独立任务）：有效期扫描 · 衰减 · 预算淘汰 · 相似事件合并 · 删墓碑。它读的是已提交状态，不参与本次 turn 的决策。</text>
</svg>
