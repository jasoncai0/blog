<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f3-title f3-desc">
  <title id="f3-title">长期记忆的生命周期状态机</title>
  <desc id="f3-desc">候选经证据晋升为活跃；矛盾但证据不足进入争议；新事实覆盖后旧条变为被替代；活跃条目因衰减或预算转为温存，再转为冷存；用户删除或合规删除进入墓碑。虚线表示需要确认或显式恢复。</desc>
  <defs>
    <marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5a6580" letter-spacing="0.16em">MEMORY LIFECYCLE · STATES</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">记忆的生命周期：删除只是最后一个状态</text>
  <text x="40" y="82" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">晋升、替代、降级、墓碑各有独立触发条件；实线自动，虚线需要确认或显式恢复</text>

  <!-- candidate -->
  <rect x="60" y="150" width="150" height="54" rx="6" fill="#e8eef5" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="135" y="172" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">候选</text>
  <text x="135" y="190" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80">candidate</text>

  <!-- active -->
  <rect x="380" y="150" width="150" height="54" rx="6" fill="#e6f0ec" stroke="#2f6f5e" stroke-width="1.4"/>
  <text x="455" y="172" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">活跃</text>
  <text x="455" y="190" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">active</text>

  <!-- disputed -->
  <rect x="380" y="50" width="150" height="54" rx="6" fill="#f6e7e1" stroke="#bf4520" stroke-width="1.2"/>
  <text x="455" y="72" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">争议</text>
  <text x="455" y="90" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">disputed</text>

  <!-- superseded -->
  <rect x="740" y="150" width="150" height="54" rx="6" fill="#efefef" stroke="#8a93a6" stroke-width="1.2"/>
  <text x="815" y="172" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">被替代</text>
  <text x="815" y="190" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">superseded</text>

  <!-- warm -->
  <rect x="380" y="310" width="150" height="54" rx="6" fill="#f3f5f4" stroke="#8a93a6" stroke-width="1.2"/>
  <text x="455" y="332" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">温存</text>
  <text x="455" y="350" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">warm</text>

  <!-- cold -->
  <rect x="380" y="440" width="150" height="54" rx="6" fill="#eeeeee" stroke="#8a93a6" stroke-width="1.2"/>
  <text x="455" y="462" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">冷存</text>
  <text x="455" y="480" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">cold</text>

  <!-- tombstone -->
  <rect x="740" y="440" width="150" height="54" rx="6" fill="#f3e3e5" stroke="#9b4b52" stroke-width="1.2"/>
  <text x="815" y="462" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">墓碑</text>
  <text x="815" y="480" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#9b4b52">tombstone</text>

  <!-- candidate -> active -->
  <text x="294" y="169" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">证据 ≥ 2 / 显式记住</text>
  <line x1="212" y1="177" x2="376" y2="177" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- active -> disputed -->
  <text x="445" y="132" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">矛盾但证据不足</text>
  <line x1="455" y1="148" x2="455" y2="106" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- disputed -> active -->
  <text x="480" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">用户确认</text>
  <line x1="470" y1="106" x2="470" y2="148" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f3-arrow)"/>

  <!-- active -> superseded -->
  <text x="634" y="169" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">新事实覆盖</text>
  <line x1="532" y1="177" x2="736" y2="177" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- active -> warm -->
  <text x="465" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">R &lt; 0.25 / 预算</text>
  <line x1="455" y1="206" x2="455" y2="306" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- warm -> active -->
  <text x="480" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">召回且有用</text>
  <line x1="470" y1="306" x2="470" y2="206" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f3-arrow)"/>

  <!-- warm -> cold -->
  <text x="465" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">R &lt; 0.08</text>
  <line x1="455" y1="366" x2="455" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- cold -> active -->
  <text x="585" y="295" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">显式恢复</text>
  <path d="M530 455 L590 455 L590 200 L532 200" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f3-arrow)"/>

  <!-- cold -> tombstone -->
  <text x="634" y="472" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#9b4b52">合规删除</text>
  <line x1="532" y1="480" x2="736" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- active -> tombstone -->
  <text x="648" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#9b4b52">用户删除</text>
  <path d="M530 190 L640 190 L640 440 L736 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- candidate note -->
  <text x="60" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">30 天未晋升 → tombstone</text>

  <!-- footer -->
  <text x="40" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">实线：自动流转</text>
  <line x1="150" y1="587" x2="190" y2="587" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="205" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">虚线：需要确认或显式恢复</text>
  <line x1="370" y1="587" x2="410" y2="587" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="920" y="590" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">superseded 只读，保留链，不参与默认召回</text>
</svg>
