<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f03-d3-title f03-d3-desc">
  <title id="f03-d3-title">四种处置的判断树</title>
  <desc id="f03-d3-desc">从根节点问「后面还会被引用吗」，是则再问是否需要原文精确值，否则问是否还有查证价值，得到保留、压缩、剪枝、丢弃四种处置。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <defs>
    <marker id="f03-d3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DISPOSAL DECISION TREE</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#2d3142">两个问题，四种处置</text>
  <text x="40" y="82" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">判断只针对内容，不针对整轮对话。</text>
  <rect x="330" y="110" width="300" height="56" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="480" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" text-anchor="middle">后面的步骤还会引用它吗？</text>
  <rect x="90" y="230" width="300" height="56" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="240" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" text-anchor="middle">需要原文的精确值吗？</text>
  <rect x="570" y="230" width="300" height="56" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="720" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" text-anchor="middle">留下还有查证价值吗？</text>
  <path d="M480,166 L480,190 L240,190 L240,224" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="356" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">是</text>
  <path d="M480,166 L480,190 L720,190 L720,224" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="604" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">否</text>
  <path d="M240,286 L240,320 L140,320 L140,364" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="176" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">是</text>
  <path d="M240,286 L240,320 L340,320 L340,364" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="318" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">否</text>
  <path d="M720,286 L720,320 L620,320 L620,364" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="656" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">是</text>
  <path d="M720,286 L720,320 L820,320 L820,364" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f03-d3-ar)"/>
  <text x="796" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6" text-anchor="middle">否</text>
  <rect x="55" y="370" width="170" height="56" rx="6" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="140" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2f6f5e" text-anchor="middle" font-weight="600">保留不动</text>
  <text x="140" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">m09 · m36 · m37</text>
  <rect x="255" y="370" width="170" height="56" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
  <text x="340" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5b4b8a" text-anchor="middle" font-weight="600">压缩</text>
  <text x="340" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">m02 到 m28</text>
  <rect x="535" y="370" width="170" height="56" rx="6" fill="#e9eff6" stroke="#3d5a80" stroke-width="1"/>
  <text x="620" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#3d5a80" text-anchor="middle" font-weight="600">剪枝</text>
  <text x="620" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">日志 · 测试输出</text>
  <rect x="735" y="370" width="170" height="56" rx="6" fill="#f0f0f0" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="820" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#8a93a6" text-anchor="middle" font-weight="600">丢弃</text>
  <text x="820" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">通过的测试输出</text>
  <rect x="40" y="452" width="880" height="44" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="479" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">用户消息、约束、当前任务不参与判断：一律保留。它们通常不到总量 2%，压了省不下空间。</text>
</svg>
