<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-d2-title f02-d2-desc">
  <title id="f02-d2-title">同一段会话的三种状态：剪枝留壳，压缩换节点</title>
  <desc id="f02-d2-desc">三栏并排。原始 38 条 52,000 token；剪枝后条数不变，工具结果只剩首尾三行；压缩后区间换成一条 700 token、带四个固定字段的摘要，尾部原样保留。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <defs>
    <marker id="f02-d2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SAME TRANSCRIPT / THREE STATES</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#2d3142">剪枝留壳，压缩换节点</text>
  <text x="40" y="82" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">同一段 38 条会话，左中右分别是原始、剪枝后、压缩后。</text>
  <rect x="40" y="104" width="288" height="416" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="54" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">原始</text>
  <text x="314" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#8a93a6" text-anchor="end">38 条 · 52,000</text>
  <rect x="336" y="104" width="288" height="416" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="350" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">剪枝后</text>
  <text x="610" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#8a93a6" text-anchor="end">38 条 · 23,600</text>
  <rect x="632" y="104" width="288" height="416" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="646" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">压缩后</text>
  <text x="906" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#8a93a6" text-anchor="end">12 条 · 15,700</text>
  <rect x="52" y="158" width="264" height="34" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1"/>
  <text x="62" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">system/message · 3,000</text>
  <rect x="52" y="198" width="264" height="34" rx="4" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="62" y="219" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m01 用户 · 登录 500</text>
  <rect x="52" y="238" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="62" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m03 工具 · 200 行日志 9,400</text>
  <rect x="52" y="278" width="264" height="34" rx="4" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="62" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m09 用户 · 别动 schema</text>
  <rect x="52" y="318" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="62" y="339" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m07 工具 · 312 行源码 6,800</text>
  <rect x="52" y="358" width="264" height="34" rx="4" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
  <text x="62" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m08 助手 · 根因先查后插</text>
  <rect x="52" y="398" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="62" y="419" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m11 工具 · go test 失败</text>
  <rect x="52" y="438" width="264" height="34" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="62" y="459" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">其余 31 条 …</text>
  <rect x="348" y="158" width="264" height="34" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1"/>
  <text x="358" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">system/message · 3,000</text>
  <rect x="348" y="198" width="264" height="34" rx="4" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="358" y="219" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m01 用户 · 登录 500</text>
  <rect x="348" y="238" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="358" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m03 工具 · 首 3 行 + 末 3 行 · 420</text>
  <rect x="348" y="278" width="264" height="34" rx="4" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="358" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m09 用户 · 别动 schema</text>
  <rect x="348" y="318" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="358" y="339" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m07 工具 · 首尾各 3 行 · 380</text>
  <rect x="348" y="358" width="264" height="34" rx="4" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
  <text x="358" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m08 助手 · 根因先查后插</text>
  <rect x="348" y="398" width="264" height="34" rx="4" fill="#f7efe4" stroke="#bf4520" stroke-width="1"/>
  <text x="358" y="419" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m11 工具 · 失败输出 3 行 · 300</text>
  <rect x="348" y="438" width="264" height="34" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="358" y="459" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">其余 31 条，内容已剪</text>
  <rect x="644" y="158" width="264" height="34" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1"/>
  <text x="654" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">system/message · 3,000</text>
  <rect x="644" y="198" width="264" height="96" rx="4" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
  <text x="654" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5b4b8a" font-weight="600">摘要 · 700 token</text>
  <text x="654" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">目标 登录 500，先查后插不原子</text>
  <text x="654" y="249" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">约束 别动数据库 schema</text>
  <text x="654" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">否掉 唯一索引 / 纯重试</text>
  <text x="654" y="279" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">报错 duplicate key on login_attempts</text>
  <rect x="644" y="306" width="264" height="34" rx="4" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1"/>
  <text x="654" y="327" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m36 用户 · 提交吧</text>
  <rect x="644" y="346" width="264" height="34" rx="4" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
  <text x="654" y="367" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">m37 助手 · 已提交 3f2a1c</text>
  <rect x="644" y="386" width="264" height="34" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="654" y="407" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">尾部 m29 到 m37 · 9 条原样</text>
  <text x="654" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">请求里只剩摘要和尾部</text>
  <text x="654" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">1 次模型调用 · 输入 8,600</text>
  <text x="40" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">15 条工具结果 · 39,000 token</text>
  <text x="336" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">0 次模型调用 · 可逐条回查</text>
  <text x="632" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">27 条换 1 条 · 摘要不可逐字回查</text>
</svg>
