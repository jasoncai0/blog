<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">流式事件的归一</title>
  <desc id="d3-desc">三家 provider 的 SSE 事件各走各的适配器，被折叠成同一组 LLMEvent：文本增量、推理增量、工具调用增量、用量与结束原因。</desc>

  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">STREAM NORMALIZATION</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">三家的事件流，一个出口</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">上层只认 LLMEvent；每家的差异都被压在适配器里</text>

  <rect x="60" y="120" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="74" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">anthropic-messages</text>
  <text x="74" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">content_block_delta / message_delta</text>

  <rect x="60" y="220" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="74" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">openai-responses</text>
  <text x="74" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">response.output_text.delta / …</text>

  <rect x="60" y="320" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="74" y="344" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">gemini</text>
  <text x="74" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">candidates[].content.parts[]</text>

  <rect x="360" y="170" width="220" height="164" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="374" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">协议适配器</text>
  <text x="374" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">逐事件折叠：</text>
  <text x="374" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">· tool-call 按 index 归并、参数增量拼接</text>
  <text x="374" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">· reasoning 单独成通道</text>
  <text x="374" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">· usage 只在末尾出现，允许缺失</text>
  <text x="374" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">· finish reason 归一成固定枚举</text>
  <text x="374" y="312" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">stateless：适配器不持有跨请求状态</text>

  <rect x="660" y="130" width="240" height="244" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="674" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="500" fill="#2d3142">LLMEvent</text>
  <text x="674" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">text-delta</text>
  <text x="674" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">reasoning-delta</text>
  <text x="674" y="224" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">tool-input-start / delta / end</text>
  <text x="674" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">tool-call（完整参数）</text>
  <text x="674" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">usage（可缺失）</text>
  <text x="674" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">finish（reason 已归一）</text>
  <text x="674" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">error（映射为 AIError）</text>
  <text x="674" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">上层只 switch 这些分支</text>

  <line x1="280" y1="152" x2="356" y2="210" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="280" y1="252" x2="356" y2="252" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="280" y1="352" x2="356" y2="294" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="580" y1="252" x2="656" y2="252" stroke="#bf4520" stroke-width="1.2" marker-end="url(#d3-arrow-accent)"/>

  <text x="60" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">归一的价值不在"统一格式"，而在把差异关进一个小盒子：上层只处理 tool-call 与 text，不用知道 Anthropic 用 content block、Gemini 用 parts。</text>
  <text x="60" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">代价是适配器要吃掉所有怪异流：缺 usage、重复 delta、工具参数分片、提前断流——每一条都对应一个失败模式。</text>
</svg>
