<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">一次模型请求的装配线</title>
  <desc id="d1-desc">从选 agent 与模型开始，依次读指令源、物化工具快照、载入历史并 lowering、组装 baseRequest、跑 hook 与媒体裁剪，最后变成 PreparedRequest 交给协议层。</desc>

  <defs>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">REQUEST ASSEMBLY</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一份请求要经过七道装配</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">越靠前的越共享、越稳定；顺序不是随意的，它决定了缓存前缀从哪一段开始失效</text>

  <!-- stages -->
  <rect x="280" y="112" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">① 选 agent 与模型</text>
  <text x="294" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">session.model → agent.model → config → resolver</text>

  <rect x="280" y="192" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">② 读指令源（每步一次，并发）</text>
  <text x="294" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">global → 近→远 AGENTS.md → config.instructions</text>

  <rect x="280" y="272" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">③ 物化工具快照</text>
  <text x="294" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">按权限过滤 → 原生 / CodeMode 两桶 → definitions</text>

  <rect x="280" y="352" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">④ 载入历史并 lowering</text>
  <text x="294" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">消息 + part → 角色化消息；tool part 展开成 role:tool</text>

  <rect x="280" y="432" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="454" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">⑤ 组装 baseRequest</text>
  <text x="294" y="472" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">system + tools + messages + toolChoice</text>

  <rect x="280" y="512" width="360" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="294" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">⑥ hook + 媒体裁剪 + 头部</text>
  <text x="294" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">context / model.request hook，图片预算，affinity</text>

  <rect x="280" y="592" width="360" height="58" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="294" y="614" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">⑦ PreparedRequest → Route</text>
  <text x="294" y="632" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">交给协议层翻译成该家的 wire 格式</text>

  <!-- arrows -->
  <line x1="460" y1="170" x2="460" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="250" x2="460" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="330" x2="460" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="410" x2="460" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="490" x2="460" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="460" y1="570" x2="460" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- side notes -->
  <text x="664" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">决定 capabilities 与价格</text>
  <text x="664" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">决定 system 段的前半</text>
  <text x="664" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">决定 tools 段与 token 开销</text>
  <text x="664" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">决定 messages 段</text>
  <text x="664" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">顺序即缓存前缀的顺序</text>
  <text x="664" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">插件可改 schema、baseURL</text>
  <text x="664" y="620" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">此处之后不再读数据库</text>

  <!-- left annotations -->
  <text x="48" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">01</text>
  <text x="48" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">02</text>
  <text x="48" y="300" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">03</text>
  <text x="48" y="380" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">04</text>
  <text x="48" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">05</text>
  <text x="48" y="540" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">06</text>
  <text x="48" y="620" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">07</text>

  <text x="48" y="696" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">每一步都可能改变请求前缀；稳定性从高到低：system → tools → 历史。压缩之所以能复用缓存，就是因为它只动"历史"这一段。</text>
</svg>
