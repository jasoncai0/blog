<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="f04-rf-title f04-rf-desc">
  <title id="f04-rf-title">resume 时的 turn 修复流程</title>
  <desc id="f04-rf-desc">从拿到写句柄、冷读日志开始，扫描 openTurn、openStep 和未答复的 tool call。按需补 tool/result、step/end、turn/end(interrupted)，作为一个 batch 追加，再用补写后的日志建 seed。右侧是无需补写的分支，底部是 forked 与幂等说明。</desc>
  <defs>
    <marker id="f04-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/>
    </marker>
    <marker id="f04-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
    <marker id="f04-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">RESUME REPAIR</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">恢复不是重放：按磁盘实际状态补最少的事件</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">扫描一遍日志，缺什么补什么；补写本身也走普通 append，带 seq 和时间。</text>

  <!-- start -->
  <rect x="300" y="92" width="360" height="42" rx="21" fill="#3d5a80"/>
  <text x="480" y="117" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#ffffff">resume：先拿写句柄，再冷读物理日志</text>
  <line x1="480" y1="134" x2="480" y2="148" stroke="#3d5a80" marker-end="url(#f04-a)"/>

  <!-- scan -->
  <rect x="300" y="150" width="360" height="48" rx="5" fill="#ffffff" stroke="#3d5a80"/>
  <text x="480" y="169" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" fill="#2d3142">顺序扫描整条日志</text>
  <text x="480" y="186" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">openTurn · openStep · 未答复 tool call</text>
  <line x1="480" y1="198" x2="480" y2="213" stroke="#3d5a80" marker-end="url(#f04-a)"/>

  <!-- D1 -->
  <path d="M480,215 L610,255 L480,295 L350,255 Z" fill="#fff7f3" stroke="#bf4520" stroke-width="1.2"/>
  <text x="480" y="259" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">turn 还开着？</text>
  <line x1="610" y1="255" x2="714" y2="255" stroke="#bf4520" marker-end="url(#f04-r)"/>
  <text x="646" y="248" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">no</text>
  <rect x="720" y="232" width="200" height="46" rx="5" fill="#ffffff" stroke="#4f5d75"/>
  <text x="820" y="251" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">返回 []，不补写</text>
  <text x="820" y="266" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">日志本来就是平衡的</text>
  <line x1="480" y1="295" x2="480" y2="323" stroke="#3d5a80" marker-end="url(#f04-a)"/>
  <text x="490" y="313" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#3d5a80">yes</text>

  <!-- D2 -->
  <path d="M480,325 L630,365 L480,405 L330,365 Z" fill="#fff7f3" stroke="#bf4520" stroke-width="1.2"/>
  <text x="480" y="369" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">有未答复的 tool call？</text>
  <line x1="630" y1="365" x2="694" y2="365" stroke="#bf4520" marker-end="url(#f04-r)"/>
  <text x="650" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">yes</text>
  <rect x="700" y="333" width="220" height="64" rx="5" fill="#ffffff" stroke="#5b4b8a"/>
  <text x="810" y="353" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" fill="#5b4b8a">补 tool/result（isError: true）</text>
  <text x="810" y="369" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">OUTCOME_UNKNOWN / NOT_STARTED</text>
  <text x="810" y="385" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">文案进入下一轮模型上下文</text>
  <path d="M810,397 L810,423 L480,423" fill="none" stroke="#5b4b8a" stroke-dasharray="3 3"/>
  <circle cx="480" cy="423" r="2.6" fill="#5b4b8a"/>
  <line x1="480" y1="405" x2="480" y2="433" stroke="#3d5a80" marker-end="url(#f04-a)"/>
  <text x="468" y="419" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#3d5a80">no</text>

  <!-- D3 -->
  <path d="M480,435 L600,475 L480,515 L360,475 Z" fill="#fff7f3" stroke="#bf4520" stroke-width="1.2"/>
  <text x="480" y="479" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">step 还开着？</text>
  <line x1="600" y1="475" x2="734" y2="475" stroke="#bf4520" marker-end="url(#f04-r)"/>
  <text x="650" y="468" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">yes</text>
  <rect x="740" y="452" width="180" height="46" rx="5" fill="#ffffff" stroke="#5b4b8a"/>
  <text x="830" y="479" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" fill="#5b4b8a">补 step/end</text>
  <path d="M830,498 L830,527 L480,527" fill="none" stroke="#5b4b8a" stroke-dasharray="3 3"/>
  <circle cx="480" cy="527" r="2.6" fill="#5b4b8a"/>
  <line x1="480" y1="515" x2="480" y2="533" stroke="#3d5a80" marker-end="url(#f04-a)"/>
  <text x="468" y="523" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#3d5a80">no</text>

  <!-- turn end -->
  <rect x="300" y="535" width="360" height="46" rx="5" fill="#5b4b8a"/>
  <text x="480" y="555" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#ffffff">补 turn/end</text>
  <text x="480" y="571" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#d9d2ea">reason: { kind: "interrupted" }</text>
  <line x1="480" y1="581" x2="480" y2="595" stroke="#3d5a80" marker-end="url(#f04-a)"/>

  <!-- append -->
  <rect x="300" y="597" width="360" height="46" rx="5" fill="#2f6f5e"/>
  <text x="480" y="617" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#ffffff">作为一个 batch append</text>
  <text x="480" y="633" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#cfe3dc">seq 接续最后一条 · time 复用最后事件</text>
  <line x1="480" y1="643" x2="480" y2="657" stroke="#3d5a80" marker-end="url(#f04-a)"/>

  <!-- seed -->
  <rect x="280" y="659" width="400" height="36" rx="5" fill="#2d3142"/>
  <text x="480" y="682" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#ffffff">seed = [...persisted, ...closers]</text>

  <!-- side notes -->
  <text x="40" y="540" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing=".08em" fill="#5b4b8a">FORKED CAUSE</text>
  <text x="40" y="558" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">同一棵树，reason 和文案</text>
  <text x="40" y="574" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">换成 forked；父会话可能已做完。</text>

  <text x="732" y="540" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing=".08em" fill="#2f6f5e">READ-ONLY</text>
  <text x="732" y="558" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">同一套 closers，只在内存补；</text>
  <text x="732" y="574" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">文件不写，等真正 resume 才修。</text>

  <text x="40" y="640" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#9b4b52">再崩一次：torn tail 截断，下次重新扫描；</text>
  <text x="40" y="656" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#9b4b52">已经补过的事件不会重复补。</text>
</svg>
