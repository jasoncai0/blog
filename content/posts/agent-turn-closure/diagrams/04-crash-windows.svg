<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f03-cw-title f03-cw-desc">
  <title id="f03-cw-title">三个崩溃切断点与恢复补写</title>
  <desc id="f03-cw-desc">事件时间线上标出三个切断点：A 在工具执行中，磁盘尾巴是 tool/call；B 在 tool/result 之后、step/end 之前，尾巴是 tool/result；C 在 step/end 之后，尾巴是 step/end。恢复分别补 3 条、2 条、1 条事件。</desc>
  <defs>
    <marker id="f03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">CRASH WINDOWS</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">切得越晚，要补的越少；磁盘上看到的都是「缺结尾」</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三个代表性切断点：工具执行中、结果已记但 step 未关、step 已关但 turn 未关。</text>

  <!-- timeline -->
  <line x1="70" y1="160" x2="900" y2="160" stroke="#2d3142" stroke-width="1.2" marker-end="url(#f03-a)"/>
  <text x="70" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">turn/start</text>
  <line x1="100" y1="150" x2="100" y2="170" stroke="#2d3142"/>
  <text x="180" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">step/start</text>
  <line x1="200" y1="150" x2="200" y2="170" stroke="#2d3142"/>
  <text x="278" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">tool/call</text>
  <line x1="300" y1="150" x2="300" y2="170" stroke="#2d3142"/>
  <text x="352" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#2f6f5e">flush</text>
  <line x1="372" y1="150" x2="372" y2="170" stroke="#2f6f5e" stroke-width="1.4"/>

  <!-- tool execution bracket -->
  <path d="M450,140 L450,132 L620,132 L620,140" fill="none" stroke="#5b4b8a" stroke-width="1"/>
  <text x="535" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5b4b8a">tool 执行（最贵的副作用）</text>

  <text x="626" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">tool/result</text>
  <line x1="650" y1="150" x2="650" y2="170" stroke="#2d3142"/>
  <text x="710" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">step/end</text>
  <line x1="730" y1="150" x2="730" y2="170" stroke="#2d3142"/>
  <text x="786" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#3d5a80" font-weight="600">turn/end</text>
  <line x1="810" y1="146" x2="810" y2="174" stroke="#3d5a80" stroke-width="1.6"/>
  <text x="852" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#9b4b52">next fsync</text>
  <line x1="880" y1="150" x2="880" y2="170" stroke="#9b4b52"/>

  <!-- cut markers -->
  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="700">
    <circle cx="530" cy="108" r="9" fill="#9b4b52"/><text x="530" y="111" text-anchor="middle" fill="#ffffff">A</text>
    <line x1="530" y1="117" x2="530" y2="150" stroke="#9b4b52" stroke-dasharray="3 3"/>
    <circle cx="690" cy="108" r="9" fill="#9b4b52"/><text x="690" y="111" text-anchor="middle" fill="#ffffff">B</text>
    <line x1="690" y1="117" x2="690" y2="150" stroke="#9b4b52" stroke-dasharray="3 3"/>
    <circle cx="840" cy="108" r="9" fill="#9b4b52"/><text x="840" y="111" text-anchor="middle" fill="#ffffff">C</text>
    <line x1="840" y1="117" x2="840" y2="150" stroke="#9b4b52" stroke-dasharray="3 3"/>
  </g>

  <!-- card A -->
  <rect x="40" y="220" width="880" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="40" y="220" width="4" height="100" rx="2" fill="#9b4b52"/>
  <circle cx="76" cy="248" r="11" fill="#9b4b52"/>
  <text x="76" y="252" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#ffffff">A</text>
  <text x="98" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">切在工具执行中</text>
  <text x="98" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#9b4b52">工具可能已经产生副作用，日志只知道它开始了</text>
  <text x="98" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2f6f5e">disk: … tool/call</text>
  <text x="98" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#5b4b8a">repair: tool/result(OUTCOME_UNKNOWN) → step/end → turn/end</text>
  <rect x="812" y="240" width="88" height="22" rx="4" fill="#f6eced"/>
  <text x="856" y="255" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#9b4b52">补 3 条</text>

  <!-- card B -->
  <rect x="40" y="336" width="880" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="40" y="336" width="4" height="100" rx="2" fill="#9b4b52"/>
  <circle cx="76" cy="364" r="11" fill="#9b4b52"/>
  <text x="76" y="368" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#ffffff">B</text>
  <text x="98" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">切在 tool/result 之后、step/end 之前</text>
  <text x="98" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#9b4b52">结果已经拿到，模型还没看到；step 还开着</text>
  <text x="98" y="400" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2f6f5e">disk: … tool/result</text>
  <text x="98" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#5b4b8a">repair: step/end → turn/end(interrupted)</text>
  <rect x="812" y="356" width="88" height="22" rx="4" fill="#f6eced"/>
  <text x="856" y="371" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#9b4b52">补 2 条</text>

  <!-- card C -->
  <rect x="40" y="452" width="880" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="40" y="452" width="4" height="100" rx="2" fill="#9b4b52"/>
  <circle cx="76" cy="480" r="11" fill="#9b4b52"/>
  <text x="76" y="484" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#ffffff">C</text>
  <text x="98" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">切在 step/end 之后、turn/end 落盘之前</text>
  <text x="98" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#9b4b52">内存里可能已经 completed，磁盘只看到 step/end</text>
  <text x="98" y="516" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2f6f5e">disk: … step/end（turn/end 还在 200ms 缓冲）</text>
  <text x="98" y="534" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#5b4b8a">repair: turn/end(interrupted)，原因只能推断</text>
  <rect x="812" y="472" width="88" height="22" rx="4" fill="#f6eced"/>
  <text x="856" y="487" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#9b4b52">补 1 条</text>

  <!-- bottom note -->
  <rect x="40" y="580" width="880" height="40" rx="5" fill="#2d3142"/>
  <text x="60" y="598" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#ffffff">切断点越靠后，合成事件越少，但「这一轮到底跑完没有」越难从磁盘证明。</text>
  <text x="60" y="612" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#9aa3b5">恢复统一写 interrupted：闭合是确定的，结束原因是推断的。</text>
</svg>
