<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">十篇，四簇</title>
<desc id="f01-desc">前三簇是机制，最后一簇是读法；簇内按依赖排序。</desc>
<rect width="960" height="510" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON FOUR / MAP</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">四簇，十篇</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">编号是顺序，不是阅读顺序。</text>
<rect x="40" y="96" width="280" height="100" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="52" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">一 · 数据怎么流</text><text x="52" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">1 消息：投递与唤醒</text><text x="52" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">2 格式：代际与回放</text><rect x="340" y="96" width="280" height="130" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="352" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">二 · 失败与顺序</text><text x="352" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">3 错误：码与可见性</text><text x="352" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">4 测试：组合与断言</text><text x="352" y="161" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">5 并发：串行点与竞态</text><rect x="640" y="96" width="280" height="160" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="652" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">三 · 边界与接入</text><text x="652" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">6 实验面</text><text x="652" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">7 SDK 与网关</text><text x="652" y="161" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">8 preset</text><text x="652" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">9 流式渲染</text><rect x="40" y="236" width="280" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">四 · 元</text><text x="52" y="271" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">10 怎么读这份代码</text><rect x="340" y="272" width="580" height="140" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="356" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">簇之间的关系</text><text x="356" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">数据怎么流决定错误长什么样：投递失败、格式不兼容、回放校验失败都在这一簇。</text><text x="356" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">失败与顺序共用同一批事件：错误码要能定位到 step，顺序保证靠 claim 与 commitReady。</text><text x="356" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">边界与接入建立在前两簇之上：SDK 换一个驱动者，实验面多几个工具。</text><text x="40" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">每篇独立可读；簇内顺序只为了少回头查概念。</text><text x="40" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">十篇都只描述 0.2.2-rc.1 的行为，版本升级后行号会漂。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / MAP</text>
</svg>
