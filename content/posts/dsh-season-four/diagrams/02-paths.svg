<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">三条路径</title>
<desc id="f02-desc">排障、做插件、做嵌入，起点不同，收口也不同。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON FOUR / PATHS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">同一季，三种读法</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">不必按编号读；先选与当前问题最近的路径。</text>
<text x="40" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">排障</text><text x="40" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">线上行为不对，想知道去哪看</text><rect x="300" y="120" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="143" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">3 错误地图</text><line x1="434" y1="140" x2="448" y2="140" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="460" y="120" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="472" y="143" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">5 并发</text><line x1="594" y1="140" x2="608" y2="140" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="620" y="120" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="143" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">2 格式</text><line x1="754" y1="140" x2="768" y2="140" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="780" y="120" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="792" y="143" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">1 消息</text><text x="40" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">做插件</text><text x="40" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">想加工具、加 agent 能力</text><rect x="300" y="230" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="253" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">6 实验面</text><line x1="434" y1="250" x2="448" y2="250" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="460" y="230" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="472" y="253" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">8 preset</text><line x1="594" y1="250" x2="608" y2="250" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="620" y="230" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="253" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">1 消息</text><line x1="754" y1="250" x2="768" y2="250" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="780" y="230" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="792" y="253" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">4 测试</text><text x="40" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">做嵌入</text><text x="40" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">把 DSH 接进自己的产品</text><rect x="300" y="340" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="363" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">7 SDK</text><line x1="434" y1="360" x2="448" y2="360" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="460" y="340" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="472" y="363" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">2 格式</text><line x1="594" y1="360" x2="608" y2="360" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="620" y="340" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="363" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">9 流式</text><line x1="754" y1="360" x2="768" y2="360" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="780" y="340" width="130" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="792" y="363" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">5 并发</text><line x1="40" y1="452" x2="920" y2="452" stroke="#d8d8d8"/><text x="40" y="474" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">三条路径的最后一块都是「回去看数据」：错误要看事件，插件要看消息，嵌入要看格式。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / PATHS</text>
</svg>
