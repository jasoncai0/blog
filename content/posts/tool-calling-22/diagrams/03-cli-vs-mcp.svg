<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="tc dc" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="tc">入口和协议是两件事，可以叠着选</title><desc id="dc">横轴看有几个宿主要接，纵轴看流程有多长；两者都不决定部署位置</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ENTRY POINT · ACCESS PROTOCOL</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">入口和协议是两件事，可以叠着选</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">横轴看有几个宿主要接，纵轴看流程有多长；两者都不决定部署位置</text>
<text x="140" y="152"  font-size="8.6" font-weight="400" text-anchor="start" fill="#8a93a6">流程短 · 单步命令</text><text x="140" y="384"  font-size="8.6" font-weight="400" text-anchor="start" fill="#8a93a6">流程长 · 有状态多步</text><text x="340" y="132"  font-size="8.8" font-weight="500" text-anchor="middle" fill="#6b7280">宿主只有一个（自己用）</text><text x="720" y="132"  font-size="8.8" font-weight="500" text-anchor="middle" fill="#6b7280">多个宿主或团队要接</text><rect x="140" y="168" width="360" height="176" rx="4" fill="#e9eff6" stroke="#3d5a80"/><rect x="140" y="180" width="3.5" height="152" rx="1.75" fill="#3d5a80"/><text x="164" y="206"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">直接写函数</text><text x="164" y="232"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">一个 Agent 内部用、逻辑稳定、没有第二个调用方。</text><text x="164" y="248"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">省掉进程和协议，改起来最快。</text><text x="164" y="280"  font-size="7.6" font-weight="500" text-anchor="start" fill="#3d5a80">第 19 篇：不是所有工具都值得封装</text><rect x="560" y="168" width="360" height="176" rx="4" fill="#e9f2ed" stroke="#2f6f5e"/><rect x="560" y="180" width="3.5" height="152" rx="1.75" fill="#2f6f5e"/><text x="584" y="206"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">MCP Server 薄封装</text><text x="584" y="232"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">能力要被别的宿主复用，工具本身不复杂。</text><text x="584" y="248"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">协议在外，执行在内。</text><text x="584" y="280"  font-size="7.6" font-weight="500" text-anchor="start" fill="#2f6f5e">第 20 篇：复用收益大于封装成本</text><rect x="140" y="400" width="360" height="176" rx="4" fill="#efeaf6" stroke="#5b4b8a"/><rect x="140" y="412" width="3.5" height="152" rx="1.75" fill="#5b4b8a"/><text x="164" y="438"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">CLI 独立入口</text><text x="164" y="464"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">自己用，但流程长、要单独调试和重放。</text><text x="164" y="480"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">拆出进程，Agent 与脚本共用一套。</text><text x="164" y="512"  font-size="7.6" font-weight="500" text-anchor="start" fill="#5b4b8a">第 19 篇：退出码、结果、产物三件事</text><rect x="560" y="400" width="360" height="176" rx="4" fill="#f2ece2" stroke="#a8752a"/><rect x="560" y="412" width="3.5" height="152" rx="1.75" fill="#a8752a"/><text x="584" y="438"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">MCP 包装已有 CLI</text><text x="584" y="464"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">多宿主复用，流程又长。外面标准协议，</text><text x="584" y="480"  font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">里面还是那条命令行，业务逻辑不重写。</text><text x="584" y="512"  font-size="7.6" font-weight="500" text-anchor="start" fill="#a8752a">第 20 篇：保留现有能力</text><line x1="520" y1="120" x2="520" y2="576" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/><rect x="46" y="592" width="868" height="56" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="610"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">部署位置与协议无关</text><text x="62" y="626"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">MCP 能用 stdio 连本地进程，也能用 Streamable HTTP 走网络；CLI 同样可以请求远程接口。按「本地/远程」选协议是常见错误。</text></svg>