<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="te de" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="te">六类失败，三种处置，别用一套重试兜到底</title><desc id="de">先问能不能安全重放，再问是不是瞬时，最后才谈重试几次</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">FAILURE TAXONOMY</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">六类失败，三种处置，别用一套重试兜到底</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">先问能不能安全重放，再问是不是瞬时，最后才谈重试几次</text>
<rect x="46" y="118" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="118" width="276" height="32" rx="4" fill="#f7efe4"/><rect x="46" y="142" width="276" height="8" fill="#f7efe4"/><text x="62" y="139"  font-size="11.2" font-weight="600" text-anchor="start" fill="#bf4520">格式非法</text><text x="62" y="170"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="62" y="184"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">模型输出的 JSON 不合 schema</text><text x="62" y="214"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="62" y="228"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">Schema 校验拦住，把错因回给模型</text><text x="62" y="242"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">重生成；两次不合法就降级或转人工</text><rect x="62" y="262" width="132" height="17" rx="2" fill="#f7efe4" stroke="#bf4520" stroke-width="0.6"/><text x="72" y="274"  font-size="7.6" font-weight="600" text-anchor="start" fill="#bf4520">不可重试 · 重生成</text><rect x="338" y="118" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="338" y="118" width="276" height="32" rx="4" fill="#f7efe4"/><rect x="338" y="142" width="276" height="8" fill="#f7efe4"/><text x="354" y="139"  font-size="11.2" font-weight="600" text-anchor="start" fill="#bf4520">参数错误</text><text x="354" y="170"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="354" y="184"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">结构合法，但取值越界或缺失</text><text x="354" y="214"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="354" y="228"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">先修参数；不满足业务规则就</text><text x="354" y="242"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">重新规划或问用户，不原样重试</text><rect x="354" y="262" width="132" height="17" rx="2" fill="#f7efe4" stroke="#bf4520" stroke-width="0.6"/><text x="364" y="274"  font-size="7.6" font-weight="600" text-anchor="start" fill="#bf4520">不可重试 · 修正</text><rect x="630" y="118" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="630" y="118" width="276" height="32" rx="4" fill="#f7efe4"/><rect x="630" y="142" width="276" height="8" fill="#f7efe4"/><text x="646" y="139"  font-size="11.2" font-weight="600" text-anchor="start" fill="#bf4520">权限不足</text><text x="646" y="170"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="646" y="184"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">租户、角色或数据范围不允许</text><text x="646" y="214"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="646" y="228"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">不重试。查授权配置与租户隔离，</text><text x="646" y="242"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">或改走有权限的路径</text><rect x="646" y="262" width="132" height="17" rx="2" fill="#f7efe4" stroke="#bf4520" stroke-width="0.6"/><text x="656" y="274"  font-size="7.6" font-weight="600" text-anchor="start" fill="#bf4520">不可重试 · 拒绝</text><rect x="46" y="316" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="316" width="276" height="32" rx="4" fill="#e9f2ed"/><rect x="46" y="340" width="276" height="8" fill="#e9f2ed"/><text x="62" y="337"  font-size="11.2" font-weight="600" text-anchor="start" fill="#2f6f5e">瞬时故障</text><text x="62" y="368"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="62" y="382"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">限流、连接失败、部分 5xx</text><text x="62" y="412"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="62" y="426"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">有界重试 + 退避抖动，尊重</text><text x="62" y="440"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">Retry-After；受总时长预算约束</text><rect x="62" y="460" width="132" height="17" rx="2" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.6"/><text x="72" y="472"  font-size="7.6" font-weight="600" text-anchor="start" fill="#2f6f5e">可重试 · 有界</text><rect x="338" y="316" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="338" y="316" width="276" height="32" rx="4" fill="#f2ece2"/><rect x="338" y="340" width="276" height="8" fill="#f2ece2"/><text x="354" y="337"  font-size="11.2" font-weight="600" text-anchor="start" fill="#a8752a">结果未知</text><text x="354" y="368"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="354" y="382"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">超时发生在请求已发出之后</text><text x="354" y="412"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="354" y="426"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">按幂等键查外部状态，查不清就</text><text x="354" y="440"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">暂停并转人工，宁可慢不要重复</text><rect x="354" y="460" width="132" height="17" rx="2" fill="#f2ece2" stroke="#a8752a" stroke-width="0.6"/><text x="364" y="472"  font-size="7.6" font-weight="600" text-anchor="start" fill="#a8752a">先确认 · 不猜</text><rect x="630" y="316" width="276" height="176" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="630" y="316" width="276" height="32" rx="4" fill="#efeaf6"/><rect x="630" y="340" width="276" height="8" fill="#efeaf6"/><text x="646" y="337"  font-size="11.2" font-weight="600" text-anchor="start" fill="#5b4b8a">业务失败</text><text x="646" y="368"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">典型信号</text><text x="646" y="382"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">接口返回成功，但业务没办成</text><text x="646" y="412"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">处置</text><text x="646" y="426"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">读业务码，走补偿或人工处理，</text><text x="646" y="440"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">不重放请求，避免重复副作用</text><rect x="646" y="460" width="132" height="17" rx="2" fill="#efeaf6" stroke="#5b4b8a" stroke-width="0.6"/><text x="656" y="472"  font-size="7.6" font-weight="600" text-anchor="start" fill="#5b4b8a">不可重试 · 补偿</text><rect x="46" y="536" width="868" height="54" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="554"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">一句话判据</text><text x="62" y="570"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">能安全重放、且是瞬时故障，才可以重试；涉及外部副作用的，先查状态再决定，宁可转人工也不要重复执行。</text></svg>