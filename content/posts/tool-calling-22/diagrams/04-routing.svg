<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="td dd" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="td">工具上百个时，做的是漏斗不是检索</title><desc id="dd">前两步必须是确定性的：权限和状态不该交给模型判断</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TOOL ROUTING · FIVE STEPS</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">工具上百个时，做的是漏斗不是检索</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">前两步必须是确定性的：权限和状态不该交给模型判断</text>
<text x="660" y="110"  font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">这步错了会怎样</text><rect x="46" y="118" width="868" height="74" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="126" width="3.5" height="58" rx="1.75" fill="#3d5a80"/><text x="64" y="142"  font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">1  全量注册表</text><text x="64" y="160"  font-size="8" font-weight="400" text-anchor="start" fill="#6b7280">命名空间、适用场景、权限、风险等级、可用状态</text><rect x="330" y="140" width="300" height="26" rx="2" fill="#e9eff6" stroke="#3d5a80" stroke-width="0.8"/><text x="620" y="157"  font-size="9.4" font-weight="600" text-anchor="end" fill="#3d5a80">200+ 条</text><text x="660" y="158"  font-size="8.2" font-weight="400" text-anchor="start" fill="#7a5a3a">语义写得糊，后面每一步都跟着错</text><line x1="360" y1="192" x2="360" y2="200" stroke="#c3c9d4" stroke-width="1"/><polygon points="360,204 356.6,196 363.4,196" fill="#c3c9d4"/><rect x="46" y="204" width="868" height="74" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="212" width="3.5" height="58" rx="1.75" fill="#2f6f5e"/><text x="64" y="228"  font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">2  硬过滤</text><text x="64" y="246"  font-size="8" font-weight="400" text-anchor="start" fill="#6b7280">租户、角色、环境、开关、授权范围</text><rect x="330" y="226" width="240" height="26" rx="2" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.8"/><text x="560" y="243"  font-size="9.4" font-weight="600" text-anchor="end" fill="#2f6f5e">60 条</text><text x="660" y="244"  font-size="8.2" font-weight="400" text-anchor="start" fill="#7a5a3a">过滤过严，该用的工具被藏起来</text><line x1="360" y1="278" x2="360" y2="286" stroke="#c3c9d4" stroke-width="1"/><polygon points="360,290 356.6,282 363.4,282" fill="#c3c9d4"/><rect x="46" y="290" width="868" height="74" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="298" width="3.5" height="58" rx="1.75" fill="#5b4b8a"/><text x="64" y="314"  font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">3  粗分类</text><text x="64" y="332"  font-size="8" font-weight="400" text-anchor="start" fill="#6b7280">规则或小分类模型，先落到业务域</text><rect x="330" y="312" width="180" height="26" rx="2" fill="#efeaf6" stroke="#5b4b8a" stroke-width="0.8"/><text x="500" y="329"  font-size="9.4" font-weight="600" text-anchor="end" fill="#5b4b8a">24 条</text><text x="660" y="330"  font-size="8.2" font-weight="400" text-anchor="start" fill="#9b4b52">域分错，候选集里根本没有对的那个</text><line x1="360" y1="364" x2="360" y2="372" stroke="#c3c9d4" stroke-width="1"/><polygon points="360,376 356.6,368 363.4,368" fill="#c3c9d4"/><rect x="46" y="376" width="868" height="74" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="384" width="3.5" height="58" rx="1.75" fill="#a8752a"/><text x="64" y="400"  font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">4  候选检索</text><text x="64" y="418"  font-size="8" font-weight="400" text-anchor="start" fill="#6b7280">域内 BM25 + 向量混合，召回十几条</text><rect x="330" y="398" width="130" height="26" rx="2" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><text x="450" y="415"  font-size="9.4" font-weight="600" text-anchor="end" fill="#a8752a">12 条</text><text x="660" y="416"  font-size="8.2" font-weight="400" text-anchor="start" fill="#9b4b52">相似不等于可调用，仍要过权限与状态</text><line x1="360" y1="450" x2="360" y2="458" stroke="#c3c9d4" stroke-width="1"/><polygon points="360,462 356.6,454 363.4,454" fill="#c3c9d4"/><rect x="46" y="462" width="868" height="74" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="470" width="3.5" height="58" rx="1.75" fill="#bf4520"/><text x="64" y="486"  font-size="10.6" font-weight="600" text-anchor="start" fill="#2d3142">5  动态绑定</text><text x="64" y="504"  font-size="8" font-weight="400" text-anchor="start" fill="#6b7280">只把候选工具的完整 Schema 发给模型</text><rect x="330" y="484" width="90" height="26" rx="2" fill="#f7efe4" stroke="#bf4520" stroke-width="0.8"/><text x="410" y="501"  font-size="9.4" font-weight="600" text-anchor="end" fill="#bf4520">6 条</text><text x="660" y="502"  font-size="8.2" font-weight="400" text-anchor="start" fill="#9b4b52">Schema 太长，挤掉正文和工具的预算</text><rect x="46" y="556" width="868" height="56" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="574"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">为什么前两步不能省</text><text x="62" y="590"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">模型看到的候选集就是它的世界。权限和状态没先过滤，它会认真地选一个自己不该碰的工具，而且理由充分。</text></svg>