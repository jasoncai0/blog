<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="ta da" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="ta">四层各管一段，别答成四个竞品</title><desc id="da">越往下越贴近模型的能力边界，越往上越贴近组织与流程</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">FOUR LAYERS · 22 QUESTIONS</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">四层各管一段，别答成四个竞品</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">越往下越贴近模型的能力边界，越往上越贴近组织与流程</text>
<rect x="46" y="118" width="612" height="92" rx="3" fill="#f2ece2" stroke="#d8d8d8"/><rect x="46" y="126" width="3.5" height="76" rx="1.75" fill="#a8752a"/><text x="64" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6" letter-spacing="0.12em">L3</text><text x="100" y="145"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">协作层 · A2A</text><text x="64" y="170"  font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">Agent 之间怎么派任务、回结果、要补充输入</text><text x="64" y="190"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应篇目：第 12 篇</text><text x="642" y="164"  font-size="8.4" font-weight="500" text-anchor="end" fill="#a8752a">← Agent ↔ Agent</text><rect x="46" y="224" width="612" height="92" rx="3" fill="#efeaf6" stroke="#d8d8d8"/><rect x="46" y="232" width="3.5" height="76" rx="1.75" fill="#5b4b8a"/><text x="64" y="250" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6" letter-spacing="0.12em">L2</text><text x="100" y="251"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">方法层 · Skill</text><text x="64" y="276"  font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">拿到工具之后按什么步骤做、做到什么算合格</text><text x="64" y="296"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应篇目：第 9 / 10 / 11 / 22 篇</text><text x="642" y="270"  font-size="8.4" font-weight="500" text-anchor="end" fill="#5b4b8a">← 挂在宿主侧，不占通道</text><rect x="46" y="330" width="612" height="92" rx="3" fill="#e9f2ed" stroke="#d8d8d8"/><rect x="46" y="338" width="3.5" height="76" rx="1.75" fill="#2f6f5e"/><text x="64" y="356" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6" letter-spacing="0.12em">L1</text><text x="100" y="357"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">通道层 · MCP</text><text x="64" y="382"  font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">工具怎么标准化暴露、被发现、被跨宿主复用</text><text x="64" y="402"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应篇目：第 4 / 5 / 6 / 13 篇</text><text x="642" y="376"  font-size="8.4" font-weight="500" text-anchor="end" fill="#2f6f5e">← Host ↔ Server</text><rect x="46" y="436" width="612" height="92" rx="3" fill="#e9eff6" stroke="#d8d8d8"/><rect x="46" y="444" width="3.5" height="76" rx="1.75" fill="#3d5a80"/><text x="64" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6" letter-spacing="0.12em">L0</text><text x="100" y="463"  font-size="12.4" font-weight="600" text-anchor="start" fill="#2d3142">语言层 · Function Calling</text><text x="64" y="488"  font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">模型怎么表达「调哪个、传什么」</text><text x="64" y="508"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应篇目：第 1 / 2 / 3 篇</text><text x="642" y="482"  font-size="8.4" font-weight="500" text-anchor="end" fill="#3d5a80">← 模型 ↔ 宿主</text><text x="700" y="124"  font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">只记一句话：四层是叠着的，不是四选一。</text><text x="700" y="150"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">Function Calling 决定模型能不能开口；</text><text x="700" y="164"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">没有它，上面三层都失去触发方式。</text><text x="700" y="192"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">MCP 把「接一个工具」变成「接一套协议」，</text><text x="700" y="206"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">复用的收益发生在宿主之间。</text><text x="700" y="234"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">Skill 不新增通道，只把工作方法写成</text><text x="700" y="248"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">人能改、模型能按需读的文件。</text><text x="700" y="276"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">A2A 把 Agent 当服务，所以它需要</text><text x="700" y="290"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">任务声明和生命周期。</text><text x="700" y="330"  font-size="8.6" font-weight="600" text-anchor="start" fill="#9b4b52">常见错答：</text><text x="700" y="350"  font-size="8.6" font-weight="400" text-anchor="start" fill="#9b4b52">「MCP 会取代 Function Calling」</text><text x="700" y="368"  font-size="8.6" font-weight="400" text-anchor="start" fill="#9b4b52">「Skill 就是提示词模板」</text><text x="700" y="386"  font-size="8.6" font-weight="400" text-anchor="start" fill="#9b4b52">「A2A 和 MCP 是竞品」</text><rect x="46" y="546" width="868" height="58" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="564"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">一句话记</text><text x="62" y="580"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">FC 是语言，MCP 是通道，Skill 是手册，A2A 是协作。面试时先把层说清，再谈每层的坑。</text></svg>