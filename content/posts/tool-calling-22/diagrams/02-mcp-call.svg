<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="tb db" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="tb">一次 MCP 调用，四方的活儿分得很清楚</title><desc id="db">模型只提出请求，权限由宿主判，执行在 Server，副作用从来不在模型里</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ONE CALL · FOUR PARTIES</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">一次 MCP 调用，四方的活儿分得很清楚</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">模型只提出请求，权限由宿主判，执行在 Server，副作用从来不在模型里</text>
<rect x="88" y="112" width="124" height="46" rx="3" fill="#ffffff" stroke="#d8d8d8"/><text x="150" y="131"  font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">用户</text><text x="150" y="146"  font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6">发起与验收</text><line x1="150" y1="158" x2="150" y2="470" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/><rect x="330" y="112" width="124" height="46" rx="3" fill="#ffffff" stroke="#d8d8d8"/><text x="392" y="131"  font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">模型</text><text x="392" y="146"  font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6">决策，不执行</text><line x1="392" y1="158" x2="392" y2="470" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/><rect x="566" y="112" width="124" height="46" rx="3" fill="#ffffff" stroke="#d8d8d8"/><text x="628" y="131"  font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">Host · Client</text><text x="628" y="146"  font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6">校验、转发、回填</text><line x1="628" y1="158" x2="628" y2="470" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/><rect x="780" y="112" width="124" height="46" rx="3" fill="#ffffff" stroke="#d8d8d8"/><text x="842" y="131"  font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">MCP Server</text><text x="842" y="146"  font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6">真正执行</text><line x1="842" y1="158" x2="842" y2="470" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/><line x1="154" y1="190" x2="383" y2="190" stroke="#3d5a80" stroke-width="1.2"/><polygon points="390,190 382,186.6 382,193.4" fill="#3d5a80"/><text x="271.0" y="182"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">① 提问</text><text x="271.0" y="204"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">用户问题进上下文</text><line x1="396" y1="234" x2="619" y2="234" stroke="#3d5a80" stroke-width="1.2"/><polygon points="626,234 618,230.6 618,237.4" fill="#3d5a80"/><text x="510.0" y="226"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">② tool_call</text><text x="510.0" y="248"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">工具名 + 参数，JSON</text><line x1="632" y1="322" x2="833" y2="322" stroke="#3d5a80" stroke-width="1.2"/><polygon points="840,322 832,318.6 832,325.4" fill="#3d5a80"/><text x="735.0" y="314"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">④ JSON-RPC tools/call</text><text x="735.0" y="336"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">协议转发，带鉴权信息</text><line x1="838" y1="366" x2="637" y2="366" stroke="#3d5a80" stroke-width="1.2"/><polygon points="630,366 638,362.6 638,369.4" fill="#3d5a80"/><text x="735.0" y="358"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">⑤ 结果或错误</text><text x="735.0" y="380"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">统一结构，不抛裸异常</text><line x1="624" y1="410" x2="401" y2="410" stroke="#3d5a80" stroke-width="1.2"/><polygon points="394,410 402,406.6 402,413.4" fill="#3d5a80"/><text x="510.0" y="402"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">⑥ 结果回填</text><text x="510.0" y="424"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">按 call_id 对应</text><line x1="388" y1="454" x2="159" y2="454" stroke="#3d5a80" stroke-width="1.2"/><polygon points="152,454 160,450.6 160,457.4" fill="#3d5a80"/><text x="271.0" y="446"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#3d5a80">⑦ 回答</text><text x="271.0" y="468"  font-size="7.6" font-weight="400" text-anchor="middle" fill="#8a93a6">带引用或说明依据</text><rect x="516" y="256" width="224" height="34" rx="3" fill="#f7efe4" stroke="#bf4520"/><text x="628" y="273"  font-size="8.6" font-weight="600" text-anchor="middle" fill="#bf4520">③ 宿主校验权限与风险</text><text x="628" y="287"  font-size="7.3" font-weight="400" text-anchor="middle" fill="#8a5a44">租户、角色、参数范围、要不要人工确认</text><rect x="46" y="496" width="868" height="58" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="514"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">两处最容易答错</text><text x="62" y="530"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">一，「模型执行了工具」——模型只输出 tool_call，执行在 Server；二，「协议管授权」——MCP 不管授权，权限判断在 Host 和执行侧。</text></svg>