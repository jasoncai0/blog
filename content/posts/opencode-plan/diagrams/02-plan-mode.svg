<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">Plan 模式的进入、离开与对账</title>
  <desc id="d2-desc">切到 plan 注入 enter 提醒，切走注入 leave；压缩或回滚可能把提醒冲掉，所以每个 Step 的 context 钩子都会扫描最后一条提醒并补齐。</desc>

  <defs>
    <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">PLAN MODE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">模式不是开关，是历史里的一条提醒</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">没有"plan 会话"这种类型；只有 agent 字段 + 一条会被压缩冲掉的 system-reminder</text>

  <!-- states -->
  <rect x="110" y="150" width="240" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="230" y="180" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">build（默认）</text>
  <text x="230" y="202" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">可以改文件</text>
  <text x="230" y="222" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">历史里没有 enter 提醒</text>

  <rect x="610" y="150" width="240" height="96" rx="8" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="730" y="180" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">plan</text>
  <text x="730" y="202" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">edit 被 deny（plan 目录除外）</text>
  <text x="730" y="222" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">历史里有 enter 提醒</text>

  <!-- transitions -->
  <path d="M350,178 H460 V140 H700 V146" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <text x="378" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">切到 plan：注入 enter</text>

  <path d="M730,246 V286 H230 V250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <text x="440" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">切走：注入 leave</text>

  <!-- reconciliation -->
  <rect x="60" y="318" width="840" height="104" rx="8" fill="#ffffff" stroke="rgba(79,93,117,0.4)" stroke-width="1"/>
  <text x="76" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">RECONCILIATION · 每个 Step 的 context 钩子</text>
  <text x="76" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">扫描历史里最后一条 enter/leave 提醒（只看单 text part 的 user 消息），与当前 agent 对比：</text>
  <text x="76" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">agent 是 plan 但没有 enter → 补 enter；agent 不是 plan 但最后是 enter → 补 leave。</text>
  <text x="76" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">为什么需要：压缩会把历史换掉、revert 会删消息——提醒属于"可被丢弃的 system 消息"，不补就会丢状态。</text>

  <text x="60" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">提醒插在"最后一条 user 消息之前"，与 agent 切换提醒落点一致；同时以 synthetic 落库，所以刷新、重连后仍能被对账到。</text>
</svg>
