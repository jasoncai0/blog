<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">五个工具族，五种失败</title>
<desc id="f02-desc">31 个 tool-* 包按失败方式归组；每组一篇，讲参数为什么防这个失败。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON THREE / TOOL FAMILIES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">31 个包不是 31 种设计</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">包里还有执行器与测试件，工具本体只占一半。</text>
<rect x="40" y="112" width="168" height="176" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">文件</text><text x="52" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-fs · tool-fs-search</text><text x="52" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-str-replace-editor</text><line x1="52" y1="192" x2="196" y2="192" stroke="#d8d8d8"/><text x="52" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">典型失败</text><text x="52" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">截断与陈旧读取</text><rect x="224" y="112" width="168" height="176" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="236" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">Shell</text><text x="236" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-bash · bash-persistent</text><text x="236" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-pwsh · tool-terminal</text><line x1="236" y1="192" x2="380" y2="192" stroke="#d8d8d8"/><text x="236" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">典型失败</text><text x="236" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">超时与输出爆炸</text><rect x="408" y="112" width="168" height="176" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="420" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">网络</text><text x="420" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-web</text><line x1="420" y1="192" x2="564" y2="192" stroke="#d8d8d8"/><text x="420" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">典型失败</text><text x="420" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">不可达与不可信</text><rect x="592" y="112" width="168" height="176" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="604" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">协作</text><text x="604" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-todo · tool-ask-user</text><text x="604" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-present · tool-skill</text><line x1="604" y1="192" x2="748" y2="192" stroke="#d8d8d8"/><text x="604" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">典型失败</text><text x="604" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">等待与回执丢失</text><rect x="776" y="112" width="168" height="176" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="788" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">执行与编排</text><text x="788" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-executor-ptc · tool-jobs</text><text x="788" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool-workflow · tool-subagent</text><line x1="788" y1="192" x2="932" y2="192" stroke="#d8d8d8"/><text x="788" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">典型失败</text><text x="788" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">副作用与预算</text><rect x="40" y="330" width="880" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.1em" fill="#bf4520">NOT IN THESE FIVE</text><text x="56" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">执行器（native、ptc）、测试件（testkit）、编排入口（jobs、workflow、goal、schedule）、委派（subagent、team）——它们在前两季讲过或属于第 11、12 篇。</text><text x="56" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">五族共 18 个包；剩下 13 个是执行器、测试件、编排与委派入口，分散在前两季与第 11、12 篇。</text><text x="56" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">包名以 tool-catalog 与 packages/ 为准；族是按失败模式分的，不是按目录。</text><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / TOOL FAMILIES</text>
</svg>
