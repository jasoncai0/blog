<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">三块，十三篇</title>
<desc id="f01-desc">工具族讲参数，底座讲部署，横切线讲代价；越往下越少被文档提及。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON THREE / MAP</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">从工具到约束</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">编号是篇号，不是阅读顺序。</text>
