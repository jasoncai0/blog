</text><text x="800.0" y="168" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 05 篇</text><rect x="40" y="220" width="880" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">运行时底座</text><text x="56" y="264" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">06–10</text><rect x="190" y="242" width="130.0" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="200" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">遥测</text><text x="200" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 06 篇</text><rect x="340.0" y="242" width="130.0" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="350.0" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">存储</text><text x="350.0" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 07 篇</text><rect x="490.0" y="242" width="130.0" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="500.0" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">凭据</text><text x="500.0" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 08 篇</text><rect x="640.0" y="242" width="130.0" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="650.0" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">护栏</text><text x="650.0" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 09 篇</text><rect x="790.0" y="242" width="130.0" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="800.0" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">LSP 与 SSH</text><text x="800.0" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 10 篇</text><rect x="40" y="330" width="880" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">横切与实践</text><text x="56" y="374" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">11–12</text><rect x="190" y="352" width="150" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="200" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">成本与安全</text><text x="200" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 11 篇</text><rect x="360" y="352" width="150" height="48" rx="5" fill="#fafafa" stroke="#d8d8d8"/><text x="370" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">写一个插件</text><text x="370" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#5a6580">第 12 篇</text><text x="40" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">前两季回答「谁接进来」，这一季回答「接进来之后谁负责它的失败」。</text><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / MAP</text>
</svg>
