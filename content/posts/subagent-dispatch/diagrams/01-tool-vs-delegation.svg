<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">工具调用与子 Agent 委派的结构差别</title>
<desc id="f1d">左图：工具调用在父会话的同一个循环里执行，参数与结果原文都回填到父上下文。右图：委派另开一个会话，子会话有独立上下文与预算，父上下文只收到 brief 与回执。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="520" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DISPATCH / TOOL CALL VS DELEGATION</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">工具调用留在本循环，委派另起一个循环</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">两种边都能拿到外部结果；差别在结果形态和控制权归谁</text>

<!-- 左：工具调用 -->
<rect x="40" y="108" width="420" height="392" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="108" width="4" height="392" fill="#3d5a80"/>
<text x="64" y="132" font-size="11" font-weight="600" fill="#2d3142">工具调用：同一个循环里的同步调用</text>
<text x="64" y="150" font-size="9.5" fill="#5a6580">结果原文回填，父模型每一步都在场</text>

<rect x="64" y="168" width="372" height="78" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="78" y="188" font-size="10" font-weight="600" fill="#2d3142">父上下文（同一份 transcript）</text>
<text x="78" y="206" font-size="9.5" fill="#4f5d75">system + 历史</text>
<text x="78" y="222" font-size="9.5" fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">tool_call { name, args }</text>
<text x="78" y="238" font-size="9.5" fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">tool_result ← 原文（可能几十 KB）</text>

<rect x="64" y="278" width="150" height="46" fill="#ffffff" stroke="#3d5a80" stroke-width="1.2"/>
<text x="139" y="299" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">模型决策</text>
<text x="139" y="314" text-anchor="middle" font-size="8.5" fill="#5a6580">选工具、写参数</text>
<rect x="272" y="278" width="164" height="46" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="354" y="299" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">工具执行</text>
<text x="354" y="314" text-anchor="middle" font-size="8.5" fill="#5a6580">读文件、发请求、跑命令</text>

<line x1="216" y1="301" x2="268" y2="301" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="242" y="293" text-anchor="middle" font-size="8.5" fill="#5a6580">name + args</text>
<path d="M354 278 V250" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="362" y="266" font-size="8.5" fill="#5a6580">append 原文</text>
<line x1="140" y1="248" x2="140" y2="274" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="148" y="266" font-size="8.5" fill="#5a6580">下一轮重读</text>

<text x="64" y="360" font-size="9.5" fill="#4f5d75">· 父模型看得见参数、原文、异常，能当场改路线</text>
<text x="64" y="378" font-size="9.5" fill="#4f5d75">· 结果永久留在上下文里，读得越多涨得越快</text>
<text x="64" y="396" font-size="9.5" fill="#4f5d75">· 执行期间父循环停在这一步，一次只推进一个动作</text>
<text x="64" y="432" font-size="8.5" fill="#8a93a6">代价：结果越详细，后面每一轮都要为它付 token</text>
<line x1="64" y1="456" x2="436" y2="456" stroke="#e2e6ee"/>
<text x="64" y="480" font-size="9.5" fill="#3d5a80">工具调用扩展的是能力：父仍然掌握每一个下一步。</text>

<!-- 右：子 Agent -->
<rect x="500" y="108" width="420" height="392" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="500" y="108" width="4" height="392" fill="#5b4b8a"/>
<text x="524" y="132" font-size="11" font-weight="600" fill="#2d3142">子 Agent：另起一个循环</text>
<text x="524" y="150" font-size="9.5" fill="#5a6580">只回结论和状态，中间步骤留在子会话</text>

<rect x="524" y="168" width="372" height="58" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="538" y="188" font-size="10" font-weight="600" fill="#2d3142">父上下文（只多两行）</text>
<text x="538" y="208" font-size="9.5" fill="#4f5d75">委派 brief  +  回执（结论 + 状态）</text>

<line x1="700" y1="228" x2="700" y2="260" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="690" y="248" text-anchor="end" font-size="8.5" fill="#5a6580">spawn：新会话，立即返回 id</text>

<rect x="524" y="264" width="372" height="104" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<rect x="524" y="264" width="3" height="104" fill="#5b4b8a"/>
<text x="540" y="286" font-size="10" font-weight="600" fill="#2d3142">子会话：独立上下文、独立预算</text>
<text x="540" y="305" font-size="9.5" fill="#4f5d75">brief + 工具白名单 + 系统提示</text>
<text x="540" y="322" font-size="9.5" fill="#4f5d75">子模型自己决定每一步，父看不到</text>
<text x="540" y="339" font-size="9.5" fill="#4f5d75">工具结果只进子上下文</text>
<text x="540" y="356" font-size="8.5" fill="#8a93a6">自己的 transcript，结束后不合并</text>

<line x1="862" y1="262" x2="862" y2="230" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f1a)"/>
<text x="854" y="248" text-anchor="end" font-size="8.5" fill="#5a6580">settle（异步）</text>

<text x="524" y="392" font-size="9.5" fill="#4f5d75">· 父只能发消息干预，不能替子模型选下一步</text>
<text x="524" y="410" font-size="9.5" fill="#4f5d75">· 子会话失败停在回执里，父决定重试还是自己做</text>
<text x="524" y="428" font-size="9.5" fill="#4f5d75">· spawn 返回后父可以继续派活，不必干等</text>
<text x="524" y="446" font-size="8.5" fill="#8a93a6">回执 = 结论 + 状态 + 用量；过程只有子会话自己知道</text>
<line x1="524" y1="456" x2="896" y2="456" stroke="#e2e6ee"/>
<text x="524" y="480" font-size="9.5" fill="#5b4b8a">委派交出的是决策权：父只拿到结论。</text>
</svg>
