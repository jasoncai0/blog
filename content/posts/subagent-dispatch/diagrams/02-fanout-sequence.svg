<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f2t f2d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f2t">一次并行委派的时序</title>
<desc id="f2d">协调器同时 spawn 三个子会话并立即拿到句柄；三个子会话各自调工具；两个回执带结论，一个带失败；协调器据回执重新决策后汇总。</desc>
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
  <marker id="f2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9b4b52"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DISPATCH / ONE FAN-OUT</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">并行委派：父不等结果，回执到了再决策</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">spawn 只是登记，子会话在自己的循环里跑；三个回执先后到达</text>

<!-- 参与者 -->
<rect x="80" y="118" width="120" height="34" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="140" y="139" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3142">协调器</text>
<rect x="340" y="118" width="120" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="400" y="139" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3142">子会话 A</text>
<rect x="580" y="118" width="120" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="640" y="139" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3142">子会话 B</text>
<rect x="800" y="118" width="120" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="860" y="139" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2d3142">子会话 C</text>

<line x1="140" y1="152" x2="140" y2="545" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="400" y1="152" x2="400" y2="545" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="640" y1="152" x2="640" y2="545" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="860" y1="152" x2="860" y2="545" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4"/>

<!-- 1 spawn -->
<line x1="140" y1="190" x2="336" y2="190" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>
<line x1="140" y1="190" x2="576" y2="190" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>
<line x1="140" y1="190" x2="796" y2="190" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>
<text x="148" y="182" font-size="9" fill="#4f5d75">① spawn ×3：写 brief、建会话、立即返回 id</text>
<text x="148" y="204" font-size="8.5" fill="#8a93a6">父循环不停，继续派下一份</text>

<!-- 2 self work -->
<path d="M400 250 h 34 v 16 h -34" fill="none" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2a)"/>
<text x="442" y="258" font-size="8.5" fill="#5a6580">读 12 个文件</text>
<path d="M640 250 h 34 v 16 h -34" fill="none" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2a)"/>
<text x="682" y="258" font-size="8.5" fill="#5a6580">改 3 处</text>
<path d="M860 250 h 30 v 16 h -30" fill="none" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f2a)"/>
<text x="898" y="252" font-size="8.5" fill="#5a6580">跑测试</text>
<text x="148" y="222" font-size="9" fill="#4f5d75">② 各自循环</text>
<text x="148" y="238" font-size="8.5" fill="#8a93a6">父看不到这三行里的任何一步</text>

<!-- 3 settles -->
<line x1="400" y1="340" x2="144" y2="340" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f2a)"/>
<text x="410" y="336" font-size="8.5" fill="#5a6580">③ settle：结论 + 用量</text>
<line x1="860" y1="376" x2="144" y2="376" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f2a)"/>
<text x="870" y="372" font-size="8.5" fill="#5a6580">③ settle：结论</text>
<line x1="640" y1="430" x2="144" y2="430" stroke="#9b4b52" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f2r)"/>
<text x="650" y="426" font-size="8.5" fill="#9b4b52">④ settle：failed + 错误摘要</text>

<!-- 4 decide -->
<rect x="52" y="470" width="216" height="44" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
<text x="160" y="490" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">⑤ 重新决策</text>
<text x="160" y="505" text-anchor="middle" font-size="8.5" fill="#5a6580">重派 B′，还是自己补</text>
<line x1="140" y1="514" x2="140" y2="546" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>

<rect x="52" y="550" width="216" height="36" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="160" y="573" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">⑥ 汇总 → 最终答复</text>

<line x1="48" y1="606" x2="96" y2="606" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="104" y="609" font-size="8.5" fill="#8a93a6">虚线 = 异步通知，不占用父的下一步</text>
<line x1="300" y1="606" x2="348" y2="606" stroke="#4f5d75" stroke-width="1.3"/>
<text x="356" y="609" font-size="8.5" fill="#8a93a6">实线 = spawn 调用本身</text>
</svg>
