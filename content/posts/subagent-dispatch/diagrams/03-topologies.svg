<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">三种协调拓扑</title>
<desc id="f3d">对等交接把控制权交给下游 agent 后原 agent 退出；中控由 lead 保留答复权并双向收发；代码编排把派发写成程序循环，模型只在节点内决策。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="400" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">TOPOLOGY / WHO KEEPS THE ANSWER</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">三种协调拓扑，差别在最终答复权</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">中控不是多 Agent 的定义，只是其中一种选择</text>

<!-- 面板 1 -->
<rect x="40" y="104" width="280" height="256" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="104" width="4" height="256" fill="#3d5a80"/>
<text x="60" y="128" font-size="10.5" font-weight="600" fill="#2d3142">① 对等交接 handoff</text>
<text x="60" y="145" font-size="8.5" fill="#5a6580">控制权整体转移，原 agent 退出</text>

<rect x="60" y="168" width="96" height="40" fill="#ffffff" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="108" y="185" text-anchor="middle" font-size="9.5" fill="#5a6580">受理 Agent</text>
<text x="108" y="199" text-anchor="middle" font-size="8" fill="#8a93a6">交完退出</text>

<rect x="200" y="168" width="96" height="40" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="248" y="185" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">退款 Agent</text>
<text x="248" y="199" text-anchor="middle" font-size="8" fill="#5a6580">接着对话</text>

<line x1="160" y1="188" x2="196" y2="188" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="60" y="230" font-size="8.5" fill="#8a93a6">handoff：历史、工具、答复权一起交出去</text>
<text x="60" y="252" font-size="8.5" fill="#4f5d75">· 适合按业务分流：售前 / 退款 / 技术支持</text>
<text x="60" y="270" font-size="8.5" fill="#4f5d75">· 没有汇总者，A 也不再参与后续</text>
<text x="60" y="288" font-size="8.5" fill="#4f5d75">· 风险：交错了没人兜底</text>

<!-- 面板 2 -->
<rect x="340" y="104" width="280" height="256" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="340" y="104" width="4" height="256" fill="#5b4b8a"/>
<text x="360" y="128" font-size="10.5" font-weight="600" fill="#2d3142">② 中控 supervisor</text>
<text x="360" y="145" font-size="8.5" fill="#5a6580">父保留答复权，子当有界能力</text>

<rect x="410" y="160" width="140" height="40" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="480" y="178" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">Lead / 协调器</text>
<text x="480" y="192" text-anchor="middle" font-size="8" fill="#5a6580">持有目标、预算、账本</text>

<rect x="352" y="262" width="80" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="392" y="283" text-anchor="middle" font-size="9" fill="#2d3142">子 A</text>
<rect x="440" y="262" width="80" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="480" y="283" text-anchor="middle" font-size="9" fill="#2d3142">子 B</text>
<rect x="528" y="262" width="80" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="568" y="283" text-anchor="middle" font-size="9" fill="#2d3142">子 C</text>

<line x1="450" y1="202" x2="392" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>
<line x1="480" y1="202" x2="480" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>
<line x1="510" y1="202" x2="568" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>
<text x="360" y="228" font-size="8.5" fill="#5a6580">brief ↓</text>
<text x="360" y="242" font-size="8.5" fill="#5a6580">结论 ↑</text>

<text x="360" y="322" font-size="8.5" fill="#4f5d75">· 父每一轮重新决定派谁、派几份</text>
<text x="360" y="340" font-size="8.5" fill="#4f5d75">· 子会话退出不影响父的上下文</text>

<!-- 面板 3 -->
<rect x="640" y="104" width="280" height="256" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="640" y="104" width="4" height="256" fill="#bf4520"/>
<text x="660" y="128" font-size="10.5" font-weight="600" fill="#2d3142">③ 代码编排 workflow</text>
<text x="660" y="145" font-size="8.5" fill="#5a6580">派发逻辑写死，模型只在节点内决策</text>

<rect x="660" y="160" width="240" height="42" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
<text x="672" y="177" font-size="8.5" fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">for task in split(goal):</text>
<text x="672" y="193" font-size="8.5" fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">    agents += spawn(brief(task))</text>

<rect x="668" y="262" width="72" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="704" y="283" text-anchor="middle" font-size="9" fill="#2d3142">agent</text>
<rect x="752" y="262" width="72" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="788" y="283" text-anchor="middle" font-size="9" fill="#2d3142">agent</text>
<rect x="836" y="262" width="72" height="34" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="872" y="283" text-anchor="middle" font-size="9" fill="#2d3142">agent</text>
<line x1="704" y1="204" x2="704" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>
<line x1="788" y1="204" x2="788" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>
<line x1="872" y1="204" x2="872" y2="258" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)" marker-start="url(#f3a)"/>

<text x="660" y="322" font-size="8.5" fill="#4f5d75">· 派发可测、可重放，失败位置固定</text>
<text x="660" y="340" font-size="8.5" fill="#4f5d75">· 代价：路径写不死时只能上中控</text>

<text x="48" y="384" font-size="9" fill="#8a93a6">同一套子会话机制，三种用法。选哪种看任务路径能不能提前写死。</text>
</svg>
