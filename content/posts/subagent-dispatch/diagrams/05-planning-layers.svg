<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="f5t f5d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f5t">计划的三层，只有第三层驱动调度</title>
<desc id="f5d">声明层与记录层都是进入上下文的文本；模型读完后输出本轮的 tool_call，这才是调度。两条输入线汇入同一份上下文，没有独立的 planner 模块。</desc>
<defs>
  <marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="560" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">PLANNING / THREE LAYERS</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">计划是文本，调度是动作</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">前两层都进上下文，第三层才落到系统上</text>

<!-- L0 -->
<rect x="48" y="110" width="540" height="86" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<rect x="48" y="110" width="4" height="86" fill="#3d5a80"/>
<text x="66" y="132" font-size="8.5" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" fill="#3d5a80">L0 / DECLARED</text>
<text x="66" y="152" font-size="10.5" font-weight="600" fill="#2d3142">声明层：系统提示词里的委派准则</text>
<text x="66" y="170" font-size="9" fill="#4f5d75">子 agent 的描述、工具白名单、什么时候该派、派之前要问什么</text>
<text x="66" y="186" font-size="8.5" fill="#8a93a6">静态文本，每轮都占上下文；改它等于改模型的行为倾向</text>

<!-- L1 -->
<rect x="48" y="208" width="540" height="86" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<rect x="48" y="208" width="4" height="86" fill="#2f6f5e"/>
<text x="66" y="230" font-size="8.5" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" fill="#2f6f5e">L1 / RECORDED</text>
<text x="66" y="250" font-size="10.5" font-weight="600" fill="#2d3142">记录层：todo、任务板、计划模式</text>
<text x="66" y="268" font-size="9" fill="#4f5d75">写给人看，也写给下一轮的自己看；重启后还能回答「做到哪了」</text>
<text x="66" y="284" font-size="8.5" fill="#8a93a6">结构化与否都行，调度器不读它，只有模型读</text>

<!-- 上下文 -->
<rect x="640" y="110" width="272" height="184" fill="#ffffff" stroke="#3d5a80" stroke-width="1.2"/>
<text x="656" y="132" font-size="10" font-weight="600" fill="#2d3142">这一轮的上下文</text>
<text x="656" y="156" font-size="8.5" fill="#5a6580">system 段（L0）</text>
<text x="656" y="176" font-size="8.5" fill="#5a6580">todo / 任务板（L1）</text>
<text x="656" y="196" font-size="8.5" fill="#5a6580">工具结果与回执</text>
<text x="656" y="216" font-size="8.5" fill="#5a6580">对话历史</text>
<rect x="656" y="228" width="240" height="50" fill="#f5f5f5" stroke="#e2e6ee"/>
<text x="666" y="247" font-size="8.5" fill="#8a93a6">没有字段叫「计划」</text>
<text x="666" y="263" font-size="8.5" fill="#8a93a6">只有一段段文本和消息</text>

<line x1="588" y1="153" x2="636" y2="153" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5a)"/>
<line x1="588" y1="251" x2="636" y2="251" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5a)"/>

<!-- 模型 -->
<rect x="640" y="334" width="272" height="54" fill="#ffffff" stroke="#3d5a80" stroke-width="1.2"/>
<text x="776" y="356" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">模型（同一个循环）</text>
<text x="776" y="372" text-anchor="middle" font-size="8.5" fill="#5a6580">读完上下文，选一个动作</text>
<line x1="776" y1="294" x2="776" y2="330" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5a)"/>

<!-- L2 -->
<rect x="640" y="424" width="272" height="86" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
<rect x="640" y="424" width="4" height="86" fill="#bf4520"/>
<text x="658" y="446" font-size="8.5" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" fill="#bf4520">L2 / ACTED</text>
<text x="658" y="466" font-size="10.5" font-weight="600" fill="#2d3142">决策层：本轮的 tool_call</text>
<text x="658" y="484" font-size="9" fill="#4f5d75">派谁、派几份、要不要等、现在收尾吗</text>
<text x="658" y="500" font-size="8.5" fill="#8a93a6">唯一真正改变系统状态的输出</text>
<line x1="776" y1="388" x2="776" y2="420" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5a)"/>

<!-- 左下结论 -->
<rect x="48" y="330" width="540" height="150" fill="#ffffff" stroke="#e2e6ee"/>
<text x="66" y="354" font-size="10.5" font-weight="600" fill="#2d3142">所以「协调器按计划分配任务」这句话要拆开看</text>
<text x="66" y="378" font-size="9" fill="#4f5d75">1. 计划记录（L1）本身不触发任何调用，它只是下一轮上下文的一部分</text>
<text x="66" y="398" font-size="9" fill="#4f5d75">2. 每次派发都是模型在某一轮里输出的一个动作，跟着当时的上下文走</text>
<text x="66" y="418" font-size="9" fill="#4f5d75">3. 想让计划稳定驱动派发，就得把循环从模型手里拿走，写进代码</text>
<text x="66" y="446" font-size="8.5" fill="#8a93a6">两条路线的取舍，见正文第 4、5 节。</text>

<text x="48" y="540" font-size="8.5" fill="#8a93a6">上下文里没有「计划」这个字段。计划是模型读到的文本，调度是模型写出的动作。</text>
</svg>
