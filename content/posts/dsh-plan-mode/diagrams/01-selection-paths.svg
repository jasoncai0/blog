<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">选择在哪儿落地</title>
<desc id="f01-desc">空闲时立即写日志；轮内先挂起，等下一个被接受的 pre-step。</desc>
<rect width="960" height="550" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLAN / SELECTION</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">两条路径</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">挂起失败不阻塞轮次，继续等下一次机会。</text>
<rect x="60" y="100" width="300" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">set(agent, active) 或 /plan</text><text x="72" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">相同状态：noop，不产生事件</text><rect x="60" y="210" width="300" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">有打开的 turn 吗</text><text x="76" y="256" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">openTurnStartSeq !== null</text><line x1="210" y1="170" x2="210" y2="210" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="60" y="330" width="300" height="110" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">否：立即提交</text><text x="72" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">session.append(plan/mode)</text><text x="72" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">最近请求头描述另一态时 inject 通知</text><text x="72" y="395" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">失败则保留选择可重试</text><line x1="150" y1="280" x2="150" y2="340" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="160" y="316" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">idle</text><rect x="480" y="330" width="420" height="110" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="492" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">是：挂起，等 pre-step</text><text x="492" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">写入内存 pendingIntents</text><text x="492" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">监听器先 await next()</text><text x="492" y="395" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">reject / abort：不追加，保持挂起</text><text x="492" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">写入成功：随这一步的请求生效</text><path d="M360 245 H440 V385 H480" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="372" y="238" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">open</text><text x="60" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">追加失败只记 warn；选择留在内存，等下一个被接受的 pre-step 重试。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="532" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / SELECTION</text>
</svg>
