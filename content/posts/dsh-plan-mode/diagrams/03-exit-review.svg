<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">一次退出评审</title>
<desc id="f03-desc">批准后指引仍在这批调用里生效，下一步的请求才切换。</desc>
<rect width="960" height="620" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLAN / EXIT</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">从提交到切换</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">放弃评审会直接结束当前轮。</text>
<rect x="50" y="92" width="160" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="130" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">模型 / TOOL BATCH</text><line x1="130" y1="120" x2="130" y2="520" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="310" y="92" width="160" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="390" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">exit_plan_mode</text><line x1="390" y1="120" x2="390" y2="520" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="570" y="92" width="160" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="650" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">用户 / 评审</text><line x1="650" y1="120" x2="650" y2="520" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="790" y="92" width="160" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="870" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">会话日志</text><line x1="870" y1="120" x2="870" y2="520" stroke="#d8d8d8" stroke-dasharray="3 4"/><text x="42" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">01</text><line x1="136" y1="150" x2="384" y2="150" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f03-g)"/><text x="260" y="144" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">call exit_plan_mode(plan)</text><text x="42" y="186" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">02</text><text x="398" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">校验首行 '# '</text><text x="42" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">03</text><line x1="396" y1="222" x2="644" y2="222" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f03-g)"/><text x="520" y="216" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">ask(plan-review)</text><text x="42" y="258" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">04</text><line x1="656" y1="258" x2="384" y2="258" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#f03-g)"/><text x="520" y="252" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">批准 / 继续规划 / 放弃</text><text x="42" y="294" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">05</text><text x="398" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">pending = {active:false, narrate:false}</text><text x="42" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">06</text><line x1="396" y1="330" x2="124" y2="330" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#f03-g)"/><text x="260" y="324" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">返回 {approved:true}</text><text x="42" y="366" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">07</text><text x="138" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">tool/result 已批准</text><text x="42" y="402" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">08</text><text x="138" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">下一个被接受的 pre-step</text><text x="42" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">09</text><line x1="136" y1="438" x2="864" y2="438" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f03-g)"/><text x="500" y="432" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">append plan/mode false</text><circle cx="868" cy="445" r="2.4" fill="#bf4520"/><text x="42" y="474" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">10</text><text x="138" y="474" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">这一步的 policy 为空</text><text x="40" y="562" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">放弃评审：捕获 ASK_CANCELLED → exec.concludeTurn()，返回 {approved:false}，不再花一次模型请求。</text><text x="40" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">继续规划：抛错并把用户反馈带回去；没有 userQuestions 通道时同样抛错，不静默退出。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="602" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / EXIT</text>
</svg>
