<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">四个状态，两条挂起边</title>
<desc id="f02-desc">日志里只有 active / inactive；pending 只在内存，进程退出即丢。</desc>
<rect width="960" height="440" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLAN / LIFECYCLE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">模式状态机</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">取消挂起回到原态，不产生新事件。</text>
<rect x="60" y="190" width="190" height="64" rx="32" fill="#ffffff" stroke="#d8d8d8"/><text x="155.0" y="217" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">inactive</text><text x="155.0" y="235" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">plan/mode false</text><rect x="710" y="190" width="190" height="64" rx="32" fill="#ffffff" stroke="#bf4520"/><text x="805.0" y="217" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">active</text><text x="805.0" y="235" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">plan/mode true</text><rect x="390" y="80" width="180" height="64" rx="32" fill="#ffffff" stroke="#d8d8d8"/><text x="480.0" y="107" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">pending on</text><text x="480.0" y="125" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">内存挂起</text><rect x="390" y="300" width="180" height="64" rx="32" fill="#ffffff" stroke="#d8d8d8"/><text x="480.0" y="327" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">pending off</text><text x="480.0" y="345" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">内存挂起</text><line x1="250" y1="196" x2="404" y2="144" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><text x="252" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">/plan（轮内）</text><line x1="570" y1="142" x2="712" y2="206" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><text x="596" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">pre-step 接受</text><line x1="252" y1="222" x2="708" y2="222" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><text x="480" y="212" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">/plan（无 open turn）：直接 append</text><line x1="712" y1="240" x2="572" y2="308" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><text x="600" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">off / 批准退出</text><line x1="388" y1="322" x2="250" y2="252" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><text x="252" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">pre-step 接受</text><text x="60" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">虚线不画：取消挂起只是从内存删掉，日志不变；`entered` 一旦为真，exit_plan_mode 的准入持续到会话结束。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="422" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / LIFECYCLE</text>
</svg>
