<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="f06-title f06-desc">
<title id="f06-title">三份状态，三种寿命</title>
<desc id="f06-desc">plan 与 todo 属于单个会话；任务板属于根会话并被后代共享；成员各有一份自己的。</desc>
<rect width="960" height="510" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TEAM / SCOPE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">作用域决定叠加方式</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">最容易记错的一点：根在计划模式，成员不在。</text>
<rect x="40" y="100" width="880" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="58" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">根会话 · LEAD</text><rect x="56" y="132" width="410" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="68" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">plan/mode</text><text x="68" y="167" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">per session：只存在于这个会话的事件</text><rect x="486" y="132" width="410" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="498" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">todo/write</text><text x="498" y="167" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">per session：turn/start 清空</text><rect x="40" y="228" width="880" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="58" y="250" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">任务板 · 根日志的投影</text><rect x="56" y="260" width="844" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="68" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">tasks + 依赖图 + ownerId</text><text x="68" y="295" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">isEnabled 读根会话，后代共享这一块；claim 带 revision CAS</text><rect x="40" y="356" width="880" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="58" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">成员会话 · 每个成员一份</text><rect x="56" y="388" width="270" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="68" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">plan/mode</text><text x="68" y="423" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">起步时没有：不继承根</text><rect x="344" y="388" width="270" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="356" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">todo/write</text><text x="356" y="423" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">自己的步骤，自己的清单</text><rect x="632" y="388" width="268" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="644" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">收件箱</text><text x="644" y="423" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">send_message 与 wait_agent</text><line x1="760" y1="316" x2="760" y2="356" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#f06-g)"/><text x="770" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">认领</text><text x="40" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">叠加顺序：根用 plan 定范围，根用 todo 记自己的步骤，任务板切出可并行的部分，成员各自用自己的 todo。</text><defs><marker id="f06-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f06-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">06 / SCOPE</text>
</svg>
