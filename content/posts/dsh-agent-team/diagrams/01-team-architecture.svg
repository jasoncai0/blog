<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-d1-title f01-d1-desc">
  <title id="f01-d1-title">Team 的拓扑：根会话、任务板与 subagent 树</title>
  <desc id="f01-d1-desc">根会话同时承载 Team 身份与任务事件日志，任务板由日志投影而来；成员是各自持有会话的 subagent，与任务板之间只有归属与动作。共享的副作用面只有工作区。</desc>

  <defs>
    <marker id="f01-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#bf4520">TEAM TOPOLOGY</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">Team 不新建成员：根会话、任务板与 subagent 树</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">任务事实从根日志投影到任务板；成员身份与收件箱由 subagent runtime 单独维护</text>

  <!-- root session -->
  <rect x="52" y="120" width="240" height="222" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="72" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">ROOT SESSION</text>
  <text x="72" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Lead（唯一的根）</text>
  <text x="72" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">team/mode（显式选择）</text>
  <text x="72" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">team/task × N（只追加）</text>
  <text x="72" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">projection: agentTeam</text>
  <text x="72" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">TeamId = brand 过的 SessionId</text>
  <text x="72" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">只读根，后代共享模式</text>
  <text x="72" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">create / reassign 在这里发起</text>

  <!-- task board -->
  <rect x="356" y="120" width="250" height="222" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="376" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">TASK BOARD</text>
  <text x="376" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">TeamTaskBoard</text>
  <text x="376" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">pending · in_progress</text>
  <text x="376" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">completed · deleted</text>
  <text x="376" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">blockedBy 依赖图</text>
  <text x="376" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">revision CAS + owner</text>
  <text x="376" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">每次变更是完整快照</text>
  <text x="376" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">maxTasks 默认 256</text>

  <!-- members -->
  <rect x="664" y="120" width="244" height="222" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="684" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">SUBAGENT TREE</text>
  <text x="684" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">成员 = 各自会话</text>

  <rect x="684" y="188" width="204" height="46" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="698" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">member A · reviewer</text>
  <text x="698" y="223" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">own session log · inbox</text>

  <rect x="684" y="242" width="204" height="46" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="698" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">member B · tester</text>
  <text x="698" y="277" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">own session log · inbox</text>

  <rect x="684" y="296" width="204" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="3 3"/>
  <text x="698" y="317" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">member C（可达后代，任意深度）</text>

  <!-- persistence -->
  <rect x="52" y="418" width="240" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="440" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">DURABILITY</text>
  <text x="72" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">sessionPersistence</text>
  <text x="72" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">append 之后 await flush</text>

  <!-- workspace -->
  <rect x="356" y="418" width="552" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="376" y="440" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">SHARED WORKSPACE</text>
  <text x="376" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">代码、测试、产物：唯一共享的副作用面</text>
  <text x="376" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">writeScopes 只记录意图，文件系统不认它</text>

  <!-- arrows -->
  <line x1="292" y1="214" x2="352" y2="214" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a1)"/>
  <text x="296" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">create</text>
  <text x="296" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">reassign</text>

  <line x1="610" y1="206" x2="664" y2="188" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a1)"/>
  <text x="614" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">ownerId</text>

  <line x1="664" y1="266" x2="610" y2="248" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a1)"/>
  <text x="612" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">claim · complete</text>

  <line x1="172" y1="342" x2="172" y2="414" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a1)"/>
  <text x="180" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">flush</text>

  <line x1="480" y1="342" x2="480" y2="414" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f01-a1)"/>
  <text x="490" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">意图，不是锁</text>

  <line x1="786" y1="342" x2="786" y2="414" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a1)"/>
  <text x="794" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">读写文件</text>

  <text x="48" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">两条不交叉的线：任务事实走日志与投影；成员身份与收件箱走 subagent runtime。</text>
  <text x="48" y="580" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">交集只有一处：任务快照里的 ownerId 指向某个成员会话。</text>
</svg>
