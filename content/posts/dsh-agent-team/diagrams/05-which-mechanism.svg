<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f05-title f05-desc">
<title id="f05-title">按顺序问三个问题</title>
<desc id="f05-desc">三条判据依次问，第一条命中就停；都不命中就不开 team。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TEAM / CHOOSING</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">缺的是哪一种约束</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三者不在同一层面，没有「哪个更强」。</text>
<rect x="56" y="112" width="392" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="68" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">① 范围被同意过吗</text><text x="68" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">动手前有一份要被批准的文本吗</text><text x="68" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">要改多处、不可回滚、需求有歧义都算没同意</text><rect x="552" y="112" width="352" height="96" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="564" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">plan mode</text><text x="564" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">约束：该不该动手</text><text x="564" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">成本：一条事件 + 一段提示词</text><text x="564" y="177" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">闸门：退出时的人工评审</text><line x1="448" y1="160" x2="552" y2="160" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><text x="500" y="152" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">命中</text><rect x="56" y="224" width="392" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="68" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">② 一个上下文做得完吗</text><text x="68" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">步骤强顺序，每步都要看前一步全部输出</text><text x="68" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">反例：三条互不相干的工作线</text><rect x="552" y="224" width="352" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="564" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">todo（或什么都不用）</text><text x="564" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">约束：进度是否可见</text><text x="564" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">成本：一条事件，无闸门</text><text x="564" y="289" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">注意：没人校验清单与产物</text><line x1="448" y1="272" x2="552" y2="272" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f05-g)"/><text x="500" y="264" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">命中</text><rect x="56" y="336" width="392" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="68" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">③ 需要并行或盲评吗</text><text x="68" y="371" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">两条以上独立工作线；或判断者不能看实现推理</text><text x="68" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">另一个信号：单条任务会撑爆一个上下文</text><rect x="552" y="336" width="352" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="564" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">team</text><text x="564" y="371" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">约束：谁做哪条、依赖谁</text><text x="564" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">成本：每个成员一份会话日志与一次组装</text><text x="564" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">闸门：没有，失败靠 Lead 收拾</text><line x1="448" y1="384" x2="552" y2="384" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f05-g)"/><text x="500" y="376" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">命中</text><rect x="56" y="448" width="848" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#2d3142">三条都不满足：不要开 team。单上下文顺序做完最省，清单可以只留在心里。</text><text x="72" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">反过来也成立：开了 team 却发现两条工作线其实强顺序依赖，那是把 todo 的成本乘以成员数。</text><defs><marker id="f05-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f05-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">05 / CHOOSING</text>
</svg>
