<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-d2-title f02-d2-desc">
  <title id="f02-d2-title">任务板的四个状态与动作</title>
  <desc id="f02-d2-desc">任务在 pending、in_progress、completed 之间由 claim、release、complete、reopen 迁移，任意状态可被删除为墓碑。成员失败不产生迁移，owner 只能由 Lead 改写。</desc>

  <defs>
    <marker id="f02-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f02-a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#bf4520">TASK STATE MACHINE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">四个状态，八条迁移，一条没有迁移的路径</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">实线是任务动作；虚线是成员失败——状态原地不动，等 Lead 显式收拾</text>

  <!-- states -->
  <rect x="90" y="210" width="170" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="175" y="238" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">pending</text>
  <text x="175" y="258" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">未开始 或 已释放</text>

  <rect x="390" y="210" width="196" height="66" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="488" y="238" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">in_progress</text>
  <text x="488" y="258" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">ownerId 指向某个会话</text>

  <rect x="716" y="210" width="160" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="796" y="238" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">completed</text>
  <text x="796" y="258" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">满足依赖，不等于已合并</text>

  <rect x="390" y="452" width="196" height="60" rx="6" fill="#f0f0f0" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="488" y="478" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#4f5d75">deleted</text>
  <text x="488" y="497" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">墓碑，日志里保留</text>

  <!-- pending -> in_progress -->
  <line x1="260" y1="232" x2="386" y2="232" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="268" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">claim</text>
  <text x="268" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">无主 + ready</text>

  <!-- in_progress -> pending -->
  <line x1="390" y1="256" x2="264" y2="256" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="296" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">release（owner 或 Lead）</text>

  <!-- in_progress -> completed -->
  <line x1="586" y1="232" x2="712" y2="232" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="604" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">complete</text>
  <text x="604" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">仅 in_progress</text>

  <!-- completed -> pending -->
  <path d="M 796 210 L 796 178 L 175 178 L 175 206" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="470" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">reopen</text>

  <!-- to deleted -->
  <line x1="452" y1="276" x2="452" y2="448" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="300" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">delete（无依赖者）</text>
  <path d="M 452 380 L 456 380" fill="none" stroke="#8a93a6" stroke-width="1.2"/>

  <!-- reassign -->
  <path d="M 175 276 L 175 330 L 380 330" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a2)"/>
  <text x="196" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">reassign（仅 Lead；省略 owner 则清空回 pending）</text>

  <!-- failure self loop -->
  <path d="M 470 210 C 470 186, 506 186, 506 210" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f02-a2b)"/>
  <text x="520" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">成员失败 / 退出：状态不变</text>

  <!-- error panel -->
  <rect x="620" y="400" width="290" height="160" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="640" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">TYPED ERRORS</text>
  <text x="640" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">STALE_REVISION：revision 不匹配</text>
  <text x="640" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">ALREADY_CLAIMED：已被别人认领</text>
  <text x="640" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">BLOCKED：状态不对或依赖未完成</text>
  <text x="640" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">UNAUTHORIZED：既不是 owner 也不是 Lead</text>
  <text x="640" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">HAS_DEPENDENTS：还有任务在等它</text>
  <text x="640" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">错误码是给模型读的，不是给日志读的</text>

  <text x="48" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">没有 timeout、没有 lease、没有自动回收：这三样都不在这张状态机里。</text>
</svg>
