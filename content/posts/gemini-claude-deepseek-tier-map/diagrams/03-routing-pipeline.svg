<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">三阵营多模型生产路由管线</title>
<desc id="f3d">输入请求先经过任务特征分流闸门，再按高难度规划、高频工程、多模态/长文执行、极致并发四条支路落到对应梯队模型，最后经验证节点输出。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="28" y="34" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.5" fill="#5a6580">MULTI-MODEL ROUTING PIPELINE</text>
<text x="28" y="58" font-size="16" font-weight="600" fill="#2d3142">工程落地怎么配：从任务分流到模型梯队的路由管线</text>
<text x="28" y="78" font-size="10" fill="#5a6580">先按复杂度、多模态需求与预算过闸门，再把不同子步骤交给最匹配的梯队，避免全链路用旗舰烧预算</text>
<rect x="28" y="210" width="146" height="106" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="28" y="210" width="4" height="106" fill="#3d5a80"/>
<text x="44" y="236" font-size="11.5" font-weight="600" fill="#2d3142">输入请求</text>
<text x="44" y="256" font-size="9" fill="#4f5d75">用户任务 / 代码库</text>
<text x="44" y="274" font-size="9" fill="#4f5d75">音视频 PDF / 批量数据</text>
<text x="44" y="294" font-size="8.5" fill="#5a6580">产出：TaskSpec</text>
<rect x="216" y="182" width="166" height="162" fill="#f7efe4" stroke="#bf4520"/>
<text x="232" y="208" font-size="11.5" font-weight="600" fill="#2d3142">路由分流闸门</text>
<text x="232" y="226" font-size="9" fill="#5a6580">按三个维度判定去向</text>
<text x="232" y="252" font-size="9" fill="#4f5d75">1. 推理深度与失败代价</text>
<text x="232" y="272" font-size="9" fill="#4f5d75">2. 原生多模态 / 上下文量</text>
<text x="232" y="292" font-size="9" fill="#4f5d75">3. 单次吞吐与 Token 预算</text>
<text x="232" y="322" font-size="8.5" fill="#bf4520">产出：Tier + 思考档位</text>
<line x1="176" y1="263" x2="210" y2="263" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="193" y="255" text-anchor="middle" font-size="8" fill="#5a6580">特征</text>
<rect x="468" y="106" width="318" height="82" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="468" y="106" width="4" height="82" fill="#5b4b8a"/>
<text x="482" y="126" font-size="10.5" font-weight="600" fill="#2d3142">支路 1 · 顶层架构与长程攻坚 (S+)</text>
<text x="482" y="145" font-size="10" font-weight="600" fill="#5b4b8a">Gemini 4 Carbon / Claude Fable 5.2</text>
<text x="482" y="162" font-size="8.8" fill="#4f5d75">开源侧备选：DeepSeek-V4-Pro</text>
<text x="482" y="178" font-size="8.2" fill="#5a6580">产出：架构方案 / 难例拆解</text>
<path d="M 382 263 C 425 263, 420 146, 462 146" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<path d="M 786 146 C 808 146, 806 263, 822 263" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<rect x="468" y="206" width="318" height="82" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="468" y="206" width="4" height="82" fill="#5b4b8a"/>
<text x="482" y="226" font-size="10.5" font-weight="600" fill="#2d3142">支路 2 · 高频软件工程主力 (S)</text>
<text x="482" y="245" font-size="10" font-weight="600" fill="#5b4b8a">Gemini 4 Neon / Claude Opus·Sonnet 5.5</text>
<text x="482" y="262" font-size="8.8" fill="#4f5d75">跨文件重构 / 测试闭环 / 日常 SWE</text>
<text x="482" y="278" font-size="8.2" fill="#5a6580">产出：代码补丁 / PR Diff</text>
<path d="M 382 263 C 425 263, 420 246, 462 246" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<path d="M 786 246 C 808 246, 806 263, 822 263" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<rect x="468" y="306" width="318" height="82" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="468" y="306" width="4" height="82" fill="#2f6f5e"/>
<text x="482" y="326" font-size="10.5" font-weight="600" fill="#2d3142">支路 3 · 执行引擎与多模态 (A)</text>
<text x="482" y="345" font-size="10" font-weight="600" fill="#2f6f5e">Gemini 4 Hydrogen / DeepSeek-V4.1-Flash</text>
<text x="482" y="362" font-size="8.8" fill="#4f5d75">音视频 PDF 解析、Worker 子代理、高频脚本</text>
<text x="482" y="378" font-size="8.2" fill="#5a6580">产出：结构化分析 / 子任务产物</text>
<path d="M 382 263 C 425 263, 420 346, 462 346" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<path d="M 786 346 C 808 346, 806 263, 822 263" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<rect x="468" y="406" width="318" height="82" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="468" y="406" width="4" height="82" fill="#2f6f5e"/>
<text x="482" y="426" font-size="10.5" font-weight="600" fill="#2d3142">支路 4 · 极速并发与路由清洗 (B)</text>
<text x="482" y="445" font-size="10" font-weight="600" fill="#2f6f5e">Claude Haiku 5.5 / V4.1-Flash Off-Peak</text>
<text x="482" y="462" font-size="8.8" fill="#4f5d75">标签分类、字段抽取、百倍级低成本批处理</text>
<text x="482" y="478" font-size="8.2" fill="#5a6580">产出：JSON 抽取 / 路由标签</text>
<path d="M 382 263 C 425 263, 420 446, 462 446" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<path d="M 786 446 C 808 446, 806 263, 822 263" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3a)"/>
<rect x="828" y="206" width="106" height="114" fill="#e9f2ed" stroke="#2f6f5e"/>
<text x="842" y="232" font-size="11" font-weight="600" fill="#2d3142">交付与复核</text>
<text x="842" y="254" font-size="8.8" fill="#4f5d75">低层失败时</text>
<text x="842" y="270" font-size="8.8" fill="#4f5d75">逐级升级到</text>
<text x="842" y="286" font-size="8.8" fill="#4f5d75">高一档模型</text>
<text x="842" y="308" font-size="8.2" fill="#2f6f5e">输出：最终结果</text>
<text x="28" y="506" font-size="8.5" fill="#5a6580">典型组合：Google Antigravity 用 Carbon/Neon 做顶层规划，Hydrogen 做执行 Worker；降本部署则用 V4.1-Flash 兜底高频循环、V4-Pro 兜底难例。</text>
</svg>