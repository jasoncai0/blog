<text x="32" y="636" class="f3-footer">★ 编排范式：Google Antigravity 用 Carbon / Neon 做顶层拆解，Hydrogen 做执行子代理；极致降本链路用 DeepSeek-V4.1-Flash 承接主流量，难例升档兜底。</text>
