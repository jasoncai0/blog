<text x="50" y="350" class="f3-card-sub">· 长音视频 / 大体积 PDF</text>
<text x="50" y="372" class="f3-card-sub">· 批量脚本重构与清洗</text>
<text x="50" y="394" class="f3-card-sub">· 实时分类与抽取流量</text>
