<text x="32" y="66" class="f3-subtitle">按失败代价、全模态长度与 Token 预算分流；低层校验连续失败 2 次自动升级高阶梯队兜底</text>
<rect x="32" y="88" width="190" height="36" rx="8" fill="#1E293B"/>
