<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">deep-research 的三层结构</title>
<desc id="f1d">主会话发出一个 Workflow 调用，只收到最终报告；workflow runtime 执行 442 行脚本，五个阶段分别起 1、5、15、75、1 个子会话；子会话调用 WebSearch 与 WebFetch，结构化结果回到脚本变量。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
  <marker id="f1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="640" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DEEP-RESEARCH / ARCHITECTURE</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">一个命令、五个阶段、一个报告</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">中间结果留在脚本变量里，主上下文只拿最终结果</text>

<!-- 主会话 -->
<rect x="40" y="108" width="880" height="88" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="108" width="4" height="88" fill="#3d5a80"/>
<text x="64" y="130" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#3d5a80">MAIN SESSION</text>
<text x="64" y="152" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="10.5" fill="#2d3142">/deep-research "Node.js 权限模型 v20 → v22 改了什么"</text>
<text x="896" y="130" text-anchor="end" font-size="9" fill="#5a6580">先澄清（可选），再调用</text>
<text x="64" y="174" font-size="9.5" fill="#5a6580">Workflow({ name: 'deep-research', args })　·　上下文里只有这一问一答</text>

<!-- 主会话 -> runtime -->
<line x1="480" y1="196" x2="480" y2="232" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)" marker-start="url(#f1b)"/>
<text x="492" y="218" font-size="8.5" fill="#5a6580">↓ args　↑ 最终 report</text>

<!-- runtime -->
<rect x="40" y="232" width="880" height="238" fill="#ffffff" stroke="#e2e6ee"/>
<text x="64" y="256" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#5b4b8a">WORKFLOW RUNTIME · 脚本持有计划</text>
<text x="64" y="278" font-size="11" font-weight="600" fill="#2d3142">五个阶段由 442 行脚本串起来</text>
<text x="896" y="278" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5a6580">25,605 字节 · Claude Code 2.1.321</text>

<!-- phase cards -->
<g>
  <rect x="64" y="296" width="148" height="118" fill="#ffffff" stroke="#d8dce6"/>
  <rect x="64" y="296" width="148" height="3" fill="#3d5a80"/>
  <text x="78" y="322" font-size="11.5" font-weight="600" fill="#2d3142">Scope</text>
  <text x="78" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5b4b8a">1 agent</text>
  <text x="78" y="364" font-size="9" fill="#5a6580">拆 3–6 个</text>
  <text x="78" y="380" font-size="9" fill="#5a6580">互补搜索角度</text>
</g>
<g>
  <rect x="233" y="296" width="148" height="118" fill="#ffffff" stroke="#d8dce6"/>
  <rect x="233" y="296" width="148" height="3" fill="#5b4b8a"/>
  <text x="247" y="322" font-size="11.5" font-weight="600" fill="#2d3142">Search</text>
  <text x="247" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5b4b8a">5 agents</text>
  <text x="247" y="364" font-size="9" fill="#5a6580">每角度 1 个</text>
  <text x="247" y="380" font-size="9" fill="#5a6580">回 4–6 条结果</text>
</g>
<g>
  <rect x="402" y="296" width="148" height="118" fill="#ffffff" stroke="#d8dce6"/>
  <rect x="402" y="296" width="148" height="3" fill="#5b4b8a"/>
  <text x="416" y="322" font-size="11.5" font-weight="600" fill="#2d3142">Fetch</text>
  <text x="416" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5b4b8a">≤ 15 agents</text>
  <text x="416" y="364" font-size="9" fill="#5a6580">去重后每源 1 个</text>
  <text x="416" y="380" font-size="9" fill="#5a6580">抽 2–5 条 claim</text>
</g>
<g>
  <rect x="571" y="296" width="148" height="118" fill="#ffffff" stroke="#bf4520"/>
  <rect x="571" y="296" width="148" height="3" fill="#bf4520"/>
  <text x="585" y="322" font-size="11.5" font-weight="600" fill="#2d3142">Verify</text>
  <text x="585" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#bf4520">≤ 25 × 3 票</text>
  <text x="585" y="364" font-size="9" fill="#5a6580">每条 3 个 verifier</text>
  <text x="585" y="380" font-size="9" fill="#bf4520">2 票否决即杀</text>
</g>
<g>
  <rect x="740" y="296" width="148" height="118" fill="#ffffff" stroke="#d8dce6"/>
  <rect x="740" y="296" width="148" height="3" fill="#5b4b8a"/>
  <text x="754" y="322" font-size="11.5" font-weight="600" fill="#2d3142">Synthesize</text>
  <text x="754" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5b4b8a">1 agent</text>
  <text x="754" y="364" font-size="9" fill="#5a6580">合并重复、分置信度</text>
  <text x="754" y="380" font-size="9" fill="#5a6580">写摘要、caveats</text>
</g>

<!-- phase arrows -->
<line x1="212" y1="355" x2="229" y2="355" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f1a)"/>
<line x1="381" y1="355" x2="398" y2="355" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f1a)"/>
<line x1="550" y1="355" x2="567" y2="355" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f1a)"/>
<line x1="719" y1="355" x2="736" y2="355" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f1a)"/>

<text x="64" y="442" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#5a6580">20–30 条搜索结果 · 15 个源 · ≤ 75 条 claim · 75 张票</text>
<text x="64" y="460" font-size="9" fill="#5a6580">全部在脚本变量里；主会话收不到原文，也看不到投票过程</text>

<!-- runtime -> pool -->
<line x1="480" y1="470" x2="480" y2="506" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)" marker-start="url(#f1b)"/>
<text x="492" y="492" font-size="8.5" fill="#5a6580">↓ agent(prompt, schema)　↑ 结构化 JSON</text>

<!-- pool -->
<rect x="40" y="506" width="880" height="118" fill="#ffffff" stroke="#e2e6ee"/>
<text x="64" y="530" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#5b4b8a">SUBAGENT POOL · 按 phase 批量起停</text>

<rect x="64" y="544" width="190" height="58" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="78" y="566" font-size="10.5" font-weight="600" fill="#2d3142">Search × 5</text>
<text x="78" y="584" font-size="8.5" fill="#5a6580">WebSearch，按角度搜</text>

<rect x="270" y="544" width="190" height="58" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="284" y="566" font-size="10.5" font-weight="600" fill="#2d3142">Fetch ≤ 15</text>
<text x="284" y="584" font-size="8.5" fill="#5a6580">WebFetch，抽 claim</text>

<rect x="476" y="544" width="190" height="58" fill="#f8eae8" stroke="#9b4b52"/>
<text x="490" y="566" font-size="10.5" font-weight="600" fill="#2d3142">Verify ≤ 75</text>
<text x="490" y="584" font-size="8.5" fill="#5a6580">每条 claim 3 个 verifier</text>

<rect x="682" y="544" width="190" height="58" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="696" y="566" font-size="10.5" font-weight="600" fill="#2d3142">Synth × 1</text>
<text x="696" y="584" font-size="8.5" fill="#5a6580">只读脚本变量</text>
</svg>
