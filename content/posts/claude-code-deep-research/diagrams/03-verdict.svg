<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">一条 claim 的三种归宿</title>
<desc id="f3d">每条 claim 起三个 verifier 找反证；有效票至少两张且否决票少于两张时进 confirmed，否决票至少两张时进 refuted，有效票不足两张时进 unverified。验证器返回 null 记作没投票，不算否决。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="480" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DEEP-RESEARCH / VERDICT</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">一条 claim 的三种归宿</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">判定写在脚本里，不写在 prompt 里</text>

<!-- claim -->
<rect x="40" y="190" width="180" height="100" fill="#e9eff6" stroke="#3d5a80"/>
<text x="56" y="216" font-size="11.5" font-weight="600" fill="#2d3142">claim</text>
<text x="56" y="236" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#3d5a80">claim · quote</text>
<text x="56" y="252" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#3d5a80">importance · sourceQuality</text>
<text x="56" y="272" font-size="8.5" fill="#5a6580">从 ≤ 75 条里取前 25 条</text>

<line x1="220" y1="226" x2="278" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>
<line x1="220" y1="240" x2="278" y2="240" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>
<line x1="220" y1="254" x2="278" y2="330" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>

<!-- voters -->
<rect x="280" y="122" width="100" height="56" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="330" y="146" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">verifier 1</text>
<text x="330" y="164" text-anchor="middle" font-size="7.5" fill="#5a6580">WebSearch 找反证</text>
<rect x="280" y="212" width="100" height="56" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="330" y="236" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">verifier 2</text>
<text x="330" y="254" text-anchor="middle" font-size="7.5" fill="#5a6580">WebSearch 找反证</text>
<rect x="280" y="302" width="100" height="56" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="330" y="326" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">verifier 3</text>
<text x="330" y="344" text-anchor="middle" font-size="7.5" fill="#5a6580">WebSearch 找反证</text>
<text x="280" y="376" font-size="8.5" fill="#bf4520">返回 null = 没投票，不记 refuted</text>

<line x1="380" y1="150" x2="448" y2="226" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>
<line x1="380" y1="240" x2="448" y2="240" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>
<line x1="380" y1="330" x2="448" y2="254" stroke="#4f5d75" stroke-width="1" marker-end="url(#f3a)"/>

<!-- tally -->
<rect x="450" y="190" width="150" height="100" fill="#f7efe4" stroke="#bf4520"/>
<text x="466" y="214" font-size="11" font-weight="600" fill="#2d3142">计票</text>
<text x="466" y="234" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.5" fill="#2d3142">valid = 去掉 null</text>
<text x="466" y="250" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.5" fill="#2d3142">refuted = true 的票</text>
<text x="466" y="266" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.5" fill="#bf4520">errored = 3 − valid</text>

<line x1="600" y1="224" x2="676" y2="140" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f3a)"/>
<line x1="600" y1="240" x2="676" y2="240" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f3a)"/>
<line x1="600" y1="256" x2="676" y2="340" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f3a)"/>

<text x="612" y="176" font-size="8" fill="#2f6f5e">通过</text>
<text x="612" y="232" font-size="8" fill="#9b4b52">否决</text>
<text x="612" y="318" font-size="8" fill="#a8752a">票不够</text>

<!-- confirmed -->
<rect x="680" y="94" width="240" height="86" fill="#e9f2ed" stroke="#2f6f5e"/>
<text x="696" y="118" font-size="11.5" font-weight="600" fill="#2d3142">confirmed</text>
<text x="696" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">2–1 ✓ · 3–0 ✓</text>
<text x="696" y="158" font-size="8.5" fill="#5a6580">有效票 ≥ 2，否决 &lt; 2 → 进 findings</text>

<!-- refuted -->
<rect x="680" y="196" width="240" height="86" fill="#f8eae8" stroke="#9b4b52"/>
<text x="696" y="220" font-size="11.5" font-weight="600" fill="#2d3142">refuted</text>
<text x="696" y="240" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#9b4b52">1–2 ✗ · 0–3 ✗</text>
<text x="696" y="260" font-size="8.5" fill="#5a6580">否决 ≥ 2 → 不进 findings，合成可见</text>

<!-- unverified -->
<rect x="680" y="298" width="240" height="86" fill="#f2ece2" stroke="#a8752a"/>
<text x="696" y="322" font-size="11.5" font-weight="600" fill="#2d3142">unverified</text>
<text x="696" y="342" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#a8752a">1–0 ? · 0–0 ?（含报错票）</text>
<text x="696" y="362" font-size="8.5" fill="#5a6580">有效票 &lt; 2 → 单列，不算被否</text>

<text x="48" y="440" font-size="9.5" fill="#5a6580">quorum 是 2。两张有效票一致通过、第三张票报错，claim 仍然 confirmed；三张票里两张报错，进 unverified。</text>
</svg>
