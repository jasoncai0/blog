<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="f2t f2d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f2t">Search 到 Fetch 的流水线，以及 Verify 前的屏障</title>
<desc id="f2d">Scope 拆出五个角度后，五个 searcher 并行；每个角度完成就进入 URL 去重和抓取槽位分配，再起 fetch agent 抽取 claim。所有 claim 到齐后越过屏障，按重要性取前 25 条，各起三个 verifier 投票，最后交给一个合成 agent。</desc>
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="540" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DEEP-RESEARCH / PIPELINE</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">搜完一个角度就开抓，验之前必须等齐</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">pipeline 的三个参数：角度列表、search、去重加抓取</text>

<!-- Scope -->
<rect x="48" y="200" width="112" height="110" fill="#e9eff6" stroke="#3d5a80"/>
<text x="64" y="226" font-size="11" font-weight="600" fill="#2d3142">① Scope</text>
<text x="64" y="248" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#3d5a80">1 agent</text>
<text x="64" y="270" font-size="9" fill="#4f5d75">拆成 5 个</text>
<text x="64" y="286" font-size="9" fill="#4f5d75">搜索角度</text>
<line x1="160" y1="255" x2="178" y2="255" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2a)"/>

<!-- pipeline container -->
<rect x="180" y="120" width="392" height="300" fill="#fbfbfd" stroke="#d8dce6"/>
<text x="196" y="142" font-size="9.5" font-weight="600" fill="#5b4b8a">② Search → Fetch：按角度流水</text>

<!-- searchers -->
<g>
  <rect x="196" y="160" width="84" height="32" fill="#e9eff6" stroke="#3d5a80"/>
  <text x="206" y="180" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2d3142">searcher 1</text>
  <rect x="196" y="202" width="84" height="32" fill="#e9eff6" stroke="#3d5a80"/>
  <text x="206" y="222" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2d3142">searcher 2</text>
  <rect x="196" y="244" width="84" height="32" fill="#e9eff6" stroke="#3d5a80"/>
  <text x="206" y="264" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2d3142">searcher 3</text>
  <rect x="196" y="286" width="84" height="32" fill="#e9eff6" stroke="#3d5a80"/>
  <text x="206" y="306" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2d3142">searcher 4</text>
  <rect x="196" y="328" width="84" height="32" fill="#e9eff6" stroke="#3d5a80"/>
  <text x="206" y="348" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2d3142">searcher 5</text>
</g>
<line x1="280" y1="176" x2="300" y2="176" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="280" y1="218" x2="300" y2="218" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="280" y1="260" x2="300" y2="260" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="280" y1="302" x2="300" y2="302" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="280" y1="344" x2="300" y2="344" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>

<!-- dedup gate -->
<rect x="304" y="160" width="88" height="200" fill="#f7efe4" stroke="#bf4520"/>
<text x="348" y="184" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2d3142">URL 去重</text>
<text x="348" y="202" text-anchor="middle" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.5" fill="#5a6580">seen Map</text>
<text x="348" y="226" text-anchor="middle" font-size="8.5" fill="#2d3142">15 个槽位</text>
<text x="348" y="244" text-anchor="middle" font-size="8" fill="#bf4520">高相关可超</text>
<text x="348" y="268" text-anchor="middle" font-size="8" fill="#5a6580">重复 → dupes</text>
<text x="348" y="286" text-anchor="middle" font-size="8" fill="#5a6580">超预算 → drop</text>
<text x="348" y="310" text-anchor="middle" font-size="8" fill="#5a6580">key = host + path</text>
<text x="348" y="330" text-anchor="middle" font-size="8" fill="#5a6580">去 query/fragment</text>

<!-- fetch pool -->
<g fill="#efeaf6" stroke="#5b4b8a">
  <rect x="416" y="162" width="24" height="24"/><rect x="446" y="162" width="24" height="24"/><rect x="476" y="162" width="24" height="24"/><rect x="506" y="162" width="24" height="24"/><rect x="536" y="162" width="24" height="24"/>
  <rect x="416" y="192" width="24" height="24"/><rect x="446" y="192" width="24" height="24"/><rect x="476" y="192" width="24" height="24"/><rect x="506" y="192" width="24" height="24"/><rect x="536" y="192" width="24" height="24"/>
  <rect x="416" y="222" width="24" height="24"/><rect x="446" y="222" width="24" height="24"/><rect x="476" y="222" width="24" height="24"/><rect x="506" y="222" width="24" height="24"/><rect x="536" y="222" width="24" height="24"/>
</g>
<text x="416" y="270" font-size="8.5" fill="#5a6580">≤ 15 个 fetch agent</text>
<text x="416" y="288" font-size="8.5" fill="#5a6580">每源抽 2–5 条 claim</text>
<text x="416" y="306" font-size="8" fill="#bf4520">失败 → unreliable</text>
<line x1="392" y1="250" x2="412" y2="250" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f2a)"/>
<text x="402" y="242" text-anchor="middle" font-size="7.5" fill="#5a6580">novel</text>

<text x="196" y="394" font-size="8.5" fill="#5a6580">谁先搜完谁先占槽，不等其他角度</text>

<!-- barrier -->
<line x1="584" y1="110" x2="584" y2="440" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="588" y="102" font-size="9" fill="#bf4520"><tspan font-weight="600">屏障</tspan><tspan>：claim 池必须完整</tspan></text>
<line x1="574" y1="255" x2="600" y2="255" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2a)"/>

<!-- verify -->
<rect x="604" y="140" width="212" height="280" fill="#ffffff" stroke="#bf4520"/>
<text x="620" y="164" font-size="11" font-weight="600" fill="#2d3142">③ Verify</text>
<text x="620" y="182" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#bf4520">25 claims × 3 votes</text>

<rect x="620" y="200" width="40" height="54" fill="#f8eae8" stroke="#9b4b52"/>
<text x="640" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="#2d3142">V1</text>
<text x="640" y="240" text-anchor="middle" font-size="7.5" fill="#5a6580">找反证</text>
<rect x="668" y="200" width="40" height="54" fill="#f8eae8" stroke="#9b4b52"/>
<text x="688" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="#2d3142">V2</text>
<text x="688" y="240" text-anchor="middle" font-size="7.5" fill="#5a6580">找反证</text>
<rect x="716" y="200" width="40" height="54" fill="#f8eae8" stroke="#9b4b52"/>
<text x="736" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="#2d3142">V3</text>
<text x="736" y="240" text-anchor="middle" font-size="7.5" fill="#5a6580">找反证</text>
<text x="776" y="226" font-size="8" fill="#5a6580">同材料</text>
<text x="776" y="242" font-size="8" fill="#5a6580">同模板</text>

<line x1="640" y1="254" x2="640" y2="282" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="688" y1="254" x2="688" y2="282" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>
<line x1="736" y1="254" x2="736" y2="282" stroke="#4f5d75" stroke-width="1" marker-end="url(#f2a)"/>

<rect x="620" y="286" width="180" height="100" fill="#f8eae8" stroke="#9b4b52"/>
<text x="634" y="308" font-size="9.5" font-weight="600" fill="#2d3142">计票</text>
<text x="634" y="328" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#2d3142">refuted ≥ 2 → refuted</text>
<text x="634" y="346" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#2d3142">valid &lt; 2 → unverified</text>
<text x="634" y="364" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#2d3142">其余 → confirmed</text>

<text x="620" y="406" font-size="8" fill="#5a6580">先按 importance、再按来源质量排序</text>

<!-- synth -->
<rect x="840" y="170" width="92" height="180" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="854" y="194" font-size="10.5" font-weight="600" fill="#2d3142">④ Synth</text>
<text x="854" y="214" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5b4b8a">1 agent</text>
<text x="854" y="238" font-size="8" fill="#5a6580">合并语义重复</text>
<text x="854" y="256" font-size="8" fill="#5a6580">按置信度分组</text>
<text x="854" y="274" font-size="8" fill="#5a6580">写 3–5 句摘要</text>
<text x="854" y="292" font-size="8" fill="#5a6580">caveats</text>
<text x="854" y="310" font-size="8" fill="#5a6580">2–4 个 open Q</text>
<line x1="818" y1="255" x2="836" y2="255" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f2a)"/>

<rect x="840" y="380" width="92" height="46" fill="#e9f2ed" stroke="#2f6f5e"/>
<text x="854" y="400" font-size="9" font-weight="600" fill="#2d3142">report</text>
<text x="854" y="416" font-size="7.5" fill="#5a6580">引用到 claim</text>
<line x1="886" y1="350" x2="886" y2="376" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f2a)"/>

<text x="48" y="474" font-size="9.5" fill="#5a6580">Search → Fetch 没有全局屏障：某个角度的结果先到，就先占去重表与抓取槽位。</text>
<text x="48" y="494" font-size="9.5" fill="#5a6580">Verify 前有一条强制屏障：claim 池不完整，排序和取前 25 条就没有意义。</text>
</svg>
