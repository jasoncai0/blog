<text x="804" y="242" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">5 agents</text>

<line x1="708" y1="260" x2="708" y2="270" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="596" y="272" width="224" height="44" fill="#ffffff" stroke="#d8dce6"/>
<rect x="596" y="272" width="3" height="44" fill="#3d5a80"/>
<text x="610" y="298" font-size="10" font-weight="600" fill="#2d3142">Fetch</text>
<text x="804" y="298" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">≤ 15</text>

<line x1="708" y1="316" x2="708" y2="326" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="596" y="328" width="224" height="44" fill="#f8eae8" stroke="#bf4520"/>
<text x="610" y="354" font-size="10" font-weight="600" fill="#2d3142">Verify</text>
<text x="804" y="354" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#bf4520">25 × 3 票</text>

<line x1="708" y1="372" x2="708" y2="382" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="596" y="384" width="224" height="44" fill="#ffffff" stroke="#d8dce6"/>
<rect x="596" y="384" width="3" height="44" fill="#3d5a80"/>
<text x="610" y="410" font-size="10" font-weight="600" fill="#2d3142">Synth</text>
<text x="804" y="410" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">1 agent</text>

<line x1="708" y1="428" x2="708" y2="446" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="596" y="448" width="224" height="44" fill="#e9eff6" stroke="#3d5a80"/>
<text x="610" y="474" font-size="10" font-weight="600" fill="#2d3142">report</text>
<text x="804" y="474" text-anchor="end" font-size="8" fill="#5a6580">claim 级引用</text>

<path d="M820 350 H852 V182 H824" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f5r)"/>
<line x1="847" y1="265" x2="857" y2="275" stroke="#bf4520" stroke-width="1.5"/>
<line x1="847" y1="275" x2="857" y2="265" stroke="#bf4520" stroke-width="1.5"/>
<text x="860" y="258" font-size="8.2" fill="#bf4520">没有回边</text>

<text x="516" y="566" font-size="8.2" fill="#5a6580">预算固定：15 源、25 claim、3 票</text>

<line x1="48" y1="584" x2="912" y2="584" stroke="#e2e6ee"/>
<text x="48" y="602" font-size="8.4" fill="#5a6580">共享骨架：规划 → 并行检索 → 压缩 → 汇总。差别在控制流、状态存放与失败恢复。</text>
