<text x="804" y="186" text-anchor="end" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">1 agent</text>

<line x1="708" y1="204" x2="708" y2="214" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="596" y="216" width="224" height="44" fill="#ffffff" stroke="#d8dce6"/>
<rect x="596" y="216" width="3" height="44" fill="#3d5a80"/>
