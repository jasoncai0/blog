<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f5t f5d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f5t">生产版 Research 与 bundled deep-research 的控制流对比</title>
<desc id="f5d">左侧是 Anthropic 生产版 Research：LeadResearcher 把计划写进 Memory，派 3–5 个子 agent 并行搜索，收回 findings 后判断是否再派一轮，结束后交给 CitationAgent 逐句标引用。右侧是 bundled /deep-research：Scope、Search、Fetch、Verify、Synth 五步固定串联，没有回边，预算固定为 15 个源、25 条 claim、每条 3 票。</desc>
<defs>
  <marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
  <marker id="f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
  <marker id="f5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="48" y="36" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DEEP-RESEARCH / CONTROL FLOW</text>
<text x="48" y="64" font-size="16" font-weight="600" fill="#2d3142">同一副骨架，两种控制流</text>
<text x="48" y="86" font-size="10.5" fill="#5a6580">生产版让 lead 决定要不要再搜一轮；脚本把五步写死</text>

<!-- 左：生产版 -->
<rect x="40" y="104" width="424" height="470" fill="#ffffff" stroke="#e2e6ee"/>
<text x="60" y="126" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.6" letter-spacing="1.2" fill="#5b4b8a">PRODUCTION RESEARCH · ORCHESTRATOR-WORKER</text>
<text x="60" y="146" font-size="8.8" fill="#5a6580">lead 决定继续，还是收尾</text>

<rect x="64" y="160" width="150" height="54" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="76" y="184" font-size="10.5" font-weight="600" fill="#2d3142">LeadResearcher</text>
<text x="76" y="200" font-size="8.2" fill="#5a6580">规划、派活、判断</text>

<rect x="300" y="160" width="124" height="54" fill="#ffffff" stroke="#5b4b8a" stroke-dasharray="3 3"/>
<text x="312" y="184" font-size="10" font-weight="600" fill="#2d3142">Memory</text>
<text x="312" y="200" font-size="8.2" fill="#5a6580">plan 落盘</text>

<line x1="214" y1="180" x2="296" y2="180" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)" marker-start="url(#f5b)"/>
<text x="220" y="172" font-size="8.2" fill="#5a6580">plan 读写</text>

<text x="148" y="240" font-size="8.4" fill="#5a6580">3–5 个并行，各自持有上下文</text>
<rect x="64" y="248" width="356" height="68" fill="#fbfafd" stroke="#5b4b8a" stroke-dasharray="3 3"/>
<rect x="78" y="260" width="104" height="46" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="90" y="282" font-size="9" font-weight="600" fill="#2d3142">Subagent 1</text>
<text x="90" y="296" font-size="7.6" fill="#5a6580">搜一个方向</text>
<rect x="196" y="260" width="104" height="46" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="208" y="282" font-size="9" font-weight="600" fill="#2d3142">Subagent 2</text>
<text x="208" y="296" font-size="7.6" fill="#5a6580">搜一个方向</text>
<rect x="314" y="260" width="104" height="46" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="326" y="282" font-size="9" font-weight="600" fill="#2d3142">Subagent 3</text>
<text x="326" y="296" font-size="7.6" fill="#5a6580">搜一个方向</text>

<line x1="139" y1="214" x2="139" y2="246" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)" marker-start="url(#f5b)"/>

<line x1="139" y1="316" x2="139" y2="334" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>
<text x="147" y="328" font-size="8.2" fill="#5a6580">汇总</text>

<polygon points="139,336 219,368 139,400 59,368" fill="#f7efe4" stroke="#bf4520"/>
<text x="139" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">够了吗？</text>

<path d="M59 368 H46 V180 H62" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f5r)"/>
<text x="60" y="228" font-size="8.2" fill="#bf4520">否：再派一轮</text>

<line x1="139" y1="400" x2="139" y2="428" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>
<text x="146" y="416" font-size="8" fill="#5a6580">是</text>

<rect x="64" y="430" width="170" height="48" fill="#ffffff" stroke="#5b4b8a"/>
<text x="76" y="454" font-size="10" font-weight="600" fill="#2d3142">CitationAgent</text>
<text x="76" y="470" font-size="8.2" fill="#5a6580">循环结束后定位引用</text>

<line x1="139" y1="478" x2="139" y2="504" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f5a)"/>

<rect x="64" y="506" width="170" height="46" fill="#e9eff6" stroke="#3d5a80"/>
<text x="76" y="530" font-size="10" font-weight="600" fill="#2d3142">报告 + 引用</text>
<text x="76" y="546" font-size="8.2" fill="#5a6580">回到主会话</text>

<text x="64" y="566" font-size="8.2" fill="#5a6580">计划先写 Memory：200k 上下文会截断</text>

<!-- 右：bundled 脚本 -->
<rect x="496" y="104" width="424" height="470" fill="#ffffff" stroke="#e2e6ee"/>
<text x="516" y="126" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="7.6" letter-spacing="1.2" fill="#3d5a80">BUNDLED /DEEP-RESEARCH · FIXED DAG</text>
<text x="516" y="146" font-size="8.8" fill="#5a6580">五步写死，没有回边</text>

<rect x="596" y="160" width="224" height="44" fill="#ffffff" stroke="#d8dce6"/>
<rect x="596" y="160" width="3" height="44" fill="#3d5a80"/>
