<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-d4-title f01-d4-desc">
  <title id="f01-d4-title">状态归属与一次断线重连</title>
  <desc id="f01-d4-desc">左侧把状态分成三层：不依赖 React 的 object layer、声明出来的 store、组件局部 state。右侧是重连时序：物理连接恢复后 Connection 发布新代际，每个逻辑流各自重开，Session 用 opening snapshot 整窗替换，缺口用 page() 补。</desc>
  <defs>
    <marker id="f01-d4-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#8a93a6"/>
    </marker>
    <marker id="f01-d4-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">STATE OWNERSHIP · RECONNECT</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">重连之后，消息数组从哪里来</text>
  <text x="48" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#4f5d75">客户端不缓存「已渲染的对话」，只缓存一段连续事件窗口；断线期间窗口不动，重连后用新快照替换。</text>

  <!-- ownership column -->
  <rect x="48" y="124" width="248" height="344" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="64" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#bf4520">状态归属</text>

  <text x="64" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">object layer（无 React）</text>
  <text x="64" y="192" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">connection 的代际</text>
  <text x="64" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ClientSessions → Session</text>
  <text x="64" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ClientWorkspaceModel</text>
  <text x="64" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">job / subagent catalog</text>

  <line x1="64" y1="254" x2="280" y2="254" stroke="#e3e3e3"/>

  <text x="64" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">声明的 store</text>
  <text x="64" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">选中、草稿、面板宽度</text>
  <text x="64" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">跨 entry、跨重挂，重启清零</text>

  <line x1="64" y1="326" x2="280" y2="326" stroke="#e3e3e3"/>

  <text x="64" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">组件局部 state</text>
  <text x="64" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">展开、hover、焦点</text>
  <text x="64" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">倒计时的本地起点</text>
  <text x="64" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">组件不知道连接存在，</text>
  <text x="64" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">所以重连不需要它参与。</text>
  <text x="64" y="444" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">业务数据不进 store。</text>

  <!-- lanes -->
  <text x="440" y="150" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">Connection</text>
  <text x="660" y="150" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">Session window</text>
  <text x="860" y="150" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">Host</text>
  <line x1="440" y1="164" x2="440" y2="470" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="660" y1="164" x2="660" y2="470" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="860" y1="164" x2="860" y2="470" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 1 resume -->
  <text x="650" y="192" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">mux 恢复物理连接</text>
  <path d="M 860 200 H 440" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-a)"/>

  <!-- 2 generation -->
  <text x="550" y="226" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">generation + 1，每流各自重开</text>
  <path d="M 440 234 H 660" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-a)"/>

  <!-- 3 snapshot -->
  <text x="760" y="258" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">opening snapshot（seq range）</text>
  <path d="M 860 266 H 660" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-a)"/>

  <!-- 4 replace self loop -->
  <path d="M 660 298 H 700 V 320 H 660" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-b)"/>
  <text x="712" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">整窗 replace</text>
  <text x="712" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">按 seq 重放，先 start</text>

  <!-- 5 page -->
  <text x="550" y="352" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">page() 补更早历史 / 修 range 缺口</text>
  <path d="M 660 360 H 440" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-a)"/>

  <!-- 6 baseline -->
  <text x="650" y="384" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">control 与 workspace 的新 baseline</text>
  <path d="M 860 392 H 440" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f01-d4-a)"/>
  <text x="448" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">旧值先留着，新 baseline 到达后原子替换。</text>

  <text x="440" y="444" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">不 replay 普通通知</text>
  <text x="660" y="444" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">窗口按代际替换</text>
  <text x="860" y="444" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">域自己提供 baseline</text>

  <!-- note -->
  <rect x="48" y="486" width="864" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="64" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">没有统一的 resync()：物理链路由 mux 恢复，逻辑流各自重开；Session 用 opening snapshot 替换窗口，control 与 workspace 保留最后值等新 baseline。</text>
  <text x="64" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">普通 forwarded notification 不重放；需要可靠恢复的域必须自带 baseline、cursor 或一条显式 query。断开期间界面继续用旧值渲染。</text>
  <text x="64" y="546" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">client/connection · api/session-controller/src/client · ui-conversation assembler flushReplacement</text>

  <text x="48" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">判断恢复逻辑归谁，只要看这份状态在断线时还能不能读到：能读到的是 object layer，读不到的是组件局部。</text>
</svg>
