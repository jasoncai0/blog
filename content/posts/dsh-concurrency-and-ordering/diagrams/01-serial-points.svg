<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f05-d1-title f05-d1-desc">
  <title id="f05-d1-title">四个串行点与三个并发面</title>
  <desc id="f05-d1-desc">左边四个串行点分别守着 driver 相位、inbox 领取、会话追加和批次提交；右边三个面没有共享可变状态，可以安全重叠。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">SERIAL vs PARALLEL</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">四个串行点，三个可以重叠的面</text>
  <text x="48" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">串行点都落在共享状态的边界上；能重叠的地方恰好都不共享可变状态。</text>

  <text x="48" y="124" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">串行点 / 同时只允许一个进入者</text>
  <text x="492" y="124" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">并发面 / 不需要协调</text>

  <!-- serial 1 -->
  <rect x="48" y="140" width="420" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="48" y="140" width="4" height="92" rx="2" fill="#bf4520"/>
  <text x="68" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142">driver</text>
  <text x="132" y="168" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">每 agent</text>
  <text x="68" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">phase.kind !== 'idle'</text>
  <text x="68" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">守不住：两个 turn 交错，step 计数错乱</text>

  <!-- serial 2 -->
  <rect x="48" y="244" width="420" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="48" y="244" width="4" height="92" rx="2" fill="#bf4520"/>
  <text x="68" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142">inbox</text>
  <text x="128" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">每 agent</text>
  <text x="68" y="294" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">claim() → agent/inbox/spliced</text>
  <text x="68" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">守不住：同一条消息被两轮各领一次</text>

  <!-- serial 3 -->
  <rect x="48" y="348" width="420" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="48" y="348" width="4" height="92" rx="2" fill="#bf4520"/>
  <text x="68" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142">session</text>
  <text x="140" y="376" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">每 session</text>
  <text x="68" y="398" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">entry.appending</text>
  <text x="68" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">守不住：seq 撞号，投影错位</text>

  <!-- serial 4 -->
  <rect x="48" y="452" width="420" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="48" y="452" width="4" height="92" rx="2" fill="#bf4520"/>
  <text x="68" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142">tool batch</text>
  <text x="166" y="480" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">每 group</text>
  <text x="68" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">committed 只跨连续槽位</text>
  <text x="68" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">守不住：结果顺序与模型给出的一致不了</text>

  <!-- parallel 1 -->
  <rect x="492" y="140" width="420" height="124" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <circle cx="512" cy="166" r="4" fill="#5a6580"/>
  <text x="526" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">同批不同调用</text>
  <text x="512" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">dispatch 与 body 重叠，pre-execute 仍排队。</text>
  <text x="512" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">上限由批次参数或执行器配置给，默认 10。</text>
  <text x="512" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">maxParallelToolCalls</text>

  <!-- parallel 2 -->
  <rect x="492" y="280" width="420" height="124" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <circle cx="512" cy="306" r="4" fill="#5a6580"/>
  <text x="526" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">不同 agent</text>
  <text x="512" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">各自独立的 session 与 driver，唯一的共享</text>
  <text x="512" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">点是父 agent 的投递队列。</text>
  <text x="512" y="380" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">ChildLock 按子会话加锁</text>

  <!-- parallel 3 -->
  <rect x="492" y="420" width="420" height="124" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <circle cx="512" cy="446" r="4" fill="#5a6580"/>
  <text x="526" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">工具内部</text>
  <text x="512" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">后台 job、子进程、长轮询各自异步，</text>
  <text x="512" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">对外只暴露一个结算事件。</text>
  <text x="512" y="520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">job/registered → job/settled</text>

  <text x="48" y="576" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">判断标准很简单：两个执行者会不会读到同一份可变状态。会，就串行；不会，就可以重叠。</text>
</svg>
