<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">Agent 的一次任务循环</title>
<desc id="f3d">人给出目标，Agent 读状态选工具，工具作用于环境，环境返回 ground truth；未完成则继续循环，完成或受阻时进入人工检查点。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
  <marker id="f3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b4b8a"/></marker>
  <marker id="f3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f5e"/></marker>
  <marker id="f3o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8752a"/></marker>
</defs>
<rect width="960" height="580" fill="#f5f5f5"/>

<text x="56" y="44" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">AGENT LOOP / WHO DECIDES WHEN</text>
<text x="56" y="70" font-size="16" font-weight="600" fill="#2d3142">一次 agent 任务：模型在循环里做决定，人在检查点介入</text>
<text x="56" y="90" font-size="10.5" fill="#5a6580">实线是调用，虚线是回传；循环的每一步都要拿到环境里的真实结果</text>

<!-- lifelines -->
<line x1="155" y1="168" x2="155" y2="520" stroke="#b8bfcc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="376" y1="168" x2="376" y2="520" stroke="#b8bfcc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="615" y1="168" x2="615" y2="520" stroke="#b8bfcc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="840" y1="168" x2="840" y2="520" stroke="#b8bfcc" stroke-width="1" stroke-dasharray="4 4"/>

<!-- participants -->
<rect x="80" y="124" width="150" height="44" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/>
<text x="155" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">人</text>
<text x="155" y="160" text-anchor="middle" font-size="8.5" fill="#5a6580">目标 · 验收 · 判断</text>
<rect x="286" y="124" width="180" height="44" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="376" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">Agent（LLM）</text>
<text x="376" y="160" text-anchor="middle" font-size="8.5" fill="#5a6580">计划 · 选工具 · 读结果</text>
<rect x="540" y="124" width="150" height="44" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<text x="615" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">工具</text>
<text x="615" y="160" text-anchor="middle" font-size="8.5" fill="#5a6580">读文件 · 跑测试 · 改代码</text>
<rect x="760" y="124" width="160" height="44" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<text x="840" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3142">环境</text>
<text x="840" y="160" text-anchor="middle" font-size="8.5" fill="#5a6580">代码库 · 浏览器 · 外部 API</text>

<!-- 1 -->
<text x="160" y="197" font-size="9" fill="#a8752a">① 目标 + 验收标准</text>
<line x1="159" y1="205" x2="282" y2="205" stroke="#a8752a" stroke-width="1.4" marker-end="url(#f3o)"/>

<!-- 2 -->
<line x1="376" y1="247" x2="392" y2="247" stroke="#5b4b8a" stroke-width="1.2"/>
<circle cx="376" cy="247" r="2.4" fill="#5b4b8a"/>
<rect x="392" y="232" width="238" height="30" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
<text x="404" y="251" font-size="9.5" fill="#2d3142">② 读当前状态，选下一个工具</text>

<!-- loop frame -->
<rect x="300" y="268" width="562" height="118" fill="none" stroke="#b8bfcc" stroke-width="1" stroke-dasharray="5 4"/>
<text x="850" y="282" text-anchor="end" font-size="8.5" fill="#8a93a6">循环，直到完成或触发停止条件</text>

<!-- 3 -->
<text x="392" y="287" font-size="9" fill="#5b4b8a">③ tool_use(参数)</text>
<line x1="380" y1="295" x2="536" y2="295" stroke="#5b4b8a" stroke-width="1.4" marker-end="url(#f3p)"/>

<!-- 4 -->
<text x="642" y="317" font-size="9" fill="#4f5d75">④ 执行</text>
<line x1="619" y1="325" x2="756" y2="325" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#f3a)"/>

<!-- 5 -->
<text x="430" y="360" font-size="9" fill="#2f6f5e">⑤ ground truth：测试结果 / 报错 / 页面状态</text>
<line x1="836" y1="368" x2="382" y2="368" stroke="#2f6f5e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#f3g)"/>

<!-- decision -->
<path d="M376 416 L436 440 L376 464 L316 440 Z" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
<text x="376" y="444" text-anchor="middle" font-size="9.5" fill="#bf4520">完成？</text>
<line x1="376" y1="414" x2="376" y2="388" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="388" y="404" font-size="9" fill="#bf4520">否：带着新信息继续</text>

<!-- human checkpoint -->
<text x="168" y="432" font-size="9" fill="#a8752a">是 / 受阻：检查点</text>
<line x1="314" y1="440" x2="163" y2="440" stroke="#a8752a" stroke-width="1.4" marker-end="url(#f3o)"/>
<text x="168" y="470" font-size="9" fill="#a8752a">确认 / 修正目标</text>
<line x1="159" y1="478" x2="368" y2="478" stroke="#a8752a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#f3o)"/>

<text x="404" y="502" font-size="9.5" fill="#5a6580">结束，或按新目标开下一轮</text>

<text x="56" y="546" font-size="10" fill="#9b4b52">停止条件：没有工具调用 · 最大轮数 · 预算 / 超时。三者都不设，循环不会自己停。</text>
<text x="56" y="566" font-size="8.5" fill="#8a93a6">依据：Anthropic《Building effective agents》"Agents" 一节；检查点与停止条件按原文补画。</text>
</svg>
