<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">四档复杂度阶梯</title>
<desc id="f1d">从单次调用、增强 LLM、工作流到 Agent 四档，每档给出形态和升档信号；越往上自主性和成本越高。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>

<text x="56" y="44" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">AGENTIC SYSTEMS / FOUR RUNGS</text>
<text x="56" y="70" font-size="16" font-weight="600" fill="#2d3142">四档复杂度：从一次调用到自主循环</text>
<text x="56" y="90" font-size="10.5" fill="#5a6580">每往上一档，延迟、成本、失败面都增加；升档要有信号，不是有工具就往上堆</text>

<!-- L3 Agent -->
<rect x="56" y="112" width="848" height="76" fill="#f8eae8"/>
<rect x="56" y="112" width="4" height="76" fill="#9b4b52"/>
<text x="76" y="160" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="24" fill="#9b4b52">03</text>
<text x="124" y="140" font-size="14.5" font-weight="600" fill="#2d3142">Agent（自主循环）</text>
<text x="124" y="160" font-size="10" fill="#4f5d75">模型在循环里决定下一步，靠环境反馈推进（见图 3）</text>
<text x="124" y="176" font-size="10" fill="#5a6580">步数不可预知才用；成本与错误随轮数累积</text>

<!-- L2 Workflow -->
<rect x="56" y="218" width="848" height="76" fill="#efeaf6"/>
<rect x="56" y="218" width="4" height="76" fill="#5b4b8a"/>
<text x="76" y="266" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="24" fill="#5b4b8a">02</text>
<text x="124" y="246" font-size="14.5" font-weight="600" fill="#2d3142">工作流（Workflow）</text>
<text x="124" y="266" font-size="10" fill="#4f5d75">代码写死路径，五种拓扑（见图 2）</text>
<text x="124" y="282" font-size="10" fill="#5a6580">延迟可预测，每步能单独校验；拆错边界会丢上下文</text>

<!-- L1 Augmented LLM -->
<rect x="56" y="324" width="848" height="76" fill="#e9eff6"/>
<rect x="56" y="324" width="4" height="76" fill="#3d5a80"/>
<text x="76" y="372" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="24" fill="#3d5a80">01</text>
<text x="124" y="352" font-size="14.5" font-weight="600" fill="#2d3142">增强 LLM（Augmented LLM）</text>
<text x="124" y="372" font-size="10" fill="#4f5d75">同一次调用里给工具、记忆、检索接口，由模型决定用哪个</text>
<text x="124" y="388" font-size="10" fill="#5a6580">适合需要外部事实、或要真的执行动作的任务</text>

<!-- L0 Single call -->
<rect x="56" y="430" width="848" height="76" fill="#e9eff6"/>
<rect x="56" y="430" width="4" height="76" fill="#3d5a80"/>
<text x="76" y="478" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="24" fill="#3d5a80">00</text>
<text x="124" y="458" font-size="14.5" font-weight="600" fill="#2d3142">单次调用</text>
<text x="124" y="478" font-size="10" fill="#4f5d75">一个提示词 + 检索结果 + 少量示例</text>
<text x="124" y="494" font-size="10" fill="#5a6580">分类、抽取、改写、带资料问答多数停在这里</text>

<!-- upgrade signals -->
<text x="124" y="422" font-size="10" fill="#bf4520"><tspan font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">↑</tspan>  单次回答缺外部事实，或需要真的执行动作</text>
<text x="124" y="316" font-size="10" fill="#bf4520"><tspan font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">↑</tspan>  步骤固定、能拆、每步有可程序的校验</text>
<text x="124" y="210" font-size="10" fill="#bf4520"><tspan font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">↑</tspan>  步数无法预知，必须按环境反馈改计划</text>

<!-- axis -->
<text transform="rotate(-90 30 320)" x="30" y="320" text-anchor="middle" font-size="9" fill="#5a6580">越往上：自主性、成本升高，可预测性降低</text>

<text x="56" y="556" font-size="10.5" fill="#4f5d75">原文的建议：先找最简解，复杂度只在能证明提升结果时才加。</text>
<text x="56" y="578" font-size="8.5" fill="#8a93a6">依据：Anthropic《Building effective agents》"When (and when not) to use agents" 与 Summary 两节；分档与升档信号由本文归纳。</text>
</svg>
