<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">DSH 多 Agent 编排的状态归属</title>
<desc id="f1d">模型写计划并决定下一步；工具面把变更追加到根 Session 的事件日志；投影从日志重建任务状态；调度设施只在 agent 空闲、树排空等条件满足时，把下一条消息放进 inbox。右侧列出这套实现里不存在的组件：计划对象、step 预算、replan API、任务变更唤醒。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="40" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">DSH / MULTI-AGENT ORCHESTRATION</text>
<text x="40" y="66" font-size="16" font-weight="600" fill="#2d3142">计划归模型，状态归日志，唤醒归 inbox</text>
<text x="40" y="88" font-size="10.5" fill="#5a6580">四者之间没有编排器；每个箭头都是一次显式的读写或投递</text>

<!-- 模型 -->
<rect x="40" y="112" width="252" height="128" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="112" width="4" height="128" fill="#3d5a80"/>
<text x="60" y="138" font-size="12" font-weight="600" fill="#2d3142">模型</text>
<text x="60" y="156" font-size="9.5" fill="#5a6580">写计划，也决定下一步做什么</text>
<text x="60" y="182" font-size="9.5" fill="#4f5d75">todo_write：本轮清单</text>
<text x="60" y="200" font-size="9.5" fill="#4f5d75">team_task_*：任务与依赖</text>
<text x="60" y="218" font-size="9.5" fill="#4f5d75">workflow 脚本 / goal 目标</text>

<!-- 工具面 -->
<rect x="332" y="112" width="252" height="128" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="332" y="112" width="4" height="128" fill="#5b4b8a"/>
<text x="352" y="138" font-size="12" font-weight="600" fill="#2d3142">工具面</text>
<text x="352" y="156" font-size="9.5" fill="#5a6580">入参校验、权限、CAS</text>
<text x="352" y="182" font-size="9.5" fill="#4f5d75">TeamTaskBoard</text>
<text x="352" y="200" font-size="9.5" fill="#4f5d75">todo / WorkflowEngine</text>
<text x="352" y="218" font-size="9.5" fill="#4f5d75">GoalService</text>

<!-- 日志 -->
<rect x="332" y="344" width="252" height="160" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<text x="352" y="370" font-size="12" font-weight="600" fill="#2d3142">根 Session 事件日志</text>
<text x="352" y="388" font-size="9.5" fill="#5a6580">唯一权威；只追加</text>
<text x="352" y="412" font-size="8.5" fill="#2f6f5e" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">team/task (v2) · todo/write</text>
<text x="352" y="429" font-size="8.5" fill="#2f6f5e" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">goal/change · agent/inbox/spliced</text>
<text x="352" y="446" font-size="8.5" fill="#2f6f5e" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace">subagent/start · subagent/end</text>
<text x="352" y="472" font-size="9.5" fill="#4f5d75">投影按 seq 重建任务板、goal、inbox</text>
<text x="352" y="490" font-size="9.5" fill="#4f5d75">内存里没有第二份任务表</text>

<!-- 调度 -->
<rect x="40" y="344" width="252" height="160" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="344" width="4" height="160" fill="#bf4520"/>
<text x="60" y="370" font-size="12" font-weight="600" fill="#2d3142">调度设施</text>
<text x="60" y="388" font-size="9.5" fill="#5a6580">只做唤醒与围栏</text>
<text x="60" y="414" font-size="9.5" fill="#4f5d75">inbox：next-turn / next-step</text>
<text x="60" y="432" font-size="9.5" fill="#4f5d75">settlement：idle→queue，running→steer</text>
<text x="60" y="450" font-size="9.5" fill="#4f5d75">goal driver：idle + 树排空→followup</text>
<text x="60" y="476" font-size="9.5" fill="#4f5d75">flush、轮次额度、CAS 围栏</text>

<!-- 箭头 -->
<line x1="294" y1="176" x2="326" y2="176" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="310" y="168" text-anchor="middle" font-size="8.5" fill="#5a6580">tool call</text>

<line x1="458" y1="242" x2="458" y2="338" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="466" y="288" font-size="8.5" fill="#5a6580">append</text>
<text x="466" y="300" font-size="8.5" fill="#5a6580">+ flush</text>

<line x1="330" y1="424" x2="298" y2="424" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="314" y="416" text-anchor="middle" font-size="8.5" fill="#5a6580">投影</text>

<line x1="166" y1="342" x2="166" y2="246" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<text x="174" y="290" font-size="8.5" fill="#5a6580">followup</text>
<text x="174" y="302" font-size="8.5" fill="#5a6580">/ steer</text>

<!-- 缺席 -->
<rect x="624" y="112" width="296" height="392" fill="#f8eae8" stroke="#9b4b52" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="648" y="142" font-size="12" font-weight="600" fill="#9b4b52">这套实现里不存在的组件</text>

<text x="648" y="176" font-size="10" font-weight="600" fill="#2d3142">✕ 计划对象 / DAG 调度器</text>
<text x="648" y="194" font-size="9" fill="#4f5d75">没有谁持有「第 3 步之后做第 4 步」</text>

<text x="648" y="230" font-size="10" font-weight="600" fill="#2d3142">✕ step 预算</text>
<text x="648" y="248" font-size="9" fill="#4f5d75">turn 只在没有下一步时退出，不限步数</text>

<text x="648" y="284" font-size="10" font-weight="600" fill="#2d3142">✕ replan API / 钩子</text>
<text x="648" y="302" font-size="9" fill="#4f5d75">源码里搜不到 replan 这个概念</text>

<text x="648" y="338" font-size="10" font-weight="600" fill="#2d3142">✕ 任务变更 → 唤醒</text>
<text x="648" y="356" font-size="9" fill="#4f5d75">写日志，不发消息，不起 agent</text>

<line x1="648" y1="384" x2="896" y2="384" stroke="#e2c9c6"/>
<text x="648" y="410" font-size="9.5" fill="#4f5d75">「重规划」不是被调用的函数，</text>
<text x="648" y="428" font-size="9.5" fill="#4f5d75">是模型下一轮读到新状态后的选择。</text>
<text x="648" y="462" font-size="8.5" fill="#8a93a6">所以源码里找不到「计划失效」的判断。</text>
<text x="648" y="480" font-size="8.5" fill="#8a93a6">只有把新输入送到的机制。</text>

<line x1="40" y1="536" x2="920" y2="536" stroke="#dfe3ea"/>
<text x="40" y="562" font-size="10.5" fill="#3d5a80">调度回答「什么时候再给模型一轮」；计划回答「这一轮做什么」。</text>
<text x="40" y="582" font-size="9.5" fill="#5a6580">DSH 把前半句写进代码，把后半句留给模型。</text>
</svg>
