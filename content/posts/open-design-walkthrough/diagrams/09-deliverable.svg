<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="delTitle delDesc" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <title id="delTitle">一次 deck 生成留下的文件，以及谁在读它们</title>
  <desc id="delDesc">左侧是项目目录：入口文件、静态资源、artifact 边车、.od-skills 副本、.live-artifacts 目录。右侧是边车 manifest 的字段。底部四张卡片说明预览、产物列表、导出、下一轮各自读哪些文件。run 的 state.json 与 events.jsonl 在数据根，不在项目目录。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="36" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DELIVERABLES · projects.ts:73 · manifest.ts:217</text>
  <text x="36" y="62" font-size="16" font-weight="600" fill="#2d3142">产物落在哪，谁在读它</text>
  <text x="924" y="38" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">Normal Artifact = 入口文件 + 边车</text>

  <!-- 项目目录 -->
  <rect x="36" y="80" width="464" height="268" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="52" y="100" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#5a6580">项目目录</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">
    <text x="52" y="122">&lt;PROJECTS_DIR&gt;/&lt;projectId&gt;/</text>
    <text x="52" y="142">├─ index.html</text>
    <text x="52" y="162">├─ deck.css · assets/</text>
    <text x="52" y="182">├─ index.html.artifact.json</text>
    <text x="52" y="202">├─ .od-skills/deck-swiss-international-3f9a1c2b7d/</text>
    <text x="52" y="222">│    └─ SKILL.md · references/</text>
    <text x="52" y="242">└─ .live-artifacts/&lt;id&gt;/</text>
  </g>

  <g font-size="8.5" fill="#5a6580">
    <text x="336" y="142">入口文件，deck 第 1 页</text>
    <text x="336" y="162">其余页面与图片</text>
    <text x="336" y="182">边车，右边那个 JSON</text>
    <text x="336" y="222">本轮生效的 skill 副本</text>
    <text x="336" y="242">仅刷新型产物</text>
  </g>

  <line x1="52" y1="262" x2="484" y2="262" stroke="rgba(45,49,66,0.12)"/>
  <text x="52" y="284" font-size="8.5" fill="#5a6580">agent 只写普通文件；边车、skill 副本、live 目录都由 daemon 写。</text>
  <text x="52" y="302" font-size="8.5" fill="#5a6580">skill 副本是真拷贝，agent 改它不会动到仓库里的 skills/。</text>
  <text x="52" y="326" font-size="8.5" fill="#bf4520">目录面板不显示 .od-skills 与 .live-artifacts；ZIP 打包同样跳过。</text>

  <!-- manifest -->
  <text x="524" y="100" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#5a6580">index.html.artifact.json</text>
  <rect x="524" y="110" width="400" height="238" fill="#2d3142"/>
  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#c9cedb">
    <text x="540" y="132">{</text>
    <text x="540" y="150">"version": 1,</text>
    <text x="540" y="168">"kind": "deck",</text>
    <text x="540" y="186">"entry": "index.html",</text>
    <text x="540" y="204">"status": "complete",</text>
    <text x="540" y="222">"exports": ["pptx", "pdf", "html", "zip"],</text>
    <text x="540" y="240">"sourceSkillId": "deck-swiss-international",</text>
    <text x="540" y="258">"supportingFiles": ["deck.css", "assets/…"],</text>
    <text x="540" y="276">"renderer": "html",</text>
    <text x="540" y="294">"updatedAt": "2026-11-18T14:02:11.000Z"</text>
    <text x="540" y="312">}</text>
  </g>
  <text x="540" y="338" font-size="8.5" fill="#8f97ab">entry 与 supportingFiles 都是相对路径，≤260 字符，不许出现 ..</text>

  <!-- 消费者 -->
  <rect x="36" y="372" width="212" height="106" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="50" y="392" font-size="10" font-weight="600" fill="#2d3142">预览 iframe</text>
  <text x="50" y="410" font-size="8.5" fill="#4f5d75">读 entry 与它的同级资源</text>
  <text x="50" y="426" font-size="8.5" fill="#4f5d75">URL 模式，换 ?v=mtime 重载</text>
  <text x="50" y="442" font-size="8.5" fill="#4f5d75">deck 导航要走 srcDoc + 宿主桥</text>
  <text x="50" y="462" font-size="8.5" fill="#bf4520">没有 allow-same-origin</text>

  <rect x="260" y="372" width="212" height="106" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="274" y="392" font-size="10" font-weight="600" fill="#2d3142">产物列表</text>
  <text x="274" y="410" font-size="8.5" fill="#4f5d75">读边车的 kind / title / status</text>
  <text x="274" y="426" font-size="8.5" fill="#4f5d75">一个文件只对应一个边车</text>
  <text x="274" y="442" font-size="8.5" fill="#4f5d75">两张卡片不会指向同一个入口</text>
  <text x="274" y="462" font-size="8.5" fill="#5a6580">没有边车的文件不进列表</text>

  <rect x="484" y="372" width="212" height="106" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="498" y="392" font-size="10" font-weight="600" fill="#2d3142">导出</text>
  <text x="498" y="410" font-size="8.5" fill="#4f5d75">读 entry + supportingFiles</text>
  <text x="498" y="426" font-size="8.5" fill="#4f5d75">PPTX 每页一张整幅位图</text>
  <text x="498" y="442" font-size="8.5" fill="#4f5d75">PDF 走 Electron printToPDF</text>
  <text x="498" y="462" font-size="8.5" fill="#5a6580">HTML 单文件内联本地依赖</text>

  <rect x="708" y="372" width="216" height="106" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="722" y="392" font-size="10" font-weight="600" fill="#2d3142">下一轮 run</text>
  <text x="722" y="410" font-size="8.5" fill="#4f5d75">读 .od-skills 副本与 DESIGN.md</text>
  <text x="722" y="426" font-size="8.5" fill="#4f5d75">不读边车，边车只是索引</text>
  <text x="722" y="442" font-size="8.5" fill="#4f5d75">上一轮的 summary 进对话历史</text>
  <text x="722" y="462" font-size="8.5" fill="#5a6580">改过的文件顺带成为上下文</text>

  <text x="36" y="504" font-size="9" fill="#5a6580">run 的 state.json 与 events.jsonl 不在这里，在数据根 &lt;data&gt;/runs/&lt;runId&gt;/。</text>
  <text x="36" y="520" font-size="9" fill="#5a6580">文件版本没有保留策略，live 快照只增不减，产物也没有 GC，这是 §8 里那条「存储只进不出」。</text>
</svg>
