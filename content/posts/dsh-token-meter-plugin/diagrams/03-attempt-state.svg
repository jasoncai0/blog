<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">一次 turn 的尝试状态机</title>
<desc id="f03-desc">缺任何一个边界，整轮 usage 返回 undefined；不做部分扣减。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TOKEN METER / ATTEMPT</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">四个状态，五条边</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">attempt 是计价单位，turn 是汇总单位。</text>
<rect x="60" y="190" width="150" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">idle</text><rect x="300" y="190" width="170" height="70" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="312" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">open</text><text x="312" y="225" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">step/start 或 retry-started</text><rect x="580" y="120" width="190" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="592" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">finishClosed</text><text x="592" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">assistant/attempt 结算</text><rect x="580" y="270" width="190" height="70" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="592" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">settled(by message)</text><text x="592" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">assistant/message</text><rect x="580" y="370" width="190" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="592" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">settled(by retry)</text><text x="592" y="405" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">llm/retry</text><line x1="210" y1="215" x2="300" y2="215" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><text x="212" y="206" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">step/start</text><line x1="470" y1="205" x2="580" y2="160" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><text x="478" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">assistant/attempt</text><line x1="470" y1="236" x2="580" y2="300" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><text x="478" y="282" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">assistant/message</text><line x1="675" y1="190" x2="675" y2="270" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><text x="684" y="236" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">llm/retry</text><line x1="675" y1="340" x2="675" y2="370" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><line x1="580" y1="400" x2="470" y2="250" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f03-g)"/><text x="470" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">llm/retry-started</text><line x1="300" y1="260" x2="210" y2="240" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f03-g)"/><text x="214" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">step/end</text><text x="60" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">越界（turn 不符、step 不符、重复 open）一律 invalid，最终返回 undefined。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / ATTEMPT</text>
</svg>
