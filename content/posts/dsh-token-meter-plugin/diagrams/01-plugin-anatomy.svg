<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">插件解剖：一个服务、四个投影、一个监听</title>
<desc id="f01-desc">会话日志是唯一输入；投影把事件折叠成带检查点的状态；服务只做读取与定价。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TOKEN METER / ANATOMY</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">计费插件不拦截请求，它重建事实</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">四类 token 桶与路由定价都从持久事件里算出来。</text>
<text x="40" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">SESSION LOG</text><rect x="40" y="128" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="145" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">turn/start</text><rect x="40" y="162" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="179" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">step/start</text><rect x="40" y="196" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="213" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">request/header</text><rect x="40" y="230" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="247" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">assistant/message</text><rect x="40" y="264" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="281" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">assistant/attempt</text><rect x="40" y="298" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="315" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">llm/retry</text><rect x="40" y="332" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="349" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">image/offload</text><rect x="40" y="366" width="190" height="26" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="383" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">turn/end</text><text x="40" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">只追加；投影消费 seq，不修改日志。</text><text x="40" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">每条事件都是计费的证据。</text><rect x="300" y="124" width="250" height="110" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="312" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Projection · measurement</text><text x="312" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">锚点 header / 节点 / usage</text><text x="312" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">检查点带 seq，校验失败即重算</text><rect x="300" y="250" width="250" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Projection · tokenUsage</text><text x="312" y="285" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">四类桶：输入 / 输出 / 缓存读 / 缓存写</text><rect x="300" y="358" width="250" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Projection · pressure / breakdown</text><text x="312" y="393" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">prompt 大小与窗口、按来源拆分</text><rect x="620" y="124" width="300" height="110" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="632" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Service · ctx.tokenMeter</text><text x="632" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">measure(session, header?)</text><text x="632" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">deriveTurnTokenUsage(events)</text><rect x="620" y="258" width="300" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Consumers</text><text x="632" y="293" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">UI 面板、统计</text><text x="632" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">压缩决策读 pressure</text><rect x="620" y="366" width="300" height="84" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Client · 纯函数导出</text><text x="632" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">同一套折叠，浏览器可重算</text><line x1="232" y1="170" x2="300" y2="170" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="232" y1="296" x2="300" y2="296" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="232" y1="404" x2="300" y2="404" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="550" y1="178" x2="620" y2="178" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="550" y1="296" x2="620" y2="296" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="550" y1="404" x2="620" y2="404" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / ANATOMY</text>
</svg>
