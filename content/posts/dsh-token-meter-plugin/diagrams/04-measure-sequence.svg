<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">一次请求的记账时序</title>
<desc id="f04-desc">usage 只在结算时落库；投影读日志；UI 读投影快照，带 logRevision。</desc>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TOKEN METER / SEQUENCE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">从一帧到一行数字</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">流式帧是瞬时的，账单是持久的。</text>
<rect x="26" y="96" width="128" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="90" y="112" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#4f5d75">PROVIDER</text><line x1="90" y1="124" x2="90" y2="512" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="196" y="96" width="128" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="260" y="112" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#4f5d75">AGENT LOOP</text><line x1="260" y1="124" x2="260" y2="512" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="376" y="96" width="128" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="440" y="112" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#4f5d75">SESSION LOG</text><line x1="440" y1="124" x2="440" y2="512" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="556" y="96" width="128" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="620" y="112" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#4f5d75">PROJECTION</text><line x1="620" y1="124" x2="620" y2="512" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="756" y="96" width="128" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="820" y="112" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#4f5d75">UI</text><line x1="820" y1="124" x2="820" y2="512" stroke="#d8d8d8" stroke-dasharray="3 4"/><line x1="290" y1="150" x2="440" y2="150" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="365.0" y="142" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">stream: usage 帧</text><line x1="260" y1="176" x2="440" y2="176" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="350.0" y="168" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">assistant/message 落库（内嵌 usage）</text><line x1="440" y1="202" x2="620" y2="202" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="530.0" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">append → seq</text><text x="630" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">投影推进 measurement / tokenUsage</text><line x1="620" y1="254" x2="820" y2="254" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="720.0" y="246" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">stateOf(session) 快照</text><text x="830" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">渲染 token 面板</text><line x1="260" y1="312" x2="440" y2="312" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="350.0" y="304" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">重试：assistant/attempt</text><line x1="260" y1="338" x2="440" y2="338" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-arr)"/><text x="350.0" y="330" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">llm/retry → 边界事件</text><text x="630" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">settled(by retry)，不重复计费</text><text x="270" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">下一 attempt 重新 open</text><text x="40" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">帧里的 usage 只是采样；以 assistant/message 的 usage 为准。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="582" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / SEQUENCE</text>
</svg>
