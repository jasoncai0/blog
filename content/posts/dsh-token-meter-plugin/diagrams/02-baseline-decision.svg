<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">基线选择：先信任，再保守</title>
<desc id="f02-desc">只有 header 一致且 usage 不低于全量估算时，才把 provider 的数字当锚点。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TOKEN METER / BASELINE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">三种基线，一条规则</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">estimated 不是失败，是「这次没有可复用的精确值」。</text>
<rect x="60" y="130" width="220" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">measure(session)</text><text x="72" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">取当前 header 与锚点</text><rect x="360" y="120" width="250" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="372" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">有锚点且 header 相等？</text><text x="372" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">比对 canonicalHeader</text><text x="372" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不等则整表重估</text><rect x="700" y="96" width="220" height="76" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="712" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">usage 总量 ≥ 估算？</text><rect x="700" y="196" width="220" height="70" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="712" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">baseline: 'usage'</text><text x="712" y="231" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">直接采用 provider 桶</text><rect x="700" y="286" width="220" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="712" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">baseline: 'estimated'</text><text x="712" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">重估整个 surface</text><rect x="360" y="300" width="250" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="372" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">无锚点 / header 不同</text><text x="372" y="335" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">surfaceDeltaTokens = 0</text><rect x="60" y="380" width="250" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">例外：无 header 且 surface 为空</text><text x="72" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">baseline: 'none', tokens: 0</text><line x1="280" y1="168" x2="360" y2="168" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><line x1="610" y1="150" x2="700" y2="134" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><line x1="610" y1="196" x2="700" y2="146" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><text x="626" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">否</text><text x="630" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">是</text><line x1="810" y1="172" x2="810" y2="196" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><line x1="810" y1="266" x2="810" y2="286" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><line x1="610" y1="214" x2="610" y2="334" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><text x="622" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">否</text><text x="70" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">保守性的来源：provider 报的数小于自己的估算，说明有未建模的部分，此时估算更安全。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / BASELINE</text>
</svg>
