<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d5t d5d">
  <title id="d5t">合并算法的分类：LWW 位于 CRDT 之下</title>
  <desc id="d5d">合并算法分为需要中心定序的 OT 与无需中心的 CRDT；CRDT 之下有寄存器、计数器、集合、序列四类数据类型，LWW 正是其中的 LWW-Register。</desc>
  <defs>
    <marker id="d5a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">TAXONOMY</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">LWW 不是一个平行的选项</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">OT 与 CRDT 是两种合并机制；LWW 是 CRDT 之下的一个数据类型，也是元数据最少的那个</text>

  <rect x="380" y="104" width="200" height="38" rx="6" fill="#2d3142"/>
  <text x="480" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#f5f5f5">并发合并算法</text>
  <path d="M480 142 V 158 H 254 V 170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d5a)"/>
  <path d="M480 142 V 158 H 706 V 170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d5a)"/>

  <rect x="48" y="174" width="412" height="246" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
  <text x="66" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.1em" fill="#5a6580">OT · 有中心定序</text>
  <text x="66" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">transform(a, b)：操作两两变换</text>
  <text x="66" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">服务端维护串行历史与版本号</text>
  <text x="66" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">并发被收敛成一个确定的顺序</text>
  <text x="66" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">正确性靠 TP1 / TP2 证明</text>
  <text x="66" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">中心节点是它的前提，也是它的天花板</text>
  <text x="66" y="386" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#2d3142">Google Docs · ShareDB · ot.js</text>

  <rect x="500" y="174" width="412" height="246" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
  <text x="518" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.1em" fill="#5a6580">CRDT · 无中心合并</text>

  <rect x="518" y="212" width="186" height="62" rx="5" fill="rgba(191,69,32,0.07)" stroke="#bf4520"/>
  <text x="534" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">寄存器</text>
  <text x="534" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">LWW-Register</text>
  <rect x="646" y="218" width="42" height="14" rx="3" fill="#bf4520"/>
  <text x="667" y="228" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#ffffff">LWW</text>

  <rect x="722" y="212" width="186" height="62" rx="5" fill="#f5f5f5" stroke="rgba(45,49,66,0.14)"/>
  <text x="738" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">计数器</text>
  <text x="738" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">G-Counter / PN-Counter</text>

  <rect x="518" y="286" width="186" height="62" rx="5" fill="#f5f5f5" stroke="rgba(45,49,66,0.14)"/>
  <text x="534" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">集合</text>
  <text x="534" y="326" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">OR-Set / LWW-Element-Set</text>

  <rect x="722" y="286" width="186" height="62" rx="5" fill="#f5f5f5" stroke="rgba(45,49,66,0.14)"/>
  <text x="738" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">序列</text>
  <text x="738" y="326" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">RGA · YATA · Fugue</text>

  <text x="518" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">四类都只依赖 merge 的交换 / 结合 / 幂等；难度从左到右递增。</text>
  <text x="518" y="396" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142">Yjs · Automerge · Fugue</text>

  <rect x="48" y="440" width="864" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="66" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">所以「LWW 快、OT 贵、CRDT 重」这种对比没有意义：LWW 就住在 CRDT 里，它只是选了最省事的那一格。</text>
  <text x="66" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">真正正交的两个问题是：要不要一个中心替所有人定序？以及，你把一条「可被覆盖的记录」切到多细？</text>
</svg>