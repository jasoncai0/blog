<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="d7t d7d">
  <title id="d7t">CAS 与 LWW 叠加：外层 LWW 语义，内层 CAS 定序</title>
  <desc id="d7d">客户端 A 与 B 并发写同一个字段。服务端内层用 CAS 保证版本号原子推进，外层仍按 LWW 语义返回赢家。</desc>
  <defs>
    <marker id="d7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2d3142"/>
    </marker>
    <marker id="d7aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="790" fill="#f5f5f5"/>

  <!-- header -->
  <text x="48" y="46" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="1.6" fill="#bf4520">CAS &#215; LWW</text>
  <text x="48" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="600" fill="#2d3142">外层是 LWW，内层是 CAS</text>
  <text x="48" y="108" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">客户端只会看到「谁赢了」；CAS 的失败被服务端的重试吃掉，永远变不成 409</text>
  <line x1="48" y1="128" x2="912" y2="128" stroke="#ddd8d0" stroke-width="1"/>

  <!-- lanes -->
  <rect x="48" y="150" width="170" height="46" rx="6" fill="#ffffff" stroke="#d8d5cf"/>
  <text x="133" y="178" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142">客户端 A</text>

  <rect x="248" y="150" width="170" height="46" rx="6" fill="#ffffff" stroke="#d8d5cf"/>
  <text x="333" y="178" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142">客户端 B</text>

  <line x1="133" y1="198" x2="133" y2="706" stroke="#cfcac2" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="333" y1="198" x2="333" y2="706" stroke="#cfcac2" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- server container -->
  <rect x="470" y="150" width="442" height="522" rx="8" fill="#ffffff" stroke="#d8d5cf"/>
  <text x="490" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="2" fill="#bf4520">SERVER &#183; &#21807;&#19968;&#20889;&#32773;&#36827;&#31243;</text>
  <text x="490" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">同一个字段 title，两个请求并发到达</text>

  <!-- incoming -->
  <line x1="133" y1="248" x2="466" y2="248" stroke="#2d3142" stroke-width="1.2" marker-end="url(#d7a)"/>
  <text x="140" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">PUT A1 &#183; 1000.0@A</text>

  <line x1="333" y1="282" x2="466" y2="282" stroke="#2d3142" stroke-width="1.2" marker-end="url(#d7a)"/>
  <text x="340" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">PUT B1 &#183; 1001.0@B</text>

  <!-- step 1 -->
  <rect x="490" y="318" width="402" height="54" rx="4" fill="#f7f6f3" stroke="#e2ded6"/>
  <text x="506" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">&#9312; 两个请求都读到 v7</text>
  <text x="506" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">互不可见 &#8212;&#8212; 这就是需要 CAS 的那种并发</text>

  <!-- step 2 -->
  <rect x="490" y="382" width="402" height="54" rx="4" fill="#ffffff" stroke="#b9b3a7"/>
  <text x="506" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">&#9313; CAS(v7 &#8594; v8)：只有一个能成功</text>
  <text x="506" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">A 拿到 seq=8，状态变成 A1@v8</text>
  <text x="876" y="404" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="1.6" fill="#4f5d75">CAS</text>

  <!-- step 3 -->
  <rect x="490" y="446" width="402" height="54" rx="4" fill="#ffffff" stroke="#b9b3a7"/>
  <text x="506" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">&#9314; B 的 CAS 失败 &#8212;&#8212; 不报错，重读再来</text>
  <text x="506" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">读到的已经是 A1@v8，带着自己的戳回到第 &#9312; 步</text>
  <text x="876" y="468" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="1.6" fill="#4f5d75">CAS</text>

  <!-- step 4 -->
  <rect x="490" y="510" width="402" height="70" rx="4" fill="#fbf1ec" stroke="#bf4520"/>
  <text x="506" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520">&#9315; LWW 比较：1001.0@B &gt; 1000.0@A</text>
  <text x="506" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#7a3a22">CAS(v8 &#8594; v9) 成功，B 覆盖，seq=9</text>
  <text x="506" y="568" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#7a3a22">两次请求都是 200，409 没有出现</text>
  <text x="876" y="532" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="1.6" fill="#bf4520">LWW</text>

  <!-- broadcast -->
  <line x1="466" y1="612" x2="137" y2="612" stroke="#bf4520" stroke-width="1.2" marker-end="url(#d7aA)"/>
  <text x="150" y="603" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#bf4520">&#25512;&#36865; B1 &#183; seq=9</text>
  <line x1="466" y1="640" x2="337" y2="640" stroke="#bf4520" stroke-width="1.2" marker-end="url(#d7aA)"/>

  <!-- client reactions -->
  <rect x="56" y="694" width="154" height="42" rx="4" fill="#f5f5f5"/>
  <text x="133" y="710" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">本地 A1 被覆盖</text>
  <text x="133" y="726" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">记一条 overwrite 日志</text>

  <rect x="256" y="694" width="154" height="42" rx="4" fill="#f5f5f5"/>
  <text x="333" y="710" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">收到自己的值</text>
  <text x="333" y="726" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">幂等，什么都不用做</text>

  <!-- legend -->
  <line x1="48" y1="744" x2="912" y2="744" stroke="#ddd8d0" stroke-width="1"/>
  <rect x="48" y="762" width="10" height="10" fill="#ffffff" stroke="#b9b3a7"/>
  <text x="66" y="771" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">灰：CAS 层，管「谁的状态能落地」</text>
  <rect x="330" y="762" width="10" height="10" fill="#fbf1ec" stroke="#bf4520"/>
  <text x="348" y="771" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">橙：LWW 层，管「谁的值最终生效」</text>
  <text x="640" y="771" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#8a8378">两层各失败各的，客户端只感知到上面那层</text>
</svg>
