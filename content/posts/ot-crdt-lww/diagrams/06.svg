<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="d6t d6d">
  <title id="d6t">按中心化与冲突粒度切的选型矩阵</title>
  <desc id="d6d">横轴是冲突粒度从字段级到文本内部，纵轴是是否需要中心节点；四个象限分别对应 LWW 字段级、OT、LWW-Register 与 CRDT 序列。</desc>
  <defs>
    <marker id="d6a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">THE TWO AXES</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">两个正交的问题，四个格子</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">纵轴：要不要一个中心替所有人定序。横轴：冲突发生在字段级，还是在一段文本的内部</text>

  <rect x="220" y="140" width="330" height="150" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
  <rect x="550" y="140" width="330" height="150" fill="rgba(191,69,32,0.05)" stroke="rgba(45,49,66,0.16)"/>
  <rect x="220" y="290" width="330" height="150" fill="#ffffff" stroke="rgba(45,49,66,0.16)"/>
  <rect x="550" y="290" width="330" height="150" fill="rgba(191,69,32,0.05)" stroke="rgba(45,49,66,0.16)"/>

  <text x="238" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.08em" fill="#2d3142">LWW · 字段级</text>
  <text x="238" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">同一字段并发才丢；不同字段天然并存</text>
  <text x="238" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">服务端单写者定序，属性级覆盖</text>
  <text x="238" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">Figma · Firestore · 表单草稿</text>

  <text x="568" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.08em" fill="#bf4520">OT · 服务端定序</text>
  <text x="568" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">元数据最小，意图规则可在服务端统一改</text>
  <text x="568" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">代价是历史窗口与离线能力</text>
  <text x="568" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">Google Docs · ShareDB</text>

  <text x="238" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.08em" fill="#2d3142">寄存器 / 集合 · 无中心</text>
  <text x="238" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">冲突靠时间戳或 tag 裁决，不靠谁定序</text>
  <text x="238" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">离线表单、端侧配置、计数与标签</text>
  <text x="238" y="402" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">Cassandra · 端侧同步 · 离线表单</text>

  <text x="568" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.08em" fill="#bf4520">CRDT 序列 · 无中心</text>
  <text x="568" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">离线、P2P、端到端加密都天然支持</text>
  <text x="568" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">代价是元数据、墓碑与 GC</text>
  <text x="568" y="402" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142">Yjs · Automerge · Fugue</text>

  <text x="210" y="215" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">有中心</text>
  <text x="210" y="365" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">无中心</text>
  <text x="385" y="474" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">字段 / 元素级</text>
  <text x="715" y="474" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">文本 / 序列内部</text>
  <path d="M220 486 H 880" fill="none" stroke="#5a6580" stroke-width="1" marker-end="url(#d6a)"/>
  <text x="880" y="474" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">冲突粒度 →</text>

  <text x="48" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">右边两格是真正难的地方：一段文本的内部有稠密的位置语义，绝大多数学术论文和开源实现都在这里。左边两格是绝大多数业务系统实际需要的。</text>
</svg>