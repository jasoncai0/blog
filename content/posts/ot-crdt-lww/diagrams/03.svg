<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-labelledby="d3t d3d">
  <title id="d3t">RGA 的树结构与墓碑</title>
  <desc id="d3d">每个字符是带唯一 ID 的节点，插入表示成挂在锚点下的子节点，并发插入成为兄弟并按 ID 排序；删除只打墓碑，因此离开同一棵树的两个副本会线性化出相同文本。</desc>
  <defs>
    <marker id="d3a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">SEQUENCE CRDT</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">位置不是索引，锚点是节点</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">基础文本 abc：Alice 在 a 后插 X，Bob 在 a 后插 Y、并删掉 c；两边的合并都不需要知道对方存在</text>

  <text x="48" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#5a6580">① 结构：节点 + 引用</text>

  <rect x="136" y="150" width="68" height="44" rx="6" fill="#ececec" stroke="#2d3142"/>
  <text x="170" y="170" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#2d3142">a</text>
  <text x="170" y="186" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#5a6580">(A,1)</text>

  <rect x="66" y="240" width="68" height="44" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="100" y="260" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#bf4520">X</text>
  <text x="100" y="276" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#5a6580">(A,4)</text>

  <rect x="181" y="240" width="68" height="44" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="215" y="260" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#bf4520">Y</text>
  <text x="215" y="276" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#5a6580">(B,1)</text>

  <rect x="296" y="240" width="68" height="44" rx="6" fill="#ececec" stroke="#2d3142"/>
  <text x="330" y="260" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#2d3142">b</text>
  <text x="330" y="276" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#5a6580">(A,2)</text>

  <rect x="361" y="308" width="68" height="44" rx="6" fill="#ffffff" stroke="#5a6580" stroke-dasharray="4 3"/>
  <text x="395" y="328" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#5a6580">c</text>
  <text x="395" y="344" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#5a6580">(A,3) 墓碑</text>

  <path d="M150 194 V 214 H 100 V 236" fill="none" stroke="#4f5d75" stroke-width="1.1"/>
  <path d="M170 194 V 214 H 215 V 236" fill="none" stroke="#4f5d75" stroke-width="1.1"/>
  <path d="M190 194 V 214 H 330 V 236" fill="none" stroke="#4f5d75" stroke-width="1.1"/>
  <path d="M330 284 V 300 H 395 V 304" fill="none" stroke="#5a6580" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#d3a)"/>

  <text x="48" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">X 与 Y 都挂在 a 下，成为兄弟；兄弟之间只比 ID，不比谁先到——所以两个副本算出的顺序必然相同。</text>

  <text x="560" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#5a6580">② 两个副本看到的文档</text>
  <text x="650" y="140" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">副本 A</text>
  <text x="800" y="140" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">副本 B</text>

  <rect x="600" y="150" width="100" height="32" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.14)"/><text x="650" y="171" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#2d3142">a</text>
  <rect x="600" y="190" width="100" height="32" rx="4" fill="#ffffff" stroke="#bf4520"/><text x="650" y="211" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520">X</text>
  <rect x="600" y="230" width="100" height="32" rx="4" fill="#ffffff" stroke="#bf4520"/><text x="650" y="251" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520">Y</text>
  <rect x="600" y="270" width="100" height="32" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.14)"/><text x="650" y="291" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#2d3142">b</text>
  <rect x="600" y="310" width="100" height="32" rx="4" fill="#f5f5f5" stroke="#5a6580" stroke-dasharray="3 3"/><text x="650" y="331" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#5a6580">c</text>

  <rect x="750" y="150" width="100" height="32" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.14)"/><text x="800" y="171" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#2d3142">a</text>
  <rect x="750" y="190" width="100" height="32" rx="4" fill="#ffffff" stroke="#bf4520"/><text x="800" y="211" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520">X</text>
  <rect x="750" y="230" width="100" height="32" rx="4" fill="#ffffff" stroke="#bf4520"/><text x="800" y="251" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520">Y</text>
  <rect x="750" y="270" width="100" height="32" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.14)"/><text x="800" y="291" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#2d3142">b</text>
  <rect x="750" y="310" width="100" height="32" rx="4" fill="#f5f5f5" stroke="#5a6580" stroke-dasharray="3 3"/><text x="800" y="331" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#5a6580">c</text>

  <text x="700" y="366" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">c 仍在结构里，只是不再渲染</text>

  <path d="M470 230 H 540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3a)"/>
  <text x="505" y="222" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">中序</text>

  <rect x="48" y="404" width="280" height="76" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="66" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">ID</text>
  <text x="66" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">每个字符至少一个 (副本, 序号)</text>
  <text x="66" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这是排序的唯一依据</text>

  <rect x="340" y="404" width="280" height="76" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="358" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">引用</text>
  <text x="358" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">「插在谁后面」比「插在第几位」稳</text>
  <text x="358" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">索引会被别人的插入顶走</text>

  <rect x="632" y="404" width="280" height="76" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="650" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">墓碑</text>
  <text x="650" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">删除只打标记，节点留在结构里</text>
  <text x="650" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">否则并发插入会失去锚点</text>

  <text x="48" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这三样加起来，就是 CRDT 的账单：正确性来自结构，成本也来自结构。Yjs 把这三样压进二进制，Automerge 用列式编码，都是为了把这笔账摊薄。</text>
  <text x="48" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">账单不会消失，只会换一种形式：要么占内存，要么占带宽，要么占 GC 的时间。</text>
</svg>