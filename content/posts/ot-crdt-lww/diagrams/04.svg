<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="d4t d4d">
  <title id="d4t">时钟偏斜如何吃掉一次因果上更晚的写</title>
  <desc id="d4d">Alice 的时钟快三秒、Bob 的慢一秒；Bob 在看见 Alice 的改动之后才写，但因为时间戳更小，LWW 把 Bob 的写丢弃了。</desc>
  <defs>
    <marker id="d4a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">CLOCK SKEW</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">它丢的不只是并发写</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">两个人先后改同一个字段，两次写有明确的先后——LWW 仍然可能选错，而且没有任何痕迹</text>

  <text x="48" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">ALICE · 时钟 +3s</text>
  <rect x="48" y="128" width="300" height="62" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="66" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142">本地时间 12:00:03.340</text>
  <text x="66" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">写入 title = “Rust”</text>

  <path d="M300 190 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4a)"/>
  <text x="312" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">看到了 Alice 的改动</text>

  <text x="180" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#5a6580">BOB · 时钟 −1s</text>
  <rect x="180" y="222" width="300" height="62" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="198" y="246" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#bf4520">本地时间 11:59:59.400</text>
  <text x="198" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">写入 title = “Go”（真实时间更晚）</text>

  <path d="M348 159 H 612" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4a)"/>
  <path d="M480 253 H 612" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4a)"/>

  <rect x="620" y="128" width="292" height="150" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.14)"/>
  <text x="638" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#5a6580">合并后的 title</text>
  <text x="638" y="192" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="26" fill="#2d3142">Rust</text>
  <line x1="638" y1="212" x2="894" y2="212" stroke="rgba(45,49,66,0.12)"/>
  <text x="638" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#5a6580">Go</text>
  <line x1="636" y1="239" x2="664" y2="239" stroke="#bf4520" stroke-width="1.4"/>
  <path d="M0 0 L8 8 M8 0 L0 8" transform="translate(672,233)" stroke="#bf4520" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="690" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">时间戳更小，被丢弃</text>
  <text x="638" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">比较的是 12:00:03 &gt; 11:59:59</text>

  <rect x="48" y="318" width="864" height="60" rx="6" fill="rgba(191,69,32,0.05)" stroke="#bf4520" stroke-opacity="0.35"/>
  <text x="66" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">Bob 的写在真实时间上更晚，Bob 甚至已经看见了 Alice 的改动——但它的时间戳更小，于是被覆盖。</text>
  <text x="66" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">这不是冲突裁决，是因果被时钟吃掉了。LWW 在这个位置连「谁后发生」都没答对。</text>

  <rect x="48" y="398" width="280" height="78" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="66" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">物理时钟</text>
  <text x="66" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">实现最省事，一个 long 就够</text>
  <text x="66" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">会被漂移、回拨、时区骗</text>

  <rect x="340" y="398" width="280" height="78" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="358" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">HLC</text>
  <text x="358" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">物理时间 + 逻辑计数</text>
  <text x="358" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">保住因果，并发仍然丢一个</text>

  <rect x="632" y="398" width="280" height="78" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)"/>
  <text x="650" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">版本向量 / MV-Register</text>
  <text x="650" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">保留并发值，交给应用裁决</text>
  <text x="650" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">元数据变多，但冲突看得见</text>

  <text x="48" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这三个选项是一条清晰的权衡线：越往右，越晚做决定、越多的信息留给应用，也越贵。LWW 站在最左端，把决定权交给了一个可能不准的时钟。</text>
</svg>