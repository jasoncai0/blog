<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="r4-title r4-desc">
  <title id="r4-title">归因是一棵决策树</title>
  <desc id="r4-desc">先确认有证据，再判断错在工具、实现、计划还是环境；同一层第三次失败强制升层，而不是换第二个补丁。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">ATTRIBUTION TREE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">归因是一棵决策树</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">先定位层级，再决定动作</text>
  <defs>
    <marker id="f4-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="f4-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <polygon points="330,110.0 460.0,140 330,170.0 200.0,140" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="330" y="137" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">有失败证据吗？</text>
  <text x="330" y="153" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">测试 / 报错 / 环境返回</text>
  <line x1="460" y1="140" x2="610" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4-0)"/>
  <text x="535" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">没有</text>
  <rect x="610" y="108" width="300" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="628" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">不要反思，去拿证据</text>
  <text x="628" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">加日志、加测试、复现一次</text>
  <text x="628" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#bf4520">没有证据的复盘只会编</text>
  <line x1="330" y1="170" x2="330" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f4-0)"/>
  <text x="340" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">有</text>
  <polygon points="330,234.0 480.0,264 330,294.0 180.0,264" fill="rgba(191,69,32,0.07)" stroke="#c9c2bb" stroke-width="1"/>
  <text x="330" y="261" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">证据指向哪一层？</text>
  <text x="330" y="277" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">按最低可解释层归因</text>
  <line x1="330" y1="294" x2="150" y2="372" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f4-0)"/>
  <line x1="330" y1="294" x2="360" y2="372" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f4-0)"/>
  <line x1="330" y1="294" x2="570" y2="372" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f4-0)"/>
  <line x1="330" y1="294" x2="782" y2="372" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f4-0)"/>
  <rect x="54" y="372" width="192" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="68" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">L0</text>
  <text x="68" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">工具 / 参数</text>
  <text x="68" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">修参数、换工具、补权限</text>
  <text x="68" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">判据</text>
  <text x="68" y="475" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">报错停在工具边界</text>
  <rect x="264" y="372" width="192" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="278" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">L2</text>
  <text x="278" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">实现</text>
  <text x="278" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">改代码；先确认</text>
  <text x="278" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">测试本身没写错</text>
  <text x="278" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">判据</text>
  <text x="278" y="475" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">断言具体、可复现</text>
  <rect x="474" y="372" width="192" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="488" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">L2–L3</text>
  <text x="488" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">计划 / 规格</text>
  <text x="488" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">先补测试，再改实现；</text>
  <text x="488" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">歧义就停下来问人</text>
  <text x="488" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">判据</text>
  <text x="488" y="475" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">测试没覆盖验收标准</text>
  <rect x="686" y="372" width="192" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="700" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">—</text>
  <text x="700" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">环境</text>
  <text x="700" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">修环境，别让 agent</text>
  <text x="700" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">把环境问题当推理</text>
  <text x="700" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">判据</text>
  <text x="700" y="475" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">本地过、CI 不过</text>
  <path d="M360,484 L360,536 Q360,544 368,544 L562,544 Q570,544 570,536 L570,492" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#f4-1)"/>
  <rect x="372" y="530" width="186" height="28" rx="14" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
  <text x="465" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="middle" fill="#bf4520">同层第三次失败 → 升层</text>
  <line x1="48" y1="588" x2="912" y2="588" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="612" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">局部修补、推倒重来、过度修正，都是归因错了。</text>
  <text x="56" y="630" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#5a6580">修补越努力，离目标越远——因为它改的是不对的那一层。</text>
</svg>
