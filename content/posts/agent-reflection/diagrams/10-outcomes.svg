<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="r10-title r10-desc">
  <title id="r10-title">一次 attempt 的六个出口</title>
  <desc id="r10-desc">失败不是抛异常就结束：先分类，再决定保留什么、丢弃什么。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">STEP OUTCOME</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">一次 attempt 的六个出口</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">OpenCode · packages/core/src/session/runner/step.ts</text>
  <defs>
    <marker id="f10-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="f10-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f10-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <rect x="48" y="278" width="150" height="70" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="123" y="303" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">attempt 结束</text>
  <text x="123" y="319" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" font-weight="400" text-anchor="middle" fill="#5a6580">finish / failure</text>
  <text x="123" y="335" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">outputStarted?</text>
  <rect x="230" y="278" width="120" height="70" rx="6" fill="rgba(139,147,167,0.10)" stroke="#d8d8d8" stroke-width="1"/>
  <text x="290" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">先分类</text>
  <text x="290" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">失败属于哪类</text>
  <text x="290" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="middle" fill="#5a6580">不猜原因</text>
  <line x1="198" y1="313" x2="230" y2="313" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f10-0)"/>
  <line x1="350" y1="313" x2="420" y2="313" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="420" y1="138" x2="420" y2="488" stroke="#4f5d75" stroke-width="1.2"/>
  <rect x="470" y="110" width="442" height="56" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <rect x="470" y="110" width="4" height="56" rx="0" fill="#8b93a7" stroke="none" stroke-width="1"/>
  <text x="488" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">Completed</text>
  <text x="650" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">交给下一步 / 结束</text>
  <text x="488" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">无 failure</text>
  <line x1="420" y1="138" x2="470" y2="138" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="470" y="180" width="442" height="56" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <rect x="470" y="180" width="4" height="56" rx="0" fill="#8b93a7" stroke="none" stroke-width="1"/>
  <text x="488" y="201" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">OutputLimit</text>
  <text x="650" y="201" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">续写，最多两次</text>
  <text x="488" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">finish = length</text>
  <line x1="420" y1="208" x2="470" y2="208" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="470" y="250" width="442" height="56" rx="4" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/>
  <rect x="470" y="250" width="4" height="56" rx="0" fill="#bf4520" stroke="none" stroke-width="1"/>
  <text x="488" y="271" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">Compacted</text>
  <text x="650" y="271" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">先压上下文，再重跑</text>
  <text x="488" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#bf4520">context overflow</text>
  <line x1="420" y1="278" x2="470" y2="278" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="470" y="320" width="442" height="56" rx="4" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1"/>
  <rect x="470" y="320" width="4" height="56" rx="0" fill="#3d5a80" stroke="none" stroke-width="1"/>
  <text x="488" y="341" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">RecoverFull</text>
  <text x="650" y="341" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">换连接，整请求重发</text>
  <text x="488" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#3d5a80">Transport + retry-full</text>
  <line x1="420" y1="348" x2="470" y2="348" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="470" y="390" width="442" height="56" rx="4" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1"/>
  <rect x="470" y="390" width="4" height="56" rx="0" fill="#3d5a80" stroke="none" stroke-width="1"/>
  <text x="488" y="411" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">Retry</text>
  <text x="650" y="411" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">同一 step 重跑</text>
  <text x="488" y="430" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#3d5a80">retryable &amp;&amp; !outputStarted</text>
  <line x1="420" y1="418" x2="470" y2="418" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="470" y="460" width="442" height="56" rx="4" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1"/>
  <rect x="470" y="460" width="4" height="56" rx="0" fill="#3d5a80" stroke="none" stroke-width="1"/>
  <text x="488" y="481" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" font-weight="600" text-anchor="start" fill="#2d3142">Continue</text>
  <text x="650" y="481" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">保留半截，续跑</text>
  <text x="488" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="400" text-anchor="start" fill="#3d5a80">retryable &amp;&amp; outputStarted</text>
  <line x1="420" y1="488" x2="470" y2="488" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f10-0)"/>
  <rect x="48" y="532" width="10" height="10" rx="2" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="64" y="541" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">终止 / 截断</text>
  <rect x="180" y="532" width="10" height="10" rx="2" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/>
  <text x="196" y="541" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">换上下文</text>
  <rect x="300" y="532" width="10" height="10" rx="2" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1"/>
  <text x="316" y="541" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">重跑 / 续跑</text>
  <text x="56" y="570" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#5a6580">条件来自 record.outputStarted、isContextOverflowFailure、isRetryable；六个分支的顺序就是策略。</text>
  <text x="56" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">不满足任何分支的失败直接上抛：没有「再想想」的兜底。</text>
</svg>
