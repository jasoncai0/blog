<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="r9-title r9-desc">
  <title id="r9-title">反思是二阶循环，不是第四个格子</title>
  <desc id="r9-desc">一阶 TAO 负责把事做完；二阶消费轨迹与证据，改写下一轮。代码实现的是二阶的接线。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">TAO AND META LOOP</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">反思是二阶循环，不是第四个格子</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">反思可以落在 T/A/O 任何一格，也可以完全不经过模型</text>
  <defs>
    <marker id="f9-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="f9-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f9-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <text x="48" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.14em">一阶 · 任务循环</text>
  <rect x="120" y="150" width="150" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="195" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Thought</text>
  <text x="195" y="191" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.1em">model call</text>
  <text x="195" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">下一步做什么</text>
  <rect x="390" y="150" width="150" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="465" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Action</text>
  <text x="465" y="191" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.1em">tool call</text>
  <text x="465" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">改环境 / 取信息</text>
  <rect x="660" y="150" width="150" height="72" rx="6" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1.4"/>
  <text x="735" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3142">Observation</text>
  <text x="735" y="191" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.1em">tool result</text>
  <text x="735" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">stdout · diff · error</text>
  <line x1="270" y1="186" x2="326" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f9-0)"/>
  <line x1="540" y1="186" x2="596" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f9-0)"/>
  <path d="M735,150 L735,118 Q735,110 727,110 L203,110 Q195,110 195,118 L195,150" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f9-0)"/>
  <text x="465" y="102" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#5a6580">下一轮</text>
  <text x="48" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.14em">二阶 · 反思循环</text>
  <rect x="660" y="330" width="150" height="74" rx="6" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1"/>
  <text x="735" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">证据</text>
  <text x="735" y="371" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.08em">raw observation</text>
  <text x="735" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="middle" fill="#4f5d75">原文 + 指针</text>
  <rect x="390" y="330" width="150" height="74" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/>
  <text x="465" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">裁决 / 分类</text>
  <text x="465" y="371" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.08em">Step.Outcome</text>
  <text x="465" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="middle" fill="#4f5d75">失败类型 + 保留什么</text>
  <rect x="120" y="330" width="150" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="195" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">控制决策</text>
  <text x="195" y="371" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.08em">retry · compact · revert</text>
  <text x="195" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="middle" fill="#4f5d75">改下一轮</text>
  <line x1="735" y1="222" x2="735" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f9-0)"/>
  <line x1="660" y1="367" x2="540" y2="367" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f9-0)"/>
  <line x1="390" y1="367" x2="270" y2="367" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f9-0)"/>
  <line x1="195" y1="330" x2="195" y2="222" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f9-1)"/>
  <text x="206" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="500" text-anchor="start" fill="#bf4520">改 T / A</text>
  <text x="745" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">先取证</text>
  <rect x="390" y="440" width="150" height="56" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="465" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#2d3142">沉淀</text>
  <text x="465" y="477" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="middle" fill="#4f5d75">经验库 / 回归集</text>
  <text x="465" y="490" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="middle" fill="#bf4520">OpenCode: 无</text>
  <line x1="465" y1="404" x2="465" y2="440" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4,4" marker-end="url(#f9-1)"/>
  <line x1="48" y1="520" x2="912" y2="520" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="544" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">反思可以落在 T/A/O 任何一格，也可能完全不经过模型：harness 直接改控制流。</text>
  <text x="56" y="562" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#5a6580">真正的分界不是「谁在想」，而是「下一轮的 T/A/O 有没有变」。</text>
</svg>
