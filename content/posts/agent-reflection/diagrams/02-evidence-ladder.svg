<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="r3-title r3-desc">
  <title id="r3-title">证据的六级谱系</title>
  <desc id="r3-desc">从确定性验证器到同上下文自省：信息增量逐级下降，越往下越接近重采样。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">EVIDENCE LADDER</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">证据的六级谱系</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">反思的上限由证据决定，不由 prompt 决定</text>
  <defs>
    <marker id="f3-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
  </defs>
  <text x="56" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">证据来源</text>
  <text x="300" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">信息增量</text>
  <text x="742" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">典型系统</text>
  <rect x="48" y="120" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">S1</text>
  <text x="62" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">确定性验证器</text>
  <text x="62" y="171" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">测试、类型、编译、schema、diff 断言</text>
  <rect x="300" y="146" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="146" width="360.0" height="8" rx="4" fill="#3d5a80" stroke="none" stroke-width="1"/>
  <text x="660" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">100%</text>
  <text x="742" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">SWE 类测试环</text>
  <text x="742" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 低 · 可 gaming 低</text>
  <rect x="48" y="190" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">S2</text>
  <text x="62" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">环境真值</text>
  <text x="62" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">退出码、HTTP、DOM、文件系统、游戏状态</text>
  <rect x="300" y="216" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="216" width="316.8" height="8" rx="4" fill="#3d5a80" stroke="none" stroke-width="1"/>
  <text x="624.8" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">88%</text>
  <text x="742" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">浏览器 / shell agent</text>
  <text x="742" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 中 · 可 gaming 低</text>
  <rect x="48" y="260" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">S3</text>
  <text x="62" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">工具检索</text>
  <text x="62" y="311" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">文档、搜索、计算器、REPL</text>
  <rect x="300" y="286" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="286" width="244.8" height="8" rx="4" fill="#5a7a9a" stroke="none" stroke-width="1"/>
  <text x="552.8" y="294" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">68%</text>
  <text x="742" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">CRITIC</text>
  <text x="742" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 中 · 可 gaming 中</text>
  <rect x="48" y="330" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="348" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">S4</text>
  <text x="62" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">独立模型 + 不同信息</text>
  <text x="62" y="381" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">另一个上下文、角色，甚至另一个模型</text>
  <rect x="300" y="356" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="356" width="151.20000000000002" height="8" rx="4" fill="#8b93a7" stroke="none" stroke-width="1"/>
  <text x="459.20000000000005" y="364" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">42%</text>
  <text x="742" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">多 agent 评审</text>
  <text x="742" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 高 · 可 gaming 中</text>
  <rect x="48" y="400" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">S5</text>
  <text x="62" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">同模型 + 新上下文</text>
  <text x="62" y="451" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">去锚定，但信息增量有限</text>
  <rect x="300" y="426" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="426" width="72.0" height="8" rx="4" fill="#b6bcc8" stroke="none" stroke-width="1"/>
  <text x="380.0" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">20%</text>
  <text x="742" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">常见实现</text>
  <text x="742" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 中 · 可 gaming 高</text>
  <rect x="48" y="470" width="864" height="62" rx="6" fill="rgba(139,147,167,0.10)" stroke="#d8d8d8" stroke-width="1"/>
  <text x="62" y="488" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">S6</text>
  <text x="62" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">同模型 + 同上下文</text>
  <text x="62" y="521" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">再问一遍，通常更自信</text>
  <rect x="300" y="496" width="360" height="8" rx="4" fill="#ececec" stroke="none" stroke-width="1"/>
  <rect x="300" y="496" width="18.0" height="8" rx="4" fill="#d8d8d8" stroke="none" stroke-width="1"/>
  <text x="326.0" y="504" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580">5%</text>
  <text x="742" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#4f5d75">多数「反思 prompt」</text>
  <text x="742" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">成本 低 · 可 gaming 很高</text>
  <line x1="48" y1="552" x2="912" y2="552" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">上三行是判决，下三行是意见。</text>
  <text x="56" y="596" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#5a6580">把 S6 当反思，是很多「反思模块」的真实位置：成本不高，所以一直开着；信息为零，所以一直没用。</text>
</svg>
