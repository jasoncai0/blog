<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="r6-title r6-desc">
  <title id="r6-title">回路的三个刹车</title>
  <desc id="r6-desc">收益在前两轮后迅速变平；振荡会让曲线来回摆。预算、无进展、边际收益，谁先到谁停。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">LOOP CONTROL</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">回路的三个刹车</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">停下来不是失败，是把问题交给上一层</text>
  <defs>
    <marker id="f6-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="f6-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f6-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <line x1="96" y1="466" x2="560" y2="466" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f6-0)"/>
  <line x1="96" y1="466" x2="96" y2="150" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f6-0)"/>
  <text x="560" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#5a6580">反思轮次</text>
  <text x="96" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">解决率</text>
  <line x1="96" y1="466.0" x2="560" y2="466.0" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="86" y="469.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="end" fill="#5a6580">0%</text>
  <line x1="96" y1="387.0" x2="560" y2="387.0" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="86" y="390.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="end" fill="#5a6580">25%</text>
  <line x1="96" y1="308.0" x2="560" y2="308.0" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="86" y="311.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="end" fill="#5a6580">50%</text>
  <line x1="96" y1="229.0" x2="560" y2="229.0" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="86" y="232.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="end" fill="#5a6580">75%</text>
  <line x1="96" y1="150.0" x2="560" y2="150.0" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="86" y="153.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="end" fill="#5a6580">100%</text>
  <text x="96" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">0</text>
  <text x="184" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">1</text>
  <text x="272" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">2</text>
  <text x="360" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">3</text>
  <text x="448" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">4</text>
  <text x="536" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">5</text>
  <path d="M96,339.6 L184,270.08 L272,241.64 L360,229.0 L448,222.67999999999998 L536,219.51999999999998" fill="none" stroke="#3d5a80" stroke-width="2"/>
  <circle cx="96" cy="339.6" r="3" fill="#3d5a80"/>
  <circle cx="184" cy="270.08" r="3" fill="#3d5a80"/>
  <circle cx="272" cy="241.64" r="3" fill="#3d5a80"/>
  <circle cx="360" cy="229.0" r="3" fill="#3d5a80"/>
  <circle cx="448" cy="222.67999999999998" r="3" fill="#3d5a80"/>
  <circle cx="536" cy="219.51999999999998" r="3" fill="#3d5a80"/>
  <path d="M96,339.6 L184,282.72 L272,292.2 L360,276.4 L448,295.36 L536,285.88" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="360" y1="150" x2="360" y2="466" stroke="#bf4520" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="366" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="500" text-anchor="start" fill="#bf4520">预算 3</text>
  <text x="374" y="257.32" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#bf4520">增量 &lt; 成本</text>
  <text x="458" y="289.88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#bf4520">振荡</text>
  <rect x="600" y="110" width="312" height="356" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="618" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">三个停止条件</text>
  <text x="618" y="158" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.06em">01  预算</text>
  <text x="618" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">L0 / L1 三轮，L2 两轮。</text>
  <text x="618" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">超过就升级。</text>
  <text x="618" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">轮数是成本，不是决心。</text>
  <line x1="618" y1="226" x2="894" y2="226" stroke="#d8d8d8" stroke-width="1"/>
  <text x="618" y="258" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.06em">02  无进展</text>
  <text x="618" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">state = hash(diff) + 失败集合；</text>
  <text x="618" y="291" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">重复或周期 2 就停。</text>
  <text x="618" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">环形缓冲长度 4 足够。</text>
  <line x1="618" y1="326" x2="894" y2="326" stroke="#d8d8d8" stroke-width="1"/>
  <text x="618" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.06em">03  边际收益</text>
  <text x="618" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">第 k 轮增量 / 成本</text>
  <text x="618" y="391" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#2d3142">低于阈值就停。</text>
  <text x="618" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#5a6580">第二轮后增量通常减半。</text>
  <line x1="48" y1="528" x2="912" y2="528" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4f5d75">先到先停。停下来不是失败：它把问题从「再试一次」变成「换一层」。</text>
  <text x="56" y="570" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#5a6580">反过来说，没有刹车阈值的反思，几乎一定会跑到改坏为止。</text>
</svg>
