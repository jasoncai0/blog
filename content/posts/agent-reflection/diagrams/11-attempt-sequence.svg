  <text x="312.5" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">output / error</text>
  <line x1="150" y1="352" x2="635" y2="352" stroke="#4f5d75" stroke-width="1.15" marker-end="url(#f11-0)"/>
  <rect x="351.712" y="336" width="81.57600000000002" height="13" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1"/>
  <text x="392.5" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">append tool result</text>
  <line x1="150" y1="390" x2="795" y2="390" stroke="#bf4520" stroke-width="1.15" marker-end="url(#f11-1)"/>
  <rect x="403.488" y="374" width="138.02400000000003" height="13" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1"/>
  <text x="472.5" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#bf4520">classify(failure, outputStarted)</text>
  <line x1="795" y1="420" x2="150" y2="420" stroke="#bf4520" stroke-width="1.15" marker-end="url(#f11-1)"/>
  <rect x="453.888" y="404" width="37.224000000000004" height="13" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1"/>
  <text x="472.5" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#bf4520">Outcome</text>
