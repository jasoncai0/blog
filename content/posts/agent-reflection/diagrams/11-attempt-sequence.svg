  <text x="635" y="129" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#2d3142">Session</text>
  <text x="635" y="143" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="400" text-anchor="middle" fill="#5a6580">messages</text>
