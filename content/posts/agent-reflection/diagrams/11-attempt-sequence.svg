  <line x1="315" y1="156" x2="315" y2="700" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="475" y1="156" x2="475" y2="700" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="635" y1="156" x2="635" y2="700" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,5"/>
