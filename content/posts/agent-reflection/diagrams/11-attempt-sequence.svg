  <text x="150" y="143" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="400" text-anchor="middle" fill="#5a6580">step loop</text>
  <rect x="247" y="110" width="136" height="46" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="315" y="129" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#2d3142">Model</text>
  <text x="315" y="143" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="400" text-anchor="middle" fill="#5a6580">stream</text>
