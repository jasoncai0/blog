  <line x1="150" y1="640" x2="315" y2="640" stroke="#3d5a80" stroke-width="1.15" marker-end="url(#f11-2)"/>
  <rect x="201.792" y="624" width="61.41600000000001" height="13" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1"/>
  <text x="232.5" y="634" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#3d5a80">resume stream</text>
  <text x="150" y="656" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.6" font-weight="400" text-anchor="start" fill="#5a6580">保留半截</text>
  <text x="56" y="730" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#5a6580">其他出口（Completed / Compacted / RecoverFull / OutputLimit）走同一张分诊台，动作不同。</text>
