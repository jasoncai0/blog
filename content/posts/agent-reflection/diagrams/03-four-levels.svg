<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="r2-title r2-desc">
  <title id="r2-title">反思的对象有四层</title>
  <desc id="r2-desc">按反馈延迟与影响半径排开：动作、步骤、轨迹、策略；越往右上，证据越稀疏、杠杆越大、越需要回放。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">FOUR LEVELS OF OBJECT</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">反思的对象有四层</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">粒度决定你能改什么，也决定归因有多难</text>
  <defs>
    <marker id="f2-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
  </defs>
  <line x1="130" y1="500" x2="892" y2="500" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f2-0)"/>
  <line x1="130" y1="500" x2="130" y2="144" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f2-0)"/>
  <text x="886" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#5a6580">反馈延迟 →</text>
  <text x="134" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">影响半径 ↑</text>
  <line x1="130" y1="410" x2="886" y2="410" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="130" y1="320" x2="886" y2="320" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="130" y1="230" x2="886" y2="230" stroke="#ececec" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="130" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">毫秒</text>
  <text x="380" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">秒 / 分</text>
  <text x="630" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">小时</text>
  <text x="860" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="middle" fill="#5a6580">天 / 周</text>
  <text x="122" y="503" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">本次调用</text>
  <text x="122" y="413" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">本任务</text>
  <text x="122" y="323" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">同类任务</text>
  <text x="122" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">所有任务</text>
  <circle cx="210" cy="452" r="30" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1.4"/>
  <text x="210" y="451" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#3d5a80" letter-spacing="0.08em">L0</text>
  <text x="210" y="466" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" text-anchor="middle" fill="#2d3142">动作</text>
  <circle cx="420" cy="378" r="36" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1.4"/>
  <text x="420" y="377" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#3d5a80" letter-spacing="0.08em">L1</text>
  <text x="420" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" text-anchor="middle" fill="#2d3142">步骤</text>
  <circle cx="632" cy="286" r="44" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="632" y="285" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#bf4520" letter-spacing="0.08em">L2</text>
  <text x="632" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" text-anchor="middle" fill="#2d3142">轨迹</text>
  <circle cx="816" cy="194" r="50" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="816" y="193" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#bf4520" letter-spacing="0.08em">L3</text>
  <text x="816" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" text-anchor="middle" fill="#2d3142">策略</text>
  <text x="252" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">参数 / schema / 重试</text>
  <text x="252" y="454" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">代码就能修，不调模型</text>
  <text x="424" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">世界状态变了吗</text>
  <text x="424" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">连续两步无变化 = 打转</text>
  <text x="576" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#4f5d75">端到端 oracle</text>
  <text x="576" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">只有这层产出经验</text>
  <text x="800" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#4f5d75">改提示 / 工具 / 流程</text>
  <text x="800" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">要样本量、回放、灰度</text>
  <line x1="48" y1="566" x2="912" y2="566" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#4f5d75">L0 与 L1 可以是纯代码；L2 需要 oracle；L3 需要离线。</text>
  <text x="56" y="608" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#bf4520">最常见的错位：用左下角的手法修右上角的问题。同层三次失败，强制升一层。</text>
</svg>
