<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="r1-title r1-desc">
  <title id="r1-title">反思的完整回路</title>
  <desc id="r1-desc">尝试产出轨迹，oracle 产出证据，裁决与归因合成修补，经验写入下一次任务的上下文；没有证据这一格，回路退化为自我确认。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">REFLECTION LOOP</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">反思的完整回路</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">一次反思是四个动作，不是一段话</text>
  <defs>
    <marker id="f1-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="f1-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f1-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <rect x="56" y="200" width="132" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="122" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">尝试</text>
  <text x="122" y="241" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">ATTEMPT</text>
  <text x="122" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f5d75">任务 + 上下文 + 上一条经验</text>
  <rect x="224" y="200" width="132" height="68" rx="6" fill="rgba(61,90,128,0.08)" stroke="#3d5a80" stroke-width="1.4"/>
  <text x="290" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">证据</text>
  <text x="290" y="241" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">EVIDENCE</text>
  <text x="290" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f5d75">oracle · 环境 · 工具</text>
  <rect x="392" y="200" width="132" height="68" rx="6" fill="rgba(191,69,32,0.07)" stroke="#c9c2bb" stroke-width="1"/>
  <text x="458" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">裁决</text>
  <text x="458" y="241" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">VERDICT</text>
  <text x="458" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f5d75">缺陷 + 证据指针</text>
  <rect x="560" y="200" width="132" height="68" rx="6" fill="rgba(191,69,32,0.07)" stroke="#c9c2bb" stroke-width="1"/>
  <text x="626" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">归因</text>
  <text x="626" y="241" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">ATTRIBUTION</text>
  <text x="626" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f5d75">实现 · 计划 · 环境</text>
  <rect x="728" y="200" width="132" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="794" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">修补</text>
  <text x="794" y="241" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">REVISION</text>
  <text x="794" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f5d75">下一轮的动作</text>
  <line x1="188" y1="234" x2="218" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <line x1="356" y1="234" x2="386" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <line x1="524" y1="234" x2="554" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <line x1="692" y1="234" x2="722" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <rect x="380" y="178" width="324" height="112" rx="8" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="392" y="171" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">REFLECTION · 裁决与归因</text>
  <text x="392" y="301" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">其余两格是执行，不是反思</text>
  <path d="M794,200 L794,158 Q794,150 786,150 L130,150 Q122,150 122,158 L122,194" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <text x="458" y="142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#5a6580">下一轮尝试</text>
  <line x1="626" y1="268" x2="626" y2="334" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <text x="636" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">跨任务</text>
  <line x1="794" y1="268" x2="794" y2="334" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1-0)"/>
  <text x="804" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#5a6580">即时</text>
  <rect x="446" y="340" width="244" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="462" y="362" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">经验库 · LESSONS</text>
  <text x="462" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">when / do / evidence / scope</text>
  <text x="462" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">support / confidence / expires</text>
  <rect x="706" y="340" width="178" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="722" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#2d3142">回归闸</text>
  <text x="722" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">原本通过的集合</text>
  <text x="722" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">跑不过 → 回滚</text>
  <path d="M568,416 L568,472 Q568,480 560,480 L130,480 Q122,480 122,472 L122,274" fill="none" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4,4" marker-end="url(#f1-1)"/>
  <text x="330" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#bf4520">下一次任务：按 when 匹配后注入</text>
  <line x1="48" y1="520" x2="912" y2="520" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">没有证据</text>
  <text x="56" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">第二次表态，不是批评</text>
  <text x="356" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">归因错层</text>
  <text x="356" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">原地打转，diff 越改越大</text>
  <text x="656" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">没有沉淀</text>
  <text x="656" y="564" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">每次任务都从零开始</text>
</svg>
