<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">DSH 的 turn/step 结构，以及四类预算的作用点</title>
  <desc id="f1d">一个 turn 由多个 step 组成；每个 step 经过 pre-step 压缩检查、组装请求、模型调用、流式响应，若有工具调用则继续下一个 step。预算作用在上下文压缩、请求计价、输出上限和工具结果截断上；DSH 没有 step 或 turn 数量上限。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">DSH · AGENT LOOP · BUDGET SURFACES</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一个 turn 里，预算到底卡在哪几步</text>
  <text x="920" y="62" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">dsh-agent-loop / dsh-compaction-basic</text>

  <!-- outer turn -->
  <rect x="40" y="96" width="880" height="424" rx="2" fill="none" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="54" y="114" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">TURN（可被 steering 延长，没有数量上限）</text>

  <!-- goal bracket -->
  <line x1="24" y1="96" x2="24" y2="520" stroke="#bf4520" stroke-width="1"/>
  <line x1="24" y1="96" x2="34" y2="96" stroke="#bf4520" stroke-width="1"/>
  <line x1="24" y1="520" x2="34" y2="520" stroke="#bf4520" stroke-width="1"/>
  <text x="17" y="308" transform="rotate(-90 17 308)" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">外层：goal 256 轮 / Ralph 256 轮（只数轮次）</text>

  <!-- step boundary -->
  <rect x="62" y="130" width="836" height="322" fill="rgba(255,255,255,0.35)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <text x="78" y="149" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#5a6580">STEP N · 每步重新派生 history 与可见工具 schema</text>

  <!-- boxes -->
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
    <rect x="80" y="184" width="150" height="80" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="92" y="207" font-size="11" font-weight="600" fill="#2d3142">agent/pre-step</text>
    <text x="92" y="225" font-size="8.3" fill="#4f5d75">压缩检查</text>
    <text x="92" y="238" font-size="8.3" fill="#4f5d75">可 veto 本步</text>
    <circle cx="214" cy="200" r="9" fill="#bf4520"/>
    <text x="214" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">1</text>

    <rect x="258" y="184" width="190" height="80" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="270" y="207" font-size="11" font-weight="600" fill="#2d3142">组装请求</text>
    <text x="270" y="225" font-size="8.3" fill="#4f5d75">system + tools + history</text>
    <text x="270" y="238" font-size="8.3" fill="#4f5d75">token meter 计价</text>
    <circle cx="432" cy="200" r="9" fill="#bf4520"/>
    <text x="432" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">2</text>

    <rect x="476" y="184" width="176" height="80" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="488" y="207" font-size="11" font-weight="600" fill="#2d3142">模型调用</text>
    <text x="488" y="225" font-size="8.3" fill="#4f5d75">provider / model 锁定</text>
    <text x="488" y="238" font-size="8.3" fill="#4f5d75">maxTokens = 输出上限</text>
    <circle cx="636" cy="200" r="9" fill="#bf4520"/>
    <text x="636" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">3</text>

    <rect x="680" y="184" width="196" height="80" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="692" y="207" font-size="11" font-weight="600" fill="#2d3142">流式响应</text>
    <text x="692" y="225" font-size="8.3" fill="#4f5d75">finish: stop / max-tokens</text>
    <text x="692" y="238" font-size="8.3" fill="#4f5d75">usage 回写 token meter</text>
    <circle cx="860" cy="200" r="9" fill="#bf4520"/>
    <text x="860" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">3</text>
  </g>

  <!-- arrows -->
  <g stroke="#4f5d75" stroke-width="1.1" fill="none">
    <path d="M230 224 H252" marker-end="url(#arrow)"/>
    <path d="M448 224 H470" marker-end="url(#arrow)"/>
    <path d="M652 224 H674" marker-end="url(#arrow)"/>
  </g>

  <text x="570" y="280" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">retry ≤ 5 · 同一 step 内重跑</text>

  <!-- decision branch -->
  <g stroke="#4f5d75" stroke-width="1.1" fill="none">
    <path d="M778 264 V300 H470 V324" marker-end="url(#arrow)"/>
    <path d="M778 300 H800 V324" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="294" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">有 tool call</text>
  <text x="812" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">无</text>

  <rect x="350" y="330" width="240" height="68" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
  <text x="362" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">工具执行</text>
  <text x="362" y="369" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">maxParallelToolCalls = 10</text>
  <text x="362" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">超大结果截断 / spill 到文件</text>
  <circle cx="574" cy="346" r="9" fill="#bf4520"/>
  <text x="574" y="349" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#fff">4</text>

  <rect x="680" y="330" width="196" height="68" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
  <text x="692" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">turn/end</text>
  <text x="692" y="369" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">completed · max-tokens · abort</text>
  <text x="692" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">触发 turn-stopping hook</text>

  <!-- tool loop -->
  <g stroke="#bf4520" stroke-width="1.1" fill="none" stroke-dasharray="5,3">
    <path d="M470 398 V420 H100 V268" marker-end="url(#arrow-red)"/>
  </g>
  <text x="290" y="438" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">tool result 写回 → 下一个 step（turn 不重置）</text>

  <!-- legend -->
  <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="558" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">① 上下文压缩阈值 / 保留量　② 每步请求的输入计价　③ 单请求输出上限　④ 工具结果截断与落盘</text>
  <text x="40" y="576" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">DSH 没有 step 上限：只要模型继续返回 tool call，同一个 turn 可以一直跑；唯一常驻刹车是 ①。</text>
  <text x="920" y="576" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">NO STEP CAP</text>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/>
    </marker>
  </defs>
</svg>
