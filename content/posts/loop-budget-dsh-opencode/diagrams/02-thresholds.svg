<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="f2t f2d">
  <title id="f2t">同一 20 万 token 窗口下，DSH 与 OpenCode 的压缩阈值与保留量</title>
  <desc id="f2d">DSH 在 126.5k token 触发压缩，为输出预留 8k、为压缩余量保留 65.5k，压缩后保留约 30.7k；OpenCode 在 170k 触发，保留 30k buffer，压缩后保留 15k。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">CONTEXT BUDGET · SAME WINDOW, DIFFERENT BRAKES</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">同一个 200k 窗口，两条不同的压缩线</text>
  <text x="920" y="62" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">示例：W = 200k · O = 8k</text>

  <!-- DSH -->
  <text x="40" y="112" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">DSH</text>
  <text x="40" y="129" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">compaction-basic</text>

  <rect x="140" y="98" width="455" height="40" fill="#2d3142"/>
  <rect x="595" y="98" width="29" height="40" fill="#bf4520" opacity="0.22"/>
  <rect x="624" y="98" width="236" height="40" fill="#dedbd4"/>
  <rect x="140" y="98" width="720" height="40" fill="none" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>

  <text x="150" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#f5f5f5">已用 = 触发阈值 126.5k（63%）</text>
  <text x="742" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">headroom 65.5k：压缩前不再动用</text>

  <line x1="595" y1="88" x2="595" y2="150" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="595" y="82" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">T = W − O − 65,536</text>

  <line x1="140" y1="156" x2="140" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <line x1="250" y1="156" x2="250" y2="164" stroke="#bf4520" stroke-width="1"/>
  <line x1="595" y1="156" x2="595" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <line x1="860" y1="156" x2="860" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="176" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">0</text>
  <text x="250" y="176" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">R 30.7k</text>
  <text x="578" y="176" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">126.5k</text>
  <text x="626" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">O 8k</text>
  <text x="860" y="176" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">200k</text>
  <text x="140" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">压缩后只保留最近 R = 16% × (W − O) 的消息；不是把窗口缩到 30.7k 继续用。</text>

  <!-- OpenCode -->
  <text x="40" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">OpenCode</text>
  <text x="40" y="259" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">session/compaction</text>

  <rect x="140" y="228" width="612" height="40" fill="#2d3142"/>
  <rect x="752" y="228" width="108" height="40" fill="#dedbd4"/>
  <rect x="140" y="228" width="720" height="40" fill="none" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>

  <text x="150" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#f5f5f5">已用 = ceiling 170k（85%）</text>
  <text x="806" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">buffer 30k（15%）</text>

  <line x1="752" y1="218" x2="752" y2="280" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="752" y="212" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">C = W − max(15%, 16k)</text>

  <line x1="140" y1="286" x2="140" y2="294" stroke="#4f5d75" stroke-width="1"/>
  <line x1="194" y1="286" x2="194" y2="294" stroke="#bf4520" stroke-width="1"/>
  <line x1="752" y1="286" x2="752" y2="294" stroke="#4f5d75" stroke-width="1"/>
  <line x1="860" y1="286" x2="860" y2="294" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="306" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">0</text>
  <text x="194" y="306" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">K 15k</text>
  <text x="752" y="306" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">170k</text>
  <text x="860" y="306" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">200k</text>
  <text x="140" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">压缩后保留最近 K = 15k token 的消息，以及一条 summary；摘要本身也占用预算。</text>

  <!-- comparison -->
  <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <text x="40" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">DSH 提前 43.5k 触发，换来更大的保留区：压缩更频繁，但每次丢掉的上下文更少。</text>
  <text x="40" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">OpenCode 更晚触发、保留更少：压缩次数更少，但单次压缩的“断层”更深。</text>
  <text x="40" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">DSH: T = min(0.8W, W − O − 65,536)　　R = 0.16 × (W − O)</text>
  <text x="40" y="432" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">OC:  C = W − max(0.15W, 16,000)　　　　K = 15,000</text>
</svg>
