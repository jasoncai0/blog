<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f3t f3d">
  <title id="f3t">OpenCode 的 step 硬上限与输出续写预算</title>
  <desc id="f3d">OpenCode 在 agent 配置了 steps 时，第 N 步切换 toolChoice 为 none 并追加 MAX_STEPS_PROMPT；输出被截断时允许两次续写，第三次连续 length 抛 StepFailedError。压缩发生在请求前，且不增加 step。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">OPENCODE · HARD STOPS AND CONTINUATIONS</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">OpenCode 的三道刹车：step、输出、压缩</text>
  <text x="920" y="62" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">session/runner/llm.ts · step.ts</text>

  <!-- A -->
  <text x="40" y="100" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">A · agent.steps 是硬上限</text>
  <text x="920" y="100" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">step &gt;= steps → toolChoice: "none"</text>

  <line x1="80" y1="152" x2="880" y2="152" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
    <circle cx="150" cy="152" r="22" fill="#faf9f6" stroke="#4f5d75" stroke-width="1"/>
    <text x="150" y="156" text-anchor="middle" font-size="10" fill="#2d3142">N−2</text>
    <circle cx="330" cy="152" r="22" fill="#faf9f6" stroke="#4f5d75" stroke-width="1"/>
    <text x="330" y="156" text-anchor="middle" font-size="10" fill="#2d3142">N−1</text>
    <circle cx="510" cy="152" r="22" fill="#bf4520"/>
    <text x="510" y="156" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">N</text>
    <circle cx="740" cy="152" r="22" fill="#faf9f6" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="740" y="156" text-anchor="middle" font-size="9" fill="#5a6580">idle</text>
  </g>

  <g stroke="#4f5d75" stroke-width="1.1" fill="none">
    <path d="M172 152 H302" marker-end="url(#a)"/>
    <path d="M352 152 H482" marker-end="url(#a)"/>
    <path d="M532 152 H712" marker-end="url(#a)"/>
  </g>

  <text x="240" y="120" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">工具正常执行 · step++</text>
  <text x="510" y="118" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" font-weight="600" fill="#bf4520">toolChoice: "none"</text>
  <text x="620" y="140" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">文本回复结束</text>

  <text x="510" y="192" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">追加 MAX_STEPS_PROMPT</text>
  <text x="510" y="206" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">executeTool 拒绝任何调用</text>
  <text x="510" y="220" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#4f5d75">只允许文本收尾</text>
  <text x="740" y="192" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#5a6580">下一次用户输入</text>
  <text x="740" y="206" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#5a6580">step 重置为 1</text>

  <!-- B -->
  <line x1="40" y1="244" x2="920" y2="244" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">B · 输出截断只给两次续写</text>
  <text x="920" y="270" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">finish = "length" → CONTINUE_AFTER_OUTPUT_LIMIT</text>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
    <rect x="80" y="292" width="220" height="74" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="92" y="314" font-size="10" font-weight="600" fill="#2d3142">第 1 次 · finish=length</text>
    <text x="92" y="332" font-size="8.3" fill="#4f5d75">发 synthetic 续写提示</text>
    <text x="92" y="346" font-size="8.3" fill="#4f5d75">同一 step 内继续</text>

    <rect x="330" y="292" width="220" height="74" fill="#faf9f6" stroke="rgba(45,49,66,0.30)"/>
    <text x="342" y="314" font-size="10" font-weight="600" fill="#2d3142">第 2 次 · finish=length</text>
    <text x="342" y="332" font-size="8.3" fill="#4f5d75">再续写一次</text>
    <text x="342" y="346" font-size="8.3" fill="#4f5d75">仍计入连续 streak</text>

    <rect x="580" y="292" width="220" height="74" fill="#faf9f6" stroke="#bf4520" stroke-width="1.2"/>
    <text x="592" y="314" font-size="10" font-weight="600" fill="#bf4520">第 3 次 · finish=length</text>
    <text x="592" y="332" font-size="8.3" fill="#4f5d75">StepFailedError</text>
    <text x="592" y="346" font-size="8.3" fill="#4f5d75">"output token limit"</text>
  </g>

  <g stroke="#4f5d75" stroke-width="1.1" fill="none">
    <path d="M300 329 H322" marker-end="url(#a)"/>
    <path d="M550 329 H572" marker-end="url(#a)"/>
  </g>

  <text x="80" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">只有最近 3 条都是 assistant 且 finish=length 才失败；中间出现 user 或其他 finish，streak 会重置。</text>
  <text x="80" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">每次续写仍算一个 step：所以“先撞 step 还是先撞输出”，取决于 steps 与单步输出量。</text>

  <!-- C -->
  <line x1="40" y1="436" x2="920" y2="436" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">C · 压缩不花 step，但会改变下一步的输入</text>
  <text x="40" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" fill="#4f5d75">每次模型请求前先尝试 auto compaction；若 completed，换一个新的 assistantMessageID 并 continue，step 不增加。</text>
  <text x="40" y="502" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" fill="#4f5d75">压缩完成后的请求，输入变成 summary + 最近 keep（默认 15k）消息，于是下一次计价从新的、更低的基线开始。</text>
  <text x="40" y="532" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">工具结果同样截断并落盘：默认上限 2,000 行 / 50 KiB，超出部分存到 tool-output/&lt;id&gt;，结果里留路径。</text>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/>
    </marker>
  </defs>
</svg>
