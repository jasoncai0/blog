<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f03-d03-title f03-d03-desc">
  <title id="f03-d03-title">沙箱决策：从模式到 confine 再到三类结果</title>
  <desc id="f03-d03-desc">五个阶段：读取模式、解析策略、可选批准、confine、起进程并判别。底部是三条失败出口：runner 失败、命令被拒、正常返回。</desc>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <defs>
    <marker id="f03-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="40" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#bf4520">SANDBOX / DECISION PATH</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="17" fill="#2d3142">只约束文件效果的五个阶段</text>
  <text x="40" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="9.5" fill="#4f5d75">批准是可选的；判别顺序不能反：runner 失败说明命令根本没跑。</text>

  <!-- stage cards -->
  <rect x="40" y="132" width="168" height="78" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="54" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">01 MODE</text>
  <text x="54" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">read-only</text>
  <text x="54" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">workspace-write</text>
  <text x="54" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#8a8f9e">danger-full-access →</text>

  <rect x="228" y="132" width="168" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="242" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">02 RESOLVE</text>
  <text x="242" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">sandboxPolicy</text>
  <text x="242" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">.resolve({session})</text>
  <text x="242" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a8f9e">读会话，不读全局</text>

  <rect x="416" y="132" width="168" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="430" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">03 APPROVE</text>
  <text x="430" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">approveEscalation</text>
  <text x="430" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">严格更宽 + 有批准服务</text>
  <text x="430" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a8f9e">仅当模型请求时</text>

  <rect x="604" y="132" width="168" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="618" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">04 CONFINE</text>
  <text x="618" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">confine(argv)</text>
  <text x="618" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">包成 ConfinedArgv</text>
  <text x="618" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a8f9e">不执行任何东西</text>

  <rect x="792" y="132" width="128" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="806" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">05 SPAWN</text>
  <text x="806" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">spawn</text>
  <text x="806" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">起进程、收集</text>
  <text x="806" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a8f9e">然后才判别</text>

  <g stroke="#bf4520" stroke-width="1.1" fill="none" marker-end="url(#f03-ar)">
    <line x1="208" y1="171" x2="224" y2="171"/>
    <line x1="396" y1="171" x2="412" y2="171"/>
    <line x1="584" y1="171" x2="600" y2="171"/>
    <line x1="772" y1="171" x2="788" y2="171"/>
  </g>

  <!-- annotations -->
  <text x="40" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">三种模式只治理文件效果</text>
  <text x="228" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">批准模式 &gt; sandbox/mode 事件 &gt; 默认</text>
  <text x="416" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">拒绝就返回理由，不抛异常</text>
  <text x="604" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">带 enforcement 与两类特征</text>
  <text x="792" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">命令已跑，副作用已发生</text>

  <!-- danger-full-access branch -->
  <path d="M196,196 L196,286" stroke="#bf4520" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#f03-ar)"/>
  <rect x="40" y="292" width="356" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="312" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">SHORTCUT — danger-full-access</text>
  <text x="54" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">bash-sandbox 直接调 super.execute，raw argv 起进程。</text>
  <text x="54" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#8a8f9e">ctx.sandbox 一次都不参与，TypeScript 也不允许把这个模式传给 confine。</text>

  <!-- confine contract -->
  <rect x="416" y="292" width="504" height="62" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="430" y="312" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#bf4520">CONFINED ARGV — 四个字段</text>
  <text x="430" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">argv · enforcement ('full' | 'partial') · denialSignatures · runnerFailureRules</text>
  <text x="430" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">拒绝特征是后端方言（EROFS / EACCES / EPERM），不是跨后端并集。</text>

  <!-- classification -->
  <text x="40" y="386" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">CLASSIFY — 顺序不可交换</text>

  <rect x="40" y="398" width="272" height="94" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">1. classifyRunnerFailure</text>
  <text x="54" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">先看 allowedExitCodes，再剔除 informationalLines，</text>
  <text x="54" y="451" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">最后在每条 stderr 行里匹配 fatalSignatures。</text>
  <text x="54" y="472" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">→ SANDBOX_UNAVAILABLE</text>

  <rect x="344" y="398" width="272" height="94" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="358" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">2. classifyDenial</text>
  <text x="358" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">命中拒绝特征，且不是信号死亡，才算拒绝。</text>
  <text x="358" y="451" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">结果带 sandbox: {mode, denied, enforcement}。</text>
  <text x="358" y="472" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">→ 拒绝标记 + 提权提示</text>

  <rect x="648" y="398" width="272" height="94" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="662" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">3. 正常结果</text>
  <text x="662" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">退出码可能是非零，但命令确实跑过了。</text>
  <text x="662" y="451" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">前台与后台共用同一份分类逻辑。</text>
  <text x="662" y="472" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">→ 交给渲染层</text>

  <g stroke="#bf4520" stroke-width="1" fill="none" marker-end="url(#f03-ar)">
    <line x1="312" y1="440" x2="340" y2="440"/>
    <line x1="616" y1="440" x2="644" y2="440"/>
  </g>

  <text x="40" y="522" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="9.5" fill="#2d3142">顺序反了会把"沙箱没装"报成"权限不足"：模型于是去申请提权，而真正要修的是 runner。</text>
  <text x="40" y="544" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">enforcement: 'partial' 不表示没有约束，只表示后端覆盖不全；它进结果，不进安全判断。</text>
  <text x="40" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">没有可用后端时 confine 抛 SandboxUnavailableError；静默降级成不受约束的执行，任何情况下都不合法。</text>
</svg>
