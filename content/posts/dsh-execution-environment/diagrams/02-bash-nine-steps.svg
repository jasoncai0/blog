<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f02-d02-title f02-d02-desc">
  <title id="f02-d02-title">一次 bash 调用的九步</title>
  <desc id="f02-d02-desc">九步沿时间轴排列：前七步在进程之外完成策略、校验、批准与请求组装，第八步才 confine 并起进程，第九步收敛结果。右侧标出每一步由哪个 seam 执行。</desc>
  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#bf4520">TOOL-BASH / NINE STEPS</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="17" fill="#2d3142">九步里，前七步不碰进程</text>
  <text x="40" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="9.5" fill="#4f5d75">每一步的失败语义不同：参数错可重试，策略错要换路径，执行错是既成事实。</text>

  <line x1="40" y1="112" x2="920" y2="112" stroke="#d8d8d8"/>
  <text x="40" y="108" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">STEP / WHAT IT DOES</text>
  <text x="900" y="108" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">RUNS IN</text>

  <circle cx="60" cy="162" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="165" x2="60" y2="193" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="166" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">01</text>
  <text x="102" y="166" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">resolveSandboxPolicy(exec)</text>
  <text x="102" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">读会话策略：批准模式 > 最后一条 sandbox/mode > 部署默认</text>
  <text x="900" y="166" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ctx.sandboxPolicy</text>
  <circle cx="60" cy="193" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="196" x2="60" y2="224" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="197" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">02</text>
  <text x="102" y="197" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">validateBashArgs(args, mode)</text>
  <text x="102" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">命令与描述非空，timeout 为正有限数，提权字段配套</text>
  <text x="900" y="197" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">tool-bash</text>
  <circle cx="60" cy="224" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="227" x2="60" y2="255" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="228" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">03</text>
  <text x="102" y="228" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">approveEscalation(...)</text>
  <text x="102" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">仅当 sandbox_permissions 与 justification 同时出现</text>
  <text x="900" y="228" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ctx.approval</text>
  <circle cx="60" cy="255" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="258" x2="60" y2="286" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="259" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">04</text>
  <text x="102" y="259" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">组合本次 policy</text>
  <text x="102" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">副本上覆盖 mode，原策略对象不动</text>
  <text x="900" y="259" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">tool-bash</text>
  <circle cx="60" cy="286" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="289" x2="60" y2="317" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">05</text>
  <text x="102" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">workingDirectory.ensure</text>
  <text x="102" y="303" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">确保会话目录存在，再 resolveWorkdir(args.workdir)</text>
  <text x="900" y="290" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ctx.workingDirectory</text>
  <circle cx="60" cy="317" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="320" x2="60" y2="348" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="321" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">06</text>
  <text x="102" y="321" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">shellEnv.collect(exec)</text>
  <text x="102" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">清掉宿主 DSH_*，注入受管快照</text>
  <text x="900" y="321" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ctx.shellEnv</text>
  <circle cx="60" cy="348" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="351" x2="60" y2="379" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">07</text>
  <text x="102" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">shell.resolve(request)</text>
  <text x="102" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">补 timeout / workdir / onExpiry 默认值，得到 spec</text>
  <text x="900" y="352" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">ctx.shell</text>
  <circle cx="60" cy="379" r="2.6" fill="#bf4520"/>
  <line x1="60" y1="382" x2="60" y2="410" stroke="#e3b8a8" stroke-width="1"/>
  <text x="78" y="383" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">08</text>
  <text x="102" y="383" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">execute(spec) → spawn</text>
  <text x="102" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">confine(['bash','-c',cmd]) 后起进程，收集输出</text>
  <text x="900" y="383" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">bash-sandbox → subprocess</text>
  <circle cx="60" cy="410" r="2.6" fill="#bf4520"/>
  <text x="78" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">09</text>
  <text x="102" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">result() → canonical</text>
  <text x="102" y="427" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9e">aborted 抛 TOOL_ABORTED，否则拼 exit pill 与正文</text>
  <text x="900" y="414" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">tool-bash</text>

  <line x1="40" y1="438" x2="920" y2="438" stroke="#d8d8d8" stroke-dasharray="3 3"/>
  <text x="40" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#8a8f9e">第 8 步之后命令已经跑过，重试会产生新副作用；第 9 步只做分类与渲染。</text>

  <rect x="40" y="474" width="880" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="496" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">THREE FAILURE CLASSES</text>
  <text x="56" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">参数错 → 第 2 步抛出，改参数即可重试</text>
  <text x="56" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">策略错 → 第 3、4 步拒绝，工具返回理由与当前模式</text>
  <text x="56" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">执行错 → 第 8 步之后，退出码与输出是事实</text>
  <text x="520" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#4f5d75">参数校验发生在策略解析之后，因为提权是否"同值无操作"要看当前模式。</text>
  <text x="520" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#4f5d75">非零退出不是 job 失败，只是命令失败；两者在 UI 上文案不同。</text>
  <text x="520" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#4f5d75">批准只对这一次调用有效，下一次回到标准策略。</text>
</svg>
