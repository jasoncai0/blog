<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-d17b-title f02-d17b-desc">
  <title id="f02-d17b-title">记忆的写入与读取两个方向</title>
  <desc id="f02-d17b-desc">左侧四个写入者把 inbox 注入、AGENTS.md 变化、技能目录与时间、压缩 checkpoint 写入中央的仅追加会话日志；右侧四个读取步骤从日志派生消息、组装 prompt、投影上下文，最后形成一次模型请求。</desc>
  <defs>
    <marker id="f02-m17b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f02-m17bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/>
    </marker>
    <marker id="f02-m17br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#bf4520">MEMORY / TWO DIRECTIONS</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" font-weight="600" fill="#2d3142">写进日志，读出请求</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">写入侧只有一个终点；读取侧没有缓存，每次请求重新折叠、重新渲染、重新投影</text>

  <text x="40" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#2f6f5e">WRITE →</text>
  <text x="640" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#7a5aa8">→ READ</text>

  <!-- writes -->
  <rect x="40" y="130" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">agent.inject()</text>
  <text x="56" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">先写 inbox splice，认领时变 user/message</text>
  <text x="56" y="186" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">next-turn / next-step</text>

  <rect x="40" y="208" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">AGENTS.md 变化</text>
  <text x="56" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">pre-step compose：baseline + 增量</text>
  <text x="56" y="264" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">set / replace / remove</text>

  <rect x="40" y="286" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">目录与时间</text>
  <text x="56" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">技能目录按 digest 替换；时间按间隔追加</text>
  <text x="56" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">skill-catalog / time-context</text>

  <rect x="40" y="364" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">压缩 checkpoint</text>
  <text x="56" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">summary 事件 + 一条 replace 消息</text>
  <text x="56" y="420" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">surfaceOp: { op: 'replace' }</text>

  <!-- log -->
  <rect x="380" y="130" width="200" height="298" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="396" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">SessionEvent log</text>
  <text x="396" y="172" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">APPEND-ONLY</text>
  <line x1="396" y1="184" x2="564" y2="184" stroke="#e6e2dc" stroke-width="1"/>
  <text x="396" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">turn/*  step/*</text>
  <text x="396" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">system/message</text>
  <text x="396" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">user/message</text>
  <text x="396" y="264" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">assistant/message</text>
  <text x="396" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">tool/call · tool/result</text>
  <text x="396" y="304" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">request/header</text>
  <text x="396" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">compaction/*</text>
  <text x="396" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">seq 单调递增</text>
  <text x="396" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">surface 是折叠出来的视图</text>
  <text x="396" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">日志不删除；</text>
  <text x="396" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">压缩只遮蔽。</text>

  <!-- reads -->
  <rect x="640" y="130" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="656" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">deriveMessages()</text>
  <text x="656" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">折叠 current surface，得到模型历史</text>
  <text x="656" y="186" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">session/src/index.ts:999</text>

  <rect x="640" y="208" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="656" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">assemble()</text>
  <text x="656" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">section · context · tools · 变量</text>
  <text x="656" y="264" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">system-prompt/src/index.ts:620</text>

  <rect x="640" y="286" width="280" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="656" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">render + project</text>
  <text x="656" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">system/message 节点 0；runtime-context</text>
  <text x="656" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">runtime-context.ts:157</text>

  <rect x="640" y="364" width="280" height="64" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="656" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">一次模型请求</text>
  <text x="656" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">system prompt + 派生历史 + 工具 schema</text>
  <text x="656" y="420" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">ctx.llm.stream()</text>

  <!-- arrows -->
  <line x1="320" y1="162" x2="374" y2="162" stroke="#2f6f5e" stroke-width="1.2" marker-end="url(#f02-m17bw)"/>
  <line x1="320" y1="240" x2="374" y2="240" stroke="#2f6f5e" stroke-width="1.2" marker-end="url(#f02-m17bw)"/>
  <line x1="320" y1="318" x2="374" y2="318" stroke="#2f6f5e" stroke-width="1.2" marker-end="url(#f02-m17bw)"/>
  <line x1="320" y1="396" x2="374" y2="396" stroke="#2f6f5e" stroke-width="1.2" marker-end="url(#f02-m17bw)"/>

  <line x1="586" y1="162" x2="634" y2="162" stroke="#7a5aa8" stroke-width="1.2" marker-end="url(#f02-m17br)"/>
  <line x1="586" y1="240" x2="634" y2="240" stroke="#7a5aa8" stroke-width="1.2" marker-end="url(#f02-m17br)"/>
  <line x1="586" y1="318" x2="634" y2="318" stroke="#7a5aa8" stroke-width="1.2" marker-end="url(#f02-m17br)"/>
  <line x1="586" y1="396" x2="634" y2="396" stroke="#7a5aa8" stroke-width="1.2" marker-end="url(#f02-m17br)"/>

  <text x="40" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">写入侧的四条路都汇成一个动作：append。读取侧没有「记住的上下文」这种对象，只有每次折叠的结果。</text>
  <text x="40" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">这就是为什么检索结果必须作为 tool/result 回来：它得先经过中间那条日志，才能出现在右边的请求里。</text>
  <text x="40" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#8a93a6">MODEL-VISIBLE ⟺ LOGGED</text>
  <text x="40" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">没有事件，就没有发生过；有事件，就一定能在下次请求里被重新装配出来。</text>
</svg>
