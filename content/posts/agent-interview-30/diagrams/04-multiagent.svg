<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f4-t f4-d"><title id="f4-t">多 Agent 的中心化拓扑与租约接管</title><desc id="f4-d">左图：Orchestrator 拆任务分派给三个各占独立 worktree 的 Worker，结果统一交给唯一的 Integrator 合入。右图：执行者持续续租，心跳丢失后租约到期，新执行者代次加一接管，旧执行者恢复后因代次落后被拒绝。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">MULTI-AGENT · TOPOLOGY &amp; LEASE</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">协作的难点不在拆，在收口和接管</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">拆得越开，越需要一个唯一的合入点和一个能判失效的租约</text><text x="60" y="130" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" font-weight="600" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">中心化：拆 / 做 / 合</text><rect x="180" y="150" width="170" height="46" rx="5" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/><text x="265" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="600" text-anchor="middle" fill="#bf4520">Orchestrator</text><text x="265" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#8a6a52">拆任务 · 分派 · 汇总</text><rect x="64" y="240" width="112" height="54" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="120" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#5b4b8a">Worker A</text><text x="120" y="273" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#7a6a9e">独立 worktree</text><path d="M265,196 L120,238" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="120,238 124.1,234.5 125.3,238.7" fill="#5a6580" stroke="none"/><path d="M120,294 L265,338" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="265,338 259.6,338.7 260.9,334.5" fill="#5a6580" stroke="none"/><rect x="180" y="240" width="112" height="54" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="236" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#5b4b8a">Worker B</text><text x="236" y="273" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#7a6a9e">独立 worktree</text><path d="M265,196 L236,238" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="236,238 237.0,232.7 240.6,235.2" fill="#5a6580" stroke="none"/><path d="M236,294 L265,338" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="265,338 260.4,335.1 264.1,332.7" fill="#5a6580" stroke="none"/><rect x="296" y="240" width="112" height="54" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="352" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#5b4b8a">Worker C</text><text x="352" y="273" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="middle" fill="#7a6a9e">独立 worktree</text><path d="M265,196 L352,238" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="352,238 346.6,237.8 348.5,233.9" fill="#5a6580" stroke="none"/><path d="M352,294 L265,338" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="265,338 268.4,333.8 270.4,337.7" fill="#5a6580" stroke="none"/><rect x="180" y="340" width="170" height="46" rx="5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><text x="265" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="600" text-anchor="middle" fill="#2f6f5e">Integrator</text><text x="265" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f7d6e">唯一合入点 · 串行</text><text x="60" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">为什么必须只有一个合入点：三个 Worker 各写一处，合并时的冲突就是第四个人</text><text x="60" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">要处理的问题，而且它拿不到完整的上下文。</text><text x="520" y="130" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" font-weight="600" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">租约：失联之后谁来接</text><path d="M560,168 L560,452" fill="none" stroke="#9aa3b2" stroke-width="1.2"/><polygon points="560,458 556.9,450.5 563.1,450.5" fill="#9aa3b2" stroke="none"/><circle cx="560" cy="190" r="5" fill="#2f6f5e"/><circle cx="560" cy="190" r="8.5" fill="none" stroke="#2f6f5e" stroke-width="0.8" opacity="0.45"/><text x="582" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#2f6f5e">心跳续租</text><text x="582" y="201" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">执行者 A 每 10 秒续一次，租约有效</text><circle cx="560" cy="245" r="5" fill="#a8752a"/><circle cx="560" cy="245" r="8.5" fill="none" stroke="#a8752a" stroke-width="0.8" opacity="0.45"/><text x="582" y="243" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#a8752a">心跳丢失</text><text x="582" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">A 卡住或网络断，租约还没到期</text><circle cx="560" cy="300" r="5" fill="#9b4b52"/><circle cx="560" cy="300" r="8.5" fill="none" stroke="#9b4b52" stroke-width="0.8" opacity="0.45"/><text x="582" y="298" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#9b4b52">租约到期</text><text x="582" y="311" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">A 的写入开始被 fencing 挡住</text><circle cx="560" cy="355" r="5" fill="#5b4b8a"/><circle cx="560" cy="355" r="8.5" fill="none" stroke="#5b4b8a" stroke-width="0.8" opacity="0.45"/><text x="582" y="353" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#5b4b8a">代次 +1 接管</text><text x="582" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">B 读到过期租约，拿到新代次</text><circle cx="560" cy="410" r="5" fill="#9b4b52"/><circle cx="560" cy="410" r="8.5" fill="none" stroke="#9b4b52" stroke-width="0.8" opacity="0.45"/><text x="582" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" text-anchor="start" fill="#9b4b52">旧执行者被拒</text><text x="582" y="421" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">A 恢复后提交，代次落后 → 拒绝</text><path d="M544,190 L544,300" fill="none" stroke="#a8752a" stroke-width="1" stroke-dasharray="3 3"/><path d="M544,190 L548,190 M544,300 L548,300" stroke="#a8752a" stroke-width="1"/><text x="527" y="245" transform="rotate(-90 527 245)" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="500" text-anchor="start" fill="#a8752a">租约有效期</text><rect x="60" y="500" width="840" height="60" rx="6" fill="#e9eff6" stroke="#c3cede" stroke-width="1"/><text x="76" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#3d5a80">接管的三条硬要求</text><text x="76" y="537" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">租约带过期时间、每次提交带代次、接收方只认最新代次。三条缺一条，就会出现两个执行者同时写，最后一个覆盖前一个。</text><text x="76" y="551" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">旧执行者恢复后不是「重试」，而是先读租约：自己已经过期，就把手上的结果当废稿报出来，不能直接提交。</text></svg>