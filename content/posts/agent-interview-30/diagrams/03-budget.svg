<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f3-t f3-d"><title id="f3-t">上下文窗口的预算分配与超预算处理顺序</title><desc id="f3-d">左侧以 200K 窗口为例，把预算分给系统指令、工具定义、任务目标、历史对话、检索证据和输出预留；右侧是按顺序执行的五步处理：去重、裁剪证据、去掉暂时不用的工具、压缩历史、最后才摘要。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">CONTEXT BUDGET</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">窗口是预算，先分配，再按顺序砍</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">压缩是最后一步，不是第一步：前面四步都不丢信息，摘要会丢</text><text x="60" y="130" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">200K 窗口 · 一次任务的典型花法</text><text x="380" y="130" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.12em">超预算时，从上到下依次执行</text><rect x="60" y="140" width="120" height="30" fill="#b9bfc9"/><rect x="60" y="170" width="120" height="126" fill="#2f6f5e"/><rect x="60" y="296" width="120" height="66" fill="#4f8a78"/><rect x="60" y="362" width="120" height="18" fill="#bf4520"/><rect x="60" y="380" width="120" height="36" fill="#5b4b8a"/><rect x="60" y="416" width="120" height="24" fill="#3d5a80"/><rect x="60" y="140" width="120" height="300" fill="none" stroke="#c9cdd6" stroke-width="1"/><text x="196" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">输出预留 10%</text><text x="196" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">硬预留，不让前面的内容挤占</text><text x="196" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">检索证据 42%</text><text x="196" y="253" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">先按需检索，别一次性全灌进来</text><text x="196" y="333" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">历史对话 22%</text><text x="196" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">保留结论与纠正，丢掉探索过程</text><text x="196" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">任务目标 6%</text><text x="196" y="405" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">工具定义 12%</text><text x="196" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">系统指令 8%</text><rect x="380" y="136" width="520" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="380" y="136" width="3.5" height="58" rx="2" fill="#2f6f5e"/><text x="400" y="157" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#2f6f5e">01</text><text x="422" y="157" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#2d3142">去掉重复内容</text><text x="422" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">同一份文件读了两遍、同样的检索结果出现三次，先合并。省得多，不丢信息。</text><rect x="380" y="200" width="520" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="380" y="200" width="3.5" height="58" rx="2" fill="#2f6f5e"/><text x="400" y="221" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#2f6f5e">02</text><text x="422" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#2d3142">裁剪证据</text><text x="422" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">整篇文档换成命中的段落和行号，保留出处，丢掉无关正文。</text><rect x="380" y="264" width="520" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="380" y="264" width="3.5" height="58" rx="2" fill="#5b4b8a"/><text x="400" y="285" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#5b4b8a">03</text><text x="422" y="285" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#2d3142">摘掉暂时不用的工具</text><text x="422" y="302" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">按当前阶段挂载工具，定义本身就是成本，工具太多还会选错。</text><rect x="380" y="328" width="520" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="380" y="328" width="3.5" height="58" rx="2" fill="#3d5a80"/><text x="400" y="349" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">04</text><text x="422" y="349" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#2d3142">压缩历史</text><text x="422" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">从最老的轮次开始，保留结论、决策和用户纠正，删掉试错细节。</text><rect x="380" y="392" width="520" height="58" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="380" y="392" width="3.5" height="58" rx="2" fill="#9b4b52"/><text x="400" y="413" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" text-anchor="start" fill="#9b4b52">05</text><text x="422" y="413" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#2d3142">摘要兜底</text><text x="422" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">前四步都做完还超，才摘要。摘要丢的细节找不回来，要记下丢了什么。</text><rect x="60" y="470" width="840" height="56" rx="6" fill="#f8eae8" stroke="#d8b6b9" stroke-width="1"/><text x="76" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#9b4b52">阈值：没有通用的 80%</text><text x="76" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">按「这次请求还剩多少额度」算，而不是看占满的百分比：长上下文模型和一个只塞两页的短任务，同一个比例背后的余量差很远。触发点写在请求构造处，别靠模型自己感觉。</text></svg>
