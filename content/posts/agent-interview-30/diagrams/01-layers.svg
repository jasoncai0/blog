<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="f1-t f1-d"><title id="f1-t">Agent 运行时的六层结构</title><desc id="f1-d">自上而下六层：L0 目标与指令、L1 决策与规划、L2 上下文与记忆、L3 协作、L4 执行、L5 治理与观测。每层右侧标注本文对应题号。L5 贯穿其他五层，负责判定能否结束、结果是否可信、出事怎么定位。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">RUNTIME LAYERS · 30 QUESTIONS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">面试题按运行时分层，不按论文分类</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">同一个问题在不同层被追问，答案的落点完全不同：模型想做什么，和系统允许它做什么</text><rect x="60" y="108" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="108" width="3.5" height="68" rx="2" fill="#3d5a80"/><text x="78" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#3d5a80" letter-spacing="0.14em">L0</text><text x="112" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">目标与指令</text><text x="112" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">用户要什么、边界在哪、什么算做完。这一层含糊，后面每一层都会放大它。</text><text x="886" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#3d5a80">Q1 · Q2</text><text x="886" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">输入</text><rect x="60" y="184" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="184" width="3.5" height="68" rx="2" fill="#5b4b8a"/><text x="78" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5b4b8a" letter-spacing="0.14em">L1</text><text x="112" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">决策与规划</text><text x="112" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">下一步由谁决定、计划做多细、要不要反思。Workflow 和 Agent 的分界线在这层。</text><text x="886" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#5b4b8a">Q3–Q7 · Q14 · Q15</text><text x="886" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">决策</text><rect x="60" y="260" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="260" width="3.5" height="68" rx="2" fill="#2f6f5e"/><text x="78" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#2f6f5e" letter-spacing="0.14em">L2</text><text x="112" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">上下文与记忆</text><text x="112" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">这一轮给模型看什么、跨轮存什么、超预算先删谁。窗口是预算，不是仓库。</text><text x="886" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#2f6f5e">Q8 · Q9 · Q12 · Q17 · Q29</text><text x="886" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">数据</text><rect x="60" y="336" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="336" width="3.5" height="68" rx="2" fill="#5b4b8a"/><text x="78" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5b4b8a" letter-spacing="0.14em">L3</text><text x="112" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">协作</text><text x="112" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">谁拆任务、谁执行、怎么交接、执行者失联谁接管。并行能不能做，取决于冲突面。</text><text x="886" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#5b4b8a">Q10 · Q11 · Q16 · Q22</text><text x="886" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">协作</text><rect x="60" y="412" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="412" width="3.5" height="68" rx="2" fill="#5b4b8a"/><text x="78" y="436" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5b4b8a" letter-spacing="0.14em">L4</text><text x="112" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">执行</text><text x="112" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">工具怎么调、状态怎么存、数据库权限卡在哪。模型输出的是意图，副作用发生在这一层。</text><text x="886" y="436" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#5b4b8a">Q13 · Q18 · Q24</text><text x="886" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">执行</text><rect x="60" y="488" width="840" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="488" width="3.5" height="68" rx="2" fill="#a8752a"/><text x="78" y="512" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#a8752a" letter-spacing="0.14em">L5</text><text x="112" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3142">治理与观测</text><text x="112" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4f5d75">怎么判定完成、怎么防死循环、出事怎么定位、谁能改它。贯穿上面五层。</text><text x="886" y="512" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#a8752a">Q19–Q21 · Q23 · Q25–Q28 · Q30</text><text x="886" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">治理</text><path d="M926,128 L926,548" fill="none" stroke="#9aa3b2" stroke-width="1.1"/><polygon points="926,554 922.9,546.5 929.1,546.5" fill="#9aa3b2" stroke="none"/><text transform="rotate(90 941 336)" x="941" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6" letter-spacing="0.1em">一次任务的方向</text><rect x="60" y="596" width="840" height="44" rx="6" fill="#e9eff6" stroke="#c3cede" stroke-width="1"/><text x="76" y="616" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#3d5a80">读法：题目编号固定，落点随追问移动</text><text x="76" y="631" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">问「为什么死循环」在 L1，问「谁批准继续」在 L5。答错层，机制讲得再细也不算答到。</text></svg>
