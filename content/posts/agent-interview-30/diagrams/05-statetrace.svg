<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f5-t f5-d"><title id="f5-t">任务状态机：完成必须有确定性证据</title><desc id="f5-d">状态只能从 PLAN 前进到 EXECUTING、EXECUTED、VERIFIED、DONE。模型只能把状态推到 EXECUTED，VERIFIED 必须由代码检查外部状态后写入。红色虚线表示模型自称完成直接跳到 DONE 的捷径，被状态机拒绝。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">TASK STATE MACHINE</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">「说完成了」和「已完成」是两个状态</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">状态只能前进；能写某个状态的组件是固定的，模型只拥有 EXECUTING 和 EXECUTED 的写入权</text><text x="60" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#8a93a6">每一跳的写入权不同：执行器写 EXECUTED，检查器写 VERIFIED，交付层写 DONE</text><rect x="70" y="170" width="140" height="56" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1.4"/><text x="140.0" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.2" font-weight="600" text-anchor="middle" fill="#bf4520" letter-spacing="0.06em">PLAN</text><text x="140.0" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#6b7280">目标 + 验收条件</text><rect x="240" y="170" width="140" height="56" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.4"/><text x="310.0" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.2" font-weight="600" text-anchor="middle" fill="#5b4b8a" letter-spacing="0.06em">EXECUTING</text><text x="310.0" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#6b7280">模型决定下一步</text><path d="M214,198.0 L234,198.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="234,198.0 229.1,200.2 229.1,195.8" fill="#5a6580" stroke="none"/><rect x="410" y="170" width="140" height="56" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.4"/><text x="480.0" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.2" font-weight="600" text-anchor="middle" fill="#5b4b8a" letter-spacing="0.06em">EXECUTED</text><text x="480.0" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#6b7280">副作用已发生</text><path d="M384,198.0 L404,198.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="404,198.0 399.1,200.2 399.1,195.8" fill="#5a6580" stroke="none"/><rect x="580" y="170" width="140" height="56" rx="6" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.4"/><text x="650.0" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.2" font-weight="600" text-anchor="middle" fill="#2f6f5e" letter-spacing="0.06em">VERIFIED</text><text x="650.0" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#6b7280">外部状态已核对</text><path d="M554,198.0 L574,198.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="574,198.0 569.1,200.2 569.1,195.8" fill="#5a6580" stroke="none"/><rect x="747" y="167" width="146" height="62" rx="7" fill="none" stroke="#2f6f5e" stroke-width="1" opacity="0.5"/><rect x="750" y="170" width="140" height="56" rx="6" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.4"/><text x="820.0" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.2" font-weight="600" text-anchor="middle" fill="#2f6f5e" letter-spacing="0.06em">DONE</text><text x="820.0" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#6b7280">已交付</text><path d="M724,198.0 L744,198.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="744,198.0 739.1,200.2 739.1,195.8" fill="#5a6580" stroke="none"/><path d="M140,232 C140,318 820,318 820,232" fill="none" stroke="#9b4b52" stroke-width="1.3" stroke-dasharray="5 4"/><polygon points="820,232 816.4,239.4 823.6,239.4" fill="#9b4b52" stroke="none"/><circle cx="480" cy="312" r="11" fill="#f8eae8" stroke="#9b4b52" stroke-width="1.1"/><path d="M475,307 L485,317 M485,307 L475,317" stroke="#9b4b52" stroke-width="1.6" stroke-linecap="round"/><text x="480" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="500" text-anchor="middle" fill="#9b4b52">模型自称完成，直接跳到 DONE：状态机拒绝，不写终态</text><rect x="60" y="366" width="270" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="74" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">EXECUTED 只能由执行器写</text><text x="74" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">工具真的返回了结果，不是模型说「已调用」。</text><text x="74" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#8a93a6">写入方：执行器</text><rect x="350" y="366" width="270" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="364" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">VERIFIED 只能由检查器写</text><text x="364" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">测试跑过、库里查到状态、文件内容对得上。</text><text x="364" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#8a93a6">写入方：检查器</text><rect x="640" y="366" width="270" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="654" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2d3142">DONE 之后才能说完成</text><text x="654" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">对外回复只引用已验证字段，其余写待确认。</text><text x="654" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#8a93a6">写入方：交付层</text><rect x="60" y="466" width="840" height="40" rx="6" fill="#f7efe4" stroke="#e0c3ae" stroke-width="1"/><text x="76" y="485" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#bf4520">超时不是失败</text><text x="160" y="485" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#4f5d75">带幂等键去查业务状态；查得到就按真实状态推进，查不清就返回「待确认」，不能包装成成功。</text></svg>