<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f2-t f2-d"><title id="f2-t">ReAct、Plan-and-Execute、Reflection 的执行轨迹对比</title><desc id="f2-d">三条轨迹：ReAct 每步思考、行动、观察循环，没有全局计划；Plan-and-Execute 先一次性规划再逐步执行，偏差时才重规划；Reflection 先生成再评估再改进，按轮循环。右下角给出选择顺序。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">THREE TRACES · SAME TASK</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">三条轨迹的差别在「计划在什么时候定」</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">ReAct 边做边看，Plan 先定后做，Reflection 做完再改；三者可以叠加，不是互斥选项</text><text x="60" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" text-anchor="start" fill="#bf4520" letter-spacing="0.08em">REACT</text><text x="60" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">下一步取决于上一步</text><text x="60" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">的观察结果</text><text x="900" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">N 步 × 每步 1 次模型调用</text><rect x="270" y="128" width="96" height="46" rx="5" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/><text x="318" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#bf4520">思考</text><text x="318" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#8a6a52">reason</text><rect x="410" y="128" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="458" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">行动</text><text x="458" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">tool call</text><rect x="550" y="128" width="96" height="46" rx="5" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/><text x="598" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3d5a80">观察</text><text x="598" y="162" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#5f7799">tool result</text><path d="M366,151 L410,151" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="410,151 404.6,148.4 404.6,153.6" fill="#5a6580" stroke="none"/><path d="M506,151 L550,151" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="550,151 544.6,148.4 544.6,153.6" fill="#5a6580" stroke="none"/><path d="M598,174 C598,214 318,214 318,176" fill="none" stroke="#9aa3b2" stroke-width="1.1" stroke-dasharray="4 3"/><polygon points="318,174 315.2,181.2 320.8,181.2" fill="#9aa3b2" stroke="none"/><text x="458" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">观察结果回到下一轮，直到判断可以停</text><text x="60" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" text-anchor="start" fill="#5b4b8a" letter-spacing="0.08em">PLAN → EXECUTE</text><text x="60" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">先把步骤定完再执行</text><text x="60" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">偏差时才重规划</text><text x="900" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">1 次规划 + N 次执行</text><rect x="270" y="268" width="110" height="46" rx="5" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/><text x="325" y="287" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#bf4520">规划</text><text x="325" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#8a6a52">一次性</text><rect x="424" y="268" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="472" y="287" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">步骤一</text><text x="472" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">step</text><rect x="548" y="268" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="596" y="287" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">步骤二</text><text x="596" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">step</text><rect x="672" y="268" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="720" y="287" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">步骤三</text><text x="720" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">step</text><path d="M380,291 L424,291" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="424,291 418.6,288.4 418.6,293.6" fill="#5a6580" stroke="none"/><path d="M520,291 L548,291" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="548,291 542.6,288.4 542.6,293.6" fill="#5a6580" stroke="none"/><path d="M644,291 L672,291" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="672,291 666.6,288.4 666.6,293.6" fill="#5a6580" stroke="none"/><path d="M596,314 C596,352 325,352 325,316" fill="none" stroke="#9aa3b2" stroke-width="1.1" stroke-dasharray="4 3"/><polygon points="325,314 322.2,321.2 327.8,321.2" fill="#9aa3b2" stroke="none"/><text x="460" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">某步结果不符合预期，才回到规划改计划</text><text x="60" y="430" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" text-anchor="start" fill="#2f6f5e" letter-spacing="0.08em">REFLECTION</text><text x="60" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">产出之后按标准评估</text><text x="60" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4f5d75">不达标就改，一般 1–2 轮</text><text x="900" y="430" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="end" fill="#8a93a6">生成 + 评估，至少 2 次调用</text><rect x="270" y="408" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="318" y="427" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">生成</text><text x="318" y="442" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">answer</text><rect x="410" y="408" width="120" height="46" rx="5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><text x="470" y="427" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2f6f5e">评估 / 测试</text><text x="470" y="442" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#4f7d6e">check</text><rect x="574" y="408" width="96" height="46" rx="5" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="622" y="427" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">改进</text><text x="622" y="442" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="400" text-anchor="middle" fill="#7a6a9e">revise</text><path d="M366,431 L410,431" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="410,431 404.6,428.4 404.6,433.6" fill="#5a6580" stroke="none"/><path d="M530,431 L574,431" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="574,431 568.6,428.4 568.6,433.6" fill="#5a6580" stroke="none"/><path d="M622,454 C622,490 318,490 318,456" fill="none" stroke="#9aa3b2" stroke-width="1.1" stroke-dasharray="4 3"/><polygon points="318,454 315.2,461.2 320.8,461.2" fill="#9aa3b2" stroke="none"/><text x="470" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">不达标才进入下一轮，第二轮收益通常已经很小</text><rect x="60" y="528" width="840" height="46" rx="6" fill="#f7efe4" stroke="#e0c3ae" stroke-width="1"/><text x="76" y="547" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" text-anchor="start" fill="#bf4520">选择顺序：先问任务能不能预先拆清楚</text><text x="76" y="563" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">能拆 → Plan-and-Execute；拆不清 → ReAct；单步质量是瓶颈 → 在任一条后面挂 Reflection。三条可以叠，但每叠一层都要多付延迟。</text></svg>
