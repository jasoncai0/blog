<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">MCP 连接的生命周期</title>
  <desc id="d4-desc">从配置出发，按 stdio、Streamable HTTP 或 attached 建立传输，完成 initialize 握手，列出工具并注册成 server_tool，运行期接收 ToolsChanged 并在防抖后 reload；单个 server 故障只影响自己。</desc>

  <defs>
    <marker id="d4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d4-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">MCP LIFECYCLE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">MCP 工具是怎么长进工具表的</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">一个 server 一套连接；发现即注册，变化即重载，故障只影响自己</text>

  <rect x="56" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="68" y="203" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">① 配置</text>
  <text x="68" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">mcp 配置 / 插件注册</text>
  <text x="68" y="235" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">enabled 决定是否连接</text>

  <rect x="252" y="180" width="190" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="264" y="203" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">② 建立传输</text>
  <text x="264" y="221" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">stdio · streamable http · attached</text>
  <text x="264" y="235" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">HTTP 才需要 OAuth</text>

  <rect x="478" y="180" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="490" y="203" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">③ initialize</text>
  <text x="490" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">协商协议与 capabilities</text>
  <text x="490" y="235" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">版本不匹配即失败</text>

  <rect x="684" y="180" width="220" height="64" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="696" y="203" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">④ 发现并注册</text>
  <text x="696" y="221" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">tools/list → &lt;server&gt;_&lt;tool&gt;</text>
  <text x="696" y="235" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">注册进当前 Location 的工具表</text>

  <rect x="684" y="320" width="220" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="696" y="343" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">⑤ 运行期</text>
  <text x="696" y="361" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">每次调用先 assert 权限</text>
  <text x="696" y="377" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">结果里的媒体/二进制落盘</text>
  <text x="696" y="397" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">某台 server 挂了：重连它，不牵连别人</text>

  <rect x="420" y="320" width="220" height="90" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="432" y="343" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#2d3142">McpEvent.ToolsChanged</text>
  <text x="432" y="361" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">工具列表变了 → 100ms 防抖</text>
  <text x="432" y="377" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">→ tools.reload()</text>
  <text x="432" y="397" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">不重新注册，保持插件覆盖顺序</text>

  <!-- edges -->
  <line x1="216" y1="212" x2="248" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
  <line x1="442" y1="212" x2="474" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
  <line x1="648" y1="212" x2="680" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
  <line x1="794" y1="244" x2="794" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
  <path d="M684,352 H648 V330 H644" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d4-arrow)"/>
  <path d="M530,320 V282 H700 V248" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d4-arrow-accent)"/>
  <text x="540" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">reload 后重新出现在工具表里</text>

  <text x="56" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">MCP 工具和内置工具走同一条执行管线：同名冲突时以插件/注册顺序为准，权限断言不可绕过。</text>
</svg>
