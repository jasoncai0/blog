<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-title f02-desc">
  <title id="f02-title">图 2 · 四层组装与覆盖方向</title>
  <desc id="f02-desc">bundle 层按 dsh.profile.bundles 顺序摊平，profile、home、--patch 依次叠加，遥测开关永远最后；覆盖按 id 命中、按 key 生效。</desc>
  <defs>
    <marker id="f02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="48" y="46" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">图 2 · 四层组装与覆盖方向</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">自下而上依次叠加；后叠的层只要写到同一个 id 的同一个 key，就覆盖前一层。</text>
  <rect x="48" y="100" width="420" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="118" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">profile 目录（启动时写入）</text>
  <text x="60" y="133" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">cordis.yml：只有注释与 []，由 patch 填满</text>
  <text x="60" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">cordis.patch.yml：用户层，最后一条覆盖项赢</text>
  <text x="60" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">package.json：dsh.profile.bundles 是有序列表</text>
  <rect x="48" y="470" width="420" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">bundle 层</text>
  <text x="60" y="503" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">base → web-app（含 standard / ptc / minimal / cordis 四个 preset patch）</text>
  <rect x="48" y="406" width="420" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">profile patch</text>
  <text x="60" y="439" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">cordis.patch.yml，用户与插件管理器共同写</text>
  <rect x="48" y="342" width="420" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">home patch</text>
  <text x="60" y="375" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">$DSH_HOME/cordis.patch.yml，跨 profile 偏好</text>
  <rect x="48" y="278" width="420" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">--patch overlay</text>
  <text x="60" y="311" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">argv 顺序叠加，可重复单值</text>
  <rect x="48" y="214" width="420" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="60" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">遥测硬关闭</text>
  <text x="60" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">DSH_TELEMETRY_DISABLED 非空即关，最后生成</text>
  <line x1="496" y1="512" x2="496" y2="190" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f02-arrow)"/>
  <text x="506" y="524" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".12em" fill="#bf4520" text-anchor="start">覆盖方向</text>
  <text x="506" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">同 id + 同 key，后写者赢</text>
  <text x="560" y="104" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".12em" fill="#bf4520" text-anchor="start">一次覆盖的实际效果</text>
  <rect x="560" y="116" width="352" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="572" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">base 行</text>
  <text x="572" y="149" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">id: tool-result-pruner</text>
  <text x="572" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">config: { thresholdChars: 8192,</text>
  <text x="572" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">          headChars: 4096, tailChars: 1024 }</text>
  <line x1="736" y1="210" x2="736" y2="236" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f02-arrow)"/>
  <rect x="560" y="238" width="352" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="572" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">profile 行</text>
  <text x="572" y="271" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">id: tool-result-pruner</text>
  <text x="572" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">config: { thresholdChars: 4096 }</text>
  <line x1="736" y1="316" x2="736" y2="342" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f02-arrow)"/>
  <rect x="560" y="344" width="352" height="96" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="572" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">最终条目</text>
  <text x="572" y="377" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">config 只剩 thresholdChars</text>
  <text x="572" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">head/tail 不再继承 base 的值</text>
  <text x="572" y="403" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">想保留就必须重写整段 config</text>
  <text x="560" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">匹配按 id；可选 name 是守卫，不一致就 warn 并跳过。</text>
  <text x="560" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">config 只是众多 key 之一，所以替换 config 等于替换整段。</text>
  <text x="48" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">空的 cordis.patch.yml 会让启动失败；禁用一整层要写 []。</text>
  <text x="48" y="584" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">profile 里不存在的 id 只 warn，不会阻止启动。</text>
</svg>
