<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ct cd">
  <title id="ct">资产页生命周期</title>
  <desc id="cd">事件入队、编译、待校验、生效，冲突转陈旧，新页取代旧页后归档；失败重试与死信可回退</desc>
  <rect x="0" y="0" width="960" height="520" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">LIFECYCLE · 资产页状态</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">编译队列在前，人审裁决在最后</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="0.6">active 才进检索优先</text>
  <rect x="36" y="160" width="190" height="56" fill="#e9eff6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="160" width="4" height="56" fill="#3d5a80"/>
  <text x="50" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">queued 待编译</text>
  <text x="50" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">事件已入队，等去抖窗口</text>
  <rect x="276" y="160" width="190" height="56" fill="#efeaf6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="276" y="160" width="4" height="56" fill="#5b4b8a"/>
  <text x="290" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">compiling 编译中</text>
  <text x="290" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">解析、规划、写扩散</text>
  <rect x="516" y="160" width="190" height="56" fill="#f2ece2" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="516" y="160" width="4" height="56" fill="#a8752a"/>
  <text x="530" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">draft 待校验</text>
  <text x="530" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">页面已写，尚未生效</text>
  <rect x="756" y="160" width="168" height="56" fill="#e9f2ed" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="756" y="160" width="4" height="56" fill="#2f6f5e"/>
  <text x="770" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">active 有效</text>
  <text x="770" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">ACL + 血缘校验通过</text>
  <rect x="276" y="330" width="190" height="56" fill="#eef0f4" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="276" y="330" width="4" height="56" fill="#5a6580"/>
  <text x="290" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">archived 归档</text>
  <text x="290" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">移出目录，边表保留</text>
  <rect x="516" y="330" width="190" height="56" fill="#f7efe4" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="516" y="330" width="4" height="56" fill="#bf4520"/>
  <text x="530" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">superseded 被取代</text>
  <text x="530" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">新版本页已生效</text>
  <rect x="756" y="330" width="168" height="56" fill="#f8eae8" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="756" y="330" width="4" height="56" fill="#9b4b52"/>
  <text x="770" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">stale 陈旧</text>
  <text x="770" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">新资产与旧结论冲突</text>
  <line x1="226" y1="196" x2="272" y2="196" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="236" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">入队</text>
  <line x1="466" y1="196" x2="512" y2="196" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="476" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">写扩散完成</text>
  <line x1="706" y1="196" x2="752" y2="196" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="716" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">校验通过</text>
  <path d="M840 216 v110" fill="none" stroke="#bf4520" stroke-width="1.1" marker-end="url(#aro)"/>
  <text x="848" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">冲突：规则判不了</text>
  <line x1="752" y1="368" x2="710" y2="368" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="718" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">被新页取代</text>
  <line x1="512" y1="368" x2="470" y2="368" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="478" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">保留历史</text>
  <path d="M276 180 H160 V156" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="168" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">失败重试 / 死信</text>
  <text x="36" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">所有状态由 front matter 的 status 承载；摄入、巡检、人审都只改这一个字段，不改正文结构。</text>
  <text x="36" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">stale 页仍可读，但注入时必须带「⚠️ 与某来源冲突」的提示；archived 从目录移除，反向血缘还能查到。</text>
  <text x="36" y="454" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">冲突如果规则引擎和模型都判不了，进 review 挂起，挂在页面上的不是结论而是待办。</text>
  <text x="36" y="472" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">ACL 字段与资产树不一致时，巡检直接降级为 draft，等权限服务复核后再回 active。</text>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
</svg>
