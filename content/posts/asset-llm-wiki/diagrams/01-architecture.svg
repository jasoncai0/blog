<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="ct cd">
  <title id="ct">改造后的资产层架构</title>
  <desc id="cd">原件进编译 worker，产出资产页面与分层目录，注入器三档下钻，产品回写触发增量编译，巡检闭环</desc>
  <rect x="0" y="0" width="960" height="640" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
