  <text x="36" y="586" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">和改造前比，工具多了一次 read_asset_page；权限从「检索时一次」变成「编译时 + 检索时」两次。</text>
  <text x="36" y="604" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">三级注入在时序里就是 2→4→6：先目录、再整页、最后才取原件细节。</text>
  <text x="36" y="622" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">产物回写不是终点：它触发增量编译，下一次任务读到的就是这次沉淀。</text>
