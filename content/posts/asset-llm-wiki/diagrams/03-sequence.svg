<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="ct cd">
  <title id="ct">一次设计任务的读写时序</title>
  <desc id="cd">人给 brief，Agent 读目录与页面，生成落画布，产物回写触发编译，巡检异步复核</desc>
  <rect x="0" y="0" width="960" height="610" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">SEQUENCE · 一次设计任务</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">先读目录与页面，再生成，产物回写触发编译</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="0.6">权限校验出现两次</text>
  <rect x="40.0" y="96" width="92" height="36" fill="#f2ece2" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="40.0" y="96" width="4" height="36" fill="#a8752a"/>
  <text x="52.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">人</text>
  <line x1="86" y1="132" x2="86" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="178.0" y="96" width="132" height="36" fill="#efeaf6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="178.0" y="96" width="4" height="36" fill="#5b4b8a"/>
  <text x="190.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">设计 Agent</text>
  <line x1="244" y1="132" x2="244" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="344.0" y="96" width="140" height="36" fill="#f7efe4" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="344.0" y="96" width="4" height="36" fill="#bf4520"/>
  <text x="356.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">资产 Wiki</text>
  <line x1="414" y1="132" x2="414" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="528.0" y="96" width="104" height="36" fill="#e9f2ed" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="528.0" y="96" width="4" height="36" fill="#2f6f5e"/>
  <text x="540.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">画布</text>
  <line x1="580" y1="132" x2="580" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="670.0" y="96" width="140" height="36" fill="#e9eff6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="670.0" y="96" width="4" height="36" fill="#3d5a80"/>
  <text x="682.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">编译 worker</text>
  <line x1="740" y1="132" x2="740" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="844.0" y="96" width="96" height="36" fill="#f8eae8" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="844.0" y="96" width="4" height="36" fill="#9b4b52"/>
  <text x="856.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">巡检 Agent</text>
  <line x1="892" y1="132" x2="892" y2="574" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <line x1="132" y1="172" x2="176" y2="172" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="154.0" cy="172" r="7" fill="#4f5d75"/>
  <text x="154.0" y="174.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">1</text>
  <text x="144" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">brief + 参考资产清单</text>
  <line x1="310" y1="214" x2="342" y2="214" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="326.0" cy="214" r="7" fill="#4f5d75"/>
  <text x="326.0" y="216.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">2</text>
  <text x="322" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">search_assets：只读目录，3–5 个候选</text>
  <line x1="414" y1="256" x2="314" y2="256" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <circle cx="364.0" cy="256" r="7" fill="#4f5d75"/>
  <text x="364.0" y="258.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">3</text>
  <text x="326" y="249" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">候选页摘要（已按 ACL 过滤）</text>
  <line x1="310" y1="298" x2="342" y2="298" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="326.0" cy="298" r="7" fill="#4f5d75"/>
  <text x="326.0" y="300.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">4</text>
  <text x="322" y="291" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">read_asset_page：约束、事实、血缘</text>
  <line x1="414" y1="340" x2="314" y2="340" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <circle cx="364.0" cy="340" r="7" fill="#4f5d75"/>
  <text x="364.0" y="342.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">5</text>
  <text x="326" y="333" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">页面正文 + 引用 + 冲突提示</text>
  <line x1="310" y1="382" x2="526" y2="382" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#apu)"/>
  <circle cx="418.0" cy="382" r="7" fill="#5b4b8a"/>
  <text x="418.0" y="384.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">6</text>
  <text x="322" y="375" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">生成候选并落画布（人可编辑）</text>
  <line x1="132" y1="424" x2="526" y2="424" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="329.0" cy="424" r="7" fill="#4f5d75"/>
  <text x="329.0" y="426.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">7</text>
  <text x="144" y="417" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">编辑 / 确认 / 挑选</text>
  <line x1="632" y1="466" x2="668" y2="466" stroke="#3d5a80" stroke-width="1.1" marker-end="url(#abl)"/>
  <circle cx="650.0" cy="466" r="7" fill="#3d5a80"/>
  <text x="650.0" y="468.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">8</text>
  <text x="644" y="459" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">artifact.created → 去抖 30s</text>
  <line x1="668" y1="508" x2="486" y2="508" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#apu)"/>
  <circle cx="577.0" cy="508" r="7" fill="#5b4b8a"/>
  <text x="577.0" y="510.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">9</text>
  <text x="498" y="501" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">增量编译：更新页面、血缘、目录</text>
  <line x1="844" y1="550" x2="486" y2="550" stroke="#9b4b52" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#apl)"/>
  <circle cx="665.0" cy="550" r="7" fill="#9b4b52"/>
  <text x="665.0" y="552.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">10</text>
  <text x="498" y="543" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">巡检：页面 / 血缘 / 权限</text>
  <text x="36" y="586" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">和改造前比，工具多了一次 read_asset_page；权限从「检索时一次」变成「编译时 + 检索时」两次。</text>
  <text x="36" y="604" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">产物回写不是终点：它触发增量编译，下一次任务读到的就是这次沉淀。</text>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="apu" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b4b8a"/></marker>
    <marker id="abl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d5a80"/></marker>
    <marker id="apl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9b4b52"/></marker>
  </defs>
</svg>
