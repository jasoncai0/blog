<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family='-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif' role="img" aria-labelledby="f3-t f3-d">
<title id="f3-t">高并发在线系统迁移三路径对标与 Rust 上线实测收益</title>
<desc id="f3-d">对比局部 FFI 重写、依赖既有测试集重写与生产影子验证器全量迁移三条路径的风险与实测指标。</desc>
