<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" font-family="'Geist','PingFang SC',system-ui" role="img" aria-labelledby="t d">
  <title id="t">编排原语的光谱</title>
  <desc id="d">六级编排原语，从单循环到持久目标。越往右，控制流越少由模型当场决定，越多由 harness 代码预先写死。opencode 走到第三级，Claude Code 到第五级，hermes 到第三级另加外部看板，DSH 六级齐全。</desc>
  <rect width="960" height="524" fill="#f5f5f5"/>

  <text x="24" y="34" font-size="8" fill="#5a6580" letter-spacing="0.16em" font-family="'Geist Mono','SF Mono',ui-monospace">PRIMITIVE LADDER</text>
  <text x="24" y="60" font-size="20" font-weight="600" fill="#2d3142">六级原语：越往右，模型越不当场决定</text>
  <text x="24" y="82" font-size="11.5" fill="#5a6580">左边三级用工具就能表达；右边三级要求 harness 先把流程、状态或触发条件写进代码。</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace" font-size="9" fill="#5a6580">
    <circle cx="700" cy="72" r="4" fill="#bf4520"/><text x="710" y="75">内建</text>
    <path d="M766 68 A4 4 0 0 1 766 76 Z" fill="#bf4520"/><circle cx="766" cy="72" r="4" fill="none" stroke="#bf4520"/>
    <text x="776" y="75">需开关 / 外部组件</text>
    <circle cx="884" cy="72" r="4" fill="none" stroke="#b9b4a8"/><text x="894" y="75">没有</text>
  </g>

  <!-- column headers -->
  <g>
    <rect x="90" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="102" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">01</text>
    <text x="102" y="142" font-size="10.5" fill="#2d3142">单循环</text>
    <text x="102" y="158" font-size="8.5" fill="#8a8577">一次请求 + 工具</text>

    <rect x="228" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="240" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">02</text>
    <text x="240" y="142" font-size="10.5" fill="#2d3142">同步子代理</text>
    <text x="240" y="158" font-size="8.5" fill="#8a8577">阻塞等一个结果</text>

    <rect x="366" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="378" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">03</text>
    <text x="378" y="142" font-size="10.5" fill="#2d3142">后台任务</text>
    <text x="378" y="158" font-size="8.5" fill="#8a8577">跑完再叫醒</text>

    <rect x="498" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="510" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">04</text>
    <text x="510" y="142" font-size="10.5" fill="#2d3142">共享任务板</text>
    <text x="510" y="158" font-size="8.5" fill="#8a8577">状态活在会话外</text>

    <rect x="636" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="648" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">05</text>
    <text x="648" y="142" font-size="10.5" fill="#2d3142">脚本化扇出</text>
    <text x="648" y="158" font-size="8.5" fill="#8a8577">流程先写成程序</text>

    <rect x="774" y="104" width="120" height="74" rx="8" fill="#ecebe6" stroke="#dcd9d1"/>
    <text x="786" y="122" font-size="8" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">06</text>
    <text x="786" y="142" font-size="10.5" fill="#2d3142">持久目标</text>
    <text x="786" y="158" font-size="8.5" fill="#8a8577">静下来自己续跑</text>
  </g>

  <!-- rows -->
  <g font-family="'Geist Mono','SF Mono',ui-monospace" font-size="10.5" fill="#3f4658">
    <text x="24" y="244">OPENCODE</text>
    <text x="24" y="296">CLAUDE CODE</text>
    <text x="24" y="348">HERMES</text>
    <text x="24" y="400">DSH</text>
  </g>

  <g>
    <!-- opencode -->
    <path d="M150 240 L426 240" stroke="#e0dcd3" stroke-width="2"/>
    <circle cx="150" cy="240" r="5" fill="#bf4520"/><circle cx="288" cy="240" r="5" fill="#bf4520"/><circle cx="426" cy="240" r="5" fill="#bf4520"/>
    <circle cx="564" cy="240" r="5" fill="none" stroke="#b9b4a8"/><circle cx="702" cy="240" r="5" fill="none" stroke="#b9b4a8"/><circle cx="840" cy="240" r="5" fill="none" stroke="#b9b4a8"/>

    <!-- claude code -->
    <path d="M150 292 L702 292" stroke="#e0dcd3" stroke-width="2"/>
    <circle cx="150" cy="292" r="5" fill="#bf4520"/><circle cx="288" cy="292" r="5" fill="#bf4520"/><circle cx="426" cy="292" r="5" fill="#bf4520"/>
    <path d="M560 288 A5 5 0 0 1 560 296 Z" fill="#bf4520"/><circle cx="564" cy="292" r="5" fill="none" stroke="#bf4520"/>
    <circle cx="702" cy="292" r="5" fill="#bf4520"/>
    <circle cx="840" cy="292" r="5" fill="none" stroke="#b9b4a8"/>

    <!-- hermes -->
    <path d="M150 344 L426 344" stroke="#e0dcd3" stroke-width="2"/>
    <circle cx="150" cy="344" r="5" fill="#bf4520"/><circle cx="288" cy="344" r="5" fill="#bf4520"/><circle cx="426" cy="344" r="5" fill="#bf4520"/>
    <path d="M560 340 A5 5 0 0 1 560 348 Z" fill="#bf4520"/><circle cx="564" cy="344" r="5" fill="none" stroke="#bf4520"/>
    <circle cx="702" cy="344" r="5" fill="none" stroke="#b9b4a8"/><circle cx="840" cy="344" r="5" fill="none" stroke="#b9b4a8"/>

    <!-- dsh -->
    <path d="M150 396 L840 396" stroke="#e0dcd3" stroke-width="2"/>
    <circle cx="150" cy="396" r="5" fill="#bf4520"/><circle cx="288" cy="396" r="5" fill="#bf4520"/><circle cx="426" cy="396" r="5" fill="#bf4520"/>
    <circle cx="564" cy="396" r="5" fill="#bf4520"/><circle cx="702" cy="396" r="5" fill="#bf4520"/><circle cx="840" cy="396" r="5" fill="#bf4520"/>
  </g>

  <!-- annotations -->
  <text x="564" y="312" font-size="8.5" fill="#8a8577" text-anchor="middle">需 teams 开关</text>
  <text x="564" y="364" font-size="8.5" fill="#8a8577" text-anchor="middle">kanban 在外部</text>

  <!-- ownership band -->
  <path d="M492 96 L492 430" stroke="#cfcbc2" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="90" y="440" width="396" height="34" rx="6" fill="#efece5" stroke="#dcd9d1"/>
  <text x="288" y="461" font-size="10" fill="#5a6580" text-anchor="middle">模型用工具就能走到这里</text>
  <rect x="498" y="440" width="396" height="34" rx="6" fill="#f6d9cd" stroke="#d99a83"/>
  <text x="696" y="461" font-size="10" fill="#8a3b1e" text-anchor="middle">harness 必须先写下流程或状态</text>

  <text x="24" y="502" font-size="10.5" fill="#2d3142">这不是成熟度排名，而是控制权的分布：越往右，「下一步做什么」越少由模型在当场决定。</text>
</svg>
