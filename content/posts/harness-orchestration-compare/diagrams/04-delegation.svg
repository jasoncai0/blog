<svg xmlns="http://www.w3.org/2000/svg" width="960" height="626" viewBox="0 0 960 626" font-family="'Geist','PingFang SC',system-ui" role="img" aria-labelledby="t d">
  <title id="t">四种委派形态</title>
  <desc id="d">opencode 用子会话加 job，Claude Code 默认后台并把结果写进文件，hermes 新建 AIAgent 线程并通过共享队列回传，DSH 把委派做成可替换后端并区分结果交付给谁。</desc>
  <rect width="960" height="626" fill="#f5f5f5"/>

  <text x="24" y="34" font-size="8" fill="#5a6580" letter-spacing="0.16em" font-family="'Geist Mono','SF Mono',ui-monospace">DELEGATION</text>
  <text x="24" y="60" font-size="20" font-weight="600" fill="#2d3142">「交给另一个 agent」的四种物理形态</text>
  <text x="24" y="82" font-size="11.5" fill="#5a6580">同样的语义（开一个更窄的上下文去干活），落到进程、文件、队列上就完全不同。</text>

  <!-- panel A -->
  <g>
    <rect x="24" y="100" width="440" height="244" rx="10" fill="#ffffff" stroke="#e5e2da"/>
    <text x="44" y="126" font-size="10" letter-spacing="0.1em" fill="#5a6580" font-family="'Geist Mono','SF Mono',ui-monospace">OPENCODE</text>
    <text x="44" y="142" font-size="10" fill="#8a8577">子会话 + job</text>

    <rect x="44" y="164" width="118" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="103" y="186" font-size="10.5" fill="#2d3142" text-anchor="middle">父 Session</text>
    <text x="103" y="201" font-size="8.5" fill="#8a8577" text-anchor="middle">block() 等或升格后台</text>

    <rect x="254" y="164" width="176" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="342" y="184" font-size="10.5" fill="#2d3142" text-anchor="middle">子 Session</text>
    <text x="342" y="199" font-size="8.5" fill="#8a8577" text-anchor="middle">自己的 step 循环与压缩</text>

    <path d="M162 182 L246 182" stroke="#bf4520" stroke-width="1.2"/>
    <path d="M246 182 L238 178 L238 186 Z" fill="#bf4520"/>
    <text x="168" y="174" font-size="9" fill="#bf4520">subagent(prompt, background)</text>

    <text x="254" y="234" font-size="9" fill="#8a8577" font-family="'Geist Mono','SF Mono',ui-monospace">job id = 子会话 id</text>

    <path d="M342 212 L342 262 L103 262 L103 220" fill="none" stroke="#b9b4a8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <path d="M103 220 L99 228 L107 228 Z" fill="#b9b4a8"/>
    <text x="196" y="252" font-size="9" fill="#5a6580">合成消息</text>

    <text x="44" y="292" font-size="10" fill="#5a6580">父只收到最后一段文本，看不到子的中间步骤。</text>
    <text x="44" y="312" font-size="10" fill="#5a6580">默认 depth = 1：子会话不能再开子会话。</text>
    <text x="44" y="332" font-size="9.5" fill="#8a8577">完成回传是一条注入消息，不是函数返回值。</text>
  </g>

  <!-- panel B -->
  <g>
    <rect x="496" y="100" width="440" height="244" rx="10" fill="#ffffff" stroke="#e5e2da"/>
    <text x="516" y="126" font-size="10" letter-spacing="0.1em" fill="#5a6580" font-family="'Geist Mono','SF Mono',ui-monospace">CLAUDE CODE</text>
    <text x="516" y="142" font-size="10" fill="#8a8577">默认后台，结果落在文件里</text>

    <rect x="516" y="164" width="112" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="572" y="186" font-size="10.5" fill="#2d3142" text-anchor="middle">父 turn</text>
    <text x="572" y="201" font-size="8.5" fill="#8a8577" text-anchor="middle">继续跑自己的循环</text>

    <rect x="726" y="160" width="172" height="44" rx="6" fill="#f6d9cd" stroke="#d99a83"/>
    <text x="812" y="180" font-size="10.5" fill="#8a3b1e" text-anchor="middle">子 agent（后台）</text>
    <text x="812" y="194" font-size="8.5" fill="#a8623f" text-anchor="middle">agentId + outputFile</text>

    <rect x="726" y="228" width="172" height="40" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="812" y="246" font-size="10" fill="#2d3142" text-anchor="middle">outputFile</text>
    <text x="812" y="259" font-size="8.5" fill="#8a8577" text-anchor="middle">读它，才拿到结果</text>

    <path d="M628 182 L718 182" stroke="#bf4520" stroke-width="1.2"/>
    <path d="M718 182 L710 178 L710 186 Z" fill="#bf4520"/>
    <text x="628" y="174" font-size="9" fill="#bf4520">Agent 调用，立即返回</text>

    <path d="M812 204 L812 224" stroke="#b9b4a8" stroke-width="1" stroke-dasharray="3 3"/>

    <path d="M812 166 L812 152 L572 152 L572 164" fill="none" stroke="#b9b4a8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <path d="M572 164 L568 156 L576 156 Z" fill="#b9b4a8"/>
    <text x="640" y="148" font-size="9" fill="#5a6580">完成通知</text>

    <path d="M572 208 L572 290 L722 290 L722 272" fill="none" stroke="#bf4520" stroke-width="1.1"/>
    <path d="M722 272 L718 280 L726 280 Z" fill="#bf4520"/>
    <text x="596" y="304" font-size="9" fill="#bf4520">SendMessage：resume 或继续对话</text>

    <text x="516" y="330" font-size="9.5" fill="#8a8577">嵌套默认 3 层、并发 20；Explore / Plan 不可 resume。</text>
  </g>

  <!-- panel C -->
  <g>
    <rect x="24" y="360" width="440" height="244" rx="10" fill="#ffffff" stroke="#e5e2da"/>
    <text x="44" y="386" font-size="10" letter-spacing="0.1em" fill="#5a6580" font-family="'Geist Mono','SF Mono',ui-monospace">HERMES</text>
    <text x="44" y="402" font-size="10" fill="#8a8577">新建一个 AIAgent</text>

    <rect x="44" y="424" width="112" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="100" y="446" font-size="10.5" fill="#2d3142" text-anchor="middle">父 agent</text>
    <text x="100" y="461" font-size="8.5" fill="#8a8577" text-anchor="middle">正在跑的这一轮</text>

    <rect x="238" y="424" width="196" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="336" y="444" font-size="10.5" fill="#2d3142" text-anchor="middle">子 AIAgent（新线程）</text>
    <text x="336" y="459" font-size="8.5" fill="#8a8577" text-anchor="middle">独立 task_id / 终端会话</text>

    <path d="M156 442 L230 442" stroke="#bf4520" stroke-width="1.2"/>
    <path d="M230 442 L222 438 L222 446 Z" fill="#bf4520"/>
    <text x="160" y="434" font-size="9" fill="#bf4520">delegate_task(spawn)</text>

    <rect x="238" y="500" width="196" height="36" rx="6" fill="#f6d9cd" stroke="#d99a83"/>
    <text x="336" y="516" font-size="10" fill="#8a3b1e" text-anchor="middle">completion_queue</text>
    <text x="336" y="529" font-size="8.5" fill="#a8623f" text-anchor="middle">共享、按 delegation_id 幂等</text>

    <path d="M336 472 L336 496" stroke="#b9b4a8" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M336 500 L336 560 L100 560 L100 476" fill="none" stroke="#b9b4a8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <path d="M100 476 L96 484 L104 484 Z" fill="#b9b4a8"/>
    <text x="130" y="554" font-size="9" fill="#5a6580">下一个 turn 取走 → 以新 turn 落地</text>

    <text x="44" y="580" font-size="9.5" fill="#8a8577">子代理禁用 delegate / clarify / memory；可选 git worktree 隔离。</text>
  </g>

  <!-- panel D -->
  <g>
    <rect x="496" y="360" width="440" height="244" rx="10" fill="#ffffff" stroke="#e5e2da"/>
    <text x="516" y="386" font-size="10" letter-spacing="0.1em" fill="#5a6580" font-family="'Geist Mono','SF Mono',ui-monospace">DSH</text>
    <text x="516" y="402" font-size="10" fill="#8a8577">委派是一个 seam</text>

    <rect x="516" y="424" width="102" height="48" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="567" y="452" font-size="10.5" fill="#2d3142" text-anchor="middle">父 agent</text>

    <rect x="650" y="432" width="98" height="32" rx="6" fill="#f6d9cd" stroke="#d99a83"/>
    <text x="699" y="452" font-size="9" fill="#8a3b1e" text-anchor="middle">startActivation</text>

    <path d="M618 448 L642 448" stroke="#bf4520" stroke-width="1.2"/>
    <path d="M642 448 L634 444 L634 452 Z" fill="#bf4520"/>

    <rect x="768" y="404" width="148" height="34" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="842" y="425" font-size="9.5" fill="#2d3142" text-anchor="middle">进程内 spawn / fork</text>
    <rect x="768" y="446" width="148" height="34" rx="6" fill="#efece5" stroke="#d8d5cd"/>
    <text x="842" y="467" font-size="9.5" fill="#2d3142" text-anchor="middle">进程外 ACP / Codex / CC</text>

    <path d="M748 444 L762 428" stroke="#bf4520" stroke-width="1.1"/>
    <path d="M748 452 L762 462" stroke="#bf4520" stroke-width="1.1"/>

    <text x="516" y="500" font-size="9.5" fill="#bf4520">delivery: parent（进 inbox）| caller（只回给调用者）</text>
    <text x="516" y="522" font-size="9.5" fill="#5a6580">sendMessage：运行中 = steer，已结束 = resume，外部后端不支持</text>
    <text x="516" y="544" font-size="9.5" fill="#5a6580">waitForTreeWork()：等整棵子树排空，goal 轮次靠它判断静默</text>
    <text x="516" y="574" font-size="9.5" fill="#8a8577">同一个工具，背后换后端就能从本地子会话换成外部进程。</text>
  </g>

</svg>
