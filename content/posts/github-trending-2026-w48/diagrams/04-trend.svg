<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="f4-t f4-d" font-family='-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif'><title id="f4-t">跨周热度与换血速度趋势</title><desc id="f4-d">柱形为每周上榜项目的星数增量总和，折线为新上榜项目占比。</desc><defs><filter id="f4-shadow" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/></filter></defs><rect x="0.5" y="0.5" width="1079" height="459" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><rect x="36.0" y="26.0" width="114.0" height="24.0" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><text x="93.0" y="42.5" font-size="11.5" fill="#1D4ED8" text-anchor="middle" font-weight="700">04 · 跨周趋势</text><text x="36.0" y="78.0" font-size="22" fill="#0F172A" text-anchor="start" font-weight="800">2026-W48 全榜新增 +29,133 ★（环比 -52.5%），新面孔占 21.4%</text><text x="36.0" y="102.0" font-size="13" fill="#475569" text-anchor="start" font-weight="400">蓝色圆角柱（左轴）= 每周上榜项目新增 ★ 总和；青绿折线（右轴）= 新上榜项目占比</text><rect x="820.0" y="31.0" width="14.0" height="10.0" rx="3" fill="#2563EB"/><text x="840.0" y="40.5" font-size="11.5" fill="#475569" text-anchor="start" font-weight="600">周新增 ★ 总和</text><line x1="940.0" y1="36.0" x2="962.0" y2="36.0" stroke="#0D9488" stroke-width="2.6"/><circle cx="951.0" cy="36.0" r="4" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.5"/><text x="968.0" y="40.5" font-size="11.5" fill="#475569" text-anchor="start" font-weight="600">新上榜占比</text><line x1="108.0" y1="384.0" x2="984.0" y2="384.0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/><text x="96.0" y="388.0" font-size="11" fill="#64748B" text-anchor="end" font-weight="500">0</text><text x="996.0" y="388.0" font-size="11" fill="#0F766E" text-anchor="start" font-weight="600">0%</text><line x1="108.0" y1="326.5" x2="984.0" y2="326.5" stroke="#E2E8F0" stroke-width="1" str