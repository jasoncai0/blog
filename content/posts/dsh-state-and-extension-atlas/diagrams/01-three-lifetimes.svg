<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">三类寿命与崩溃后的结果</title>
<desc id="f01-desc">三栏对照持久、可重建、进程内三类状态，以及每一类在崩溃后的结局。</desc>
<defs>
  <marker id="f01-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
  </marker>
  <marker id="f01-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="32" y="26" font-size="8" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">FIG 01 / STATE LIFETIMES</text>
<text x="32" y="50" font-size="20" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">三类寿命与崩溃后的结果</text>
<text x="32" y="70" font-size="9.5" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">判定只问两件事：进程退出后它还在不在；如果不在，能不能从别处算回来。</text>
<rect x="32" y="88" width="288" height="462" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="32" y="88" width="288" height="54" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="32" y="128" width="288" height="14" rx="0" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="32" y="88" width="6" height="54" rx="0" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><text x="50" y="112" font-size="13" fill="#ffffff" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">持久</text><text x="50" y="129" font-size="7.5" fill="#ffffff" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.1em" opacity="0.72">PERSISTENT · 独立介质</text><line x1="48" y1="186" x2="304" y2="186" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="160" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">session 日志</text><text x="50" y="173" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">单写句柄：append 后 flush</text><line x1="48" y1="230" x2="304" y2="230" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="204" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">inbox</text><text x="50" y="217" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">splice 事件，重放待处理输入</text><line x1="48" y1="274" x2="304" y2="274" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="248" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">goal</text><text x="50" y="261" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">goal/change 落日志，授权不落</text><line x1="48" y1="318" x2="304" y2="318" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="292" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">team 任务板</text><text x="50" y="305" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">team/task 版本 2，flush 确认</text><line x1="48" y1="362" x2="304" y2="362" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="336" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">approval 审计</text><text x="50" y="349" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">asked 与 decided 成对追加</text><line x1="48" y1="406" x2="304" y2="406" stroke="#d8d8d8" stroke-width="1"/><text x="50" y="380" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">schedule</text><text x="50" y="393" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">storage domain，非会话日志</text><rect x="48" y="436" width="256" height="84" rx="4" fill="#f5f5f5" stroke="#d8d8d8" stroke-width="1"/><text x="62" y="454" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">CRASH AFTER</text><text x="62" y="476" font-size="9" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">恢复到最后一个 flush 前缀</text><text x="62" y="492" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">最后一条未 flush 的事件不算数</text><rect x="336" y="88" width="288" height="462" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="336" y="88" width="288" height="54" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="336" y="128" width="288" height="14" rx="0" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="336" y="88" width="6" height="54" rx="0" fill="#4f5d75" stroke="#4f5d75" stroke-width="1"/><text x="354" y="112" font-size="13" fill="#ffffff" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">可重建</text><text x="354" y="129" font-size="7.5" fill="#ffffff" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.1em" opacity="0.72">REBUILDABLE · 折叠日志</text><line x1="352" y1="202" x2="608" y2="202" stroke="#d8d8d8" stroke-width="1"/><text x="354" y="160" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">surface</text><text x="354" y="173" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">SurfaceManager 按 surfaceOp 折叠</text><line x1="352" y1="262" x2="608" y2="262" stroke="#d8d8d8" stroke-width="1"/><text x="354" y="220" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">token 计数</text><text x="354" y="233" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">usage 随 assistant/message 落盘</text><line x1="352" y1="322" x2="608" y2="322" stroke="#d8d8d8" stroke-width="1"/><text x="354" y="280" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">compaction 游标</text><text x="354" y="293" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">start/end 括号，seed 才能作废</text><rect x="352" y="436" width="256" height="84" rx="4" fill="#f5f5f5" stroke="#d8d8d8" stroke-width="1"/><text x="366" y="454" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">CRASH AFTER</text><text x="366" y="476" font-size="9" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">重新折叠，结果与崩溃前一致</text><text x="366" y="492" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">折叠函数抛错时恢复失败，不静默修正</text><rect x="640" y="88" width="288" height="462" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="640" y="88" width="288" height="54" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="640" y="128" width="288" height="14" rx="0" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><rect x="640" y="88" width="6" height="54" rx="0" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="658" y="112" font-size="13" fill="#ffffff" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">进程内</text><text x="658" y="129" font-size="7.5" fill="#ffffff" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.1em" opacity="0.72">IN-PROCESS · 随进程消失</text><line x1="656" y1="192" x2="912" y2="192" stroke="#d8d8d8" stroke-width="1"/><text x="658" y="160" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">job 注册表</text><text x="658" y="173" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">Map + ring，owner 销毁即取消</text><line x1="656" y1="242" x2="912" y2="242" stroke="#d8d8d8" stroke-width="1"/><text x="658" y="210" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">workflow run</text><text x="658" y="223" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">children 与 liveAgents 在 provider</text><line x1="656" y1="292" x2="912" y2="292" stroke="#d8d8d8" stroke-width="1"/><text x="658" y="260" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">approval 等待</text><text x="658" y="273" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">一个挂起 Promise，无队列</text><line x1="656" y1="342" x2="912" y2="342" stroke="#d8d8d8" stroke-width="1"/><text x="658" y="310" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="500">goal activation</text><text x="658" y="323" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">WeakMap，agent/created 时 disarm</text><rect x="656" y="436" width="256" height="84" rx="4" fill="#f5f5f5" stroke="#d8d8d8" stroke-width="1"/><text x="670" y="454" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">CRASH AFTER</text><text x="670" y="476" font-size="9" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">消失，日志只剩审计事件</text><text x="670" y="492" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">不要给它补持久化，先换挂载点</text><text x="354" y="360" font-size="8" fill="#4f5d75" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start">log</text><line x1="388" y1="356" x2="448" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f01-arrow)"/><text x="456" y="360" font-size="8" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start">fold()</text><line x1="500" y1="356" x2="556" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f01-arrow)"/><text x="564" y="360" font-size="8" fill="#4f5d75" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start">view</text><text x="354" y="382" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">只读投影，可随时丢弃</text><rect x="656" y="366" width="256" height="42" rx="4" fill="#f5f5f5" stroke="#d8d8d8" stroke-width="1"/><text x="670" y="384" font-size="9" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.08em">无重建路径</text><text x="670" y="398" font-size="8" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">进程退出即失效</text><line x1="32" y1="566" x2="928" y2="566" stroke="#d8d8d8"/><text x="32" y="582" font-size="8" fill="#4f5d75" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.04em">SOURCE: session-persistence, session/surface, jobs-local, workflow, user-approval</text></svg>
