<text x="32" y="26" font-size="8" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">FIG 03 / DECISION TREE</text>
<text x="32" y="50" font-size="20" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">新能力该挂哪一层</text>
