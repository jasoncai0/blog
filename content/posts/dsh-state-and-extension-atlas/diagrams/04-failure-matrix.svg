<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">五种失效：机制、现象、检测点</title>
<desc id="f04-desc">失效模式矩阵：重复写、写到错误所有者、错误生命周期、跨 agent 泄漏、崩溃半写，各自的现象与检测手段。</desc>
<defs>
  <marker id="f04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
  </marker>
  <marker id="f04-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="32" y="26" font-size="8" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">FIG 04 / FAILURE MATRIX</text>
<text x="32" y="50" font-size="20" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">五种失效：机制、现象、检测点</text>
<text x="32" y="70" font-size="9.5" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">单看写路径都合法，组合起来才出问题。最右列是启动审计或 code review 时可以直接执行的检查。</text>
