">任务板看不到或 revision 冲突</text><text x="662" y="250" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">scopeOf(ctx)；assertAccess</text><text x="662" y="265" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">投影与日志逐条比对</text><rect x="32" y="308" width="896" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><line x1="32" y1="390" x2="928" y2="390" stroke="#d8d8d8" stroke-width="1"/><line x1="160" y1="308" x2="160" y2="390" stroke="#d8d8d8" stroke-width="1"/><line x1="394" y1="308" x2="394" y2="390" stroke="#d8d8d8" stroke-width="1"/><line x1="640" y1="308" x2="640" y2="390" stroke="#d8d8d8" stroke-width="1"/><rect x="32" y="308" width="4" height="82" rx="0" fill="#2d3142" stroke="none" stroke-width="1"/><text x="48" y="332" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">错误生命周期</text><text x="48" y="348" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">MED</text><text x="182" y="332" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">长命插件持有 Agent / Session</text><text x="182" y="347" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">job 句柄跨 owner 保存</text><text x="416" y="332" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">job 被取消，reason=owner disposed</text><text x="416" y="347" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">dispose 后仍尝试写日志</text><text x="662" y="332" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">dispose 顺序；closed session 报错</text><text x="662" y="347" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">job owner 与调用方 id 比对</text><rect x="32" y="390" width="896" height="82" rx="6" fill="#fbfbfb" stroke="#d8d8d8" stroke-width="1"/><line x1="32" y1="472" x2="928" y2="472" stroke="#d8d8d8" stroke-width="1"/><line x1="160" y1="390" x2="160" y2="472" stroke="#d8d8d8" stroke-width="1"/><line x1="394" y1="390" x2="394" y2="472" stroke="#d8d8d8" stroke-width="1"/><line x1="640" y1="390" x2="640" y2="472" stroke="#d8d8d8" stroke-width="1"/><rect x="32" y="390" width="4" height="82" rx="0" fill="#bf4520" stroke="none" stroke-width="1"/><text x="48" y="414" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">跨 agent 泄漏</text><text x="48" y="430" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">HIGH</text><text x="182" y="414" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">preset 服务行漏 isolate</text><text x="182" y="429" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">scoped 注册写成全局</text><text x="416" y="414" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">mount 阶段抛错</text><text x="416" y="429" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">所有 agent 看到同一工具</text><text x="662" y="414" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">leakedServices 审计</text><text x="662" y="429" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">scopeOf(ctx) / 列表比对</text><rect x="32" y="472" width="896" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><line x1="32" y1="554" x2="928" y2="554" stroke="#d8d8d8" stroke-width="1"/><line x1="160" y1="472" x2="160" y2="554" stroke="#d8d8d8" stroke-width="1"/><line x1="394" y1="472" x2="394" y2="554" stroke="#d8d8d8" stroke-width="1"/><line x1="640" y1="472" x2="640" y2="554" stroke="#d8d8d8" stroke-width="1"/><rect x="32" y="472" width="4" height="82" rx="0" fill="#bf4520" stroke="none" stroke-width="1"/><text x="48" y="496" font-size="9.5" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start" font-weight="600">崩溃半写</text><text x="48" y="512" font-size="7" fill="#bf4520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.12em">HIGH</text><text x="182" y="496" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">append 成功但 flush 失败</text><text x="182" y="511" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">compaction/start 无 end</text><text x="416" y="496" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">任务可见但未确认</text><text x="416" y="511" font-size="8.2" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">压缩一直 busy</text><text x="662" y="496" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">TEAM_TASK_PERSISTENCE_UNCONFIRMED</text><text x="662" y="511" font-size="8.2" fill="#2d3142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" text-anchor="start">assertNoActiveCompaction；审计对配对</text><line x1="32" y1="566" x2="928" y2="566" stroke="#d8d8d8"/><text x="32" y="582" font-size="8" fill="#4f5d75" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" text-anchor="start" letter-spacing="0.04em">SOURCE: tools, agent-team/journal, agent-preset-registr