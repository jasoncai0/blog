<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-lc-title f01-lc-desc">
  <title id="f01-lc-title">会话、工作区与语言服务器实例</title>
  <desc id="f01-lc-desc">两个会话可以指向同一个工作区，实例按 workspace target 缓存，同一工作区的查询进入同一条队列，不同工作区各有一台 server。实例首次查询时懒创建，死亡后被移除并在下次查询重建，插件卸载时统一 dispose。</desc>

  <defs>
    <marker id="f01-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">10 / LSP LIFECYCLE</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">实例按工作区缓存，不按会话</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">两个会话指向同一仓库时共用一台 server；会话结束不解散实例，插件卸载才统一拆</text>

  <text x="50" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">会话</text>
  <text x="280" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">工作区（targetKey）</text>
  <text x="560" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">实例（进程内缓存）</text>

  <rect x="50" y="130" width="160" height="52" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="66" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">session A</text>
  <text x="66" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">cwd = repo/app</text>

  <rect x="50" y="222" width="160" height="52" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="66" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">session B</text>
  <text x="66" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">cwd = repo/app</text>

  <line x1="212" y1="156" x2="276" y2="156" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-arrow)"/>
  <line x1="212" y1="248" x2="276" y2="160" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-arrow)"/>

  <rect x="280" y="130" width="220" height="52" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="296" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">repo/app</text>
  <text x="296" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">规范化后的 workspace target</text>

  <rect x="280" y="240" width="220" height="52" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="296" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">repo/lib</text>
  <text x="296" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">另一个 target，另一台 server</text>

  <rect x="534" y="112" width="232" height="200" rx="6" fill="none" stroke="#c9ced9" stroke-dasharray="4 4"/>
  <text x="548" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">Map&lt;WorkspaceKey, LspInstance&gt;</text>

  <line x1="502" y1="156" x2="548" y2="152" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-arrow)"/>

  <rect x="548" y="136" width="204" height="64" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1.3"/>
  <text x="562" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">instance #1</text>
  <text x="562" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">initialize · queue · 1 server</text>
  <text x="562" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">didOpen → 请求 → didClose</text>

  <line x1="502" y1="266" x2="596" y2="204" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-arrow)"/>

  <rect x="548" y="236" width="204" height="60" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="562" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">instance #2</text>
  <text x="562" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">独立进程，独立队列</text>

  <rect x="790" y="136" width="130" height="60" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="855" y="158" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">lsp 工具</text>
  <text x="855" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">四种操作</text>
  <line x1="754" y1="168" x2="788" y2="166" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-arrow)"/>

  <!-- lifecycle notes -->
  <rect x="40" y="332" width="270" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">懒创建</text>
  <text x="56" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">注册时不 spawn，</text>
  <text x="56" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">首次匹配查询才起进程。</text>
  <text x="56" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">没有匹配的扩展名，</text>
  <text x="56" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">进程永远不会出现。</text>

  <rect x="330" y="332" width="290" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="346" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">排队与重试</text>
  <text x="346" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">同一工作区串行，跨工作区并行。</text>
  <text x="346" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">传输失败透明重试一次。</text>
  <text x="346" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">查询只读，所以重放安全；</text>
  <text x="346" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">第二次仍失败就向上抛。</text>

  <rect x="640" y="332" width="280" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="656" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">死亡与卸载</text>
  <text x="656" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">进程退出 / 已拆 / 连接报错</text>
  <text x="656" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">→ dispose 并移出 Map。</text>
  <text x="656" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">插件卸载：disposeAll，</text>
  <text x="656" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">失败汇总成 AggregateError。</text>

  <text x="40" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">键来自文件系统 provider 的 targetKey，因此</text>
  <text x="40" y="510" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">/home/me/repo</text>
  <text x="140" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">与</text>
  <text x="156" y="510" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">/home/me/repo/</text>
  <text x="262" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">命中同一实例。</text>

  <text x="560" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">实例是跨进程边界，</text>
  <text x="560" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">会话只提供工作区身份。</text>
</svg>
