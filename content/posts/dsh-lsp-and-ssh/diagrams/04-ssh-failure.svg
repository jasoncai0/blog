<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-sf-title f04-sf-desc">
  <title id="f04-sf-title">断线时一次远端调用的结局</title>
  <desc id="f04-sf-desc">bash 工具通过 SshConnection 等待远端进程结束。心跳超时或 ssh 子进程退出后，连接把挂起操作一次性置为失败，等待方收到固定文案与错误结果。远端是否已执行完只能报未知，客户端不重连也不重放。</desc>

  <defs>
    <marker id="f04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">10 / DISCONNECT</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">断线：把未知如实报出来</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">连接一断，所有在途调用同一次失败；已收到的输出保留，远端结果标成未知</text>

  <rect x="40" y="104" width="140" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="110" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">bash 工具</text>

  <rect x="275" y="104" width="150" height="40" rx="4" fill="#ffffff" stroke="#bf4520"/>
  <text x="350" y="128" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">SshConnection</text>

  <rect x="505" y="104" width="130" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="570" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">本地 ssh 子进程</text>

  <rect x="730" y="104" width="150" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="805" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">远端 helper / 进程</text>

  <line x1="110" y1="144" x2="110" y2="460" stroke="#c9ced9" stroke-dasharray="3 4"/>
  <line x1="350" y1="144" x2="350" y2="460" stroke="#c9ced9" stroke-dasharray="3 4"/>
  <line x1="570" y1="144" x2="570" y2="460" stroke="#c9ced9" stroke-dasharray="3 4"/>
  <line x1="805" y1="144" x2="805" y2="460" stroke="#c9ced9" stroke-dasharray="3 4"/>

  <line x1="110" y1="180" x2="348" y2="180" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <text x="229" y="174" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">request(process.done, wait=true)</text>

  <line x1="350" y1="212" x2="805" y2="212" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f04-arrow)"/>
  <text x="578" y="206" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">RPC 经 exec 流发出；观察请求没有独立的执行期限</text>

  <text x="584" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#bf4520">心跳每 leaseMs/3 一次</text>
  <text x="584" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">等待上限 leaseMs/2</text>

  <!-- failure mark -->
  <line x1="552" y1="292" x2="588" y2="316" stroke="#bf4520" stroke-width="2"/>
  <line x1="588" y1="292" x2="552" y2="316" stroke="#bf4520" stroke-width="2"/>
  <text x="600" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">心跳超时</text>
  <text x="600" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">或子进程退出</text>

  <rect x="300" y="332" width="230" height="30" rx="4" fill="#fdf3ee" stroke="#bf4520" stroke-opacity="0.4"/>
  <text x="415" y="351" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">fail()：挂起操作全部置为失败</text>

  <line x1="348" y1="394" x2="112" y2="394" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f04-arrow)"/>
  <text x="230" y="372" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#bf4520">SSH helper disconnected; remote outcomes</text>
  <text x="230" y="386" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#bf4520">and cleanup are unknown</text>

  <rect x="40" y="420" width="220" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="150" y="439" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">工具结果：isError + 已收到的输出</text>

  <!-- bottom -->
  <rect x="40" y="470" width="290" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">客户端不做的事</text>
  <text x="56" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">不重连</text>
  <text x="140" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">连接对象一次性，断了就废</text>
  <text x="56" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">不重放</text>
  <text x="140" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">写操作可能已经生效</text>
  <text x="56" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">不猜</text>
  <text x="140" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">退出码与终态留空</text>

  <rect x="350" y="470" width="290" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="366" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">远端仍在做的事</text>
  <text x="366" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">helper 收到 EOF 或信号后开始清理</text>
  <text x="366" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">租约到期同样触发清理</text>
  <text x="366" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">结果回不来，清理仍然发生</text>

  <rect x="660" y="470" width="260" height="104" rx="6" fill="#fdf3ee" stroke="#bf4520" stroke-opacity="0.4"/>
  <text x="676" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">模型看到什么</text>
  <text x="676" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">固定文案，不随场景改写</text>
  <text x="676" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">已产出的标准输出照常保留</text>
  <text x="676" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">下一次调用需要新连接</text>
</svg>
