<svg class="wide" viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
            <title id="d1-title">打断请求从客户端到工具层的分层路径</title>
            <desc id="d1-desc">客户端发出 POST 中断请求，经 HTTP API、SessionExecution 与协调器到达执行循环和工具层，同时协调器向 SQLite 写入或释放执行声明，终态事件经 SSE 返回客户端。</desc>
            <defs>
              <pattern id="d1-dots" width="22" height="22" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
              </pattern>
              <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
              </marker>
              <marker id="d1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
              </marker>
              <marker id="d1-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
              </marker>
            </defs>

            <rect width="100%" height="100%" fill="#f5f5f5"/>
            <rect width="100%" height="100%" fill="url(#d1-dots)" opacity="0.55"/>

            <!-- ---- connectors first ---- -->
            <line x1="236" y1="184" x2="336" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d1-arrow-link)"/>
            <line x1="532" y1="184" x2="632" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
            <line x1="848" y1="184" x2="932" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
            <line x1="700" y1="228" x2="700" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
            <line x1="1012" y1="224" x2="1012" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

            <!-- terminal event back to client (async, dashed, open head) -->
            <path d="M 800 140 V 80 Q 800 72 792 72 H 128 Q 120 72 120 80 V 144"
                  fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#d1-arrow-open)"/>

            <!-- ---- arrow labels ---- -->
            <rect x="246" y="164" width="80" height="12" rx="2" fill="#f5f5f5"/>
            <text x="286" y="173" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST · RESUME</text>

            <rect x="548" y="164" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="582" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">interrupt()</text>

            <rect x="861" y="164" width="57" height="12" rx="2" fill="#f5f5f5"/>
            <text x="890" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERRUPT</text>

            <rect x="708" y="284" width="35" height="12" rx="2" fill="#f5f5f5"/>
            <text x="712" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CLAIM</text>

            <rect x="1020" y="284" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="1024" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TOOL FIBERS</text>

            <rect x="426" y="52" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="460" y="61" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERRUPTED</text>

            <!-- ---- nodes ---- -->
            <rect x="40" y="144" width="196" height="80" rx="6" fill="#f5f5f5"/>
            <rect x="40" y="144" width="196" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
            <rect x="48" y="150" width="42" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
            <text x="69" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
            <text x="138" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户端</text>
            <text x="138" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TUI · Desktop · CLI</text>

            <rect x="336" y="144" width="196" height="80" rx="6" fill="#f5f5f5"/>
            <rect x="336" y="144" width="196" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
            <rect x="344" y="150" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
            <text x="359" y="159" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
            <text x="434" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">HTTP API</text>
            <text x="434" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/session/:id/interrupt</text>

            <rect x="632" y="140" width="216" height="88" rx="6" fill="#f5f5f5"/>
            <rect x="632" y="140" width="216" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <rect x="640" y="146" width="34" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
            <text x="657" y="155" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
            <text x="740" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">执行协调器</text>
            <text x="740" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">execution · coordinator</text>

            <rect x="932" y="144" width="160" height="80" rx="6" fill="#f5f5f5"/>
            <rect x="932" y="144" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
            <rect x="940" y="150" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
            <text x="957" y="159" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
            <text x="1012" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">执行循环</text>
            <text x="1012" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Runner · Step</text>

            <rect x="560" y="384" width="220" height="80" rx="6" fill="#f5f5f5"/>
            <rect x="560" y="384" width="220" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
            <rect x="568" y="390" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
            <text x="585" y="399" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
            <text x="670" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">SQLite</text>
            <text x="670" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session_inbox · claim</text>

            <rect x="932" y="384" width="160" height="80" rx="6" fill="#f5f5f5"/>
            <rect x="932" y="384" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
            <rect x="940" y="390" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
            <text x="952" y="399" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
            <text x="1012" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">工具 / Provider</text>
            <text x="1012" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP · child process</text>

            <!-- ---- legend ---- -->
            <line x1="40" y1="544" x2="1080" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
            <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

            <line x1="40" y1="592" x2="64" y2="592" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d1-arrow-link)"/>
            <text x="74" y="595" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP CALL</text>

            <line x1="188" y1="592" x2="212" y2="592" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
            <text x="222" y="595" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IN-PROCESS</text>

            <line x1="336" y1="592" x2="360" y2="592" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#d1-arrow-open)"/>
            <text x="370" y="595" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SSE EVENT</text>

            <rect x="496" y="587" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <text x="520" y="595" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>
          </svg>