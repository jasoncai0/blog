<svg class="wide" viewBox="0 0 1120 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
            <title id="d3-title">一次用户打断的时序</title>
            <desc id="d3-desc">客户端发出中断请求，API 转给执行协调器；协调器置 stopping 并异步中断 owner fiber，同时立即返回 200。随后中断传播到 Runner 和工具 fiber，直到 fiber 退出后协调器发布终态并释放 claim。</desc>
            <defs>
              <pattern id="d3-dots" width="22" height="22" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
              </pattern>
              <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
              </marker>
              <marker id="d3-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
              </marker>
            </defs>

            <rect width="100%" height="100%" fill="#f5f5f5"/>
            <rect width="100%" height="100%" fill="url(#d3-dots)" opacity="0.55"/>

            <!-- lifelines -->
            <line x1="120" y1="152" x2="120" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="340" y1="152" x2="340" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="560" y1="152" x2="560" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="780" y1="152" x2="780" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="1000" y1="152" x2="1000" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

            <!-- activation bars -->
            <rect x="116" y="196" width="8" height="162" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
            <rect x="336" y="196" width="8" height="162" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
            <rect x="556" y="240" width="8" height="396" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
            <rect x="776" y="406" width="8" height="136" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
            <rect x="996" y="448" width="8" height="50" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

            <!-- messages -->
            <line x1="124" y1="200" x2="336" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d3-arrow-link)"/>
            <line x1="344" y1="244" x2="556" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

            <path d="M 564 288 H 600 V 318 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

            <line x1="336" y1="352" x2="124" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d3-arrow)"/>

            <line x1="564" y1="410" x2="776" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
            <line x1="784" y1="452" x2="996" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

            <line x1="996" y1="494" x2="784" y2="494" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d3-arrow)"/>
            <line x1="776" y1="536" x2="564" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d3-arrow)"/>

            <path d="M 564 600 H 600 V 630 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

            <!-- message labels -->
            <rect x="190" y="180" width="80" height="12" rx="2" fill="#f5f5f5"/>
            <text x="230" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST · RESUME</text>

            <rect x="416" y="224" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="450" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">interrupt()</text>

            <rect x="608" y="288" width="52" height="12" rx="2" fill="#f5f5f5"/>
            <text x="612" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STOPPING</text>

            <rect x="201" y="332" width="57" height="12" rx="2" fill="#f5f5f5"/>
            <text x="205" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">200 · ACK</text>

            <rect x="641" y="390" width="57" height="12" rx="2" fill="#f5f5f5"/>
            <text x="645" y="399" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INTERRUPT</text>

            <rect x="856" y="432" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="860" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TOOL FIBERS</text>

            <rect x="861" y="474" width="57" height="12" rx="2" fill="#f5f5f5"/>
            <text x="865" y="483" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TOOL EXIT</text>

            <rect x="636" y="516" width="68" height="12" rx="2" fill="#f5f5f5"/>
            <text x="640" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RUNNER EXIT</text>

            <rect x="608" y="600" width="46" height="12" rx="2" fill="#f5f5f5"/>
            <text x="612" y="609" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SETTLED</text>

            <!-- actors -->
            <rect x="28" y="88" width="184" height="64" rx="6" fill="#f5f5f5"/>
            <rect x="28" y="88" width="184" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
            <rect x="36" y="94" width="42" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
            <text x="57" y="103" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
            <text x="120" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户端</text>
            <text x="120" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ESC x2 · STOP · SIGINT</text>

            <rect x="248" y="88" width="184" height="64" rx="6" fill="#f5f5f5"/>
            <rect x="248" y="88" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
            <rect x="256" y="94" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
            <text x="271" y="103" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
            <text x="340" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">HTTP API</text>
            <text x="340" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/session/:id/interrupt</text>

            <rect x="468" y="88" width="184" height="64" rx="6" fill="#f5f5f5"/>
            <rect x="468" y="88" width="184" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <rect x="476" y="94" width="34" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
            <text x="493" y="103" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
            <text x="560" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">执行协调器</text>
            <text x="560" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coordinator.interrupt()</text>

            <rect x="688" y="88" width="184" height="64" rx="6" fill="#f5f5f5"/>
            <rect x="688" y="88" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
            <rect x="696" y="94" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
            <text x="713" y="103" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
            <text x="780" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">Runner / Step</text>
            <text x="780" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drain · step</text>

            <rect x="908" y="88" width="184" height="64" rx="6" fill="#f5f5f5"/>
            <rect x="908" y="88" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
            <rect x="916" y="94" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
            <text x="928" y="103" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
            <text x="1000" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">工具 / Provider</text>
            <text x="1000" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool fibers</text>

            <!-- legend -->
            <line x1="28" y1="700" x2="1092" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
            <text x="28" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

            <line x1="28" y1="748" x2="52" y2="748" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d3-arrow-link)"/>
            <text x="62" y="751" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP CALL</text>

            <line x1="176" y1="748" x2="200" y2="748" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
            <text x="210" y="751" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IN-PROCESS</text>

            <line x1="324" y1="748" x2="348" y2="748" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d3-arrow)"/>
            <text x="358" y="751" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>
          </svg>