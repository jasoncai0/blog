<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">OpenCode 的运行时拓扑</title>
  <desc id="d2-desc">左侧是终端、浏览器、编辑器等客户端；中间是本机唯一的 OpenCode 守护进程，内含 HTTP API、SSE 事件流、Session 执行、工具与扩展、SQLite 存储；右侧是 LLM Provider、项目文件与 Git、MCP Server、PTY 等外部资源。</desc>

  <defs>
    <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">RUNTIME TOPOLOGY</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一个本机守护进程，多个客户端，多个工作区</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">客户端只讲 HTTP 与 SSE；项目、会话、工具全部在服务端一侧</text>

  <!-- clients -->
  <text x="56" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">CLIENTS</text>

  <rect x="56" y="168" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="146" y="191" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">终端 TUI</text>
  <text x="146" y="206" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">solid + opentui</text>

  <rect x="56" y="252" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="146" y="275" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">浏览器</text>
  <text x="146" y="290" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">web app / pwa</text>

  <rect x="56" y="336" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="146" y="359" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">编辑器 / 脚本</text>
  <text x="146" y="374" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">acp · sdk</text>

  <!-- connection bus -->
  <line x1="236" y1="196" x2="268" y2="196" stroke="#4f5d75" stroke-width="1.1"/>
  <line x1="236" y1="280" x2="268" y2="280" stroke="#4f5d75" stroke-width="1.1"/>
  <line x1="236" y1="364" x2="268" y2="364" stroke="#4f5d75" stroke-width="1.1"/>
  <line x1="268" y1="196" x2="268" y2="364" stroke="#4f5d75" stroke-width="1.1"/>
  <line x1="268" y1="196" x2="296" y2="196" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d2-arrow)"/>
  <line x1="296" y1="264" x2="272" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d2-arrow)"/>
  <text x="272" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">SSE</text>

  <!-- server container -->
  <rect x="300" y="120" width="380" height="420" rx="10" fill="#ececec" fill-opacity="0.55" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="320" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">本机 OpenCode 服务</text>
  <text x="660" y="146" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">ONE DAEMON</text>

  <rect x="320" y="168" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="334" y="189" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">HTTP API</text>
  <text x="334" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">170 个 endpoint · Basic / Cookie / pairing code</text>

  <rect x="320" y="240" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="334" y="261" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">SSE · /api/event</text>
  <text x="334" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">编码一次 · 每连接 4096 帧独立队列</text>

  <rect x="320" y="312" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="334" y="333" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">SessionExecution</text>
  <text x="334" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">每个会话一条执行 fiber，串行 drain</text>

  <rect x="320" y="384" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="334" y="405" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">工具 · 权限 · MCP · 插件</text>
  <text x="334" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">按 Location 构建，可随工作区切换</text>

  <rect x="320" y="456" width="340" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="334" y="477" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">SQLite（WAL）</text>
  <text x="334" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">event · session_message · session_part · inbox</text>

  <!-- externals -->
  <text x="740" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">OUTSIDE</text>

  <rect x="740" y="168" width="172" height="56" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
  <text x="826" y="191" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">LLM Provider</text>
  <text x="826" y="206" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">anthropic · openai · …</text>

  <rect x="740" y="240" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="826" y="263" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">项目文件 / Git</text>
  <text x="826" y="278" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">worktree · snapshot</text>

  <rect x="740" y="312" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="826" y="335" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">MCP Servers</text>
  <text x="826" y="350" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">stdio · http</text>

  <rect x="740" y="384" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="826" y="407" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">PTY / Shell</text>
  <text x="826" y="422" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">persistent sessions</text>

  <line x1="680" y1="196" x2="736" y2="196" stroke="#bf4520" stroke-width="1.1" marker-end="url(#d2-arrow-accent)"/>
  <line x1="680" y1="268" x2="736" y2="268" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2-arrow)"/>
  <line x1="680" y1="340" x2="736" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2-arrow)"/>
  <line x1="680" y1="412" x2="736" y2="412" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2-arrow)"/>

  <text x="300" y="574" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">客户端可以不在同一台机器：--server 指向远端，或用 5 分钟有效的配对码换取会话 token。</text>
</svg>
