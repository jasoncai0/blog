<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">一次 prompt 的调用时序</title>
  <desc id="d3-desc">时序图：客户端提交 prompt 后，服务端把输入写成持久收件箱事件，唤醒按会话串行的执行 fiber；runner 每步从 SQLite 重载历史，调用模型，执行工具，再把事件投影回库并通过 SSE 推给客户端。</desc>

  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">PROMPT LIFECYCLE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一次 prompt 的旅程：先落库，再唤醒，每步重载</text>

  <!-- lifelines -->
  <line x1="100" y1="150" x2="100" y2="700" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="150" x2="300" y2="700" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="150" x2="500" y2="700" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="700" y1="150" x2="700" y2="700" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="880" y1="150" x2="880" y2="700" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- headers -->
  <rect x="30" y="108" width="140" height="42" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="134" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">客户端</text>

  <rect x="230" y="108" width="140" height="42" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="300" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">HTTP / SSE</text>
  <text x="300" y="142" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">@opencode/server</text>

  <rect x="430" y="108" width="140" height="42" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="500" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Session 运行时</text>
  <text x="500" y="142" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">@opencode/core</text>

  <rect x="630" y="108" width="140" height="42" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="700" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">SQLite</text>
  <text x="700" y="142" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">events / projections</text>

  <rect x="810" y="108" width="140" height="42" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="880" y="128" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">LLM Provider</text>
  <text x="880" y="142" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">@opencode/ai</text>

  <!-- 1 -->
  <line x1="100" y1="190" x2="296" y2="190" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="108" y="182" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">POST /api/session/:id/prompt</text>

  <!-- 2 -->
  <line x1="300" y1="236" x2="496" y2="236" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="308" y="228" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">Session.prompt(input)</text>

  <!-- 3 -->
  <line x1="500" y1="282" x2="696" y2="282" stroke="#bf4520" stroke-width="1.1" marker-end="url(#d3-arrow-accent)"/>
  <text x="508" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">publish inbox.enqueued → 插入一行收件箱</text>

  <!-- 4 self -->
  <path d="M500,316 h26 v20 h-26" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="536" y="331" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">wake → 该会话专属的执行 fiber（其他会话并行）</text>

  <!-- 5 -->
  <line x1="500" y1="374" x2="696" y2="374" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="508" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">drain：重载历史、指令、工具快照</text>

  <!-- 6 -->
  <line x1="500" y1="420" x2="876" y2="420" stroke="#bf4520" stroke-width="1.1" marker-end="url(#d3-arrow-accent)"/>
  <text x="508" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">llm.stream（超预算时先压缩，再发同一个 Step）</text>

  <!-- 7 -->
  <line x1="880" y1="466" x2="504" y2="466" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d3-arrow)"/>
  <text x="512" y="458" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">text / reasoning / tool_call</text>

  <!-- 8 self -->
  <path d="M500,500 h26 v20 h-26" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="536" y="515" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">permission.assert → tool.execute（副作用前先落调用记录）</text>

  <!-- 9 -->
  <line x1="500" y1="558" x2="696" y2="558" stroke="#bf4520" stroke-width="1.1" marker-end="url(#d3-arrow-accent)"/>
  <text x="508" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">持久事件 → projector → 消息与分片</text>

  <!-- 10 -->
  <line x1="500" y1="596" x2="304" y2="596" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <text x="312" y="588" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">durable 事件 → EventFeed 编码（只编码一次）</text>

  <!-- 11 -->
  <line x1="300" y1="642" x2="104" y2="642" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d3-arrow)"/>
  <text x="112" y="634" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">SSE 帧：UI 按分片增量渲染</text>

  <text x="48" y="694" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">没有内存中的工具循环：工具结果落库后，runner 回到第 5 步开新 Step，上下文从投影后的历史重建。</text>
</svg>
