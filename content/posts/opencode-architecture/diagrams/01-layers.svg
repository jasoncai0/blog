<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">OpenCode 的分层与依赖方向</title>
  <desc id="d1-desc">五层结构：表现层（CLI/TUI、Web、Desktop、ACP）、接入层（client、protocol、sdk）、服务层（server）、运行时层（core 与 ai）、基础层（schema、util）。依赖只能向下，上层通过协议调用下层。</desc>

  <defs>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">LAYER MAP</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">依赖方向：领域模型 → 运行时 → 服务 → 多端</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">箭头表示编译期依赖；运行期调用则相反，由上层发起、下层执行</text>

  <!-- ===== Band 1: clients ===== -->
  <rect x="48" y="112" width="100" height="56" rx="4" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="98" y="136" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">表现层</text>
  <text x="98" y="152" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#5a6580">CLIENTS</text>

  <rect x="160" y="112" width="170" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="245" y="136" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">CLI · TUI</text>
  <text x="245" y="151" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">terminal</text>

  <rect x="344" y="112" width="170" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="429" y="136" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Web App</text>
  <text x="429" y="151" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">browser / PWA</text>

  <rect x="528" y="112" width="170" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="613" y="136" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Desktop</text>
  <text x="613" y="151" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">electron</text>

  <rect x="712" y="112" width="170" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="797" y="136" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">ACP</text>
  <text x="797" y="151" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">editor / agent protocol</text>

  <!-- ===== Band 2: contract ===== -->
  <rect x="48" y="214" width="100" height="56" rx="4" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="98" y="238" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">接入层</text>
  <text x="98" y="254" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#5a6580">CONTRACT</text>

  <rect x="160" y="214" width="228" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="274" y="238" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/protocol</text>
  <text x="274" y="253" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">HttpApi 定义 · 错误模型 · 中间件身份</text>

  <rect x="406" y="214" width="228" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="520" y="238" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/client</text>
  <text x="520" y="253" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">由协议生成的 Promise / Effect 客户端</text>

  <rect x="652" y="214" width="228" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="766" y="238" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/sdk</text>
  <text x="766" y="253" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">进程内组合 client + core + server</text>

  <!-- ===== Band 3: server ===== -->
  <rect x="48" y="316" width="100" height="56" rx="4" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="98" y="340" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">服务层</text>
  <text x="98" y="356" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#5a6580">SERVER</text>

  <rect x="160" y="316" width="720" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="176" y="340" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/server</text>
  <text x="176" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">HttpApi 组装 · 鉴权与配对 · Location 解析 · SSE 事件流 · PTY WebSocket</text>
  <text x="864" y="346" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">170 endpoints</text>

  <!-- ===== Band 4: runtime ===== -->
  <rect x="48" y="418" width="100" height="56" rx="4" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="98" y="442" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">运行时</text>
  <text x="98" y="458" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#5a6580">RUNTIME</text>

  <rect x="160" y="418" width="720" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="176" y="442" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#bf4520">@opencode/core</text>
  <text x="176" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">Session 运行时 · 工具与权限 · Provider · MCP 与插件 · SQLite 存储与投影</text>
  <text x="864" y="448" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">498 files</text>

  <!-- ===== Band 5: foundation ===== -->
  <rect x="48" y="520" width="100" height="56" rx="4" fill="#ececec" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="98" y="544" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">基础层</text>
  <text x="98" y="560" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#5a6580">FOUNDATION</text>

  <rect x="160" y="520" width="228" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="274" y="544" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/schema</text>
  <text x="274" y="559" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">领域模型 + 持久事件（最稳定）</text>

  <rect x="406" y="520" width="228" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="520" y="544" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/ai</text>
  <text x="520" y="559" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">LLM 协议、路由与流式事件</text>

  <rect x="652" y="520" width="228" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="766" y="544" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#2d3142">@opencode/util</text>
  <text x="766" y="559" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">Effect / Layer 节点 / 进程工具</text>

  <!-- dependency arrows in the left gutter -->
  <line x1="98" y1="168" x2="98" y2="208" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d1-arrow)"/>
  <line x1="98" y1="270" x2="98" y2="310" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d1-arrow)"/>
  <line x1="98" y1="372" x2="98" y2="412" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d1-arrow)"/>
  <line x1="98" y1="474" x2="98" y2="514" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d1-arrow)"/>

  <text x="48" y="612" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">客户端只依赖 protocol 与 client；core 与 server 从不反向依赖客户端。schema 是最稳定的一层，跨版本迁移时先动它。</text>
</svg>
