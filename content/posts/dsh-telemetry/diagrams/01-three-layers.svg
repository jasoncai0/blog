<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-title f01-desc">
  <title id="f01-title">三层遥测与两条独立通道</title>
  <desc id="f01-desc">会话事件由 coordinator 取拷贝并造记录，经脱敏 waterfall 与授权门进入 OTel 后端，再以 OTLP log 发出；产品事件由客户端收集后走另一条队列，两条通道不共享队列与截止时间。</desc>

  <defs>
    <marker id="f01-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f01-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">S3 / TELEMETRY</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">三层各管一段，两条通道各走各的</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">会话事件从日志出发，经脱敏与授权才出网；产品事件完全不经过这条链</text>

  <!-- factory -->
  <rect x="40" y="104" width="330" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="58" y="126" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">ctx.otel · 工厂</text>
  <text x="58" y="144" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">createEventReporter / createSessionLogReporter</text>
  <text x="58" y="160" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">挂载不建队列，也没有身份与 endpoint</text>

  <path d="M 370 137 L 720 137 L 720 196" fill="none" stroke="#8a93a6" stroke-dasharray="4 3" marker-end="url(#f01-a)"/>
  <text x="472" y="130" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">只提供构造器</text>

  <!-- session chain -->
  <rect x="40" y="200" width="150" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="222" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">会话日志</text>
  <text x="56" y="244" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">turn/step/tool</text>
  <text x="56" y="260" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">assistant/attempt</text>
  <text x="56" y="286" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">只读，永不被改写</text>

  <rect x="230" y="200" width="170" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="246" y="222" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">coordinator</text>
  <text x="246" y="244" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">captureEvent()</text>
  <text x="246" y="260" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">structuredClone ×2</text>
  <text x="246" y="286" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">live 或 on-demand</text>

  <rect x="440" y="200" width="180" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="456" y="222" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">脱敏 waterfall</text>
  <text x="456" y="244" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">session-telemetry/</text>
  <text x="456" y="258" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">record</text>
  <text x="456" y="286" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">本包无规则，抛错即扣下</text>

  <rect x="660" y="200" width="150" height="120" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="676" y="222" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#bf4520">OTel 后端</text>
  <text x="676" y="244" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">mode 默认</text>
  <text x="676" y="258" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">FEEDBACK_ONLY</text>
  <text x="676" y="286" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">队列 2048 · 批次 512</text>

  <rect x="848" y="236" width="76" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="864" y="265" font-family="'SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">collector</text>

  <path d="M 190 260 L 226 260" fill="none" stroke="#8a93a6" marker-end="url(#f01-a)"/>
  <path d="M 400 260 L 436 260" fill="none" stroke="#8a93a6" marker-end="url(#f01-a)"/>
  <path d="M 620 260 L 656 260" fill="none" stroke="#8a93a6" marker-end="url(#f01-a)"/>
  <path d="M 810 260 L 844 260" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f01-r)"/>

  <text x="196" y="252" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">取拷贝</text>
  <text x="406" y="252" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">过规则</text>
  <text x="626" y="252" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">过授权</text>

  <!-- product channel -->
  <rect x="40" y="408" width="190" height="110" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="430" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">product-analytics</text>
  <text x="56" y="452" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">report(event)</text>
  <text x="56" y="468" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">enabled 策略</text>
  <text x="56" y="492" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">只在桌面端挂载</text>

  <rect x="290" y="408" width="200" height="110" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="306" y="430" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">productTelemetry</text>
  <text x="306" y="452" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">queue 2048 / batch 512</text>
  <text x="306" y="468" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">delay 30s</text>
  <text x="306" y="492" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">x-channel: dsh_otel_report</text>

  <path d="M 230 463 L 286 463" fill="none" stroke="#8a93a6" marker-end="url(#f01-a)"/>
  <path d="M 490 463 L 886 463 L 886 288" fill="none" stroke="#8a93a6" stroke-dasharray="4 3" marker-end="url(#f01-a)"/>
  <text x="560" y="455" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">另一条队列，另一套截止时间</text>

  <text x="40" y="560" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">会话日志只读；脱敏只作用于导出副本。产品事件与会话内容无关，两条链在进程里没有共享队列。</text>
  <text x="40" y="576" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">session-telemetry · session-telemetry-otel · product-telemetry-otel</text>
</svg>
