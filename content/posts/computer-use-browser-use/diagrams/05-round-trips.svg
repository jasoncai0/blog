<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="g5t g5d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="g5t">逐步推理与脚本折叠的往返次数</title>
<desc id="g5d">左图每一步都要一次模型决策，每次请求重发整份上下文；右图把已知的连续动作写成脚本，一次下发，执行器内部跑完再回一条结果。</desc>
<defs>
  <marker id="g5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bf4520"/></marker>
  <marker id="g5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b4b8a"/></marker>
</defs>
<rect width="960" height="560" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">ROUND TRIPS</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">每多一次决策，就重发一次全部上下文</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">同样的 20 个动作，可以跑成 20 次往返，也可以跑成 4 次</text>

<!-- 左 -->
<rect x="40" y="108" width="440" height="340" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="108" width="4" height="340" fill="#bf4520"/>
<text x="64" y="132" font-size="11" font-weight="600" fill="#2d3142">逐步推理：一步一往返</text>
<text x="64" y="150" font-size="9" fill="#5a6580">模型每一步都要重新看一遍界面，再决定下一步</text>

<rect x="72" y="164" width="96" height="26" fill="#e9eff6" stroke="#3d5a80"/>
<text x="120" y="181" text-anchor="middle" font-size="9" fill="#2d3142">模型</text>
<rect x="264" y="164" width="96" height="26" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="312" y="181" text-anchor="middle" font-size="9" fill="#2d3142">执行器</text>
<line x1="120" y1="190" x2="120" y2="420" stroke="#c9d4e4" stroke-dasharray="3 3"/>
<line x1="312" y1="190" x2="312" y2="420" stroke="#c9d4e4" stroke-dasharray="3 3"/>

<g font-size="8.5" fill="#5a6580">
  <line x1="122" y1="212" x2="306" y2="212" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#g5b)"/>
  <text x="214" y="207" text-anchor="middle">动作 1</text>
  <line x1="310" y1="234" x2="126" y2="234" stroke="#bf4520" stroke-width="1.1" marker-end="url(#g5a)"/>
  <text x="214" y="229" text-anchor="middle">观察 1</text>

  <line x1="122" y1="264" x2="306" y2="264" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#g5b)"/>
  <text x="214" y="259" text-anchor="middle">动作 2</text>
  <line x1="310" y1="286" x2="126" y2="286" stroke="#bf4520" stroke-width="1.1" marker-end="url(#g5a)"/>
  <text x="214" y="281" text-anchor="middle">观察 2</text>

  <line x1="122" y1="316" x2="306" y2="316" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#g5b)"/>
  <text x="214" y="311" text-anchor="middle">动作 3</text>
  <line x1="310" y1="338" x2="126" y2="338" stroke="#bf4520" stroke-width="1.1" marker-end="url(#g5a)"/>
  <text x="214" y="333" text-anchor="middle">观察 3</text>
</g>
<text x="120" y="372" text-anchor="middle" font-size="9" fill="#8a93a6">⋮</text>
<text x="312" y="372" text-anchor="middle" font-size="9" fill="#8a93a6">⋮</text>
<line x1="122" y1="396" x2="306" y2="396" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#g5b)"/>
<text x="214" y="391" text-anchor="middle" font-size="8.5" fill="#5a6580">动作 20</text>
<line x1="310" y1="418" x2="126" y2="418" stroke="#bf4520" stroke-width="1.1" marker-end="url(#g5a)"/>
<text x="214" y="413" text-anchor="middle" font-size="8.5" fill="#5a6580">观察 20</text>

<text x="64" y="440" font-size="8.5" fill="#8a93a6">每次请求都带上系统提示、工具说明和全部历史</text>

<!-- 右 -->
<rect x="500" y="108" width="420" height="340" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="500" y="108" width="4" height="340" fill="#5b4b8a"/>
<text x="524" y="132" font-size="11" font-weight="600" fill="#2d3142">脚本折叠：一次下发，内部跑完</text>
<text x="524" y="150" font-size="9" fill="#5a6580">已确定的步骤不再逐步请示，出错才把问题交回来</text>

<rect x="540" y="164" width="96" height="26" fill="#e9eff6" stroke="#3d5a80"/>
<text x="588" y="181" text-anchor="middle" font-size="9" fill="#2d3142">模型</text>
<rect x="756" y="164" width="96" height="26" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="804" y="181" text-anchor="middle" font-size="9" fill="#2d3142">执行器</text>
<line x1="588" y1="190" x2="588" y2="420" stroke="#c9d4e4" stroke-dasharray="3 3"/>
<line x1="804" y1="190" x2="804" y2="420" stroke="#c9d4e4" stroke-dasharray="3 3"/>

<line x1="590" y1="226" x2="798" y2="226" stroke="#5b4b8a" stroke-width="1.6" marker-end="url(#g5b)"/>
<text x="694" y="220" text-anchor="middle" font-size="8.5" fill="#5a6580">脚本：读窗口 → 拼文件名 → 填 → 算按钮中心 → 点</text>

<rect x="652" y="248" width="204" height="112" fill="#efeaf6" stroke="#5b4b8a"/>
<text x="666" y="268" font-size="9" font-weight="600" fill="#2d3142">脚本内部</text>
<text x="666" y="286" font-size="8.5" fill="#4f5d75">数据处理、坐标计算、顺序控制</text>
<text x="666" y="302" font-size="8.5" fill="#4f5d75">中途不回来，只有 await 在等</text>
<text x="666" y="318" font-size="8.5" fill="#4f5d75">按键不可用时 throw，退回模型</text>
<text x="666" y="340" font-size="8.5" fill="#a8752a">这一段是确定性的代码，不是推理</text>

<line x1="802" y1="392" x2="594" y2="392" stroke="#bf4520" stroke-width="1.4" marker-end="url(#g5a)"/>
<text x="698" y="386" text-anchor="middle" font-size="8.5" fill="#5a6580">结果：文件已生成 / 抛错的原文</text>
<text x="698" y="410" text-anchor="middle" font-size="8.5" fill="#8a93a6">只回一条，不逐步汇报</text>

<text x="524" y="440" font-size="8.5" fill="#8a93a6">把连续的「已知动作」折叠成一次调用，模型只在需要重新理解时出场</text>

<!-- 成本 -->
<rect x="40" y="466" width="880" height="76" fill="#f7f8fa" stroke="#e2e6ee"/>
<text x="64" y="490" font-size="9.5" font-weight="600" fill="#2d3142">粗算（假设值，不是实测）</text>
<text x="64" y="510" font-size="9" fill="#4f5d75">上下文 20K、每步新增 0.5K、共 20 步：逐轮约 495K 输入 token；折成 4 次决策约 90K。</text>
<text x="64" y="530" font-size="9" fill="#4f5d75">开启 prompt cache 后前缀单价下降，倍数会缩小；但每一轮仍要等一次生成，延迟降不下来。</text>
</svg>
