<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="g1t g1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="g1t">Agent 操作界面的分层与两个方向</title>
<desc id="g1d">从用户目标、模型、执行器、系统与浏览器接口到应用共五层。观察信息沿左侧上行回到模型，动作沿右侧下行落到界面。</desc>
<defs>
  <marker id="g1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3d5a80"/></marker>
  <marker id="g1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b4b8a"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">COMPUTER USE / BROWSER USE · LAYERS</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">一条链路，两个方向</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">模型只读结果、只发动作；真正接触界面的是执行器</text>

<!-- 目标 -->
<rect x="112" y="120" width="736" height="52" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="112" y="120" width="4" height="52" fill="#3d5a80"/>
<text x="132" y="142" font-size="10.5" font-weight="600" fill="#2d3142">用户目标</text>
<text x="132" y="160" font-size="9.5" fill="#4f5d75">「把这份文档另存为 PDF」「在网盘里找到上周的会议纪要」</text>

<!-- 模型 -->
<rect x="112" y="184" width="736" height="72" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<rect x="112" y="184" width="4" height="72" fill="#3d5a80"/>
<text x="132" y="208" font-size="10.5" font-weight="600" fill="#2d3142">模型：判断</text>
<text x="132" y="226" font-size="9.5" fill="#4f5d75">读上一步的观察，决定下一步做什么，写出工具参数或一段代码</text>
<text x="132" y="244" font-size="9.5" fill="#5a6580">它不持有窗口句柄，也拿不到像素；它只看执行器整理后的结果</text>
<rect x="608" y="196" width="224" height="48" fill="#ffffff" stroke="#c9d4e4"/>
<text x="622" y="214" font-size="9.5" font-weight="600" fill="#3d5a80">Skill：一份工具说明书</text>
<text x="622" y="232" font-size="8.5" fill="#5a6580">截图命令叫什么、点击传坐标还是控件名</text>

<!-- 执行器 -->
<rect x="112" y="268" width="736" height="72" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<rect x="112" y="268" width="4" height="72" fill="#5b4b8a"/>
<text x="132" y="292" font-size="10.5" font-weight="600" fill="#2d3142">执行器：观察与执行</text>
<text x="132" y="310" font-size="9.5" fill="#4f5d75">读控件树或截图、裁剪成模型能读的格式，执行动作，记住当前会话</text>
<text x="132" y="328" font-size="9.5" fill="#5a6580">模型换成另一家、或改走 CLI 还是 MCP，这一层基本不动</text>
<rect x="608" y="280" width="224" height="48" fill="#ffffff" stroke="#c9c2dd"/>
<text x="622" y="298" font-size="9.5" font-weight="600" fill="#5b4b8a">入口：CLI / MCP / 库</text>
<text x="622" y="316" font-size="8.5" fill="#5a6580">同一套能力，三种包装</text>

<!-- 接口 -->
<rect x="112" y="352" width="736" height="120" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="112" y="352" width="4" height="120" fill="#4f5d75"/>
<text x="132" y="374" font-size="10" font-weight="600" fill="#2d3142">系统与浏览器暴露的接口</text>
<rect x="132" y="386" width="340" height="70" fill="#f7f8fa" stroke="#cfd6e3"/>
<text x="146" y="406" font-size="9.5" font-weight="600" fill="#2d3142">桌面：操作系统接口</text>
<text x="146" y="424" font-size="9" fill="#4f5d75">可访问性树 · 窗口截图 · 键鼠事件注入</text>
<text x="146" y="442" font-size="8.5" fill="#8a93a6">读和写是两套接口，能力各自受限</text>
<rect x="492" y="386" width="340" height="70" fill="#f7f8fa" stroke="#cfd6e3"/>
<text x="506" y="406" font-size="9.5" font-weight="600" fill="#2d3142">浏览器：页面与调试接口</text>
<text x="506" y="424" font-size="9" fill="#4f5d75">DOM · 可访问性树 · 标签页与上传 · CDP</text>
<text x="506" y="442" font-size="8.5" fill="#8a93a6">比桌面多一层：元素本身可被寻址</text>

<!-- 应用 -->
<rect x="112" y="484" width="736" height="56" fill="#ececec" stroke="#cfd6e3"/>
<text x="132" y="508" font-size="10.5" font-weight="600" fill="#2d3142">桌面应用（Word）/ 网页（网盘）</text>
<text x="132" y="526" font-size="9.5" fill="#4f5d75">真正决定「能不能点」的是应用自己：有没有暴露控件、支不支持直接触发动作</text>

<!-- 两个方向 -->
<line x1="76" y1="536" x2="76" y2="196" stroke="#3d5a80" stroke-width="1.4" marker-end="url(#g1a)"/>
<text transform="rotate(-90 60 380)" x="60" y="380" text-anchor="middle" font-size="9.5" fill="#3d5a80">观察上行：结构文本 / 截图</text>
<line x1="884" y1="196" x2="884" y2="536" stroke="#5b4b8a" stroke-width="1.4" marker-end="url(#g1b)"/>
<text transform="rotate(90 900 360)" x="900" y="360" text-anchor="middle" font-size="9.5" fill="#5b4b8a">执行下行：控件动作 / 坐标输入</text>

<text x="48" y="576" font-size="8.5" fill="#8a93a6">上行决定模型看得见什么，下行决定动作落在哪里。能力上限都由最下面两层决定。</text>
</svg>
