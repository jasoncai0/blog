<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="g2t g2d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="g2t">同一个保存窗口的两种读法</title>
<desc id="g2d">左边是截图，模型看到的是外观、文字和位置；右边是可访问性树，模型读到的是控件类型、名称、值和可用状态。两者指向同一个输入框。</desc>
<defs>
  <marker id="g2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8752a"/></marker>
</defs>
<rect width="960" height="520" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">READING THE SAME DIALOG</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">同一个保存窗口，两套可读信息</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">示教画面：格式已选 PDF，只剩文件名和保存按钮要处理</text>

<!-- 左：像素 -->
<rect x="40" y="112" width="400" height="348" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="112" width="4" height="348" fill="#3d5a80"/>
<text x="64" y="138" font-size="11" font-weight="600" fill="#2d3142">像素：一张截图</text>
<text x="64" y="157" font-size="9.5" fill="#5a6580">看到外观、文字和位置；要靠模型自己判断「这是输入框」</text>

<rect x="64" y="176" width="352" height="232" fill="#eef2f7" stroke="#c9d4e4"/>
<rect x="64" y="176" width="352" height="32" fill="#e2e9f2"/>
<text x="80" y="197" font-size="9.5" font-weight="600" fill="#2d3142">保存 PDF</text>
<text x="88" y="236" font-size="9" fill="#5a6580">文件名</text>
<rect x="88" y="244" width="244" height="32" fill="#ffffff" stroke="#3d5a80"/>
<text x="98" y="264" font-size="9.5" fill="#2d3142">会议纪要.pdf</text>
<text x="88" y="300" font-size="9" fill="#5a6580">位置：下载</text>
<rect x="332" y="356" width="72" height="30" fill="#3d5a80"/>
<text x="368" y="376" text-anchor="middle" font-size="9.5" fill="#ffffff">保存</text>
<text x="64" y="432" font-size="8.5" fill="#8a93a6">「蓝色圆角块」是按钮，这件事由模型推断，不是应用声明的</text>

<!-- 右：结构 -->
<rect x="520" y="112" width="400" height="348" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="520" y="112" width="4" height="348" fill="#2f6f5e"/>
<text x="544" y="138" font-size="11" font-weight="600" fill="#2d3142">结构：一棵控件树</text>
<text x="544" y="157" font-size="9.5" fill="#5a6580">读到类型、名称、值和可用状态；位置和外观完全不在里面</text>

<rect x="544" y="176" width="352" height="232" fill="#f7faf8" stroke="#cfe0d6"/>
<g font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9.5">
  <text x="562" y="204" fill="#2d3142">窗口 "保存PDF"</text>
  <text x="562" y="234" fill="#7c8a84">├─</text><text x="586" y="234" fill="#2f6f5e">文本框</text>
  <text x="586" y="258" fill="#4f5d75">名称 = "文件名"</text>
  <text x="586" y="282" fill="#4f5d75">值   = "会议纪要.pdf"</text>
  <text x="586" y="306" fill="#4f5d75">可编辑 = true</text>
  <text x="562" y="336" fill="#7c8a84">└─</text><text x="586" y="336" fill="#2f6f5e">按钮 "保存"</text>
  <text x="586" y="360" fill="#4f5d75">可用 = true</text>
  <text x="586" y="384" fill="#4f5d75">默认动作 = 保存文档</text>
</g>
<text x="544" y="432" font-size="8.5" fill="#8a93a6">后两行不是每个应用都给：给了才可能不靠坐标去点</text>

<!-- 中间 -->
<path d="M448 300 H 508" fill="none" stroke="#a8752a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#g2a)"/>
<text x="480" y="288" text-anchor="middle" font-size="8.5" fill="#a8752a">同一控件</text>

<text x="48" y="496" font-size="9.5" fill="#4f5d75">两条通道读的是同一个窗口，一条给外观，一条给语义。选哪条，取决于下一步要判断什么。</text>
</svg>
