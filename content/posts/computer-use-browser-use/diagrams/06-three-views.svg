<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="g6t g6d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="g6t">同一个网页的三种读法</title>
<desc id="g6d">左边是渲染后的画面，中间是 DOM 结构，右边是可访问性树。三者描述同一组元素的不同侧面：外观、结构、语义与状态。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>

<text x="48" y="40" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">THREE VIEWS OF ONE PAGE</text>
<text x="48" y="66" font-size="16" font-weight="600" fill="#2d3142">网页比窗口多给了两层：结构，和可寻址的元素</text>
<text x="48" y="88" font-size="10.5" fill="#5a6580">示教画面：搜索框已填「会议纪要」，尚未提交</text>

<!-- 画面 -->
<rect x="40" y="112" width="272" height="330" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="112" width="4" height="330" fill="#3d5a80"/>
<text x="62" y="136" font-size="10.5" font-weight="600" fill="#2d3142">画面</text>
<text x="62" y="154" font-size="8.5" fill="#8a93a6">外观 · 位置 · 布局</text>
<rect x="62" y="172" width="228" height="200" fill="#f7f8fa" stroke="#cfd6e3"/>
<text x="76" y="196" font-size="9.5" font-weight="600" fill="#2d3142">网盘文件</text>
<text x="76" y="222" font-size="8.5" fill="#5a6580">文件名</text>
<rect x="76" y="230" width="180" height="30" fill="#ffffff" stroke="#3d5a80"/>
<text x="86" y="250" font-size="9" fill="#2d3142">会议纪要</text>
<rect x="76" y="276" width="64" height="28" fill="#3d5a80"/>
<text x="108" y="295" text-anchor="middle" font-size="9" fill="#ffffff">搜索</text>
<text x="62" y="392" font-size="8.5" fill="#4f5d75">任何应用都有画面，这是唯一全覆盖的一层</text>
<text x="62" y="410" font-size="8.5" fill="#8a93a6">读它要视觉模型，每次都得重新推断</text>
<text x="62" y="428" font-size="8.5" fill="#8a93a6">信息量最大，也最贵</text>

<!-- DOM -->
<rect x="344" y="112" width="272" height="330" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="344" y="112" width="4" height="330" fill="#4f5d75"/>
<text x="366" y="136" font-size="10.5" font-weight="600" fill="#2d3142">DOM</text>
<text x="366" y="154" font-size="8.5" fill="#8a93a6">元素 · 属性 · 层级</text>
<rect x="366" y="172" width="228" height="200" fill="#f7f8fa" stroke="#cfd6e3"/>
<g font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#4f5d75">
  <text x="380" y="196">&lt;div class="bar"&gt;</text>
  <text x="392" y="216">&lt;label for="q"&gt;文件名&lt;/label&gt;</text>
  <text x="392" y="236">&lt;input id="q"</text>
  <text x="404" y="254">value="会议纪要"&gt;</text>
  <text x="392" y="274">&lt;button&gt;搜索&lt;/button&gt;</text>
  <text x="380" y="294">&lt;/div&gt;</text>
  <text x="380" y="326" fill="#8a93a6">// 结构本身不说明能不能点</text>
  <text x="380" y="344" fill="#8a93a6">// 要配合属性与事件判断</text>
</g>
<text x="366" y="392" font-size="8.5" fill="#4f5d75">定位靠选择器，元素被重排也能找到</text>
<text x="366" y="410" font-size="8.5" fill="#8a93a6">框架生成的类名不可读，得靠语义标签</text>
<text x="366" y="428" font-size="8.5" fill="#8a93a6">只在浏览器里有，桌面应用没有</text>

<!-- 可访问性树 -->
<rect x="648" y="112" width="272" height="330" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="648" y="112" width="4" height="330" fill="#2f6f5e"/>
<text x="670" y="136" font-size="10.5" font-weight="600" fill="#2d3142">可访问性树</text>
<text x="670" y="154" font-size="8.5" fill="#8a93a6">类型 · 名称 · 状态</text>
<rect x="670" y="172" width="228" height="200" fill="#f7faf8" stroke="#cfe0d6"/>
<g font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5">
  <text x="684" y="196" fill="#2d3142">树</text>
  <text x="684" y="222" fill="#7c8a84">├─</text><text x="708" y="222" fill="#2f6f5e">文本框 "文件名"</text>
  <text x="708" y="242" fill="#4f5d75">值: 会议纪要</text>
  <text x="708" y="260" fill="#4f5d75">可编辑: true</text>
  <text x="684" y="288" fill="#7c8a84">└─</text><text x="708" y="288" fill="#2f6f5e">按钮 "搜索"</text>
  <text x="708" y="308" fill="#4f5d75">可用: true</text>
  <text x="708" y="328" fill="#4f5d75">可点击: true</text>
  <text x="684" y="356" fill="#8a93a6">// 桌面与网页共用同一套语义</text>
</g>
<text x="670" y="392" font-size="8.5" fill="#4f5d75">纯文本模型也能据此决策，不必看图</text>
<text x="670" y="410" font-size="8.5" fill="#8a93a6">覆盖率取决于作者写没写语义</text>
<text x="670" y="428" font-size="8.5" fill="#8a93a6">「只读」和「可执行」是两件事</text>

<text x="48" y="476" font-size="9.5" fill="#4f5d75">三种读法不是替代关系：结构告诉你去点哪个，画面告诉你点完对不对。</text>
<text x="48" y="498" font-size="8.5" fill="#8a93a6">只用 DOM 容易点到隐形遮罩下的元素，只用画面又分不清两个长得一样的按钮。</text>
</svg>
