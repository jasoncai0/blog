<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">3D 资产管线：从 Blender 源文件到平台安装包</title>
  <desc id="f1d">资产从 Blender 建模与展 UV 开始，导出为 FBX 等中间格式，再导入引擎重建为 uasset，在关卡里组装，最后打包成 pak 或 utoc/ucas。白模和 PBR 贴图组从侧路进入关卡组装与引擎导入；改模型需要重导出和重导入。</desc>
  <defs>
    <marker id="f1a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="f1o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <marker id="f1b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3d5a80"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">ASSET PIPELINE · .BLEND → .FBX → .UASSET → .PAK</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">一条资产要过四道手，白模和贴图从另外两条路进来</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">中间格式把 DCC 和引擎解耦；改模型要重导出、重导入，引擎里那份不会自动更新</text>

  <!-- 01 Blender -->
  <rect x="40" y="150" width="160" height="150" rx="8" fill="#e9eff6" stroke="rgba(45,49,66,0.2)"/>
  <rect x="40" y="150" width="4" height="150" fill="#3d5a80"/>
  <text x="56" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Blender</text>
  <text x="56" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">建模 · 展 UV · 绑定</text>
  <text x="56" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">导出前 Apply 修改器</text>
  <text x="56" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">Z 轴朝上，单位为米</text>
  <text x="56" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">.blend 源文件</text>

  <!-- 02 export -->
  <rect x="220" y="150" width="160" height="150" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
  <rect x="220" y="150" width="4" height="150" fill="#5b4b8a"/>
  <text x="236" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">导出</text>
  <text x="236" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">FBX / glTF / USD</text>
  <text x="236" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">带网格、UV、骨骼、动画</text>
  <text x="236" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">材质节点留在源文件</text>
  <text x="236" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">.fbx 中间格式</text>

  <!-- 03 import -->
  <rect x="400" y="150" width="160" height="150" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
  <rect x="400" y="150" width="4" height="150" fill="#5b4b8a"/>
  <text x="416" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">引擎导入</text>
  <text x="416" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">重建资产，压缩贴图</text>
  <text x="416" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">材质要在引擎里重连</text>
  <text x="416" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">改源文件不会自动更新</text>
  <text x="416" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">.uasset / .prefab</text>

  <!-- 04 assemble -->
  <rect x="580" y="150" width="160" height="150" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/>
  <rect x="580" y="150" width="4" height="150" fill="#5b4b8a"/>
  <text x="596" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">关卡组装</text>
  <text x="596" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">摆进场景，配蓝图逻辑</text>
  <text x="596" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">白模在这一步被替换</text>
  <text x="596" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">光照和碰撞一起调</text>
  <text x="596" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">.umap / .unity</text>

  <!-- 05 package -->
  <rect x="760" y="150" width="160" height="150" rx="8" fill="#e9f2ed" stroke="rgba(45,49,66,0.2)"/>
  <rect x="760" y="150" width="4" height="150" fill="#2f6f5e"/>
  <text x="776" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">打包</text>
  <text x="776" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">烘焙、压缩、分块</text>
  <text x="776" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">按平台出包</text>
  <text x="776" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">包体里没有源文件</text>
  <text x="776" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e">.pak / .utoc+.ucas</text>

  <!-- arrows -->
  <g stroke="#4f5d75" stroke-width="1.5">
    <line x1="200" y1="225" x2="212" y2="225" marker-end="url(#f1a)"/>
    <line x1="380" y1="225" x2="392" y2="225" marker-end="url(#f1a)"/>
    <line x1="560" y1="225" x2="572" y2="225" marker-end="url(#f1a)"/>
    <line x1="740" y1="225" x2="752" y2="225" marker-end="url(#f1a)"/>
  </g>

  <!-- side inputs -->
  <rect x="40" y="365" width="420" height="76" rx="8" fill="#f7efe4" stroke="rgba(45,49,66,0.16)"/>
  <rect x="40" y="365" width="4" height="76" fill="#bf4520"/>
  <text x="56" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">白模 / Whitebox</text>
  <text x="56" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">关卡策划在引擎里用灰盒和胶囊搭，先定尺寸、掩体和动线</text>
  <text x="56" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">不进最终包体，只用来验证空间</text>

  <rect x="500" y="365" width="420" height="76" rx="8" fill="#e9eff6" stroke="rgba(45,49,66,0.16)"/>
  <rect x="500" y="365" width="4" height="76" fill="#3d5a80"/>
  <text x="516" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">PBR 贴图组</text>
  <text x="516" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">Substance / Photoshop 产出，导入时和模型合成材质</text>
  <text x="516" y="430" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">BaseColor · Normal · Roughness · Metallic · AO</text>

  <g fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.85">
    <path d="M 250 363 L 250 336 L 660 336 L 660 304" marker-end="url(#f1o)"/>
    <path d="M 700 363 L 700 320 L 480 320 L 480 304" stroke="#3d5a80" marker-end="url(#f1b)"/>
  </g>

  <text x="48" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">返工代价按阶段跳：改白模是分钟，改贴图是小时，改已经组装好的关卡和光照是天。</text>
</svg>
