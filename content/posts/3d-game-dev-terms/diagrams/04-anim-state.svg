<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f4t f4d">
  <title id="f4t">角色动画状态机与混合空间</title>
  <desc id="f4d">橙色虚线框 Any State 可以跳到 Jump；紫色状态 Idle、Move、Jump、Land 之间按条件切换；Move 内部是一个由速度驱动的混合空间，在 Walk 和 Run 之间连续插值。</desc>
  <defs>
    <marker id="f4p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b4b8a"/></marker>
    <marker id="f4o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">ANIMATION · STATE MACHINE + BLEND SPACE</text>
  <text x="48" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">状态机管切换，混合空间管连续变化</text>
  <text x="48" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">跳跃是一段不可打断的状态，移动是速度驱动的连续插值，两者叠在同一套骨架上</text>

  <rect x="48" y="112" width="180" height="56" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="138" y="138" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#bf4520">Any State</text>
  <text x="138" y="154" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">任意状态</text>

  <rect x="110" y="240" width="160" height="70" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.5"/>
  <text x="190" y="275" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">Idle</text>
  <text x="190" y="292" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">待机循环</text>

  <rect x="340" y="240" width="270" height="90" rx="6" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.5"/>
  <text x="475" y="266" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">Move · 混合空间</text>
  <line x1="360" y1="300" x2="590" y2="300" stroke="#3d5a80" stroke-width="1.2"/>
  <line x1="360" y1="296" x2="360" y2="304" stroke="#3d5a80"/>
  <line x1="440" y1="296" x2="440" y2="304" stroke="#3d5a80"/>
  <line x1="545" y1="296" x2="545" y2="304" stroke="#3d5a80"/>
  <line x1="590" y1="296" x2="590" y2="304" stroke="#3d5a80"/>
  <circle cx="470" cy="300" r="5" fill="#3d5a80"/>
  <text x="360" y="316" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">0</text>
  <text x="440" y="316" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">Walk</text>
  <text x="545" y="316" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">Run</text>
  <text x="590" y="316" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">600</text>
  <text x="475" y="326" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">速度作为参数，在 Walk 与 Run 之间插值</text>

  <rect x="700" y="180" width="160" height="70" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.5"/>
  <text x="780" y="215" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">Jump</text>
  <text x="780" y="232" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">单次跳跃 · 根运动</text>

  <rect x="360" y="400" width="160" height="70" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.5"/>
  <text x="440" y="435" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">Land</text>
  <text x="440" y="452" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">落地缓冲</text>

  <!-- transitions -->
  <line x1="270" y1="268" x2="340" y2="268" stroke="#5b4b8a" stroke-width="1.5" marker-end="url(#f4p)"/>
  <text x="305" y="262" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">speed &gt; 0</text>

  <line x1="340" y1="300" x2="270" y2="300" stroke="#5b4b8a" stroke-width="1.5" marker-end="url(#f4p)"/>
  <text x="305" y="314" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">speed = 0</text>

  <path d="M 560 240 C 620 232 660 215 698 215" fill="none" stroke="#5b4b8a" stroke-width="1.5" marker-end="url(#f4p)"/>
  <text x="648" y="234" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">空格 + 在地面</text>

  <path d="M 760 250 C 745 330 640 400 522 418" fill="none" stroke="#5b4b8a" stroke-width="1.5" marker-end="url(#f4p)"/>
  <text x="650" y="372" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">落地</text>

  <path d="M 360 440 C 320 440 260 390 212 314" fill="none" stroke="#5b4b8a" stroke-width="1.5" marker-end="url(#f4p)"/>
  <text x="300" y="398" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">速度归零</text>

  <path d="M 228 140 C 380 128 560 150 698 186" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f4o)"/>
  <text x="430" y="124" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">任意状态 + 在地面</text>

  <text x="48" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">状态机负责状态之间的切换条件；混合空间负责同一状态内的连续插值。两条轨道分开调，别塞进同一个状态。</text>
  <text x="48" y="526" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">根运动由动画驱动位移，代码里再叠加一次移动输入，角色就会走出两倍距离。</text>
</svg>
