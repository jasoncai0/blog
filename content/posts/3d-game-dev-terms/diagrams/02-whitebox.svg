<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="f2t f2d">
  <title id="f2t">同一个关卡的白模版本与成品版本</title>
  <desc id="f2d">左边是俯视白模：灰色地板、黑色墙体和几个白色盒子，标出出生点、目标和动线。右边是同一布局的成品：地板有材质，墙体换成木质，补上桌子、箱子和灯光，动线不变。</desc>
  <defs>
    <marker id="f2a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b4b52"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">WHITEBOX → FINAL · 同一张俯视布局</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">白模验证空间，成品才谈得上好看</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">几何和动线在两版里保持一致；白模阶段改动按分钟，成品阶段按天</text>

  <text x="48" y="116" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">01 · 白模 / WHITEBOX</text>
  <text x="508" y="116" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#2f6f5e">02 · 成品 / FINAL</text>

  <!-- left plan -->
  <rect x="48" y="130" width="380" height="250" fill="#ececec" stroke="#2d3142" stroke-width="5"/>
  <rect x="235" y="130" width="6" height="130" fill="#2d3142"/>
  <rect x="235" y="295" width="6" height="15" fill="#2d3142"/>
  <rect x="48" y="307" width="72" height="6" fill="#2d3142"/>
  <rect x="160" y="307" width="78" height="6" fill="#2d3142"/>

  <rect x="88" y="158" width="70" height="42" fill="#fafafa" stroke="#6b7588"/>
  <rect x="275" y="185" width="55" height="55" fill="#fafafa" stroke="#6b7588"/>
  <rect x="318" y="315" width="72" height="42" fill="#fafafa" stroke="#6b7588"/>
  <rect x="138" y="235" width="48" height="32" fill="#fafafa" stroke="#6b7588"/>

  <circle cx="80" cy="350" r="8" fill="#bf4520"/>
  <text x="94" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">出生点</text>
  <path d="M 396 156 L 410 168 L 396 180 L 382 168 Z" fill="none" stroke="#9b4b52" stroke-width="2"/>
  <text x="366" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#9b4b52">目标</text>

  <path d="M 86 340 L 140 300 L 225 285 L 268 245 L 345 205 L 382 176" fill="none" stroke="#9b4b52" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f2a)"/>

  <text x="120" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">走廊</text>
  <text x="330" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">A 区</text>
  <text x="140" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">B 区</text>

  <!-- right plan -->
  <rect x="508" y="130" width="380" height="250" fill="#dfe8f2" stroke="#2d3142" stroke-width="5"/>
  <rect x="695" y="130" width="6" height="130" fill="#8a6f55"/>
  <rect x="695" y="295" width="6" height="15" fill="#8a6f55"/>
  <rect x="508" y="307" width="72" height="6" fill="#8a6f55"/>
  <rect x="620" y="307" width="81" height="6" fill="#8a6f55"/>

  <rect x="710" y="145" width="120" height="95" fill="#cbdcea"/>

  <rect x="548" y="158" width="70" height="42" fill="#a8752a" opacity="0.35" stroke="#a8752a"/>
  <rect x="735" y="185" width="55" height="55" fill="#a8752a" opacity="0.35" stroke="#a8752a"/>
  <rect x="778" y="315" width="72" height="42" fill="#a8752a" opacity="0.35" stroke="#a8752a"/>
  <rect x="598" y="235" width="48" height="32" fill="#a8752a" opacity="0.35" stroke="#a8752a"/>

  <circle cx="762" cy="208" r="12" fill="#a8752a"/>
  <circle cx="790" cy="222" r="8" fill="#a8752a"/>
  <rect x="556" y="322" width="26" height="26" fill="#a8752a"/>

  <ellipse cx="740" cy="290" rx="42" ry="14" fill="#f0dfba" opacity="0.65"/>
  <ellipse cx="600" cy="188" rx="30" ry="10" fill="#f0dfba" opacity="0.55"/>

  <circle cx="540" cy="350" r="8" fill="#bf4520"/>
  <text x="554" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">出生点</text>
  <path d="M 856 156 L 870 168 L 856 180 L 842 168 Z" fill="none" stroke="#9b4b52" stroke-width="2"/>

  <path d="M 546 340 L 600 300 L 685 285 L 728 245 L 805 205 L 842 176" fill="none" stroke="#9b4b52" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f2a)"/>

  <text x="580" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">走廊</text>
  <text x="790" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">A 区</text>
  <text x="600" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">B 区</text>

  <text x="48" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">只验证尺寸、掩体、视距和动线；所有物体都是盒子与胶囊，改一个掩体几秒钟</text>
  <text x="508" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">同一套几何加贴图、光照、道具；结构再改，模型、UV、碰撞、光照都要重做</text>

  <text x="48" y="455" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">白模定稿后再改结构，代价按天算。判断标准只有一个：玩家在这条动线上有没有得选。</text>
</svg>
