<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="b08t b08d">
<title id="b08t">删一条记录，为什么不是拆一个数组元素</title>
<desc id="b08d">没有入边索引，硬删会切断簇之间的导航路径；工业实现先用墓碑，再靠 compaction 重建</desc>
