<text x="40" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">硬删要扫全图找入边、给邻居重连，删一个 hub 就可能把长程导航切断；墓碑把这两步推迟到 compaction。</text>
