<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="b05t b05d">
<title id="b05t">nprobe 只扫最近的桶，真近邻可能在隔壁</title>
<desc id="b05d">query 落在簇边界附近时，离它最近的质心未必属于离它最近的向量</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4b52"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs>
<rect width="960" height="500" fill="#f5f5f5"/>
<text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" letter-spacing="0.14em">IVF / BOUNDARY</text><text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">nprobe 只扫最近的桶，真近邻可能在隔壁</text><text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">query 落在簇边界附近时，离它最近的质心未必属于离它最近的向量</text>

<g transform="translate(40,110)"><rect x="0" y="0" width="420" height="300" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="16" y="26" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#2d3142">nprobe = 1</text><text x="124" y="26" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">只扫 A</text><polygon points="10,44 214,44 221,270 10,270" fill="#e9f2ed"/><polygon points="214,44 410,44 410,270 221,270" fill="#ececec"/><line x1="214" y1="44" x2="221" y2="270" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 4"/><text x="22" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2f6f5e">桶 A</text><text x="398" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#8a93a6" text-anchor="end">桶 B</text><polygon points="110,158 117,165 110,172 103,165" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.4"/><text x="110" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2f6f5e" text-anchor="middle">cA</text><polygon points="320,183 327,190 320,197 313,190" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.4"/><text x="320" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2f6f5e" text-anchor="middle">cB</text><circle cx="245" cy="155" r="5" fill="#ffffff" stroke="#9b4b52" stroke-width="1.6"/><circle cx="150" cy="110" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="170" cy="210" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="90" cy="220" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="130" cy="240" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="60" cy="120" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="200" cy="150" r="7" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="200" y="153" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">q</text><circle cx="245" cy="155" r="12" fill="none" stroke="#9b4b52" stroke-width="1.2" stroke-dasharray="3 3"/><text x="264" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#9b4b52">p₁ 真近邻</text><text x="264" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#9b4b52">不在候选里</text><text x="20" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">候选 = A 里的 5 条，漏掉 1 条</text></g>
<g transform="translate(500,110)"><rect x="0" y="0" width="420" height="300" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="16" y="26" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" fill="#2d3142">nprobe = 2</text><text x="124" y="26" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">扫 A + B</text><polygon points="10,44 214,44 221,270 10,270" fill="#e9f2ed"/><polygon points="214,44 410,44 410,270 221,270" fill="#e9f2ed"/><line x1="214" y1="44" x2="221" y2="270" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 4"/><text x="22" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2f6f5e">桶 A</text><text x="398" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2f6f5e" text-anchor="end">桶 B</text><polygon points="110,158 117,165 110,172 103,165" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.4"/><text x="110" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2f6f5e" text-anchor="middle">cA</text><polygon points="320,183 327,190 320,197 313,190" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.4"/><text x="320" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2f6f5e" text-anchor="middle">cB</text><circle cx="245" cy="155" r="5" fill="#ffffff" stroke="#2f6f5e" stroke-width="1.6"/><circle cx="150" cy="110" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="170" cy="210" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="90" cy="220" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="130" cy="240" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="60" cy="120" r="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><circle cx="200" cy="150" r="7" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="200" y="153" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">q</text><text x="258" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2f6f5e">p₁ 进候选</text><text x="20" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">候选 = A + B 的 6 条，p₁ 在列</text></g>
<text x="40" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">调大 nprobe 能压低边界漏召回，但扫描量按 nprobe / nlist 增长；接近 nlist 时 IVF 退化成 Flat。</text>
</svg>