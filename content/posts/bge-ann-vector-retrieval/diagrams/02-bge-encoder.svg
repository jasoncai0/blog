<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">BGE 双塔与三阶段训练</title>
<desc id="d">左图是 BGE 双塔推理，右图是 RetroMAE 预训练、对比学习和指令微调三阶段。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">BGE: BI-ENCODER + THREE-STAGE TRAINING</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">BGE 的实现：一次前向得到单位向量，三阶段把语义压进 CLS</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">双塔让文档向量可以离线预算；对比学习让正样本靠近、批内负样本远离</text><rect x="48" y="112" width="420" height="418" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="64" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.12em">INFERENCE / 双塔</text><text x="64" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">文档离线编码，query 在线编码一次</text><rect x="64" y="196" width="118" height="44" rx="7" fill="#eceff2" stroke="#c9ced6" stroke-width="1"/><text x="123" y="215" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">query</text><text x="123" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">一段文本</text><line x1="182" y1="218" x2="218" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="64" y="316" width="118" height="44" rx="7" fill="#eceff2" stroke="#c9ced6" stroke-width="1"/><text x="123" y="335" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">passage</text><text x="123" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">一段文本</text><line x1="182" y1="338" x2="218" y2="338" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="220" y="182" width="114" height="200" rx="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="277" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">BERT / XLM-R</text><text x="277" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">编码器</text><text x="277" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="500" text-anchor="middle">共享参数</text><text x="277" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="middle">12 / 24 层</text><text x="277" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="middle">max 512</text><text x="277" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="middle">[CLS] 最后隐状态</text><line x1="334" y1="218" x2="366" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="380" cy="218" r="14" fill="#fff" stroke="#bf4520" stroke-width="1.2"/><text x="380" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520" font-weight="500" text-anchor="middle">CLS</text><line x1="394" y1="218" x2="420" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="424" y="202" width="30" height="32" rx="6" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="439" y="223" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520" font-weight="600" text-anchor="middle">q</text><line x1="334" y1="338" x2="366" y2="338" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="380" cy="338" r="14" fill="#fff" stroke="#bf4520" stroke-width="1.2"/><text x="380" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520" font-weight="500" text-anchor="middle">CLS</text><line x1="394" y1="338" x2="420" y2="338" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="424" y="322" width="30" height="32" rx="6" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="439" y="343" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520" font-weight="600" text-anchor="middle">p</text><text x="64" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">L2 归一化后，内积就是余弦相似度</text><text x="64" y="420" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#bf4520" font-weight="500">score(q,p) = q · p = cos(q,p)</text><text x="64" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">文档向量可离线预计算；query 每次请求只编码一次。双塔的代价是 query 与 passage 在编码时</text><text x="64" y="457" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">互不可见，细粒度交互留给 reranker。</text><text x="64" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="500">归一化、池化方式、max_length 必须与训练时一致。</text><rect x="500" y="112" width="412" height="418" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="516" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#3d5a80" font-weight="500" letter-spacing="0.12em">TRAINING / 三阶段</text><rect x="516" y="158" width="380" height="96" rx="7" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="516" y="158" width="3" height="96" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="532" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">① RetroMAE 预训练</text><text x="532" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">污染文本 → 编码 → 轻量 decoder 还原干净文本；让 CLS 承载可重建的语义。</text><line x1="706" y1="254" x2="706" y2="272" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="516" y="272" width="380" height="96" rx="7" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="516" y="272" width="3" height="96" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="532" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">② 对比学习</text><text x="532" y="314.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">100M 无标注 pairs；batch 19,200；纯 in-batch</text><text x="532" y="326.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">negatives；InfoNCE（τ 为温度）。</text><rect x="812" y="292" width="11" height="11" rx="2" fill="#f7e6e1" stroke="#bf4520" stroke-width="0.8"/><rect x="825" y="292" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="838" y="292" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="851" y="292" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="812" y="305" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="825" y="305" width="11" height="11" rx="2" fill="#f7e6e1" stroke="#bf4520" stroke-width="0.8"/><rect x="838" y="305" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="851" y="305" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="812" y="318" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="825" y="318" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="838" y="318" width="11" height="11" rx="2" fill="#f7e6e1" stroke="#bf4520" stroke-width="0.8"/><rect x="851" y="318" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="812" y="331" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="825" y="331" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="838" y="331" width="11" height="11" rx="2" fill="#eceff2" stroke="#c9ced6" stroke-width="0.8"/><rect x="851" y="331" width="11" height="11" rx="2" fill="#f7e6e1" stroke="#bf4520" stroke-width="0.8"/><text x="837" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#5a6580" text-anchor="middle">p →</text><text x="806" y="317" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#5a6580" text-anchor="end">q ↓</text><text x="837" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#bf4520" font-weight="500" text-anchor="middle">对角线 = 正样本</text><line x1="706" y1="368" x2="706" y2="386" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="516" y="386" width="380" height="84" rx="7" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="516" y="386" width="3" height="84" rx="1.5" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="1"/><text x="532" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">③ 多任务 / 指令微调</text><text x="532" y="428.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#5a6580">838K 标注 pairs；query 加检索指令；加入 hard negatives 与多任务数据。</text><text x="516" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">C-Pack：C-MTEB 35 个数据集（6 类任务）；C-MTP 100M 无标注 + 838K 标注。</text><text x="48" y="568" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" font-weight="600">大 batch 不是为了“更快”，而是为了让每个正样本在一次 softmax 里见到足够多负样本。</text><text x="48" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#5a6580">BGE 的检索指令只加在 query 上；文档侧保持裸文本，否则 query / passage 分布会被一起推偏。</text>
</svg>
