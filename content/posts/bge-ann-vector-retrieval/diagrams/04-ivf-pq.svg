<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">IVF 与 PQ 的两级压缩</title>
<desc id="d">IVF 用 nprobe 控制扫多少桶，PQ 把残差切成 M 段各量化成 1 字节，ADC 用查表代替逐维计算。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">IVF + PQ: SCAN LESS, STORE LESS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">IVF 与 PQ：一个负责少扫，一个负责少存</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">IVF 用粗聚类把候选缩到几个桶；PQ 把残差压成 M 个字节，ADC 查表代替逐维乘加</text><rect x="48" y="112" width="430" height="330" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="64" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.12em">① IVF / 粗量化</text><text x="64" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">先找最近的 nprobe 个桶，再扫桶内</text><rect x="64" y="182" width="270" height="196" rx="6" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="154" y="182" width="90" height="98" rx="0" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.2"/><rect x="154" y="280" width="90" height="98" rx="0" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.2"/><circle cx="109" cy="231" r="5" fill="#4f5d75" stroke="#4f5d75" stroke-width="1.2"/><circle cx="199" cy="231" r="5" fill="#bf4520" stroke="#bf4520" stroke-width="1.2"/><circle cx="289" cy="231" r="5" fill="#4f5d75" stroke="#4f5d75" stroke-width="1.2"/><circle cx="109" cy="329" r="5" fill="#4f5d75" stroke="#4f5d75" stroke-width="1.2"/><circle cx="199" cy="329" r="5" fill="#bf4520" stroke="#bf4520" stroke-width="1.2"/><circle cx="289" cy="329" r="5" fill="#4f5d75" stroke="#4f5d75" stroke-width="1.2"/><path d="M 196 242 L 198.4 247.5 L 204 247.5 L 199.6 251.2 L 201 257 L 196 253.4 L 191 257 L 192.4 251.2 L 188 247.5 L 193.6 247.5 Z" fill="#bf4520" stroke="#bf4520" stroke-width="0.8"/><text x="208" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600">query</text><line x1="196" y1="250" x2="201" y2="231" stroke="#bf4520" stroke-width="1.1" marker-end="url(#arr)"/><line x1="196" y1="250" x2="201" y2="329" stroke="#bf4520" stroke-width="1.1" marker-end="url(#arr)"/><text x="199" y="372" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="600" text-anchor="middle">nprobe = 2</text><text x="350" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142" font-weight="600">倒排表</text><rect x="350" y="202" width="112" height="28" rx="4" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="360" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" font-weight="600">L1</text><text x="382" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">3·17·42</text><rect x="350" y="236" width="112" height="28" rx="4" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="360" y="254" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600">L2</text><text x="382" y="254" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">8·21·64</text><rect x="350" y="270" width="112" height="28" rx="4" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="360" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" font-weight="600">L3</text><text x="382" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">5·9</text><rect x="350" y="304" width="112" height="28" rx="4" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="360" y="322" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600">L5</text><text x="382" y="322" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">12·33·71</text><text x="350" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">桶内平均 N/nlist 条</text><text x="64" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#bf4520" font-weight="500">nlist ≈ 4–16·√N；nprobe 从 1 开始按 recall 调。</text><text x="64" y="418.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">漏掉真邻居的桶，后面再准的 rerank 也救不回来；边界向量尤其容易掉。</text><rect x="500" y="112" width="412" height="330" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="516" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2f6f6a" font-weight="500" letter-spacing="0.12em">② PQ / 乘积量化</text><text x="516" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">把残差切成 M 段，每段只留 1 字节</text><text x="516" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">x = [ 0.7, -1.2, 0.3, ... ]</text><rect x="516" y="200" width="84" height="26" rx="4" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="558.0" y="217" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="600" text-anchor="middle">r1</text><rect x="604" y="200" width="84" height="26" rx="4" fill="#e3efed" stroke="#2f6f6a" stroke-width="1"/><text x="646.0" y="217" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f6a" font-weight="600" text-anchor="middle">r2</text><rect x="692" y="200" width="84" height="26" rx="4" fill="#e6ecf3" stroke="#3d5a80" stroke-width="1"/><text x="734.0" y="217" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" font-weight="600" text-anchor="middle">r3</text><rect x="780" y="200" width="84" height="26" rx="4" fill="#f4ecdf" stroke="#a8762f" stroke-width="1"/><text x="822.0" y="217" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#a8762f" font-weight="600" text-anchor="middle">r4</text><text x="516" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">x - c = r，按维度切成 M 段</text><rect x="516" y="258" width="174" height="58" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="526" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142" font-weight="600">每段 256 个 centroid</text><text x="526" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">最近邻 → 1 byte</text><text x="526" y="308" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#5a6580">codebook: 256 × M</text><text x="706" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142" font-weight="600">code</text><rect x="706" y="284" width="188" height="32" rx="5" fill="#eceff2" stroke="#c9ced6" stroke-width="1"/><text x="718" y="305" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#bf4520" font-weight="600">[37, 12, 201, 88]</text><text x="706" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="600">64 B vs 4 KB = 1/64</text><rect x="516" y="344" width="378" height="66" rx="6" fill="#e6ecf3" stroke="#3d5a80" stroke-width="1"/><text x="530" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142" font-weight="600">ADC：查询时先算 q_m 到 256 个 centroid 的距离表</text><text x="530" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">候选距离 = 查 M 次表再相加，不再做 d 维乘加</text><text x="530" y="400" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#3d5a80" font-weight="500">表大小 M×256；每候选 O(M)</text><rect x="48" y="460" width="864" height="94" rx="8" fill="#eceff2" stroke="#c9ced6" stroke-width="1"/><rect x="64" y="476" width="142" height="42" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="135" y="493" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">x</text><text x="135" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580" text-anchor="middle">原始向量</text><line x1="206" y1="497" x2="222" y2="497" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="222" y="476" width="142" height="42" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="293" y="493" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">c</text><text x="293" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580" text-anchor="middle">粗量化 centroid</text><line x1="364" y1="497" x2="380" y2="497" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="380" y="476" width="142" height="42" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="451" y="493" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">r = x-c</text><text x="451" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580" text-anchor="middle">残差</text><line x1="522" y1="497" x2="538" y2="497" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="538" y="476" width="142" height="42" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="609" y="493" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">PQ(r)</text><text x="609" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580" text-anchor="middle">M 字节 code</text><line x1="680" y1="497" x2="696" y2="497" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="696" y="476" width="142" height="42" rx="5" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="767" y="493" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">x̂ = c + r̂</text><text x="767" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580" text-anchor="middle">近似向量</text><text x="64" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#bf4520" font-weight="600">IVF-PQ = 粗量化 + 残差 PQ；压缩只省内存，召回损失要靠全向量 rerank 补。</text><text x="48" y="586" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">经验值：1024 维、M=64 时约 64 B/vector；M 越小越省，但子空间误差更大。</text>
</svg>
