<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">BGE-M3 的三种检索模式与自蒸馏</title>
<desc id="d">一个 XLM-R 编码器输出 dense、sparse 和多向量三种表示，用集成分数做自蒸馏，再用混合分数重排。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">BGE-M3: THREE RETRIEVAL MODES, ONE ENCODER</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">BGE-M3：一个编码器，三种检索头，靠自蒸馏合成一个老师</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">dense 管语义、sparse 管词面、multi-vector 管细粒度交互；三者共享同一套 Transformer</text><rect x="48" y="118" width="150" height="54" rx="7" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="123" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600" text-anchor="middle">query / passage</text><text x="123" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580" text-anchor="middle">最长 8192 tokens</text><line x1="198" y1="145" x2="226" y2="145" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="228" y="118" width="132" height="190" rx="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="294" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600" text-anchor="middle">XLM-RoBERTa</text><text x="294" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580" text-anchor="middle">large · 24 层</text><text x="294" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580" text-anchor="middle">1024 维</text><text x="294" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#bf4520" font-weight="600" text-anchor="middle">H[0..L]</text><text x="294" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580" text-anchor="middle">每个 token 的隐状态</text><text x="294" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2f6f6a" font-weight="500" text-anchor="middle">MCLS：每 256 token</text><text x="294" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2f6f6a" font-weight="500" text-anchor="middle">插一个 [CLS]，平均</text><line x1="360" y1="172" x2="394" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="396" y="140" width="232" height="64" rx="7" fill="#fff" stroke="#bf4520" stroke-width="1"/><text x="410" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">Dense</text><text x="410" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">H[CLS] → L2 → e</text><text x="410" y="195" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" fill="#bf4520" font-weight="500">s_dense = ⟨e_q, e_p⟩</text><line x1="360" y1="263" x2="394" y2="263" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="396" y="224" width="232" height="78" rx="7" fill="#fff" stroke="#2f6f6a" stroke-width="1"/><text x="410" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">Sparse / lexical</text><text x="410" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">W_lex → ReLU → 词权重</text><text x="410" y="279" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" fill="#2f6f6a" font-weight="500">s_lex = Σ w_q(t) · w_p(t)</text><line x1="360" y1="359" x2="394" y2="359" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arr)"/><rect x="396" y="320" width="232" height="78" rx="7" fill="#fff" stroke="#3d5a80" stroke-width="1"/><text x="410" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">Multi-vector</text><text x="410" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">W_mul → L2 → 每 token 向量</text><text x="410" y="375" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.8" fill="#3d5a80" font-weight="500">s_mul = (1/N) Σ_i max_j E_q[i]·E_p[j]</text><rect x="648" y="118" width="264" height="282" rx="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="664" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.08em">HYBRID / 先分别召回，再融合</text><rect x="664" y="158" width="232" height="42" rx="6" fill="#e6ecf3" stroke="#3d5a80" stroke-width="1"/><text x="680" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600">dense top-k</text><text x="680" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">语义召回，覆盖同义改写</text><rect x="664" y="210" width="232" height="42" rx="6" fill="#e3efed" stroke="#2f6f6a" stroke-width="1"/><text x="680" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600">sparse top-k</text><text x="680" y="243" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">词面召回，补专名/编号</text><rect x="664" y="262" width="232" height="50" rx="6" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="680" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600">multi-vector 重排</text><text x="680" y="295" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">ColBERT late interaction；</text><text x="680" y="307" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">存储贵，通常只用于候选重排</text><line x1="780" y1="348" x2="780" y2="362" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arr)"/><text x="780" y="386" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520" font-weight="600" text-anchor="middle">s_rank = s_dense + s_lex + s_mul</text><rect x="48" y="420" width="864" height="108" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="64" y="444" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.12em">SELF-KNOWLEDGE DISTILLATION / 自蒸馏</text><rect x="64" y="456" width="252" height="50" rx="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="80" y="476" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520" font-weight="600">teacher：s_inter = s_dense + s_lex + s_mul</text><text x="80" y="493" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">softmax 后作为三种头的软标签</text><line x1="316" y1="481" x2="352" y2="481" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><text x="360" y="470" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#2d3142" font-weight="500">L&#x27; = -p(s_inter) · log p(s_student)</text><text x="360" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">三种头各自蒸馏，再取平均</text><text x="360" y="508" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520" font-weight="600">L_final = L + L&#x27;</text><text x="672" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142" font-weight="600">解决的是“多目标相互冲突”：</text><text x="672" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">dense 的梯度不必压过 sparse；三者</text><text x="672" y="504" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">互相提供一个更稳的教师信号。</text><text x="48" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#5a6580">短 query → 长 passage 用 BGE v1.5 时仍建议加检索指令；M3 不需要指令。</text><text x="48" y="588" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.3" fill="#5a6580">三种分数不在同一量纲：融合前要归一化/调权重，别直接把原始分数相加就上线。</text>
</svg>
