<title id="t">HNSW 的分层图与搜索过程</title>
<desc id="d">从顶层入口贪心下降，到第 0 层用 efSearch 束宽搜索；右侧给出 M、efConstruction、efSearch 与内存估算。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">HNSW: A MULTI-LAYER NAVIGABLE GRAPH</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">HNSW：上层跳远，下层精搜</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">层数按指数衰减采样；查询从顶层贪心下降，到第 0 层用 efSearch 的束宽做局部搜索</text><rect x="48" y="112" width="596" height="456" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="64" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" font-weight="600">L2</text><line x1="88" y1="154" x2="620" y2="154" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/><text x="64" y="281" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" font-weight="600">L1</text><line x1="88" y1="281" x2="620" y2="281" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/><text x="64" y="436" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" font-weight="600">L0</text><line x1="88" y1="436" x2="620" y2="436" stroke="#c9ced6" stroke-width="0.8" stroke-dasharray="2 4"/><line x1="120" y1="165" x2="220" y2="145" stroke="#c9ced6" stroke-width="1"/><line x1="220" y1="145" x2="315" y2="175" stroke="#c9ced6" stroke-width="1"/><line x1="315" y1="175" x2="410" y2="150" stroke="#c9ced6" stroke-width="1"/><line x1="410" y1="150" x2="510" y2="170" stroke="#c9ced6" stroke-width="1"/><line x1="220" y1="145" x2="410" y2="150" stroke="#c9ced6" stroke-width="1"/><circle cx="120" cy="165" r="7" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="220" cy="145" r="7" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="315" cy="175" r="7" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="410" cy="150" r="7" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="510" cy="170" r="7" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="410" cy="150" r="13" fill="none" stroke="#bf4520" stroke-width="1.6"/><text x="410" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600" text-anchor="middle">entry</text><line x1="100" y1="292" x2="175" y2="265" stroke="#c9ced6" stroke-width="1"/><line x1="175" y1="265" x2="250" y2="300" stroke="#c9ced6" stroke-width="1"/><line x1="250" y1="300" x2="325" y2="272" stroke="#c9ced6" stroke-width="1"/><line x1="325" y1="272" x2="400" y2="302" stroke="#c9ced6" stroke-width="1"/><line x1="400" y1="302" x2="475" y2="270" stroke="#c9ced6" stroke-width="1"/><line x1="475" y1="270" x2="550" y2="295" stroke="#c9ced6" stroke-width="1"/><line x1="175" y1="265" x2="325" y2="272" stroke="#c9ced6" stroke-width="1"/><line x1="325" y1="272" x2="475" y2="270" stroke="#c9ced6" stroke-width="1"/><line x1="250" y1="300" x2="400" y2="302" stroke="#c9ced6" stroke-width="1"/><circle cx="100" cy="292" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="175" cy="265" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="250" cy="300" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="325" cy="272" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="400" cy="302" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="475" cy="270" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="550" cy="295" r="6.5" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><line x1="85" y1="445" x2="140" y2="475" stroke="#c9ced6" stroke-width="1"/><line x1="140" y1="475" x2="200" y2="435" stroke="#c9ced6" stroke-width="1"/><line x1="200" y1="435" x2="260" y2="482" stroke="#c9ced6" stroke-width="1"/><line x1="260" y1="482" x2="320" y2="447" stroke="#c9ced6" stroke-width="1"/><line x1="320" y1="447" x2="380" y2="478" stroke="#c9ced6" stroke-width="1"/><line x1="380" y1="478" x2="440" y2="438" stroke="#c9ced6" stroke-width="1"/><line x1="440" y1="438" x2="500" y2="470" stroke="#c9ced6" stroke-width="1"/><line x1="500" y1="470" x2="555" y2="442" stroke="#c9ced6" stroke-width="1"/><line x1="555" y1="442" x2="605" y2="478" stroke="#c9ced6" stroke-width="1"/><line x1="85" y1="445" x2="200" y2="435" stroke="#c9ced6" stroke-width="1"/><line x1="200" y1="435" x2="320" y2="447" stroke="#c9ced6" stroke-width="1"/><line x1="320" y1="447" x2="440" y2="438" stroke="#c9ced6" stroke-width="1"/><line x1="440" y1="438" x2="555" y2="442" stroke="#c9ced6" stroke-width="1"/><line x1="140" y1="475" x2="260" y2="482" stroke="#c9ced6" stroke-width="1"/><line x1="260" y1="482" x2="380" y2="478" stroke="#c9ced6" stroke-width="1"/><line x1="380" y1="478" x2="500" y2="470" stroke="#c9ced6" stroke-width="1"/><circle cx="85" cy="445" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="140" cy="475" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="200" cy="435" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="260" cy="482" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="320" cy="447" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="380" cy="478" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="440" cy="438" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="500" cy="470" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="555" cy="442" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="605" cy="478" r="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><line x1="410" y1="150" x2="315" y2="175" stroke="#bf4520" stroke-width="2.2"/><line x1="315" y1="175" x2="325" y2="272" stroke="#bf4520" stroke-width="2.2"/><line x1="325" y1="272" x2="320" y2="447" stroke="#bf4520" stroke-width="2.2"/><line x1="320" y1="447" x2="260" y2="482" stroke="#bf4520" stroke-width="2.2"/><line x1="260" y1="482" x2="380" y2="478" stroke="#bf4520" stroke-width="2.2"/><circle cx="410" cy="150" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><circle cx="315" cy="175" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><circle cx="325" cy="272" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><circle cx="320" cy="447" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><circle cx="260" cy="482" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><circle cx="380" cy="478" r="7" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.8"/><ellipse cx="315" cy="463" rx="96" ry="44" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 4"/><text x="315" y="520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600" text-anchor="middle">efSearch 束宽</text><path d="M 300 539 L 302.7 545.2 L 309 545.2 L 304 549.3 L 305.6 555.8 L 300 551.8 L 294.4 555.8 L 296 549.3 L 291 545.2 L 297.3 545.2 Z" fill="#bf4520" stroke="#bf4520" stroke-width="0.8"/><text x="312" y="544" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="600">query</text><line x1="300" y1="538" x2="318" y2="455" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="660" y="112" width="252" height="456" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="676" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142" font-weight="500" letter-spacing="0.1em">PARAMS / 三个旋钮</text><text x="676" y="156" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520" font-weight="600">M</text><text x="676" y="169.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">每层最多 M 条边；L0 为 2M。12–48 常用，高维 48–64。</text><text x="676" y="218" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520" font-weight="600">efConstruction</text><text x="676" y="231.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">建图束宽。用 ef=efConstruction 测 recall，&lt;0.9 继续加。</text><text x="676" y="280" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520" font-weight="600">efSearch</text><text x="676" y="293.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">查询束宽，必须 ≥ k。越大越准越慢。</text><line x1="676" y1="340" x2="896" y2="340" stroke="#c9ced6" stroke-width="0.8"/><text x="676" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142" font-weight="500">level = floor(-ln(U) / ln(M))</text><text x="676" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142" font-weight="500">memory ≈ 4d + 8M + 4 B/vec</text><text x="676" y="400" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520" font-weight="600">d=1024, M=16 → ≈4.2 KB/vector</text><text x="676" y="416" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#5a6580">1M 向量 ≈ 4.3 GB（不含副本）</text><text x="676" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142" font-weight="600">删除：Faiss HNSW 不支持；</text><text x="676" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">hnswlib 可 mark_deleted，但只是</text><text x="676" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">墓碑；频繁删改要重建。</text><text x="676" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520" font-weight="600">O(log N) 的前提是图可导航。</text><text x="676" y="526" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">M/ef 太小，图会断，recall 先崩。</text><text x="48" y="594" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#5a6580">贪心下降只保证“每层局部最近”；真正决定召回的是第 0 层的束搜索和图的连通性。</text>
</svg>
