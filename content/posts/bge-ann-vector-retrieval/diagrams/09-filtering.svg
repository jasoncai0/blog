<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">带过滤向量检索的三种策略</title>
<desc id="d">post-filter、pre-filter 与 filtered graph 的成本和失败方式，以及多租户隔离建议。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">FILTERED SEARCH: THREE STRATEGIES</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">带过滤的向量检索：三种做法，三种失败方式</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">过滤条件不是“加个 where”那么简单；命中率一变，post-filter 和 pre-filter 的成本会反转</text><rect x="48" y="112" width="272" height="330" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="64" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.3" fill="#bf4520" font-weight="500" letter-spacing="0.1em">POST-FILTER</text><text x="64" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" fill="#2d3142" font-weight="600">先召回，再过滤</text><rect x="344" y="112" width="272" height="330" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="360" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.3" fill="#2f6f6a" font-weight="500" letter-spacing="0.1em">PRE-FILTER</text><text x="360" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" fill="#2d3142" font-weight="600">先过滤，再精确扫</text><rect x="640" y="112" width="272" height="330" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/><text x="656" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.3" fill="#3d5a80" font-weight="500" letter-spacing="0.1em">FILTERED GRAPH</text><text x="656" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.2" fill="#2d3142" font-weight="600">在图上带条件走</text><circle cx="64" cy="196" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="64" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="109" cy="196" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="109" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="154" cy="196" r="9" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.2"/><text x="154" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#bf4520" font-weight="600" text-anchor="middle">✓</text><circle cx="199" cy="196" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="199" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="244" cy="196" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="244" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="64" cy="230" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="64" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="109" cy="230" r="9" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.2"/><text x="109" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#bf4520" font-weight="600" text-anchor="middle">✓</text><circle cx="154" cy="230" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="154" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><circle cx="199" cy="230" r="9" fill="#f7e6e1" stroke="#bf4520" stroke-width="1.2"/><text x="199" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#bf4520" font-weight="600" text-anchor="middle">✓</text><circle cx="244" cy="230" r="9" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><text x="244" y="233" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580" font-weight="600" text-anchor="middle">×</text><text x="64" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">ANN top-100（未过滤）</text><line x1="150" y1="290" x2="150" y2="310" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="64" y="318" width="240" height="38" rx="5" fill="#fff" stroke="#bf4520" stroke-width="1"/><text x="80" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#bf4520" font-weight="600">过滤后只剩 3 条</text><text x="80" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">可能不足 k，或要召回 100/3%</text><text x="64" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">命中率高时简单有效；命中率 1% 时，要凑够 10 条得先召回约 1000 条</text><text x="64" y="393" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">，延迟和内存都放大。</text><rect x="360" y="190" width="240" height="40" rx="5" fill="#e3efed" stroke="#2f6f6a" stroke-width="1"/><text x="376" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142" font-weight="600">满足条件的 ID 集合</text><text x="376" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">1% → 1 万 / 100 万</text><line x1="480" y1="230" x2="480" y2="250" stroke="#2f6f6a" stroke-width="1.2" marker-end="url(#arr)"/><rect x="360" y="252" width="240" height="40" rx="5" fill="#fff" stroke="#2f6f6a" stroke-width="1"/><text x="376" y="269" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142" font-weight="600">精确扫描这些 ID</text><text x="376" y="283" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">距离计算次数 ∝ 命中数</text><text x="360" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2f6f6a" font-weight="600">1% 命中</text><rect x="360" y="326" width="24" height="12" rx="2" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="0"/><text x="392" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#5a6580">很便宜</text><text x="360" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520" font-weight="600">80% 命中</text><rect x="360" y="364" width="216" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="0"/><text x="360" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520" font-weight="600">接近全表扫描</text><text x="360" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">适合高选择性谓词（命中少）。宽过滤会退化成暴力扫描，QPS 直</text><text x="360" y="421" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">接崩。</text><line x1="690" y1="210" x2="740" y2="190" stroke="#c9ced6" stroke-width="1"/><line x1="740" y1="190" x2="790" y2="220" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="790" y1="220" x2="850" y2="195" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="850" y1="195" x2="880" y2="245" stroke="#c9ced6" stroke-width="1"/><line x1="740" y1="190" x2="740" y2="260" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="740" y1="260" x2="800" y2="275" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="800" y1="275" x2="855" y2="300" stroke="#c9ced6" stroke-width="1"/><line x1="790" y1="220" x2="800" y2="275" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="690" y1="210" x2="700" y2="300" stroke="#c9ced6" stroke-width="1"/><line x1="700" y1="300" x2="740" y2="260" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><circle cx="690" cy="210" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="740" cy="190" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="790" cy="220" r="8" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><circle cx="850" cy="195" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="880" cy="245" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="740" cy="260" r="8" fill="#eceff2" stroke="#c9ced6" stroke-width="1.2"/><circle cx="800" cy="275" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="855" cy="300" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><circle cx="700" cy="300" r="8" fill="#fff" stroke="#2d3142" stroke-width="1.2"/><text x="790" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#5a6580" text-anchor="middle">blocked</text><circle cx="690" cy="210" r="12" fill="none" stroke="#bf4520" stroke-width="1.5"/><text x="690" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#bf4520" font-weight="600" text-anchor="middle">start</text><line x1="690" y1="210" x2="700" y2="300" stroke="#bf4520" stroke-width="2.2"/><line x1="700" y1="300" x2="740" y2="260" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="4 3"/><text x="740" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#bf4520" font-weight="700" text-anchor="middle">×</text><text x="760" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.3" fill="#bf4520" font-weight="600">路径被 blocked 节点切断</text><text x="656" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">ACORN 用 predicate subgraph traversal 保住连通性；实现复杂，但</text><text x="656" y="393" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">低命中率下比 post-filter 稳。</text><rect x="48" y="460" width="864" height="88" rx="8" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="64" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" font-weight="600">多租户：一个租户一个 partition / collection，不要把 tenant_id 当普通 filter 塞进一个巨型索引。</text><text x="64" y="504" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">删除、配额、故障隔离、召回率都会因为“共享一个大索引”而互相牵连。</text><text x="64" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">上线前用真实过滤条件测 recall@k；无过滤 benchmark 的 recall 不能代表线上。</text><text x="48" y="582" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#5a6580">三种策略不是互斥的：按命中率选择，必要时 over-fetch + 精确 fallback。</text>
</svg>
