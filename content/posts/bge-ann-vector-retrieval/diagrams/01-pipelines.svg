<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">离线建库与在线检索两条流水线</title>
<desc id="d">文档离线编码建索引，query 在线编码召回再重排；embedding 与索引共同决定召回上限。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">TWO PIPELINES, ONE CEILING</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">离线建库与在线检索：召回上限在索引之前就决定了</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">BGE 决定“像不像”，ANN 决定“找不找得到”；rerank 只能重排已经召回的候选</text><text x="48" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.12em">OFFLINE / 建库</text><text x="510" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#3d5a80" font-weight="500" letter-spacing="0.12em">ONLINE / 查询</text><line x1="480" y1="112" x2="480" y2="500" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><text x="480" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">同一向量空间</text><rect x="48" y="140" width="390" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="140" width="3" height="50" rx="1.5" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="64" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">原始文档</text><text x="64" y="177" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">PDF · HTML · Markdown · 工单 / 表格</text><line x1="243" y1="190" x2="243" y2="208" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="48" y="210" width="390" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="210" width="3" height="50" rx="1.5" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="64" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">解析、清洗、按结构切块</text><text x="64" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">标题、表格、代码不切断；256–512 tokens</text><line x1="243" y1="260" x2="243" y2="278" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="48" y="280" width="390" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="280" width="3" height="50" rx="1.5" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="64" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">BGE 编码：CLS → L2 归一化</text><text x="64" y="317" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">max_length=512；文档不加检索指令</text><line x1="243" y1="330" x2="243" y2="348" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="48" y="350" width="390" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="350" width="3" height="50" rx="1.5" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="64" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">向量 + 文本 + 元数据</text><text x="64" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">doc_id · ACL · 版本 · 内容哈希</text><line x1="243" y1="400" x2="243" y2="418" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr)"/><rect x="48" y="420" width="390" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="420" width="3" height="50" rx="1.5" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="64" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">建索引：HNSW / IVF-PQ / Flat</text><text x="64" y="457" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">先定召回目标，再谈参数和压缩</text><rect x="510" y="140" width="402" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="510" y="140" width="3" height="50" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="526" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">用户 query</text><text x="526" y="177" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">短查询、口语、指代、多语言</text><line x1="711" y1="190" x2="711" y2="208" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="510" y="210" width="402" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="510" y="210" width="3" height="50" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="526" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">改写 / 扩展 / 检索指令</text><text x="526" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">同义词、时间、权限、租户</text><line x1="711" y1="260" x2="711" y2="278" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="510" y="280" width="402" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="510" y="280" width="3" height="50" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="526" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">BGE query 编码</text><text x="526" y="317" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">必须与建库同一模型、同一版本</text><line x1="711" y1="330" x2="711" y2="348" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="510" y="350" width="402" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="510" y="350" width="3" height="50" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="526" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">ANN 召回 top-k（可带过滤）</text><text x="526" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">过滤放在召回前还是召回后，结果差很多</text><line x1="711" y1="400" x2="711" y2="418" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#arr)"/><rect x="510" y="420" width="402" height="50" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><rect x="510" y="420" width="3" height="50" rx="1.5" fill="#3d5a80" stroke="#3d5a80" stroke-width="1"/><text x="526" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#2d3142" font-weight="600">rerank → 上下文 → LLM</text><text x="526" y="457" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">cross-encoder 重排 20–50 条，取 5–10</text><rect x="48" y="516" width="864" height="62" rx="8" fill="#f7e6e1" stroke="#bf4520" stroke-width="1"/><text x="64" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#bf4520" font-weight="600">召回上限 = embedding 的语义覆盖 × 索引的 recall@k</text><text x="64" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">rerank 只能把已经召回的文档排得更好；没召回的文档，后面所有环节都看不到。</text><text x="48" y="598" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#5a6580">离线可以慢、可以批、可以全量重建；在线要快、要稳、要能降级。两条流水线的约束完全不同。</text>
</svg>
