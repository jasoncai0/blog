<path d="M 600 405 Q 545 432 492 415" fill="none" stroke="#5b4b8a" stroke-width="1.0"/>
<circle cx="470" cy="176" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<circle cx="370" cy="186" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<circle cx="520" cy="292" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<circle cx="420" cy="284" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<circle cx="560" cy="405" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<circle cx="490" cy="414" r="8" fill="none" stroke="#5b4b8a" stroke-width="1.1"/>
<text x="690" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">①</text>
<text x="706" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">采样层数</text>
<text x="706" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">level = ⌊-ln U / ln M⌋</text>
<text x="706" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">多数节点只到 L0，少数才进高层。</text>
<text x="690" y="224" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">②</text>
<text x="706" y="224" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">逐层下降</text>
<text x="706" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">从入口点开始，每层贪心走到</text>
<text x="706" y="255" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">离新向量最近的节点，再下一层。</text>
<text x="690" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">③</text>
<text x="706" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">选邻居</text>
<text x="706" y="337" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">每层用 efConstruction 个候选，</text>
<text x="706" y="351" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">取最近的 M 个，双向连边。</text>
<text x="690" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">④</text>
<text x="706" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">超限剪枝</text>
<text x="706" y="433" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">邻居边数超过上限（L0 为 2M）</text>
<text x="706" y="447" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">时，保留最近的，其余删掉。</text>
<text x="40" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">插入只改新节点的邻接表和它邻居的邻接表；已有节点的位置从不移动，所以 HNSW 是“追加 + 连边”。</text>
<text x="40" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">M 越大图越密，召回越高，内存和建图时间也越大；M 太小，图会断，recall 先崩。</text>
</svg>