<text x="600" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#5b4b8a" text-anchor="middle">新节点</text>
<circle cx="600" cy="180" r="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.8"/>
<circle cx="600" cy="290" r="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.8"/>
