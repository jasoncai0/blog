<line x1="600" y1="300" x2="600" y2="395" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-purple)"/>
<text x="590" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5b4b8a" text-anchor="end">逐层下降</text>
<text x="590" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5b4b8a" text-anchor="end">每层都连</text>
<path d="M 600 180 Q 545 158 472 175" fill="none" stroke="#5b4b8a" stroke-width="1.0"/>
<path d="M 600 180 Q 500 205 372 188" fill="none" stroke="#5b4b8a" stroke-width="1.0"/>
<path d="M 600 290 Q 560 270 522 291" fill="none" stroke="#5b4b8a" stroke-width="1.0"/>
