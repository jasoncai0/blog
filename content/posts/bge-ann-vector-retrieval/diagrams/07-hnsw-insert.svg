<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" letter-spacing="0.14em">HNSW / INSERT</text><text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">建图：一条新向量怎么进 HNSW</text><text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">先按指数分布采样层数，再从入口逐层贪心下降，在每层挑 M 个最近邻并双向连边</text>

