<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="1440" height="760" fill="#ffffff"/><text x="720.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">一条研发回路的五个环节，以及每段的通过率</text><path d="M869.0 175.3 A340 250 0 0 1 964.6 226.3" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#m)" stroke-linejoin="round"/><path d="M1056.7 434.8 A340 250 0 0 1 1020.2 517.4" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#m)" stroke-linejoin="round"/><path d="M779.0 646.2 A340 250 0 0 1 661.0 646.2" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#m)" stroke-linejoin="round"/><path d="M419.8 517.4 A340 250 0 0 1 383.3 434.8" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#m)" stroke-linejoin="round"/><path d="M475.4 226.3 A340 250 0 0 1 571.0 175.3" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#m)" stroke-linejoin="round"/><rect x="590.0" y="98.0" width="260" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="132.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">① 选题 / 假设</text><text x="720.0" y="156.0" font-size="12.5" text-anchor="middle" fill="#475569">p₁ · 品味与方向</text><text x="720.0" y="178.0" font-size="11" text-anchor="middle" fill="#64748b">读文献、找缺口、定可做的题</text><rect x="913.3592155403521" y="270.74575140626314" width="260" height="104" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="1043.3592155403521" y="304.74575140626314" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">② 实现</text><text x="1043.3592155403521" y="328.74575140626314" font-size="12.5" text-anchor="middle" fill="#475569">p₂ · 当前最强</text><text x="1043.3592155403521" y="350.74575140626314" font-size="11" text-anchor="middle" fill="#64748b">改代码、跑实验、做分析</text><rect x="789.8469857794408" y="550.2542485937369" width="260" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="919.8469857794408" y="584.2542485937369" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">③ 评估</text><text x="919.8469857794408" y="608.2542485937369" font-size="12.5" text-anchor="middle" fill="#475569">p₃ · 最窄的一段</text><text x="919.8469857794408" y="630.2542485937369" font-size="11" text-anchor="middle" fill="#64748b">判断改动是否真的更好</text><rect x="390.15301422055916" y="550.2542485937369" width="260" height="104" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="520.1530142205592" y="584.2542485937369" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">④ 归因 / 选择</text><text x="520.1530142205592" y="608.2542485937369" font-size="12.5" text-anchor="middle" fill="#475569">p₄ · 哪个改动有用</text><text x="520.1530142205592" y="630.2542485937369" font-size="11" text-anchor="middle" fill="#64748b">从噪声里分离因果</text><rect x="266.64078445964776" y="270.7457514062632" width="260" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="396.64078445964776" y="304.7457514062632" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">⑤ 部署 / 下一代</text><text x="396.64078445964776" y="328.7457514062632" font-size="12.5" text-anchor="middle" fill="#475569">p₅ · 工程与算力</text><text x="396.64078445964776" y="350.7457514062632" font-size="11" text-anchor="middle" fill="#64748b">上线、训练、形成新基线</text><text x="720" y="380" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">P = p₁ · p₂ · p₃ · p₄ · p₅</text><text x="720" y="408" font-size="13" text-anchor="middle" fill="#475569">五段通过率相乘，决定一圈能留下多少</text><text x="720" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">任何一段 ≈ 0，整圈 ≈ 0</text><text x="720.0" y="722" font-size="13" text-anchor="middle" fill="#475569">pᵢ 是各段「产出可信到可以进入下一代」的比例，此处只作结构示意，不是实测概率。真实系统有并行与反馈，但长期速率仍由乘积决定。</text></svg>
