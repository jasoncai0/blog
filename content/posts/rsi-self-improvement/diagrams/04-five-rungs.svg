<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="1440" height="800" fill="#ffffff"/><text x="720.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">五级阶梯：2026 年 11 月的证据停在哪一级</text><circle cx="64" cy="130" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="64" y="137" font-size="22" font-weight="bold" text-anchor="middle" fill="#dc2626">5</text><text x="110" y="126" font-size="18" font-weight="bold" text-anchor="start" fill="#0f172a">持续失控：人类出局</text><text x="110" y="152" font-size="12.5" text-anchor="start" fill="#475569">没有任何实验室或研究者声称达到。所有公开日期都在「全自动」之前。</text><rect x="1150" y="112" width="240" height="34" rx="17" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="1270" y="134" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">无人声称</text><line x1="40" y1="196" x2="1400" y2="196" stroke="#e2e8f0" stroke-width="1"/><circle cx="64" cy="256" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="64" y="263" font-size="22" font-weight="bold" text-anchor="middle" fill="#dc2626">4</text><text x="110" y="252" font-size="18" font-weight="bold" text-anchor="start" fill="#0f172a">闭环：AI 的产出缩短下一代周期</text><text x="110" y="278" font-size="12.5" text-anchor="start" fill="#475569">无实验室声称。Opus 5.5 双阈值测试两臂均未过：CoBench 2.1 为 55.8%，门槛 85%。</text><rect x="1150" y="238" width="240" height="34" rx="17" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="1270" y="260" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">未证明</text><line x1="40" y1="322" x2="1400" y2="322" stroke="#e2e8f0" stroke-width="1"/><circle cx="64" cy="382" r="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="64" y="389" font-size="22" font-weight="bold" text-anchor="middle" fill="#ca8a04">3</text><text x="110" y="378" font-size="18" font-weight="bold" text-anchor="start" fill="#0f172a">有真实增益的自主研究</text><text x="110" y="404" font-size="12.5" text-anchor="start" fill="#475569">只在存在精确 checker 的领域成立；Princeton 影子评测里工程全过、研究失败。</text><rect x="1150" y="364" width="240" height="34" rx="17" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="1270" y="386" font-size="14" font-weight="bold" text-anchor="middle" fill="#ca8a04">部分验证</text><line x1="40" y1="448" x2="1400" y2="448" stroke="#e2e8f0" stroke-width="1"/><circle cx="64" cy="508" r="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="64" y="515" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d9488">2</text><text x="110" y="504" font-size="18" font-weight="bold" text-anchor="start" fill="#0f172a">数小时自主工程</text><text x="110" y="530" font-size="12.5" text-anchor="start" fill="#475569">1–16 小时任务 @50% 可靠性；80% 可靠性只剩约十分之一；&gt;16 小时仪器不可靠。</text><rect x="1150" y="490" width="240" height="34" rx="17" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="1270" y="512" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d9488">已验证</text><line x1="40" y1="574" x2="1400" y2="574" stroke="#e2e8f0" stroke-width="1"/><circle cx="64" cy="634" r="24" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="64" y="641" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d9488">1</text><text x="110" y="630" font-size="18" font-weight="bold" text-anchor="start" fill="#0f172a">AI 辅助写代码</text><text x="110" y="656" font-size="12.5" text-anchor="start" fill="#475569">Anthropic 超过 80% 的 merged code 由 Claude 写；但 LOC 高估产出，随机试验里资深开发者反而慢 19%。</text><rect x="1150" y="616" width="240" height="34" rx="17" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="1270" y="638" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d9488">已验证</text><line x1="30" y1="336" x2="1410" y2="336" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="360" y="342" width="720" height="22" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="720" y="358" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#dc2626">证据水位：第 1–2 级已跨过；第 3 级只有窄口（部分验证）；第 4 级及以上为空</text><text x="720.0" y="760" font-size="13" text-anchor="middle" fill="#475569">每一级需要独立证据：第 1 级成立不等于第 2 级成立，第 3 级成立也不等于闭环。分级框架见 Joi Ito 的 RSI 报告；数字口径见正文。</text></svg>
