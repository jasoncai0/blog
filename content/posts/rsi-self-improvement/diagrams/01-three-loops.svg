一代</text><text x="1301.0" y="538" font-size="11.5" text-anchor="middle" fill="#475569">自动部署，人监督</text><path d="M1301.0 556 L1301.0 608 L317.0 608 L317.0 558" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m)" stroke-dasharray="6 4" stroke-linejoin="round"/><rect x="520" y="588" width="400" height="22" rx="4" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/><text x="720" y="603" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d9488">闭合点：环境（独立于模型的信号）</text><text x="720.0" y="648" font-size="13" text-anchor="middle" fill="#475569">箭头方向＝信息流。三者都能产出改进，区别在于「谁判断改进真的有效」：人、同族模型，还是独立环境。</text></svg>
