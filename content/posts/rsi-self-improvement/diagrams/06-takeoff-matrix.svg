<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="1440" height="780" fill="#ffffff"/><text x="720.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">β 与代际时间：六个格子里只有一个是「起飞」</text><text x="400" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">代际时间 T 长（≈12 个月）</text><text x="1020" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">代际时间 T 短（≈3 个月）</text><text x="62" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a" transform="rotate(-90 62 202)">β &lt; 1（边际递减）</text><rect x="110" y="112" width="600" height="180" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="140" y="158" font-size="19" font-weight="bold" text-anchor="start" fill="#0d9488">缓慢工具化</text><text x="140" y="196" font-size="13" text-anchor="start" fill="#475569">每代仍有改进，但越来越慢；log 曲线下弯。</text><text x="140" y="264" font-size="11.5" text-anchor="start" fill="#64748b">现状：传统软件工程的常态</text><rect x="730" y="112" width="600" height="180" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="760" y="158" font-size="19" font-weight="bold" text-anchor="start" fill="#0d9488">快速工具化</text><text x="760" y="196" font-size="13" text-anchor="start" fill="#475569">迭代快，仍会饱和；像更好的编译器，而不是新物种。</text><text x="760" y="264" font-size="11.5" text-anchor="start" fill="#64748b">现状：多数「AI 提效」叙事停在这里</text><text x="62" y="412" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a" transform="rotate(-90 62 412)">β = 1（固定比例）</text><rect x="110" y="322" width="600" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="140" y="368" font-size="19" font-weight="bold" text-anchor="start" fill="#2563eb">稳定指数（慢）</text><text x="140" y="406" font-size="13" text-anchor="start" fill="#475569">每代固定比例增益；翻倍时间 = T·ln2/k。</text><text x="140" y="474" font-size="11.5" text-anchor="start" fill="#64748b">现状：2023–2025 的主流解释</text><rect x="730" y="322" width="600" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="760" y="368" font-size="19" font-weight="bold" text-anchor="start" fill="#2563eb">稳定指数（快）</text><text x="760" y="406" font-size="13" text-anchor="start" fill="#475569">T 减半 ≈ 速度翻倍；可解释 2026 的 ~2×，</text><text x="760" y="430" font-size="13" text-anchor="start" fill="#475569">无需闭环。</text><text x="760" y="474" font-size="11.5" text-anchor="start" fill="#64748b">现状：与 METR 的 2026 观测相容</text><text x="62" y="622" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a" transform="rotate(-90 62 622)">β &gt; 1（自我放大）</text><rect x="110" y="532" width="600" height="180" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="140" y="578" font-size="19" font-weight="bold" text-anchor="start" fill="#ea580c">晚一点爆炸</text><text x="140" y="616" font-size="13" text-anchor="start" fill="#475569">增长在加速，但 t* = 1/(k(β−1)) </text><text x="140" y="640" font-size="13" text-anchor="start" fill="#475569">被拉长。</text><text x="140" y="684" font-size="11.5" text-anchor="start" fill="#64748b">现状：无直接证据，只有理论可能</text><rect x="730" y="532" width="600" height="180" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><text x="760" y="578" font-size="19" font-weight="bold" text-anchor="start" fill="#dc2626">起飞</text><text x="760" y="616" font-size="13" text-anchor="start" fill="#475569">有限时间奇点；这才是 RSI 叙事里的那一格。</text><text x="760" y="684" font-size="11.5" text-anchor="start" fill="#64748b">现状：无证据，是安全讨论的假设</text><text x="720.0" y="750" font-size="13" text-anchor="middle" fill="#475569">横轴是「多久出一代」，纵轴是「这一代的改进有多少能用于下一代」。β 与 T 都不可直接观测，只能通过代际时间与归因分解间接推断。</text></svg>
