ext x="1032" y="552" font-size="12" text-anchor="start" fill="#475569">只有 35%：连「正确答案」都不稳。</text><text x="720.0" y="690" font-size="13" text-anchor="middle" fill="#475569">曲线为结构示意，不是拟合：橙色按 METR 历史翻倍率外推，青色是「可被独立验证」的带宽。2026 年观测到的约 2 倍加速，主要来自橙线变陡。</text></svg>
