<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f03-d3-title f03-d3-desc">
  <title id="f03-d3-title">一次 turn 的包级时序</title>
  <desc id="f03-d3-desc">从 UI 调用 followup 开始，经过 inbox 投递、turn 开始、pre-step 准入、请求组装、流式响应、工具执行，到 step 与 turn 关闭。持久写入只发生在边界事件上，中间的消息数组是临时派生的。</desc>
  <defs>
    <marker id="f03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f03-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
    <marker id="f03-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ONE TURN / PACKAGE-LANE SEQUENCE</text>
  <text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一次 turn 经过了谁：从 followup 到 turn/end</text>
  <text x="40" y="76" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">实线是进程内调用，虚线是事件广播；橙色是持久写入。注意第 10 步：历史是读出来的，不是攒出来的。</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7">
    <rect x="30" y="96" width="130" height="34" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="95" y="117" text-anchor="middle" font-size="8" fill="#2d3142">UI / SDK</text>
    <rect x="185" y="96" width="130" height="34" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="250" y="117" text-anchor="middle" font-size="8" fill="#2d3142">Agent</text>
    <rect x="340" y="96" width="130" height="34" rx="5" fill="#ffffff" stroke="#bf4520"/>
    <text x="405" y="117" text-anchor="middle" font-size="8" fill="#2d3142">AgentLoop</text>
    <rect x="495" y="96" width="130" height="34" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="560" y="117" text-anchor="middle" font-size="8" fill="#2d3142">Prompt + Tools</text>
    <rect x="650" y="96" width="130" height="34" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="715" y="117" text-anchor="middle" font-size="8" fill="#2d3142">LLM adapter</text>
    <rect x="805" y="96" width="130" height="34" rx="5" fill="#2d3142" stroke="#2d3142"/>
    <text x="870" y="117" text-anchor="middle" font-size="8" fill="#ffffff">Session</text>
  </g>

  <g stroke="#c9ced8" stroke-width="1" stroke-dasharray="3 3">
    <path d="M95,130 L95,596"/>
    <path d="M250,130 L250,596"/>
    <path d="M405,130 L405,596"/>
    <path d="M560,130 L560,596"/>
    <path d="M715,130 L715,596"/>
    <path d="M870,130 L870,596"/>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">
    <!-- 1 -->
    <text x="172" y="164" text-anchor="middle">followup(msg)</text>
    <path d="M95,170 L246,170" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 2 -->
    <text x="560" y="190" text-anchor="middle">agent/inbox/spliced</text>
    <path d="M250,196 L866,196" stroke="#7a5aa8" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#f03-as)"/>
    <!-- 3 -->
    <text x="327" y="216" text-anchor="middle">wake()</text>
    <path d="M250,222 L401,222" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 4 -->
    <text x="637" y="242" text-anchor="middle">turn/start</text>
    <path d="M405,248 L866,248" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
    <!-- 5 -->
    <text x="482" y="268" text-anchor="middle">tools.resolve()</text>
    <path d="M405,274 L556,274" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 6 -->
    <text x="482" y="294" text-anchor="middle">assemble / pre-step</text>
    <path d="M405,300 L556,300" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 7 -->
    <text x="637" y="320" text-anchor="middle">step/start</text>
    <path d="M405,326 L866,326" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
    <!-- 8 -->
    <text x="482" y="346" text-anchor="middle">request → prepareCall</text>
    <path d="M405,352 L556,352" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 9 -->
    <text x="637" y="372" text-anchor="middle">header · context</text>
    <path d="M405,378 L866,378" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
    <!-- 10 -->
    <text x="637" y="398" text-anchor="middle">deriveMessages()</text>
    <path d="M866,404 L409,404" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 11 -->
    <text x="560" y="424" text-anchor="middle">stream(request)</text>
    <path d="M405,430 L711,430" stroke="#8a93a6" stroke-width="1.2" fill="none" marker-end="url(#f03-a)"/>
    <!-- 12 -->
    <text x="560" y="450" text-anchor="middle">chunk · chunk · end</text>
    <path d="M715,456 L409,456" stroke="#7a5aa8" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#f03-as)"/>
    <!-- 13 -->
    <text x="637" y="476" text-anchor="middle">assistant/message</text>
    <path d="M405,482 L866,482" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
    <!-- 14 -->
    <text x="482" y="500" text-anchor="middle">tools.execute()</text>
    <path d="M405,506 L556,506" stroke="#8a93a6" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
    <!-- 15 -->
    <text x="715" y="524" text-anchor="middle">tool/call · tool/result</text>
    <path d="M560,530 L866,530" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
    <!-- 16 -->
    <text x="637" y="550" text-anchor="middle">step/end · turn/end</text>
    <path d="M405,556 L866,556" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f03-ao)"/>
  </g>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">
    <text x="40" y="586">准入：claim 一条消息，pre-step 决定 enter / reject</text>
    <text x="330" y="586">组装：每次重新派生历史与工具 schema</text>
    <text x="640" y="586">流式 → 工具 → 下一个 step</text>
  </g>

  <text x="40" y="618" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">灰色：进程内调用 / 紫色：实时事件 / 橙色：写入日志（恢复时唯一可用的证据）</text>
</svg>
