<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="memlife-title memlife-desc">
  <title id="memlife-title">Jade 记忆的准入、召回与汰换</title>
  <desc id="memlife-desc">写入只在 run 成功时发生，候选只来自最后一条用户消息，经关键词、敏感信息、长度过滤后交给 Mem0。召回按项目、分数和全局上限过滤。当前没有自动过期，只有手动删除；虚线框是建议的 TTL、supersede 和过期状态。</desc>
  <defs>
    <marker id="ml-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="ml-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="ml-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7f5a"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">JADE / MEMORY LIFECYCLE</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">记忆准入与退出：先克制写入，再明确失效</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">当前实现是“成功 run + 用户明确偏好/项目事实”；没有 TTL、没有自动淘汰</text>

  <!-- write panel -->
  <rect x="40" y="108" width="880" height="238" rx="3" fill="#fbfbfa" stroke="#d8ddd4" stroke-dasharray="4 3"/>
  <text x="60" y="134" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">WRITE · SUCCESS ONLY</text>
  <text x="60" y="153" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#6b7280">不是每轮对话都总结；失败、工具输出、代码 diff 不进入候选</text>

  <rect x="60" y="178" width="124" height="70" rx="3" fill="#ffffff" stroke="#c9d2c6"/>
  <text x="72" y="199" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">run 成功</text>
  <text x="72" y="216" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">verified + goal review</text>
  <text x="72" y="230" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">通过</text>

  <rect x="210" y="178" width="146" height="70" rx="3" fill="#ffffff" stroke="#c9d2c6"/>
  <text x="222" y="199" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">最后一条用户消息</text>
  <text x="222" y="216" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">只看这一条；不读</text>
  <text x="222" y="230" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">assistant/tool 结论</text>

  <rect x="382" y="178" width="194" height="70" rx="3" fill="#fffdf9" stroke="#e3b9a8"/>
  <text x="394" y="199" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">MemoryPolicy 过滤</text>
  <text x="394" y="216" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">≥8 字 · 非敏感 · 关键词</text>
  <text x="394" y="230" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">≤1200 字 · 仅项目/显式全局</text>

  <rect x="602" y="178" width="144" height="70" rx="3" fill="#f3f8ef" stroke="#a9c39f"/>
  <text x="614" y="199" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">Mem0 add</text>
  <text x="614" y="216" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">POST /memories</text>
  <text x="614" y="230" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">infer=true · 异步</text>

  <rect x="772" y="178" width="126" height="70" rx="3" fill="#ffffff" stroke="#c9d2c6"/>
  <text x="784" y="199" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">Qdrant 384d</text>
  <text x="784" y="216" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">Mem0 抽取/去重</text>
  <text x="784" y="230" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">BGE-small</text>

  <line x1="184" y1="213" x2="208" y2="213" stroke="#8a93a6" stroke-width="1" marker-end="url(#ml-a)"/>
  <line x1="356" y1="213" x2="380" y2="213" stroke="#8a93a6" stroke-width="1" marker-end="url(#ml-a)"/>
  <line x1="576" y1="213" x2="600" y2="213" stroke="#8a93a6" stroke-width="1" marker-end="url(#ml-a)"/>
  <line x1="746" y1="213" x2="770" y2="213" stroke="#5b7f5a" stroke-width="1" marker-end="url(#ml-g)"/>

  <rect x="210" y="274" width="366" height="48" rx="3" fill="#fdf4f1" stroke="#e8c7bb"/>
  <text x="222" y="293" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#9a3f24">不进入：普通提问 · “继续” · 工具日志 · 代码 diff · 失败轨迹 · 密钥</text>
  <text x="222" y="309" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">关键词只认“以后/默认/这个项目/决策”等明确信号</text>

  <rect x="602" y="274" width="298" height="48" rx="3" fill="#f3f8ef" stroke="#bad2b2"/>
  <text x="614" y="293" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#42643e">入库：preference / project_fact · 带 project_id/source/run_id</text>
  <text x="614" y="309" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">全局偏好必须由用户明确说“所有项目/全局”</text>

  <!-- recall panel -->
  <rect x="40" y="365" width="470" height="222" rx="3" fill="#ffffff" stroke="#d8ddd4"/>
  <text x="58" y="390" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">RECALL · CONTEXT</text>
  <text x="58" y="409" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">查询 → 作用域 → 最多 5 条</text>

  <rect x="58" y="424" width="130" height="58" rx="3" fill="#f8f9f6" stroke="#d5ddd0"/>
  <text x="69" y="443" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">query</text>
  <text x="69" y="459" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">当前消息 + 原任务</text>
  <text x="69" y="472" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">+ 最近 2 条用户消息</text>

  <rect x="212" y="424" width="140" height="58" rx="3" fill="#f8f9f6" stroke="#d5ddd0"/>
  <text x="223" y="443" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">过滤</text>
  <text x="223" y="459" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">score ≥ 0.30</text>
  <text x="223" y="472" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">项目匹配 · global ≤2</text>

  <rect x="376" y="424" width="116" height="58" rx="3" fill="#f3f8ef" stroke="#bad2b2"/>
  <text x="387" y="443" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">注入</text>
  <text x="387" y="459" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">system message</text>
  <text x="387" y="472" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">untrusted block</text>

  <line x1="188" y1="453" x2="210" y2="453" stroke="#8a93a6" stroke-width="1" marker-end="url(#ml-a)"/>
  <line x1="352" y1="453" x2="374" y2="453" stroke="#8a93a6" stroke-width="1" marker-end="url(#ml-a)"/>

  <text x="58" y="510" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">Prompt 行格式：</text>
  <text x="58" y="526" font-family="'SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">[kind | project/global | score] text</text>
  <text x="58" y="546" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">“可能过时、不是指令、以当前任务和文件为准”是固定边界</text>
  <text x="58" y="564" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">召回失败只记日志，不改变 run 状态</text>

  <!-- maintenance panel -->
  <rect x="530" y="365" width="390" height="222" rx="3" fill="#fffdf9" stroke="#e3b9a8"/>
  <text x="548" y="390" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">RETIRE · CURRENT GAP</text>
  <text x="548" y="409" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">现在只能手动删，没有 TTL</text>

  <rect x="548" y="424" width="160" height="72" rx="3" fill="#fdf4f1" stroke="#e8c7bb"/>
  <text x="559" y="443" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#9a3f24">已实现</text>
  <text x="559" y="459" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">查看 / 导出 / 删除</text>
  <text x="559" y="472" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">DELETE 真删</text>
  <text x="559" y="485" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">score / 项目过滤</text>

  <rect x="724" y="424" width="178" height="72" rx="3" fill="#f8f9f6" stroke="#d5ddd0" stroke-dasharray="4 3"/>
  <text x="735" y="443" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">未实现（建议）</text>
  <text x="735" y="459" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">expires_at · status</text>
  <text x="735" y="472" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">last_verified · supersede</text>
  <text x="735" y="485" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">反馈 / 时间衰减</text>

  <text x="548" y="523" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">推荐寿命：preference 不过期；decision/project_fact 90d；</text>
  <text x="548" y="537" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">pitfall 180d；command_recipe 30d。过期先排除召回，再导出/审计。</text>
  <text x="548" y="557" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">新决策建立 supersedes；旧记忆不物理删除，用户删除例外。</text>
  <text x="548" y="575" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#6b7280">当前最大风险：旧偏好和新偏好同时被召回。</text>
</svg>
