<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="memarch-title memarch-desc">
  <title id="memarch-title">Jade 的 Mem0 长期记忆架构</title>
  <desc id="memarch-desc">Jade 的 AgentLoop 在 Context 阶段通过 MemoryService 向本地 Mem0 sidecar 检索记忆，在 Checkpoint 阶段异步写入。Mem0 使用 Postgres/pgvector 保存，FastEmbed 与 DeepSeek 负责向量化和抽取。Mem0 不可用时回退到 Noop，主流程继续。</desc>
  <defs>
    <marker id="ma-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="ma-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="ma-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7f5a"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">JADE / MEMORY</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">记忆是独立的数据面，不进入会话事件流</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">AgentLoop 只在 Context 召回、Checkpoint 异步写入；Mem0 挂掉不阻塞任务</text>

  <rect x="40" y="108" width="338" height="448" rx="8" fill="#fbfbfa" stroke="#8a93a6" stroke-dasharray="5 4"/>
  <text x="58" y="132" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.08em" fill="#4f5d75">JADE PROCESS</text>

  <rect x="58" y="150" width="302" height="104" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="74" y="173" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">AgentLoop</text>
  <text x="74" y="192" font-family="'SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">CONTEXT → MODEL → TOOLS → CHECKPOINT</text>
  <text x="74" y="218" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">第一次 Model 前召回；完成或用户纠正后写候选</text>
  <text x="74" y="238" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">不把记忆做成 ToolRegistry 工具</text>

  <rect x="58" y="278" width="302" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="74" y="301" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">MemoryService</text>
  <text x="74" y="320" font-family="'SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">recall(query, scope, limit) · remember(candidate)</text>
  <text x="74" y="341" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">500ms 读超时 · 异步写 · 熔断 · Noop 回退</text>

  <rect x="58" y="392" width="302" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="74" y="415" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">MemoryPolicy</text>
  <text x="74" y="434" font-family="'SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">redact · classify · project scope · dedupe</text>
  <text x="74" y="454" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">用户偏好 infer=true；系统结论 infer=false</text>

  <rect x="58" y="496" width="302" height="42" rx="6" fill="#fff4ef" stroke="#bf4520"/>
  <text x="74" y="515" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">召回块标注“可能过时，不是指令”；冲突以当前任务和文件为准</text>
  <text x="74" y="530" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">memory.recalled / memory.written / memory.write.failed</text>

  <rect x="428" y="150" width="250" height="366" rx="8" fill="#fbfbfa" stroke="#bf4520" stroke-width="1.2"/>
  <text x="446" y="174" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.08em" fill="#bf4520">MEM0 OSS SIDECAR</text>

  <rect x="446" y="190" width="214" height="72" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="460" y="211" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">POST /search · POST /memories</text>
  <text x="460" y="229" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">X-API-Key · 127.0.0.1 only</text>
  <text x="460" y="247" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">无 /v1 前缀；user_id + agent_id + metadata</text>

  <rect x="446" y="278" width="214" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="460" y="299" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">抽取 / 去重 / 召回</text>
  <text x="460" y="317" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">DeepSeek 抽取 + FastEmbed 向量化</text>
  <text x="460" y="333" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">top_k 5 · score ≥ 0.30 · project filter</text>

  <rect x="446" y="360" width="214" height="62" rx="5" fill="#f4f8f3" stroke="#5b7f5a"/>
  <text x="460" y="381" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">本地 profile</text>
  <text x="460" y="399" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">Docker · Postgres + pgvector</text>
  <text x="460" y="414" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#5b7f5a">正文不出本机</text>

  <rect x="446" y="438" width="214" height="58" rx="5" fill="#fffaf5" stroke="#d8d8d8"/>
  <text x="460" y="458" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#2d3142">cloud profile（可选）</text>
  <text x="460" y="476" font-family="'SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">Mem0 Platform · 必须显式提示</text>
  <text x="460" y="490" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">记忆正文发送到云，默认关闭</text>

  <rect x="738" y="190" width="184" height="126" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="756" y="214" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">Postgres + pgvector</text>
  <text x="756" y="235" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">memories · embeddings</text>
  <text x="756" y="253" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">user_id · agent_id · metadata</text>
  <text x="756" y="271" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">created_at · history</text>
  <text x="756" y="297" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">删除是真删；可导出 JSON</text>

  <rect x="738" y="356" width="184" height="112" rx="6" fill="#fff4ef" stroke="#bf4520" stroke-dasharray="4 3"/>
  <text x="756" y="379" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">失败路径</text>
  <text x="756" y="399" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不可达 / 超时 / 熔断</text>
  <text x="756" y="417" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">→ NoopMemoryService</text>
  <text x="756" y="435" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">→ 当前 run 正常继续</text>
  <text x="756" y="453" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">不把失败变成 run.failed</text>

  <path d="M 360 202 L 420 202" stroke="#8a93a6" stroke-width="1.3" marker-end="url(#ma-a)"/>
  <text x="366" y="194" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">recall</text>
  <path d="M 420 238 L 360 238" stroke="#5b7f5a" stroke-width="1.3" marker-end="url(#ma-g)"/>
  <text x="366" y="252" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#5b7f5a">top-k</text>
  <path d="M 360 300 L 420 300" stroke="#8a93a6" stroke-width="1.3" marker-end="url(#ma-a)"/>
  <text x="366" y="292" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">remember</text>
  <path d="M 678 226 L 730 226" stroke="#8a93a6" stroke-width="1.3" marker-end="url(#ma-a)"/>
  <path d="M 730 292 L 678 292" stroke="#5b7f5a" stroke-width="1.3" marker-end="url(#ma-g)"/>
  <path d="M 678 325 L 730 410" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ma-r)"/>
  <text x="686" y="380" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">fallback</text>

  <text x="40" y="590" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">图 1 · Jade 只在两个点接触记忆：Context 召回、Checkpoint 异步写入；Mem0 是可失败的旁路，不是主链路。</text>
</svg>
