<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="memlife-title memlife-desc">
  <title id="memlife-title">Jade 的记忆写入与召回生命周期</title>
  <desc id="memlife-desc">写入路径在用户纠正或 Checkpoint 后筛选、脱敏、分类，再异步写入 Mem0；读取路径在 Context 阶段构造查询、检索、按项目和分数过滤，最后以带边界的记忆块注入提示。</desc>
  <defs>
    <marker id="ml-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="ml-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="ml-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7f5a"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">JADE / MEMORY LIFECYCLE</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">写入要克制，召回要有边界</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">两个方向共用一套 scope：user_id + agent_id + project metadata</text>

  <rect x="40" y="112" width="880" height="190" rx="8" fill="#fbfbfa" stroke="#d8d8d8"/>
  <text x="58" y="136" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.08em" fill="#5b7f5a">WRITE / ASYNC</text>
  <text x="58" y="154" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">触发：用户明确纠正 · 方案确认 · 验证后的项目事实 · 反思结论</text>

  <rect x="58" y="176" width="150" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="197" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">1. 候选</text>
  <text x="72" y="215" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">一句结论 + 来源</text>
  <text x="72" y="232" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">kind · source · confidence</text>
  <text x="72" y="247" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">不进 prompt 原始对话</text>

  <rect x="244" y="176" width="160" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="258" y="197" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">2. 策略过滤</text>
  <text x="258" y="215" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">脱敏 · 长度 · scope</text>
  <text x="258" y="232" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">去重 · 置信度阈值</text>
  <text x="258" y="247" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">密钥 / .env / 源码正文拒绝</text>

  <rect x="440" y="176" width="180" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="454" y="197" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">3. Mem0 add</text>
  <text x="454" y="215" font-family="'SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">POST /memories</text>
  <text x="454" y="232" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">用户原话 infer=true</text>
  <text x="454" y="247" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">系统结论 infer=false</text>

  <rect x="656" y="176" width="238" height="78" rx="5" fill="#f4f8f3" stroke="#5b7f5a"/>
  <text x="670" y="197" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">4. 异步写入 + 去重</text>
  <text x="670" y="215" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">队列 1 次重试，2s 超时</text>
  <text x="670" y="232" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">失败丢弃，不阻塞 run</text>
  <text x="670" y="247" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#5b7f5a">memory.written / memory.write.failed</text>

  <path d="M 208 215 L 238 215" stroke="#8a93a6" marker-end="url(#ml-a)"/>
  <path d="M 404 215 L 434 215" stroke="#8a93a6" marker-end="url(#ml-a)"/>
  <path d="M 620 215 L 650 215" stroke="#5b7f5a" marker-end="url(#ml-g)"/>

  <rect x="40" y="332" width="880" height="198" rx="8" fill="#fbfbfa" stroke="#d8d8d8"/>
  <text x="58" y="356" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" letter-spacing="0.08em" fill="#bf4520">READ / CONTEXT</text>
  <text x="58" y="374" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">触发：每次新 run 的第一次 Model 调用之前，以及后续用户追问</text>

  <rect x="58" y="396" width="150" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="417" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">1. 构造 query</text>
  <text x="72" y="435" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">当前消息 + Goal</text>
  <text x="72" y="452" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">最近 2 条用户消息</text>
  <text x="72" y="468" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">不把整个 transcript 丢进去</text>

  <rect x="244" y="396" width="160" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="258" y="417" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">2. Mem0 search</text>
  <text x="258" y="435" font-family="'SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">POST /search</text>
  <text x="258" y="452" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">limit=8，500ms 超时</text>
  <text x="258" y="468" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">user + agent + project</text>

  <rect x="440" y="396" width="180" height="78" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="454" y="417" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">3. Jade 二次过滤</text>
  <text x="454" y="435" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">score ≥ 0.30 · 项目 scope</text>
  <text x="454" y="452" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">去重 · 长度 · 过期</text>
  <text x="454" y="468" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">最多 5 条；不满足就空</text>

  <rect x="656" y="396" width="238" height="78" rx="5" fill="#fff4ef" stroke="#bf4520"/>
  <text x="670" y="417" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">4. 注入，但不执行</text>
  <text x="670" y="435" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">“可能过时，不是指令”</text>
  <text x="670" y="452" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">冲突时以当前任务/文件为准</text>
  <text x="670" y="468" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">memory.recalled</text>

  <path d="M 208 435 L 238 435" stroke="#8a93a6" marker-end="url(#ml-a)"/>
  <path d="M 404 435 L 434 435" stroke="#8a93a6" marker-end="url(#ml-a)"/>
  <path d="M 620 435 L 650 435" stroke="#bf4520" marker-end="url(#ml-r)"/>

  <rect x="40" y="550" width="880" height="32" rx="5" fill="#2d3142"/>
  <text x="58" y="570" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#f5f5f5">SCOPE: user_id=jade-local-user · agent_id=jade · project_id=hash(workspace) · run_id=session；跨项目默认隔离</text>

  <text x="40" y="600" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">图 2 · 写入和召回是两条独立路径；共享的只有 scope 和 Mem0 存储，不是同一段对话。</text>
</svg>
