<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f4-title f4-desc">
<title id="f4-title">向量引擎选型决策阶梯</title>
<desc id="f4-desc">先看是否已有 PostgreSQL 或 Elasticsearch，再按数据规模、检索形态与并发要求逐级排除。</desc>
<defs>
<marker id="f4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
<marker id="f4-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
</defs>
<rect x="0" y="0" width="960" height="640" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="500" fill="#bf4520" letter-spacing="0.18em">A DECISION LADDER, NOT A SCOREBOARD</text>
<text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">先排除已有的系统，再按规模选</text>
<text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="400" fill="#5a6580">选型不是选“最强”，是选“最少新增约束”</text>
<line x1="464" y1="160" x2="558" y2="160" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="500" y="137" width="24" height="15" fill="#f5f5f5"/>
<text x="512" y="149" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="middle">是</text>
<line x1="464" y1="252" x2="558" y2="252" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="500" y="229" width="24" height="15" fill="#f5f5f5"/>
<text x="512" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="middle">是</text>
<line x1="464" y1="344" x2="558" y2="344" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="500" y="321" width="24" height="15" fill="#f5f5f5"/>
<text x="512" y="333" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="middle">是</text>
<line x1="464" y1="436" x2="558" y2="436" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="500" y="413" width="24" height="15" fill="#f5f5f5"/>
<text x="512" y="425" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="middle">是</text>
<line x1="264" y1="190" x2="264" y2="222" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="232" y="192" width="24" height="15" fill="#f5f5f5"/>
<text x="252" y="203" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="end">否</text>
<line x1="264" y1="282" x2="264" y2="314" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="232" y="284" width="24" height="15" fill="#f5f5f5"/>
<text x="252" y="295" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="end">否</text>
<line x1="264" y1="374" x2="264" y2="406" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="232" y="376" width="24" height="15" fill="#f5f5f5"/>
<text x="252" y="387" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="end">否</text>
<path d="M264 464 V544 Q264 552 272 552 H558" fill="none" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f4-arr)"/>
<rect x="232" y="480" width="24" height="15" fill="#f5f5f5"/>
<text x="252" y="491" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="500" fill="#5a6580" text-anchor="end">否</text>
<rect x="64" y="132" width="400" height="56" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="82" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">已有 PostgreSQL，且 ≤ 1000 万？</text>
<text x="82" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">QPS 中等，要事务与 Join</text>
<rect x="64" y="224" width="400" height="56" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="82" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">已有 PostgreSQL，但规模更大？</text>
<text x="82" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">1000 万–1 亿，或过滤 / 写入更重</text>
<rect x="64" y="316" width="400" height="56" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="82" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">文本与向量要一起检索？</text>
<text x="82" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">已有 ES，或需要过滤 / 聚合 / 分词</text>
<rect x="64" y="408" width="400" height="56" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="82" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">亿级以上、高并发、多租户？</text>
<text x="82" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">需要独立扩索引与查询层</text>
<rect x="560" y="128" width="352" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<rect x="560" y="136" width="3" height="48" rx="1.5" fill="#bf4520"/>
<text x="896" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="500" fill="#bf4520" text-anchor="end">默认起点</text>
<text x="578" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">pgvector</text>
<text x="578" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">事务、Join、SQL 都在手边</text>
<rect x="560" y="220" width="352" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="578" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">pgvector + pgvectorscale</text>
<text x="578" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">或 VectorChord，用扩展换单机吞吐</text>
<rect x="560" y="312" width="352" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="578" y="339" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">Elasticsearch</text>
<text x="578" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">BM25 + kNN + 过滤 / 聚合，一套查询</text>
<rect x="560" y="404" width="352" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="578" y="431" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">Milvus</text>
<text x="578" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">存算分离，索引与查询各自扩</text>
<rect x="560" y="520" width="352" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>
<text x="578" y="547" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="600" fill="#2d3142">pgvector</text>
<text x="578" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#5a6580">规模不大时，别为向量单独养集群</text>
<text x="64" y="606" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#8a94a8">阈值是经验值：1000 万、1 亿会随维度、召回目标、硬件和并发漂移；用真实数据压一遍再定。</text>
</svg>
