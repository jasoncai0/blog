<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="t d">
<title id="t">Workflow、Jobs、Goal、Schedule 的交互时序</title>
<desc id="d">一次会话里四种循环外机制各自从哪里进来、在哪里交还结果；goal 在 turn 之外续跑，workflow 在工具调用里开子代理，jobs 异步结算后注入，schedule 不经过当前会话。</desc>
<rect width="960" height="760" fill="#f5f5f5"/>
<text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#bf4520">FOUR MECHANISMS / SEQUENCE</text>
<text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" font-weight="600" fill="#2d3142">四种机制从哪里进来，在哪里交还</text>
<text x="40" y="80" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">只有 goal 在 turn 之外；workflow 与 jobs 都在工具调用里分叉；schedule 连当前会话都不经过。</text>
<rect x="40.0" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="105.83333333333333" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">SESSION · TURN</text>
<text x="105.83333333333333" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">会话与轮次</text>
<line x1="105.83333333333333" y1="132" x2="105.83333333333333" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="189.66666666666669" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="255.5" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">GOAL</text>
<text x="255.5" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">状态 + 续跑</text>
<line x1="255.5" y1="132" x2="255.5" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="339.3333333333333" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="405.16666666666663" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">WORKFLOW</text>
<text x="405.16666666666663" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">脚本 VM</text>
<line x1="405.16666666666663" y1="132" x2="405.16666666666663" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="489.00000000000006" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="554.8333333333334" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">CHILD AGENT</text>
<text x="554.8333333333334" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">独立会话</text>
<line x1="554.8333333333334" y1="132" x2="554.8333333333334" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="638.6666666666666" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="704.5" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">JOBS</text>
<text x="704.5" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">宿主进程</text>
<line x1="704.5" y1="132" x2="704.5" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="788.3333333333333" y="104" width="131.66666666666666" height="28" rx="5" fill="#fff" stroke="#d8d8d8"/>
<text x="854.1666666666666" y="116" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.08em" fill="#2d3142">SCHEDULE</text>
<text x="854.1666666666666" y="126" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">宿主时钟</text>
<line x1="854.1666666666666" y1="132" x2="854.1666666666666" y2="668" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="3 3"/>
<text x="113.83333333333333" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">· /goal &lt;objective&gt; → 写 goal/change：phase=active，并 arm</text>
<text x="263.5" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">· armed 是进程本地标志，不进日志；resume 后要人类再授权</text>
<line x1="255.5" y1="246" x2="111.83333333333333" y2="246" stroke="#bf4520" stroke-width="1.4"/><path d="M111.83333333333333 242.6 L105.83333333333333 246 L111.83333333333333 249.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="241" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">round driver 起一轮 → turn/start</text>
<line x1="105.83333333333333" y1="276" x2="399.16666666666663" y2="276" stroke="#bf4520" stroke-width="1.4"/><path d="M399.16666666666663 272.6 L405.16666666666663 276 L399.16666666666663 279.4 Z" fill="#bf4520"/><text x="111.83333333333333" y="271" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">workflow(script) 工具调用</text>
<text x="413.16666666666663" y="302" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">· vm.Script 编译；只注入 agent / parallel / pipeline / phase / log</text>
<line x1="405.16666666666663" y1="336" x2="548.8333333333334" y2="336" stroke="#bf4520" stroke-width="1.4"/><path d="M548.8333333333334 332.6 L554.8333333333334 336 L548.8333333333334 339.4 Z" fill="#bf4520"/><text x="411.16666666666663" y="331" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">agent(prompt, opts) → 新子会话，继承 cwd、谱系、深度</text>
<line x1="554.8333333333334" y1="366" x2="411.16666666666663" y2="366" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M411.16666666666663 362.6 L405.16666666666663 366 L411.16666666666663 369.4 Z" fill="#bf4520"/><text x="413.16666666666663" y="361" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">结果：structured（schema 通过）或 null（未完成/失败）</text>
<line x1="405.16666666666663" y1="396" x2="111.83333333333333" y2="396" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M111.83333333333333 392.6 L105.83333333333333 396 L111.83333333333333 399.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="391" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">WorkflowResult → tool/result，回到当前 step</text>
<line x1="105.83333333333333" y1="426" x2="698.5" y2="426" stroke="#bf4520" stroke-width="1.4"/><path d="M698.5 422.6 L704.5 426 L698.5 429.4 Z" fill="#bf4520"/><text x="111.83333333333333" y="421" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">bash detach / 后台任务 → job start</text>
<line x1="704.5" y1="456" x2="111.83333333333333" y2="456" stroke="#bf4520" stroke-width="1.4"/><path d="M111.83333333333333 452.6 L105.83333333333333 456 L111.83333333333333 459.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="451" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">job/registered 写进 owner 的会话日志</text>
<text x="113.83333333333333" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">· 本步继续；结算可以晚于 turn/end 才到（job/settled）</text>
<line x1="704.5" y1="516" x2="111.83333333333333" y2="516" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M111.83333333333333 512.6 L105.83333333333333 516 L111.83333333333333 519.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="511" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520">job/settled → inject（busy）或 followup（idle）</text>
<line x1="105.83333333333333" y1="546" x2="698.5" y2="546" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M698.5 542.6 L704.5 546 L698.5 549.4 Z" fill="#bf4520"/><text x="111.83333333333333" y="541" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">job_output 读输出环：live 256KB，结算后留 16KB</text>
<line x1="105.83333333333333" y1="576" x2="249.5" y2="576" stroke="#bf4520" stroke-width="1.4"/><path d="M249.5 572.6 L255.5 576 L249.5 579.4 Z" fill="#bf4520"/><text x="111.83333333333333" y="571" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">turn/end → driver 读 armed 与 roundsStarted</text>
<line x1="255.5" y1="606" x2="111.83333333333333" y2="606" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M111.83333333333333 602.6 L105.83333333333333 606 L111.83333333333333 609.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="601" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520">rounds+1 ≤ maxGoalRounds（默认 256）→ 下一轮</text>
<line x1="854.1666666666666" y1="636" x2="111.83333333333333" y2="636" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M111.83333333333333 632.6 L105.83333333333333 636 L111.83333333333333 639.4 Z" fill="#bf4520"/><text x="113.83333333333333" y="631" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">cron 到点 → 新建会话投递 prompt，不经过当前会话</text>
<text x="788.3333333333333" y="662" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">rrule 存在宿主存储；读任务不激活会话</text>
<rect x="40" y="676" width="880" height="60" rx="6" fill="#fff" stroke="#d8d8d8"/>
<text x="56" y="694" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.12em" fill="#bf4520">HOW TO READ</text>
<text x="56" y="710" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">竖着看是一次 turn：goal 决定这一轮从哪来，workflow 与 jobs 是工具调用内部的两条分叉，schedule 从宿主时钟直接开新会话。</text>
<text x="56" y="726" text-anchor="start" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">横着看是四本账：子代理数、进程记录、轮次、触发次数。它们记住了不同的东西，所以不能用一套重试逻辑。</text>
<text x="920" y="750" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.12em" fill="#8b93a6">16 / FOUR MECHANISMS</text>
</svg>