<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-title f02-04-desc">
<title id="f02-04-title">两个切点：resume 跟日志走，fork 跟边界走</title>
<desc id="f02-04-desc">resume 在物理日志末尾补齐 interrupted closer；fork 在指定 seq 复制前缀并写入 inherited end-seed。</desc>
<defs><marker id="f02-04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6580"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="48" y="50" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#2d3142" text-anchor="start">两个切点：resume 跟日志走，fork 跟边界走</text>
<text x="48" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580" text-anchor="start">前者修语义，后者造前缀；两者的 inherited 处理方向相反</text>
<rect x="44" y="104" width="420" height="396" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="64" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" font-weight="600" fill="#bf4520" text-anchor="start">resume(sessionId)</text>
<text x="64" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">切在物理日志末尾</text>
<circle cx="76" cy="174" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="76" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">1</text>
<text x="94" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">persistence.open(id, &#x27;write&#x27;)</text>
<circle cx="76" cy="203" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="76" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">2</text>
<text x="94" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">handle.read(0, undefined) 全量读日志</text>
<circle cx="76" cy="232" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="76" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">3</text>
<text x="94" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">interruptedTurnClosers(persisted)</text>
<circle cx="76" cy="261" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="76" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">4</text>
<text x="94" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">非空则 handle.append(closers)</text>
<circle cx="76" cy="290" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="76" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">5</text>
<text x="94" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">seed = [...persisted, ...closers]</text>
<rect x="60" y="318" width="388" height="76" rx="6" fill="#f7f7f7" stroke="#e4e4e4" stroke-width="1"/>
<text x="74" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">inheritedEventCount 原样取自 handle。普通会话是 0，fork 出来的子</text>
<text x="74" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">会话保留非零 cut。</text>
<rect x="60" y="404" width="388" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="74" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#2d3142" text-anchor="start">新事件从 seed 末尾继续编号；cut 只影响 surface 的起点。</text>
<rect x="496" y="104" width="420" height="396" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="516" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" font-weight="600" fill="#bf4520" text-anchor="start">fork(source, boundary)</text>
<text x="516" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">切在调用方给的 inclusive seq</text>
<circle cx="528" cy="174" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="528" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">1</text>
<text x="546" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">校验 boundary 落在连续事件 seq 上</text>
<circle cx="528" cy="203" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="528" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">2</text>
<text x="546" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">prefix = events.slice(0, boundary + 1)</text>
<circle cx="528" cy="232" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="528" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">3</text>
<text x="546" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">追加 session/end-seed {inherited:true}</text>
<circle cx="528" cy="261" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="528" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">4</text>
<text x="546" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">追加 forked closers，收尾开放的 turn</text>
<circle cx="528" cy="290" r="9" fill="#fbe9e2" stroke="#e8c3b6" stroke-width="1"/>
<text x="528" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="middle">5</text>
<text x="546" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2d3142" text-anchor="start">inheritedEventCount = boundary + 1</text>
<rect x="512" y="318" width="388" height="76" rx="6" fill="#f7f7f7" stroke="#e4e4e4" stroke-width="1"/>
<text x="526" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">v4 header 不存数字 cut。v2 起由最后一条 inherited 的</text>
<text x="526" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">session/end-seed 的 seq 推导。</text>
<rect x="512" y="404" width="388" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="526" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#2d3142" text-anchor="start">子会话的 seq 仍从 0 开始；cut 标记前缀长度，不改变编号。</text>
<rect x="44" y="524" width="872" height="44" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="480" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#bf4520" text-anchor="middle">切点之前的事件不改一个字节；切点之后由合成 closer 补齐语义。</text>
</svg>
