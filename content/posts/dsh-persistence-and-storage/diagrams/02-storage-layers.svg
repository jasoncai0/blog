<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-title f02-desc">
  <title id="f02-title">storage 四层的职责与依赖方向</title>
  <desc id="f02-desc">上层是业务代码与投影缓存，中间是 storage-domain 与 storage hub，底层是 json 与 sqlite 两个后端。domain 是后端契约的唯一 Consumer，hub 只做名表与解析，不做磁盘 IO；右侧列出域写入的四步顺序与失败隔离语义。</desc>
  <defs>
    <marker id="f02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f02-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">STORAGE / LAYERS</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" font-weight="600" fill="#2d3142">四层，各自只做一件事</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">箭头是依赖方向，也是「谁能看见物理格式」的边界</text>

  <!-- consumer -->
  <rect x="40" y="104" width="560" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">CONSUMERS</text>
  <text x="56" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">投影缓存 · workspace 实体 · 设置 · 计划 · 目标 · 待办</text>
  <text x="56" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">它们只拿到类型化的域，不 import 任何后端包</text>

  <line x1="320" y1="170" x2="320" y2="196" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-arrow)"/>

  <!-- domain -->
  <rect x="40" y="198" width="560" height="88" rx="5" fill="#ffffff" stroke="#bf4520" stroke-width="1.4"/>
  <text x="56" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">STORAGE-DOMAIN / ctx.storageDomain</text>
  <text x="56" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">DomainSpec：name · version · compatibleVersions · invalidRecords · layout · tables</text>
  <text x="56" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">每域一条写链 · 内存快照 · domain/changed 事件</text>
  <text x="56" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">唯一持有 KvFacet 契约的层；版本与坏记录策略在这里</text>

  <line x1="320" y1="286" x2="320" y2="312" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-arrow)"/>

  <!-- hub -->
  <rect x="40" y="314" width="560" height="64" rx="5" fill="#2d3142"/>
  <text x="56" y="336" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#aeb6c8">STORAGE / ctx.storage</text>
  <text x="56" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#ffffff">backend 名表 · mount(form) · storageBackendServiceKey</text>
  <text x="56" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#aeb6c8">不做磁盘 IO，不认识 JSON 也不认识 SQLite</text>

  <line x1="180" y1="378" x2="180" y2="404" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-arrow)"/>
  <line x1="460" y1="378" x2="460" y2="404" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-arrow)"/>

  <!-- backends -->
  <rect x="40" y="406" width="264" height="118" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">BACKEND / json</text>
  <text x="56" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">single：整 unit 一个文件</text>
  <text x="56" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">per-record：每记录一个文件</text>
  <text x="56" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">临时文件 + fsync + rename</text>
  <text x="56" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">批量删先 rename 出可读集</text>
  <text x="56" y="512" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">产品默认，root = storages/</text>

  <rect x="336" y="406" width="264" height="118" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="352" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">BACKEND / sqlite</text>
  <text x="352" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">一个库，每行一文档</text>
  <text x="352" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">STRICT 表 + prepared 语句</text>
  <text x="352" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">user_version 不符直接拒绝</text>
  <text x="352" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">BEGIN IMMEDIATE 提交批量</text>
  <text x="352" y="512" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">可选，按部署挂载</text>

  <!-- right panel: write order -->
  <rect x="628" y="104" width="292" height="420" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="644" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#bf4520">WRITE ORDER</text>
  <text x="644" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">一次域写入的四步</text>

  <circle cx="650" cy="172" r="8" fill="#2d3142"/>
  <text x="647" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#ffffff">1</text>
  <text x="666" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">进入该域的写链排队</text>
  <text x="666" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">同域同时只有一次写</text>

  <circle cx="650" cy="216" r="8" fill="#2d3142"/>
  <text x="647" y="219" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#ffffff">2</text>
  <text x="666" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">先落介质，等后端确认</text>
  <text x="666" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">失败就不改内存</text>

  <circle cx="650" cy="260" r="8" fill="#2d3142"/>
  <text x="647" y="263" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#ffffff">3</text>
  <text x="666" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">更新内存快照</text>
  <text x="666" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">读因此可以是同步的</text>

  <circle cx="650" cy="304" r="8" fill="#2d3142"/>
  <text x="647" y="307" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#ffffff">4</text>
  <text x="666" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">发 domain/changed</text>
  <text x="666" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">按写链顺序，进程内事件</text>

  <line x1="644" y1="344" x2="904" y2="344" stroke="#d8d8d8"/>

  <text x="644" y="366" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.14em" fill="#bf4520">FAILURE</text>
  <text x="644" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">批次状态不明 → unknown-state</text>
  <text x="644" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">坏记录 → backup-and-skip（可配）</text>
  <text x="644" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">版本不符 → 整次 open 失败</text>
  <text x="644" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">回滚也失败 → 关闭后重开</text>

  <rect x="644" y="452" width="260" height="56" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="656" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">会话日志不经过这一栈：</text>
  <text x="656" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">ctx.sessionPersistence 直接拥有</text>
  <text x="656" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">JSONL 句柄与写入租约</text>

  <text x="40" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">换后端只动组合里的两行：backend 名与 root。域代码、事件、迁移策略都不动。</text>
  <text x="40" y="586" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">DSH / persistence-and-storage / f02</text>
</svg>
