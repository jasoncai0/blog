<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f05-s5-title f05-s5-desc">
  <title id="f05-s5-title">turn-stopping 的收尾时序</title>
  <desc id="f05-s5-desc">step 结束且 next-step 为空时，循环以 serial 方式等待 turn-stopping 监听器；监听器可以 steer 一条消息表示反对。循环随后重读收件箱：有输入就再跑一步，没有才写 turn/end。</desc>
  <defs>
    <marker id="f05-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/>
    </marker>
    <marker id="f05-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
    <marker id="f05-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7c59"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TURN / CLOSING</text>
  <text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">唯一允许反悔的窗口</text>
  <text x="40" y="76" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">serial、无 next、在边界提交之前被 await；反对方式是往收件箱写数据，不是返回值</text>

  <!-- participants -->
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#2d3142" text-anchor="middle">
    <rect x="80" y="100" width="140" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="150" y="120">turn loop</text>
    <rect x="310" y="100" width="160" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="390" y="120">turn-stopping 监听器</text>
    <rect x="560" y="100" width="130" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="625" y="120">inbox</text>
    <rect x="770" y="100" width="140" height="30" rx="4" fill="#2d3142"/>
    <text x="840" y="120" fill="#ffffff">session log</text>
  </g>

  <g stroke="#c9ced9" stroke-width="1" stroke-dasharray="3 4">
    <path d="M150,130 L150,520"/>
    <path d="M390,130 L390,520"/>
    <path d="M625,130 L625,520"/>
    <path d="M840,130 L840,520"/>
  </g>

  <!-- 1 -->
  <path d="M150,164 L836,164" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f05-a)"/>
  <text x="160" y="158" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">step/end { turn, step }</text>
  <text x="160" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">finally 里写；此时 next-step 已空</text>

  <!-- 2 -->
  <path d="M150,214 L386,214" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#f05-ao)"/>
  <text x="160" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">agent/turn-stopping</text>
  <text x="160" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a4a30">serial · awaited · 无 next()</text>

  <rect x="300" y="240" width="180" height="42" rx="4" fill="#fff8f2" stroke="#e0a184"/>
  <text x="312" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">「这一轮先别关」</text>
  <text x="312" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">就 steer 一条消息</text>

  <!-- 3 -->
  <path d="M390,302 L621,302" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#f05-ao)"/>
  <text x="404" y="296" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">agent.steer(msg)</text>
  <text x="404" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a4a30">写入 next-step，并记录 inbox/spliced + inserted</text>

  <!-- 4 -->
  <path d="M625,346 L154,346" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f05-a)"/>
  <text x="300" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">重读 nextStep.length</text>

  <!-- alt box -->
  <rect x="80" y="366" width="480" height="128" rx="4" fill="none" stroke="#8a93a6" stroke-dasharray="5 3"/>
  <text x="92" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">ALT</text>

  <path d="M150,404 L836,404" stroke="#4a7c59" stroke-width="1.3" fill="none" marker-end="url(#f05-ag)"/>
  <text x="160" y="398" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4a7c59">[有输入] step/start（同一 turn，再跑一步）</text>

  <path d="M150,464 L836,464" stroke="#5a6580" stroke-width="1.3" fill="none" marker-end="url(#f05-a)"/>
  <text x="160" y="458" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#2d3142">[无输入] turn/end { reason: completed }</text>

  <!-- note -->
  <rect x="600" y="366" width="320" height="128" rx="6" fill="#2d3142"/>
  <text x="616" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#e0a184">WHY SERIAL, NOT WATERFALL</text>
  <text x="616" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#d7dbe4">waterfall 会诱导「不调 next 就阻断」，</text>
  <text x="616" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#d7dbe4">让结果依赖监听器顺序。</text>
  <text x="616" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#d7dbe4">这里改成「数据决定」：谁 steer 都算数，</text>
  <text x="616" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#d7dbe4">没人 steer 就关轮。顺序无关。</text>
  <text x="616" y="482" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#9aa3b5">data decides, order cannot</text>

  <!-- bottom -->
  <text x="40" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">禁止在这里 await agent.whenIdle()：它运行在关轮判定路径上，等的是自己，直接死锁。</text>
  <text x="40" y="554" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">反方向的「提前结束」也是数据：工具结果带 concludesTurn，在该 step 结束 turn；但不会短路已提交的 next-step 工作。</text>
  <text x="40" y="578" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">turn-stopping 只在「模型不再欠响应」时触发；工具还没跑完、或 next-step 非空，都不会进来</text>
</svg>
