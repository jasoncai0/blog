<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-s2-title f02-s2-desc">
  <title id="f02-s2-title">turn 的七种结束原因</title>
  <desc id="f02-s2-desc">turn/end 携带七种 reason：completed、blocked、aborted、error 是运行期出口；max-tokens 是 completed 的特殊形态；interrupted 与 forked 只由恢复和 fork 事后补写。前四种中的 blocked 不消耗 step。</desc>
  <defs>
    <marker id="f02-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">TURN / EXIT</text>
  <text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一轮只有七种结束方式</text>
  <text x="40" y="76" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">其中两种永远不会由 loop 实时发出</text>

  <rect x="40" y="94" width="880" height="56" rx="6" fill="#2d3142"/>
  <text x="60" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#ffffff">turn/end  { turn, reason }</text>
  <text x="60" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#9aa3b5">写在 finally：正常路径必有；崩溃路径靠恢复补写。空轮次也写。</text>
  <text x="700" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#e0a184">TurnEndReasonMap</text>
  <text x="700" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#9aa3b5">exactly 7 variants</text>

  <!-- row 1 -->
  <rect x="40" y="176" width="207" height="122" rx="6" fill="#ffffff" stroke="#4a7c59"/>
  <text x="54" y="198" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4a7c59">01 · RUNTIME</text>
  <text x="54" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">completed</text>
  <text x="54" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">模型不再要工具，</text>
  <text x="54" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">next-step 已空。</text>
  <text x="54" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">step ≥ 1</text>
  <text x="54" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#4a7c59">最常见，但不唯一</text>

  <rect x="264" y="176" width="207" height="122" rx="6" fill="#ffffff" stroke="#bf8a20"/>
  <text x="278" y="198" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf8a20">02 · RUNTIME</text>
  <text x="278" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">blocked</text>
  <text x="278" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">pre-step 返回 reject，</text>
  <text x="278" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">消息不再重新入队。</text>
  <text x="278" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf8a20">step = 0</text>
  <text x="278" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a6a1a">不花模型调用</text>

  <rect x="488" y="176" width="207" height="122" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="502" y="198" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">03 · RUNTIME</text>
  <text x="502" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">aborted</text>
  <text x="502" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">reason: user / parent /</text>
  <text x="502" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">hook{reason} / disposed</text>
  <text x="502" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">可以是 0 个 step</text>
  <text x="502" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#bf4520">已吐出的前缀仍会入库</text>

  <rect x="712" y="176" width="208" height="122" rx="6" fill="#ffffff" stroke="#8a93a6"/>
  <text x="726" y="198" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">04 · RUNTIME</text>
  <text x="726" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">error</text>
  <text x="726" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">带规范化 LlmFailure，</text>
  <text x="726" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">已重试过且仍失败。</text>
  <text x="726" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">LlmError / ToolActivation</text>
  <text x="726" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">其余归为 UNKNOWN</text>

  <!-- row 2 -->
  <rect x="40" y="320" width="207" height="122" rx="6" fill="#fff8f2" stroke="#e0a184"/>
  <text x="54" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">05 · RUNTIME</text>
  <text x="54" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">max-tokens</text>
  <text x="54" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">因输出上限停止，</text>
  <text x="54" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">且没有工具调用。</text>
  <text x="54" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">一旦命中就粘住 turn</text>
  <text x="54" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">后续不再改回 completed</text>

  <rect x="264" y="320" width="207" height="122" rx="6" fill="#f4f5f7" stroke="#8a93a6" stroke-dasharray="4 3"/>
  <text x="278" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">06 · POST-HOC</text>
  <text x="278" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">interrupted</text>
  <text x="278" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">日志末尾有 turn/start</text>
  <text x="278" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">却没有配对 end。</text>
  <text x="278" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">只由恢复路径补写</text>
  <text x="278" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">loop 从不实时发出</text>

  <rect x="488" y="320" width="207" height="122" rx="6" fill="#f4f5f7" stroke="#8a93a6" stroke-dasharray="4 3"/>
  <text x="502" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">07 · POST-HOC</text>
  <text x="502" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">forked</text>
  <text x="502" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">切点上未闭合的 turn，</text>
  <text x="502" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">在子会话里补一个结束。</text>
  <text x="502" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#8a93a6">只由 buildForkSeed 写</text>
  <text x="502" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" fill="#8a93a6">源会话一条不动</text>

  <!-- side note -->
  <rect x="712" y="320" width="208" height="122" rx="6" fill="#2d3142"/>
  <text x="726" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#e0a184">READ THIS</text>
  <text x="726" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#ffffff">判断成功别看 step/end</text>
  <text x="726" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#d7dbe4">它在 finally 里，异常也写。</text>
  <text x="726" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#d7dbe4">成功要读：assistant/message</text>
  <text x="726" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#d7dbe4">是否存在 + turn/end.reason。</text>
  <text x="726" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#9aa3b5">finally ≠ success</text>

  <!-- decision strip -->
  <text x="40" y="474" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">loop 内的四条快速规则</text>
  <rect x="40" y="484" width="880" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="503" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">pre-step reject → blocked（0 step）  ·  step==0 且无消息 → completed（0 step）  ·  工具 concluded:false → 同 step 再请求  ·  next-step 非空 → 不开新 turn</text>

  <text x="40" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">空轮次也写 turn/start 与 turn/end：拒绝必须可解释，时间线必须连续，否则 UI 只能显示「什么都没发生」。</text>
  <text x="40" y="558" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">max-tokens 粘住整轮：结果单调、UI 好判断；代价是「先截断后补全」会被标成截断。</text>
  <text x="40" y="582" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#8a93a6">TurnEndReasonMap = completed | aborted | blocked | error | max-tokens | interrupted | forked</text>
</svg>
