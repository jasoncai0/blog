<text x="95" y="195" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">claim(target)：入队项出队</text>
<line x1="88" y1="230" x2="828" y2="230" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="225" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">tools.resolve({ modelSelection, signal })</text>
<line x1="88" y1="260" x2="384" y2="260" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="255" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">systemPrompt.assemble()</text>
<line x1="88" y1="290" x2="532" y2="290" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="285" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">agent/pre-step（waterfall；压缩入口 ①）</text>
<line x1="532" y1="320" x2="88" y2="320" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="315" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">enter(messages) 或 reject</text>
<line x1="88" y1="350" x2="680" y2="350" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="345" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">step/start</text>
<line x1="88" y1="380" x2="828" y2="380" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="375" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">agent/request → llm.prepareCall()（压缩入口 ②）</text>
<line x1="88" y1="410" x2="680" y2="410" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="405" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">system/message：refreshContext · runtime project</text>
<line x1="88" y1="440" x2="680" y2="440" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="435" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">user/message：首轮整批，runtime 快照只插一次</text>
<line x1="88" y1="470" x2="680" y2="470" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="465" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">request/header · request/context · developer/message</text>
<line x1="88" y1="500" x2="828" y2="500" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="495" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">deriveMessages() 冻结 → llm.stream()</text>
<line x1="828" y1="530" x2="680" y2="530" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="687" y="525" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">assistant-stream：start / chunk* / end</text>
<line x1="828" y1="560" x2="680" y2="560" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="687" y="555" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">assistant/message（成功）或 assistant/attempt（失败）</text>
<line x1="828" y1="590" x2="88" y2="590" stroke="#b23a2e" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f06-tt-r)"/>
<text x="95" y="584" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#b23a2e">失败：assistant/attempt → agent/request-error → 压缩后 retry（同一 step，新 attempt）</text>
<path d="M60,590 L22,590 L22,372" fill="none" stroke="#b23a2e" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f06-tt-r)"/>
<text x="27" y="366" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" fill="#b23a2e">retry</text>
<line x1="88" y1="620" x2="828" y2="620" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="615" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">tools.execute()：pre → execute → post</text>
<line x1="828" y1="650" x2="680" y2="650" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="687" y="645" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">tool/call · tool/result</text>
<line x1="88" y1="680" x2="680" y2="680" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="675" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">step/end</text>
<line x1="88" y1="710" x2="236" y2="710" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f06-tt-a)"/>
<text x="95" y="705" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">next-step 非空 → 回到 ③ claim</text>
<circle cx="88" cy="740" r="3" fill="#bf4520"/>
<text x="98" y="743" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">agent/turn-stopping（serial；只在收尾时等一次）</text>
<line x1="88" y1="770" x2="680" y2="770" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="765" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">turn/end → status idle</text>
<rect x="24" y="830" width="912" height="146" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
<text x="44" y="852" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".14em" fill="#bf4520">COMPACTION · THREE ENTRANCES</text>
<rect x="44" y="864" width="286" height="96" rx="6" fill="#fdf7f4" stroke="#e8c8bc"/>
<text x="56" y="882" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#2d3142">① pressure</text>
<text x="56" y="897" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">agent/pre-step · step 之前</text>
<text x="56" y="912" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" fill="#4f5d75">tokens ≥ threshold 时先剪工具结果，再摘要；一轮不够可以再压。</text>
<text x="56" y="950" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#8a93a6">start → summary → replace → end</text>
<rect x="351" y="864" width="286" height="96" rx="6" fill="#fdf7f4" stroke="#e8c8bc"/>
<text x="363" y="882" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#2d3142">② model switch</text>
<text x="363" y="897" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">agent/request · prepend</text>
<text x="363" y="912" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" fill="#4f5d75">路由换了：按新模型窗口重算压力，压不下去就拒绝这次切换。</text>
<text x="363" y="950" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#8a93a6">start → summary → replace → end</text>
<rect x="658" y="864" width="286" height="96" rx="6" fill="#fdf7f4" stroke="#e8c8bc"/>
<text x="670" y="882" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#2d3142">③ overflow</text>
<text x="670" y="897" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">agent/request-error · step 之内</text>
<text x="670" y="912" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" fill="#4f5d75">code 是 CONTEXT_WINDOW_EXCEEDED 时强制压缩，返回 retry，不回 turn 头。</text>
<text x="670" y="950" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#8a93a6">start → summary → replace → end</text>
<text x="24" y="994" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing=".08em" fill="#8a93a6">06 / TURN TIMELINE　·　LOG 泳道上的每条箭头都是一个持久事件；摘要调用本身不是 step</text>
</svg>