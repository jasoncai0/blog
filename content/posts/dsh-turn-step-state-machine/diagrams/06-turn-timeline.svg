<rect x="470" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="532" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">COMPACT</text>
<line x1="532" y1="122" x2="532" y2="812" stroke="#c9ccd2" stroke-dasharray="3 4"/>
<rect x="618" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="680" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">LOG</text>
