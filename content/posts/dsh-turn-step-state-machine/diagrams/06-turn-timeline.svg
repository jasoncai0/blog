<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1010" width="960" height="1010" role="img" aria-labelledby="f06-tt-title f06-tt-desc">
<title id="f06-tt-title">一次 turn 的完整时序</title>
<desc id="f06-tt-desc">六泳道时序：send 与 claim 之后依次是 tools.resolve、systemPrompt.assemble、agent/pre-step、step/start、请求组装、流式、工具、step/end、turn-stopping、turn/end；底部列出压缩的三个入口。</desc>
<defs>
<marker id="f06-tt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
<marker id="f06-tt-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a2e"/></marker>
</defs>
<rect width="960" height="1010" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".16em" fill="#bf4520">TURN TIMELINE</text>
<text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一次 turn 的完整时序：组装、压缩、请求各自插在哪</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">压缩有两个位置：step 之前的压力检查，step 之内的溢出恢复。组装发生在每次 claim 之后、pre-step 之前。</text>
<rect x="26" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="88" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">DRIVER</text>
<line x1="88" y1="122" x2="88" y2="812" stroke="#c9ccd2" stroke-dasharray="3 4"/>
<rect x="174" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="236" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">INBOX</text>
<line x1="236" y1="122" x2="236" y2="812" stroke="#c9ccd2" stroke-dasharray="3 4"/>
<rect x="322" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="384" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">PROMPT</text>
