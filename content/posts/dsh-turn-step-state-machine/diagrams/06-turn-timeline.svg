<rect x="766" y="96" width="124" height="26" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="828" y="113" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".06em" fill="#2d3142">LLM · TOOLS</text>
<line x1="828" y1="122" x2="828" y2="812" stroke="#c9ccd2" stroke-dasharray="3 4"/>
<line x1="88" y1="140" x2="236" y2="140" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">send(msg, target, wakeup)</text>
<line x1="88" y1="170" x2="680" y2="170" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f06-tt-a)"/>
<text x="95" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">turn/start</text>
