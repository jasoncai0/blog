<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f03-s3-title f03-s3-desc">
  <title id="f03-s3-title">step 内部的工作循环</title>
  <desc id="f03-s3-desc">一个 step 内部依次准备请求、提交消息、发起流式调用、结算、执行工具；工具还有欠账时回到流式调用，否则返回 step 结束原因。失败分支先写 assistant/attempt，再由 request-error 决定是否重试。</desc>
  <defs>
    <marker id="f03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/>
    </marker>
    <marker id="f03-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
    <marker id="f03-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7c59"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">STEP / INNER LOOP</text>
  <text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一个 step，可能请求两次</text>
  <text x="40" y="76" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">step 的粒度是「一段模型工作」，不是「一次 HTTP 调用」</text>

  <!-- stages -->
  <rect x="40" y="120" width="130" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="54" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">01</text>
  <text x="54" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">准备请求</text>
  <text x="54" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">header controls</text>
  <text x="54" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">+ selection</text>
  <text x="54" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">agent/request</text>
  <text x="54" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">prepareCall()</text>

  <rect x="190" y="120" width="130" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="204" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">02</text>
  <text x="204" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">提交消息</text>
  <text x="204" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">system/message</text>
  <text x="204" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">user/message</text>
  <text x="204" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">request/header</text>
  <text x="204" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">cancelled ⇒ nothing</text>

  <rect x="340" y="120" width="130" height="112" rx="6" fill="#fff8f2" stroke="#e0a184"/>
  <text x="354" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">03</text>
  <text x="354" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">流式调用</text>
  <text x="354" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">llm.stream()</text>
  <text x="354" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">live.start/push</text>
  <text x="354" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">逐帧广播</text>
  <text x="354" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">attempt #n</text>

  <rect x="490" y="120" width="130" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="504" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">04</text>
  <text x="504" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">结算</text>
  <text x="504" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">assistant/message</text>
  <text x="504" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">或 attempt</text>
  <text x="504" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">异常补 AggregateError</text>
  <text x="504" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">always settles</text>

  <rect x="640" y="120" width="130" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="654" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#bf4520">05</text>
  <text x="654" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">执行工具</text>
  <text x="654" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">tools.execute()</text>
  <text x="654" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">additionalContexts</text>
  <text x="654" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">splice → next-step</text>
  <text x="654" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">barriers + pool</text>

  <rect x="790" y="120" width="130" height="112" rx="6" fill="#ffffff" stroke="#4a7c59"/>
  <text x="804" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4a7c59">06</text>
  <text x="804" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">还欠账？</text>
  <text x="804" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">concluded?</text>
  <text x="804" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">有工具 ⇒ 继续</text>
  <text x="804" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">无工具 ⇒ 结束</text>
  <text x="804" y="222" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.4" fill="#8a93a6">StepEndReason | null</text>

  <path d="M170,176 L186,176" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
  <path d="M320,176 L336,176" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
  <path d="M470,176 L486,176" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
  <path d="M620,176 L636,176" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>
  <path d="M770,176 L786,176" stroke="#5a6580" stroke-width="1.1" fill="none" marker-end="url(#f03-a)"/>

  <!-- loop back false -->
  <path d="M855,232 L855,320 L405,320 L405,236" stroke="#4a7c59" stroke-width="1.3" fill="none" marker-end="url(#f03-ag)"/>
  <text x="560" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4a7c59">concluded = false：同一步再发起一次请求（step 编号不变）</text>

  <!-- return true -->
  <path d="M855,232 L855,374 L905,374" stroke="#4a7c59" stroke-width="1.3" fill="none" marker-end="url(#f03-ag)"/>
  <rect x="720" y="352" width="200" height="46" rx="6" fill="#eef5ef" stroke="#4a7c59"/>
  <text x="734" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">return completed / max-tokens</text>
  <text x="734" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4a7c59">交给 turn() 决定 turn/end</text>

  <!-- failure branch -->
  <path d="M555,232 L555,410 L742,410" stroke="#bf4520" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#f03-ao)"/>
  <rect x="742" y="386" width="178" height="48" rx="6" fill="#fff5f2" stroke="#bf4520"/>
  <text x="754" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#bf4520">先写 attempt，再问重试</text>
  <text x="754" y="420" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#8a4a30">agent/request-error</text>

  <path d="M742,410 L700,410 L700,268 L700,236" stroke="#bf4520" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#f03-ao)"/>
  <text x="586" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">retry → continue</text>
  <text x="586" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">否则抛 LlmError → turn 收口</text>

  <!-- left notes -->
  <text x="40" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">三个取消检查点</text>
  <text x="40" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">① 提交消息前（被取消则 system/user 都不写）</text>
  <text x="40" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">② 请求发出前：signal.throwIfAborted()</text>
  <text x="40" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">③ 工具批次内：每个调用拿到同一个 signal</text>

  <text x="40" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">为什么先写 attempt</text>
  <text x="40" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">若先问重试策略、策略自身抛错，</text>
  <text x="40" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">这次尝试的证据就彻底丢了。</text>
  <text x="40" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">先落盘，再决策，是日志优先的顺序。</text>

  <text x="40" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">startsRequestSeries 只给第一次尝试</text>
  <text x="40" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">重试若也带这个标记，会把同一段对话</text>
  <text x="40" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">反复「重启」，某些提供方会丢 prompt cache。</text>

  <text x="40" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">step() 返回：null（继续同一步） | {kind:'completed'|'max-tokens'} | throw</text>
  <text x="40" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">step/end 在 turn() 的 finally 里写，所以它只证明「这一段结束了」，不证明「成功了」。</text>
  <text x="40" y="580" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">工具批次抛错时，ToolCallRecovery 会把已完成的调用补成 tool/result，再抛 AggregateError：日志里不允许悬空的 call。</text>
  <text x="40" y="606" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#8a93a6">attempt++ per stream call · step 编号在整个 turn 内单调</text>
</svg>
