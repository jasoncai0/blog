<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">patch 的三种操作</title>
<desc id="f02-desc">替换、插入、禁用；三种都不改变其他行。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ASSEMBLY / PATCH OPS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">只动你指名的那一行</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">替换整条 config 是最容易被低估的一条。</text>
<rect x="60" y="104" width="260" height="150" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">替换</text><text x="72" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">- id: hmr</text><text x="72" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">  config: {root: [src]}</text><text x="72" y="169" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75"></text><text x="72" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">name 省略＝沿用前层</text><text x="72" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">config 整条覆盖</text><rect x="350" y="104" width="260" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="362" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">插入</text><text x="362" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">- insert:</text><text x="362" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">  - id: my-tool</text><text x="362" y="169" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">    name: @me/dsh-tool-x</text><text x="362" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">    config: {...}</text><rect x="640" y="104" width="260" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="652" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">禁用</text><text x="652" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">- id: plugin-manager</text><text x="652" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">  disabled: true</text><text x="652" y="169" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75"></text><text x="652" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">保留 id，可再启用</text><text x="652" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不等于删除</text><rect x="60" y="300" width="840" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">!!js 谓词</text><text x="76" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">disabled 可以写成表达式：!!js "!ctx.get('profileContext')" 在装配期用 ctx 求值。</text><text x="76" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">同一个 bundle 在不同宿主里因此可以有不同行为，不需要两份文件。</text><text x="76" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">谓词在装配期同步求值；抛错会让整个 profile 起不来，所以不要在里面做重活。</text><text x="60" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">三种操作都不改变未指名的行；这是分层能收敛的前提。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / PATCH OPS</text>
</svg>
