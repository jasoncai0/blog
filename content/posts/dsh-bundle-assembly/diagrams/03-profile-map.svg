<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">五种 profile，四个共享 base</title>
<desc id="f03-desc">base 不是内核，只是一个被共同引用的组合包。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ASSEMBLY / PROFILES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">组合包之间的关系</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">sdk-minimal 刻意独立，用来演示最小组合。</text>
<rect x="60" y="150" width="240" height="90" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">dsh-base</text><text x="72" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">模型适配器 / 工具 / 持久化</text><text x="72" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">沙箱与审批 / 设置 / 凭据 / 遥测</text><rect x="360" y="104" width="260" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="372" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">web</text><text x="372" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">base + web-app</text><text x="372" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">浏览器应用 + 服务器</text><line x1="300" y1="195" x2="360" y2="149" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="650" y="104" width="260" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="662" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">headless</text><text x="662" y="139" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">base + headless</text><text x="662" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">一次性运行</text><line x1="300" y1="195" x2="650" y2="149" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="360" y="214" width="260" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="372" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">sdk</text><text x="372" y="249" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">base + sdk-app</text><text x="372" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">JSON-RPC 服务器</text><line x1="300" y1="195" x2="360" y2="259" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="650" y="214" width="260" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="662" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">acp</text><text x="662" y="249" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">base + acp-app</text><text x="662" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">仅自动化</text><line x1="300" y1="195" x2="650" y2="259" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="360" y="324" width="260" height="90" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="372" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">sdk-minimal</text><text x="372" y="359" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">自有完整配置树</text><text x="372" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不套 base</text><text x="60" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">四个 profile 的差异只在应用外壳：有没有服务器、浏览器客户端、RPC 入口。</text><text x="60" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">sdk-minimal 不套 base 是刻意的：套了之后读者看到的仍是一百多行默认值。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / PROFILES</text>
</svg>
