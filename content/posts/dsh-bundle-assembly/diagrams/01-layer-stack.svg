<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">五层叠加，每层按行 id 改写</title>
<desc id="f01-desc">起点是一条空列表；越靠上的层越接近用户意图。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ASSEMBLY / LAYERS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">配置是数据，不是分支</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">装配器里没有 if (mode)。</text>
<rect x="60" y="100" width="360" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">⑤ preset 内 patch</text><text x="72" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">某个 agent 的 config.plugins</text><rect x="60" y="178" width="360" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">④ --patch overlay</text><text x="72" y="213" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">命令行调用方</text><rect x="60" y="256" width="360" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">③ home patch</text><text x="72" y="291" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">$DSH_HOME 下的 profile 配置</text><rect x="60" y="334" width="360" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">② bundle 的 cordis.patch.yml</text><text x="72" y="369" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">组合包作者</text><rect x="60" y="412" width="360" height="62" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">① profile 的有序组合包</text><text x="72" y="447" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">DSH 随附</text><rect x="60" y="490" width="360" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="3 3"/><text x="76" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">空条目列表</text><text x="470" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">一条 patch</text><text x="470" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">按 id 找到行，替换整条 config，或插入新行。</text><text x="470" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">每行最多两层</text><text x="470" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">一个 bundle 层 + 一个用户层；再多的来源无法追溯。</text><text x="470" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">不做深合并</text><text x="470" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">替换意味着漏写的字段就是没了；数组不会被拼接。</text><text x="470" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#bf4520">行序无语义</text><text x="470" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">激活由依赖满足驱动，不由 YAML 位置驱动。</text><text x="470" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">越靠上的层越晚应用：用户改一条，bundle 的默认值被整条替换。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / LAYERS</text>
</svg>
