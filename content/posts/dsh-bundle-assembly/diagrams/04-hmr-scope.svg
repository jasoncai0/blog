<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">HMR 的两级作用域</title>
<desc id="f04-desc">配置变化重装配，模块变化重载插件；两者最终都落到 fiber 生命周期。</desc>
<rect width="960" height="480" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">ASSEMBLY / HMR</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">热重载不是另一套机制</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">它复用了依赖满足驱动的重载。</text>
<rect x="60" y="110" width="250" height="90" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">配置变了</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">cordis.patch.yml / home patch</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">重新装配，按 id 差分</text><rect x="60" y="240" width="250" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">模块变了</text><text x="72" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">root: [] 为空时不监视源码</text><text x="72" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">显式配置模块根才生效</text><rect x="380" y="170" width="230" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="392" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">受影响的 fiber</text><text x="392" y="205" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">卸载 → epoch 重算 → 装载</text><text x="392" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">依赖方因 uid 变化自动重载</text><rect x="680" y="170" width="220" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="692" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">未受影响的 fiber</text><text x="692" y="205" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不动</text><text x="692" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">服务可见性保持不变</text><line x1="310" y1="155" x2="380" y2="205" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><line x1="310" y1="285" x2="380" y2="235" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><line x1="610" y1="220" x2="680" y2="220" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><text x="60" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">headless / sdk / acp 默认关闭 HMR；sdk-minimal 不含它——这些形态进程存活短，热重载只增加不确定性。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / HMR</text>
</svg>
