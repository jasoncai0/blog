<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f3t f3d">
<title id="f3t">混合召回：两路并行，按排名融合</title>
<desc id="f3d">BM25 与 ANN 各出 50 条，RRF 融合后去重，30 条精排，6 条进上下文</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4b52"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8752a"/></marker></defs>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" letter-spacing="0.14em">RAG / HYBRID RECALL</text><text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">混合召回：两路并行，按排名融合</text><text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">BM25 与 ANN 各出 50 条，RRF 融合后去重，30 条精排，6 条进上下文</text>

<rect x="40" y="220" width="96" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="40" y="220" width="3" height="60" fill="#3d5a80"/><text x="52" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">Query</text><text x="52" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">原始问法</text>
<line x1="138" y1="250" x2="156" y2="250" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-blue)"/>
<rect x="158" y="220" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="158" y="220" width="3" height="60" fill="#5b4b8a"/><text x="170" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">改写</text><text x="170" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">归一化</text>
<path d="M 264 250 L 288 250 L 288 178 L 306 178" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<path d="M 264 250 L 288 250 L 288 322 L 306 322" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<rect x="308" y="148" width="168" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="308" y="148" width="3" height="64" fill="#2f6f5e"/><text x="320" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">BM25 top-50</text><text x="320" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">倒排 / match</text>
<rect x="308" y="290" width="168" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="308" y="290" width="3" height="64" fill="#2f6f5e"/><text x="320" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">ANN top-50</text><text x="320" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">HNSW / cosine</text>
<text x="322" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">同过滤条件</text>
<path d="M 478 180 L 512 180 L 512 240 L 534 240" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<path d="M 478 322 L 512 322 L 512 260 L 534 260" fill="none" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<rect x="536" y="208" width="120" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="536" y="208" width="3" height="82" fill="#5b4b8a"/><text x="548" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">RRF k=60</text><text x="548" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">score = Σ 1/(k+rank)</text><text x="548" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">去重 chunk_id</text>
<line x1="658" y1="249" x2="676" y2="249" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<rect x="678" y="208" width="104" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="678" y="208" width="3" height="82" fill="#5b4b8a"/><text x="690" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">精排 30</text><text x="690" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">cross-encoder</text><text x="690" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">80 ms 超时</text>
<line x1="784" y1="249" x2="802" y2="249" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/>
<rect x="804" y="208" width="116" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="804" y="208" width="3" height="82" fill="#3d5a80"/><text x="816" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">上下文 6</text><text x="816" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">父块 + 引用</text>
<text x="670" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="end">30 对</text>
<rect x="40" y="368" width="880" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="56" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">为什么按排名融合</text>
<text x="56" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">BM25 分数无界，余弦在 [-1,1]，直接加权求和要先归一化，而归一化参数每个领域都不同。RRF 只用名次，</text>
<text x="56" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">对两路分数量纲不敏感；k=60 让头部名次的差距变缓，避免单路第 1 名直接锁死排序。</text>
<text x="56" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">代价是丢掉分数幅度：两路都第 3 与一第 1 一第 5 得分接近；领域差距大时改用加权 RRF，系数用标注集调。</text>
</svg>