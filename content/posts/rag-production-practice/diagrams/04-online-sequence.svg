<line x1="900" y1="140" x2="900" y2="560" stroke="#3d5a80" stroke-width="0.8" stroke-dasharray="3 4"/>
<line x1="60" y1="172" x2="180" y2="172" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/><text x="120.0" y="167" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">① query</text>
<line x1="180" y1="200" x2="300" y2="200" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/><text x="240.0" y="195" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">② 查缓存</text>
