<line x1="420" y1="292" x2="540" y2="292" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#m-grey)"/><text x="480.0" y="287" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">④ BM25 top-50</text>
