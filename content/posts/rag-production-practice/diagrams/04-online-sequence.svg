<line x1="540" y1="352" x2="780" y2="352" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<text x="610" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">④ 50 条</text>
<line x1="660" y1="380" x2="780" y2="380" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
