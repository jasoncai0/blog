<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="f2t f2d">
<title id="f2t">离线摄入：一份文档，两套索引</title>
<desc id="f2d">解析、切块、富化后双写；别名切换完成发布，失败进死信重放</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b4b52"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8752a"/></marker></defs>
<rect width="960" height="500" fill="#f5f5f5"/>
<text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" letter-spacing="0.14em">RAG / INGESTION</text><text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">离线摄入：一份文档，两套索引</text><text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">解析、切块、富化后双写；别名切换完成发布，失败进死信重放</text>

<rect x="40" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="52" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">源文档</text><text x="52" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">PDF / Word / HTML</text>
<line x1="174" y1="157" x2="190" y2="157" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<rect x="193" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="205" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">解析</text><text x="205" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">版面 + OCR</text>
<line x1="327" y1="157" x2="343" y2="157" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<rect x="346" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="358" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">切块</text><text x="358" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">语义边界 350–450 字</text>
<line x1="480" y1="157" x2="496" y2="157" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<rect x="499" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="511" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">富化</text><text x="511" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">标题 / 实体 / ACL</text>
<line x1="633" y1="157" x2="649" y2="157" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<rect x="652" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="664" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">双写</text><text x="664" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">ES + 向量库</text>
<line x1="786" y1="157" x2="802" y2="157" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m-grey)"/>
<rect x="805" y="120" width="132" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="817" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">别名切换</text><text x="817" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">原子生效</text>
<text x="56" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#8a93a6">中间产物</text>
<text x="106" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">文本 + 版面</text>
<text x="106" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">doc_id</text>
<text x="259" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">chunk 列表</text>
<text x="259" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">chunk_id 稳定</text>
<text x="412" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">富化字段</text>
<text x="412" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">tenant / acl</text>
<text x="565" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">向量</text>
<text x="565" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">model_version</text>
<text x="718" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75" text-anchor="middle">两套索引</text>
<text x="718" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">content_hash</text>
<path d="M 784 170 L 796 170 L 796 306 L 778 306" fill="none" stroke="#9b4b52" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#m-red)"/>
<rect x="560" y="306" width="230" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="560" y="306" width="3" height="54" fill="#9b4b52"/><text x="572" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">重试 3 次 → 死信队列</text><text x="572" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">按 doc_id 重放，重放前查 content_hash</text>
<text x="40" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">增量：updated_at 水位 5 分钟一批；删除单独走事件流，不靠水位（删除不更新 updated_at）。</text>
<text x="40" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">发布：新索引写 chunks_v2 → 抽检 100 条 query → 切别名 → 旧索引保留 24 小时可回滚。</text>
<text x="40" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">每个块记录 parser_version / model_version / content_hash，重建时按版本重放，不依赖源系统可访问。</text>
</svg>