<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">崩溃后的三种尾巴</title>
<desc id="f03-desc">持久化只丢撕裂片段；打开的轮次原样返回，由读方配平。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">AT REST / CRASH</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">谁修，取决于谁有写所有权</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">没有 turn/end 的日志不是坏日志。</text>
<rect x="60" y="110" width="250" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">撕裂片段</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不完整的一次 append</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">丢弃；Zstd 部分帧</text><rect x="340" y="110" width="250" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="352" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">完整记录</text><text x="352" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">帧内可解码的部分</text><text x="352" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">保留并重写</text><rect x="620" y="110" width="300" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="632" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">打开的轮次</text><text x="632" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">有 turn/start 无 turn/end</text><text x="632" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不截断、不补事件</text><rect x="60" y="280" width="420" height="120" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">resume（写句柄）</text><text x="72" y="315" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">计算 interruptedTurnClosers</text><text x="72" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">补 tool/result → step/end → turn/end{interrupted}</text><text x="72" y="345" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">作为普通批次 append，回写</text><rect x="520" y="280" width="400" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="532" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">只读观察（session-query）</text><text x="532" y="315" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">在内存里用同样事件配平</text><text x="532" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不回写任何内容</text><text x="532" y="345" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">按 stat().revision 缓存</text><line x1="770" y1="200" x2="770" y2="280" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><line x1="280" y1="200" x2="280" y2="280" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><text x="60" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">写租约保证修复不与活跃轮次竞速：并发的 open(id, write) 直接拒绝。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / CRASH</text>
</svg>
