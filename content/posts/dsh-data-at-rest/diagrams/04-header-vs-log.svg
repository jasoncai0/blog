<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">header、元数据、日志，三者分开</title>
<desc id="f04-desc">只有日志参与重放；header 影响恢复时的行为。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">AT REST / HEADER</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">什么该进 header</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">判据：不持久会不会让恢复后的行为变错。</text>
<rect x="60" y="110" width="250" height="190" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">SessionHeader</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">version / cwd</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">parentSession / isSeeded</text><text x="72" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">origin / delegationDepth</text><text x="72" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">agentPreset</text><rect x="350" y="110" width="240" height="120" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="362" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">存储元数据</text><text x="362" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">inheritedEventCount</text><text x="362" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">fork 的精确切点</text><rect x="630" y="110" width="270" height="190" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="642" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">事件日志</text><text x="642" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">turn/step/message/tool</text><text x="642" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">surfaceOp 与 sourceEventSeqs</text><text x="642" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">deriveMessages() 的唯一输入</text><text x="60" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">delegationDepth 只在内存里：重启子会话会变回顶层，递归预算失效。</text><text x="60" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">agentPreset 不入盘：resume 可能换一套工具重放历史，模型无法执行。</text><text x="60" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">inheritedEventCount 不是 header 字段：它是物理切点，不是会话内容。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / HEADER</text>
</svg>
