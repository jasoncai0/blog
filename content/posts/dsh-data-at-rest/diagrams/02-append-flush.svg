<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">append 排序，flush 承诺</title>
<desc id="f02-desc">中间隔着一个有界写后窗口；窗口里崩溃就丢这一批。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">AT REST / DURABILITY</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">两个词，两种保证</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">把 append 当落盘是最常见的误读。</text>
<rect x="60" y="120" width="180" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">session/event</text><text x="72" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">同步通知</text><text x="72" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不阻塞生产方</text><rect x="300" y="120" width="200" height="90" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="312" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">写后窗口</text><text x="312" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">首个事件开固定截止</text><text x="312" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">后来者不续期</text><rect x="560" y="120" width="180" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="572" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">一次持久 append</text><text x="572" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">本实例可见、有序</text><rect x="800" y="120" width="120" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="812" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">磁盘</text><text x="812" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">flush 后保证</text><line x1="240" y1="165" x2="300" y2="165" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><line x1="500" y1="165" x2="560" y2="165" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><line x1="740" y1="165" x2="800" y2="165" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="300" y="270" width="420" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="312" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">窗口到期前崩溃</text><text x="312" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">已 append 的事件丢失</text><text x="312" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">日志回到上一批</text><text x="312" y="335" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">恢复时配平成 interrupted turn</text><line x1="400" y1="212" x2="400" y2="270" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#f02-g)"/><text x="60" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">session/flush 取消等待并排空：loop 在领下一个普通轮次前调用它，作为顺序与错误的检查点。</text><text x="60" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">后台写失败：按序保留事件、暂停自动路径、logger 报告；下一次显式 flush 重试并向调用方拒绝。</text><text x="60" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">要更强的一致性，provider 可以把 append 实现成同步落盘；产品默认不这么做。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / DURABILITY</text>
</svg>
