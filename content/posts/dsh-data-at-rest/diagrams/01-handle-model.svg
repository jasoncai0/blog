<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">句柄是唯一入口</title>
<desc id="f01-desc">create/open 返回通道；read 与 write 同类型，靠 access 区分。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">AT REST / HANDLES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一次打开，一条通道</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">按 id 寻址的服务方法不存在。</text>
<rect x="60" y="110" width="230" height="120" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">ctx.sessionPersistence</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">create / open</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">stat / list</text><rect x="400" y="96" width="250" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="412" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">write 句柄</text><text x="412" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">append / flush</text><text x="412" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">持有写租约</text><rect x="400" y="206" width="250" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="412" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">read 句柄</text><text x="412" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">只读；单调读</text><text x="412" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">append 抛 SessionReadOnlyError</text><rect x="720" y="96" width="180" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="732" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">第二个写打开</text><text x="732" y="131" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">SessionAlreadyOwned</text><rect x="720" y="206" width="180" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="732" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">关闭后</text><text x="732" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">SessionHandleClosed</text><line x1="290" y1="150" x2="400" y2="134" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="290" y1="180" x2="400" y2="244" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="650" y1="134" x2="720" y2="134" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><line x1="650" y1="244" x2="720" y2="244" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><text x="60" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">句柄是单所有者状态，不是共享服务：read 不回退到已观察位置之前。</text><text x="60" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">close() 幂等、不可取消；关闭后的任何操作都拒绝。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / HANDLES</text>
</svg>
