<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t21 d21">
  <title id="t21">四层：外观、编排、执行、供给</title>
  <desc id="d21">外观层给意图，编排层（daemon）给状态与派发，执行层（用户装的 CLI）给推理与工具循环，供给层给算力与生成模型。通往供给层有两条互不共用凭据的线。</desc>
  <defs>
    <marker id="a21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/>
    </marker>
    <marker id="a21acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="36" y="26" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">FOUR LAYERS · surface · orchestration · execution · supply</text>
  <text x="36" y="52" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">四层：外观、编排、执行、供给</text>
  <text x="924" y="52" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">职责分层，不是进程分层</text>

  <!-- Layer 1: surface -->
  <rect x="36" y="84" width="584" height="80" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
  <text x="50" y="106" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">① 外观层</text>
  <text x="112" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8f97ad">apps/web + Electron 外壳 · 同源</text>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">
    <rect x="50" y="116" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="138" y="130" text-anchor="middle">交互与通道</text>
    <text x="138" y="143" text-anchor="middle" font-size="7.5" fill="#8f97ad">对话、面板、标签</text>
    <rect x="238" y="116" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="326" y="130" text-anchor="middle">预览与渲染</text>
    <text x="326" y="143" text-anchor="middle" font-size="7.5" fill="#8f97ad">iframe、沙箱、桥</text>
    <rect x="426" y="116" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="514" y="130" text-anchor="middle">导出入口</text>
    <text x="514" y="143" text-anchor="middle" font-size="7.5" fill="#8f97ad">PDF / PPTX / ZIP</text>
  </g>

  <!-- gap 1 -->
  <g stroke="#5a6580" stroke-width="1.2" fill="none" marker-end="url(#a21)">
    <line x1="150" y1="164" x2="150" y2="212"/>
    <line x1="480" y1="214" x2="480" y2="166"/>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5">
    <text x="160" y="182" fill="#2d3142">POST /api/chat · 请求</text>
    <text x="470" y="182" fill="#2d3142" text-anchor="end">SSE · text_delta / file-changed</text>
    <text x="320" y="204" fill="#4f5d75" font-size="8" text-anchor="middle">同源边界：web 只认 contracts 的 DTO，不 import daemon</text>
  </g>

  <!-- Layer 2: orchestration -->
  <rect x="36" y="216" width="584" height="88" rx="2" fill="#2d3142"/>
  <text x="50" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#f5f5f5">② 编排层 · daemon</text>
  <text x="168" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8f97ad">127.0.0.1:7456 · SQLite + 项目目录</text>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#c9cedb">
    <rect x="50" y="250" width="134" height="38" rx="2" fill="#3a4152"/>
    <text x="117" y="266" text-anchor="middle" fill="#f5f5f5">项目与数据根</text>
    <text x="117" y="279" text-anchor="middle" font-size="7.5" fill="#a9b1c4">文件是唯一真相</text>
    <rect x="192" y="250" width="134" height="38" rx="2" fill="#3a4152"/>
    <text x="259" y="266" text-anchor="middle" fill="#f5f5f5">提示拼装</text>
    <text x="259" y="279" text-anchor="middle" font-size="7.5" fill="#a9b1c4">元数据 / 契约 / 模板</text>
    <rect x="334" y="250" width="134" height="38" rx="2" fill="#3a4152"/>
    <text x="401" y="266" text-anchor="middle" fill="#f5f5f5">run 生命周期</text>
    <text x="401" y="279" text-anchor="middle" font-size="7.5" fill="#a9b1c4">SSE / 判定 / 恢复</text>
    <rect x="476" y="250" width="134" height="38" rx="2" fill="#3f3a3a" stroke="#bf4520" stroke-width="0.8"/>
    <text x="543" y="266" text-anchor="middle" fill="#f0b39c">媒体派发</text>
    <text x="543" y="279" text-anchor="middle" font-size="7.5" fill="#c9a396">供应商 key 留在这里</text>
  </g>

  <!-- gap 2 -->
  <g stroke="#5a6580" stroke-width="1.2" fill="none" marker-end="url(#a21)">
    <line x1="150" y1="304" x2="150" y2="352"/>
    <line x1="480" y1="354" x2="480" y2="306"/>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5">
    <text x="160" y="322" fill="#2d3142">spawn · argv + stdin</text>
    <text x="470" y="322" fill="#2d3142" text-anchor="end">stdout 流</text>
    <text x="320" y="344" fill="#4f5d75" font-size="8" text-anchor="middle">子进程边界：下行只有令牌与路径，上行只有事件流</text>
  </g>

  <!-- Layer 3: execution -->
  <rect x="36" y="356" width="584" height="88" rx="2" fill="#2d3142"/>
  <text x="50" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#f5f5f5">③ 执行层 · CLI agent</text>
  <text x="180" y="380" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8f97ad">用户机器上的进程 · 27 个 adapter 只描述怎么叫它</text>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#c9cedb">
    <rect x="50" y="390" width="176" height="38" rx="2" fill="#3a4152"/>
    <text x="138" y="406" text-anchor="middle" fill="#f5f5f5">agent loop</text>
    <text x="138" y="419" text-anchor="middle" font-size="7.5" fill="#a9b1c4">调模型 → 执行工具 → 回填</text>
    <rect x="238" y="390" width="176" height="38" rx="2" fill="#3a4152"/>
    <text x="326" y="406" text-anchor="middle" fill="#f5f5f5">工具与沙箱</text>
    <text x="326" y="419" text-anchor="middle" font-size="7.5" fill="#a9b1c4">Bash / 读写 / 权限</text>
    <rect x="426" y="390" width="176" height="38" rx="2" fill="#3a4152"/>
    <text x="514" y="406" text-anchor="middle" fill="#f5f5f5">会话与 transcript</text>
    <text x="514" y="419" text-anchor="middle" font-size="7.5" fill="#a9b1c4">上下文、压缩、resume</text>
  </g>

  <!-- gap 3 -->
  <g stroke="#5a6580" stroke-width="1.2" fill="none" marker-end="url(#a21)">
    <line x1="150" y1="444" x2="150" y2="492"/>
    <line x1="480" y1="494" x2="480" y2="446"/>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5">
    <text x="160" y="462" fill="#2d3142">HTTPS · 用户凭据</text>
    <text x="470" y="462" fill="#2d3142" text-anchor="end">tokens · 按量计费</text>
    <text x="320" y="484" fill="#4f5d75" font-size="8" text-anchor="middle">网络边界：LLM 的账号在 CLI 手里，daemon 不知道</text>
  </g>

  <!-- Layer 4: supply -->
  <rect x="36" y="496" width="584" height="80" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
  <text x="50" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">④ 供给层</text>
  <text x="112" y="518" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8f97ad">供应商机房 · 权重、算力与生成模型都在这边</text>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">
    <rect x="50" y="528" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="138" y="542" text-anchor="middle">token 推理（LLM）</text>
    <text x="138" y="555" text-anchor="middle" font-size="7.5" fill="#8f97ad">执行层调</text>
    <rect x="238" y="528" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="326" y="542" text-anchor="middle">生成模型</text>
    <text x="326" y="555" text-anchor="middle" font-size="7.5" fill="#8f97ad">图像 / 视频 / 音频</text>
    <rect x="426" y="528" width="176" height="34" rx="2" fill="#ececec"/>
    <text x="514" y="542" text-anchor="middle">鉴权、计费、流式</text>
    <text x="514" y="555" text-anchor="middle" font-size="7.5" fill="#8f97ad">两边各自结算</text>
  </g>

  <!-- route: media (orchestration -> supply) -->
  <path d="M620,270 H676 V530 H626" stroke="#bf4520" stroke-width="1.3" fill="none" marker-end="url(#a21acc)"/>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5">
    <text x="684" y="236" fill="#bf4520">生成模型：编排层直连</text>
    <text x="684" y="250" fill="#8f97ad" font-size="7.5">供应商 key 只在 daemon 环境</text>
    <text x="684" y="264" fill="#8f97ad" font-size="7.5">agent 只能拿令牌派发</text>
  </g>

  <!-- route: BYOK (orchestration -> supply, skipping execution) -->
  <path d="M620,296 H716 V562 H626" stroke="#5a6580" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#a21)"/>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5">
    <text x="724" y="360" fill="#2d3142">旁路 · BYOK 直连</text>
    <text x="724" y="374" fill="#8f97ad" font-size="7.5">跳过执行层，没有工具</text>
    <text x="724" y="388" fill="#8f97ad" font-size="7.5">产物只能是一个文本块</text>
  </g>

  <!-- MCP reverse -->
  <path d="M36,400 H14 V260 H30" stroke="#5a6580" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#a21)"/>
  <text x="9" y="330" transform="rotate(-90 9 330)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">MCP</text>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">
    <text x="36" y="598">① 编排层不调 LLM：会话、提示、产物、派发都在 daemon，模型推理在 ③ 的子进程里。唯一例外是右侧那条 BYOK 直连。</text>
    <text x="36" y="616">② 通往供给层的两条线互不共用凭据：媒体用 daemon 的供应商 key，LLM 用 CLI 的账号。所以换模型不动 OD，换供应商不动 CLI。</text>
    <text x="36" y="634">③ 左侧虚线是反向胶水：od mcp install 把 OD 的 22 个工具注册进 CLI，反过来让终端操作 OD；这 22 个里没有媒体生成。</text>
    <text x="36" y="650" fill="#8f97ad" font-size="8.5">刻度：外观层给意图，编排层给状态，执行层给推理与工具，供给层给算力。</text>
  </g>
</svg>
