<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-t f04-d">
  <title id="f04-t">工具列表变化如何到达模型</title>
  <desc id="f04-d">四列时间线：启动时工具 a、b 进入 header H1；服务器发出 list_changed 通知，客户端串行刷新，模型此刻无感；清单变成 a、b、c 后整批换代，header 变成 H2 并追加 tool-addition；给弃后工具清空，header 变成空表并写 tool-removal。</desc>
  <defs>
    <marker id="f04-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f04-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f04-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">S2-05 / TOOL LIST CHANGE</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">服务器改了工具表，模型什么时候知道</text>
  <text x="40" y="80" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">通知只是触发刷新；真正改变模型可见 schema 的是请求头重算与一条 developer 消息</text>

  <line x1="60" y1="98" x2="912" y2="98" stroke="#c9cdd6" stroke-width="1" marker-end="url(#f04-a)"/>
  <text x="880" y="92" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">t</text>

  <text x="60" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">T0 启动</text>
  <text x="280" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">T1 通知</text>
  <text x="500" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">T2 换代</text>
  <text x="720" y="118" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">T3 给弃</text>

  <text x="60" y="146" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.08em" fill="#bf4520">MCP SERVER</text>
  <rect x="60" y="154" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">握手成功</text>
  <text x="72" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">listTools → [a, b]</text>
  <text x="72" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">工具数量与顺序都由服务器决定</text>

  <rect x="280" y="154" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="292" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">工具表变化</text>
  <text x="292" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">tools/list_changed</text>
  <text x="292" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">或新协议的订阅通知</text>

  <rect x="500" y="154" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="512" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">重新列举</text>
  <text x="512" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">listTools → [a, b, c]</text>
  <text x="512" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">cacheMode: refresh</text>

  <rect x="720" y="154" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="4 3"/>
  <text x="732" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">进程退出</text>
  <text x="732" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">10 次重连全失败</text>
  <text x="732" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">150 秒后放弃</text>

  <text x="60" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.08em" fill="#bf4520">mcp-client</text>
  <rect x="60" y="270" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">syncTools 两阶段</text>
  <text x="72" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">fetch → swap</text>
  <text x="72" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">全量注册，模型看到全量或零</text>

  <rect x="280" y="270" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="292" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">refreshTools</text>
  <text x="292" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">enqueueSync 串行链</text>
  <text x="292" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">刷新失败只 log，保留上一代</text>

  <rect x="500" y="270" width="200" height="86" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <rect x="500" y="270" width="3" height="86" fill="#bf4520"/>
  <text x="512" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">先卸后装，失败回滚</text>
  <text x="512" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">dispose(previous) → register()</text>
  <text x="512" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">任一冲突：整批回滚 + lost</text>

  <rect x="720" y="270" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="732" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">clearTools</text>
  <text x="732" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">status: failed / gave-up</text>
  <text x="732" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">指令一起清空</text>

  <text x="60" y="382" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.08em" fill="#bf4520">MODEL-VISIBLE</text>
  <rect x="60" y="390" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="72" y="410" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">header H1</text>
  <text x="72" y="426" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">tools[] = [a, b]</text>
  <text x="72" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">mcp__pg__a · mcp__pg__b</text>

  <rect x="280" y="390" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="4 3"/>
  <text x="292" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">这一轮没有变化</text>
  <text x="292" y="426" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">刷新是后台动作，不改当前请求</text>
  <text x="292" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">下一步组装时才重算</text>

  <rect x="500" y="390" width="200" height="86" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="512" y="410" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">header H2</text>
  <text x="512" y="426" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">tools[] = [a, b, c]</text>
  <text x="512" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">+ developer：tool-addition c</text>

  <rect x="720" y="390" width="200" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="732" y="410" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">header H3</text>
  <text x="732" y="426" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">tools[] = []</text>
  <text x="732" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">+ tool-removal a, b, c</text>

  <line x1="160" y1="240" x2="160" y2="270" stroke="#8a93a6" stroke-width="1" marker-end="url(#f04-a)"/>
  <line x1="380" y1="240" x2="380" y2="270" stroke="#8a93a6" stroke-width="1" marker-end="url(#f04-a)"/>
  <line x1="600" y1="240" x2="600" y2="270" stroke="#8a93a6" stroke-width="1" marker-end="url(#f04-a)"/>
  <line x1="820" y1="240" x2="820" y2="270" stroke="#bf4520" stroke-width="1" marker-end="url(#f04-r)"/>

  <line x1="160" y1="356" x2="160" y2="390" stroke="#8a93a6" stroke-width="1" marker-end="url(#f04-a)"/>
  <line x1="380" y1="356" x2="380" y2="390" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#f04-a)"/>
  <line x1="600" y1="356" x2="600" y2="390" stroke="#bf4520" stroke-width="1" marker-end="url(#f04-r)"/>
  <line x1="820" y1="356" x2="820" y2="390" stroke="#8a93a6" stroke-width="1" marker-end="url(#f04-a)"/>

  <rect x="60" y="500" width="860" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="74" y="520" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.08em" fill="#bf4520">同一份清单，三种路由代价</text>
  <text x="74" y="538" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">支持 toolUpdate: in-history 的路由只追加 addition，删除工具不改 tools[]；其余路由每一步重发完整清单</text>
  <text x="74" y="554" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">服务器返回顺序不稳定时，集合没变、字节变了，请求头照样重写；顺序是服务器要保证的契约</text>
</svg>
