<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="f2t f2d"><title id="f2t">经验条目的状态机</title><desc id="f2d">候选经独立任务与四套题验证进入已验证，人签后进入发布包生效；护栏破线转停用，版本变更或连续失败转过期；反例推翻直接丢弃。</desc><defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="ar2m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="100%" fill="#f5f5f5"/><text x="40" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">EXPERIENCE LAYER · 02</text><text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">条目有自己的状态机，bundle 回滚不改它</text><text x="40" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">晋升看证据，退役看版本；停在候选和过期都不是失败，是账本的一部分</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="180" width="160" height="84" rx="6" fill="#e9eff6"/><rect x="60" y="180" width="4" height="84" fill="#3d5a80"/><text x="78" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">候选</text><text x="78" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#3d5a80" text-anchor="start" letter-spacing="0.8">CANDIDATE</text><text x="78" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">证据成立</text><text x="78" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">失效条件已写</text><rect x="300" y="180" width="160" height="84" rx="6" fill="#e9f2ed"/><rect x="300" y="180" width="4" height="84" fill="#2f6f5e"/><text x="318" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">已验证</text><text x="318" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#2f6f5e" text-anchor="start" letter-spacing="0.8">VERIFIED</text><text x="318" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">证据可复核</text><text x="318" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">反例 0 误触发</text><rect x="540" y="180" width="160" height="84" rx="6" fill="#efeaf6"/><rect x="540" y="180" width="4" height="84" fill="#5b4b8a"/><text x="558" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">生效</text><text x="558" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">ACTIVE</text><text x="558" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">进入 bundle</text><text x="558" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">按租户灰度</text><rect x="780" y="180" width="160" height="84" rx="6" fill="#f8eae8"/><rect x="780" y="180" width="4" height="84" fill="#9b4b52"/><text x="798" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">停用</text><text x="798" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#9b4b52" text-anchor="start" letter-spacing="0.8">SUSPENDED</text><text x="798" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">护栏破线</text><text x="798" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">立即停止召回</text><rect x="300" y="380" width="160" height="84" rx="6" fill="#eeeeee"/><rect x="300" y="380" width="4" height="84" fill="#8a93a6"/><text x="318" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">过期</text><text x="318" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.8">EXPIRED</text><text x="318" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">停止召回</text><text x="318" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">保留审计，可派生</text><rect x="60" y="380" width="160" height="84" rx="6" fill="#f0f0f0" stroke-dasharray="4 3"/><rect x="60" y="380" width="4" height="84" fill="#6b7280"/><text x="78" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">丢弃</text><text x="78" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#6b7280" text-anchor="start" letter-spacing="0.8">REJECTED</text><text x="78" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">反例推翻</text><text x="78" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">不删除，留档</text><text x="258" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">2 独立任务</text><text x="258" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">+ 1 新任务</text><text x="498" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">四套题全过</text><text x="498" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">+ 人签</text><text x="738" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">护栏破线</text><path d="M620,264 L620,376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ar2)"/><text x="630" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="start">版本变更</text><text x="630" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="start">或连续失败</text><path d="M780,422 L464,422" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ar2)"/><text x="622" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4f5d75" text-anchor="middle">两周未修复</text><path d="M140,264 L140,376" fill="none" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar2m)"/><text x="150" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#8a93a6" text-anchor="start">反例推翻</text><text x="150" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#8a93a6" text-anchor="start">或证据失效</text><text x="40" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#8a93a6" text-anchor="start">过期后重新核验：新建候选并写 derived_from，不复活旧条目。状态变更只追加事件，不覆盖历史。</text></svg>