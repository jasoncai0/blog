<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="f1t f1d"><title id="f1t">设计 Agent 经验层的五段管线</title><desc id="f1d">执行记录经归因与回放写成经验条目，在下一次任务决策前召回，再经四套题与灰度进入发布包；虚线表示下一轮任务产生新记录。</desc><defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="ar1d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="100%" fill="#f5f5f5"/><text x="40" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">EXPERIENCE LAYER · 01</text><text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">一条失败走过五段，才变成下一次的提醒</text><text x="40" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">前两段回答「为什么错」，中间一段回答「存什么」，后两段回答「什么时候用、什么时候撤」</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><text x="36" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="1.2">01</text><rect x="36" y="160" width="152" height="100" rx="6" fill="#efeaf6"/><rect x="36" y="160" width="4" height="100" fill="#5b4b8a"/><text x="54" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">执行与记录</text><text x="54" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">任务卡 · 工具调用</text><text x="54" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">画布操作 · 版本号</text><text x="220" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#bf4520" text-anchor="start" letter-spacing="1.2">02</text><rect x="220" y="160" width="152" height="100" rx="6" fill="#f7efe4"/><rect x="220" y="160" width="4" height="100" fill="#bf4520"/><text x="238" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">归因与回放</text><text x="238" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">固定快照改一个变量</text><text x="238" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">L1–L4 分级</text><text x="404" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#2f6f5e" text-anchor="start" letter-spacing="1.2">03</text><rect x="404" y="160" width="152" height="100" rx="6" fill="#e9f2ed"/><rect x="404" y="160" width="4" height="100" fill="#2f6f5e"/><text x="422" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">写成条目</text><text x="422" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">范围 · 症状 · 做法</text><text x="422" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">证据 · 反例 · 失效</text><text x="588" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#3d5a80" text-anchor="start" letter-spacing="1.2">04</text><rect x="588" y="160" width="152" height="100" rx="6" fill="#e9eff6"/><rect x="588" y="160" width="4" height="100" fill="#3d5a80"/><text x="606" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">决策前召回</text><text x="606" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">检索前 / 组装前</text><text x="606" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">最多 2 条 · 300 token</text><text x="772" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="1.2">05</text><rect x="772" y="160" width="152" height="100" rx="6" fill="#f2ece2"/><rect x="772" y="160" width="4" height="100" fill="#a8752a"/><text x="790" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">验证与发布</text><text x="790" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">四套题 · 5% 灰度</text><text x="790" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">bundle 回滚</text><text x="40" y="296" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="600" fill="#8a93a6" text-anchor="start" letter-spacing="0.8">落库 / 传递对象</text><line x1="40" y1="306" x2="920" y2="306" stroke="#e2e2e2" stroke-width="1"/><text x="36" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="start">trace.jsonl</text><text x="36" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">任务卡 + 品牌包/资产树版本</text><text x="36" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">证据指针：字段路径与值</text><line x1="204" y1="316" x2="204" y2="380" stroke="#e6e6e6" stroke-width="1" stroke-dasharray="2 3"/><text x="220" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="start">evidence_bundle</text><text x="220" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">四类证据 + 回放 diff</text><text x="220" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">C/D 档只记待查问题，不建条目</text><line x1="388" y1="316" x2="388" y2="380" stroke="#e6e6e6" stroke-width="1" stroke-dasharray="2 3"/><text x="404" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="start">experience.yaml</text><text x="404" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">status · depends_on</text><text x="404" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">expires_when 写不出就不入库</text><line x1="572" y1="316" x2="572" y2="380" stroke="#e6e6e6" stroke-width="1" stroke-dasharray="2 3"/><text x="588" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="start">prompt 片段</text><text x="588" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">experience_ids 进决策记录</text><text x="588" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">命中 / 误触发结束后回填</text><line x1="756" y1="316" x2="756" y2="380" stroke="#e6e6e6" stroke-width="1" stroke-dasharray="2 3"/><text x="772" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="start">bundle vN</text><text x="772" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">经验 + Skill + prompt + 旋钮</text><text x="772" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">灰度 24h · 回滚 60s</text><path d="M848,160 L848,124 L112,124 L112,156" fill="none" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar1d)"/><text x="480" y="117" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle">新一轮任务产生新 trace，回到第一段</text><text x="40" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#8a93a6" text-anchor="start">这一段缩短的是 T_policy（经验从观察到生效的时间），不是模型代际。</text></svg>