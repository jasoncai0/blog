<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="f3t f3d"><title id="f3t">经验进入发布包的四道闸</title><desc id="f3d">程序约束与离线四套题自动判定，线上灰度自动放量或回滚，文案与跨租户变更由人签；裁判模型只提供线索，不单独放行。</desc><defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker></defs><rect width="960" height="100%" fill="#f5f5f5"/><text x="40" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">EXPERIENCE LAYER · 03</text><text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">四道闸，能自动的往下放</text><text x="40" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">每层只回答自己能回答的问题；裁判模型提供线索，不单独放行</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="140" width="620" height="68" rx="6" fill="#f2ece2"/><rect x="60" y="140" width="4" height="68" fill="#a8752a"/><text x="80" y="166" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="1.2">G3</text><text x="112" y="167" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">人审</text><text x="112" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">文案改动、跨租户、新依赖</text><text x="112" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">人签名后才进 bundle</text><rect x="720" y="154" width="200" height="40" rx="6" fill="#ffffff" stroke="#a8752a" stroke-width="1"/><text x="820" y="173" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#a8752a" text-anchor="middle">人工签名</text><rect x="60" y="236" width="620" height="68" rx="6" fill="#efeaf6"/><rect x="60" y="236" width="4" height="68" fill="#5b4b8a"/><text x="80" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="1.2">G2</text><text x="112" y="263" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">线上灰度</text><text x="112" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">5% 租户 · 24h</text><text x="112" y="298" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">通过率 −1pp / 成本 +10% / P95 +15%</text><rect x="720" y="250" width="200" height="40" rx="6" fill="#ffffff" stroke="#5b4b8a" stroke-width="1"/><text x="820" y="269" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a" text-anchor="middle">自动放量或回滚</text><rect x="60" y="332" width="620" height="68" rx="6" fill="#e9f2ed"/><rect x="60" y="332" width="4" height="68" fill="#2f6f5e"/><text x="80" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#2f6f5e" text-anchor="start" letter-spacing="1.2">G1</text><text x="112" y="359" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">离线四套题</text><text x="112" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">修复 / 泛化 / 反例 / 回归</text><text x="112" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">四套全过才进候选池；反例 0 误触发</text><rect x="720" y="346" width="200" height="40" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-width="1"/><text x="820" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2f6f5e" text-anchor="middle">自动进候选</text><rect x="60" y="428" width="620" height="68" rx="6" fill="#e9eff6"/><rect x="60" y="428" width="4" height="68" fill="#3d5a80"/><text x="80" y="454" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" font-weight="600" fill="#3d5a80" text-anchor="start" letter-spacing="1.2">G0</text><text x="112" y="455" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="start">程序约束</text><text x="112" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">约束检查器、schema、权限</text><text x="112" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">缺资产 / 越界 / 禁用色 / 无权限 → 拦</text><rect x="720" y="442" width="200" height="40" rx="6" fill="#ffffff" stroke="#3d5a80" stroke-width="1"/><text x="820" y="461" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#3d5a80" text-anchor="middle">自动拦截</text><rect x="60" y="512" width="860" height="36" rx="6" fill="#f8eae8" stroke="#9b4b52" stroke-width="1" stroke-dasharray="4 3"/><rect x="60" y="512" width="4" height="36" fill="#9b4b52"/><text x="80" y="535" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#9b4b52" text-anchor="start">裁判模型只做诊断：它说「可能违反留白」，要回到 G0 或人审确认，不能单独触发发布。</text></svg>