<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">评测系统全景：四个模块、两条 Loop、一套资产</title><desc id="f0-d">离线评测、在线评测与监控、Case 挖掘与归因、观测基建四个模块，被评测资产和两条迭代 Loop 咬合在一起。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="650" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">EVAL SYSTEM · LANDSCAPE</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">四个模块、两条 Loop、一套资产，咬合成一台机器</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">离线守住已知，在线发现未知，归因负责定位，观测是地基</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="140" width="280" height="180" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="156" width="72.21" height="17" rx="8.5" fill="#f8e8e3" stroke="none" stroke-width="1"/><text x="100.1" y="167.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#bf4520" text-anchor="middle">模块 1 · 变更门控</text><text x="64.0" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">离线评测</text><text x="64.0" y="222.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">冻结输入包，回放同一批 Task</text><text x="64.0" y="242.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">每任务 3 次 trial × 4 个候选</text><text x="64.0" y="262.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">红 / 黄 / 绿三档判定</text><rect x="64" y="286" width="58.0" height="17" rx="8.5" fill="#e9f1ed" stroke="none" stroke-width="1"/><text x="93.0" y="297.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#2f6f5e" text-anchor="middle">红灯阻断合并</text><rect x="632" y="140" width="280" height="180" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="648" y="156" width="72.21" height="17" rx="8.5" fill="#e8eef5" stroke="none" stroke-width="1"/><text x="684.1" y="167.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#3d5a80" text-anchor="middle">模块 2 · 发现未知</text><text x="648.0" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">在线评测 + 监控</text><text x="648.0" y="222.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">影子并跑 / AB 分桶 / 每周巡检</text><text x="648.0" y="242.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">采纳率、导出率、编辑深度</text><text x="648.0" y="262.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">工具成功率、成本、P95</text><rect x="648" y="286" width="116.10000000000001" height="17" rx="8.5" fill="#e8eef5" stroke="none" stroke-width="1"/><text x="706.0" y="297.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#3d5a80" text-anchor="middle">设计特有：渲染 / 色差 / 安全区</text><rect x="352" y="140" width="256" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="480.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">发布 / 灰度 / 回滚</text><text x="480.0" y="184.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">门禁之外不发布</text><path d="M328,172 L348,172" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><path d="M608,172 L628,172" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="352" y="232" width="256" height="96" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><rect x="368" y="246" width="30.0" height="17" rx="8.5" fill="#eee9e4" stroke="none" stroke-width="1"/><text x="383.0" y="257.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#7a6a5e" text-anchor="middle">资产</text><text x="368.0" y="284.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">评测集 + Rubric</text><text x="368.0" y="302.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#4f5d75" text-anchor="start">黄金 40 / 必过 80 / 挑战 30</text><text x="368.0" y="318.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#4f5d75" text-anchor="start">错题集只增不减</text><path d="M352,280 L332,280" fill="none" stroke="#8a93a6" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M480,328 L480,394" fill="none" stroke="#8a93a6" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#f0-a-muted)"/><text x="488.0" y="370.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="start">补进 / 淘汰</text><rect x="330" y="400" width="300" height="128" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="346" y="416" width="58.21" height="17" rx="8.5" fill="#eee9e4" stroke="none" stroke-width="1"/><text x="375.1" y="427.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#7a6a5e" text-anchor="middle">模块 3 · 枢纽</text><text x="346.0" y="458.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Case 挖掘与归因</text><text x="346.0" y="480.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">六类来源 → Case 池 → 十个筐</text><text x="346.0" y="500.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">出口只有两个：改 Agent，或改量具</text><path d="M772,320 L772,360 L630,360 L630,396" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><text x="640.0" y="352.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#5a6580" text-anchor="start">异常信号 / 样本</text><path d="M330,464 L240,464 L240,326" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><text x="232.0" y="392.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#5a6580" text-anchor="end">补样本 / 改 Rubric</text><text x="232.0" y="410.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#5a6580" text-anchor="end">或改召回 / 预算配置</text><rect x="48" y="570" width="864" height="56" rx="6" fill="#efefee" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="586" width="30.0" height="17" rx="8.5" fill="#e2e2df" stroke="none" stroke-width="1"/><text x="79.0" y="597.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="600" fill="#5a6580" text-anchor="middle">地基</text><text x="126.0" y="596.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#4f5d75" text-anchor="start">观测基建：trace、画布 op 流、检索日志、产物指纹、判分记录</text><text x="126.0" y="613.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="start">最小可归因 = 任取一条 Bad Case，能凭记录重放</text><line x1="120" y1="566" x2="120" y2="324" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="2 4"/><line x1="480" y1="566" x2="480" y2="532" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="2 4"/><line x1="840" y1="566" x2="840" y2="324" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="2 4"/></svg>