<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">一个设计 Task 的三段结构：输入包、过程期望、验收</title><desc id="f0-d">输入包冻结 canvas、资产、记忆、权限；过程期望约束 op 序列与工具调用；验收分 L0 到 L3 四层。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="560" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">TASK ANATOMY</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">一个设计 Task：输入、过程、验收，三段都要冻结</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">只冻结题面不够。设计 Agent 的输出是一次画布变更，不是一段文本</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="126" width="256" height="330" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="142" width="39.1" height="17" rx="8.5" fill="#e8eef5" stroke="none" stroke-width="1"/><text x="83.5" y="153.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="600" fill="#3d5a80" text-anchor="middle">INPUT</text><text x="64.0" y="176.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142" text-anchor="start">输入包 I</text><text x="64.0" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">brief</text><text x="64.0" y="216.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">文案、尺寸、渠道、交付格式</text><text x="64.0" y="244.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">画布</text><text x="64.0" y="260.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">canvas_id + rev + 快照</text><text x="64.0" y="288.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">资产</text><text x="64.0" y="304.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">brand_kit@v12、素材、先例</text><text x="64.0" y="332.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">记忆</text><text x="64.0" y="348.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">memory_rev 与偏好摘要</text><text x="64.0" y="376.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">权限</text><text x="64.0" y="392.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">租户、可见范围、计费主体</text><rect x="64" y="412" width="84.0" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="106.0" y="422.9" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="600" fill="#6d6a63" text-anchor="middle">七项版本必须一起冻结</text><rect x="352" y="126" width="256" height="330" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="368" y="142" width="48.34" height="17" rx="8.5" fill="#e9f1ed" stroke="none" stroke-width="1"/><text x="392.2" y="153.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="600" fill="#2f6f5e" text-anchor="middle">PROCESS</text><text x="368.0" y="176.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142" text-anchor="start">过程期望 P</text><text x="368.0" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">op 序列</text><text x="368.0" y="216.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">先排版后换图，不做整页重绘</text><text x="368.0" y="244.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">必调</text><text x="368.0" y="260.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">brand_check、导出预检</text><text x="368.0" y="288.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">必命中</text><text x="368.0" y="304.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">logo、产品主图、禁用词</text><text x="368.0" y="332.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">禁止</text><text x="368.0" y="348.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">覆盖用户图层、超预算</text><text x="368.0" y="376.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">预算</text><text x="368.0" y="392.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">≤ 6 万 token、≤ 4 张候选</text><rect x="368" y="412" width="104.39999999999999" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="420.2" y="422.9" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="600" fill="#6d6a63" text-anchor="middle">只查关键动作，不求过程全集</text><rect x="656" y="126" width="256" height="330" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="672" y="142" width="43.72" height="17" rx="8.5" fill="#f8e8e3" stroke="none" stroke-width="1"/><text x="693.9" y="153.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="600" fill="#bf4520" text-anchor="middle">ACCEPT</text><text x="672.0" y="176.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2d3142" text-anchor="start">验收 A</text><text x="672.0" y="200.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">L0 硬约束</text><text x="672.0" y="216.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">6 条，任一不过即失败</text><text x="672.0" y="244.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">L1 结构</text><text x="672.0" y="260.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">18 项程序判定</text><text x="672.0" y="288.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">L2 意图</text><text x="672.0" y="304.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">裁判打分 ≥ 0.80</text><text x="672.0" y="332.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">L3 审美</text><text x="672.0" y="348.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">与参考稿成对胜率</text><text x="672.0" y="376.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2d3142" text-anchor="start">聚合</text><text x="672.0" y="392.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#4f5d75" text-anchor="start">门槛 ∧ 加权分</text><rect x="672" y="412" width="74.072" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="709.0" y="422.9" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.8" font-weight="600" fill="#6d6a63" text-anchor="middle">先定 L0，再谈分数</text><path d="M304,290 L348,290" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><path d="M608,290 L652,290" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="478" width="864" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="500.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.14em">FROZEN</text><text x="148.0" y="501.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" fill="#4f5d75" text-anchor="start">canvas_rev · memory_rev · brand_kit_rev · prompt_version · model+seed · 工具桩版本 · rubric_version</text><text x="148.0" y="518.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#8a93a6" text-anchor="start">七项任一变动，历史分数作废，必须整批重跑</text></svg>