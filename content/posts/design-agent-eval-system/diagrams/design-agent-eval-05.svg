<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">回测流水线与三档门禁</title><desc id="f0-d">从冻结输入包到执行、判分、聚合、门禁的五段流水线，以及红黄绿三档判定条件。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="560" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">BACKTEST PIPELINE</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">回测：冻结变量、跑够次数，让红灯真的能拦住发布</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">评测集是题，回测是考场，门禁是判卷之后的那个动作</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="118" width="160" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" fill="#2d3142" text-anchor="start">① 冻结包</text><text x="62.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">拉取 320 条门禁题</text><text x="62.0" y="182.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">锁 7 项版本</text><text x="62.0" y="234.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">task-set.json + 参考图</text><path d="M210,174 L222,174" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="224" y="118" width="160" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="238.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" fill="#2d3142" text-anchor="start">② 执行</text><text x="238.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">k 个候选 × 3 trial</text><text x="238.0" y="182.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">并发 8，单条超时 900s</text><text x="238.0" y="234.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">raw/*.json + 产物 PNG</text><path d="M386,174 L398,174" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="400" y="118" width="160" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="414.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" fill="#2d3142" text-anchor="start">③ 判分</text><text x="414.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">规则先跑，裁判只判 L2/L3</text><text x="414.0" y="182.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">同一 rubric_version</text><text x="414.0" y="234.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">scores.parquet</text><path d="M562,174 L574,174" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="576" y="118" width="160" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="590.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" fill="#2d3142" text-anchor="start">④ 聚合</text><text x="590.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">通过率、加权分</text><text x="590.0" y="182.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">成本、P95、方差</text><text x="590.0" y="234.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">report.md + 周趋势</text><path d="M738,174 L750,174" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="752" y="118" width="160" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="766.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.6" font-weight="600" fill="#2d3142" text-anchor="start">⑤ 门禁</text><text x="766.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">红黄绿三档</text><text x="766.0" y="182.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#4f5d75" text-anchor="start">结果回写 CI</text><text x="766.0" y="234.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">commit status + 阻断原因</text><rect x="48" y="268" width="864" height="42" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="268" width="4" height="42" rx="2" fill="#bf4520" stroke="none" stroke-width="1"/><rect x="66" y="280" width="26" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="79.0" y="291.2" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="600" fill="#bf4520" text-anchor="middle">红</text><text x="106.0" y="294.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">L0 任一失败，或 L1 通过率 &lt; 90%，或均分环比掉 &gt; 5pt</text><text x="896.0" y="294.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#bf4520" text-anchor="end">阻断合并</text><rect x="48" y="318" width="864" height="42" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="318" width="4" height="42" rx="2" fill="#8a6a1f" stroke="none" stroke-width="1"/><rect x="66" y="330" width="26" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="79.0" y="341.2" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="600" fill="#8a6a1f" text-anchor="middle">黄</text><text x="106.0" y="344.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">L1 90–95%，或 L2 掉 3–5pt，或单任务成本涨 &gt; 20%</text><text x="896.0" y="344.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#8a6a1f" text-anchor="end">owner 书面确认</text><rect x="48" y="368" width="864" height="42" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="368" width="4" height="42" rx="2" fill="#2f6f5e" stroke="none" stroke-width="1"/><rect x="66" y="380" width="26" height="17" rx="8.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="79.0" y="391.2" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="600" fill="#2f6f5e" text-anchor="middle">绿</text><text x="106.0" y="394.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">全部达阈值，且 L3 胜率不低于基线</text><text x="896.0" y="394.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="600" fill="#2f6f5e" text-anchor="end">可合并，进影子</text><rect x="48" y="424" width="864" height="60" rx="6" fill="#efefee" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="448.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="#2d3142" text-anchor="start">环境保真度抽检</text><text x="64.0" y="467.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">同一批 100 条，离线与线上影子各跑一遍；结论一致率 &lt; 90%，先修环境再谈 Agent。每季度一次。</text><text x="48.0" y="518.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#5a6580" text-anchor="start">成本：120 条 × 3 trial × 4 候选 = 1440 张图；按 ¥0.15–0.30/张，单轮 ¥216–432，每周两轮。</text></svg>