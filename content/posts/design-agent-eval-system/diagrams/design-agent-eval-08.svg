<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">六周冷启动排期</title><desc id="f0-d">从 trace 埋点到评测集、Rubric、回测、CI 门禁、巡检和归因会的六周落地节奏。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="540" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">6-WEEK PLAN</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">六周冷启动：先跑通一条窄链路，再谈体系</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">第 6 周结束时，团队应该能回答「这次改动能不能发」，而不是「我们的分是多少」</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><text x="305.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W1</text><text x="415.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W2</text><text x="525.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W3</text><text x="635.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W4</text><text x="745.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W5</text><text x="855.0" y="118.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" font-weight="500" fill="#8a93a6" text-anchor="middle">W6</text><line x1="48" y1="126" x2="912" y2="126" stroke="#d8d8d8" stroke-width="1"/><line x1="48" y1="126" x2="912" y2="126" stroke="#e7e7e5" stroke-width="1"/><line x1="360" y1="126" x2="360" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="170" x2="912" y2="170" stroke="#e7e7e5" stroke-width="1"/><line x1="470" y1="126" x2="470" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="214" x2="912" y2="214" stroke="#e7e7e5" stroke-width="1"/><line x1="580" y1="126" x2="580" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="258" x2="912" y2="258" stroke="#e7e7e5" stroke-width="1"/><line x1="690" y1="126" x2="690" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="302" x2="912" y2="302" stroke="#e7e7e5" stroke-width="1"/><line x1="800" y1="126" x2="800" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="346" x2="912" y2="346" stroke="#e7e7e5" stroke-width="1"/><line x1="910" y1="126" x2="910" y2="434" stroke="#e7e7e5" stroke-width="1"/><line x1="48" y1="390" x2="912" y2="390" stroke="#e7e7e5" stroke-width="1"/><text x="60.0" y="153.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">Trace 埋点 + 冻结清单</text><rect x="253" y="134" width="104" height="28" rx="3" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="197.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">种子评测集 120 + 200</text><rect x="253" y="178" width="104" height="28" rx="3" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.85"/><rect x="363" y="178" width="104" height="28" rx="3" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="241.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">Rubric + 双人标注</text><rect x="363" y="222" width="104" height="28" rx="3" fill="#2f6f5e" stroke="none" stroke-width="1" fill-opacity="0.85"/><rect x="473" y="222" width="104" height="28" rx="3" fill="#2f6f5e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="285.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">回测链路跑通</text><rect x="473" y="266" width="104" height="28" rx="3" fill="#2f6f5e" stroke="none" stroke-width="1" fill-opacity="0.85"/><rect x="583" y="266" width="104" height="28" rx="3" fill="#2f6f5e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="329.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">接进 CI，红灯阻断</text><rect x="583" y="310" width="104" height="28" rx="3" fill="#bf4520" stroke="none" stroke-width="1" fill-opacity="0.85"/><rect x="693" y="310" width="104" height="28" rx="3" fill="#bf4520" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="373.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">影子 + 周巡检</text><rect x="693" y="354" width="104" height="28" rx="3" fill="#bf4520" stroke="none" stroke-width="1" fill-opacity="0.85"/><rect x="803" y="354" width="104" height="28" rx="3" fill="#bf4520" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="60.0" y="417.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="400" fill="#4f5d75" text-anchor="start">归因会 + 规则沉淀</text><rect x="803" y="398" width="104" height="28" rx="3" fill="#5a6580" stroke="none" stroke-width="1" fill-opacity="0.45"/><rect x="60" y="456" width="8" height="8" rx="2" fill="#3d5a80" stroke="none" stroke-width="1"/><text x="74.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">搭基建</text><rect x="180" y="456" width="8" height="8" rx="2" fill="#2f6f5e" stroke="none" stroke-width="1"/><text x="194.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">做量具</text><rect x="300" y="456" width="8" height="8" rx="2" fill="#bf4520" stroke="none" stroke-width="1"/><text x="314.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">接门禁</text><rect x="420" y="456" width="8" height="8" rx="2" fill="#5a6580" stroke="none" stroke-width="1"/><text x="434.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">跑运营</text><text x="48.0" y="500.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#5a6580" text-anchor="start">门禁接进 CI 之前，所有分数都只是建议。第 4 周就要把这句话变成红绿灯。</text></svg>