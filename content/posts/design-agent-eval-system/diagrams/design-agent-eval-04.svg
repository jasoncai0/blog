<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">四层 Rubric 与判分器映射</title><desc id="f0-d">L0 硬约束、L1 结构、L2 意图、L3 审美，四层分别对应规则引擎、程序判定、多模态裁判和成对比较。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="640" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">RUBRIC LAYERS</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">四层 Rubric：越往下越主观，越要换判分器</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">18 条检查项，按「谁来判、判错代价多大」分四层，不要混在一个总分里</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="120" width="470" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="136" width="32" height="17" rx="8.5" fill="#f8e8e3" stroke="none" stroke-width="1"/><text x="80.0" y="147.2" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" fill="#bf4520" text-anchor="middle">L0</text><text x="110.0" y="150.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">硬约束</text><text x="110.0" y="172.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">尺寸、安全区、禁用词、品牌色、字体、logo 完整性。任一不过，整条 Task 记 0。</text><rect x="560" y="134" width="352" height="64" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="576.0" y="158.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142" text-anchor="start">规则引擎 + 视觉测量</text><text x="576.0" y="176.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="start">确定性、成本≈0、零方差</text><path d="M518,166 L556,166" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="224" width="470" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="240" width="32" height="17" rx="8.5" fill="#f8e8e3" stroke="none" stroke-width="1"/><text x="80.0" y="251.2" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" fill="#bf4520" text-anchor="middle">L1</text><text x="110.0" y="254.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">结构</text><text x="110.0" y="276.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">图层层级、元素越界、文案溢出、导出规格、对象数量上限。规则或视觉测量能判。</text><rect x="560" y="238" width="352" height="64" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="576.0" y="262.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142" text-anchor="start">程序判定 + OCR / 色差</text><text x="576.0" y="280.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="start">确定性、单条 &lt; 50ms</text><path d="M518,270 L556,270" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="328" width="470" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="344" width="32" height="17" rx="8.5" fill="#e8eef5" stroke="none" stroke-width="1"/><text x="80.0" y="355.2" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" fill="#3d5a80" text-anchor="middle">L2</text><text x="110.0" y="358.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">意图</text><text x="110.0" y="380.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">是否照 brief 改了该改的地方、没动不该动的、图文语义匹配。裁判打分 + 抽样人评。</text><rect x="560" y="342" width="352" height="64" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="576.0" y="366.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142" text-anchor="start">多模态裁判（VLM）</text><text x="576.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="start">单条 ¥0.02–0.05，需校准 κ</text><path d="M518,374 L556,374" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="432" width="470" height="92" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="64" y="448" width="32" height="17" rx="8.5" fill="#e8eef5" stroke="none" stroke-width="1"/><text x="80.0" y="459.2" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="600" fill="#3d5a80" text-anchor="middle">L3</text><text x="110.0" y="462.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start">审美</text><text x="110.0" y="484.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">版式节奏、留白、字体搭配、整体完成度。同一 brief 内成对比较，不跨 brief 打分。</text><rect x="560" y="446" width="352" height="64" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="576.0" y="470.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142" text-anchor="start">成对比较 + 人工抽检</text><text x="576.0" y="488.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="start">单对 ¥0.04，一周 ≤ 200 对</text><path d="M518,478 L556,478" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="548" width="864" height="64" rx="6" fill="#efefee" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="574.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="500" fill="#2d3142" text-anchor="start">Pass = 全部 L0 ∧ L1 通过率 ≥ 95% ∧ L2 加权 ≥ 0.80 ∧ (L3 胜率 ≥ 50% ∨ 人工复核)</text><text x="64.0" y="594.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#5a6580" text-anchor="start">权重只用在 L2 / L3；L0 与 L1 不进加权，避免用高分掩盖硬伤。</text></svg>