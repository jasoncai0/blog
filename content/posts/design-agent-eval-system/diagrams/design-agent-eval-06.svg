<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">在线评测与监控的三种手段</title><desc id="f0-d">影子模式、AB 实验、周期巡检的分工，以及可用性、成本、行为、设计特有四组监控指标。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="530" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">ONLINE</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">在线三条线：影子管上线前，AB 管价值，巡检管基本盘</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">在线评测答「好不好」，监控答「正不正常」，两套数不能互相替代</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><text x="48.0" y="120.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.08em">手段</text><text x="166.0" y="120.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.08em">怎么做</text><text x="442.0" y="120.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.08em">看什么</text><text x="678.0" y="120.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.08em">判据</text><text x="796.0" y="120.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.08em">产出</text><line x1="48" y1="130" x2="912" y2="130" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="140" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="166.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">影子</text><text x="64.0" y="183.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">上线前</text><text x="166.0" y="164.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">真实流量复制一份给新版本，结果不回用户</text><text x="442.0" y="164.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">同一请求两版产物的成对胜负；硬约束违规</text><text x="678.0" y="164.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">新版本不劣于线上</text><text x="796.0" y="164.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">放量决策</text><rect x="48" y="212" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="238.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">AB</text><text x="64.0" y="255.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">分桶</text><text x="166.0" y="236.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">按租户或会话分桶，先放 5–10% 流量</text><text x="442.0" y="236.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">采纳率、导出率、二次编辑深度、退订率</text><text x="678.0" y="236.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">主指标 +2pt 且护栏不破</text><text x="796.0" y="236.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">全量或回滚</text><rect x="48" y="284" width="864" height="62" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="310.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">巡检</text><text x="64.0" y="327.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" fill="#8a93a6" text-anchor="start">每周</text><text x="166.0" y="308.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">抽 100 条离线集，用线上配置跑一遍</text><text x="442.0" y="308.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">分数漂移、单条耗时、失败聚簇</text><text x="678.0" y="308.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">漂移 &gt; 3pt 触发归因</text><text x="796.0" y="308.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">Case 入库</text><text x="48.0" y="376.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142" text-anchor="start">监控四组</text><text x="120.0" y="376.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="start">稳定性和行为指标要一起读：完成率掉 5pt + 某个工具失败率 2% → 15%，是工程问题；工具全绿但对比类任务 10% → 35%，是覆盖缺口。</text><rect x="48" y="390" width="204" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="62" y="404" width="8" height="8" rx="2" fill="#3d5a80" stroke="none" stroke-width="1"/><text x="78.0" y="413.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142" text-anchor="start">可用性</text><text x="62.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">Skill / 工具成功率</text><text x="62.0" y="458.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">失败率、超时率</text><text x="62.0" y="476.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">异常类型分布</text><rect x="268" y="390" width="204" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="282" y="404" width="8" height="8" rx="2" fill="#2f6f5e" stroke="none" stroke-width="1"/><text x="298.0" y="413.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142" text-anchor="start">成本</text><text x="282.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">单任务 token</text><text x="282.0" y="458.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">单任务步数</text><text x="282.0" y="476.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">P95 时延</text><rect x="488" y="390" width="204" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="502" y="404" width="8" height="8" rx="2" fill="#bf4520" stroke="none" stroke-width="1"/><text x="518.0" y="413.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142" text-anchor="start">行为</text><text x="502.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">任务类型分布</text><text x="502.0" y="458.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">Skill 调用频次</text><text x="502.0" y="476.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">平均轮次</text><rect x="708" y="390" width="204" height="112" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="722" y="404" width="8" height="8" rx="2" fill="#8a6a1f" stroke="none" stroke-width="1"/><text x="738.0" y="413.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142" text-anchor="start">设计特有</text><text x="722.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">文字渲染失败率</text><text x="722.0" y="458.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">品牌色 ΔE &gt; 3</text><text x="722.0" y="476.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#4f5d75" text-anchor="start">导出尺寸错误</text></svg>