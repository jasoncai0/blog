<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">评测集分层：端到端按功能模块，过程按能力层</title><desc id="f0-d">端到端评测集负责发现线上异常，过程评测集负责把异常定位到具体能力层。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="560" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">EVAL SETS</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">评测集长成一棵树：端到端管报警，过程管定位</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">拆到能定位到人即可，不要照着组织架构画树</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="396" y="96" width="168" height="44" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="480.0" y="116.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142" text-anchor="middle">评测集 350 条</text><text x="480.0" y="131.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" fill="#8a93a6" text-anchor="middle">120 端到端 · 200 过程 · 30 挑战</text><path d="M480,140 L480,162 L260,162 L260,180" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><path d="M480,162 L700,162 L700,180" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-linejoin="round" marker-end="url(#f0-a-sub)"/><rect x="48" y="180" width="424" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="210.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">端到端 · 按功能模块</text><text x="456.0" y="210.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="end">120 条 / 6 类</text><text x="64.0" y="246.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">海报</text><rect x="160" y="237" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="237" width="200.0" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="246.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">30</text><text x="64.0" y="286.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">电商主图</text><rect x="160" y="277" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="277" width="166.66666666666669" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="286.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">25</text><text x="64.0" y="326.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">长图</text><rect x="160" y="317" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="317" width="133.33333333333331" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="326.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">20</text><text x="64.0" y="366.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">PPT</text><rect x="160" y="357" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="357" width="100.0" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="366.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">15</text><text x="64.0" y="406.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">改图</text><rect x="160" y="397" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="397" width="133.33333333333331" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="406.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">20</text><text x="64.0" y="446.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">品牌套件</text><rect x="160" y="437" width="200" height="11" rx="2" fill="#efefee" stroke="none" stroke-width="1"/><rect x="160" y="437" width="66.66666666666666" height="11" rx="2" fill="#3d5a80" stroke="none" stroke-width="1" fill-opacity="0.75"/><text x="452.0" y="446.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="end">10</text><rect x="488" y="180" width="424" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="504.0" y="210.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start">过程 · 按能力层</text><text x="896.0" y="210.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" fill="#8a93a6" text-anchor="end">200 条 / 5 类</text><text x="504.0" y="252.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142" text-anchor="start">召回</text><text x="612.0" y="252.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">top-8 里有没有品牌节点</text><line x1="504" y1="266" x2="896" y2="266" stroke="#eeeeec" stroke-width="1"/><text x="504.0" y="296.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142" text-anchor="start">Skill 路由</text><text x="612.0" y="296.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">该调的没调，或调错工具</text><line x1="504" y1="310" x2="896" y2="310" stroke="#eeeeec" stroke-width="1"/><text x="504.0" y="340.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142" text-anchor="start">上下文预算</text><text x="612.0" y="340.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">后段品牌约束是否还在</text><line x1="504" y1="354" x2="896" y2="354" stroke="#eeeeec" stroke-width="1"/><text x="504.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142" text-anchor="start">品牌校验</text><text x="612.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">ΔE、字体替换、logo 位移</text><line x1="504" y1="398" x2="896" y2="398" stroke="#eeeeec" stroke-width="1"/><text x="504.0" y="428.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142" text-anchor="start">画布写入</text><text x="612.0" y="428.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">层级、覆盖、快照一致</text><text x="48.0" y="506.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">端到端回答「要不要报警」，过程回答「报警之后找谁」。只有端到端，知道坏了不知道哪坏；只有过程，每个模块都达标但用户不满意。</text><text x="48.0" y="538.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#8a93a6" text-anchor="start">另有 30 条挑战题单列，不计入门禁；挑战集每季度换血，否则跟不上迭代。</text></svg>