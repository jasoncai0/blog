<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="f0-t f0-d"><title id="f0-t">归因的十个筐与两条出口</title><desc id="f0-d">从 trace 出发把失败归到十个环节，再按「Agent 问题」或「评测问题」走两条不同出口。</desc><defs><marker id="f0-a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="f0-a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="f0-a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker><marker id="f0-a-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker><marker id="f0-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker></defs><rect width="960" height="700" fill="#f5f5f5"/><text x="48.0" y="40.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.16em">ATTRIBUTION</text><text x="48.0" y="68.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">归因：十个筐，两条出口</text><text x="48.0" y="88.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">Bad Case 进来先问「哪一段坏了」，再问「是 Agent 坏了还是尺子坏了」</text><line x1="48" y1="100" x2="912" y2="100" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="108" width="864" height="46" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="128.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" fill="#8a93a6" text-anchor="start" letter-spacing="0.14em">TRACE</text><text x="64.0" y="144.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="400" fill="#4f5d75" text-anchor="start">brief → 召回 top-8 → Skill 路由 → 生成 → 画布 op → 导出 → 判分</text><text x="896.0" y="137.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#8a93a6" text-anchor="end">任取一条都能重放</text><rect x="48" y="172" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="196.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">01</text><text x="86.0" y="196.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">意图理解</text><text x="86.0" y="218.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">首轮修改集中在尺寸、风格词</text><rect x="428.0" y="184" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="443.0" y="194.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">策略</text><rect x="488" y="172" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="502.0" y="196.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">02</text><text x="526.0" y="196.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">资产召回</text><text x="526.0" y="218.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">top-8 里没有品牌节点；命中率 &lt; 60%</text><rect x="868.0" y="184" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="883.0" y="194.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">检索</text><rect x="48" y="254" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="278.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">03</text><text x="86.0" y="278.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">Skill 路由</text><text x="86.0" y="300.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">该调的没调，或调错工具</text><rect x="428.0" y="266" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="443.0" y="276.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">能力</text><rect x="488" y="254" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="502.0" y="278.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">04</text><text x="526.0" y="278.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">上下文预算</text><text x="526.0" y="300.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">长会话后段品牌约束丢失</text><rect x="861.0" y="266" width="37.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="879.5" y="276.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">上下文</text><rect x="48" y="336" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="360.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">05</text><text x="86.0" y="360.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">生成能力</text><text x="86.0" y="382.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">文字糊、logo 变形、结构崩</text><rect x="428.0" y="348" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="443.0" y="358.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">模型</text><rect x="488" y="336" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="502.0" y="360.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">06</text><text x="526.0" y="360.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">品牌约束</text><text x="526.0" y="382.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">ΔE &gt; 3、字体被替换、logo 位移</text><rect x="868.0" y="348" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="883.0" y="358.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">校验</text><rect x="48" y="418" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="442.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">07</text><text x="86.0" y="442.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">画布写入</text><text x="86.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">层级错、覆盖用户图层、快照不一致</text><rect x="428.0" y="430" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="443.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">编排</text><rect x="488" y="418" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="502.0" y="442.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">08</text><text x="526.0" y="442.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">工具环境</text><text x="526.0" y="464.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">超时、降级、素材 404</text><rect x="868.0" y="430" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="883.0" y="440.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">工程</text><rect x="48" y="500" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="62.0" y="524.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">09</text><text x="86.0" y="524.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">成本截断</text><text x="86.0" y="546.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">提前收敛、降级模型、少出候选</text><rect x="428.0" y="512" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="443.0" y="522.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">预算</text><rect x="488" y="500" width="424" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="502.0" y="524.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" fill="#8a93a6" text-anchor="start">10</text><text x="526.0" y="524.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142" text-anchor="start">评测本身</text><text x="526.0" y="546.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" fill="#4f5d75" text-anchor="start">人判好机判差，或机判好人判差</text><rect x="868.0" y="512" width="30.0" height="15" rx="7.5" fill="#f2f2f0" stroke="none" stroke-width="1"/><text x="883.0" y="522.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="600" fill="#6d6a63" text-anchor="middle">评测</text><rect x="48" y="596" width="424" height="48" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="64.0" y="616.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="#bf4520" text-anchor="start">出口 A · 改 Agent</text><text x="64.0" y="632.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#8a93a6" text-anchor="start">改提示词 / 检索 / 阈值 → 回测 → 影子 → 放量</text><rect x="488" y="596" width="424" height="48" rx="6" fill="#fbfbfa" stroke="#d8d8d8" stroke-width="1"/><text x="504.0" y="616.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.0" font-weight="600" fill="#3d5a80" text-anchor="start">出口 B · 改量具</text><text x="504.0" y="632.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" fill="#8a93a6" text-anchor="start">改 Rubric 或裁判 → 重跑历史集 → 校准 κ</text><text x="48.0" y="676.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="400" fill="#5a6580" text-anchor="start">第 10 类占比超过 10%，先停掉 Agent 迭代，去校准尺子。</text></svg>