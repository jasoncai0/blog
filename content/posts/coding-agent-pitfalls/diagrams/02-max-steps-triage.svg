<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-title f02-desc">
  <title id="f02-title">MAX_STEPS 的归因路径</title>
  <desc id="f02-desc">同样是 MAX_STEPS，Go 快排的工件已通过构建和测试，只是没有最终回答；Spring Boot 项目则因沙箱写缓存、网络、JVM 临时目录和端口绑定失败。先读 verification、events.jsonl 和工作区，再决定补轮数还是修环境。</desc>
  <defs>
    <marker id="f02-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f02-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="f02-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7d3a"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">JADE / FAILURE TRIAGE</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">同一个终态，两个完全不同的结论</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">状态只说明循环怎么结束；工件是否成立，要回到命令与文件</text>

  <rect x="330" y="106" width="300" height="54" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="480" y="129" font-family="'SF Mono',ui-monospace,monospace" font-size="11" fill="#bf4520" text-anchor="middle">status: MAX_STEPS</text>
  <text x="480" y="147" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75" text-anchor="middle">turn 用尽，不等于代码失败</text>

  <rect x="300" y="190" width="360" height="58" rx="6" fill="#fff6f1" stroke="#e4b19c"/>
  <text x="480" y="212" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">先读三样证据</text>
  <text x="480" y="231" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75" text-anchor="middle">verification · .agent/events.jsonl · workspace</text>

  <path d="M 480 160 L 480 186" fill="none" stroke="#8a93a6" marker-end="url(#f02-a)"/>
  <path d="M 300 248 L 210 286" fill="none" stroke="#8a93a6" marker-end="url(#f02-a)"/>
  <path d="M 660 248 L 750 286" fill="none" stroke="#8a93a6" marker-end="url(#f02-a)"/>

  <rect x="40" y="290" width="340" height="220" rx="6" fill="#ffffff" stroke="#4f7d3a"/>
  <text x="60" y="314" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" fill="#4f7d3a">A / 工件已成立</text>
  <text x="60" y="335" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">Go 快排：10/10 但代码能跑</text>
  <text x="60" y="355" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">go build / go test / go run 全通过</text>
  <text x="60" y="372" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">缺的是最终回答，不是实现</text>
  <rect x="60" y="392" width="300" height="74" rx="3" fill="#f7faf4" stroke="#dbe6d4"/>
  <text x="72" y="412" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">run-54a1b1c6 · 10/10 · 48,272 tok</text>
  <text x="72" y="430" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">run-e2cef436 · 9/12 · SUCCEEDED</text>
  <text x="72" y="451" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f7d3a">动作：补轮数，或直接交付工件</text>

  <rect x="580" y="290" width="340" height="220" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="600" y="314" font-family="'SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">B / 工件未成立</text>
  <text x="600" y="335" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">Spring Boot：10/10 真的失败</text>
  <text x="600" y="355" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">Maven compile failed，验证已是红灯</text>
  <text x="600" y="372" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">根因在沙箱边界，不在模型</text>
  <rect x="600" y="392" width="300" height="74" rx="3" fill="#fff8f5" stroke="#f0d3c6"/>
  <text x="612" y="412" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">~/.m2 … Operation not permitted</text>
  <text x="612" y="430" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">curl → 000 · tmpdir 拒绝 · 8080 绑定</text>
  <text x="612" y="451" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">动作：修缓存/网络/tmp/端口，不是加轮数</text>

  <rect x="260" y="548" width="440" height="34" rx="4" fill="#2d3142"/>
  <text x="480" y="570" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">MAX_STEPS 只是“循环结束”，工件结论必须另取证据</text>
</svg>
