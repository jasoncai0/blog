<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-d1-title f01-d1-desc">
  <title id="f01-d1-title">工具解析的四层</title>
  <desc id="f01-d1-desc">全局注册表先与 scope 链上的注册合并，再经每层 restriction 过滤，最后合并当前 scope 的 own 注册；产出的 visible 进入模型 schema，knownNames 保留被过滤名字用于诊断。</desc>

  <defs>
    <marker id="f01-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f01-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">09 / TOOL RESOLUTION</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">四层解析：从注册表到模型可见集合</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">每一步只做一件事；四步之后，看不见的工具在执行器里也不存在</text>

  <!-- column labels -->
  <text x="40" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">① GLOBAL</text>
  <text x="265" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">② SCOPED</text>
  <text x="490" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">③ RESTRICTION</text>
  <text x="715" y="122" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">④ SHADOW</text>

  <!-- 1 global -->
  <rect x="40" y="136" width="200" height="286" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">global layer</text>
  <text x="56" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">部署 / bundle / preset 根 ctx</text>
  <line x1="56" y1="188" x2="224" y2="188" stroke="#ececec" stroke-width="1"/>
  <rect x="56" y="200" width="168" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="216" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">read</text>
  <rect x="56" y="230" width="168" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="246" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">bash</text>
  <rect x="56" y="260" width="168" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">edit</text>
  <rect x="56" y="290" width="168" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="306" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">deploy</text>
  <text x="56" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">同名重复 → 插入时抛错</text>
  <text x="56" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">dispose 时整层回收</text>
  <text x="56" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">index.ts:199</text>

  <!-- 2 scoped -->
  <rect x="265" y="136" width="200" height="286" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="281" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">scope chain</text>
  <text x="281" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">nearest-first 覆盖</text>
  <rect x="281" y="190" width="168" height="42" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="293" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#4f5d75">deployment</text>
  <text x="293" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">deploy 注册在这里</text>
  <line x1="365" y1="232" x2="365" y2="248" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>
  <rect x="281" y="252" width="168" height="58" rx="4" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
  <text x="293" y="270" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">agent A</text>
  <text x="293" y="285" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">own: 本层注册</text>
  <text x="293" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">不继承给子 agent</text>
  <rect x="281" y="330" width="168" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-dasharray="4 3"/>
  <text x="293" y="345" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6">agent B（兄弟）</text>
  <text x="293" y="357" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">链上没有 A</text>
  <text x="281" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">index.ts:203</text>

  <!-- 3 restriction -->
  <rect x="490" y="136" width="200" height="286" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="506" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">restriction</text>
  <text x="506" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">只过滤 inherited</text>
  <rect x="506" y="190" width="168" height="40" rx="4" fill="#f5f5f5"/>
  <text x="518" y="206" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">deny: [bash]</text>
  <text x="518" y="220" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">未列出的继承项放行</text>
  <rect x="506" y="240" width="168" height="40" rx="4" fill="#f5f5f5"/>
  <text x="518" y="256" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">allow: [read, edit]</text>
  <text x="518" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">未列出的继承项排除</text>
  <text x="506" y="302" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">layers.every(admits)</text>
  <text x="506" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">多层同时存在 = 交集</text>
  <text x="506" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">own 注册不受约束</text>
  <text x="506" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">index.ts:216</text>

  <!-- 4 shadow -->
  <rect x="715" y="136" width="205" height="286" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="731" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">merge / shadow</text>
  <text x="731" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">同名覆盖，越近越赢</text>
  <rect x="731" y="190" width="173" height="28" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
  <text x="743" y="208" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">1  own</text>
  <rect x="731" y="224" width="173" height="28" rx="4" fill="#f5f5f5"/>
  <text x="743" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">2  nearest ancestor</text>
  <rect x="731" y="258" width="173" height="28" rx="4" fill="#f5f5f5"/>
  <text x="743" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">3  farther ancestor</text>
  <rect x="731" y="292" width="173" height="28" rx="4" fill="#f5f5f5"/>
  <text x="743" y="310" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">4  global</text>
  <text x="731" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">同层重名 → 抛错</text>
  <text x="731" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">跨层重名 → 静默遮蔽</text>
  <text x="731" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">index.ts:222</text>

  <!-- arrows -->
  <line x1="240" y1="278" x2="261" y2="278" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>
  <line x1="465" y1="278" x2="486" y2="278" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>
  <line x1="690" y1="278" x2="711" y2="278" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <!-- output -->
  <line x1="817" y1="422" x2="817" y2="446" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f01-acc)"/>
  <rect x="40" y="452" width="520" height="96" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="58" y="476" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">VISIBLE</text>
  <text x="58" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142">{ read, edit, deploy }</text>
  <text x="58" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">进入 ToolSchema[]；执行器按这个集合判定可执行</text>
  <text x="58" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">bash 既不出现，调用也返回 UNKNOWN_TOOL</text>

  <rect x="584" y="452" width="336" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="602" y="476" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#8a93a6">KNOWN NAMES</text>
  <text x="602" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#4f5d75">{ read, edit, deploy, bash }</text>
  <text x="602" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">差集 = 被过滤但仍被系统记得的名字</text>
  <text x="602" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">只用于诊断，不进请求</text>

  <text x="40" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">解析结果按 model step 冻结；执行时再复核一次，撤销只影响尚未开始的调用。</text>
</svg>
