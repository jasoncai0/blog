<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f03-t f03-d">
  <title id="f03-t">选型只看两个问题</title>
  <desc id="f03-d">决策树：先问要不要模型动手，不需要就写技能；需要再问能力在不在外部系统，在外部且有现成服务器就接 MCP，否则自己写工具。</desc>
  <defs>
    <marker id="f03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
  </defs>
  <rect width="960" height="560" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#8a93a6">DECISION / 03</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">选型只看两个问题</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">要不要动手，能力在不在外部</text>

  <polygon points="480,100 620,150 480,200 340,150" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
  <text x="480" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">要模型动手吗？</text>
  <text x="480" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">改文件、调接口、跑命令</text>

  <line x1="340" y1="150" x2="240" y2="150" stroke="#8a93a6" stroke-width="1"/>
  <line x1="240" y1="150" x2="240" y2="280" stroke="#8a93a6" stroke-width="1" marker-end="url(#f03-a)"/>
  <text x="290" y="142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#bf4520" text-anchor="middle">否</text>

  <line x1="480" y1="200" x2="480" y2="235" stroke="#8a93a6" stroke-width="1"/>
  <line x1="480" y1="235" x2="720" y2="235" stroke="#8a93a6" stroke-width="1"/>
  <line x1="720" y1="235" x2="720" y2="270" stroke="#8a93a6" stroke-width="1" marker-end="url(#f03-a)"/>
  <text x="492" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#bf4520">是</text>

  <polygon points="720,270 830,320 720,370 610,320" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
  <text x="720" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">能力在外部系统？</text>
  <text x="720" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">GitHub、数据库、SaaS</text>

  <line x1="610" y1="320" x2="610" y2="450" stroke="#8a93a6" stroke-width="1" marker-end="url(#f03-a)"/>
  <text x="620" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#bf4520">否</text>

  <line x1="830" y1="320" x2="860" y2="320" stroke="#8a93a6" stroke-width="1"/>
  <line x1="860" y1="320" x2="860" y2="430" stroke="#8a93a6" stroke-width="1" marker-end="url(#f03-a)"/>
  <text x="868" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#bf4520">是</text>

  <rect x="140" y="280" width="200" height="72" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
  <text x="240" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2f6f5e" text-anchor="middle">写一份 Skill</text>
  <text x="240" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">步骤、判断标准、产出格式</text>

  <rect x="520" y="450" width="180" height="72" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
  <text x="610" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#5b4b8a" text-anchor="middle">写工具</text>
  <text x="610" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">schema · 审批 · 超时</text>

  <rect x="780" y="430" width="160" height="72" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="860" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#3d5a80" text-anchor="middle">接 MCP server</text>
  <text x="860" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">进程 · 重连 · 凭据</text>

  <text x="780" y="522" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">没有现成 server，就别为几个动作单起一个</text>
  <text x="40" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">两个都否定：这件事还不该进工具表。</text>
</svg>
