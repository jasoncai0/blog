<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="f01-t f01-d">
  <title id="f01-t">三种能力落在三个位置</title>
  <desc id="f01-d">上下文层是技能目录与正文，都在 messages 尾部；工具表层是 bash、read_file 与一条 mcp__ 前缀的条目；执行层分成 harness 进程内的 handler 与外部进程里的 MCP server。</desc>
  <defs>
    <marker id="f01-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker>
    <marker id="f01-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/></marker>
    <marker id="f01-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
  </defs>
  <rect width="960" height="530" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#8a93a6">LAYOUT / 01</text>
  <text x="40" y="60" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">三种能力，三个位置</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">技能在消息里，工具声明在请求头，执行体分处进程内外</text>

  <rect x="40" y="100" width="880" height="82" fill="#e9f2ed"/>
  <rect x="40" y="100" width="4" height="82" fill="#2f6f5e"/>
  <text x="60" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2f6f5e">上下文 · 模型读到的</text>
  <rect x="60" y="134" width="300" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="74" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">技能目录</text>
  <text x="74" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">name: description，截断 500 字</text>
  <rect x="376" y="134" width="280" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="390" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">技能正文</text>
  <text x="390" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">按需加载，作为一次工具结果</text>
  <text x="676" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">位置：messages 尾部</text>

  <line x1="200" y1="182" x2="200" y2="212" stroke="#2f6f5e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#f01-g)"/>
  <text x="212" y="201" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2f6f5e">模型读了正文，决定调哪个工具</text>

  <rect x="40" y="212" width="880" height="88" fill="#efeaf6"/>
  <rect x="40" y="212" width="4" height="88" fill="#5b4b8a"/>
  <text x="60" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">工具表 tools[] · 模型能调的</text>
  <rect x="60" y="250" width="130" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="125" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#4f5d75" text-anchor="middle">bash</text>
  <rect x="202" y="250" width="130" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="267" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#4f5d75" text-anchor="middle">read_file</text>
  <text x="344" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#3d5a80">来自 MCP server</text>
  <rect x="344" y="250" width="300" height="38" fill="#ffffff" stroke="#3d5a80" stroke-width="1"/>
  <text x="494" y="274" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#3d5a80" text-anchor="middle">mcp__github__create_issue</text>
  <text x="664" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">只是多一项声明，名字带前缀</text>

  <line x1="290" y1="300" x2="290" y2="330" stroke="#5b4b8a" stroke-width="1.2" marker-end="url(#f01-p)"/>
  <line x1="760" y1="300" x2="760" y2="330" stroke="#3d5a80" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#f01-b)"/>
  <text x="770" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80">JSON-RPC</text>

  <rect x="40" y="330" width="560" height="140" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5b4b8a">harness 进程</text>
  <rect x="56" y="366" width="250" height="44" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="68" y="385" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">bash → 沙箱进程</text>
  <text x="68" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">参数 · 审批 · 超时</text>
  <rect x="322" y="366" width="260" height="44" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="334" y="385" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">read_file → 文件系统</text>
  <text x="334" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">结果过 output schema</text>
  <text x="56" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#8a93a6">prepare → dispatch → complete → finish</text>

  <rect x="640" y="330" width="280" height="140" fill="#e9eff6" stroke="#3d5a80" stroke-width="1"/>
  <text x="656" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#3d5a80">外部进程</text>
  <rect x="656" y="366" width="248" height="48" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="668" y="386" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#3d5a80">MCP server</text>
  <text x="668" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">stdio / streamable http</text>
  <text x="656" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">声明、执行、凭据都在 server 侧</text>

  <line x1="620" y1="316" x2="620" y2="486" stroke="#c3c9d4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="620" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" text-anchor="middle">进程边界</text>

  <text x="40" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">技能没有执行体；MCP 没有自己的工具表；工具是唯一带执行体的契约。</text>
</svg>
