<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1440" height="700" fill="#ffffff"/>
<text x="720.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">演进对照：计算机七十年 ↔ Agent 三年（及之后）</text>
<rect x="150" y="80" width="160" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="230.0" y="105.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">计算机</text>
<rect x="150" y="400" width="160" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="230.0" y="425.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent</text>
<polyline points="40,210 1410,210" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<rect x="40" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="130.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">批处理</text>
<text x="130.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1950s</text>
<text x="130.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">一次一个程序</text>
<rect x="236" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="326.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">分时 + 早期 OS</text>
<text x="326.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1960s</text>
<text x="326.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">多用户共享主机</text>
<rect x="432" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="522.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">虚拟内存</text>
<text x="522.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1960s–70s</text>
<text x="522.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">小内存跑大程序</text>
<rect x="628" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="718.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Unix：进程 / 管道</text>
<text x="718.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1970s</text>
<text x="718.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">小工具组合</text>
<rect x="824" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="914.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">保护模式 / PC</text>
<text x="914.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1980s</text>
<text x="914.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">隔离与普及</text>
<rect x="1020" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="1110.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">网络与分布式</text>
<text x="1110.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">1990s–2000s</text>
<text x="1110.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">TCP/IP、集群</text>
<rect x="1216" y="150" width="180" height="120" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="1306.0" y="198.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">虚拟化 / 云</text>
<text x="1306.0" y="217.0" font-size="12" text-anchor="middle" fill="#475569">2010s</text>
<text x="1306.0" y="234.0" font-size="12" text-anchor="middle" fill="#475569">容器、编排</text>
<polyline points="40,530 1410,530" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<rect x="40" y="470" width="180" height="120" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="130.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">单轮对话</text>
<text x="130.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2022</text>
<text x="130.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">一次一个 prompt</text>
<rect x="236" y="470" width="180" height="120" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="326.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">工具调用 / ReAct</text>
<text x="326.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2023</text>
<text x="326.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">有了 I/O</text>
<rect x="432" y="470" width="180" height="120" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="522.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">harness + 子 agent</text>
<text x="522.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2024</text>
<text x="522.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">多道程序</text>
<rect x="628" y="470" width="180" height="120" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="718.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">MCP / 上下文工程</text>
<text x="718.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2024–25</text>
<text x="718.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">驱动标准、内存管理</text>
<rect x="824" y="470" width="180" height="120" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="914.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">workflow / 后台 agent</text>
<text x="914.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2025</text>
<text x="914.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">作业调度</text>
<rect x="1020" y="470" width="180" height="120" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="1110.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent OS（预测）</text>
<text x="1110.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">2026+</text>
<text x="1110.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">虚拟上下文、保护、记账</text>
<rect x="1216" y="470" width="180" height="120" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="1306.0" y="518.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent 网络</text>
<text x="1306.0" y="537.0" font-size="12" text-anchor="middle" fill="#475569">更远（预测）</text>
<text x="1306.0" y="554.0" font-size="12" text-anchor="middle" fill="#475569">跨组织协议与信任</text>
<text x="720" y="640" font-size="13" text-anchor="middle" fill="#475569">虚线：同一类问题的对应关系。计算机花了约 70 年，agent 用约 3 年把前五步走了一遍；后两步是预测</text>
