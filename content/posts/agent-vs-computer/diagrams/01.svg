<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1440" height="760" fill="#ffffff"/>
<text x="720.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">一台“Agent 计算机”：逐层对照冯·诺依曼计算机</text>
<rect x="190" y="62" width="540" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="460.0" y="87.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">计算机</text>
<rect x="770" y="62" width="640" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="1090.0" y="87.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent 系统</text>
<rect x="20" y="118" width="150" height="70" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="95.0" y="158.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">应用</text>
<rect x="190" y="118" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="158.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">程序 / 脚本 / 服务</text>
<rect x="770" y="118" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="158.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">任务、skill、workflow、业务 agent</text>
<rect x="20" y="202" width="150" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="95.0" y="242.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">操作系统内核</text>
<rect x="190" y="202" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="242.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">进程、调度、内存管理、文件系统、权限</text>
<rect x="770" y="202" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="242.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">agent harness：会话 / 子 agent、调度、上下文管理、权限</text>
<rect x="20" y="286" width="150" height="70" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="95.0" y="326.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">系统调用 / 驱动</text>
<rect x="190" y="286" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="326.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">syscall ABI、设备驱动、总线（PCIe / USB）</text>
<rect x="770" y="286" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="326.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">tool schema（函数调用）、MCP server、hooks</text>
<rect x="20" y="370" width="150" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="95.0" y="410.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">外部存储</text>
<rect x="190" y="370" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="410.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">SSD / 磁盘 / 网络存储 + 文件系统 + 索引</text>
<rect x="770" y="370" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="410.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">记忆文件、transcript、RAG 向量库、搜索引擎</text>
<rect x="20" y="454" width="150" height="70" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="95.0" y="494.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">主存</text>
<rect x="190" y="454" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="494.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">DRAM：按地址随机访问、易失</text>
<rect x="770" y="454" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="494.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">上下文窗口：按语义注意、每轮重读、按 token 计费</text>
<rect x="20" y="538" width="150" height="70" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="95.0" y="578.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">缓存</text>
<rect x="190" y="538" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="578.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">L1–L3 cache、TLB、页缓存</text>
<rect x="770" y="538" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="578.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">KV cache（请求内）、prompt cache（跨请求，TTL）</text>
<rect x="20" y="622" width="150" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="95.0" y="662.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">处理器</text>
<rect x="190" y="622" width="540" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="460.0" y="662.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">CPU：确定性执行机器码，取指—译码—执行</text>
<rect x="770" y="622" width="640" height="70" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1090.0" y="662.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">LLM：概率性解读自然语言，逐 token 生成</text>
<text x="720" y="728" font-size="13" text-anchor="middle" fill="#475569">越往下越接近“硬件”：处理器与主存的性质，决定了上面每一层能借用多少传统做法</text>
