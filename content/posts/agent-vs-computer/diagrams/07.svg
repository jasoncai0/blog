<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1440" height="640" fill="#ffffff"/>
<text x="720.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">调度单位的差异：Pod 生命周期 ↔ Agent 会话生命周期</text>
<rect x="20" y="60" width="1400" height="160" rx="14" fill="#f1f5f9" fill-opacity="0.35" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="34" y="84" font-size="14" font-weight="bold" text-anchor="start" fill="#64748b">Pod：无状态、可替换（cattle）</text>
<rect x="60" y="110" width="280" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="200.0" y="146.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Pending</text>
<text x="200.0" y="165.5" font-size="12" text-anchor="middle" fill="#475569">等调度、拉镜像</text>
<rect x="400" y="110" width="280" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="540.0" y="146.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Running</text>
<text x="540.0" y="165.5" font-size="12" text-anchor="middle" fill="#475569">按 CPU / 内存计量</text>
<rect x="740" y="110" width="280" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="880.0" y="146.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Failed</text>
<text x="880.0" y="165.5" font-size="12" text-anchor="middle" fill="#475569">探针失败 / OOM</text>
<rect x="1080" y="110" width="280" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1220.0" y="146.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">删除重建</text>
<text x="1220.0" y="165.5" font-size="12" text-anchor="middle" fill="#475569">新 pod，状态在外部</text>
<rect x="20" y="250" width="1400" height="190" rx="14" fill="#dbeafe" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="34" y="274" font-size="14" font-weight="bold" text-anchor="start" fill="#2563eb">Agent 会话：有状态、贵在上下文（pet）</text>
<rect x="40" y="300" width="200" height="100" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="140.0" y="346.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">排队</text>
<text x="140.0" y="365.5" font-size="12" text-anchor="middle" fill="#475569">等配额 / 并发槽</text>
<rect x="270" y="300" width="200" height="100" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="370.0" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">运行</text>
<text x="370.0" y="357.0" font-size="12" text-anchor="middle" fill="#475569">占模型 + 沙箱</text>
<text x="370.0" y="374.0" font-size="12" text-anchor="middle" fill="#475569">按 token 计量</text>
<rect x="500" y="300" width="200" height="100" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="600.0" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">等待</text>
<text x="600.0" y="357.0" font-size="12" text-anchor="middle" fill="#475569">等人审批</text>
<text x="600.0" y="374.0" font-size="12" text-anchor="middle" fill="#475569">等子任务回报</text>
<rect x="730" y="300" width="200" height="100" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="830.0" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">挂起</text>
<text x="830.0" y="357.0" font-size="12" text-anchor="middle" fill="#475569">存 transcript</text>
<text x="830.0" y="374.0" font-size="12" text-anchor="middle" fill="#475569">+ 沙箱快照，释放资源</text>
<rect x="960" y="300" width="200" height="100" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1060.0" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">恢复 / 迁移</text>
<text x="1060.0" y="357.0" font-size="12" text-anchor="middle" fill="#475569">重建上下文</text>
<text x="1060.0" y="374.0" font-size="12" text-anchor="middle" fill="#475569">cache 冷启动要重付费</text>
<rect x="1190" y="300" width="200" height="100" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1290.0" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">完成</text>
<text x="1290.0" y="357.0" font-size="12" text-anchor="middle" fill="#475569">需要验收</text>
<text x="1290.0" y="374.0" font-size="12" text-anchor="middle" fill="#475569">不是退出码 0</text>
<rect x="20" y="470" width="680" height="150" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="360.0" y="524.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Pod：重启几乎免费</text>
<text x="360.0" y="543.5" font-size="13" text-anchor="middle" fill="#475569">状态在外部（数据库 / 对象存储），副本可任意替换</text>
<text x="360.0" y="560.5" font-size="13" text-anchor="middle" fill="#475569">HPA 按 CPU / 请求量扩缩，失败就重建</text>
<text x="360.0" y="577.5" font-size="13" text-anchor="middle" fill="#475569">调度只看资源是否够</text>
<rect x="740" y="470" width="680" height="150" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1080.0" y="524.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">会话：重启很贵</text>
<text x="1080.0" y="543.5" font-size="13" text-anchor="middle" fill="#475569">上下文就是状态：重建要重读、cache 失效要重付费</text>
<text x="1080.0" y="560.5" font-size="13" text-anchor="middle" fill="#475569">副作用不幂等：不能“失败就重来”，要 journal 与补偿</text>
<text x="1080.0" y="577.5" font-size="13" text-anchor="middle" fill="#475569">调度要看 cache 亲和、预算、等待时长</text>
<polyline points="342,150 398,150" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="682,150 738,150" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="1022,150 1078,150" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="242,350 268,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="472,350 498,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="702,350 728,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="932,350 958,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="1162,350 1188,350" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="1070,402 1070,425 370,425 370,404" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<text x="720" y="420" font-size="12" text-anchor="middle" fill="#334155">恢复后回到运行</text></svg>