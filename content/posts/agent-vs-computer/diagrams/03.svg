<polyline points="742,205 798,205" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,269 798,269" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,333 798,333" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,397 798,397" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,461 798,461" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,525 798,525" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
<polyline points="742,589 798,589" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/></svg>