<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1440" height="720" fill="#ffffff"/>
<text x="720.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">池化与编排：三层分别走到了哪一步</text>
<rect x="190" y="62" width="420" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="87.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">云原生（Docker / K8s）</text>
<rect x="650" y="62" width="600" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="950.0" y="87.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent 世界</text>
<rect x="1270" y="62" width="150" height="40" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="1345.0" y="87.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">进度</text>
<rect x="20" y="118" width="150" height="155" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="95.0" y="192.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Agent 层</text>
<text x="95.0" y="211.0" font-size="12" text-anchor="middle" fill="#475569">会话 / 编排</text>
<rect x="190" y="118" width="420" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400.0" y="183.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Deployment / Job / Operator</text>
<text x="400.0" y="202.5" font-size="13" text-anchor="middle" fill="#475569">Service + DNS 服务发现</text>
<text x="400.0" y="219.5" font-size="13" text-anchor="middle" fill="#475569">镜像仓库：版本、签名、灰度</text>
<rect x="650" y="118" width="600" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="950.0" y="175.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">会话即工作负载</text>
<text x="950.0" y="194.0" font-size="13" text-anchor="middle" fill="#475569">kagent：agent 定义为 CRD，用 GitOps / RBAC 管理</text>
<text x="950.0" y="211.0" font-size="13" text-anchor="middle" fill="#475569">A2A Agent Card ≈ 服务发现；skill / agent 仓库 ≈ 镜像仓库</text>
<text x="950.0" y="228.0" font-size="13" text-anchor="middle" fill="#475569">缺口：会话有状态，不能当无状态副本扩缩</text>
<rect x="1270" y="173" width="150" height="44" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="1345.0" y="200.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">早期</text>
<rect x="20" y="293" width="150" height="155" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="95.0" y="367.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">执行层</text>
<text x="95.0" y="386.0" font-size="12" text-anchor="middle" fill="#475569">沙箱 / 工具运行时</text>
<rect x="190" y="293" width="420" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400.0" y="358.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">容器 / RuntimeClass / PVC</text>
<text x="400.0" y="377.5" font-size="13" text-anchor="middle" fill="#475569">gVisor、Kata、Firecracker 强隔离</text>
<text x="400.0" y="394.5" font-size="13" text-anchor="middle" fill="#475569">预热池、按需 claim</text>
<rect x="650" y="293" width="600" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="950.0" y="350.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">沙箱容器化</text>
<text x="950.0" y="369.0" font-size="13" text-anchor="middle" fill="#475569">agent-sandbox（SIG Apps）：Sandbox / Template / Claim / WarmPool</text>
<text x="950.0" y="386.0" font-size="13" text-anchor="middle" fill="#475569">E2B 等 microVM 沙箱，预热快照约 150 ms 级启动</text>
<text x="950.0" y="403.0" font-size="13" text-anchor="middle" fill="#475569">单 pod、有身份、有持久盘、可长时间空闲</text>
<rect x="1270" y="348" width="150" height="44" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="1345.0" y="375.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">进行中</text>
<rect x="20" y="468" width="150" height="155" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="95.0" y="542.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">算力层</text>
<text x="95.0" y="561.0" font-size="12" text-anchor="middle" fill="#475569">模型推理</text>
<rect x="190" y="468" width="420" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400.0" y="533.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Service + 负载均衡 + 存算分离</text>
<text x="400.0" y="552.5" font-size="13" text-anchor="middle" fill="#475569">按 CPU / 内存调度</text>
<text x="400.0" y="569.5" font-size="13" text-anchor="middle" fill="#475569">计算与远端存储池分离</text>
<rect x="650" y="468" width="600" height="155" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="950.0" y="525.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">推理池化</text>
<text x="950.0" y="544.0" font-size="13" text-anchor="middle" fill="#475569">Inference Extension：InferencePool 按模型名路由</text>
<text x="950.0" y="561.0" font-size="13" text-anchor="middle" fill="#475569">llm-d：KV cache 感知路由 + prefill / decode 分离</text>
<text x="950.0" y="578.0" font-size="13" text-anchor="middle" fill="#475569">Mooncake：CPU / DRAM / SSD 汇成 KV cache 池</text>
<rect x="1270" y="523" width="150" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="1345.0" y="550.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">已发生</text>
<text x="720" y="673" font-size="13" text-anchor="middle" fill="#475569">越往下越像今天的云原生；越往上状态越重，越不能照搬“无状态副本 + 失败就重建”</text>
