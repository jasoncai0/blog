<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720" font-family="Noto Sans SC, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1440" height="720" fill="#ffffff"/>
<text x="720.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">存储层次：上下文≈内存，RAG≈外存（量级为典型值，仅示意）</text>
<rect x="510" y="80" width="420" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="524" y="112" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">寄存器 / L1</text>
<text x="524" y="134" font-size="12" text-anchor="start" fill="#475569">&lt; 1–2 ns · KB 级</text>
<text x="916" y="112" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">当前生成步的注意力状态</text>
<text x="916" y="134" font-size="12" text-anchor="end" fill="#475569">单个前向计算内 · 无额外费用</text>
<rect x="446" y="168" width="548" height="78" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="460" y="200" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">L2 / L3 cache</text>
<text x="460" y="222" font-size="12" text-anchor="start" fill="#475569">4–40 ns · MB 级</text>
<text x="980" y="200" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">KV cache（一次请求内复用）</text>
<text x="980" y="222" font-size="12" text-anchor="end" fill="#475569">请求内 · 推理侧自动</text>
<rect x="382" y="256" width="676" height="78" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="396" y="288" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">页缓存</text>
<text x="396" y="310" font-size="12" text-anchor="start" fill="#475569">按需命中 · GB 级</text>
<text x="1044" y="288" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">prompt cache（跨请求前缀）</text>
<text x="1044" y="310" font-size="12" text-anchor="end" fill="#475569">命中按约 0.1× 计费 · TTL 5m / 1h</text>
<rect x="318" y="344" width="804" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="332" y="376" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">主存 DRAM</text>
<text x="332" y="398" font-size="12" text-anchor="start" fill="#475569">~100 ns · GB–TB</text>
<text x="1108" y="376" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">上下文窗口 20 万–100 万 token</text>
<text x="1108" y="398" font-size="12" text-anchor="end" fill="#475569">每轮整段重读 · 按 token 计费</text>
<rect x="254" y="432" width="932" height="78" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="268" y="464" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">SSD / 本地文件</text>
<text x="268" y="486" font-size="12" text-anchor="start" fill="#475569">~100 µs · TB</text>
<text x="1172" y="464" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">记忆文件、NOTES、transcript、scratchpad</text>
<text x="1172" y="486" font-size="12" text-anchor="end" fill="#475569">需显式工具读取 · 秒级以内</text>
<rect x="190" y="520" width="1060" height="78" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="204" y="552" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">磁盘 / 网络存储</text>
<text x="204" y="574" font-size="12" text-anchor="start" fill="#475569">ms 级 · PB</text>
<text x="1236" y="552" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">RAG 向量库、代码索引、数据库</text>
<text x="1236" y="574" font-size="12" text-anchor="end" fill="#475569">按语义检索 · 召回有损</text>
<rect x="126" y="608" width="1188" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="140" y="640" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">网络</text>
<text x="140" y="662" font-size="12" text-anchor="start" fill="#475569">10–100 ms · 无界</text>
<text x="1300" y="640" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">Web 搜索、外部 API、其他 agent</text>
<text x="1300" y="662" font-size="12" text-anchor="end" fill="#475569">秒级 · 内容不可信</text>
<text x="40" y="110" font-size="13" text-anchor="start" fill="#dc2626">更快 · 更小 · 更贵</text>
<text x="40" y="676" font-size="13" text-anchor="start" fill="#16a34a">更慢 · 更大 · 更便宜</text>
<text x="1400" y="110" font-size="13" text-anchor="end" fill="#475569">左：计算机</text>
<text x="1400" y="132" font-size="13" text-anchor="end" fill="#475569">右：Agent</text></svg>