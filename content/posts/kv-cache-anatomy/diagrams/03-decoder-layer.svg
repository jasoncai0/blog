<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="f03t f03d">
<title id="f03t">一层 decoder 中 KV cache 的读写位置</title>
<desc id="f03d">hidden state 经过 QKV 投影，Q 和 K 做 RoPE，K/V 写入 cache，attention 读取 1 到 t 的全部 K/V，输出经过投影和 FFN 进入下一层。</desc>
<defs>
  <marker id="f03a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
  <marker id="f03b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3d5a80"/></marker>
  <marker id="f03r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="720" fill="#f5f5f5"/>
<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.16em">KV CACHE / 03</text>
  <text x="40" y="62" font-size="17" font-weight="600" fill="#2d3142">一层 decoder：cache 在两个位置进出</text>
  <text x="40" y="84" font-size="9.5" fill="#5a6580">K 过 RoPE 后写入，V 原样写入；attention 每步读 1..t 的全部 K/V；Q 只算一次，不缓存。</text>

  <!-- left notes -->
  <g>
    <rect x="40" y="250" width="180" height="62" rx="4" fill="#ffffff" stroke="#d8dce3"/>
    <rect x="40" y="250" width="4" height="62" fill="#bf4520"/>
    <text x="56" y="272" font-size="10" font-weight="600" fill="#2d3142">① Q 只算一次</text>
    <text x="56" y="290" font-size="8.5" fill="#5a6580">用完即弃，不写 cache。</text>

    <rect x="40" y="332" width="180" height="62" rx="4" fill="#ffffff" stroke="#d8dce3"/>
    <rect x="40" y="332" width="4" height="62" fill="#3d5a80"/>
    <text x="56" y="354" font-size="10" font-weight="600" fill="#2d3142">② K/V 写一次</text>
    <text x="56" y="372" font-size="8.5" fill="#5a6580">K 过 RoPE 后写入，V 原样写入第 t 槽。</text>

    <rect x="40" y="414" width="180" height="62" rx="4" fill="#ffffff" stroke="#d8dce3"/>
    <rect x="40" y="414" width="4" height="62" fill="#3d5a80"/>
    <text x="56" y="436" font-size="10" font-weight="600" fill="#2d3142">③ K/V 读 S 次</text>
    <text x="56" y="454" font-size="8.5" fill="#5a6580">每步 decode 读 1..t。</text>
  </g>

  <!-- h_t -->
  <rect x="330" y="115" width="200" height="40" rx="4" fill="#eceff2" stroke="#c9ced6"/>
  <text x="430" y="140" font-size="10.5" text-anchor="middle" fill="#2d3142">h_t　[B, 1, d_model]</text>
  <line x1="430" y1="155" x2="430" y2="183" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f03a)"/>

  <!-- QKV projection -->
  <rect x="330" y="185" width="200" height="44" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="430" y="203" font-size="10" text-anchor="middle" fill="#2d3142">QKV 投影</text>
  <text x="430" y="218" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" text-anchor="middle" fill="#5a6580">W_Q / W_K / W_V</text>

  <g stroke="#5a6580" stroke-width="1.2" fill="none" marker-end="url(#f03a)">
    <path d="M430 229 L430 242 L305 242 L305 258"/>
    <path d="M430 229 L430 258"/>
    <path d="M430 242 L555 242 L555 258"/>
  </g>

  <!-- Q K V chips -->
  <rect x="255" y="260" width="100" height="38" rx="4" fill="#f7e6e1" stroke="#d99a83"/>
  <text x="305" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12" text-anchor="middle" fill="#bf4520">Q</text>
  <rect x="380" y="260" width="100" height="38" rx="4" fill="#e6ecf4" stroke="#a9bdd8"/>
  <text x="430" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12" text-anchor="middle" fill="#3d5a80">K</text>
  <rect x="505" y="260" width="100" height="38" rx="4" fill="#e6efe9" stroke="#9dbaaa"/>
  <text x="555" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12" text-anchor="middle" fill="#3f6b52">V</text>

  <circle cx="267" cy="272" r="9" fill="#ffffff" stroke="#bf4520"/>
  <text x="267" y="275.5" font-size="8" text-anchor="middle" fill="#bf4520">1</text>

  <!-- RoPE -->
  <rect x="255" y="325" width="100" height="34" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="305" y="346" font-size="9" text-anchor="middle" fill="#2d3142">RoPE</text>
  <rect x="380" y="325" width="100" height="34" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="430" y="346" font-size="9" text-anchor="middle" fill="#2d3142">RoPE</text>

  <g stroke="#5a6580" stroke-width="1.2" fill="none" marker-end="url(#f03a)">
    <path d="M305 298 L305 323"/>
    <path d="M430 298 L430 323"/>
  </g>
  <text x="555" y="315" font-size="8" text-anchor="middle" fill="#8b93a7">V 不做 RoPE</text>

  <!-- write bus -->
  <path d="M480 342 L660 342" stroke="#3d5a80" stroke-width="1.4" fill="none"/>
  <path d="M555 298 L660 298 L660 381" stroke="#3d5a80" stroke-width="1.4" fill="none"/>
  <g stroke="#3d5a80" stroke-width="1.4" fill="none" marker-end="url(#f03b)">
    <path d="M660 330 L678 330"/>
    <path d="M660 381 L678 381"/>
  </g>
  <circle cx="660" cy="320" r="9" fill="#ffffff" stroke="#3d5a80"/>
  <text x="660" y="323.5" font-size="8" text-anchor="middle" fill="#3d5a80">2</text>
  <text x="648" y="314" font-size="8" text-anchor="end" fill="#3d5a80">写第 t 槽</text>

  <!-- cache -->
  <rect x="680" y="285" width="240" height="170" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="700" y="308" font-size="10.5" font-weight="600" fill="#2d3142">KV cache · layer l</text>
  <text x="700" y="328" font-size="8.5" fill="#5a6580">K</text>
  <rect x="720" y="316" width="180" height="30" rx="2" fill="#e6ecf4" stroke="#a9bdd8"/>
  <text x="888" y="335" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" text-anchor="end" fill="#3d5a80">…  t-1  t</text>
  <text x="700" y="378" font-size="8.5" fill="#5a6580">V</text>
  <rect x="720" y="366" width="180" height="30" rx="2" fill="#e6efe9" stroke="#9dbaaa"/>
  <text x="888" y="385" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" text-anchor="end" fill="#3f6b52">…  t-1  t</text>

  <path d="M680 420 L642 420" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#f03r)"/>
  <text x="700" y="416" font-size="8.5" fill="#bf4520">每步读 1..t</text>
  <text x="700" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">[B, H_kv, S, d_head]</text>
  <text x="700" y="452" font-size="8" fill="#8b93a7">每层一份，共 L 份</text>

  <!-- attention -->
  <rect x="255" y="405" width="385" height="70" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="447" y="428" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3142">Attention</text>
  <text x="447" y="448" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" text-anchor="middle" fill="#5a6580">softmax(q_t · K[1..t]ᵀ / √d) · V[1..t]</text>
  <text x="447" y="464" font-size="8" text-anchor="middle" fill="#8b93a7">Q 来自当前 token，K/V 来自 cache</text>
  <circle cx="267" cy="420" r="9" fill="#ffffff" stroke="#bf4520"/>
  <text x="267" y="423.5" font-size="8" text-anchor="middle" fill="#bf4520">3</text>

  <line x1="305" y1="359" x2="305" y2="403" stroke="#bf4520" stroke-width="1.2" marker-end="url(#f03r)"/>
  <text x="315" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">q_t</text>

  <!-- output path -->
  <line x1="447" y1="475" x2="447" y2="503" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f03a)"/>
  <rect x="330" y="505" width="200" height="38" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="430" y="528" font-size="9.5" text-anchor="middle" fill="#2d3142">输出投影 W_O</text>
  <line x1="430" y1="543" x2="430" y2="573" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f03a)"/>
  <rect x="330" y="575" width="200" height="44" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="430" y="593" font-size="9.5" text-anchor="middle" fill="#2d3142">+ 残差</text>
  <text x="430" y="608" font-size="9.5" text-anchor="middle" fill="#2d3142">FFN</text>
  <line x1="430" y1="619" x2="430" y2="647" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f03a)"/>
  <text x="430" y="666" font-size="10" text-anchor="middle" fill="#2d3142">h_{t+1} → 下一层</text>

  <text x="40" y="694" font-size="8.5" fill="#5a6580">prefill 一次写 S 个槽位；decode 每步写 1 个、读 S 个。L 层各有一份，不能只存最后一层。</text>
</g>
</svg>
