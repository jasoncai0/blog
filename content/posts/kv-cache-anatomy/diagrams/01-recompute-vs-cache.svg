<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f01t f01d">
<title id="f01t">重算整段前缀与只算新 token 的对比</title>
<desc id="f01d">左侧每一步重算 1 到 t 的全部 token，右侧只计算新 token，前缀的 K/V 从 cache 读取。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.16em">KV CACHE / 01</text>
  <text x="40" y="62" font-size="17" font-weight="600" fill="#2d3142">同一段输出，两种算法</text>
  <text x="40" y="84" font-size="9.5" fill="#5a6580">下三角是每步实际参与的 token。左边每步重算整段前缀，右边只算新 token，前缀从 cache 读。</text>

  <rect x="40" y="108" width="420" height="356" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <rect x="500" y="108" width="420" height="356" rx="4" fill="#ffffff" stroke="#d8dce3"/>

  <text x="64" y="140" font-size="12" font-weight="600" fill="#2d3142">没有 cache：每步重算 1..t</text>
  <text x="64" y="160" font-size="8.5" fill="#5a6580">浅红 = 重算，深红 = 新 token，空白 = 未来 token</text>
  <text x="524" y="140" font-size="12" font-weight="600" fill="#2d3142">有 cache：只算新 token</text>
  <text x="524" y="160" font-size="8.5" fill="#5a6580">蓝 = 从 cache 读 K/V，深红 = 新 token</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8b93a7">
    <text x="107" y="184" text-anchor="middle">x1</text>
    <text x="169" y="184" text-anchor="middle">x2</text>
    <text x="231" y="184" text-anchor="middle">x3</text>
    <text x="293" y="184" text-anchor="middle">x4</text>
    <text x="355" y="184" text-anchor="middle">x5</text>
    <text x="567" y="184" text-anchor="middle">x1</text>
    <text x="629" y="184" text-anchor="middle">x2</text>
    <text x="691" y="184" text-anchor="middle">x3</text>
    <text x="753" y="184" text-anchor="middle">x4</text>
    <text x="815" y="184" text-anchor="middle">x5</text>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8b93a7" text-anchor="end">
    <text x="70" y="212">t=1</text>
    <text x="70" y="254">t=2</text>
    <text x="70" y="296">t=3</text>
    <text x="70" y="338">t=4</text>
    <text x="70" y="380">t=5</text>
    <text x="530" y="212">t=1</text>
    <text x="530" y="254">t=2</text>
    <text x="530" y="296">t=3</text>
    <text x="530" y="338">t=4</text>
    <text x="530" y="380">t=5</text>
  </g>

  <!-- left grid -->
  <g>
    <rect x="78" y="190" width="58" height="38" fill="#bf4520"/>
    <rect x="140" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="202" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="264" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="326" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="78" y="232" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="140" y="232" width="58" height="38" fill="#bf4520"/>
    <rect x="202" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="264" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="326" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="78" y="274" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="140" y="274" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="202" y="274" width="58" height="38" fill="#bf4520"/>
    <rect x="264" y="274" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="326" y="274" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="78" y="316" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="140" y="316" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="202" y="316" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="264" y="316" width="58" height="38" fill="#bf4520"/>
    <rect x="326" y="316" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="78" y="358" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="140" y="358" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="202" y="358" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="264" y="358" width="58" height="38" fill="#f7e6e1" stroke="#d99a83"/>
    <rect x="326" y="358" width="58" height="38" fill="#bf4520"/>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" text-anchor="middle">
    <g fill="#ffffff">
      <text x="107" y="213">1</text><text x="169" y="255">2</text><text x="231" y="297">3</text><text x="293" y="339">4</text><text x="355" y="381">5</text>
    </g>
    <g fill="#8b5a48">
      <text x="107" y="255">1</text><text x="107" y="297">1</text><text x="169" y="297">2</text><text x="107" y="339">1</text><text x="169" y="339">2</text><text x="231" y="339">3</text><text x="107" y="381">1</text><text x="169" y="381">2</text><text x="231" y="381">3</text><text x="293" y="381">4</text>
    </g>
  </g>

  <!-- right grid -->
  <g>
    <rect x="538" y="190" width="58" height="38" fill="#bf4520"/>
    <rect x="600" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="662" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="724" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="786" y="190" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="538" y="232" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="600" y="232" width="58" height="38" fill="#bf4520"/>
    <rect x="662" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="724" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="786" y="232" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="538" y="274" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="600" y="274" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="662" y="274" width="58" height="38" fill="#bf4520"/>
    <rect x="724" y="274" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>
    <rect x="786" y="274" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="538" y="316" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="600" y="316" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="662" y="316" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="724" y="316" width="58" height="38" fill="#bf4520"/>
    <rect x="786" y="316" width="58" height="38" fill="#ffffff" stroke="#e3e6eb"/>

    <rect x="538" y="358" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="600" y="358" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="662" y="358" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="724" y="358" width="58" height="38" fill="#e6ecf4" stroke="#a9bdd8"/>
    <rect x="786" y="358" width="58" height="38" fill="#bf4520"/>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" text-anchor="middle">
    <g fill="#ffffff">
      <text x="567" y="213">1</text><text x="629" y="255">2</text><text x="691" y="297">3</text><text x="753" y="339">4</text><text x="815" y="381">5</text>
    </g>
    <g fill="#4f6685">
      <text x="567" y="255">1</text><text x="567" y="297">1</text><text x="629" y="297">2</text><text x="567" y="339">1</text><text x="629" y="339">2</text><text x="691" y="339">3</text><text x="567" y="381">1</text><text x="629" y="381">2</text><text x="691" y="381">3</text><text x="753" y="381">4</text>
    </g>
  </g>

  <text x="78" y="422" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#bf4520">每层 ∝ 1+2+…+N</text>
  <text x="78" y="440" font-size="9" fill="#5a6580">N 步合计 O(N³d)</text>
  <text x="538" y="422" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#3d5a80">每层 = N 次</text>
  <text x="538" y="440" font-size="9" fill="#5a6580">N 步合计 O(N²d)</text>

  <rect x="40" y="488" width="880" height="48" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="60" y="508" font-size="9.5" fill="#2d3142">代价：每层多存 2×S×d 个元素，并且每步要把它们从 HBM 读一遍。</text>
  <text x="60" y="524" font-size="9.5" fill="#5a6580">省下的是算力，花掉的是显存容量和带宽——后面的分页、量化、驱逐都在还这笔账。</text>
</g>
</svg>
