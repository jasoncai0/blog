<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="f07t f07d">
<title id="f07t">KV 块的生命周期状态机与请求侧抢占</title>
<desc id="f07d">五个块状态 Free、Writing、Sealed、Shared、Evictable 之间的分配、写满、共享、释放、命中、回收和写时复制迁移；下方是请求侧 Waiting、Prefill、Decode、Finished 的生命周期与 preempt 回退。</desc>
<defs>
  <marker id="f07a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#bf4520"/>
  </marker>
  <marker id="f07b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#3d5a80"/>
  </marker>
  <marker id="f07c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#8b93a7"/>
  </marker>
</defs>
<rect width="960" height="720" fill="#f5f5f5"/>
<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.16em">KV CACHE / 07</text>
  <text x="40" y="62" font-size="17" font-weight="600" fill="#2d3142">块的生命周期：五个状态，三条不变量</text>
  <text x="40" y="84" font-size="9.5" fill="#5a6580">上半是块的状态机；下半左是请求的状态线，下半右是排障时真正要断言的三个条件。</text>

  <!-- COW arc -->
  <path d="M800,280 C800,120 400,120 340,162" fill="none" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f07a)"/>
  <text x="560" y="110" font-size="8" fill="#bf4520" text-anchor="middle">COW：写共享块 → 复制到新块，新块进 Writing</text>

  <!-- Free -->
  <rect x="40" y="170" width="140" height="64" rx="4" fill="#ffffff" stroke="#8b93a7"/>
  <text x="110" y="196" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Free</text>
  <text x="110" y="216" font-size="8" fill="#8b93a7" text-anchor="middle">空闲链表 · ref=0</text>

  <!-- Writing -->
  <rect x="260" y="170" width="140" height="64" rx="4" fill="#f7e6e1" stroke="#bf4520"/>
  <text x="330" y="196" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">Writing</text>
  <text x="330" y="216" font-size="8" fill="#8b4a35" text-anchor="middle">正在写 · 内容不完整</text>

  <!-- Sealed -->
  <rect x="490" y="170" width="140" height="64" rx="4" fill="#e8edf4" stroke="#3d5a80"/>
  <text x="560" y="196" font-size="12" font-weight="600" fill="#3d5a80" text-anchor="middle">Sealed</text>
  <text x="560" y="216" font-size="8" fill="#3d5a80" text-anchor="middle">写满 · 不可变 · ref=1</text>

  <!-- Shared -->
  <rect x="730" y="280" width="140" height="64" rx="4" fill="#fdf4f1" stroke="#bf4520" stroke-width="1.6"/>
  <text x="800" y="306" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">Shared</text>
  <text x="800" y="326" font-size="8" fill="#8b4a35" text-anchor="middle">ref&gt;1 · 只读</text>

  <!-- Evictable -->
  <rect x="490" y="420" width="140" height="64" rx="4" fill="#e6efe9" stroke="#3f6b52"/>
  <text x="560" y="446" font-size="12" font-weight="600" fill="#3f6b52" text-anchor="middle">Evictable</text>
  <text x="560" y="466" font-size="8" fill="#3f6b52" text-anchor="middle">ref=0 · 可命中可回收</text>

  <!-- transitions -->
  <g fill="none" stroke-width="1.3">
    <path d="M180,202 L252,202" stroke="#bf4520" marker-end="url(#f07a)"/>
    <path d="M400,202 L482,202" stroke="#bf4520" marker-end="url(#f07a)"/>
    <path d="M630,210 C680,220 720,260 730,288" stroke="#3d5a80" marker-end="url(#f07b)"/>
    <path d="M730,300 C680,300 640,250 630,224" stroke="#3d5a80" marker-end="url(#f07b)"/>
    <path d="M590,234 L590,412" stroke="#8b93a7" marker-end="url(#f07c)"/>
    <path d="M630,420 L630,242" stroke="#3d5a80" marker-end="url(#f07b)"/>
    <path d="M490,452 C380,500 140,480 140,242" stroke="#8b93a7" marker-end="url(#f07c)"/>
  </g>

  <g font-size="7.5" fill="#5a6580">
    <text x="190" y="192">allocate</text>
    <text x="410" y="192">写满 · ref=1</text>
    <text x="668" y="226">share · ref++</text>
    <text x="665" y="315">release · ref--</text>
    <text x="600" y="330" fill="#3d5a80">ref=0</text>
    <text x="640" y="330" fill="#3d5a80">hit · ref=1</text>
    <text x="250" y="492">reclaim · LRU</text>
  </g>

  <!-- request lifecycle -->
  <rect x="40" y="510" width="430" height="150" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="60" y="534" font-size="10" font-weight="600" fill="#2d3142">请求侧：另一条状态线</text>

  <rect x="55" y="548" width="85" height="34" rx="3" fill="#ffffff" stroke="#8b93a7"/>
  <text x="97" y="569" font-size="8" fill="#2d3142" text-anchor="middle">Waiting</text>
  <rect x="155" y="548" width="85" height="34" rx="3" fill="#f7e6e1" stroke="#bf4520"/>
  <text x="197" y="569" font-size="8" fill="#bf4520" text-anchor="middle">Prefill</text>
  <rect x="255" y="548" width="85" height="34" rx="3" fill="#e8edf4" stroke="#3d5a80"/>
  <text x="297" y="569" font-size="8" fill="#3d5a80" text-anchor="middle">Decode</text>
  <rect x="355" y="548" width="85" height="34" rx="3" fill="#e6efe9" stroke="#3f6b52"/>
  <text x="397" y="569" font-size="8" fill="#3f6b52" text-anchor="middle">Finished</text>

  <g fill="none" stroke-width="1.2">
    <path d="M140,565 L150,565" stroke="#8b93a7" marker-end="url(#f07c)"/>
    <path d="M240,565 L250,565" stroke="#8b93a7" marker-end="url(#f07c)"/>
    <path d="M340,565 L350,565" stroke="#8b93a7" marker-end="url(#f07c)"/>
  </g>

  <path d="M297,582 L297,600 L97,600 L97,588" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f07a)"/>
  <text x="110" y="618" font-size="7.5" fill="#bf4520">preempt：swap 或 recompute，回 Waiting</text>
  <text x="60" y="644" font-size="7.5" fill="#5a6580">短请求用 recompute 更划算；长请求用 swap，代价是 PCIe 带宽。</text>

  <!-- invariants -->
  <rect x="490" y="510" width="430" height="150" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="510" y="534" font-size="10" font-weight="600" fill="#2d3142">三条不变量：能写成断言，也能上监控</text>

  <circle cx="518" cy="558" r="7" fill="#f7e6e1" stroke="#bf4520"/>
  <text x="518" y="561" font-size="7" fill="#bf4520" text-anchor="middle">1</text>
  <text x="532" y="562" font-size="8" fill="#2d3142">Sealed 块的内容哈希不变</text>

  <circle cx="518" cy="584" r="7" fill="#e8edf4" stroke="#3d5a80"/>
  <text x="518" y="587" font-size="7" fill="#3d5a80" text-anchor="middle">2</text>
  <text x="532" y="588" font-size="8" fill="#2d3142">ref_count = 所有 block table 的引用数</text>

  <circle cx="518" cy="610" r="7" fill="#e6efe9" stroke="#3f6b52"/>
  <text x="518" y="613" font-size="7" fill="#3f6b52" text-anchor="middle">3</text>
  <text x="532" y="614" font-size="8" fill="#2d3142">只有 ref=0 的块能回到 Free 链表</text>

  <text x="510" y="642" font-size="7.5" fill="#5a6580">对不上：哈希变 → 有人绕过 COW；ref 对不上 → 泄漏或重复释放。</text>

  <text x="40" y="690" font-size="8.5" fill="#5a6580">状态机的价值不在图，在三条不变量：它们能被断言，也能被监控。</text>
</g>
</svg>
