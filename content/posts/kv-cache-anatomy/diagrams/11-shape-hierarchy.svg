<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f11t f11d">
  <title id="f11t">从一条 K 向量到整份 KV Cache 的形状层级</title>
  <desc id="f11d">一条 K 向量是 d_head 个数；同一层同一 token 有 H_kv 条，S 个 token 叠成矩阵；再加上 B 个请求和 L 层，得到整份 cache。字节数是这些轴长度的乘积，再乘 2（K/V）和 dtype 大小。</desc>
  <defs>
    <marker id="f11a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#5a6580"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing=".16em">KV CACHE / 11</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">从一条向量到整份 cache</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#5a6580">每一层、每个 KV 头、每个 token 都有一对 K/V 向量；把这些轴乘起来，才是显存账本。</text>

  <!-- 左：整份 cache -->
  <rect x="40" y="110" width="250" height="320" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="56" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">整份 cache</text>
  <text x="56" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">L 层 × B 个请求；K/V 各一份</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">
    <rect x="56" y="174" width="218" height="42" rx="3" fill="#eceff2" stroke="#c9ced6"/>
    <text x="66" y="194">L0</text>
    <rect x="110" y="184" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="136" y="184" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="162" y="184" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="188" y="184" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>

    <rect x="56" y="224" width="218" height="42" rx="3" fill="#eceff2" stroke="#c9ced6"/>
    <text x="66" y="244">L1</text>
    <rect x="110" y="234" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="136" y="234" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="162" y="234" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="188" y="234" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>

    <rect x="56" y="274" width="218" height="42" rx="3" fill="#eceff2" stroke="#c9ced6"/>
    <text x="66" y="294">L2</text>
    <rect x="110" y="284" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="136" y="284" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="162" y="284" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
    <rect x="188" y="284" width="20" height="22" rx="2" fill="#ffffff" stroke="#c9ced6"/>
  </g>

  <text x="56" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">L=3、B=4（示意）</text>
  <text x="56" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#3d5a80">[L, B, H_kv, S, d_head]</text>
  <text x="56" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">每层一份；K 和 V 各一份</text>

  <!-- 左到中 -->
  <path d="M290 270 H326" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f11a)"/>
  <text x="296" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">取一层</text>

  <!-- 中：一层 -->
  <rect x="330" y="110" width="300" height="320" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="346" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">取一层</text>
  <text x="346" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">B 个请求 × H_kv 个头 × S 个 token</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">
    <rect x="346" y="174" width="120" height="196" rx="3" fill="#f9fafb" stroke="#dfe3e9"/>
    <text x="356" y="190" font-size="7.5">B=1</text>
    <rect x="480" y="174" width="120" height="196" rx="3" fill="#f9fafb" stroke="#dfe3e9"/>
    <text x="490" y="190" font-size="7.5">B=2</text>

    <!-- B=1 grid: 4 rows x 3 cols, each cell a vector -->
    <g fill="#eceff2" stroke="#c9ced6">
      <rect x="364" y="202" width="24" height="18" rx="2"/><rect x="392" y="202" width="24" height="18" rx="2"/><rect x="420" y="202" width="24" height="18" rx="2"/>
      <rect x="364" y="226" width="24" height="18" rx="2"/><rect x="392" y="226" width="24" height="18" rx="2"/><rect x="420" y="226" width="24" height="18" rx="2"/>
      <rect x="364" y="250" width="24" height="18" rx="2"/><rect x="392" y="250" width="24" height="18" rx="2"/><rect x="420" y="250" width="24" height="18" rx="2"/>
      <rect x="364" y="274" width="24" height="18" rx="2"/><rect x="392" y="274" width="24" height="18" rx="2"/><rect x="420" y="274" width="24" height="18" rx="2"/>
    </g>
    <!-- B=2 grid -->
    <g fill="#eceff2" stroke="#c9ced6">
      <rect x="498" y="202" width="24" height="18" rx="2"/><rect x="526" y="202" width="24" height="18" rx="2"/><rect x="554" y="202" width="24" height="18" rx="2"/>
      <rect x="498" y="226" width="24" height="18" rx="2"/><rect x="526" y="226" width="24" height="18" rx="2"/><rect x="554" y="226" width="24" height="18" rx="2"/>
      <rect x="498" y="250" width="24" height="18" rx="2"/><rect x="526" y="250" width="24" height="18" rx="2"/><rect x="554" y="250" width="24" height="18" rx="2"/>
      <rect x="498" y="274" width="24" height="18" rx="2"/><rect x="526" y="274" width="24" height="18" rx="2"/><rect x="554" y="274" width="24" height="18" rx="2"/>
    </g>
    <text x="364" y="310" font-size="7" fill="#8b93a7">4 行 = H_kv</text>
    <text x="364" y="324" font-size="7" fill="#8b93a7">3 列 = S；一格 = 一条向量</text>
  </g>

  <text x="346" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#3d5a80">[B, H_kv, S, d_head]</text>
  <text x="346" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">B=2、H_kv=4、S=3（示意）</text>

  <!-- 中到右 -->
  <path d="M630 270 H664" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f11a)"/>
  <text x="636" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">取 token</text>
  <text x="636" y="257" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">或一个头</text>

  <!-- 右：一条向量 -->
  <rect x="670" y="110" width="250" height="320" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="686" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">取一个 token、一个头</text>
  <text x="686" y="154" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">K 和 V 各一条向量</text>

  <text x="686" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#3d5a80">K</text>
  <g fill="#eceff2" stroke="#c9ced6">
    <rect x="710" y="190" width="18" height="22" rx="2"/><rect x="730" y="190" width="18" height="22" rx="2"/><rect x="750" y="190" width="18" height="22" rx="2"/><rect x="770" y="190" width="18" height="22" rx="2"/>
    <rect x="790" y="190" width="18" height="22" rx="2"/><rect x="810" y="190" width="18" height="22" rx="2"/><rect x="830" y="190" width="18" height="22" rx="2"/><rect x="850" y="190" width="18" height="22" rx="2"/>
  </g>

  <text x="686" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#3f6b52">V</text>
  <g fill="#e6efe9" stroke="#c9ced6">
    <rect x="710" y="238" width="18" height="22" rx="2"/><rect x="730" y="238" width="18" height="22" rx="2"/><rect x="750" y="238" width="18" height="22" rx="2"/><rect x="770" y="238" width="18" height="22" rx="2"/>
    <rect x="790" y="238" width="18" height="22" rx="2"/><rect x="810" y="238" width="18" height="22" rx="2"/><rect x="830" y="238" width="18" height="22" rx="2"/><rect x="850" y="238" width="18" height="22" rx="2"/>
  </g>

  <path d="M710 274 H868" stroke="#8b93a7" stroke-width="1"/>
  <text x="710" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">d_head（示意 8 格）</text>

  <text x="686" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#3d5a80">[d_head]</text>
  <text x="686" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">rank 1：每个格子是一个数</text>
  <text x="686" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">V 同形，另存一份</text>

  <!-- 底部公式 -->
  <rect x="40" y="460" width="880" height="120" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="56" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">字节数 = 轴的乘积</text>
  <text x="56" y="508" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#bf4520">bytes = 2 × L × B × H_kv × S × d_head × dtype_bytes</text>
  <text x="56" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">2 = K/V 各一份；BF16 的 dtype_bytes = 2。</text>
  <text x="56" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">rank 是轴数，不是轴长：一条向量 rank 1，一层 rank 4，整份 rank 5；128 维 = 轴长 128 的 rank-1 张量。</text>
  <text x="56" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">8B：2 × 32 × 8 × 128 × 2 = 128 KiB/token；8K 上下文 = 1 GiB。</text>
</svg>
