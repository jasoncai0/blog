<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f05t f05d">
<title id="f05t">静态批处理与连续批处理的时间线对比</title>
<desc id="f05d">上半部分静态批处理要等最长的请求结束，短请求的槽位空转；下半部分连续批处理在每个 iteration 重排，完成的请求退出，排队的 D、E 立刻补位。</desc>
<rect width="960" height="640" fill="#f5f5f5"/>
<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.16em">KV CACHE / 05</text>
  <text x="40" y="62" font-size="17" font-weight="600" fill="#2d3142">批处理：从“等一批”到“每一步重排”</text>
  <text x="40" y="84" font-size="9.5" fill="#5a6580">同一个时间轴。上：静态批处理；下：连续批处理（continuous batching）。</text>

  <g font-size="8" fill="#5a6580">
    <rect x="640" y="96" width="10" height="10" fill="#bf4520"/>
    <text x="655" y="105">prefill</text>
    <rect x="720" y="96" width="10" height="10" fill="#3d5a80"/>
    <text x="735" y="105">decode</text>
    <rect x="800" y="96" width="10" height="10" fill="#f0f1f3" stroke="#c9ced6" stroke-dasharray="2 2"/>
    <text x="815" y="105">空转</text>
  </g>

  <rect x="40" y="112" width="880" height="188" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="60" y="140" font-size="12" font-weight="600" fill="#2d3142">静态批：batch 固定，等最长的请求</text>

  <g stroke="#eceef2">
    <line x1="160" y1="158" x2="160" y2="278"/>
    <line x1="250" y1="158" x2="250" y2="278"/>
    <line x1="340" y1="158" x2="340" y2="278"/>
    <line x1="430" y1="158" x2="430" y2="278"/>
    <line x1="520" y1="158" x2="520" y2="278"/>
    <line x1="610" y1="158" x2="610" y2="278"/>
    <line x1="700" y1="158" x2="700" y2="278"/>
    <line x1="790" y1="158" x2="790" y2="278"/>
    <line x1="880" y1="158" x2="880" y2="278"/>
  </g>

  <g font-size="9" fill="#2d3142">
    <text x="70" y="189">A</text>
    <text x="70" y="229">B</text>
    <text x="70" y="269">C</text>
  </g>

  <!-- static bars -->
  <rect x="160" y="174" width="90" height="20" fill="#bf4520"/>
  <rect x="250" y="174" width="630" height="20" fill="#3d5a80"/>
  <text x="205" y="188" font-size="7.5" fill="#ffffff" text-anchor="middle">prefill</text>
  <text x="565" y="188" font-size="7.5" fill="#ffffff" text-anchor="middle">decode</text>

  <rect x="160" y="214" width="90" height="20" fill="#bf4520"/>
  <rect x="250" y="214" width="270" height="20" fill="#3d5a80"/>
  <rect x="520" y="214" width="360" height="20" fill="#f0f1f3" stroke="#c9ced6" stroke-dasharray="2 2"/>
  <text x="700" y="228" font-size="7.5" fill="#8b93a7" text-anchor="middle">空转</text>

  <rect x="160" y="254" width="90" height="20" fill="#bf4520"/>
  <rect x="250" y="254" width="360" height="20" fill="#3d5a80"/>
  <rect x="610" y="254" width="270" height="20" fill="#f0f1f3" stroke="#c9ced6" stroke-dasharray="2 2"/>
  <text x="745" y="268" font-size="7.5" fill="#8b93a7" text-anchor="middle">空转</text>

  <line x1="880" y1="158" x2="880" y2="278" stroke="#bf4520" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="874" y="292" font-size="8" text-anchor="end" fill="#bf4520">t=8 才释放整个 batch</text>

  <rect x="40" y="320" width="880" height="270" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="60" y="350" font-size="12" font-weight="600" fill="#2d3142">连续批：每个 iteration 重排，完成即走、空位即补</text>

  <g stroke="#eceef2">
    <line x1="160" y1="368" x2="160" y2="540"/>
    <line x1="250" y1="368" x2="250" y2="540"/>
    <line x1="340" y1="368" x2="340" y2="540"/>
    <line x1="430" y1="368" x2="430" y2="540"/>
    <line x1="520" y1="368" x2="520" y2="540"/>
    <line x1="610" y1="368" x2="610" y2="540"/>
    <line x1="700" y1="368" x2="700" y2="540"/>
    <line x1="790" y1="368" x2="790" y2="540"/>
    <line x1="880" y1="368" x2="880" y2="540"/>
  </g>

  <g font-size="9" fill="#2d3142">
    <text x="70" y="393">A</text>
    <text x="70" y="428">B</text>
    <text x="70" y="463">C</text>
    <text x="70" y="498">D</text>
    <text x="70" y="533">E</text>
  </g>

  <!-- continuous bars -->
  <rect x="160" y="380" width="90" height="18" fill="#bf4520"/>
  <rect x="250" y="380" width="630" height="18" fill="#3d5a80"/>

  <rect x="160" y="415" width="90" height="18" fill="#bf4520"/>
  <rect x="250" y="415" width="270" height="18" fill="#3d5a80"/>

  <rect x="160" y="450" width="90" height="18" fill="#bf4520"/>
  <rect x="250" y="450" width="360" height="18" fill="#3d5a80"/>

  <rect x="520" y="485" width="45" height="18" fill="#bf4520"/>
  <rect x="565" y="485" width="315" height="18" fill="#3d5a80"/>

  <rect x="610" y="520" width="45" height="18" fill="#bf4520"/>
  <rect x="655" y="520" width="225" height="18" fill="#3d5a80"/>

  <g stroke="#bf4520" stroke-width="1" stroke-dasharray="3 3">
    <line x1="520" y1="368" x2="520" y2="540"/>
    <line x1="610" y1="368" x2="610" y2="540"/>
  </g>
  <text x="526" y="370" font-size="7.5" fill="#bf4520">B 结束，D 补位</text>
  <text x="616" y="370" font-size="7.5" fill="#bf4520">C 结束，E 补位</text>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8b93a7" text-anchor="middle">
    <text x="160" y="562">0</text>
    <text x="250" y="562">1</text>
    <text x="340" y="562">2</text>
    <text x="430" y="562">3</text>
    <text x="520" y="562">4</text>
    <text x="610" y="562">5</text>
    <text x="700" y="562">6</text>
    <text x="790" y="562">7</text>
    <text x="880" y="562">8</text>
  </g>

  <text x="40" y="614" font-size="8.5" fill="#5a6580">连续批处理的前提：每段 cache 能独立分配、独立释放。没有分页，空出的槽位无法安全地交给下一个请求。</text>
</g>
</svg>
