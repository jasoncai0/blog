<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f10t f10d">
<title id="f10t">KV Cache 从逻辑块表到推理实例与 GPU HBM 的落点</title>
<desc id="f10d">客户端会话经 cache-aware router 选择副本；逻辑块表只存块编号，Engine Replica A 和 B 各自持有 cache domain，物理块按张量并行切分落在 Node 1 和 Node 2 的 GPU HBM。跨 domain 需要 KV transfer，冷前缀可以下沉到远端 KV 池。</desc>
<defs>
  <marker id="f10a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#bf4520"/>
  </marker>
  <marker id="f10b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#3f6b52"/>
  </marker>
  <marker id="f10c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#3d5a80"/>
  </marker>
  <marker id="f10d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#8b93a7"/>
  </marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>
<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="0.16em">KV CACHE / 10</text>
  <text x="40" y="62" font-size="17" font-weight="600" fill="#2d3142">cache 的落点：逻辑块、实例与 HBM</text>
  <text x="40" y="84" font-size="9.5" fill="#5a6580">路由选的是 cache domain；块表只存编号，真正的 K/V 落在具体 GPU 的 HBM。</text>

  <!-- client and router -->
  <rect x="40" y="108" width="150" height="58" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <text x="115" y="132" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">客户端 / 会话</text>
  <text x="115" y="148" font-size="7.5" fill="#5a6580" text-anchor="middle">session S1 · prompt 前缀</text>

  <rect x="235" y="108" width="190" height="58" rx="4" fill="#f7e6e1" stroke="#d99a83"/>
  <text x="330" y="132" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Cache-aware Router</text>
  <text x="330" y="148" font-size="7.5" fill="#5a6580" text-anchor="middle">prefix hash → 副本</text>

  <line x1="190" y1="137" x2="229" y2="137" stroke="#3f6b52" stroke-width="1.2" marker-end="url(#f10b)"/>
  <text x="196" y="129" font-size="7.5" fill="#5a6580">请求</text>

  <line x1="330" y1="166" x2="330" y2="204" stroke="#3f6b52" stroke-width="1.2" marker-end="url(#f10b)"/>
  <text x="338" y="184" font-size="7.5" fill="#5a6580">命中</text>

  <path d="M425 137 H835 V204" fill="none" stroke="#8b93a7" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f10d)"/>
  <text x="580" y="129" font-size="7.5" fill="#8b93a7">miss / 新会话</text>

  <!-- logical block table -->
  <rect x="40" y="220" width="170" height="112" rx="4" fill="#ffffff" stroke="#c9ced6"/>
  <rect x="40" y="220" width="4" height="112" fill="#3d5a80"/>
  <text x="56" y="242" font-size="10" font-weight="600" fill="#2d3142">逻辑 Block Table</text>
  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#3d5a80">
    <text x="56" y="264">L0 → P3</text>
    <text x="56" y="282">L1 → P7</text>
    <text x="56" y="300">L2 → P1</text>
  </g>
  <text x="56" y="320" font-size="7.5" fill="#8b93a7">只存编号，不存 K/V</text>

  <path d="M210 264 L244 248" fill="none" stroke="#3d5a80" stroke-width="1.1" marker-end="url(#f10c)"/>
  <text x="210" y="246" font-size="7.5" fill="#5a6580">映射</text>

  <!-- cache domain A -->
  <rect x="232" y="192" width="466" height="112" rx="4" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="188" font-size="8" fill="#bf4520">cache domain A</text>

  <rect x="250" y="210" width="190" height="76" rx="4" fill="#e6efe9" stroke="#3f6b52"/>
  <text x="345" y="236" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Engine Replica A</text>
  <text x="345" y="252" font-size="7.5" fill="#5a6580" text-anchor="middle">scheduler · TP=4</text>
  <text x="345" y="268" font-size="7.5" fill="#8b93a7" text-anchor="middle">prefix cache + block table</text>

  <line x1="440" y1="248" x2="494" y2="248" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#f10c)"/>
  <text x="450" y="240" font-size="7.5" fill="#5a6580">HBM</text>

  <rect x="500" y="210" width="190" height="76" rx="4" fill="#f7e6e1" stroke="#d99a83"/>
  <text x="595" y="236" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Node 1 · GPU0–3</text>
  <text x="595" y="252" font-size="7.5" fill="#5a6580" text-anchor="middle">HBM: P3/P7/P1</text>
  <text x="595" y="268" font-size="7.5" fill="#8b93a7" text-anchor="middle">4 个 shard</text>

  <!-- cache domain B -->
  <rect x="722" y="192" width="226" height="230" rx="4" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="730" y="188" font-size="8" fill="#bf4520">cache domain B</text>

  <rect x="740" y="210" width="190" height="76" rx="4" fill="#e6efe9" stroke="#3f6b52"/>
  <text x="835" y="236" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Engine Replica B</text>
  <text x="835" y="252" font-size="7.5" fill="#5a6580" text-anchor="middle">scheduler · 自己的块表</text>
  <text x="835" y="268" font-size="7.5" fill="#8b93a7" text-anchor="middle">另一个前缀索引</text>

  <line x1="835" y1="286" x2="835" y2="324" stroke="#3d5a80" stroke-width="1.2" marker-end="url(#f10c)"/>
  <text x="845" y="306" font-size="7.5" fill="#5a6580">自己的 cache</text>

  <rect x="740" y="330" width="190" height="76" rx="4" fill="#f7e6e1" stroke="#d99a83"/>
  <text x="835" y="356" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Node 2 · GPU4–7</text>
  <text x="835" y="372" font-size="7.5" fill="#5a6580" text-anchor="middle">HBM: B 的 cache</text>
  <text x="835" y="388" font-size="7.5" fill="#8b93a7" text-anchor="middle">B 的 4 个 shard</text>

  <!-- KV transfer -->
  <path d="M345 286 V452 H705 V248 H734" fill="none" stroke="#8b93a7" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f10d)"/>
  <text x="500" y="444" font-size="7.5" fill="#8b93a7">KV transfer</text>

  <!-- remote pool -->
  <rect x="740" y="460" width="190" height="70" rx="4" fill="#f3f0f7" stroke="#a99bbf"/>
  <text x="835" y="486" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">远端 KV 池</text>
  <text x="835" y="504" font-size="7.5" fill="#5a6580" text-anchor="middle">RDMA · 冷前缀 / 跨域</text>

  <line x1="835" y1="406" x2="835" y2="454" stroke="#8b93a7" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f10d)"/>
  <text x="845" y="430" font-size="7.5" fill="#8b93a7">RDMA</text>

  <!-- bottom notes -->
  <rect x="40" y="552" width="880" height="48" rx="4" fill="#ffffff" stroke="#d8dce3"/>
  <text x="56" y="570" font-size="8.5" fill="#5a6580">块表只存编号；P3/P7/P1 按 TP=4 切成 shard，落到 GPU0–3 的 HBM。</text>
  <text x="56" y="584" font-size="8.5" fill="#5a6580">cache domain = 能共享同一前缀索引、低延迟读到同一批块的引擎集合。</text>
  <text x="56" y="598" font-size="8.5" fill="#5a6580">跨域 2.5 GiB/8K：NVLink 约 3 ms，100Gb RDMA 约 0.2 s。</text>
</g>
</svg>
