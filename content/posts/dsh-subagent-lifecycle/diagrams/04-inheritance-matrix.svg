<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-d4-title f04-d4-desc">
  <title id="f04-d4-title">spawn 与 fork 的继承矩阵</title>
  <desc id="f04-d4-desc">十二个维度在三列上的取值。绿色表示继承或复制，橙色表示必须显式提供，灰色表示只在创建时有效、冷恢复后消失；最右列说明恢复时的来源。</desc>
  <defs>
    <marker id="f04-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
    <marker id="f04-arwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#bf4520" text-anchor="start" letter-spacing="0.16em">INHERITANCE, NOT PERMISSION</text>
<text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">十二个维度，三种颜色</text>
<text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#5a6580" text-anchor="start">绿色是继承或复制，橙色是不继承、必须显式给，灰色是只在创建时有效、冷恢复后消失</text>
<text x="56" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">维度</text>
<text x="370" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">spawn</text>
<text x="560" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">fork</text>
<text x="750" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" fill="#8a93a6" text-anchor="start">冷恢复之后</text>
<rect x="48" y="150" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">父日志前缀</text>
<circle cx="370" cy="163" r="3" fill="#8a93a6"/>
<text x="380" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">无</text>
<circle cx="560" cy="163" r="3" fill="#2f6f5e"/>
<text x="570" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">完整 turn 前缀</text>
<circle cx="750" cy="163" r="3" fill="#8a93a6"/>
<text x="760" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">只 replay 那次 seed</text>
<text x="60" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">历史 marker</text>
<circle cx="370" cy="194" r="3" fill="#8a93a6"/>
<text x="380" y="197" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">无</text>
<circle cx="560" cy="194" r="3" fill="#2f6f5e"/>
<text x="570" y="197" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">session/end-seed</text>
<circle cx="750" cy="194" r="3" fill="#2f6f5e"/>
<text x="760" y="197" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">随 seed 一起复制</text>
<rect x="48" y="212" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">provider / model</text>
<circle cx="370" cy="225" r="3" fill="#2f6f5e"/>
<text x="380" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">继承父当下</text>
<circle cx="560" cy="225" r="3" fill="#2f6f5e"/>
<text x="570" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">同左</text>
<circle cx="750" cy="225" r="3" fill="#2f6f5e"/>
<text x="760" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">descriptor 里固定</text>
<text x="60" y="261" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">reasoning effort</text>
<circle cx="370" cy="256" r="3" fill="#2f6f5e"/>
<text x="380" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">继承</text>
<circle cx="560" cy="256" r="3" fill="#2f6f5e"/>
<text x="570" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">同左</text>
<circle cx="750" cy="256" r="3" fill="#2f6f5e"/>
<text x="760" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">descriptor 里固定</text>
<rect x="48" y="274" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">maxTokens</text>
<circle cx="370" cy="287" r="3" fill="#bf4520"/>
<text x="380" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">继承，仅本次</text>
<circle cx="560" cy="287" r="3" fill="#bf4520"/>
<text x="570" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">同左</text>
<circle cx="750" cy="287" r="3" fill="#8a93a6"/>
<text x="760" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">不恢复</text>
<text x="60" y="323" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">审批策略</text>
<circle cx="370" cy="318" r="3" fill="#bf4520"/>
<text x="380" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">固定 never</text>
<circle cx="560" cy="318" r="3" fill="#bf4520"/>
<text x="570" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">固定 never</text>
<circle cx="750" cy="318" r="3" fill="#8a93a6"/>
<text x="760" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">不恢复</text>
<rect x="48" y="336" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">sandbox</text>
<circle cx="370" cy="349" r="3" fill="#bf4520"/>
<text x="380" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">只取显式 override</text>
<circle cx="560" cy="349" r="3" fill="#bf4520"/>
<text x="570" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">同左</text>
<circle cx="750" cy="349" r="3" fill="#2f6f5e"/>
<text x="760" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">子日志自证</text>
<text x="60" y="385" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">工具集</text>
<circle cx="370" cy="380" r="3" fill="#bf4520"/>
<text x="380" y="383" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">重新组装 + restrict</text>
<circle cx="560" cy="380" r="3" fill="#bf4520"/>
<text x="570" y="383" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">重新组装 + restrict</text>
<circle cx="750" cy="380" r="3" fill="#2f6f5e"/>
<text x="760" y="383" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">按 preset 重挂</text>
<rect x="48" y="398" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">深度</text>
<circle cx="370" cy="411" r="3" fill="#2f6f5e"/>
<text x="380" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">父 +1，受 maxDepth</text>
<circle cx="560" cy="411" r="3" fill="#2f6f5e"/>
<text x="570" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">同左</text>
<circle cx="750" cy="411" r="3" fill="#2f6f5e"/>
<text x="760" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">header 里的值</text>
<text x="60" y="447" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">容量</text>
<circle cx="370" cy="442" r="3" fill="#bf4520"/>
<text x="380" y="445" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">共享池，默认 8</text>
<circle cx="560" cy="442" r="3" fill="#bf4520"/>
<text x="570" y="445" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#bf4520" text-anchor="start">同左</text>
<circle cx="750" cy="442" r="3" fill="#8a93a6"/>
<text x="760" y="445" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">重新占槽</text>
<rect x="48" y="460" width="864" height="27" rx="3" fill="#ededed"/>
<text x="60" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">outputSchema</text>
<circle cx="370" cy="473" r="3" fill="#8a93a6"/>
<text x="380" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">不持久化</text>
<circle cx="560" cy="473" r="3" fill="#8a93a6"/>
<text x="570" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">不持久化</text>
<circle cx="750" cy="473" r="3" fill="#8a93a6"/>
<text x="760" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#8a93a6" text-anchor="start">不恢复</text>
<text x="60" y="509" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#2d3142" text-anchor="start">工作目录</text>
<circle cx="370" cy="504" r="3" fill="#2f6f5e"/>
<text x="380" y="507" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">默认父 cwd，可传</text>
<circle cx="560" cy="504" r="3" fill="#2f6f5e"/>
<text x="570" y="507" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">同左</text>
<circle cx="750" cy="504" r="3" fill="#2f6f5e"/>
<text x="760" y="507" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="400" fill="#2f6f5e" text-anchor="start">header 里的值</text>
<text x="48" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">三列里的同一个格子回答两个问题：创建时拿到什么，以及冷恢复后还剩什么。</text>
<text x="48" y="580" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">「不恢复」不是遗漏：一次性预算只对那一次委派有效，恢复时重新给。换路由时未指定的 effort 会被删掉。</text>
</svg>
