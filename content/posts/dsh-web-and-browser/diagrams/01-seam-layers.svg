<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-t f01-d">
  <title id="f01-t">web seam 的三层</title>
  <desc id="f01-d">工具层只声明 web_search 与 web_fetch 并挂 when 谓词；ctx.web 负责选提供方、收口来源数量、统一错误；四个提供方各自决定出网方式与解码类型。</desc>

  <defs>
    <marker id="f01-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f01-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">S3-03 / WEB SEAM</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">一个 seam，两项能力，四个提供方</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">工具只描述契约，服务只管选择与收口，出网方式归提供方</text>

  <!-- tool layer -->
  <text x="40" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">① TOOL LAYER</text>
  <rect x="40" y="132" width="248" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="56" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">tool-web</text>
  <text x="56" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">模型可见的唯一一层</text>
  <line x1="56" y1="184" x2="272" y2="184" stroke="#ececec" stroke-width="1"/>
  <rect x="56" y="194" width="216" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="210" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">web_search</text>
  <text x="160" y="210" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">search.ts:414</text>
  <rect x="56" y="224" width="216" height="24" rx="3" fill="#f5f5f5"/>
  <text x="68" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">web_fetch</text>
  <text x="160" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">fetch.ts:516</text>
  <text x="56" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">when: searchReady / fetchReady</text>

  <line x1="288" y1="207" x2="336" y2="207" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <!-- runtime -->
  <text x="344" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">② SERVICE</text>
  <rect x="344" y="132" width="272" height="150" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
  <text x="360" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">WebRuntime · ctx.web</text>
  <text x="360" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">一项能力一个注册口，共用私有实现</text>
  <line x1="360" y1="184" x2="600" y2="184" stroke="#ececec" stroke-width="1"/>
  <text x="360" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">选择：显式 id → 唯一可用 → 歧义报错</text>
  <text x="360" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">收口：capSources 截断来源，置 truncated</text>
  <text x="360" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">错误：WEB_PROVIDER_* 与 WEB_ABORTED</text>
  <text x="360" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">变更：注册与注销都发 providers-changed</text>
  <text x="360" y="270" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">index.ts:113 / 124 / 267 / 300</text>

  <!-- config -->
  <text x="656" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">③ CONFIG</text>
  <rect x="656" y="132" width="264" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="672" y="156" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">部署选择</text>
  <text x="672" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">写进同一字段，没有隐藏优先级</text>
  <line x1="672" y1="184" x2="904" y2="184" stroke="#ececec" stroke-width="1"/>
  <text x="672" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">searchProvider</text>
  <text x="672" y="218" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">fetchProvider</text>
  <text x="672" y="238" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">DSH_WEB_SEARCH_PROVIDER</text>
  <text x="672" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">DSH_WEB_FETCH_PROVIDER</text>
  <text x="672" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">每次操作重读，保存即生效</text>

  <!-- providers -->
  <text x="40" y="330" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">④ PROVIDERS</text>
  <line x1="480" y1="282" x2="480" y2="348" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <rect x="40" y="360" width="208" height="132" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">deepseek-search-api</text>
  <text x="56" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">远端搜索接口</text>
  <text x="56" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">账号级 5 QPS 滑窗</text>
  <text x="56" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">返回标题、URL、摘要</text>
  <text x="56" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">base 默认</text>

  <rect x="264" y="360" width="208" height="132" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="280" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">deepseek-official</text>
  <text x="280" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">Messages 加服务端搜索工具</text>
  <text x="280" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">一次搜索消耗一个模型轮</text>
  <text x="280" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">缺结果块即报错，不抓 prose</text>
  <text x="280" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">web-search-deepseek</text>

  <rect x="488" y="360" width="208" height="132" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="504" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">http</text>
  <text x="504" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">进程内 undici，匿名</text>
  <text x="504" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">不执行 JS，不带登录态</text>
  <text x="504" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">自己跟同源重定向</text>
  <text x="504" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">base 默认</text>

  <rect x="712" y="360" width="208" height="132" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="728" y="384" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">deepseek-fetch-api</text>
  <text x="728" y="402" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">远端抓取接口</text>
  <text x="728" y="418" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">只取 content 字段</text>
  <text x="728" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">状态码固定 200</text>
  <text x="728" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">web-deepseek-api</text>

  <!-- footer -->
  <line x1="40" y1="520" x2="920" y2="520" stroke="#d8d8d8" stroke-width="1"/>
  <text x="40" y="542" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">注册即 effect：提供方跟着插件 fiber 存活，注销时发同一事件，消费方重读 listProviders()</text>
  <text x="40" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">选择永不依赖注册顺序；多个可用且未配 id 时报 WEB_PROVIDER_AMBIGUOUS，并列出候选</text>
</svg>
