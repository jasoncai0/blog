<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f05-title f05-desc">
  <title id="f05-title">医疗记忆的写入、召回与遗忘</title>
  <desc id="f05-desc">输入经抽取、主体识别、冲突检测后写入病例级记忆；召回时按病程取用；遗忘由病程结束、授权撤销和用户否认触发。</desc>

  <defs>
    <marker id="f05-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f05-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">05 / MEMORY LIFECYCLE</text>
  <text x="40" y="64" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">记忆的难点在中间三步，不在存储</text>
  <text x="40" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">存下来只是开始：谁的、和谁冲突、什么时候该忘，才是会出事的地方</text>

  <!-- flow -->
  <rect x="50" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="115" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">输入</text>
  <text x="115" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">对话 · 报告 · IoT</text>

  <rect x="196" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="261" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">抽取</text>
  <text x="261" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">结构化 + 摘要双路</text>

  <rect x="342" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#bf4520"/>
  <text x="407" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">主体</text>
  <text x="407" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">谁在说？说谁？</text>

  <rect x="488" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#bf4520"/>
  <text x="553" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">冲突</text>
  <text x="553" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">两套事实，信谁</text>

  <rect x="634" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="699" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">写入</text>
  <text x="699" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">病例级，带来源</text>

  <rect x="780" y="150" width="130" height="64" rx="7" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="845" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">召回</text>
  <text x="845" y="194" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">按病程，不按相似度</text>

  <line x1="180" y1="182" x2="192" y2="182" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f05-a)"/>
  <line x1="326" y1="182" x2="338" y2="182" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f05-a)"/>
  <line x1="472" y1="182" x2="484" y2="182" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f05-a)"/>
  <line x1="618" y1="182" x2="630" y2="182" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f05-a)"/>
  <line x1="764" y1="182" x2="776" y2="182" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f05-a)"/>

  <!-- annotations -->
  <text x="115" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">授权是前提</text>
  <text x="115" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">没授权的不进来</text>

  <text x="261" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">全结构化 scale 不了</text>
  <text x="261" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">所以要留一路摘要</text>

  <text x="407" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">「我女儿」可能有两个</text>
  <text x="407" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">确认不了就不结合</text>

  <text x="553" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">自述血压高</text>
  <text x="553" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">量出来 118/76</text>

  <text x="699" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">生命周期 + 病程推理</text>
  <text x="699" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不是一坨向量</text>

  <text x="845" y="240" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">婴幼儿与儿童</text>
  <text x="845" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">方案完全不同</text>

  <!-- offline annotation -->
  <text x="40" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">两条路分开存：会话级 summary 记「这次聊到哪」，病例级记忆记「这个人什么情况」；混了就会把猜测当事实。</text>

  <!-- forget box -->
  <rect x="50" y="352" width="860" height="128" rx="8" fill="#ffffff" stroke="#bf4520" stroke-dasharray="5 5"/>
  <text x="70" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#bf4520">遗忘：比记住更难的三个开关</text>

  <text x="70" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">① 病程结束：感冒好了，「正在感冒」就不该再出现在下一次问诊里。</text>
  <text x="70" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">② 授权撤销：在某家医院的就诊数据，授权一撤，召回路径必须立刻断。</text>
  <text x="70" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">③ 用户否认：「我没得过」比任何抽取结果都优先，要能改、能删、能追溯改过什么。</text>

  <text x="640" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">衰减按病程</text>
  <text x="640" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">不按时间</text>
  <text x="640" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">七老八十轮的话题漂移</text>
  <text x="640" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">靠「当前病程」拉回来</text>

  <line x1="699" y1="214" x2="699" y2="348" stroke="#bf4520" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#f05-r)"/>
  <line x1="845" y1="278" x2="845" y2="348" stroke="#bf4520" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#f05-r)"/>

  <text x="40" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">医疗记忆的价值不在「记得多」，在「记得对、记得住边界」：买过某个病种的药，不等于授权拿它做个性化推荐。</text>
  <text x="40" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">同一套记忆，解释性和隐私还会打架：推荐理由说得太直白会冒犯，不说又不可解释。</text>
</svg>
