<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648" role="img" aria-labelledby="04-modes-t 04-modes-d"><title id="04-modes-t">按环境与目的分的四种跑法</title><desc id="04-modes-d">静态且要判分的是冻结回归集；动态且要判分的是规格快照回归；静态而不判分的是黄金样本画廊；动态而不判分的是真实工单日跑。</desc><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="648" fill="#f5f5f5"/><text x="40.0" y="36.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">RUN MODES · 04</text><text x="40.0" y="66.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">四种跑法：守能力的判分，找维度的只归档</text><text x="40.0" y="90.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">横轴是环境稳不稳，纵轴是这轮跑完要不要判通过</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><rect x="140" y="160" width="340" height="150" rx="7" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><rect x="140" y="160" width="4" height="150" fill="#2f6f5e"/><text x="162.0" y="194.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">冻结回归集</text><text x="162.0" y="222.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">每次合并前跑</text><text x="162.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">判 pass / fail</text><text x="162.0" y="264.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">题不变，环境也不变</text><rect x="540" y="160" width="340" height="150" rx="7" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><rect x="540" y="160" width="4" height="150" fill="#2f6f5e"/><text x="562.0" y="194.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">规格快照回归</text><text x="562.0" y="222.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">平台或品牌包变更后重放</text><text x="562.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">判 pass / fail</text><text x="562.0" y="264.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">快照按版本号，不按日期</text><rect x="140" y="350" width="340" height="150" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><rect x="140" y="350" width="4" height="150" fill="#a8752a"/><text x="162.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">黄金样本画廊</text><text x="162.0" y="412.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">每周 10 条，人看</text><text x="162.0" y="433.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">不判分，只记判断</text><text x="162.0" y="454.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">产出新维度</text><rect x="540" y="350" width="340" height="150" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><rect x="540" y="350" width="4" height="150" fill="#a8752a"/><text x="562.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">真实工单日跑</text><text x="562.0" y="412.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">每天 20 条脱敏工单</text><text x="562.0" y="433.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">不判分，只归档异常</text><text x="562.0" y="454.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">产出失败模式</text><line x1="520" y1="152" x2="520" y2="524" stroke="#8a93a6" stroke-width="1"/><line x1="130" y1="330" x2="910" y2="330" stroke="#8a93a6" stroke-width="1"/><line x1="520" y1="160" x2="520" y2="150" stroke="#8a93a6" stroke-width="1" marker-end="url(#a2)"/><line x1="520" y1="516" x2="520" y2="526" stroke="#8a93a6" stroke-width="1" marker-end="url(#a2)"/><text x="520.0" y="140.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2f6f5e" text-anchor="middle">守能力</text><text x="520.0" y="552.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#a8752a" text-anchor="middle">找维度</text><text x="120.0" y="322.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#8a93a6" text-anchor="end">静态</text><text x="922.0" y="322.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#8a93a6" text-anchor="end">动态</text><rect x="140" y="576" width="740" height="46" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="158.0" y="598.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#2d3142" text-anchor="start">动态线一旦进判分流程，就会被当成回归题调参，它就不再能发现新问题。</text><text x="158.0" y="614.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#8a93a6" text-anchor="start">所以两件事要分桌：判分的归门禁，发现的归周会。</text></svg>