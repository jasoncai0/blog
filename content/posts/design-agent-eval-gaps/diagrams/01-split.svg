<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="01-split-t 01-split-d"><title id="01-split-t">模型评测与 Agent 评测的分工差异</title><desc id="01-split-d">模型评测只定义问题与判分，解法由训练范式内化；Agent 评测要同时定义问题与解法，改动周期更短，评测不能与 harness 分工。</desc><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40.0" y="36.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">EVAL SPLIT · 01</text><text x="40.0" y="66.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">模型评测定义问题，Agent 评测还要定义解法</text><text x="40.0" y="90.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">同一个格子里，左边是训练范式替你兜住的部分，右边必须自己写</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><text x="56.0" y="138.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="600" fill="#8a93a6" text-anchor="start" letter-spacing="0.8">对照项</text><text x="242.0" y="138.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="600" fill="#3d5a80" text-anchor="start" letter-spacing="0.8">模型评测</text><text x="592.0" y="138.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">Agent 评测</text><text x="56.0" y="162.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#4f5d75" text-anchor="start">被测对象</text><rect x="226" y="118" width="330" height="80" rx="6" fill="#e9eff6" stroke="none"/><rect x="226" y="118" width="4" height="80" fill="#3d5a80"/><text x="248.0" y="165.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">权重与推理行为</text><rect x="576" y="118" width="344" height="80" rx="6" fill="#efeaf6" stroke="none"/><rect x="576" y="118" width="4" height="80" fill="#5b4b8a"/><text x="598.0" y="165.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">loop + prompt + Skill + 工具</text><text x="56.0" y="258.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#4f5d75" text-anchor="start">要定义的东西</text><rect x="226" y="214" width="330" height="80" rx="6" fill="#e9eff6" stroke="none"/><rect x="226" y="214" width="4" height="80" fill="#3d5a80"/><text x="248.0" y="261.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">问题 + 判分</text><rect x="576" y="214" width="344" height="80" rx="6" fill="#efeaf6" stroke="none"/><rect x="576" y="214" width="4" height="80" fill="#5b4b8a"/><text x="598.0" y="261.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">问题 + 判分 + 解法</text><text x="56.0" y="354.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#4f5d75" text-anchor="start">改动周期</text><rect x="226" y="310" width="330" height="80" rx="6" fill="#e9eff6" stroke="none"/><rect x="226" y="310" width="4" height="80" fill="#3d5a80"/><text x="248.0" y="357.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">周到月，跑一次训练</text><rect x="576" y="310" width="344" height="80" rx="6" fill="#efeaf6" stroke="none"/><rect x="576" y="310" width="4" height="80" fill="#5b4b8a"/><text x="598.0" y="357.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">小时到天，改一版就发</text><text x="56.0" y="450.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#4f5d75" text-anchor="start">谁能负责</text><rect x="226" y="406" width="330" height="80" rx="6" fill="#e9eff6" stroke="none"/><rect x="226" y="406" width="4" height="80" fill="#3d5a80"/><text x="248.0" y="453.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">评测可以独立于训练</text><rect x="576" y="406" width="344" height="80" rx="6" fill="#efeaf6" stroke="none"/><rect x="576" y="406" width="4" height="80" fill="#5b4b8a"/><text x="598.0" y="453.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#2d3142" text-anchor="start">评测必须和 harness 同一个人</text><rect x="40" y="512" width="880" height="60" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/><rect x="40" y="512" width="4" height="60" fill="#bf4520"/><text x="60.0" y="536.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#bf4520" text-anchor="start">所以只判产物是不够的</text><text x="60.0" y="556.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">prompt、Skill、检索、预算都在产物上留了痕迹，但产物不告诉你它动了哪一处。</text></svg>