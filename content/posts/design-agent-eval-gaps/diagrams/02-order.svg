<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="02-order-t 02-order-d"><title id="02-order-t">评测设计的顺序：先定尺子再出题</title><desc id="02-order-d">推荐顺序是产品定义、维度与反指标、题目、判分器、门禁；先出题会返工，因为维度没定义过，题目也互不覆盖。</desc><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="560" fill="#f5f5f5"/><text x="40.0" y="36.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">ORDER · 02</text><text x="40.0" y="66.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">先定尺子，再出题</text><text x="40.0" y="90.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">两行的差别只在第一个箭头：从产品定义出发，还是从题出发</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><text x="40.0" y="136.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="1.2">推荐顺序</text><rect x="40" y="152" width="160" height="110" rx="7" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/><text x="54.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#3d5a80" text-anchor="start" letter-spacing="0.8">要做什么样的设计</text><text x="54.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">产品定义</text><text x="54.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">3 条产品特性</text><text x="54.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">写进 PRD</text><rect x="220" y="152" width="160" height="110" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><text x="234.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="0.8">6 条，成对写</text><text x="234.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">维度 + 反指标</text><text x="234.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">每条配一个反指标</text><text x="234.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">一个 owner</text><rect x="400" y="152" width="160" height="110" rx="7" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><text x="414.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#2f6f5e" text-anchor="start" letter-spacing="0.8">30 道起</text><text x="414.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">题目</text><text x="414.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">两类题集</text><text x="414.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">难度分池</text><rect x="580" y="152" width="160" height="110" rx="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="594.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">三分自动一半人工</text><text x="594.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">判分器</text><text x="594.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">规则 / 裁判 / 人评</text><text x="594.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">先校准再上量</text><rect x="760" y="152" width="160" height="110" rx="7" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/><text x="774.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#bf4520" text-anchor="start" letter-spacing="0.8">红灯阻断合并</text><text x="774.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">门禁</text><text x="774.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">三档判定</text><text x="774.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">失败回题目</text><line x1="200.0" y1="207.0" x2="218.0" y2="207.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="380.0" y1="207.0" x2="398.0" y2="207.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="560.0" y1="207.0" x2="578.0" y2="207.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="740.0" y1="207.0" x2="758.0" y2="207.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><text x="40.0" y="318.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="600" fill="#8a93a6" text-anchor="start" letter-spacing="1.2">先出题的顺序</text><rect x="40" y="334" width="190" height="104" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="54.0" y="356.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#2d3142" text-anchor="start" letter-spacing="0.8">凭经验挑场景</text><text x="54.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">先写 30 道题</text><text x="54.0" y="406.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">题面互不覆盖</text><rect x="250" y="334" width="190" height="104" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="264.0" y="356.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#2d3142" text-anchor="start" letter-spacing="0.8">维度没定义过</text><text x="264.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">跑一遍才发现</text><text x="264.0" y="406.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">分数不成体系</text><rect x="460" y="334" width="190" height="104" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="474.0" y="356.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="0.8">30 道题重写一半</text><text x="474.0" y="384.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">回头补维度</text><text x="474.0" y="406.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">返工 2 周</text><line x1="230.0" y1="386.0" x2="248.0" y2="386.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="440.0" y1="386.0" x2="458.0" y2="386.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><path d="M 555 334 L 555 300 L 300 300 L 300 264" fill="none" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a2)"/><text x="566.0" y="296.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#8a93a6" text-anchor="start">返工</text><rect x="40" y="470" width="880" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="60.0" y="494.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2d3142" text-anchor="start">先有维度，题目可以每周加；先有题目，维度一改题目全废。</text><text x="60.0" y="513.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#8a93a6" text-anchor="start">维度来源三处：产品定义、用户反馈里的共性、从别的学科借来的判据。</text></svg>