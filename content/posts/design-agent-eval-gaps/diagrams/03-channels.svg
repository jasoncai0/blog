<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="03-channels-t 03-channels-d"><title id="03-channels-t">机器通道与人通道的分工</title><desc id="03-channels-d">机器通道从 trace 到归因再到两条出口，负责收敛问题；人通道从结果画廊到口述判断再到判断台账，负责发现问题并把判断变成维度。</desc><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a93a6"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40.0" y="36.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#5b4b8a" text-anchor="start" letter-spacing="1.4">TWO CHANNELS · 03</text><text x="40.0" y="66.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="start">两条通道：机器回答哪坏了，人回答什么算好</text><text x="40.0" y="90.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#4f5d75" text-anchor="start">trace 是收敛问题，画廊是发现问题，两者不能互相替代</text><line x1="40" y1="106" x2="920" y2="106" stroke="#d8d8d8" stroke-width="1"/><text x="40.0" y="138.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="1.2">机器通道</text><rect x="40" y="152" width="180" height="132" rx="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="54.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">全量记录</text><text x="54.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">trace / op 流</text><text x="54.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">召回、Skill、画布 op</text><text x="54.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">标准是能重放</text><rect x="240" y="152" width="180" height="132" rx="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="254.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">先查硬约束</text><text x="254.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">归因十筐</text><text x="254.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">再看模型与审美</text><text x="254.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">每条落 owner</text><rect x="440" y="152" width="180" height="132" rx="7" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/><text x="454.0" y="174.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#5b4b8a" text-anchor="start" letter-spacing="0.8">改 Agent 或改尺子</text><text x="454.0" y="202.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">两条出口</text><text x="454.0" y="224.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">只走第一条会</text><text x="454.0" y="243.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">把 Agent 训成迎合</text><line x1="220.0" y1="218.0" x2="238.0" y2="218.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="420.0" y1="218.0" x2="438.0" y2="218.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><text x="40.0" y="330.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="1.2">人通道</text><rect x="40" y="344" width="180" height="132" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><text x="54.0" y="366.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="0.8">一屏一任务</text><text x="54.0" y="394.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">结果画廊</text><text x="54.0" y="416.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">三版候选并排</text><text x="54.0" y="435.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">默认按时间排</text><rect x="240" y="344" width="180" height="132" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><text x="254.0" y="366.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="0.8">哪张好、为什么</text><text x="254.0" y="394.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">口述判断</text><text x="254.0" y="416.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">不给分</text><text x="254.0" y="435.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">记录原话</text><rect x="440" y="344" width="180" height="132" rx="7" fill="#f2ece2" stroke="#a8752a" stroke-width="1.2"/><text x="454.0" y="366.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="600" fill="#a8752a" text-anchor="start" letter-spacing="0.8">原话 + 反例</text><text x="454.0" y="394.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">判断台账</text><text x="454.0" y="416.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">验证方式</text><text x="454.0" y="435.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#4f5d75" text-anchor="start">到期复核日</text><line x1="220.0" y1="410.0" x2="238.0" y2="410.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><line x1="420.0" y1="410.0" x2="438.0" y2="410.0" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a1)"/><rect x="680" y="152" width="240" height="324" rx="7" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/><rect x="680" y="152" width="4" height="324" fill="#2f6f5e"/><text x="702.0" y="180.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="start">题集 + Rubric</text><text x="702.0" y="204.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="500" fill="#2f6f5e" text-anchor="start">唯一有复利的两样东西</text><text x="702.0" y="238.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">冻结题 150 条，分三池</text><text x="702.0" y="260.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">18 条检查项，分四层</text><text x="702.0" y="282.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">每条正向指标配反指标</text><text x="702.0" y="304.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">20% holdout 不进调优</text><text x="702.0" y="336.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start">每月 1 号对一次版本号</text><text x="702.0" y="356.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="400" fill="#8a93a6" text-anchor="start">版本与日期一起冻结</text><text x="702.0" y="374.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" font-weight="400" fill="#8a93a6" text-anchor="start">rubric_version = 2026-11</text><line x1="620.0" y1="410.0" x2="678.0" y2="410.0" stroke="#a8752a" stroke-width="1.3" marker-end="url(#a1)"/><text x="624.0" y="402.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#a8752a" text-anchor="start">新维度</text><path d="M 800 152 L 800 124 L 130 124 L 130 150" fill="none" stroke="#2f6f5e" stroke-width="1.3" marker-end="url(#a1)"/><text x="340.0" y="118.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#2f6f5e" text-anchor="start">取题与尺子</text><rect x="40" y="524" width="880" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="60.0" y="548.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2d3142" text-anchor="start">画廊按总分排序，等于让现有尺子替你决定看什么。</text><text x="60.0" y="566.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" fill="#8a93a6" text-anchor="start">看的时候不排序，判断才会往回走，进到维度里。</text></svg>