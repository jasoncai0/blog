<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">追一个字段的五步</title>
<desc id="f03-desc">从事件名开始，到测试断言结束；缺一步就只能算推断。</desc>
<rect width="960" height="460" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">READING / TRACE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">事件名 → 写入点 → 投影 → 消费 → 测试</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">以 sourceEventSeqs 为例。</text>
<rect x="40" y="170" width="150" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="54" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">1 事件名</text><text x="54" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">grep SessionEventMap</text><text x="54" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">types.ts:287</text><line x1="190" y1="614" x2="220" y2="614" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="220" y="170" width="150" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="234" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">2 写入点</text><text x="234" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">grep append(</text><text x="234" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">pipeline.ts</text><line x1="370" y1="614" x2="400" y2="614" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="400" y="170" width="150" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="414" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">3 投影</text><text x="414" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">deriveEventMessage</text><text x="414" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">surface.ts:120</text><line x1="550" y1="614" x2="580" y2="614" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="580" y="170" width="150" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="594" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">4 消费方</text><text x="594" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">grep 字段名</text><text x="594" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">compaction / UI / 审计</text><line x1="730" y1="614" x2="760" y2="614" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="760" y="170" width="150" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="774" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">5 测试</text><text x="774" y="220" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#4f5d75">grep tests</text><text x="774" y="240" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">*.spec.ts</text><text x="40" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">第 1 步确认字段属于哪个事件；第 2 步找到唯一的写入函数；第 3 步看它如何进入模型历史。</text><text x="40" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">第 4 步列出所有读它的模块；第 5 步看作者断言了什么，以及没有断言什么。</text><text x="40" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">常见错误：只做 1–2 步就下结论，把「字段被写入」当成「字段被正确消费」。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="442" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / TRACE</text>
</svg>
