serif" font-size="9.5" font-weight="600" fill="#2d3142">docs/subsystems</text><text x="672" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">69 篇：类型、状态机、失败语义</text><rect x="660" y="360" width="260" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="672" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">docs/tool-catalog</text><text x="672" y="395" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">31 个工具包：schema 与行为</text><rect x="660" y="470" width="260" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="672" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">docs/module-graph</text><text x="672" y="505" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">370 包的依赖方向</text><text x="40" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">包名只说明归属：fs-local 是 provider，tool-fs 是 consumer，两者都在 fs 组。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / STRUCTURE</text>
