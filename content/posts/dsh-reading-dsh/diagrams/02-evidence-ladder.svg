<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">四层证据，从上往下越来越弱</title>
<desc id="f02-desc">写作与评审时先标等级：同一句话，A 级与 D 级的可信度差一个量级。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">READING / EVIDENCE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">证据阶梯</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">等级不是文风，是可复核性。</text>
<rect x="60" y="96" width="300" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="124" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#bf4520">A</text><text x="108" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">运行行为 / 逐行实现</text><text x="108" y="142" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">跑过测试，或读完整个函数并对照调用点</text><line x1="370" y1="132" x2="370" y2="196" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><rect x="60" y="196" width="260" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#bf4520">B</text><text x="108" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">类型与接口</text><text x="108" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">只读 .ts 类型、事件联合、schema；未跟实现</text><line x1="330" y1="232" x2="330" y2="296" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><rect x="60" y="296" width="220" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#bf4520">C</text><text x="108" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">文档与 README</text><text x="108" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">architecture / subsystems / tool-catalog 的描述</text><line x1="290" y1="332" x2="290" y2="396" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f02-g)"/><rect x="60" y="396" width="180" height="72" rx="6" fill="#faf7f5" stroke="#d8d8d8"/><text x="76" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#bf4520">D</text><text x="108" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.2" font-weight="600" fill="#2d3142">结构推断</text><text x="108" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">从命名、目录、依赖方向推断；未验证</text><text x="640" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">越往上：越难读，越接近事实。</text><text x="640" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">越往下：越好读，越容易过时。</text><text x="60" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">同一条结论混用两级证据，是这类代码库最常见的错误来源。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / EVIDENCE</text>
</svg>
