<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f08-02-title f08-02-desc" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
<title id="f08-02-title">preset 的解析与挂载路径</title>
<desc id="f08-02-desc">三条入口汇入 composeAgent，依次经过 resolve、mount 和 Agent 发布；两侧标注各步的失败条件与恢复、复用路径的差异。</desc>
<defs>
<marker id="f08-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
<marker id="f08-02-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<circle cx="40" cy="40" r="4" fill="#bf4520"/>
<text x="52" y="46" font-size="21" fill="#2d3142" text-anchor="start" font-weight="600">一次创建或恢复：preset 怎么被解析并挂上</text>
<text x="52" y="72" font-size="13" fill="#5a6580" text-anchor="start" font-weight="400">解析只读定义，挂载才建立 scope 绑定；三步都可能失败</text>
<rect x="60" y="92" width="250" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="185" y="116" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="600">createSession</text>
<text x="185" y="134" font-size="11.5" fill="#5a6580" text-anchor="middle" font-weight="400">新建，请求可带 preset</text>
<line x1="185" y1="144" x2="480" y2="172" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="355" y="92" width="250" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="480" y="116" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="600">reuseLive</text>
<text x="480" y="134" font-size="11.5" fill="#5a6580" text-anchor="middle" font-weight="400">复用空白会话</text>
<line x1="480" y1="144" x2="480" y2="172" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="650" y="92" width="250" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="775" y="116" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="600">resumeObserved</text>
<text x="775" y="134" font-size="11.5" fill="#5a6580" text-anchor="middle" font-weight="400">从投影恢复</text>
<line x1="775" y1="144" x2="480" y2="172" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="280" y="196" width="400" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="300" y="221" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">composeAgent(presetId)</text>
<text x="300" y="242" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">缺省用 registry.defaultId</text>
<line x1="480" y1="256" x2="480" y2="276" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="280" y="286" width="400" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="300" y="311" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">presets.resolve(id)</text>
<text x="300" y="332" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">匹配当前定义；失败抛 not-found / invalid</text>
<line x1="480" y1="346" x2="480" y2="366" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="280" y="376" width="400" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="300" y="401" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">presets.mount(agentCtx, id)</text>
<text x="300" y="422" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">retain → bind(scope parent)</text>
<line x1="480" y1="436" x2="480" y2="456" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-02-arrow)"/>
<rect x="280" y="466" width="400" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="300" y="491" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">Agent 发布</text>
<text x="300" y="512" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">header.agentPreset 落盘，setup 先完成</text>
<rect x="40" y="286" width="210" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="56" y="312" font-size="12" fill="#bf4520" text-anchor="start" font-weight="600">resolve 之前</text>
<text x="56" y="336" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">请求里的 agentPreset 可以是空；</text>
<text x="56" y="354" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">缺省值来自 selectedDefault，</text>
<text x="56" y="372" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">再回退到 default。</text>
<text x="56" y="402" font-size="11.5" fill="#2d3142" text-anchor="start" font-weight="400">此时还没有 scope，也没有工具。</text>
<rect x="710" y="196" width="210" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="726" y="222" font-size="12" fill="#bf4520" text-anchor="start" font-weight="600">挂载失败</text>
<text x="726" y="246" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">not-found：id 不在 roster</text>
<text x="726" y="268" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">invalid：审计或泄漏检查不过</text>
<text x="726" y="290" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">locked：会话已开始，只能新建</text>
<text x="726" y="326" font-size="11.5" fill="#2d3142" text-anchor="start" font-weight="400">失败不会留下半成品 Agent。</text>
<text x="726" y="348" font-size="11.5" fill="#2d3142" text-anchor="start" font-weight="400">broken 原因可在 list() 读到。</text>
<rect x="40" y="466" width="210" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="56" y="492" font-size="12" fill="#bf4520" text-anchor="start" font-weight="600">恢复路径</text>
<text x="56" y="516" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">preset 来自投影，不读 header；</text>
<text x="56" y="534" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">header 只在投影缺失时回退。</text>
<rect x="710" y="466" width="210" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="726" y="492" font-size="12" fill="#bf4520" text-anchor="start" font-weight="600">复用路径</text>
<text x="726" y="516" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">select() 串行且只改空白会话，</text>
<text x="726" y="534" font-size="11.5" fill="#5a6580" text-anchor="start" font-weight="400">成功后补 agent-preset/selected。</text>
</svg>
