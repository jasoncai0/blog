<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f08-01-title f08-01-desc" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
<title id="f08-01-title">profile 与 preset 的两层组合</title>
<desc id="f08-01-desc">上半部分是进程级的 profile 层与按会话挂载的 preset 行；下半部分是同一个 preset 的两个修订，各自记录引用它的会话数。</desc>
<defs>
<marker id="f08-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
<marker id="f08-01-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<circle cx="40" cy="40" r="4" fill="#bf4520"/>
<text x="52" y="46" font-size="21" fill="#2d3142" text-anchor="start" font-weight="600">profile 与 preset：两层组合</text>
<text x="52" y="72" font-size="13" fill="#5a6580" text-anchor="start" font-weight="400">profile 决定进程里有什么，preset 决定一个会话能看见什么</text>
<rect x="36" y="98" width="420" height="226" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="58" y="128" font-size="15" fill="#2d3142" text-anchor="start" font-weight="600">harness profile</text>
<text x="58" y="148" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">一个进程一份</text>
<circle cx="62" cy="180" r="2.5" fill="#bf4520"/>
<text x="76" y="184" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">bundles：base → web-app</text>
<circle cx="62" cy="210" r="2.5" fill="#bf4520"/>
<text x="76" y="214" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">cordis.patch.yml：profile 自己的补丁</text>
<circle cx="62" cy="240" r="2.5" fill="#bf4520"/>
<text x="76" y="244" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">home patch 与 --patch overlay</text>
<circle cx="62" cy="270" r="2.5" fill="#bf4520"/>
<text x="76" y="274" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">启动时组装整棵 Cordis 插件树</text>
<text x="58" y="306" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">所有会话共用</text>
<rect x="504" y="98" width="420" height="226" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="526" y="128" font-size="15" fill="#2d3142" text-anchor="start" font-weight="600">agent preset</text>
<text x="526" y="148" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">每个会话一份，可多份共存</text>
<circle cx="530" cy="180" r="2.5" fill="#bf4520"/>
<text x="544" y="184" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">YAML 行：preset-standard</text>
<circle cx="530" cy="210" r="2.5" fill="#bf4520"/>
<text x="544" y="214" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">config.plugins：persona、tools、groups</text>
<circle cx="530" cy="240" r="2.5" fill="#bf4520"/>
<text x="544" y="244" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">isolate：planMode / compaction / workflowEngine</text>
<circle cx="530" cy="270" r="2.5" fill="#bf4520"/>
<text x="544" y="274" font-size="12.5" fill="#2d3142" text-anchor="start" font-weight="400">挂载产物：scope 加一个 Generation</text>
<text x="526" y="306" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">按会话 scope 过滤注册</text>
<line x1="460" y1="206" x2="498" y2="206" stroke="#bf4520" stroke-width="1.8" marker-end="url(#f08-01-arrow-acc)"/>
<text x="479" y="192" font-size="11" fill="#bf4520" text-anchor="middle" font-weight="400">挂载</text>
<rect x="36" y="352" width="420" height="132" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="58" y="380" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">Generation #1（修订 1）</text>
<text x="58" y="402" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">users = 2，两个会话共用同一棵树</text>
<rect x="58" y="416" width="176" height="46" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="146" y="438" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="400">会话 A</text>
<text x="146" y="456" font-size="11" fill="#5a6580" text-anchor="middle" font-weight="400">standard</text>
<rect x="250" y="416" width="176" height="46" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="338" y="438" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="400">会话 B</text>
<text x="338" y="456" font-size="11" fill="#5a6580" text-anchor="middle" font-weight="400">standard</text>
<rect x="504" y="352" width="420" height="132" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="526" y="380" font-size="13.5" fill="#2d3142" text-anchor="start" font-weight="600">Generation #2（定义改动后）</text>
<text x="526" y="402" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">users = 1，旧树 retired 但未释放</text>
<rect x="526" y="416" width="176" height="46" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="614" y="438" font-size="13" fill="#2d3142" text-anchor="middle" font-weight="400">会话 C</text>
<text x="614" y="456" font-size="11" fill="#5a6580" text-anchor="middle" font-weight="400">standard v2</text>
<text x="722" y="438" font-size="12" fill="#5a6580" text-anchor="start" font-weight="400">新会话解析到新定义</text>
<line x1="714" y1="326" x2="714" y2="348" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-01-arrow)"/>
<line x1="246" y1="326" x2="246" y2="348" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f08-01-arrow)"/>
<rect x="36" y="508" width="888" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="58" y="534" font-size="13" fill="#2d3142" text-anchor="start" font-weight="400">PresetTree.commit 是空实现：运行时树不落盘，定义只存在 patch 里。</text>
<text x="58" y="558" font-size="13" fill="#5a6580" text-anchor="start" font-weight="400">重新注册后旧 generation 标 retired，users 清零才 dispose。</text>
</svg>
