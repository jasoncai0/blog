<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-d4-title f04-d4-desc">
  <title id="f04-d4-title">取消场景的两条结算路径</title>
  <desc id="f04-d4-desc">模型一次给出两个 bash 调用。第一个已派发，取消后收到 ABORTED；第二个从未派发，skip 先补记一条 tool/call 再写 ABORTED_BEFORE_DISPATCH。工作区里只有 started.txt。</desc>
  <defs>
    <marker id="f04-d4-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#5a6580"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">CANCEL RACE</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">一次取消，两种结算：drain 与 skip</text>
  <text x="48" y="90" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">模型一次给出两个调用。取消发生在第一个正在跑、第二个还没派发的那一刻。</text>

  <!-- legend -->
  <line x1="48" y1="132" x2="78" y2="132" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f04-d4-a)"/>
  <text x="86" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">已发生</text>
  <line x1="140" y1="132" x2="176" y2="132" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="184" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">没有动作，只等取消</text>

  <!-- lane A -->
  <text x="48" y="218" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">call_wait</text>
  <text x="48" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">已派发</text>

  <rect x="170" y="192" width="150" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="182" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">tool/call</text>
  <text x="182" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">先落事件，再派发</text>

  <rect x="340" y="192" width="150" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="352" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">job/registered</text>
  <text x="352" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">bash 正在跑</text>

  <rect x="534" y="192" width="150" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="546" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">job/settled</text>
  <text x="546" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">killed，不是 cancelled</text>

  <rect x="704" y="192" width="176" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="716" y="214" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#bf4520">tool/result ABORTED</text>
  <text x="716" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">已派发的调用会 drain</text>

  <line x1="320" y1="220" x2="336" y2="220" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f04-d4-a)"/>
  <line x1="490" y1="220" x2="530" y2="220" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f04-d4-a)"/>
  <line x1="684" y1="220" x2="700" y2="220" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f04-d4-a)"/>

  <!-- lane B -->
  <text x="48" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#2d3142">call_skipped</text>
  <text x="48" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">未派发</text>

  <rect x="170" y="332" width="150" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="182" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">在 planned 里</text>
  <text x="182" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">还没有 slot</text>

  <rect x="534" y="332" width="170" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="546" y="354" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142">skip() 补写 tool/call</text>
  <text x="546" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">seq 与真实调用同构</text>

  <rect x="724" y="332" width="156" height="56" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="736" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">tool/result</text>
  <text x="736" y="366" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">ABORTED_BEFORE_DISPATCH</text>
  <text x="736" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">重放不会悬空</text>

  <!-- abort line -->
  <line x1="512" y1="140" x2="512" y2="440" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="512" y="156" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" text-anchor="middle">abort(user)</text>

  <line x1="320" y1="360" x2="530" y2="360" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#f04-d4-a)"/>
  <line x1="704" y1="360" x2="720" y2="360" stroke="#5a6580" stroke-width="1.2" marker-end="url(#f04-d4-a)"/>

  <!-- workspace result -->
  <rect x="48" y="466" width="392" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="64" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">WORKSPACE.EXPECTED/</text>
  <text x="64" y="516" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#2d3142">started.txt</text>
  <text x="64" y="534" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">只有这一个文件：取消之前写下的字节</text>

  <rect x="472" y="466" width="440" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="488" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">断言什么</text>
  <text x="488" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">事件流里两条 tool/result 的顺序与 error.code，加上磁盘上没有 skipped.txt。</text>
  <text x="488" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">等待 started.txt 出现才发取消，用文件当时钟，别用 sleep。</text>

  <text x="48" y="576" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">两条 tool/result 都在 turn/end 之前落下，模型的下一轮永远看得到完整的一步。</text>
</svg>
