<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f07-02-title f07-02-desc">
<title id="f07-02-title">一次 prompt 的生命周期</title>
<desc id="f07-02-desc">客户端发 session/prompt 立刻拿到 messageId，服务端把输入排给 agent，事件持续回流，session/wait 等到整只 agent 空闲才返回。</desc>
<defs>
<marker id="f07-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
<marker id="f07-02-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="48" y="42" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#bf4520">FIG 02 / PROMPT LIFECYCLE</text>
<text x="48" y="80" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="26" font-weight="600" fill="#2d3142">一次 prompt 的生命周期</text>
<text x="48" y="106" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="13" fill="#5a6580">prompt 只负责入队，idle 才是这一轮的结束信号</text>

<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui">
<line x1="140" y1="196" x2="140" y2="524" stroke="#c9ccd6" stroke-dasharray="4 5"/>
<line x1="480" y1="196" x2="480" y2="524" stroke="#c9ccd6" stroke-dasharray="4 5"/>
<line x1="820" y1="196" x2="820" y2="524" stroke="#c9ccd6" stroke-dasharray="4 5"/>

<rect x="55" y="140" width="170" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="140" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">客户端</text>
<text x="140" y="181" text-anchor="middle" font-size="10" fill="#5a6580">HarnessClient</text>
<rect x="395" y="140" width="170" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="480" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">SDK server</text>
<text x="480" y="181" text-anchor="middle" font-size="10" fill="#5a6580">jsonrpc over stdio</text>
<rect x="735" y="140" width="170" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="820" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">agent runtime</text>
<text x="820" y="181" text-anchor="middle" font-size="10" fill="#5a6580">排队 · 执行 · 提交</text>

<line x1="148" y1="222" x2="470" y2="222" stroke="#4f5d75" marker-end="url(#f07-02-arrow)"/>
<text x="309" y="214" text-anchor="middle" font-size="10.5" fill="#2d3142">session/prompt</text>

<line x1="472" y1="252" x2="150" y2="252" stroke="#bf4520" stroke-dasharray="5 4" marker-end="url(#f07-02-arrow-accent)"/>
<text x="311" y="244" text-anchor="middle" font-size="10.5" fill="#bf4520">messageId（立即返回）</text>

<line x1="488" y1="286" x2="810" y2="286" stroke="#4f5d75" marker-end="url(#f07-02-arrow)"/>
<text x="649" y="278" text-anchor="middle" font-size="10.5" fill="#2d3142">入队</text>

<line x1="812" y1="320" x2="490" y2="320" stroke="#bf4520" stroke-dasharray="5 4" marker-end="url(#f07-02-arrow-accent)"/>
<text x="651" y="312" text-anchor="middle" font-size="10.5" fill="#bf4520">事件</text>

<line x1="472" y1="360" x2="150" y2="360" stroke="#4f5d75" marker-end="url(#f07-02-arrow)"/>
<text x="311" y="352" text-anchor="middle" font-size="10.5" fill="#2d3142">session.event</text>
<text x="311" y="376" text-anchor="middle" font-size="9.5" fill="#5a6580">seq 42, 43, 44 …（不过滤）</text>

<line x1="148" y1="404" x2="470" y2="404" stroke="#4f5d75" marker-end="url(#f07-02-arrow)"/>
<text x="309" y="396" text-anchor="middle" font-size="10.5" fill="#2d3142">session/wait</text>

<line x1="472" y1="440" x2="150" y2="440" stroke="#bf4520" stroke-dasharray="5 4" marker-end="url(#f07-02-arrow-accent)"/>
<text x="311" y="432" text-anchor="middle" font-size="10.5" fill="#bf4520">idle</text>

<path d="M84,222 L72,222 L72,440 L84,440" fill="none" stroke="#9aa1b1"/>
<text x="58" y="331" text-anchor="middle" font-size="10" fill="#5a6580" transform="rotate(-90 58 331)">一轮 turn</text>

<rect x="48" y="470" width="864" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="68" y="494" font-size="11" fill="#2d3142">run() 等的是整只 agent 下一次 idle，多 prompt 并发时 finalResponse 只代表区间内最后一条 root 文本</text>
<text x="68" y="516" font-size="11" fill="#5a6580">协议里没有 cancel 帧：要中断这一轮，只能关掉进程再 resume</text>
</g>
<text x="48" y="586" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#5a6580">SOURCE packages/sdk/client/src/client.ts · packages/sdk/server/src/server.ts</text>
</svg>
