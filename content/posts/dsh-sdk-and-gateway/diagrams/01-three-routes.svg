<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f07-01-title f07-01-desc">
<title id="f07-01-title">三条接入路线的所有权边界</title>
<desc id="f07-01-desc">进程内 SDK 拥有子进程，API Gateway 拥有一条 mux socket，ACP 拥有一个标准连接；三者共用 Session log 与工具管线，不共用 wire 与鉴权。</desc>
<defs>
<marker id="f07-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="48" y="42" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#bf4520">FIG 01 / THREE ROUTES</text>
<text x="48" y="80" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="26" font-weight="600" fill="#2d3142">三条路，三种所有权</text>
<text x="48" y="106" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="13" fill="#5a6580">先决定你的程序拥有什么，再决定用哪条协议</text>

<g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui">
<rect x="48" y="150" width="280" height="330" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="72" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.6" fill="#bf4520">SUBPROCESS</text>
<text x="72" y="216" font-size="20" font-weight="600" fill="#2d3142">进程内 SDK</text>
<text x="72" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.5" fill="#5a6580">stdio · JSON-RPC</text>
<line x1="72" y1="258" x2="304" y2="258" stroke="#e4e4e4"/>
<text x="72" y="284" font-size="10" letter-spacing="1" fill="#5a6580">拥有</text>
<text x="72" y="304" font-size="13" fill="#2d3142">子进程的生死</text>
<text x="72" y="340" font-size="10" letter-spacing="1" fill="#5a6580">断线</text>
<text x="72" y="360" font-size="13" fill="#2d3142">进程没了，resume 重放</text>
<text x="72" y="396" font-size="10" letter-spacing="1" fill="#5a6580">中断</text>
<text x="72" y="416" font-size="13" fill="#2d3142">只能关进程</text>
<text x="72" y="452" font-size="10" letter-spacing="1" fill="#5a6580">适合</text>
<text x="72" y="472" font-size="13" fill="#2d3142">本机 CLI、CI、桌面应用</text>

<rect x="340" y="150" width="280" height="330" rx="6" fill="#ffffff" stroke="#bf4520"/>
<text x="364" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.6" fill="#bf4520">MULTIPLEXED SOCKET</text>
<text x="364" y="216" font-size="20" font-weight="600" fill="#2d3142">API Gateway</text>
<text x="364" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.5" fill="#5a6580">/api/remote.mux</text>
<line x1="364" y1="258" x2="596" y2="258" stroke="#e4e4e4"/>
<text x="364" y="284" font-size="10" letter-spacing="1" fill="#5a6580">拥有</text>
<text x="364" y="304" font-size="13" fill="#2d3142">一条 WebSocket</text>
<text x="364" y="340" font-size="10" letter-spacing="1" fill="#5a6580">断线</text>
<text x="364" y="360" font-size="13" fill="#2d3142">换 socket，ready 后 resync</text>
<text x="364" y="396" font-size="10" letter-spacing="1" fill="#5a6580">中断</text>
<text x="364" y="416" font-size="13" fill="#2d3142">cancel 一条逻辑流</text>
<text x="364" y="452" font-size="10" letter-spacing="1" fill="#5a6580">适合</text>
<text x="364" y="472" font-size="13" fill="#2d3142">浏览器、跨机客户端</text>

<rect x="632" y="150" width="280" height="330" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="656" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.6" fill="#bf4520">STANDARD PROTOCOL</text>
<text x="656" y="216" font-size="20" font-weight="600" fill="#2d3142">ACP</text>
<text x="656" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10.5" fill="#5a6580">stdio · ndjson</text>
<line x1="656" y1="258" x2="888" y2="258" stroke="#e4e4e4"/>
<text x="656" y="284" font-size="10" letter-spacing="1" fill="#5a6580">拥有</text>
<text x="656" y="304" font-size="13" fill="#2d3142">一个 ACP 连接</text>
<text x="656" y="340" font-size="10" letter-spacing="1" fill="#5a6580">断线</text>
<text x="656" y="360" font-size="13" fill="#2d3142">按标准重连，无 generation</text>
<text x="656" y="396" font-size="10" letter-spacing="1" fill="#5a6580">中断</text>
<text x="656" y="416" font-size="13" fill="#2d3142">session/cancel</text>
<text x="656" y="452" font-size="10" letter-spacing="1" fill="#5a6580">适合</text>
<text x="656" y="472" font-size="13" fill="#2d3142">编辑器、别的 harness</text>
</g>

<rect x="48" y="504" width="864" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
<text x="68" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#2d3142">共用：Session log · 事件类型 · 工具执行管线</text>
<text x="68" y="547" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#5a6580">不共用：wire、鉴权、重连策略；换路线等于换一层恢复代码</text>

<text x="48" y="586" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.5" fill="#5a6580">SOURCE packages/sdk/* · packages/api/gateway/src · packages/acp/acp/src</text>
</svg>
