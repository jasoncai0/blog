<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">一次 drain 的循环</title>
  <desc id="d1-desc">prompt 进入收件箱后，会话被认领并开始 drain；每个 Step 结束产生一个结局，continue 与压缩、重试会把循环推回 Step，done、失败与中断则走向释放和 idle。</desc>

  <defs>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">DRAIN LOOP</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">执行是一条带分支的循环，不是一个请求</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">循环的每一圈是一个 Step；Step 的结局决定是继续、压缩、退避，还是收工</text>

  <!-- top row -->
  <rect x="56" y="130" width="150" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="131" y="156" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">准入</text>
  <text x="131" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">prompt → 收件箱</text>

  <rect x="246" y="130" width="150" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="321" y="156" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">认领</text>
  <text x="321" y="176" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">time_suspended</text>

  <rect x="436" y="122" width="180" height="78" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="526" y="150" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">Step</text>
  <text x="526" y="170" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">请求 → 流 → 工具 → 结算</text>
  <text x="526" y="188" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">see figure 2</text>

  <rect x="656" y="130" width="170" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="741" y="156" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">结局判定</text>
  <text x="741" y="176" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">outcome</text>

  <line x1="206" y1="161" x2="242" y2="161" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="396" y1="161" x2="432" y2="161" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="616" y1="161" x2="652" y2="161" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- loop back -->
  <path d="M741,130 V104 H526 V118" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d1-arrow-accent)"/>
  <text x="600" y="98" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">continue：再跑一个 Step</text>

  <!-- outcomes -->
  <rect x="56" y="270" width="250" height="52" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="70" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">compaction</text>
  <text x="70" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">压缩历史后再来一个 Step</text>

  <rect x="330" y="270" width="250" height="52" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="344" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">retry</text>
  <text x="344" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">退避后重发同一个 Step</text>

  <rect x="604" y="270" width="300" height="52" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="618" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">done / failed / interrupted</text>
  <text x="618" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">跳出循环，释放认领</text>

  <line x1="741" y1="192" x2="741" y2="232" stroke="#4f5d75" stroke-width="1"/>
  <line x1="181" y1="232" x2="754" y2="232" stroke="#4f5d75" stroke-width="1"/>
  <line x1="181" y1="232" x2="181" y2="266" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arrow)"/>
  <line x1="455" y1="232" x2="455" y2="266" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arrow)"/>
  <line x1="754" y1="232" x2="754" y2="266" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arrow)"/>
  <line x1="754" y1="322" x2="754" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arrow)"/>

  <!-- exits -->
  <rect x="56" y="376" width="848" height="76" rx="6" fill="#ffffff" stroke="rgba(79,93,117,0.4)" stroke-width="1"/>
  <text x="72" y="400" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">LEAVING THE LOOP</text>
  <text x="72" y="422" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">释放认领 → 触发 idle 钩子。goal 的 continuation 就是在这里被塞回来的：它让"本该结束"的 drain 再跑一圈。</text>
  <text x="72" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">同一时刻用户发来的新消息则走另一条路：进收件箱，在下一个安全边界作为 steer 插入，不打断正在飞的 Step。</text>

  <text x="56" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">循环里没有"计划"这个变量。计划能影响执行的方式只有三种：改工具/权限、往历史里加消息、在 idle 时再塞一条消息。</text>
</svg>
