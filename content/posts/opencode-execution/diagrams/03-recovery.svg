<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">中断与崩溃的两条恢复路径</title>
  <desc id="d3-desc">优雅中断在边界停下、结算并释放认领；进程崩溃留下认领，重启扫描按每轮预算续跑，超过十次则以失败终结。</desc>

  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">INTERRUPT &amp; RECOVERY</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">两种"停下来"，两条恢复路径</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">同一个耐久签名（认领），一个靠边界收尾，一个靠重启扫描</text>

  <!-- column A -->
  <text x="60" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">A · 优雅中断（用户按下停止）</text>

  <rect x="60" y="142" width="330" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="225" y="169" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">正在跑 Step：流与工具都在飞</text>

  <rect x="60" y="206" width="330" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="225" y="233" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">在边界停下：interruptAll 杀掉在跑的工具</text>

  <rect x="60" y="270" width="330" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="225" y="297" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">写完 Step.Ended（已被取消也要写完）</text>

  <rect x="60" y="334" width="330" height="44" rx="5" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="225" y="361" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">释放认领 → 空闲</text>

  <line x1="225" y1="186" x2="225" y2="202" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="225" y1="250" x2="225" y2="266" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="225" y1="314" x2="225" y2="330" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>

  <!-- column B -->
  <text x="520" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">B · 崩溃（进程直接没了）</text>

  <rect x="520" y="142" width="380" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="169" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">进程死亡：没人写终态，认领留在库里</text>

  <rect x="520" y="206" width="380" height="44" rx="5" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="710" y="233" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">下次启动扫描：认领未释放 = 上一轮没跑完</text>

  <rect x="520" y="270" width="380" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="297" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">countResume：这一轮已经被恢复过几次？</text>

  <line x1="710" y1="186" x2="710" y2="202" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>
  <line x1="710" y1="250" x2="710" y2="266" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#d3-arrow)"/>

  <!-- split -->
  <rect x="520" y="340" width="180" height="60" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="610" y="364" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">attempts ≤ 10</text>
  <text x="610" y="384" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">注入"服务重启过，继续"</text>

  <rect x="730" y="340" width="170" height="60" rx="5" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="815" y="364" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">attempts &gt; 10</text>
  <text x="815" y="384" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">以失败终结并释放</text>

  <line x1="660" y1="314" x2="610" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="760" y1="314" x2="812" y2="336" stroke="#bf4520" stroke-width="1" marker-end="url(#d3-arrow-accent)"/>

  <text x="520" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">预算按"轮"计：只在该轮产生终态事件时清零。所以反复崩溃的目标不会无限重启，也不会拖累下一轮。</text>
  <text x="520" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">恢复是"至少一次"：进程内协调防的是并发 drain，防不了崩溃前已经发生的副作用。</text>

  <text x="60" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两条路径的分界不是"有没有中断"，而是"有没有人写完终态"。优雅中断会写完；崩溃不会，所以只能靠下一次启动补。</text>
</svg>
