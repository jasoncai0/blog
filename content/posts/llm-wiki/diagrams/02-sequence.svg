<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="ct cd">
  <title id="ct">一次摄入的时序</title>
  <desc id="cd">人放入来源，agent 读目录与候选页，写扩散 10–15 页，更新 index 与 log 后提交</desc>
  <rect x="0" y="0" width="960" height="600" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">SEQUENCE · 一次摄入</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">先读目录，再写 10–15 页，最后记账</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="0.6">同一个来源会被多页引用</text>
  <rect x="36.0" y="96" width="92" height="36" fill="#f2ece2" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36.0" y="96" width="4" height="36" fill="#a8752a"/>
  <text x="48.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">人</text>
  <line x1="82" y1="132" x2="82" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="176.0" y="96" width="140" height="36" fill="#efeaf6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="176.0" y="96" width="4" height="36" fill="#5b4b8a"/>
  <text x="188.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">LLM Agent</text>
  <line x1="246" y1="132" x2="246" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="345.0" y="96" width="110" height="36" fill="#e9eff6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="345.0" y="96" width="4" height="36" fill="#3d5a80"/>
  <text x="357.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">raw/ 只读</text>
  <line x1="400" y1="132" x2="400" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="492.0" y="96" width="120" height="36" fill="#e9f2ed" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="492.0" y="96" width="4" height="36" fill="#2f6f5e"/>
  <text x="504.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">wiki/ 页面</text>
  <line x1="552" y1="132" x2="552" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="636.0" y="96" width="140" height="36" fill="#eef0f4" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="636.0" y="96" width="4" height="36" fill="#5a6580"/>
  <text x="648.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">index + log</text>
  <line x1="706" y1="132" x2="706" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <rect x="820.0" y="96" width="100" height="36" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="820.0" y="96" width="4" height="36" fill="#2d3142"/>
  <text x="832.0" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">git</text>
  <line x1="870" y1="132" x2="870" y2="566" stroke="#c3c9d4" stroke-dasharray="4 5"/>
  <line x1="130" y1="172" x2="174" y2="172" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="152" cy="172" r="7" fill="#2d3142"/>
  <text x="152" y="174.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">1</text>
  <text x="158" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">放入 raw/，说明要处理什么</text>
  <line x1="318" y1="214" x2="344" y2="214" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="331" cy="214" r="7" fill="#2d3142"/>
  <text x="331" y="216.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">2</text>
  <text x="338" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">读原文：只读工具，不允许改写</text>
  <path d="M246 246 h44 v14 h-44" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="302" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">抽实体 / 概念 / 主张，在 index 里列候选页</text>
  <circle cx="252" cy="258" r="7" fill="#2d3142"/>
  <text x="252" y="260.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="318" y1="298" x2="490" y2="298" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="404" cy="298" r="7" fill="#2d3142"/>
  <text x="404" y="300.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">4</text>
  <text x="410" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">读候选页：已有摘要与矛盾段</text>
  <line x1="318" y1="340" x2="490" y2="340" stroke="#5b4b8a" stroke-width="1.4" marker-end="url(#apu)"/>
  <circle cx="404" cy="340" r="7" fill="#2d3142"/>
  <text x="404" y="342.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">5</text>
  <text x="410" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5b4b8a">写扩散：实体页、概念页、总览、时间线</text>
  <line x1="318" y1="382" x2="490" y2="382" stroke="#5b4b8a" stroke-width="1.1" marker-end="url(#apu)"/>
  <circle cx="404" cy="382" r="7" fill="#2d3142"/>
  <text x="404" y="384.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">6</text>
  <text x="410" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5b4b8a">新页补一条入链；冲突写 ⚠️ 段，两个来源并存</text>
  <line x1="318" y1="424" x2="634" y2="424" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="476" cy="424" r="7" fill="#2d3142"/>
  <text x="476" y="426.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">7</text>
  <text x="482" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">更新 index 条目：一句话摘要 + 链接</text>
  <line x1="318" y1="466" x2="634" y2="466" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="476" cy="466" r="7" fill="#2d3142"/>
  <text x="476" y="468.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">8</text>
  <text x="482" y="458" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#5a6580">追加 log：## [日期] ingest | 标题</text>
  <line x1="318" y1="508" x2="818" y2="508" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <circle cx="568" cy="508" r="7" fill="#2d3142"/>
  <text x="568" y="510.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">9</text>
  <text x="574" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">commit：diff 就是这次知识变更的审计记录</text>
  <text x="36" y="560" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">人只做两件事：选源、读页面确认。摘要、交叉引用、矛盾标注、记账都归 agent。</text>
  <text x="36" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">写扩散页数超过 15，说明这次来源太杂，拆开再摄，不要硬塞。</text>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="apu" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b4b8a"/></marker>
  </defs>
</svg>
