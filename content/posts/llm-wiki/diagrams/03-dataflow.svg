<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="ct cd">
  <title id="ct">摄入与查询的数据流</title>
  <desc id="cd">摄入把原件编译成页面、索引与日志；查询按目录下钻，好答案回填成新页面</desc>
  <rect x="0" y="0" width="960" height="510" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">DATAFLOW · 摄入编译 → 查询回填</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">编译期付一次成本，查询期只读页面</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="0.6">写扩散是成本中心</text>
  <text x="36" y="110" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" letter-spacing="1.1">INGEST · 一源编译</text>
  <rect x="36" y="126" width="200" height="64" fill="#e9eff6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="126" width="4" height="64" fill="#3d5a80"/>
  <text x="48" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">原始层 raw/</text>
  <text x="48" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">文章 · PDF · 图片</text>
  <text x="48" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">sha256 + 只读挂载</text>
  <rect x="262" y="126" width="190" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="262" y="126" width="4" height="64" fill="#3d5a80"/>
  <text x="274" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">解析与归一</text>
  <text x="274" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">文本 / 图表 / 元数据</text>
  <text x="274" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">facts: 标题, 数值, 引用</text>
  <rect x="478" y="126" width="190" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="478" y="126" width="4" height="64" fill="#3d5a80"/>
  <text x="490" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">事实抽取</text>
  <text x="490" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">实体 · 概念 · 主张</text>
  <text x="490" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">每条能落回原文位置</text>
  <rect x="694" y="126" width="230" height="64" fill="#f7efe4" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="694" y="126" width="4" height="64" fill="#bf4520"/>
  <text x="706" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">页面规划</text>
  <text x="706" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">index 命中集 + 决策</text>
  <text x="706" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">create / update / merge</text>
  <text x="36" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5b4b8a" letter-spacing="1.1">WRITE FAN-OUT · 写扩散后收敛</text>
  <rect x="694" y="232" width="230" height="64" fill="#efeaf6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="694" y="232" width="4" height="64" fill="#5b4b8a"/>
  <text x="706" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">写扩散 ≤15 页</text>
  <text x="706" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">实体页 · 概念页 · 总览</text>
  <text x="706" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">diff = 本次知识变更</text>
  <rect x="478" y="232" width="190" height="64" fill="#f8eae8" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="478" y="232" width="4" height="64" fill="#9b4b52"/>
  <text x="490" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">校验与矛盾</text>
  <text x="490" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">入链 · 冲突标注</text>
  <text x="490" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">⚠️ 两来源并存，不擅自裁决</text>
  <rect x="262" y="232" width="190" height="64" fill="#e9f2ed" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="262" y="232" width="4" height="64" fill="#2f6f5e"/>
  <text x="274" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">索引与日志</text>
  <text x="274" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">index 更新 · log 追加</text>
  <text x="274" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">向量可选：只做候选扩展</text>
  <rect x="36" y="232" width="200" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="232" width="4" height="64" fill="#2f6f5e"/>
  <text x="48" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">页面可检索</text>
  <text x="48" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">目录 → 页面 → 原文</text>
  <text x="48" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">不再从零综合</text>
  <line x1="236" y1="158" x2="258" y2="158" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="247" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">读</text>
  <line x1="452" y1="158" x2="474" y2="158" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="463" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">抽</text>
  <line x1="668" y1="158" x2="690" y2="158" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="679" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">查 index</text>
  <path d="M809 190 v38" fill="none" stroke="#bf4520" stroke-width="1.1" marker-end="url(#aro)"/>
  <text x="816" y="214" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">落地</text>
  <line x1="690" y1="264" x2="672" y2="264" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="681" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">写</text>
  <line x1="474" y1="264" x2="456" y2="264" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="465" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">校</text>
  <line x1="258" y1="264" x2="240" y2="264" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <text x="249" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580" text-anchor="middle">记</text>
  <line x1="36" y1="324" x2="924" y2="324" stroke="rgba(45,49,66,0.18)"/>
  <text x="36" y="342" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5b4b8a" letter-spacing="1.1">QUERY · 只读已编译结构</text>
  <rect x="36" y="352" width="170" height="62" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="48" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">问题</text>
  <text x="48" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">先读 index，不碰向量</text>
  <text x="48" y="404" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">3–5 个候选</text>
  <rect x="236" y="352" width="280" height="62" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="248" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">目录 → 候选页 → 原文</text>
  <text x="248" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">逐层下钻，每次只展开一层</text>
  <text x="248" y="404" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">答案带页面链接与来源哈希</text>
  <rect x="546" y="352" width="180" height="62" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="558" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">综合答案</text>
  <text x="558" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">跨页面的对比与因果</text>
  <text x="558" y="404" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">不确定就写 ⚠️</text>
  <rect x="756" y="352" width="168" height="62" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="768" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">回填</text>
  <text x="768" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">新结构落成页面</text>
  <text x="768" y="404" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">更新 index</text>
  <line x1="206" y1="383" x2="232" y2="383" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="516" y1="383" x2="542" y2="383" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="726" y1="383" x2="752" y2="383" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ar)"/>
  <path d="M840 352 v-52" fill="none" stroke="#5b4b8a" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#apu)"/>
  <text x="847" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5b4b8a">好答案回填</text>
  <text x="36" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">编译期付一次成本：每源 20–40k token；查询期只读页面，不再重新综合。</text>
  <text x="36" y="466" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">幂等键 (source_hash, page_id, version)：重试不重复写页，超过 3 次进死信。</text>
  <text x="36" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">结构错误也会沿链接放大，所以每次摄入必须看 diff。</text>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="aro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
    <marker id="apu" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5b4b8a"/></marker>
  </defs>
</svg>
