<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="ct cd">
  <title id="ct">三条线的角色分工</title>
  <desc id="cd">人负责选源提问裁决，agent 负责读写记账，文件系统承载 raw 与 wiki，lint 定时产工单</desc>
  <rect x="0" y="0" width="960" height="620" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">SWIMLANE · 谁在什么时候做什么</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">三条线：摄入、查询、巡检</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="0.6">lint 只产工单，不改内容</text>
  <text x="296.0" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle" font-weight="600">摄入</text>
  <text x="576.0" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle" font-weight="600">查询</text>
  <text x="820.0" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle" font-weight="600">巡检</text>
  <line x1="36" y1="126" x2="924" y2="126" stroke="rgba(45,49,66,0.18)"/>
  <rect x="36" y="140" width="120" height="106" fill="#f2ece2" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="140" width="4" height="106" fill="#a8752a"/>
  <text x="52" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">人</text>
  <line x1="36" y1="246" x2="924" y2="246" stroke="rgba(45,49,66,0.18)"/>
  <rect x="36" y="246" width="120" height="110" fill="#efeaf6" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="246" width="4" height="110" fill="#5b4b8a"/>
  <text x="52" y="298" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">LLM Agent</text>
  <line x1="36" y1="356" x2="924" y2="356" stroke="rgba(45,49,66,0.18)"/>
  <rect x="36" y="356" width="120" height="110" fill="#e9f2ed" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="356" width="4" height="110" fill="#2f6f5e"/>
  <text x="52" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">文件系统</text>
  <line x1="36" y1="466" x2="924" y2="466" stroke="rgba(45,49,66,0.18)"/>
  <rect x="36" y="466" width="120" height="104" fill="#f8eae8" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
  <rect x="36" y="466" width="4" height="104" fill="#9b4b52"/>
  <text x="52" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">Lint 定时</text>
  <line x1="36" y1="570" x2="924" y2="570" stroke="rgba(45,49,66,0.18)"/>
  <line x1="436" y1="132" x2="436" y2="570" stroke="rgba(45,49,66,0.18)"/>
  <line x1="716" y1="132" x2="716" y2="570" stroke="rgba(45,49,66,0.18)"/>
  <line x1="156" y1="132" x2="156" y2="570" stroke="rgba(45,49,66,0.18)"/>
  <circle cx="176" cy="166" r="7" fill="#a8752a"/>
  <text x="176" y="168.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">1</text>
  <text x="192" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">选源</text>
  <text x="192" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这个来源值不值得编译；不值的进 raw 不摄</text>
  <circle cx="176" cy="272" r="7" fill="#5b4b8a"/>
  <text x="176" y="274.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">2</text>
  <text x="192" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">读 schema + index</text>
  <text x="192" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">读原文，抽事实，列候选页</text>
  <circle cx="176" cy="382" r="7" fill="#5b4b8a"/>
  <text x="176" y="384.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">3</text>
  <text x="192" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">写 10–15 页</text>
  <text x="192" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">改 index、追加 log、commit</text>
  <circle cx="176" cy="492" r="7" fill="#9b4b52"/>
  <text x="176" y="494.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">4</text>
  <text x="192" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">摄入后不跑 lint</text>
  <text x="192" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">等每日定时，避免边写边判</text>
  <circle cx="456" cy="166" r="7" fill="#a8752a"/>
  <text x="456" y="168.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">5</text>
  <text x="472" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">提问，判断答案</text>
  <text x="472" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">答案不对时问「依据哪一页」</text>
  <circle cx="456" cy="272" r="7" fill="#5b4b8a"/>
  <text x="456" y="274.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">6</text>
  <text x="472" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">index → 候选页 → 原文</text>
  <text x="472" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三跳下钻，每跳只展开一层</text>
  <circle cx="456" cy="382" r="7" fill="#2f6f5e"/>
  <text x="456" y="384.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">7</text>
  <text x="472" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">只读</text>
  <text x="472" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">页面与 raw 都不改；答案带链接</text>
  <circle cx="456" cy="492" r="7" fill="#9b4b52"/>
  <text x="456" y="494.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">8</text>
  <text x="472" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">不参与查询</text>
  <text x="472" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">查询不触发 lint</text>
  <circle cx="736" cy="166" r="7" fill="#a8752a"/>
  <text x="736" y="168.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">9</text>
  <text x="752" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">裁决矛盾</text>
  <text x="752" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两个来源冲突时人选一个，并记日期</text>
  <circle cx="736" cy="272" r="7" fill="#5b4b8a"/>
  <text x="736" y="274.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">10</text>
  <text x="752" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">修复工单</text>
  <text x="752" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">每次修复按一次小摄入来写</text>
  <circle cx="736" cy="382" r="7" fill="#2f6f5e"/>
  <text x="736" y="384.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">11</text>
  <text x="752" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">改页 + 记 log</text>
  <text x="752" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">diff 逐条看，防止乱补链接</text>
  <circle cx="736" cy="492" r="7" fill="#9b4b52"/>
  <text x="736" y="494.6" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#ffffff" text-anchor="middle">12</text>
  <text x="752" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">扫六类问题</text>
  <text x="752" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">孤儿 / 缺页 / 断链 / 矛盾 / 过期 / 缺口</text>
  <text x="36" y="590" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">顺序按编号 1→12。摄入与查询之间没有自动触发：查询只读已编译的页面。</text>
  <text x="36" y="608" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">巡检发现的冲突交给人裁决，agent 只负责把裁决写回页面并记 log。</text>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
  </defs>
</svg>
