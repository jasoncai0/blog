<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="r5-t r5-d"><title id="r5-t">RAG、长上下文、微调三者对比</title><desc id="r5-d">按知识更新速度、单次成本、能否溯源、能改变什么、擅长场景五个维度对比三种做法。结论是三者不互斥：微调管表达方式，RAG 管依据从哪来，长上下文管这一次是否全看。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">RAG vs LONG CONTEXT vs FINETUNE</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">三者不是替代关系，解决的是不同问题</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">微调改「怎么说」，RAG 定「依据什么」，长上下文管「这一次是否全看」</text><rect x="180" y="104" width="248" height="48" rx="6" fill="#e9eff6" stroke="#c3cede" stroke-width="1"/><text x="304" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3d5a80">RAG</text><text x="304" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4f5d75">先检索，再让模型基于片段回答</text><rect x="440" y="104" width="248" height="48" rx="6" fill="#efeaf6" stroke="#cbc2df" stroke-width="1"/><text x="564" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5b4b8a">长上下文</text><text x="564" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4f5d75">把整份材料塞进去，一次看完</text><rect x="700" y="104" width="212" height="48" rx="6" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="806" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2f6f5e">微调</text><text x="806" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4f5d75">用样本改权重，改的是行为习惯</text><text x="48" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142">知识更新</text><text x="48" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">代价差一个量级</text><rect x="180" y="168" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="196" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">改文档、重建该篇索引，分钟级生效</text><text x="196" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">不用动模型</text><rect x="440" y="168" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="456" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">换一次输入就是新的，无需索引</text><text x="456" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">前提是整份材料装得进窗口</text><rect x="700" y="168" width="212" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="716" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">重训或增量训练，天级起步</text><text x="716" y="199" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">还可能灾难性遗忘</text><text x="48" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142">单次成本</text><text x="48" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">按每问付多少看</text><rect x="180" y="228" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="196" y="245" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">只付检索到的几千 token + 一次检索延迟</text><text x="196" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">索引成本摊在全库上</text><rect x="440" y="228" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="456" y="245" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">每问都按全长计费，还多付首字延迟</text><text x="456" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">十万 token 的问一次就是一次全价</text><rect x="700" y="228" width="212" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="716" y="245" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">推理成本不变，训练成本一次性</text><text x="716" y="259" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">小模型微调后可能更便宜</text><text x="48" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142">能否溯源</text><text x="48" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">能不能指出处</text><rect x="180" y="288" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="196" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">能，每条结论指到段落与版本</text><text x="196" y="319" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">这是它在合规场景胜出的原因</text><rect x="440" y="288" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="456" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">能，但只限这一次塞进去的那份</text><text x="456" y="319" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">跨次对比就要重新组织输入</text><rect x="700" y="288" width="212" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="716" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">不能，知识进了权重就指不出来</text><text x="716" y="319" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">只能给样本，给不出处</text><text x="48" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142">能改变什么</text><text x="48" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">事实还是习惯</text><rect x="180" y="348" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="196" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">提供事实，不改表达风格</text><text x="196" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">模型不认识业务术语，照样说错</text><rect x="440" y="348" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="456" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">提供事实，且保留全文上下文与顺序</text><text x="456" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">推理链条复杂时优势明显</text><rect x="700" y="348" width="212" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="716" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">改风格、格式、判断倾向、输出结构</text><text x="716" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">事实类知识灌进去并不可靠</text><text x="48" y="426" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#2d3142">什么时候用</text><text x="48" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">按约束选，不按偏好</text><rect x="180" y="408" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="196" y="425" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">文档量大、更新频繁、要引用、要权限隔离</text><text x="196" y="439" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价是多一套工程</text><rect x="440" y="408" width="248" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="456" y="425" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">材料少而整、一次要看全、要跨段推理</text><text x="456" y="439" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">量再大就要退回检索</text><rect x="700" y="408" width="212" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="716" y="425" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#2d3142">输出格式固定、判罚标准固定</text><text x="716" y="439" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">prompt 能解决的别急着训</text><rect x="48" y="470" width="864" height="56" rx="6" fill="#e9eff6" stroke="#c3cede" stroke-width="1"/><text x="66" y="491" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#3d5a80">组合顺序：先 prompt + RAG，再做微调管表达，长上下文只留给「必须看全」的场景</text><text x="66" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">顺序反了很常见：先训一版模型，发现知识过期又加 RAG，最后两套口径互相打架。</text></svg>
