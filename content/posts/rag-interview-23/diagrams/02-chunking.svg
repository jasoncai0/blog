<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="r2-t r2-d"><title id="r2-t">切分策略的谱系</title><desc id="r2-d">五种切分策略沿一条轴排开：左端块小、定位准、上下文碎；右端块大、上下文完整、检索变钝。固定加重叠在最左，语义边界次之，父子切割居中，句子窗口偏右，Contextual Retrieval 在右端但额外付出每块一次模型调用的成本。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">CHUNKING · FIVE STRATEGIES</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">切分不是选一种，是在一个方向上选落点</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">左端块小好定位，右端块大能读懂。所有方案都在这条线上，代价跟着往右走</text><rect x="48" y="112" width="864" height="66" rx="6" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="66" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" text-anchor="start" fill="#2f6f5e">落地顺序：先按结构边界切（成本最低、收益最大），不够再叠父子，最后才上 Contextual</text><text x="66" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">因为前两种只改代码，后两种要改库结构或增加模型调用。反过来做，先付最贵的成本，还说不清收益来自哪一步。</text><text x="66" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">判断标准是「正确段落能否被单独召回」，不是块大小看起来是否整齐。</text><path d="M70,486 L890,486" stroke="#9aa3b2" stroke-width="1.1"/><polygon points="64,486 72,482.9 72,489.1" fill="#9aa3b2"/><polygon points="896,486 888,482.9 888,489.1" fill="#9aa3b2"/><text x="70" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#3d5a80">块小 · 定位准 · 上下文碎</text><text x="890" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="end" fill="#2f6f5e">块大 · 读得懂 · 定位钝</text><text x="480" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#8a93a6">方案越往右，额外成本越高：多存一份、多算一次、多调一次模型</text><rect x="72" y="300" width="150" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="72" y="300" width="3.5" height="150" rx="2" fill="#3d5a80"/><text x="88" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">固定＋重叠</text><text x="88" y="342" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">按字数切，前后留</text><text x="88" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">10%–20% 重叠</text><text x="88" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价：总在句子中间下刀</text><text x="88" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">适合：日志、无结构长文</text><text x="88" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" text-anchor="start" fill="#3d5a80">成本 1×</text><rect x="240" y="272" width="150" height="178" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="240" y="272" width="3.5" height="178" rx="2" fill="#3d5a80"/><text x="256" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">结构 / 语义边界</text><text x="256" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">按标题、段落、句子边界切</text><text x="256" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">代码按函数，表格整块</text><text x="256" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价：块大小不均，长块混语义</text><text x="256" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">适合：手册、条款、代码库</text><text x="256" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" text-anchor="start" fill="#3d5a80">成本 1.2×</text><rect x="408" y="240" width="150" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="408" y="240" width="3.5" height="210" rx="2" fill="#5b4b8a"/><text x="424" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">父子切割</text><text x="424" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">小块检索命中，返回父块全文</text><text x="424" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">检索宽度和阅读宽度分开</text><text x="424" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价：父块重复占上下文预算</text><text x="424" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">适合：答案常跨段的技术文档</text><text x="424" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" text-anchor="start" fill="#5b4b8a">成本 1.5×</text><rect x="576" y="272" width="150" height="178" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="576" y="272" width="3.5" height="178" rx="2" fill="#5b4b8a"/><text x="592" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">句子窗口</text><text x="592" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">索引只存句子，命中带前后 N 句</text><text x="592" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">一句一句进库</text><text x="592" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价：库变大，窗口大小难定</text><text x="592" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">适合：问答对、密集短句文档</text><text x="592" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" text-anchor="start" fill="#5b4b8a">成本 1.5×</text><rect x="744" y="240" width="150" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="744" y="240" width="3.5" height="210" rx="2" fill="#2f6f5e"/><text x="760" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">Contextual</text><text x="760" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">先让模型给每块写一段背景，</text><text x="760" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">背景＋正文一起向量化</text><text x="760" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">代价：每块一次模型调用</text><text x="760" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">适合：块脱离原文就没主语的库</text><text x="760" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" font-weight="500" text-anchor="start" fill="#2f6f5e">成本 3×+</text><text x="48" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#5a6580">可以叠加：结构边界切分 ＋ 父子切割 ＋ Contextual 背景，是常见的三层组合，成本也逐层上涨。</text><text x="48" y="566" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="500" text-anchor="start" fill="#5a6580">验证办法只有一个：抽真实问题，看正确段落能不能被单独召回；总跨两三块，就往右挪一格。</text></svg>
