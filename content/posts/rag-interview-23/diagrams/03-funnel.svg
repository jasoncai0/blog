<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="r3-t r3-d"><title id="r3-t">检索漏斗的四个刻度</title><desc id="r3-d">候选两百条经 RRF 融合剩六十条，精排后二十条，进 prompt 只有六条。每一格对应一类失败：召回阶段漏掉、融合阶段被热门块挤掉、精排阶段标准不合、拼装阶段被预算裁掉。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">RETRIEVAL FUNNEL</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">四道闸门，每道都能丢答案</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">候选宁可多，进 prompt 必须少。中间每一格都是可调的旋钮，也是可查的故障点</text><rect x="90" y="150" width="500" height="60" rx="5" fill="#e9eff6" stroke="#c3cede" stroke-width="1"/><text x="108" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#3d5a80">多路召回</text><text x="108" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">向量 + BM25 + 多个 Query 变体，各取 top 50</text><text x="574" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="end" fill="#3d5a80">200 条</text><rect x="90" y="240" width="330" height="60" rx="5" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="108" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2f6f5e">融合去重</text><text x="108" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">RRF 按名次合并，k 常取 60</text><text x="404" y="278" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="end" fill="#2f6f5e">60 条</text><rect x="90" y="330" width="210" height="60" rx="5" fill="#efeaf6" stroke="#cbc2df" stroke-width="1"/><text x="108" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b4b8a">精排</text><text x="108" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">cross-encoder 逐条打分</text><text x="284" y="368" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="end" fill="#5b4b8a">20 条</text><rect x="90" y="420" width="130" height="60" rx="5" fill="#f7efe4" stroke="#dfcbb0" stroke-width="1"/><text x="108" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#a8752a">进 prompt</text><text x="108" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">带引用编号</text><text x="204" y="458" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="end" fill="#a8752a">6 条</text><path d="M90,216 L90,232" stroke="#9aa3b2" stroke-width="1"/><polygon points="90,238 87.2,231.5 92.8,231.5" fill="#9aa3b2"/><path d="M90,306 L90,322" stroke="#9aa3b2" stroke-width="1"/><polygon points="90,328 87.2,321.5 92.8,321.5" fill="#9aa3b2"/><path d="M90,396 L90,412" stroke="#9aa3b2" stroke-width="1"/><polygon points="90,418 87.2,411.5 92.8,411.5" fill="#9aa3b2"/><path d="M590,180 L628,180" fill="none" stroke="#c3cede" stroke-width="0.9"/><path d="M420,270 L628,270" fill="none" stroke="#c2d8cd" stroke-width="0.9"/><path d="M300,360 L628,360" fill="none" stroke="#cbc2df" stroke-width="0.9"/><path d="M220,450 L628,450" fill="none" stroke="#dfcbb0" stroke-width="0.9"/><text x="640" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#9b4b52">① 漏在库里</text><text x="640" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">问题用词和文档用词不一样，向量不认</text><text x="640" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">解法：加 BM25 与改写，别只调阈值</text><text x="640" y="254" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#9b4b52">② 被热门块挤掉</text><text x="640" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">多路都在推同一段泛泛而谈的段落</text><text x="640" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">解法：去重按块指纹，不是按文本相似</text><text x="640" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#9b4b52">③ 排错顺序</text><text x="640" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">精排模型没见过业务词，把对的压到 21 名</text><text x="640" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">解法：看 rerank 前后的名次变化，别只看最终分</text><text x="640" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#9b4b52">④ 被预算裁掉</text><text x="640" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">前面塞了长块，最后两条恰好是关键那条</text><text x="640" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">解法：按预算截断并记录被丢的块，事后能对账</text><rect x="48" y="512" width="864" height="56" rx="6" fill="#f8eae8" stroke="#e0c3c0" stroke-width="1"/><text x="66" y="533" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#9b4b52">分数阈值不可靠：不同查询的相似度分布尺度不一样</text><text x="66" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#6b5560">同一阈值在短问句上放进来一堆噪声，在长问句上又全被砍掉。用固定条数（top-k）作主控，阈值只做兜底。</text></svg>
