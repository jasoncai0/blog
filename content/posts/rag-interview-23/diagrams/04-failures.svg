<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="r4-t r4-d"><title id="r4-t">RAG 答错的三个归因分支</title><desc id="r4-d">答案不对时，先看检索结果里有没有那段正确文本：没有是召回问题，有但没用对是拼装与生成问题，两样都有但内容是旧版本或冲突条款，是数据本身问题。三个分支的解法完全不同。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">FAILURE ATTRIBUTION</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">答错了先问一句：正确的那段在不在上下文里</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">这一问把问题切成三块，三块的解法没有交集。答错就调 prompt，等于在三块之外乱试</text><rect x="48" y="112" width="864" height="40" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="480" y="137" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" text-anchor="middle" fill="#2d3142">现象：答案不对 · 先取这一次的 prompt 原文和召回列表，不要凭记忆复现</text><path d="M320,152 L320,176 L180,176 L180,196" fill="none" stroke="#9aa3b2" stroke-width="1"/><path d="M480,152 L480,196" fill="none" stroke="#9aa3b2" stroke-width="1"/><path d="M640,152 L640,176 L780,176 L780,196" fill="none" stroke="#9aa3b2" stroke-width="1"/><polygon points="180,202 177.2,195.5 182.8,195.5" fill="#9aa3b2"/><polygon points="480,202 477.2,195.5 482.8,195.5" fill="#9aa3b2"/><polygon points="780,202 777.2,195.5 782.8,195.5" fill="#9aa3b2"/><rect x="48" y="208" width="288" height="318" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="208" width="288" height="34" rx="6" fill="#e9eff6"/><rect x="48" y="208" width="288" height="34" rx="6" fill="none" stroke="#c3cede" stroke-width="1"/><text x="66" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#3d5a80">① 没召回：正确的那段根本不在</text><text x="66" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">常见原因</text><text x="66" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 文档解析失败，表格被拆成一列数字</text><text x="66" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 切分把答案劈成两块，各占一半语义</text><text x="66" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 问题用词与文档用词不同，向量不认</text><text x="66" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 权限过滤把该看的块一起滤掉</text><text x="66" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">怎么确认</text><text x="66" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">拿答案里的关键句去库里检索：命中不了就是入库阶段的问题。</text><text x="66" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">解法</text><text x="66" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 解析加表格还原，切分加父块</text><text x="66" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 召回加 BM25 与查询改写</text><text x="66" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 权限条件放到检索之后，别当过滤条件</text><text x="66" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">这一支占线上问题的多数</text><text x="66" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">排查入口：召回列表里逐条点开看原文</text><rect x="336" y="208" width="288" height="318" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="336" y="208" width="288" height="34" rx="6" fill="#efeaf6"/><rect x="336" y="208" width="288" height="34" rx="6" fill="none" stroke="#cbc2df" stroke-width="1"/><text x="354" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#5b4b8a">② 召回了没用对：在上下文里</text><text x="354" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">常见原因</text><text x="354" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 排在 prompt 末尾被截断，或埋在长块中段</text><text x="354" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 指令没说清「只用资料回答」</text><text x="354" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 资料里有两个相近数字，模型挑了错的那个</text><text x="354" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 生成时没要求引用，无法回溯</text><text x="354" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">怎么确认</text><text x="354" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">把资料单独贴给模型问一次：答对了，问题在拼装与指令。</text><text x="354" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">解法</text><text x="354" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 关键块提到前面，块内做句子级裁剪</text><text x="354" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 强制带引用编号，无依据则拒答</text><text x="354" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 冲突信息在 prompt 里显式标注来源与时间</text><text x="354" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">这一支最容易被误判成「模型不行」</text><text x="354" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">排查入口：看最终 prompt 的字节数与块顺序</text><rect x="624" y="208" width="288" height="318" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="624" y="208" width="288" height="34" rx="6" fill="#f8eae8"/><rect x="624" y="208" width="288" height="34" rx="6" fill="none" stroke="#e0c3c0" stroke-width="1"/><text x="642" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#9b4b52">③ 依据本身错：在，但是旧的</text><text x="642" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">常见原因</text><text x="642" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 文档更新了，索引没重建</text><text x="642" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 新旧两版条款同时被召回，互相矛盾</text><text x="642" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 来源本身是错的：论坛、过期 wiki</text><text x="642" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 同一问题多个部门口径不同</text><text x="642" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">怎么确认</text><text x="642" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">看引用块的生效时间与来源权威级：早于变更点即过期。</text><text x="642" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#2d3142">解法</text><text x="642" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 元数据记生效区间，检索时按当前时间过滤</text><text x="642" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 冲突条款按权威级排序，最高级优先</text><text x="642" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">· 无法判定时把两版都摆出来，标注差异</text><text x="642" y="462" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">这一支靠模型救不回来</text><text x="642" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">排查入口：元数据表，不看检索分数</text><rect x="48" y="546" width="864" height="56" rx="6" fill="#f7efe4" stroke="#dfcbb0" stroke-width="1"/><text x="66" y="567" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" text-anchor="start" fill="#a8752a">三步定位：拉这次请求的完整现场 → 看正确段落在不在召回列表里 → 在的话看它在 prompt 的第几位</text><text x="66" y="584" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="400" text-anchor="start" fill="#6b5560">三步走完，问题一定落在三支之一。走不完说明日志不够，先补日志再谈优化。</text></svg>
