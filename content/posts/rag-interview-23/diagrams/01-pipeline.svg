<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="r1-t r1-d"><title id="r1-t">RAG 的离线索引与在线查询两段</title><desc id="r1-d">左侧离线：文档解析、切分、向量化、连同元数据入库，成本摊在一次。右侧在线：问题改写、向量化、多路召回、精排、拼装、生成并附来源。两段各有失败模式，排查先分清问题出在哪一段。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">TWO STAGES · 23 QUESTIONS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">RAG 是两段系统，不是一条链路</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">离线错一次影响全库，在线错一次只影响这一问。排查先定位段，再定位步</text><rect x="48" y="106" width="424" height="404" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="48" y="106" width="424" height="34" rx="6" fill="#e9eff6"/><rect x="48" y="106" width="424" height="34" rx="6" fill="none" stroke="#c3cede" stroke-width="1"/><text x="66" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#3d5a80">离线索引：把知识变成可检索的块</text><text x="454" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#3d5a80">Q4–Q9</text><rect x="66" y="156" width="388" height="52" rx="5" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1"/><text x="82" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">解析</text><text x="82" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">PDF 表格、扫描件、页眉页脚，这一步出垃圾，后面全是补偿</text><rect x="66" y="222" width="388" height="52" rx="5" fill="#f7f9fc" stroke="#c9d4e2" stroke-width="1"/><text x="82" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">切分</text><text x="82" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">固定＋重叠、结构边界、父子、句子窗口，按文档类型选</text><rect x="66" y="288" width="388" height="52" rx="5" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="82" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">向量化</text><text x="82" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">模型选型定天花板，换模型必须全量重建索引</text><rect x="66" y="354" width="388" height="52" rx="5" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="82" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">入库</text><text x="82" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">向量＋原文＋元数据：来源、版本、生效区间、权限标签</text><path d="M260,208 L260,218" stroke="#9aa3b2" stroke-width="1"/><polygon points="260,222 257.2,215.5 262.8,215.5" fill="#9aa3b2"/><path d="M260,274 L260,284" stroke="#9aa3b2" stroke-width="1"/><polygon points="260,288 257.2,281.5 262.8,281.5" fill="#9aa3b2"/><path d="M260,340 L260,350" stroke="#9aa3b2" stroke-width="1"/><polygon points="260,354 257.2,347.5 262.8,347.5" fill="#9aa3b2"/><text x="66" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#3d5a80">失败模式：该在库里的没进去</text><text x="66" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">表现是「知识库明明有，它说没有」。先查解析，再查切分，最后查模型。</text><text x="66" y="476" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#3d5a80">成本：一次投入，可异步重建</text><text x="66" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">文档更新按篇重建，换模型才全量。这两件事的时间尺度差一个量级。</text><rect x="488" y="106" width="424" height="404" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="488" y="106" width="424" height="34" rx="6" fill="#efeaf6"/><rect x="488" y="106" width="424" height="34" rx="6" fill="none" stroke="#cbc2df" stroke-width="1"/><text x="506" y="128" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#5b4b8a">在线查询：一次请求怎么走</text><text x="894" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="end" fill="#5b4b8a">Q10–Q14</text><rect x="506" y="156" width="388" height="44" rx="5" fill="#faf8fd" stroke="#d5cde6" stroke-width="1"/><text x="522" y="174" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">改写</text><text x="522" y="191" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">指代消解、扩展、HyDE、Step-back；问题短时收益最大</text><rect x="506" y="208" width="388" height="36" rx="5" fill="#faf8fd" stroke="#d5cde6" stroke-width="1"/><text x="522" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">向量化</text><text x="522" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">只算一次，毫秒级，从来不是瓶颈</text><rect x="506" y="252" width="388" height="52" rx="5" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="522" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">多路召回</text><text x="522" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">向量＋BM25＋多 Query，用 RRF 按名次融合</text><text x="522" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#8a93a6">候选 50–200 条，宁宽勿窄</text><rect x="506" y="312" width="388" height="44" rx="5" fill="#e9f2ed" stroke="#c2d8cd" stroke-width="1"/><text x="522" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">精排 Rerank</text><text x="522" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">cross-encoder 看问题和块的交互，几十条里留几条</text><rect x="506" y="364" width="388" height="44" rx="5" fill="#f7efe4" stroke="#dfcbb0" stroke-width="1"/><text x="522" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">拼装 Prompt</text><text x="522" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">顺序、预算、引用格式；当前问题放最后</text><rect x="506" y="416" width="388" height="44" rx="5" fill="#f7efe4" stroke="#dfcbb0" stroke-width="1"/><text x="522" y="434" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">生成＋来源</text><text x="522" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">每条结论带引用编号，没依据就拒答</text><path d="M700,200 L700,204" stroke="#9aa3b2" stroke-width="1"/><polygon points="700,208 697.2,201.5 702.8,201.5" fill="#9aa3b2"/><path d="M700,244 L700,248" stroke="#9aa3b2" stroke-width="1"/><polygon points="700,252 697.2,245.5 702.8,245.5" fill="#9aa3b2"/><path d="M700,304 L700,308" stroke="#9aa3b2" stroke-width="1"/><polygon points="700,312 697.2,305.5 702.8,305.5" fill="#9aa3b2"/><path d="M700,356 L700,360" stroke="#9aa3b2" stroke-width="1"/><polygon points="700,364 697.2,357.5 702.8,357.5" fill="#9aa3b2"/><path d="M700,408 L700,412" stroke="#9aa3b2" stroke-width="1"/><polygon points="700,416 697.2,409.5 702.8,409.5" fill="#9aa3b2"/><text x="506" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" text-anchor="start" fill="#5b4b8a">失败模式：该用的知识没用上</text><text x="506" y="496" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#5a6580">表现是「知识库有、也召回了，答案还是错」。查召回位置、上下文预算、引用核查。</text><rect x="48" y="534" width="864" height="52" rx="6" fill="#f8eae8" stroke="#e0c3c0" stroke-width="1"/><text x="66" y="555" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#9b4b52">排查顺序：先证明知识在库里，再证明它被召回，最后才怀疑模型</text><text x="66" y="572" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#6b5560">顺序反了就变成调 prompt 碰运气。多数线上问题是前两段造成的，模型只是最后一环的出口。</text></svg>
