<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="f1t f1d">
<title id="f1t">四个词，三个层级</title>
<desc id="f1d">训练是总称，包含预训练与后训练两个先后阶段；微调是正交的手段，唯一交集是 SFT。</desc>
<defs><marker id="f1arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="530" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">FOUR WORDS, THREE LAYERS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">四个词，三个层级：谁包含谁、谁在谁之后</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">预训练与后训练是先后两个阶段；微调不是第三个阶段，它是可以挂在任意阶段之后的「手段」</text><rect x="48" y="118" width="612" height="352" fill="#ffffff" rx="14" stroke="#c9ced6" stroke-width="1"/><text x="72" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.14em">TRAINING</text><text x="140" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">一切通过梯度更新参数的过程 —— 是总称，不是某个阶段</text><rect x="72" y="158" width="564" height="96" fill="#eceff2" rx="8"/><rect x="72" y="158" width="3" height="96" fill="#3d5a80" rx="1.5"/><text x="88" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600">预训练 Pre-training</text><text x="620" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" font-weight="500" text-anchor="end">≈90% 算力</text><text x="88" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">自监督 next-token · 网页 / 代码 / 书籍 / 论文 · 万亿级 token · 无人工标注</text><text x="88" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">产物 Base Model：只会「续写」，还不会「回答」</text><line x1="354" y1="254" x2="354" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f1arr)"/><rect x="72" y="282" width="564" height="166" fill="#eceff2" rx="8"/><rect x="72" y="282" width="3" height="166" fill="#bf4520" rx="1.5"/><text x="88" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600">后训练 Post-training</text><text x="620" y="308" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" text-anchor="end">≈8% 算力</text><text x="88" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">让模型从「会写文本」变成「听得懂、答得好、不越界」—— 对齐发生在这一步</text><rect x="88" y="344" width="128" height="40" fill="#f7e6e1" rx="6" stroke="#d99a83" stroke-width="1"/><text x="152" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">SFT 指令微调</text><text x="152" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" text-anchor="middle">＝ 微调</text><rect x="225" y="344" width="128" height="40" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="289" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">偏好优化</text><text x="289" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">RLHF / DPO</text><rect x="362" y="344" width="128" height="40" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="426" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">可验证奖励</text><text x="426" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">RLVR</text><rect x="499" y="344" width="128" height="40" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="563" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="600" text-anchor="middle">安全对齐</text><text x="563" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">拒答 · 价值观</text><text x="88" y="406" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">数据量小 2~3 个数量级，但数据配比与奖励设计才是真正的 know-how</text><text x="88" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">产物 Chat Model：你日常用的那个模型</text><rect x="696" y="118" width="216" height="352" fill="#f7e6e1" rx="14" stroke="#d99a83" stroke-width="1" stroke-dasharray="5 4"/><text x="716" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" letter-spacing="0.14em">ORTHOGONAL</text><text x="716" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">微调 Fine-tuning</text><text x="716" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">不是阶段，是「在已有权重上</text><text x="716" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">继续训练」的一类方法</text><rect x="716" y="222" width="176" height="32" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="730" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">全参微调 Full FT</text><rect x="716" y="264" width="176" height="32" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="730" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">LoRA / QLoRA</text><rect x="716" y="306" width="176" height="32" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="730" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">继续预训练 CPT</text><rect x="716" y="348" width="176" height="32" fill="#ffffff" rx="6" stroke="#c9ced6" stroke-width="1"/><text x="730" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">领域任务微调</text><text x="716" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">可挂在任意阶段之后；</text><text x="716" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="500">与流水线唯一的交集是 SFT。</text><text x="716" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">「继续预训练 CPT」虽在微调名下，</text><text x="716" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">性质上更接近预训练。</text><text x="48" y="502" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">包含：训练 ⊃ 预训练、后训练 · 时序：语料 → 预训练 → 后训练 → 部署 · 正交：微调是手段，可叠加在任一步之后</text>
</svg>
