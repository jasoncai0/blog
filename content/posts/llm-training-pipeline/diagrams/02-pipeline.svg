<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="f2t f2d">
<title id="f2t">端到端训练流水线</title>
<desc id="f2d">语料经预训练得到 Base Model，再经中期训练与后训练得到 Chat Model，最后用 LoRA 做业务微调；算力占比约 90/8/2。</desc>
<defs><marker id="f2arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="660" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">ONE PIPELINE, FIVE STATIONS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">端到端：每一站用什么数据、烧多少算力、产出什么</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">同一份权重被逐段改造：能力在预训练拿到，可用性在后训练拿到，专用性在微调拿到</text><rect x="48" y="126" width="600" height="64" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="126" width="3" height="64" fill="#8b93a7" rx="1.5"/><text x="68" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142" font-weight="600">无标注语料</text><text x="68" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">网页 · 代码 · 书籍 · 论文 · 多语 · 万亿级 token</text><text x="628" y="152" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8b93a7" font-weight="500" text-anchor="end">10T+ token</text><rect x="48" y="222" width="600" height="64" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="222" width="3" height="64" fill="#3d5a80" rx="1.5"/><text x="68" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142" font-weight="600">预训练 Pre-training</text><text x="68" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">自监督 next-token；世界知识与语言能力主要在这一步注入</text><text x="628" y="248" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" font-weight="500" text-anchor="end">≈90% 算力</text><rect x="48" y="318" width="600" height="64" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="318" width="3" height="64" fill="#8a8577" rx="1.5"/><text x="68" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142" font-weight="600">中期训练 Mid-training</text><text x="68" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">长上下文扩展 · 高质量数据退火（可选，但越来越常见）</text><text x="628" y="344" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a8577" font-weight="500" text-anchor="end">可选一站</text><rect x="48" y="414" width="600" height="64" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="414" width="3" height="64" fill="#bf4520" rx="1.5"/><text x="68" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142" font-weight="600">后训练 Post-training</text><text x="68" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">SFT → 偏好优化 → 可验证奖励 RL → 安全对齐</text><text x="628" y="440" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" text-anchor="end">≈8% 算力</text><rect x="48" y="510" width="600" height="64" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><rect x="48" y="510" width="3" height="64" fill="#d99a83" rx="1.5"/><text x="68" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#2d3142" font-weight="600">业务微调 Fine-tuning</text><text x="68" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">LoRA 适配具体任务 / 租户 / 输出格式</text><text x="628" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" text-anchor="end">&lt;2% 算力</text><line x1="348" y1="190" x2="348" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2arr)"/><line x1="348" y1="286" x2="348" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2arr)"/><line x1="348" y1="382" x2="348" y2="414" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2arr)"/><line x1="348" y1="478" x2="348" y2="510" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f2arr)"/><rect x="372" y="293" width="82.5" height="18" fill="#ffffff" rx="9" stroke="#d99a83" stroke-width="1"/><text x="413.25" y="305" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" text-anchor="middle">产物 Base Model</text><rect x="372" y="485" width="82.5" height="18" fill="#ffffff" rx="9" stroke="#d99a83" stroke-width="1"/><text x="413.25" y="497" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520" font-weight="500" text-anchor="middle">产物 Chat Model</text><text x="690" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">每一段之后，模型多了什么</text><line x1="452" y1="302" x2="690" y2="302" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><line x1="448" y1="494" x2="690" y2="494" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 4"/><rect x="690" y="274" width="222" height="58" fill="#ffffff" rx="7" stroke="#c9ced6" stroke-width="1"/><rect x="690" y="274" width="3" height="58" fill="#3d5a80" rx="1.5"/><text x="704" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8b93a7" font-weight="500" letter-spacing="0.08em">01  预训练后</text><text x="704" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">能力底座</text><text x="704" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">语言 · 知识 · 推理原料</text><rect x="690" y="466" width="222" height="58" fill="#ffffff" rx="7" stroke="#c9ced6" stroke-width="1"/><rect x="690" y="466" width="3" height="58" fill="#bf4520" rx="1.5"/><text x="704" y="482" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8b93a7" font-weight="500" letter-spacing="0.08em">02  后训练后</text><text x="704" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">可用性与对齐</text><text x="704" y="516" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">听懂指令 · 格式 · 偏好 · 安全</text><rect x="690" y="538" width="222" height="58" fill="#ffffff" rx="7" stroke="#c9ced6" stroke-width="1"/><rect x="690" y="538" width="3" height="58" fill="#d99a83" rx="1.5"/><text x="704" y="554" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8b93a7" font-weight="500" letter-spacing="0.08em">03  微调后</text><text x="704" y="572" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">专用性</text><text x="704" y="588" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">领域话术 · 工具调用 · 输出</text><text x="48" y="600" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" font-weight="500" letter-spacing="0.1em">算力占比</text><rect x="48" y="610" width="576.0" height="20" fill="#3d5a80"/><rect x="624.0" y="610" width="51.2" height="20" fill="#bf4520"/><rect x="675.2" y="610" width="12.8" height="20" fill="#d99a83"/><text x="60" y="625" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#ffffff" font-weight="600">预训练 ≈ 90%</text><rect x="720" y="613" width="8" height="8" fill="#3d5a80" rx="1"/><text x="734" y="621" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">预训练 ≈90%</text><rect x="802.96" y="613" width="8" height="8" fill="#bf4520" rx="1"/><text x="816.96" y="621" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">后训练 ≈8%</text><rect x="881.6800000000001" y="613" width="8" height="8" fill="#d99a83" rx="1"/><text x="895.6800000000001" y="621" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">微调 &lt;2%</text>
</svg>
