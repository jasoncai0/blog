<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="f3t f3d">
<title id="f3t">LoRA 的低秩旁路</title>
<desc id="f3d">冻结 W，并联 A(r×d) 与 B(d×r)，输出 h=Wx+(α/r)BAx；可训练参数降低约两个数量级。</desc>
<defs><marker id="f3arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="512" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">LORA = W + BA</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">LoRA 改的不是权重本身，是在旁边并联一条低秩通路</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">冻结原权重 W，只学 ΔW = BA；r 远小于 d，可训练参数从 100% 降到千分之几</text><text x="52" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142" font-weight="600">x</text><text x="52" y="258" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580">d</text><line x1="70" y1="240" x2="132" y2="240" stroke="#4f5d75" stroke-width="1.2"/><line x1="132" y1="148" x2="132" y2="240" stroke="#4f5d75" stroke-width="1.2"/><line x1="132" y1="148" x2="168" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><line x1="132" y1="240" x2="168" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><rect x="170" y="206" width="246" height="68" fill="#eceff2" rx="8" stroke="#c9ced6" stroke-width="1"/><text x="188" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#2d3142" font-weight="600">W</text><text x="210" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580">d × d</text><text x="188" y="252" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">冻结 · 不更新</text><text x="398" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8b93a7" text-anchor="end">原权重</text><rect x="170" y="112" width="100" height="58" fill="#ffffff" rx="8" stroke="#d99a83" stroke-width="1.4"/><text x="220" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520" font-weight="600" text-anchor="middle">A</text><text x="220" y="156" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">r × d</text><line x1="272" y1="141" x2="306" y2="141" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><rect x="308" y="112" width="108" height="58" fill="#ffffff" rx="8" stroke="#d99a83" stroke-width="1.4"/><text x="362" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#bf4520" font-weight="600" text-anchor="middle">B</text><text x="362" y="156" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#5a6580" text-anchor="middle">d × r</text><path d="M 416 141 L 464 141 L 464 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><path d="M 416 240 L 480 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><circle cx="464" cy="240" r="10" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/><text x="464" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12" fill="#4f5d75" font-weight="600" text-anchor="middle">+</text><path d="M 474 240 L 496 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f3arr)"/><text x="502" y="236" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.5" fill="#2d3142" font-weight="500">h = Wx + (α/r)·BAx</text><text x="170" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">r 通常取 8 / 16 / 32（≪ d，常见 4096），所以 BA 的参数量是 2·r·d 而不是 d²</text><text x="170" y="320" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">α/r 是缩放因子；训练完可以把 BA 加回 W，推理零额外延迟</text><text x="170" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">A 随机初始化、B 零初始化：训练开始时 ΔW = 0，不破坏原模型</text><rect x="612" y="112" width="300" height="372" fill="#ffffff" rx="10" stroke="#c9ced6" stroke-width="1"/><text x="632" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600">为什么显存差一个数量级</text><text x="632" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">以 7B 模型为例，可训练参数占</text><text x="632" y="192" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="500">全参微调</text><rect x="632" y="200" width="200" height="14" fill="#eef1f5" rx="3"/><rect x="632" y="200" width="200.0" height="14" fill="#bf4520" rx="3"/><text x="760" y="194" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" font-weight="500" text-anchor="end">56 GB</text><text x="632" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="500">LoRA r=16</text><rect x="632" y="256" width="200" height="14" fill="#eef1f5" rx="3"/><rect x="632" y="256" width="12.0" height="14" fill="#d99a83" rx="3"/><text x="760" y="250" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" font-weight="500" text-anchor="end">0.4 GB</text><text x="632" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="500">adapter 只有几十 MB：</text><text x="632" y="318" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">一个基座 + N 个 LoRA，按任务热插拔</text><line x1="632" y1="334" x2="892" y2="334" stroke="#c9ced6" stroke-width="1"/><text x="632" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520" font-weight="500">代价：容量有限。</text><text x="632" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">需要大幅改变表征、或注入大量新知识时，</text><text x="632" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">LoRA 的效果明显不如全参微调。</text><text x="632" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">r 越大越接近全参，显存也越接近全参；</text><text x="632" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">这是同一根滑杆，不是两个方案。</text>
</svg>
