<svg xmlns="http://www.w3.org/2000/svg" width="960" height="532" viewBox="0 0 960 532" role="img" aria-labelledby="f5t f5d">
<title id="f5t">成本与效果上限的分布</title>
<desc id="f5d">五种做法在成本-效果平面上的位置：从 prompt 到 PPO，成本逐级上升，效果上限也逐级上升。</desc>
<defs><marker id="f5arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="532" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">COST VS CEILING</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">成本与效果上限：五种做法的位置</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">横轴是总成本（标注 + 算力 + 调参），纵轴是这套做法能达到的效果上限；越靠左上越划算</text><line x1="150" y1="452" x2="900" y2="452" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5arr)"/><line x1="150" y1="452" x2="150" y2="140" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f5arr)"/><text x="525" y="478" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580" font-weight="500" text-anchor="middle">总成本（标注 + 算力 + 调参）</text><text x="112" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580" font-weight="500" transform="rotate(-90 112 296)" text-anchor="middle">效果上限</text><rect x="268" y="246" width="330" height="96" fill="#f7e6e1" rx="10" opacity="0.55"/><rect x="268" y="246" width="330" height="96" fill="none" rx="10" stroke="#d99a83" stroke-width="1" stroke-dasharray="5 4"/><text x="433" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="500" text-anchor="middle">多数业务的落地区间</text><circle cx="217.5" cy="383.36" r="6" fill="#8b93a7" stroke="#ffffff" stroke-width="2"/><text x="243.5" y="379.36" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">Prompt / few-shot</text><text x="243.5" y="395.36" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="start">不训练，先试这里</text><circle cx="315.0" cy="302.24" r="6" fill="#bf4520" stroke="#ffffff" stroke-width="2"/><text x="341.0" y="298.24" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">LoRA + SFT</text><text x="341.0" y="314.24" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="start">性价比最高的默认档</text><circle cx="494.99999999999994" cy="271.04" r="6" fill="#3d5a80" stroke="#ffffff" stroke-width="2"/><text x="521.0" y="267.04" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">全参 + SFT</text><text x="521.0" y="283.04" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="start">上限更高，吃显存</text><circle cx="630.0" cy="221.11999999999998" r="6" fill="#8a8577" stroke="#ffffff" stroke-width="2"/><text x="656.0" y="217.11999999999998" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">偏好优化 DPO</text><text x="656.0" y="233.11999999999998" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="start">会判断好坏，成本中上</text><circle cx="810.0000000000001" cy="174.32" r="6" fill="#bf4520" stroke="#ffffff" stroke-width="2"/><text x="784.0000000000001" y="170.32" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="end">RLHF / PPO</text><text x="784.0000000000001" y="186.32" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" text-anchor="end">天花板，也是最贵</text><rect x="470" y="356" width="430" height="82" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1" stroke-dasharray="4 4"/><text x="488" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520" font-weight="600">怎么读这张图</text><text x="488" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">先问「效果还差几个点」，再问愿不愿意为它付一个数量级的成本；</text><text x="488" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">多数场景停在 LoRA + SFT 这一档，再往上收益就变平了。</text><text x="48" y="512" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两轴都是定性的序关系，不代表具体数值；点位是经验判断，用来比较相对位置，不是 benchmark。</text>
</svg>
