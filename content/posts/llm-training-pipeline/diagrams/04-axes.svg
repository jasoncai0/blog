<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f4t f4d">
<title id="f4t">SFT/RLHF 与全参/LoRA 的正交矩阵</title>
<desc id="f4d">纵轴是数据范式（SFT 或偏好优化），横轴是参数更新方式（全参或 LoRA），四格分别对应不同成本与场景。</desc>
<defs><marker id="f4arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f5f5f5"/>
<text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500" letter-spacing="0.16em">TWO AXES, FOUR CELLS</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">SFT 与 RLHF 是纵轴，全参与 LoRA 是横轴：可以任意组合</text><text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">把三个词放进同一个坐标系才看得清：换数据范式回答「学什么信号」，换更新方式回答「动多少参数」</text><rect x="48" y="130" width="422" height="34" fill="#eceff2" rx="6"/><text x="259" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142" font-weight="600" text-anchor="middle">更新方式：全参 Full FT</text><rect x="486" y="130" width="426" height="34" fill="#f7e6e1" rx="6"/><text x="699" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#bf4520" font-weight="600" text-anchor="middle">更新方式：LoRA / QLoRA</text><rect x="48" y="184" width="864" height="28" fill="#f0f0ef" rx="4"/><rect x="48" y="184" width="3" height="28" fill="#3d5a80" rx="1.5"/><text x="64" y="202" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="500">数据范式 A：SFT 监督微调 —— 手上只有「好」的示范，目标是模仿</text><rect x="48" y="222" width="422" height="116" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><text x="66" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">效果上限最高，显存最贵</text><text x="66" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">7B 全参约需 8×80G；最容易灾难性遗忘</text><text x="66" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">适合有数据、有卡、要一次到位</text><text x="66" y="318" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" font-weight="500">大厂：基座 → Chat 的标准第一步</text><rect x="486" y="222" width="426" height="116" fill="#fffaf7" rx="8" stroke="#d99a83" stroke-width="1.4"/><text x="504" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" font-weight="600">★ 业务落地的默认答案</text><text x="504" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">单卡 24G 可跑 7B（QLoRA 更低）</text><text x="504" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">一个基座 + 多套 adapter 并存</text><text x="504" y="318" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" font-weight="500">覆盖绝大多数企业微调需求</text><rect x="48" y="358" width="864" height="28" fill="#f0f0ef" rx="4"/><rect x="48" y="358" width="3" height="28" fill="#bf4520" rx="1.5"/><text x="64" y="376" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142" font-weight="500">数据范式 B：偏好优化 RLHF / DPO —— 说不清标准答案，但能判断「哪个更好」</text><rect x="48" y="396" width="422" height="116" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><text x="66" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">标准对齐流水线</text><text x="66" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">PPO 要让 policy / reward / value 同时驻留</text><text x="66" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">显存与稳定性成本都最高</text><text x="66" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#3d5a80" font-weight="500">通用 Chat 模型的对齐阶段</text><rect x="486" y="396" width="426" height="116" fill="#ffffff" rx="8" stroke="#c9ced6" stroke-width="1"/><text x="504" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600">资源受限时的对齐方案</text><text x="504" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">QLoRA + DPO，单卡也能做偏好对齐</text><text x="504" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">比 PPO 稳，不需要单独训 reward model</text><text x="504" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" font-weight="500">小团队 / 快速实验</text><text x="48" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两轴独立：换纵轴不改显存，换横轴不改损失函数。所以「用 LoRA 做 SFT」和「全参做 RLHF」都能说通。</text>
</svg>
