<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">媒体工具的五段流水线</title>
  <desc id="fig1-desc">装配、提交、等待、取回、落地五个阶段，以及托管工具、进程内 provider、插件网关三种执行位置。</desc>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f5f5f5"/>

  <text x="40" y="36" font-size="8" letter-spacing="1.4" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DESIGN AGENT / MEDIA TOOL</text>
  <text x="40" y="64" font-size="16" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">媒体工具的五段流水线</text>
  <text x="40" y="86" font-size="10.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">模型只看见第 1 步和第 5 步；提交、等待、取回都在工具内部完成。</text>

  <!-- stage 1 -->
  <rect x="30" y="118" width="168" height="128" rx="8" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="46" y="140" font-size="8" fill="#3d5a80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 / ASSEMBLE</text>
  <text x="46" y="163" font-size="12" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">装配</text>
  <text x="46" y="185" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">prompt、比例、时长</text>
  <text x="46" y="202" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">按能力裁剪参数</text>
  <text x="46" y="230" font-size="8" fill="#3d5a80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{prompt, 9:16, 5s}</text>

  <line x1="200" y1="182" x2="211" y2="182" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- stage 2 -->
  <rect x="214" y="118" width="168" height="128" rx="8" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
  <text x="230" y="140" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 / SUBMIT</text>
  <text x="230" y="163" font-size="12" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">提交</text>
  <text x="230" y="185" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">建 job，拿 id</text>
  <text x="230" y="202" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">幂等键防重复</text>
  <text x="230" y="230" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /videos → 202</text>

  <line x1="384" y1="182" x2="395" y2="182" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- stage 3 -->
  <rect x="398" y="118" width="168" height="128" rx="8" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
  <text x="414" y="140" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 / WAIT</text>
  <text x="414" y="163" font-size="12" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">等待</text>
  <text x="414" y="185" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">5–10 秒轮询一次</text>
  <text x="414" y="202" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">硬截止 900 秒</text>
  <text x="414" y="230" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /videos/{id}</text>

  <line x1="568" y1="182" x2="579" y2="182" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- stage 4 -->
  <rect x="582" y="118" width="168" height="128" rx="8" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
  <text x="598" y="140" font-size="8" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 / FETCH</text>
  <text x="598" y="163" font-size="12" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">取回</text>
  <text x="598" y="185" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">下载并校验</text>
  <text x="598" y="202" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">mime、大小、时长</text>
  <text x="598" y="230" font-size="8" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">200 MB · 180 s</text>

  <line x1="752" y1="182" x2="763" y2="182" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- stage 5 -->
  <rect x="766" y="118" width="168" height="128" rx="8" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
  <text x="782" y="140" font-size="8" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05 / LAND</text>
  <text x="782" y="163" font-size="12" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">落地</text>
  <text x="782" y="185" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">写资产或画布</text>
  <text x="782" y="202" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">只把引用交回去</text>
  <text x="782" y="230" font-size="8" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">asset://vid_123</text>

  <line x1="30" y1="292" x2="930" y2="292" stroke="#c9ced8" stroke-width="1"/>

  <text x="30" y="320" font-size="11.5" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">三种执行位置</text>
  <text x="160" y="320" font-size="9.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">谁跑第 2–4 步，决定了密钥在谁手里、产物落在哪</text>

  <!-- row 1 -->
  <rect x="30" y="336" width="900" height="46" rx="4" fill="#ffffff" stroke="#dfe3ea" stroke-width="1"/>
  <rect x="30" y="336" width="4" height="46" rx="2" fill="#3d5a80"/>
  <text x="48" y="356" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">托管工具</text>
  <text x="48" y="371" font-size="8" fill="#3d5a80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OpenAI Responses</text>
  <text x="260" y="363" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">厂商侧跑完提交、等待、取回；应用只收到一个 image_generation_call</text>

  <!-- row 2 -->
  <rect x="30" y="390" width="900" height="46" rx="4" fill="#ffffff" stroke="#dfe3ea" stroke-width="1"/>
  <rect x="30" y="390" width="4" height="46" rx="2" fill="#5b4b8a"/>
  <text x="48" y="410" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">进程内 provider</text>
  <text x="48" y="425" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Hermes</text>
  <text x="260" y="417" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">工具进程提交、轮询、下载；产物写本地 cache 或对象存储</text>

  <!-- row 3 -->
  <rect x="30" y="444" width="900" height="46" rx="4" fill="#ffffff" stroke="#dfe3ea" stroke-width="1"/>
  <rect x="30" y="444" width="4" height="46" rx="2" fill="#a8752a"/>
  <text x="48" y="464" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">插件 / 网关</text>
  <text x="48" y="479" font-size="8" fill="#a8752a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Dify · MCP</text>
  <text x="260" y="471" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">平台或 MCP server 执行；宿主收到 URL、blob 或 artifact id</text>
</svg>
