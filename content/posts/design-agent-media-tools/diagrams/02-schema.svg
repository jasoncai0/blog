<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">工具 schema 是算出来的</title>
  <desc id="fig2-desc">基础 schema、provider 能力与模型目录三路输入，经装配后得到只包含当前模型可用参数的运行时 schema。</desc>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
    </marker>
    <marker id="a2d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a8752a"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#f5f5f5"/>

  <text x="40" y="36" font-size="8" letter-spacing="1.4" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SCHEMA / CAPABILITY NEGOTIATION</text>
  <text x="40" y="64" font-size="16" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">工具 schema 是算出来的</text>
  <text x="40" y="86" font-size="10.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">同一份代码要接十几个模型；模型不支持的能力，不该出现在工具参数里。</text>

  <!-- sources -->
  <rect x="30" y="104" width="220" height="68" rx="6" fill="#ffffff" stroke="#3d5a80" stroke-width="1.1"/>
  <text x="44" y="126" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">基础 schema</text>
  <text x="44" y="145" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">name / description</text>
  <text x="44" y="160" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">prompt: required</text>

  <rect x="30" y="200" width="220" height="68" rx="6" fill="#ffffff" stroke="#3d5a80" stroke-width="1.1"/>
  <text x="44" y="222" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">provider.capabilities()</text>
  <text x="44" y="241" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">modalities / max duration</text>
  <text x="44" y="256" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">supports_reference_images</text>

  <rect x="30" y="296" width="220" height="68" rx="6" fill="#ffffff" stroke="#a8752a" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="44" y="318" font-size="10" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">模型 catalog</text>
  <text x="44" y="337" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">durations / ratios</text>
  <text x="44" y="352" font-size="8.5" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolutions / audio</text>

  <!-- arrows -->
  <line x1="250" y1="138" x2="305" y2="228" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#a2)"/>
  <line x1="250" y1="234" x2="305" y2="245" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#a2)"/>
  <line x1="250" y1="330" x2="305" y2="278" stroke="#a8752a" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a2d)"/>

  <!-- builder -->
  <rect x="310" y="196" width="170" height="110" rx="8" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2"/>
  <text x="395" y="222" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">schema 装配</text>
  <text x="395" y="244" font-size="8.5" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">intersect</text>
  <text x="395" y="260" font-size="8.5" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tighten enums</text>
  <text x="395" y="276" font-size="8.5" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">clamp ranges</text>

  <line x1="480" y1="251" x2="535" y2="251" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a2)"/>

  <!-- output -->
  <rect x="540" y="90" width="390" height="350" rx="8" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
  <text x="558" y="120" font-size="11" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">运行时 schema</text>
  <text x="672" y="120" font-size="8" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">video_generate</text>

  <line x1="558" y1="136" x2="912" y2="136" stroke="#c9b8dd" stroke-width="1"/>

  <text x="558" y="162" font-size="8.5" fill="#3d5a80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">prompt</text>
  <text x="700" y="162" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">必填，唯一的 required</text>

  <text x="558" y="200" font-size="8.5" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">duration</text>
  <text x="700" y="200" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">1–10 秒，按模型收紧</text>

  <text x="558" y="238" font-size="8.5" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">aspect_ratio</text>
  <text x="700" y="238" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">16:9 · 9:16 · 1:1</text>

  <text x="558" y="276" font-size="8.5" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolution</text>
  <text x="700" y="276" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">480p · 720p</text>

  <text x="558" y="314" font-size="8.5" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">image_url</text>
  <text x="700" y="314" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">仅 image-to-video 时出现</text>

  <text x="558" y="352" font-size="8.5" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">reference_image_urls</text>
  <text x="700" y="352" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">支持参考图才出现，≤ 3 张</text>

  <text x="558" y="390" font-size="8.5" fill="#2f6f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">audio · seed</text>
  <text x="700" y="390" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">模型支持才出现</text>

  <text x="558" y="421" font-size="8.5" fill="#9b4b52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">model — 不在 schema 内</text>

  <text x="40" y="470" font-size="9.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">没出现的参数仍然接受：老会话回放时不能因为多一个字段就 400。</text>
  <text x="40" y="490" font-size="9.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">模型由产品配置决定（video_gen.model），不作为工具参数交给 agent。</text>
</svg>
