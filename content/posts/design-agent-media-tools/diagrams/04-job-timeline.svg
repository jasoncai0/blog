<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="fig4-title fig4-desc">
  <title id="fig4-title">长任务工具的提交、轮询与下载时序</title>
  <desc id="fig4-desc">agent 调用工具后，工具提交任务、按间隔轮询、在终态后下载并校验，最后只把资产引用交回 agent。</desc>
  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
    </marker>
    <marker id="a4d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b4b8a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f5f5f5"/>

  <text x="40" y="36" font-size="8" letter-spacing="1.4" fill="#5b4b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LONG RUNNING / SUBMIT · POLL · FETCH</text>
  <text x="40" y="64" font-size="16" font-weight="600" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">一次调用背后的任务流水线</text>
  <text x="40" y="86" font-size="10.5" fill="#4f5d75" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">模型侧看到的是同步函数；工具内部负责提交、轮询、下载和校验。</text>

  <!-- participants -->
  <rect x="40" y="96" width="150" height="40" rx="6" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.1"/>
  <text x="115" y="114" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">Agent / 模型</text>
  <text x="115" y="128" font-size="8" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">caller</text>

  <rect x="255" y="96" width="150" height="40" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.1"/>
  <text x="330" y="114" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">工具 handler</text>
  <text x="330" y="128" font-size="8" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sync function</text>

  <rect x="505" y="96" width="150" height="40" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.1"/>
  <text x="580" y="114" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">Provider API</text>
  <text x="580" y="128" font-size="8" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">async job</text>

  <rect x="755" y="96" width="150" height="40" rx="6" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.1"/>
  <text x="830" y="114" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">资产存储</text>
  <text x="830" y="128" font-size="8" fill="#4f5d75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cache / object store</text>

  <!-- lifelines -->
  <line x1="115" y1="114" x2="115" y2="528" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="330" y1="114" x2="330" y2="528" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="580" y1="114" x2="580" y2="528" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="830" y1="114" x2="830" y2="528" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 1 -->
  <line x1="115" y1="176" x2="251" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="185" y="169" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">video_generate(prompt, 9:16, 5s)</text>

  <!-- 2 -->
  <line x1="330" y1="214" x2="501" y2="214" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="417" y="207" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /videos + idempotency-key</text>

  <!-- 3 -->
  <line x1="580" y1="252" x2="334" y2="252" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a4d)"/>
  <text x="455" y="245" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">202 {id, status: queued}</text>

  <!-- loop frame -->
  <rect x="265" y="280" width="560" height="100" rx="4" fill="#f7efe4" stroke="#a8752a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="277" y="298" font-size="8.5" fill="#a8752a" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">每 5–10 秒轮询，900 秒硬截止</text>

  <line x1="330" y1="332" x2="501" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="417" y="325" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /videos/{id}</text>

  <line x1="580" y1="362" x2="334" y2="362" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a4d)"/>
  <text x="455" y="355" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status: running</text>

  <!-- 5 -->
  <line x1="580" y1="410" x2="334" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="455" y="403" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">completed { url }</text>

  <!-- 6 -->
  <line x1="330" y1="448" x2="826" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="578" y="441" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">下载 → 校验 mime、大小、时长</text>

  <!-- 7 -->
  <line x1="830" y1="484" x2="334" y2="484" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a4d)"/>
  <text x="580" y="477" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bytes / object key</text>

  <!-- 8 -->
  <line x1="330" y1="524" x2="119" y2="524" stroke="#5b4b8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a4d)"/>
  <text x="224" y="517" font-size="8.5" fill="#2d3142" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">video: asset://…, duration, cost</text>

  <!-- alt -->
  <rect x="40" y="540" width="880" height="62" rx="6" fill="#f8eae8" stroke="#9b4b52" stroke-width="1.1"/>
  <text x="58" y="563" font-size="10" font-weight="600" fill="#9b4b52" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">另一条路径</text>
  <text x="58" y="583" font-size="9.5" fill="#2d3142" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">超时 → error_type=timeout · URL 过期 → 重新取 · 用户中断 → 远端任务继续，工具停止等待</text>
</svg>
