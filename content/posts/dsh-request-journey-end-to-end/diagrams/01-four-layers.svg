<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">四层，四次转换</title>
<desc id="f01-desc">浏览器采集、网关路由、会话控制器管窗口、loop 记账；每次转换只改变一种表示。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">REQUEST JOURNEY / LAYERS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">每一层只做一种转换</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两个圆点是持久化点；其余状态都在内存里，进程结束就没了。</text>
<defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><rect x="40" y="110" width="196" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">浏览器</text><text x="52" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">输入框、粘贴、命令</text><text x="52" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">contentBlocks</text><line x1="239" y1="152" x2="269" y2="152" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="269" y1="178" x2="239" y2="178" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="272" y="110" width="196" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="284" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">网关 / 会话控制</text><text x="284" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">WebSocket 多路复用</text><text x="284" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">session/query</text><line x1="471" y1="152" x2="501" y2="152" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="501" y1="178" x2="471" y2="178" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="504" y="110" width="196" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="516" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">agent loop</text><text x="516" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">收件箱、组装、记账</text><text x="516" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">turn / step</text><line x1="703" y1="152" x2="733" y2="152" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="733" y1="178" x2="703" y2="178" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="736" y="110" width="196" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="748" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">提供方适配器</text><text x="748" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">SSE 或等价流</text><text x="748" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">StreamChunk</text><text x="254" y="143" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#bf4520">RPC</text><text x="254" y="194" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#4f5d75">events</text><text x="486" y="143" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#bf4520">send</text><text x="486" y="194" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#4f5d75">frames</text><text x="718" y="143" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#bf4520">stream</text><text x="718" y="194" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" fill="#4f5d75">chunks</text><circle cx="540" cy="240" r="4.5" fill="#bf4520"/><text x="554" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">agent/inbox/spliced + inserted</text><text x="554" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">输入在模型看到之前就是事实</text><circle cx="540" cy="288" r="4.5" fill="#bf4520"/><text x="554" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">assistant/message</text><text x="554" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">结算才写，内嵌紧凑 stream 与 usage</text><line x1="40" y1="338" x2="920" y2="338" stroke="#d8d8d8"/><text x="40" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">BOUNDARIES</text><text x="40" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">浏览器</text><text x="40" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">不知道日志形状</text><text x="262" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">网关</text><text x="262" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">不知道消息语义</text><text x="484" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">会话控制</text><text x="484" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">不知道请求内容</text><text x="706" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">loop</text><text x="706" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">不知道传输方式</text><text x="40" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">分层的收益是每层可替换；代价是任何一次故障都要跨四层日志才能定位。</text><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / LAYERS</text>
</svg>
