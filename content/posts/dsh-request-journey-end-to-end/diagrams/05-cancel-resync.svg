<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="f05-title f05-desc">
<title id="f05-title">取消是一条链，重连是两条流</title>
<desc id="f05-desc">取消要把原因带到底，重连要先分清持久与瞬时。</desc>
<rect width="960" height="510" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">REQUEST JOURNEY / CANCEL</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">打断与接回</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">上半是取消，下半是重连；两者都绕不开「已提交」与「未提交」的分界。</text>
<defs><marker id="f05-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f05-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><rect x="40" y="96" width="880" height="170" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="116" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">CANCEL · 一次打断走到哪</text><rect x="56" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="65" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">UI 取消</text><text x="65" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">按钮 / Esc</text><line x1="178" y1="157" x2="192" y2="157" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="196" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="205" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">控制器</text><text x="205" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">cancel(cause)</text><line x1="318" y1="157" x2="332" y2="157" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="336" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="345" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">Agent</text><text x="345" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">abort(controller)</text><line x1="458" y1="157" x2="472" y2="157" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="476" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="485" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">三处消费者</text><text x="485" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">stream / tools / approval</text><line x1="598" y1="157" x2="612" y2="157" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="616" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="625" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">结算</text><text x="625" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">assistant/attempt</text><line x1="738" y1="157" x2="752" y2="157" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="756" y="130" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="765" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">关门</text><text x="765" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">turn/end aborted</text><text x="56" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">cause 是同一个对象：user / parent / hook{reason} / disposed；它同时出现在日志的 turn/end 里。</text><text x="56" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">keepInbox 决定队列清不清；清空不写 discarded，因为 turn 本身已经以 aborted 结束。</text><text x="56" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">打断之后到达的 send() 会被改成 next-turn，不会再被已经 abort 的轮次吞掉。</text><rect x="40" y="286" width="880" height="170" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="316" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">RESYNC · 断线之后补什么</text><rect x="56" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="65" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">重连</text><text x="65" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">带 baseSeq</text><line x1="178" y1="357" x2="192" y2="357" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="196" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="205" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">补持久</text><text x="205" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">session.event 重放</text><line x1="318" y1="357" x2="332" y2="357" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f05-a)"/><rect x="336" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="345" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">投影不动</text><text x="345" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">只补窗口</text><line x1="458" y1="357" x2="472" y2="357" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f05-g)"/><rect x="476" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="485" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">瞬时清空</text><text x="485" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">rebaseline</text><line x1="598" y1="357" x2="612" y2="357" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f05-g)"/><rect x="616" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="625" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">未结算丢弃</text><text x="625" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">assistant 半句</text><line x1="738" y1="357" x2="752" y2="357" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f05-g)"/><rect x="756" y="330" width="120" height="54" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="765" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" font-weight="600" fill="#2d3142">再订阅</text><text x="765" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">从当前 baseSeq</text><text x="56" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">窗口重建与投影流是两条独立的读路径：重放事件只补窗口，不动已经建立的投影。</text><text x="56" y="416" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">没有结算的 assistant 内容不会从日志里长回来，屏幕上的半句话只能重发。</text><text x="56" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">判断一条状态该不该在重连后存在，只需要问：它有没有对应的持久事件。</text><text x="40" y="492" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">05 / CANCEL</text>
</svg>
