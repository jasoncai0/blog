<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">一条输入从按键走到 idle</title>
<desc id="f02-desc">六条泳道按时间从上到下；实线是调用，虚线是返回。右侧标出落库点。</desc>
<rect width="960" height="790" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">REQUEST JOURNEY / SEQUENCE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一次请求，二十步</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">压缩、审批、工具调用都省略，只看主干。</text>
<defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><rect x="38" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="100" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">UI 浏览器</text><line x1="100" y1="122" x2="100" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="193" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="255" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">传输 / 网关</text><line x1="255" y1="122" x2="255" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="348" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="410" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">会话控制</text><line x1="410" y1="122" x2="410" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="503" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="565" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">AGENT LOOP</text><line x1="565" y1="122" x2="565" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="658" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="720" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">LLM 适配器</text><line x1="720" y1="122" x2="720" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="813" y="92" width="124" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="875" y="111" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">日志</text><line x1="875" y1="122" x2="875" y2="720" stroke="#d8d8d8" stroke-dasharray="3 4"/><circle cx="70" cy="146" r="2.6" fill="#4f5d75"/><text x="80" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">输入 → contentBlocks</text><line x1="106" y1="178" x2="249" y2="178" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="177" y="172" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">session/query</text><line x1="261" y1="206" x2="404" y2="206" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="332" y="200" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">按 sessionId 路由</text><line x1="416" y1="234" x2="559" y2="234" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="487" y="228" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">followup(msg)</text><line x1="404" y1="262" x2="106" y2="262" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="255" y="256" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">回执 { messageId }</text><line x1="571" y1="290" x2="869" y2="290" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="284" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">inbox/spliced + inserted</text><circle cx="905" cy="288" r="3" fill="#bf4520"/><line x1="571" y1="318" x2="869" y2="318" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="312" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">turn/start</text><circle cx="905" cy="316" r="3" fill="#bf4520"/><text x="575" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">claim → resolve → assemble</text><line x1="571" y1="374" x2="869" y2="374" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="368" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">step/start、system/user/message</text><circle cx="905" cy="372" r="3" fill="#bf4520"/><line x1="571" y1="402" x2="869" y2="402" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="396" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">request/header、request/context</text><circle cx="905" cy="400" r="3" fill="#bf4520"/><line x1="571" y1="430" x2="714" y2="430" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="642" y="424" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">llm.stream(request)</text><line x1="714" y1="458" x2="571" y2="458" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="642" y="452" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">text-delta*</text><line x1="559" y1="486" x2="261" y2="486" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="410" y="480" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">assistant-stream（瞬时）</text><line x1="249" y1="514" x2="106" y2="514" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="177" y="508" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">渲染增量</text><line x1="714" y1="542" x2="571" y2="542" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="642" y="536" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">finish + usage</text><line x1="571" y1="570" x2="869" y2="570" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="564" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">assistant/message</text><circle cx="905" cy="568" r="3" fill="#bf4520"/><line x1="559" y1="598" x2="261" y2="598" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="410" y="592" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">session.event</text><line x1="249" y1="626" x2="106" y2="626" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="177" y="620" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">换成持久消息</text><line x1="571" y1="654" x2="869" y2="654" stroke="#bf4520" stroke-width="1.1" marker-end="url(#f02-a)"/><text x="720" y="648" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#2d3142">step/end + turn/end</text><circle cx="905" cy="652" r="3" fill="#bf4520"/><line x1="404" y1="682" x2="106" y2="682" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f02-g)"/><text x="255" y="676" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">status idle</text><text x="40" y="742" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">红点是持久事件；瞬时帧与回执不落库。回执到达时 turn 可能还没开始。</text><text x="40" y="772" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / SEQUENCE</text>
</svg>
