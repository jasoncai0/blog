<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">同一个回答的两条通道</title>
<desc id="f03-desc">帧先走瞬时通道上屏，结算后走持久通道替换；重连只补后者。</desc>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">REQUEST JOURNEY / FRAMES</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一个 delta，两条路</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">左边是提供方，中间是 loop 的 attempt，右边分成瞬时与持久两束。</text>
<defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">PROVIDER CHUNKS</text><rect x="40" y="128" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">block-start</text><rect x="40" y="158" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="174" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">text-delta</text><rect x="40" y="188" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">tool-call-delta</text><rect x="40" y="218" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="234" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">block-end</text><rect x="40" y="248" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="264" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">usage</text><rect x="40" y="278" width="140" height="24" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="52" y="294" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#4f5d75">finish</text><text x="40" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#5a6580">六种；只有 finish 带结局</text><rect x="228" y="140" width="180" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="240" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Loop · attempt</text><text x="240" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">live.push(frame)</text><text x="240" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">attemptId / revision</text><line x1="184" y1="260" x2="224" y2="240" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="452" y="120" width="468" height="180" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="468" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">TRANSIENT · 上屏用</text><rect x="468" y="152" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="478" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">agent/assistant-stream</text><text x="478" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">start / chunk* / end</text><line x1="606" y1="186" x2="626" y2="186" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="628" y="152" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="638" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">网关多路复用</text><text x="638" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">按会话地址路由</text><line x1="766" y1="186" x2="786" y2="186" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><rect x="788" y="152" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="798" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">client.acceptFrame</text><text x="798" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">append 到事件源</text><line x1="410" y1="196" x2="448" y2="196" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f03-g)"/><text x="452" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">不落库；断线即丢</text><text x="468" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#5a6580">render: text + reasoning + tool 参数增量</text><rect x="452" y="330" width="468" height="160" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="468" y="350" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">DURABLE · 记账用</text><rect x="468" y="362" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="478" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">assistant/message</text><text x="478" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">内嵌紧凑 stream + usage</text><line x1="606" y1="396" x2="626" y2="396" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="628" y="362" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="638" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">session.event</text><text x="638" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">一个完整 SessionEvent</text><line x1="766" y1="396" x2="786" y2="396" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="788" y="362" width="136" height="66" rx="4" fill="#fafafa" stroke="#d8d8d8"/><text x="798" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" font-weight="600" fill="#2d3142">client.settle</text><text x="798" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">替换瞬时内容</text><line x1="320" y1="238" x2="448" y2="352" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><text x="468" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">结算只发生一次；重连按 baseSeq 重放这一段</text><line x1="40" y1="516" x2="920" y2="516" stroke="#d8d8d8"/><text x="40" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">重连时：持久事件补齐，瞬时帧触发 rebaseline，客户端把没结算的 attempt 丢掉。</text><text x="40" y="562" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">所以屏幕上的半句话在结算前不存在于任何日志里，也不会在重连后被“恢复”。</text><text x="40" y="582" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / FRAMES</text>
</svg>
