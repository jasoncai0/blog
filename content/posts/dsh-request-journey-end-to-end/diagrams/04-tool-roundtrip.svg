<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">一次工具调用的往返</title>
<desc id="f04-desc">工具结果不是返回值，是一条要先落库、再进下一次请求的事件。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">REQUEST JOURNEY / TOOLS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">模型提议，流水线裁决</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">上排去程，下排回程；括号里是写这条记录的人。</text>
<defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><rect x="40" y="118" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="51" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">assistant/message</text><text x="51" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">tool-call 块（loop）</text><line x1="206" y1="149" x2="220" y2="149" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="224" y="118" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="235" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">tool/call</text><text x="235" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">执行前落库（loop）</text><line x1="390" y1="149" x2="404" y2="149" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="408" y="118" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="419" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">pending 卡片</text><text x="419" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">presentCall（UI）</text><line x1="574" y1="149" x2="588" y2="149" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="592" y="118" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="603" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">pre-execute</text><text x="603" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">allow/deny/ask（策略）</text><line x1="758" y1="149" x2="772" y2="149" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="776" y="118" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="787" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">execute</text><text x="787" y="158" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">真正副作用（工具）</text><rect x="40" y="300" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="51" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">normalize</text><text x="51" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">异常→isError（流水线）</text><line x1="204" y1="331" x2="190" y2="331" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="224" y="300" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="235" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">post-execute</text><text x="235" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">改写/阻断（策略）</text><line x1="388" y1="331" x2="374" y2="331" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="408" y="300" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="419" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">tool/result</text><text x="419" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">唯一可见结果（loop）</text><line x1="572" y1="331" x2="558" y2="331" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="592" y="300" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="603" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">completed 卡片</text><text x="603" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">presentResult（UI）</text><line x1="756" y1="331" x2="742" y2="331" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="776" y="300" width="164" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="787" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" font-weight="600" fill="#2d3142">下一次请求</text><text x="787" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">同 step 新 attempt（loop）</text><path d="M 884 180 L 884 250 L 122 250 L 122 296" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f04-a)"/><rect x="330" y="234" width="348" height="16" fill="#f5f5f5"/><text x="504" y="246" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">结果按模型给出的顺序回填；乱序完成也要等前面的 commit</text><path d="M 40 331 L 24 331 L 24 149 L 36 149" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f04-g)"/><line x1="40" y1="404" x2="920" y2="404" stroke="#d8d8d8"/><text x="40" y="426" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">WHO OWNS WHAT</text><text x="40" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">tool/call：loop 写；执行前</text><text x="40" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">tool/result：loop 写；规范化之后</text><text x="480" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">卡片：UI 只读事件</text><text x="480" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">审批：流水线在 body 之前</text><text x="40" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#5a6580">虚线：同一步的下一次 attempt 会重新发请求，错误结果随历史一起进入。</text><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / TOOLS</text>
</svg>
