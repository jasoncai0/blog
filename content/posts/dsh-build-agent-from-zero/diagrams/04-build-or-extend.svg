<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f04-d04-title f04-d04-desc">
  <title id="f04-d04-title">自建还是扩展的判定树</title>
  <desc id="f04-d04-desc">三个问题依次判断：需求是否落在现有扩展点、是否只改数据形状、是否有非改不可的约束。三条「是」分别通向写插件、扩展日志与投影、自建循环；三条「否」继续下探，最后回到缩小需求。</desc>
  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".12em" fill="#bf4520">BUILD OR EXTEND</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="16" fill="#2d3142">先问三个问题，再决定写不写循环</text>
  <text x="40" y="82" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="9" fill="#4f5d75">自建的价值在理解，不在替代。多数需求停在第一或第二个问题。</text>

  <!-- root -->
  <rect x="330" y="100" width="300" height="52" fill="#ffffff" stroke="#d8d8d8" rx="6"/>
  <text x="480" y="122" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#2d3142">你的需求</text>
  <text x="480" y="140" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9c">先写下它，一行就够</text>

  <!-- Q1 -->
  <rect x="290" y="188" width="380" height="62" fill="#ffffff" stroke="#d8d8d8" rx="6"/>
  <text x="308" y="210" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">Q1</text>
  <text x="308" y="228" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10" fill="#2d3142">是否落在现有扩展点上？</text>
  <text x="308" y="243" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">provider · tool · session event · command · skill · hook</text>

  <!-- outcome A -->
  <rect x="700" y="184" width="220" height="70" fill="#ffffff" stroke="#9fb8a8" rx="6"/>
  <text x="716" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".1em" fill="#3f6b52">EXTEND</text>
  <text x="716" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10.5" fill="#2d3142">写一个插件</text>
  <text x="716" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">半天到两天；注册即 effect</text>

  <!-- Q2 -->
  <rect x="290" y="298" width="380" height="62" fill="#ffffff" stroke="#d8d8d8" rx="6"/>
  <text x="308" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">Q2</text>
  <text x="308" y="338" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10" fill="#2d3142">是否只改数据形状，不改循环？</text>
  <text x="308" y="353" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">新事件、新投影、新工具协议、新压缩策略</text>

  <!-- outcome B -->
  <rect x="700" y="294" width="220" height="70" fill="#ffffff" stroke="#d8c48e" rx="6"/>
  <text x="716" y="314" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".1em" fill="#8a6a1f">EXTEND DEEPER</text>
  <text x="716" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10.5" fill="#2d3142">扩展日志与投影</text>
  <text x="716" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">几天；要写迁移与兼容测试</text>

  <!-- Q3 -->
  <rect x="290" y="408" width="380" height="62" fill="#ffffff" stroke="#d8d8d8" rx="6"/>
  <text x="308" y="430" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">Q3</text>
  <text x="308" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10" fill="#2d3142">是否有非改循环不可的约束？</text>
  <text x="308" y="463" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">私有模型路由 · 合规审计 · 特殊沙箱 · 领域验证器</text>

  <!-- outcome C -->
  <rect x="700" y="398" width="220" height="86" fill="#fff8f4" stroke="#e0a48d" rx="6"/>
  <text x="716" y="418" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".1em" fill="#bf4520">BUILD</text>
  <text x="716" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10.5" fill="#2d3142">自建循环</text>
  <text x="716" y="454" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75">几周起步，长期维护</text>
  <text x="716" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a4b2a">按 L0→L6 逐级验收</text>

  <!-- outcome D -->
  <rect x="330" y="512" width="300" height="52" fill="#ffffff" stroke="#d8d8d8" rx="6"/>
  <text x="480" y="534" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10" fill="#2d3142">回到 Q1：先缩小需求</text>
  <text x="480" y="552" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#8a8f9c">多数「非改不可」在缩小范围后不再是约束</text>

  <!-- arrows -->
  <g stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#f04-a4)">
    <path d="M480 152 L480 184"/>
    <path d="M670 219 L696 219"/>
    <path d="M480 250 L480 294"/>
    <path d="M670 329 L696 329"/>
    <path d="M480 360 L480 404"/>
    <path d="M670 439 L696 439"/>
    <path d="M480 470 L480 508"/>
  </g>
  <defs>
    <marker id="f04-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">
    <text x="678" y="214">是</text>
    <text x="488" y="276">否</text>
    <text x="678" y="324">是</text>
    <text x="488" y="386">否</text>
    <text x="678" y="434">是</text>
    <text x="488" y="494">否</text>
  </g>

  <text x="40" y="592" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".1em" fill="#8a8f9c">04 / DECISION TREE</text>
</svg>
