  <rect x="438" y="252" width="300" height="54" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="0.8" opacity="0.96"/>
  <line x1="438" y1="256" x2="438" y2="302" stroke="#bf4520" stroke-width="2" opacity="0.55"/>
  <text x="447" y="265" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">schemas() · orderTools(toolOrder)</text>
  <text x="447" y="276.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">只投影 name / description / parameters</text>
  <text x="447" y="288.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">timeoutMs、并发标记永不外发</text>
  <line x1="372" y1="336" x2="228" y2="336" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#f01-a)"/>
  <text x="234" y="329" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">tools[] + sections</text>
  <text x="234" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">返回装配结果</text>
  <line x1="228" y1="386" x2="804" y2="386" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="234" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">request/header</text>
  <rect x="240" y="394" width="296" height="50" rx="3" fill="#ffffff" stroke="#7a5aa8" stroke-width="0.8" opacity="0.96"/>
  <line x1="240" y1="398" x2="240" y2="440" stroke="#7a5aa8" stroke-width="2" opacity="0.55"/>
  <text x="249" y="407" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">reason: initial | resume | change</text>
  <text x="249" y="418.5" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">名字集合变了 → developer/message</text>
  <text x="249" y="430.0" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#7a5aa8">{ type: "tool-addition" }</text>
  <line x1="228" y1="490" x2="516" y2="490" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="234" y="483" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">stream(system · tools · messages)</text>
  <rect x="524" y="502" width="212" height="46" rx="3" fill="#ffffff" stroke="#3b6ea5" stroke-width="0.8" opacity="0.96"/>
  <line x1="524" y1="506" x2="524" y2="544" stroke="#3b6ea5" stroke-width="2" opacity="0.55"/>
  <text x="533" y="515" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">读声明，决定调什么</text>
  <text x="533" y="526.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">一次响应可含多个 call</text>
  <line x1="516" y1="578" x2="228" y2="578" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#f01-a)"/>
  <text x="234" y="571" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">assistant/message · tool-call ×N</text>
  <line x1="228" y1="622" x2="804" y2="622" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="234" y="615" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">assistant/message</text>
  <line x1="228" y1="684" x2="660" y2="684" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="234" y="677" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">tools.execute(calls)</text>
  <text x="234" y="696" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">selectExecutor → executeToolBatch</text>
  <rect x="664" y="660" width="176" height="64" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="0.8" opacity="0.96"/>
  <line x1="664" y1="664" x2="664" y2="720" stroke="#bf4520" stroke-width="2" opacity="0.55"/>
  <text x="673" y="673" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">resolve → batch</text>
  <text x="673" y="684.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">exclusive 屏障</text>
  <text x="673" y="696.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">并行池 ≤ maxParallel</text>
  <rect x="664" y="734" width="176" height="64" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="0.8" opacity="0.96"/>
  <line x1="664" y1="738" x2="664" y2="794" stroke="#bf4520" stroke-width="2" opacity="0.55"/>
  <text x="673" y="747" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">prepare → dispatch</text>
  <text x="673" y="758.5" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">→ complete → finish</text>
  <text x="673" y="770.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">四段共用一条流水线</text>
  <line x1="660" y1="826" x2="804" y2="826" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="666" y="819" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">tool/call</text>
  <text x="666" y="838" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">dispatch 前登记</text>
  <line x1="660" y1="872" x2="228" y2="872" stroke="#8a93a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#f01-a)"/>
  <text x="234" y="865" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">ToolBatchResult</text>
  <line x1="660" y1="904" x2="804" y2="904" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="666" y="897" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">tool/result</text>
  <text x="666" y="916" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">按模型顺序提交</text>
