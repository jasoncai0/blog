  <line x1="804" y1="136" x2="804" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <line x1="84" y1="196" x2="228" y2="196" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="90" y="189" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">send("把失败重试讲清楚")</text>
  <text x="90" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6">turn/start</text>
  <line x1="228" y1="250" x2="372" y2="250" stroke="#2d3142" stroke-width="1" marker-end="url(#f01-k)"/>
  <text x="234" y="243" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">assemble(provider)</text>
