<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="f01-t f01-d">
  <title id="f01-t">一次工具调用，六段握手</title>
  <desc id="f01-d">工具链时序：用户消息进入 loop，pre-step 计算工具集并组装系统提示，request header 记录声明，模型返回 tool-call，批调度分配并发，四段流水线执行，结果写入 tool/result 并回流到下一步。</desc>
  <defs>
    <marker id="f01-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
    <marker id="f01-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f01-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f01-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/></marker>
    <marker id="f01-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5aa8"/></marker>
  </defs>
  <rect width="960" height="940" fill="#f5f5f5"/>
  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">SEQ 01 / TOOL</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">一次工具调用，六段握手</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">声明在请求头里，执行在流水线里，结果回到会话里；模型只看见前三步的产物</text>
  <text x="84" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">USER</text>
  <line x1="84" y1="136" x2="84" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="228" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">AGENT LOOP</text>
  <text x="228" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6" text-anchor="middle">preStep · step</text>
  <line x1="228" y1="136" x2="228" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="372" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">SYSTEM-PROMPT</text>
  <text x="372" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6" text-anchor="middle">assemble</text>
  <line x1="372" y1="136" x2="372" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="516" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">MODEL</text>
  <line x1="516" y1="136" x2="516" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <text x="660" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">TOOLS</text>
  <text x="660" y="123" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#8a93a6" text-anchor="middle">batch · pipeline</text>
  <line x1="660" y1="136" x2="660" y2="916" stroke="#8a93a6" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
