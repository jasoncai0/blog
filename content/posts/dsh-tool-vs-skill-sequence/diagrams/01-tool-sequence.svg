  <text transform="translate(44,513.0) rotate(-90)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#2d3142">STEP n</text>
  <path d="M 71,178 h -5 v 274 h 5" fill="none" stroke="#8a93a6" stroke-width="1"/>
  <text transform="translate(64,315.0) rotate(-90)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">PRE-STEP</text>
  <path d="M 71,470 h -5 v 170 h 5" fill="none" stroke="#8a93a6" stroke-width="1"/>
  <text transform="translate(64,555.0) rotate(-90)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">REQUEST</text>
  <path d="M 71,660 h -5 v 256 h 5" fill="none" stroke="#8a93a6" stroke-width="1"/>
  <text transform="translate(64,788.0) rotate(-90)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#8a93a6">EXECUTE</text>
  <text x="70" y="934" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">下一步：还有调用则 step++ 重新组装（tools 不变就命中缓存），没有则 turn 结束</text>
</svg>
