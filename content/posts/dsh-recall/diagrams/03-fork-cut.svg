  <text x="710" y="332" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">inheritedEventCount = 10</text>
  <text x="710" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">子会话的下一个 seq 是 13</text>

  <rect x="40" y="360" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">为什么按事件序号切</text>
  <text x="56" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">seq 2 是一条 assistant 消息，里面两个</text>
  <text x="56" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">tool_call；结果分别在 seq 3、4。</text>
  <text x="56" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">按「消息条数」切，只能切在这条消息</text>
  <text x="56" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">前后，切不进调用与结果之间。</text>
  <text x="56" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">事件序号是唯一能表达半开的坐标。</text>
  <text x="56" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">boundary 落在开放 turn 里也合法。</text>

  <rect x="335" y="360" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="351" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">cut 之后补三样</text>
  <text x="351" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">缺的工具结果：按「没开始」与「结果未知」</text>
  <text x="351" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">两种文案合成，告诉模型别盲目重试。</text>
  <text x="351" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">未闭合的 step/end；</text>
  <text x="351" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">cause 为 forked 的 turn/end。</text>
  <text x="351" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2f6f5e">三条都是确定性合成，不调模型。</text>
  <text x="351" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">已闭合的括号原样保留。</text>

  <rect x="630" y="360" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="646" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">继承，但不共享</text>
  <text x="646" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">seed 深克隆，子会话改自己的副本。</text>
  <text x="646" y="420" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">isSeeded = true，inheritedEventCount</text>
  <text x="646" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">精确等于复制的前缀长度。</text>
  <text x="646" y="458" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">不设 parentSession，cwd 继承，</text>
  <text x="646" y="474" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">delegationDepth 不带。</text>
  <text x="646" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6">继承前缀里的旧括号属于已死生命周期。</text>

  <text x="40" y="542" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">fork 与 resume 的区别：resume 是给同一个会话补上崩溃时缺的收尾，然后继续；fork 是承认旧线到此为止，在新会话里重开。</text>
  <text x="40" y="558" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">一个是修复，一个是分叉。两者都写入新事件，都不修改已落盘的历史。</text>

  <text x="40" y="590" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">packages/core/session/src/fork.ts:21 buildForkSeed · index.ts:1403 fork · repair.ts:53 openTurnClosers</text>
</svg>
