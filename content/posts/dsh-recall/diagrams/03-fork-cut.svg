  <line x1="707" y1="108" x2="707" y2="330" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="715" y="112" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">boundary = 9（含）</text>
