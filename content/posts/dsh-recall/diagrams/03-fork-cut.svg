<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f03-d3-title f03-d3-desc">
  <title id="f03-d3-title">fork 的切点语义：复制到 boundary 的事件前缀，再补一条 end-seed 与合成收尾</title>
  <desc id="f03-d3-desc">源会话日志按事件序号排列，boundary 取在一条带工具调用的 assistant 消息之后。fork 复制 0 到 boundary 的事件，追加 inherited 的 end-seed，再补上缺失的工具结果与 forked 原因的 turn/end。新会话自己的事件从下一个序号开始。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <defs>
    <marker id="f03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f03-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DSH-RECALL / FORK CUT</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#2d3142">切点是一个事件序号，不是一条消息</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">fork 只做三件事：复制前缀、标出继承边界、把开放尾部合上。它不重跑、不询问、不改写源会话。</text>

  <text x="40" y="112" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">SOURCE LOG · APPEND-ONLY</text>

