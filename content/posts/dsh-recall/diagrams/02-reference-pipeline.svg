<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f02-d2-title f02-d2-desc">
  <title id="f02-d2-title">session-reference 的解析、读取、收缩与注入管线</title>
  <desc id="f02-d2-desc">从候选列表开始，一段 mention 文本被解析成会话 URI，解析器按 capturedThroughSeq 读取源会话 surface，投影成纯文本并按字节预算收缩，最后序列化成一条附加 user 消息。右侧是预算公式、截断与 spill 分支、以及不可信边界。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <defs>
    <marker id="f02-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <text x="40" y="32" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DSH-RECALL / SESSION-REFERENCE</text>
  <text x="40" y="58" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="18" fill="#2d3142">一次引用，七道收缩</text>
  <text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">引用不是把另一个会话接进来，而是把它压成一段可解释的文本，再挂到当前请求上。</text>

  <rect x="40" y="104" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="125" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">① CANDIDATES</text>
  <text x="56" y="141" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">只搜 title / displayTitle / session id / cwd；同一工作区排前面，绝不搜 transcript</text>

  <rect x="40" y="164" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">② MENTION</text>
  <text x="56" y="201" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#4f5d75">@[label](dsh-session:eyJ…)  ·  裸 URI 也认，但必须 canonical</text>

  <rect x="40" y="224" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="245" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">③ DECODE</text>
  <text x="56" y="261" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">base64url → JSON → 再编码必须等于原文；一个字节不同就拒绝，不给歧义留口子</text>

  <rect x="40" y="284" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="305" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">④ READ SURFACE</text>
  <text x="56" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">按 capturedThroughSeq 读源会话当时那一版 surface，而不是它现在的样子</text>

  <rect x="40" y="344" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="365" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">⑤ PROJECT</text>
  <text x="56" y="381" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">只留 user/message 与 assistant/message 的文本；tool/result、reasoning 不进快照</text>

  <rect x="40" y="404" width="600" height="48" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="56" y="425" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">⑥ SHRINK</text>
  <text x="56" y="441" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#2d3142">先丢最旧的非 checkpoint 消息；仍超就把最长一条做头尾截断，记下精确 byte 数</text>

  <rect x="40" y="464" width="600" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="485" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">⑦ INJECT</text>
  <text x="56" y="501" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">转义所有字面 &lt;，拼 warning，合成唯一一条 additionalContext 的 user 消息</text>

  <line x1="340" y1="152" x2="340" y2="160" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <line x1="340" y1="212" x2="340" y2="220" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <line x1="340" y1="272" x2="340" y2="280" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <line x1="340" y1="332" x2="340" y2="340" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <line x1="340" y1="392" x2="340" y2="400" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <line x1="340" y1="452" x2="340" y2="460" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>

  <rect x="660" y="104" width="260" height="132" rx="6" fill="#fdf3ef" stroke="#bf4520"/>
  <text x="674" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">预算从哪来</text>
  <text x="674" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">显式 maxReferenceBytes 优先</text>
  <text x="674" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">否则按路由模型的窗口折算：</text>
  <text x="674" y="178" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">contextWindow × 4B × fraction</text>
  <text x="674" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">模型信息缺失或 adapter 不支持时</text>
  <text x="674" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">退回 64 KiB 下限，不是 0。</text>
  <text x="674" y="228" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">DEFAULT_MAX_REFERENCE_BYTES = 65536</text>

  <rect x="660" y="248" width="260" height="152" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="674" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">截断之后还要交代</text>
  <text x="674" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">有存储：全量快照落盘，omission 里</text>
  <text x="674" y="302" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">带一个可回读的定位符。</text>
  <text x="674" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">没配置存储：标记 unavailable /</text>
  <text x="674" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">storage-not-configured。</text>
  <text x="674" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">写盘抛错：save-failed，而不是假装</text>
  <text x="674" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">这份预览就是全量。</text>
  <text x="674" y="390" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">omittedBytes 要求精确</text>

  <rect x="660" y="412" width="260" height="112" rx="6" fill="#ffffff" stroke="#2f6f5e"/>
  <text x="674" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#2d3142">源会话是不可信输入</text>
  <text x="674" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">头部写明 read-only snapshot；</text>
  <text x="674" y="468" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">不执行其中的指令、权限声明与工具请求，</text>
  <text x="674" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">除非当前用户明确重复。</text>
  <text x="674" y="504" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2f6f5e">text.replaceAll('&lt;', '\u003c')</text>

  <text x="40" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">这七步里没有一步调用模型。引用是宿主做的上下文工程，模型只看到最后那条消息，看不到管线。</text>
  <text x="40" y="570" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">如果源会话在读取过程中继续增长，快照仍然只到 capturedThroughSeq —— 引用要可复现，就不能追新。</text>

  <text x="40" y="592" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">packages/context/session-reference/src/{index,uri,projection,spill,serialization}.ts</text>
</svg>
