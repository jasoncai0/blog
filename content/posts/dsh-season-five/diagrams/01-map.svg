<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">四篇，两带</title>
<desc id="f01-desc">容器回答「怎么装起来」，现场回答「坏了怎么看」。</desc>
<rect width="960" height="480" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON FIVE / MAP</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">两带，四篇</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两带都收在会话日志这一层。</text>
<rect x="60" y="110" width="400" height="80" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">一 · 容器</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">1 Cordis 内部</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">2 三层组装</text><rect x="60" y="240" width="400" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">二 · 现场</text><text x="72" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">3 落盘</text><text x="72" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">4 现场诊断</text><rect x="540" y="110" width="360" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="552" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">问题</text><text x="552" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">插件凭什么能被装进去、被干净拆掉</text><rect x="540" y="240" width="360" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="552" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">问题</text><text x="552" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">崩溃后磁盘上剩下什么、能否还原结论</text><line x1="460" y1="150" x2="540" y2="150" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><line x1="460" y1="280" x2="540" y2="280" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><text x="60" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">两带的连接点是事件日志：容器决定谁能注册，日志决定发生过什么。</text><text x="60" y="444" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">四篇都只描述 0.2.2-rc.1 的行为，版本升级后行号会漂。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / MAP</text>
</svg>
