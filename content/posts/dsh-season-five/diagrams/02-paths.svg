<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">两条路径</title>
<desc id="f02-desc">做插件从容器读起，排故障从现场读起。</desc>
<rect width="960" height="420" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SEASON FIVE / PATHS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">先选一条与当前问题最近的</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">两条路径可以独立走完。</text>
<text x="60" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">做插件</text><text x="60" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">想知道怎么挂钩子、换实现</text><rect x="330" y="114" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="342" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">Cordis 内部</text><line x1="504" y1="133" x2="522" y2="133" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="526" y="114" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="538" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">三层组装</text><line x1="700" y1="133" x2="718" y2="133" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="722" y="114" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="734" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">写插件（三季）</text><text x="60" y="244" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">排故障</text><text x="60" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">想知道为什么没回复、消息去哪了</text><rect x="330" y="224" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="342" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">现场诊断</text><line x1="504" y1="243" x2="522" y2="243" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="526" y="224" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="538" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">落盘</text><line x1="700" y1="243" x2="718" y2="243" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f02-a)"/><rect x="722" y="224" width="170" height="38" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="734" y="248" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.2" fill="#2d3142">会话即日志（一季）</text><text x="60" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">交点是会话日志：容器决定谁能注册，日志决定发生过什么。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="402" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / PATHS</text>
</svg>
