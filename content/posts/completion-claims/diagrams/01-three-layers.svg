<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#f5f5f5"/>
  <defs>
    <marker id="d1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <text x="48" y="52" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2.4" fill="#8a8f9c">THREE LAYERS OF "DONE"</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">完成有三层，签字的人各不相同</text>
  <text x="48" y="113" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#5a6580">越往下，越不依赖模型自己的判断；也越贵、越慢</text>

  <!-- L0 -->
  <rect x="48" y="146" width="864" height="118" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="66" y="172" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2" fill="#8a8f9c">L0 · CLAIM</text>
  <text x="66" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">模型说：我不再需要工具了</text>
  <text x="66" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">一次回答里没有任何 tool call，循环就认为这一轮结束了。</text>
  <text x="66" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">这是唯一一个"零成本"的完成信号，也是唯一一个不需要证据的。</text>
  <text x="812" y="186" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#bf4520" text-anchor="end">SIGNED BY: MODEL</text>
  <text x="812" y="204" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c" text-anchor="end">COST: 0</text>

  <line x1="480" y1="264" x2="480" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1a)"/>

  <!-- L1 -->
  <rect x="48" y="296" width="864" height="118" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="66" y="322" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2" fill="#8a8f9c">L1 · STRUCTURE</text>
  <text x="66" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">harness 说：这一轮到此为止</text>
  <text x="66" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">步数用尽、输出超长、预算耗尽、被中断——结构自己能把一轮结束掉。</text>
  <text x="66" y="392" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">它说的是"停"，不是"对"。停下来的那一轮，可以什么都没做完。</text>
  <text x="812" y="336" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#bf4520" text-anchor="end">SIGNED BY: RUNTIME</text>
  <text x="812" y="354" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c" text-anchor="end">COST: 0</text>

  <line x1="480" y1="414" x2="480" y2="442" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1a)"/>

  <!-- L2 -->
  <rect x="48" y="446" width="864" height="118" rx="6" fill="#faf0ec" stroke="#bf4520" stroke-width="1.4"/>
  <text x="66" y="472" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2" fill="#bf4520">L2 · EVIDENCE</text>
  <text x="66" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="600" fill="#2d3142">第三方说：它真的成了 / 还没成</text>
  <text x="66" y="522" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">跑测试、读日志、另一个模型审一遍、一个 hook 把结束挡回去。</text>
  <text x="66" y="542" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">这一层需要外部世界配合，所以它慢、贵，而且常常被跳过。</text>
  <text x="812" y="486" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#bf4520" text-anchor="end">SIGNED BY: WORLD</text>
  <text x="812" y="504" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#bf4520" text-anchor="end">COST: SECONDARY</text>

  <text x="48" y="596" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">所有 agent 都有 L0 和 L1。差别只在于：有没有 L2，以及 L2 能不能否定 L0。</text>
</svg>
