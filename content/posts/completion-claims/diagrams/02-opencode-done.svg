<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f5f5f5"/>
  <defs>
    <marker id="d2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
    <marker id="d2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <text x="48" y="52" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2.4" fill="#8a8f9c">OPENCODE · HOW A TURN ENDS</text>
  <text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="600" fill="#2d3142">"停手"就是"做完"，中间没有检查站</text>
  <text x="48" y="113" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#5a6580">Completed 的判据只有一条：这一轮模型没有再要工具</text>

  <!-- main path -->
  <rect x="48" y="150" width="180" height="86" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="64" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">流结束</text>
  <text x="64" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">模型只回了文本</text>
  <text x="64" y="216" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c">needsContinuation=false</text>

  <line x1="228" y1="193" x2="268" y2="193" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2a)"/>

  <rect x="272" y="150" width="180" height="86" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="288" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">Outcome.Completed</text>
  <text x="288" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">Step 层的判定</text>
  <text x="288" y="216" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c">step.ts:299</text>

  <line x1="452" y1="193" x2="492" y2="193" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2a)"/>

  <rect x="496" y="150" width="180" height="86" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="512" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">drain 收工</text>
  <text x="512" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">没有待投递、非 force</text>
  <text x="512" y="216" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c">llm.ts:175</text>

  <line x1="676" y1="193" x2="716" y2="193" stroke="#4f5d75" stroke-width="1" marker-end="url(#d2a)"/>

  <rect x="720" y="150" width="192" height="86" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="736" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2d3142">会话空闲</text>
  <text x="736" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">释放认领，触发 idle 钩子</text>
  <text x="736" y="216" font-family="'Geist Mono','SF Mono',monospace" font-size="9" fill="#8a8f9c">插件可以在这里把它留住</text>

  <!-- no checkpoint marker -->
  <text x="48" y="272" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#bf4520">这四步里没有任何一步去看"改动对不对"：没有编译、没有测试、没有 diff 复核。</text>

  <!-- branch: steps exhausted -->
  <rect x="48" y="310" width="864" height="150" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="66" y="338" font-family="'Geist Mono','SF Mono',monospace" font-size="9" letter-spacing="2" fill="#bf4520">THE ONE ENFORCED REPORT</text>
  <text x="66" y="364" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="#2d3142">步数用尽时，harness 反过来逼模型写"没做完什么"</text>
  <text x="66" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">llm.ts:269 追加一条 system 提示并置 toolChoice=none；step.ts:99 之后任何工具调用都直接报错：</text>
  <text x="66" y="414" font-family="'Geist Mono','SF Mono',monospace" font-size="10" fill="#2d3142">"Tools are disabled after the maximum agent steps"</text>
  <text x="66" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" fill="#5a6580">提示词里点名要三样：已完成的、<tspan fill="#bf4520">尚未完成的清单</tspan>、下一步建议。</text>

  <text x="48" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5a6580">也就是说：唯一被强制写下来的"完成报告"，是"没完成"的那份。</text>
  <text x="48" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#bf4520">正常的收工没有任何报告要求——模型说完了，就是完了。</text>
</svg>
