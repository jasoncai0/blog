<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">五层，各自能拒绝</title>
<desc id="f03-desc">每层都假设其余四层可能失守；只有工具层每次调用都经过。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SAFETY / LAYERS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">边界不是一个开关</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">从上到下，越靠下越难观测。</text>
<rect x="60" y="110" width="840" height="56" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="78" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">输入</text><text x="78" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">文件引用、命令解析、附件类型</text><text x="520" y="134" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">失守</text><text x="520" y="152" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">间接注入：网页里的指令被当意图</text><rect x="60" y="174" width="840" height="56" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="78" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">模型</text><text x="78" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">路由到不同能力/成本的模型</text><text x="520" y="198" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">失守</text><text x="520" y="216" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">越狱：模型主动请求危险工具</text><rect x="60" y="238" width="840" height="56" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="78" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">工具</text><text x="78" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">schema、when、审批、guard</text><text x="520" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">失守</text><text x="520" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">参数合法但语义危险</text><rect x="60" y="302" width="840" height="56" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="78" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">沙箱</text><text x="78" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">文件/网络/进程隔离</text><text x="520" y="326" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">失守</text><text x="520" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">配置过宽，或工具绕开沙箱</text><rect x="60" y="366" width="840" height="56" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="78" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">凭据</text><text x="78" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">最小权限、按需注入、脱敏</text><text x="520" y="390" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" fill="#bf4520">失守</text><text x="520" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">子代理或 MCP 继承了不该有的钥匙</text><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / LAYERS</text>
</svg>
