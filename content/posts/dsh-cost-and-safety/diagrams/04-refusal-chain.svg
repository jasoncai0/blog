<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">拒绝链的顺序</title>
<desc id="f04-desc">审批在 guards 之前：先确认这次调用被允许，再检查它是否违反不变量。</desc>
<rect width="960" height="350" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SAFETY / REFUSAL</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">五次拒绝机会</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">任何一次拒绝，调用都不会到达工具本体。</text>
<rect x="50" y="150" width="150" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="60" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">模型提议</text><text x="60" y="196" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tool_call</text><line x1="202" y1="183" x2="228" y2="183" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="230" y="150" width="150" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="240" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">pre-execute</text><text x="240" y="196" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">allow / deny / ask</text><line x1="382" y1="183" x2="408" y2="183" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="410" y="150" width="150" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="420" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">审批</text><text x="420" y="196" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">allowed-once</text><line x1="562" y1="183" x2="588" y2="183" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="590" y="150" width="150" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="600" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">guards</text><text x="600" y="196" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">第一个理由</text><line x1="742" y1="183" x2="768" y2="183" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f04-a)"/><rect x="770" y="150" width="150" height="66" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="780" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">execute</text><text x="780" y="196" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">工具本体</text><line x1="275" y1="216" x2="275" y2="278" stroke="#bf4520" stroke-width="1.2"/><circle cx="275" cy="281" r="2.6" fill="#bf4520"/><text x="285" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520">deny / 无审批通道 = 拒绝</text><line x1="455" y1="216" x2="455" y2="278" stroke="#bf4520" stroke-width="1.2"/><circle cx="455" cy="281" r="2.6" fill="#bf4520"/><text x="560" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520">guards：第一个拒绝理由即终止</text><rect x="230" y="286" width="470" height="44" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="246" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#2d3142">被拒的调用仍会写 tool/result（isError），模型能看到原因并改方案。</text><text x="246" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">审批被取消时合成「aborted before dispatch」，不会留下半执行的副作用。</text><text x="40" y="332" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / REFUSAL</text>
</svg>
