<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">压缩的盈亏平衡</title>
<desc id="f02-desc">压缩当次多付一次全量重算与摘要；之后每轮少付被删掉的那段。</desc>
<rect width="960" height="450" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">COST / COMPACTION</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">剩多少轮才回本</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">横轴是压缩后的剩余轮数。</text>
<line x1="90" y1="360" x2="880" y2="360" stroke="#d8d8d8"/><line x1="90" y1="130" x2="90" y2="360" stroke="#d8d8d8"/><text x="90" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">0</text><text x="450" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">剩余轮数</text><text x="96" y="124" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">累计成本 ↑</text><line x1="100" y1="360" x2="820" y2="150" stroke="#4f5d75" stroke-width="1.6"/><text x="730" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">不压缩</text><polyline points="100,360 260,313 260,250 820,180" fill="none" stroke="#bf4520" stroke-width="1.8"/><text x="268" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#bf4520">压缩当次</text><circle cx="642" cy="202" r="4" fill="#bf4520"/><text x="654" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">平衡点</text><text x="90" y="408" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">压缩后剩余轮数少于平衡点时，这次压缩是净亏；阈值 0.8、保留 0.16、余量 65536 决定曲线的起点。</text><text x="40" y="432" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / BREAK-EVEN</text>
</svg>
