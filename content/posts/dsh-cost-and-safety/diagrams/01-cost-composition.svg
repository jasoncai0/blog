<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">四个计数互斥</title>
<desc id="f01-desc">缓存读是折扣，缓存写是溢价，输出单价最高；把它们相加才是账单。</desc>
<rect width="960" height="330" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">COST / COMPOSITION</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一次请求的账单</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">比例是示意，不是报价单。</text>
<rect x="60" y="120" width="300" height="46" fill="#4f5d75" opacity="0.85"/><text x="68" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#ffffff">cacheReadTokens</text><text x="60" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">命中前缀的输入</text><text x="60" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">折扣 0.1–0.25×</text><rect x="360" y="120" width="120" height="46" fill="#2d3142" opacity="0.85"/><text x="368" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#ffffff">inputTokens</text><text x="360" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">未命中输入</text><text x="360" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">全价</text><rect x="480" y="120" width="150" height="46" fill="#bf4520" opacity="0.85"/><text x="488" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#ffffff">cacheWriteTokens</text><text x="480" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">写入缓存</text><text x="480" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">1.25× 左右</text><rect x="630" y="120" width="90" height="46" fill="#bf4520" opacity="0.85"/><text x="638" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#ffffff">outputTokens</text><text x="630" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#2d3142">生成</text><text x="630" y="202" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">单价最高</text><line x1="60" y1="236" x2="900" y2="236" stroke="#d8d8d8"/><text x="60" y="258" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">billed input = inputTokens + cacheReadTokens + cacheWriteTokens</text><text x="60" y="276" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">把 cacheRead 当 input 的子集会算成两倍；这是最常见的读表错误。</text><text x="40" y="312" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / COMPOSITION</text>
</svg>
