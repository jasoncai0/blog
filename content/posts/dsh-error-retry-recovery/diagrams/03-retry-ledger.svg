<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f03-d03-title f03-d03-desc">
  <title id="f03-d03-title">重试的落账时序</title>
  <desc id="f03-d03-desc">时序图：循环向提供方发起请求并收到失败，交给重试插件；插件先向会话日志写 llm/retry，再做可取消等待，等待成功后写 llm/retry-started 并返回 retry，循环才发起下一次请求；若等待期间被取消则不写 retry-started。</desc>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".14em" fill="#bf4520">RETRY LEDGER / 08</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="17" fill="#2d3142">先落账，再等待，最后才重试</text>

  <!-- lifelines -->
  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142" text-anchor="middle">
    <rect x="40" y="92" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="115" y="111">Agent Loop</text>
    <rect x="250" y="92" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="325" y="111">llm-retry</text>
    <rect x="460" y="92" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="535" y="111">Session log</text>
    <rect x="670" y="92" width="150" height="30" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="745" y="111">Provider</text>
    <rect x="850" y="92" width="70" height="30" rx="4" fill="#fbf1ec" stroke="#bf4520"/><text x="885" y="111" fill="#bf4520">Abort</text>
  </g>
  <g stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 4">
    <path d="M115 122 V 556"/>
    <path d="M325 122 V 556"/>
    <path d="M535 122 V 556"/>
    <path d="M745 122 V 556"/>
    <path d="M885 122 V 556"/>
  </g>

  <!-- messages -->
  <g stroke="#2d3142" stroke-width="1.1" fill="none" marker-end="url(#f03-a4)">
    <path d="M115 160 H 741"/>
    <path d="M745 196 H 119"/>
    <path d="M115 232 H 321"/>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">
    <text x="140" y="154">① stream(request)</text>
    <text x="560" y="190">② failure（code / status / Retry-After）</text>
    <text x="140" y="226">③ agent/request-error waterfall</text>
  </g>

  <!-- append retry -->
  <g stroke="#bf4520" stroke-width="1.1" fill="none" marker-end="url(#f03-a5)">
    <path d="M325 274 H 531"/>
  </g>
  <text x="340" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#bf4520">④ append('llm/retry', { retry, delayMs, failure })</text>

  <!-- wait self arrow -->
  <path d="M325 300 H 400 V 336 H 329" stroke="#8a5a44" stroke-width="1.1" fill="none" marker-end="url(#f03-a6)"/>
  <text x="412" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#8a5a44">⑤ cancellableDelay(delay, fusedSignal)</text>

  <!-- abort dashed -->
  <path d="M885 360 H 329" stroke="#bf4520" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#f03-a5)"/>
  <text x="600" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#bf4520">abort：等待返回 false，不写 retry-started</text>

  <!-- append started -->
  <g stroke="#5b8a5e" stroke-width="1.1" fill="none" marker-end="url(#f03-a7)">
    <path d="M325 400 H 531"/>
    <path d="M325 448 H 119"/>
    <path d="M115 496 H 741"/>
  </g>
  <text x="340" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#3f6b42">⑥ append('llm/retry-started', { retryId, retry })</text>
  <text x="150" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#3f6b42">⑦ return { kind: 'retry' }</text>
  <text x="150" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">⑧ 下一次尝试（同一步，不重新准入用户消息）</text>

  <!-- notes -->
  <rect x="40" y="516" width="880" height="62" rx="5" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".12em" fill="#bf4520">CRASH POINTS</text>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.3" fill="#2d3142">
    <text x="56" y="556">崩在 ④ 后：日志知道「第 N 次、计划等 D 毫秒」，恢复不会从零计。</text>
    <text x="480" y="556">崩在 ⑥ 后：重试已开始，恢复不会把同一次重试算两遍。</text>
  </g>

  <defs>
    <marker id="f03-a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2d3142"/></marker>
    <marker id="f03-a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
    <marker id="f03-a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a44"/></marker>
    <marker id="f03-a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b8a5e"/></marker>
  </defs>
</svg>
