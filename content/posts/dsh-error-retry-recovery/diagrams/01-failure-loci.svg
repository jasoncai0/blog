<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="f01-d01-title f01-d01-desc">
  <title id="f01-d01-title">四类失败位置与各自的处理者</title>
  <desc id="f01-d01-desc">一条水平的请求流水线依次经过请求前、请求中、流式中、工具中四个阶段；每个阶段下方标注典型失败、处理者与恢复语义。</desc>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing=".14em" fill="#bf4520">FAILURE LOCI / 08</text>
  <text x="40" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="17" fill="#2d3142">同一句 try/catch 包不住四种失败</text>

  <!-- pipeline -->
  <g>
    <rect x="40" y="96" width="200" height="56" rx="5" fill="#ffffff" stroke="#2d3142"/>
    <rect x="266" y="96" width="200" height="56" rx="5" fill="#ffffff" stroke="#2d3142"/>
    <rect x="492" y="96" width="200" height="56" rx="5" fill="#ffffff" stroke="#2d3142"/>
    <rect x="718" y="96" width="200" height="56" rx="5" fill="#ffffff" stroke="#2d3142"/>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#2d3142" text-anchor="middle">
    <text x="140" y="120">请求前</text>
    <text x="366" y="120">请求中</text>
    <text x="592" y="120">流式中</text>
    <text x="818" y="120">工具中</text>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8" fill="#4f5d75" text-anchor="middle">
    <text x="140" y="138">装配 / 准入</text>
    <text x="366" y="138">适配器 → 提供方</text>
    <text x="592" y="138">chunk 到达</text>
    <text x="818" y="138">execute() 运行</text>
  </g>
  <g stroke="#bf4520" stroke-width="1.1" fill="none" marker-end="url(#f01-a1)">
    <path d="M242 124 H 262"/>
    <path d="M468 124 H 488"/>
    <path d="M694 124 H 714"/>
  </g>
  <defs>
    <marker id="f01-a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bf4520"/></marker>
  </defs>

  <!-- cards -->
  <g>
    <rect x="40" y="180" width="200" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="266" y="180" width="200" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="492" y="180" width="200" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="718" y="180" width="200" height="300" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".1em" fill="#bf4520">
    <text x="56" y="202">BEFORE REQUEST</text>
    <text x="282" y="202">DURING REQUEST</text>
    <text x="508" y="202">DURING STREAM</text>
    <text x="734" y="202">DURING TOOL</text>
  </g>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">
    <text x="56" y="228">典型：上下文超限、</text>
    <text x="56" y="244">工具准备失败、参数非法</text>
    <text x="282" y="228">典型：限流、超时、</text>
    <text x="282" y="244">5xx、鉴权失败</text>
    <text x="508" y="228">典型：连接中断、</text>
    <text x="508" y="244">内容为空、提供方报错</text>
    <text x="734" y="228">典型：命令失败、</text>
    <text x="734" y="244">权限拒绝、超时</text>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">
    <text x="56" y="276">HANDLER</text>
    <text x="282" y="276">HANDLER</text>
    <text x="508" y="276">HANDLER</text>
    <text x="734" y="276">HANDLER</text>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#2d3142">
    <text x="56" y="298">压缩 / 图片卸载 /</text>
    <text x="56" y="314">工具集重解析</text>
    <text x="282" y="298">provider 重试策略</text>
    <text x="282" y="314">（normal / always）</text>
    <text x="508" y="298">尝试结算：写</text>
    <text x="508" y="314">assistant/message 或 attempt</text>
    <text x="734" y="298">规范化成 isError</text>
    <text x="734" y="314">工具结果</text>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#3f6b42">
    <text x="56" y="348">RECOVERY</text>
    <text x="282" y="348">RECOVERY</text>
    <text x="508" y="348">RECOVERY</text>
    <text x="734" y="348">RECOVERY</text>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#4f5d75">
    <text x="56" y="370">换请求，不重发</text>
    <text x="56" y="386">同一请求重发</text>
    <text x="282" y="370">退避后同一步再试</text>
    <text x="282" y="386">预算按 step 重置</text>
    <text x="508" y="370">失败也落账</text>
    <text x="508" y="386">重建时可区分</text>
    <text x="734" y="370">模型看到错误</text>
    <text x="734" y="386">自行决定重试</text>
  </g>

  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a5a44">
    <text x="56" y="424">TERMINAL?</text>
    <text x="282" y="424">TERMINAL?</text>
    <text x="508" y="424">TERMINAL?</text>
    <text x="734" y="424">TERMINAL?</text>
  </g>
  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="8.5" fill="#8a5a44">
    <text x="56" y="446">否，可修复</text>
    <text x="282" y="446">预算内否，超预算终止</text>
    <text x="508" y="446">abort 才终止</text>
    <text x="734" y="446">否，交回模型</text>
  </g>

  <!-- bottom -->
  <rect x="40" y="506" width="878" height="56" rx="5" fill="#fbf1ec" stroke="#e8c9b8"/>
  <text x="56" y="528" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing=".12em" fill="#bf4520">THE POINT</text>
  <text x="56" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="9" fill="#2d3142">四类失败的「可重复性」不同：请求前失败要换请求，请求中失败可重发，流式失败要落账，工具失败要变成数据。混在一起处理，必然有一类被错待。</text>
</svg>
