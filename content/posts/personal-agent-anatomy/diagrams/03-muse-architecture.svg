<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ct cd">
  <title id="ct">一台机器，四道门</title>
  <desc id="cd">客户端入口收活，主 agent 与后台循环共用一台常驻机器，所有对外动作过闸。</desc>
  <defs>
    <marker id="ca" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="cacc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">ARCHITECTURE · client → agent → vm → gate</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">一台机器，四道门</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">闸画在动作上，不画在模型上</text>
<rect x="36" y="82" width="664" height="30" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="101" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">客户端面</text>
<text x="150" y="101" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">Web · iOS · Android · Mac · WhatsApp</text>
<rect x="36" y="126" width="330" height="72" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="145" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">主 agent</text>
<text x="50" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">对话 · 拆解 · 子 agent · handoff 决策</text>
<text x="50" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">决定哪条结果跟你说、哪条丢掉</text>
<rect x="386" y="126" width="314" height="72" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="400" y="145" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">后台循环</text>
<text x="400" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">记忆整理 · 关系 · Ideas · 简报</text>
<text x="400" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">反思 · 技能评审 · 静默清扫</text>
<rect x="36" y="214" width="664" height="118" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="233" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">Muse Secure VM · 每用户独立，重启可恢复</text>
<rect x="50" y="246" width="62" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="81.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">~/ 文件</text>
<rect x="122" y="246" width="78" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="161.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">muse.db</text>
<rect x="210" y="246" width="78" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="249.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">browser</text>
<rect x="298" y="246" width="102" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="349.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">connectors</text>
<rect x="410" y="246" width="62" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="441.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">Vault</text>
<rect x="482" y="246" width="70" height="24" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="517.0" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" text-anchor="middle">wallet</text>
<text x="50" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">文档、素材、产物、技能都留在这里；会话结束机器还在，</text>
<text x="50" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">下次任务不需要重建现场。</text>
<rect x="36" y="348" width="664" height="56" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="367" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">记忆与技能沉淀</text>
<text x="50" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">MEMORY.md · memory/people · dreams · custom-skills</text>
<rect x="724" y="126" width="200" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="738" y="146" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">浏览与凭据</text>
<text x="738" y="164" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">访问 / 下载 / 上传 / 填密码</text>
<text x="738" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">四类动作各自 Allow · Ask · Deny</text>
<rect x="724" y="198" width="200" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="738" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">发布</text>
<text x="738" y="236" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">每次发布与更新都一键批准</text>
<text x="738" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">批准不持久，只允许静态产物</text>
<rect x="724" y="270" width="200" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="738" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">支付</text>
<text x="738" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">一次性虚拟卡，单笔/日/30 天限额</text>
<text x="738" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">一次结账一个窗口</text>
<rect x="724" y="342" width="200" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="738" y="362" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">审批卡</text>
<text x="738" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">客户端渲染，agent 碰不到</text>
<text x="738" y="394" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">文案你看得到，它改不了</text>
<line x1="700" y1="266" x2="706" y2="266" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
<line x1="706" y1="158" x2="706" y2="374" stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
<line x1="706" y1="158" x2="722" y2="158" stroke="#bf4520" stroke-width="1" marker-end="url(#cacc)"/>
<line x1="706" y1="230" x2="722" y2="230" stroke="#bf4520" stroke-width="1" marker-end="url(#cacc)"/>
<line x1="706" y1="302" x2="722" y2="302" stroke="#bf4520" stroke-width="1" marker-end="url(#cacc)"/>
<line x1="706" y1="374" x2="722" y2="374" stroke="#bf4520" stroke-width="1" marker-end="url(#cacc)"/>

  <text x="36" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">四道门里前三道按动作分类，第四道防的是 agent 说服用户批准。</text>
  </svg>
