<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="et ed">
  <title id="et">worker 交回的是报告，不是消息</title>
  <desc id="ed">调度器唤醒 worker，worker 干活，结果先回主 agent，由主 agent 决定合并、丢弃还是问你。</desc>
  <defs>
    <marker id="ea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="eacc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">SEQUENCE · scheduler → worker → handoff → agent → you</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">一次计划任务，一次交接</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">运行成功不等于用户收到</text>
<rect x="34.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
<text x="104" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">调度器</text>
<rect x="216.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
<text x="286" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">worker</text>
<rect x="400.0" y="72" width="140" height="30" fill="#2d3142" stroke="#2d3142"/>
<text x="470" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">主 agent</text>
<rect x="598.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
<text x="668" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">你</text>
<rect x="782.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
<text x="852" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">外部站点</text>
<line x1="104" y1="102" x2="104" y2="430" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
<line x1="286" y1="102" x2="286" y2="430" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
<line x1="470" y1="102" x2="470" y2="430" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
<line x1="668" y1="102" x2="668" y2="430" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
<line x1="852" y1="102" x2="852" y2="430" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
<line x1="104" y1="120" x2="282" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="112" y="113" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">cron 到点，唤醒 job</text>
<line x1="286" y1="154" x2="848" y2="154" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="294" y="147" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">打开站点、登录、取数</text>
<line x1="852" y1="188" x2="290" y2="188" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ea)"/>
<text x="300" y="181" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">页面与结果</text>
<line x1="286" y1="222" x2="466" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="294" y="215" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">handoff 报告（写给你看的，不是给用户的）</text>
<line x1="470" y1="256" x2="664" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="478" y="249" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">合并成一条：有 1 件事需要你决定</text>
<line x1="668" y1="290" x2="474" y2="290" stroke="#bf4520" stroke-width="1.2" marker-end="url(#eacc)"/>
<text x="478" y="283" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">批准这一次发送</text>
<line x1="470" y1="324" x2="290" y2="324" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="294" y="317" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">继续：按批准的范围执行</text>
<line x1="286" y1="358" x2="466" y2="358" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ea)"/>
<text x="294" y="351" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">完成回执 + 证据链接</text>
<line x1="470" y1="392" x2="664" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#ea)"/>
<text x="478" y="385" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">交付：消息 + 推送</text>
<rect x="36" y="452" width="664" height="56" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="472" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">遇到持久阻塞（连接器掉线 / 机器人检查 / 需要人工），任务自己暂停，下次调度重试。</text>
<text x="50" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">运行记录里留一条失败，而不是留一条沉默。</text>

  <text x="36" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">handoff 让主 agent 能合并与止损，代价是延迟；两边都留在 trace 里，事后能查。</text>
  </svg>
