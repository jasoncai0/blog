<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="gt gd">
  <title id="gt">抄时间结构，不抄商业结构</title>
  <desc id="gd">Muse 的五个部件在本地项目里的最小实现，成本从一台云机器降到一条守护进程。</desc>
  <defs>
    <marker id="ga" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="gacc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">MAPPING · muse → 一个人的设计助手</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">Muse 的做法 → 你的最小版本</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">一个月二十到五十块</text>
<text x="120" y="84" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">MUSE 的做法</text>
<text x="700" y="84" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">个人设计助手的最小版本</text>
<rect x="36" y="96" width="384" height="54" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="118" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">主体</text>
<text x="50" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">每用户一台 Secure VM，`~/` 留档</text>
<line x1="430" y1="123" x2="500" y2="123" stroke="#bf4520" stroke-width="1" marker-end="url(#gacc)"/>
<rect x="512" y="96" width="412" height="54" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="526" y="118" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">主体</text>
<text x="526" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">本地 daemon + 项目目录，素材与候选都在盘上</text>
<rect x="36" y="158" width="384" height="54" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">循环</text>
<text x="50" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">主 agent + 子 agent，长任务拆给 worker</text>
<line x1="430" y1="185" x2="500" y2="185" stroke="#bf4520" stroke-width="1" marker-end="url(#gacc)"/>
<rect x="512" y="158" width="412" height="54" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="526" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">循环</text>
<text x="526" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">单 agent 跑闭环，长任务拆给后台队列</text>
<rect x="36" y="220" width="384" height="54" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">记忆</text>
<text x="50" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">MEMORY.md + 每天合并 + 关系页</text>
<line x1="430" y1="247" x2="500" y2="247" stroke="#bf4520" stroke-width="1" marker-end="url(#gacc)"/>
<rect x="512" y="220" width="412" height="54" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="526" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">记忆</text>
<text x="526" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">约束块 + 先例库，后台每晚配对一次</text>
<rect x="36" y="282" width="384" height="54" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">调度</text>
<text x="50" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">七种后台循环 + cron + 事件</text>
<line x1="430" y1="309" x2="500" y2="309" stroke="#bf4520" stroke-width="1" marker-end="url(#gacc)"/>
<rect x="512" y="282" width="412" height="54" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="526" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">调度</text>
<text x="526" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">一条 cron：夜间预取候选、生成提案</text>
<rect x="36" y="344" width="384" height="54" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
<text x="50" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">账本</text>
<text x="50" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">muse.db 记 run / step / handoff</text>
<line x1="430" y1="371" x2="500" y2="371" stroke="#bf4520" stroke-width="1" marker-end="url(#gacc)"/>
<rect x="512" y="344" width="412" height="54" fill="#ececec" stroke="rgba(45,49,66,0.18)"/>
<text x="526" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">账本</text>
<text x="526" y="384" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">事件表 + 产物哈希，能回答「为什么推荐」</text>

  <text x="36" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">成本差异主要在主体：云 VM 按小时计，本地 daemon 只在跑任务时花钱。</text>
  </svg>
