<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f03-title f03-02-desc">
<title id="f03-02-title">两处规范化边界</title>
<desc id="f03-02-desc">工具边界把异常折成模型可见文本加结构化 info；轮次边界把异常折成 turn/end 的 reason。</desc>
<defs><marker id="f03-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6580"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="48" y="50" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#2d3142" text-anchor="start">两处规范化边界</text>
<text x="48" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580" text-anchor="start">一处给模型看，一处给日志与 UI 看</text>
<rect x="44" y="104" width="420" height="372" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="64" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12.6" font-weight="600" fill="#bf4520" text-anchor="start">pipeline.toolErrorResult()</text>
<text x="64" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">抛出的值变成 ToolExecutionResult</text>
<rect x="60" y="180" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="74" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">toolErrorMessage(error)</text>
<text x="74" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">取 message；非 Error 的字符串原样；其余 String(error)</text>
<line x1="254" y1="242" x2="254" y2="256" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-02-arrow)"/>
<rect x="60" y="258" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="74" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">errorInfo(error)</text>
<text x="74" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">instanceof HarnessError 时给 {name, code}，否则 undefined</text>
<line x1="254" y1="320" x2="254" y2="334" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-02-arrow)"/>
<rect x="60" y="336" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="74" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">组装结果</text>
<text x="74" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">content 为一句 Error: 文本，isError 为真，error 带 message 与</text>
<text x="74" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">info</text>
<text x="64" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#5a6580" text-anchor="start">info 嵌套在 error.info 下，落盘时展开成 name 与 code。</text>
<rect x="496" y="104" width="420" height="372" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="516" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="12.6" font-weight="600" fill="#bf4520" text-anchor="start">agent.ts turnEnds</text>
<text x="516" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#5a6580" text-anchor="start">轮次失败变成 turn/end 的 reason</text>
<rect x="512" y="180" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="526" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">LlmError</text>
<text x="526" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">整个 failure 原样保留：message、code、status、requestId</text>
<line x1="706" y1="242" x2="706" y2="256" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-02-arrow)"/>
<rect x="512" y="258" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="526" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">ToolActivationError</text>
<text x="526" y="296" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">只保留 code，message 走 errorChain</text>
<line x1="706" y1="320" x2="706" y2="334" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-02-arrow)"/>
<rect x="512" y="336" width="388" height="62" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="526" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">其他异常</text>
<text x="526" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#2d3142" text-anchor="start">message 取 errorChain(error)，code 定为 UNKNOWN</text>
<text x="516" y="440" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.4" font-weight="400" fill="#5a6580" text-anchor="start">reason 写进 turn/end；模型不会读到这个事件。</text>
<rect x="44" y="500" width="872" height="44" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="480" y="528" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.4" font-weight="400" fill="#bf4520" text-anchor="middle">两处都不改原始异常，只决定它对外留下什么。</text>
</svg>
