<text x="60" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.9" font-weight="400" fill="#2d3142" text-anchor="start">合成 closer 的 tool/result</text>
<text x="506" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">是</text>
<text x="654" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">是</text>
<text x="812" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">是</text>
<rect x="44" y="424" width="872" height="52" rx="6" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="60" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#2d3142" text-anchor="start">模型只拿到 surface 派生出的 message。error、reason、attempt 与 retry 都在 message 之外。</text>
<text x="60" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5a6580" text-anchor="start">UI 与诊断读同一份日志，区别是取哪些字段、怎么展示 cause 链。</text>
<text x="44" y="508" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#5a6580" text-anchor="start">三类内容模型能直接看到：</text>
<text x="48" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#2d3142" text-anchor="start">· 失败工具的 Error: 文本</text>
<text x="48" y="552" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#2d3142" text-anchor="start">· 中断时留下的一半 assistant 内容</text>
<text x="48" y="572" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#2d3142" text-anchor="start">· resume 或 fork 补写的工具结果</text>
