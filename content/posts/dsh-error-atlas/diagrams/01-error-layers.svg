<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f03-title f03-01-desc">
<title id="f03-01-title">一个异常穿过的六层</title>
<desc id="f03-01-desc">从 provider 适配器到模型上下文，异常在每一层保留的形状，以及两处规范化边界。</desc>
<defs><marker id="f03-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6580"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="48" y="50" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#2d3142" text-anchor="start">一个异常穿过的六层</text>
<text x="48" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6580" text-anchor="start">越往下，结构化字段越少；模型看到的是最早被折叠的那一版</text>
<rect x="48" y="100" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="68" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#5a6580" text-anchor="start">provider</text>
<text x="68" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 1 层</text>
<text x="210" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">LlmError：code 取 RATE_LIMIT、SERVER、TIMEOUT、TRANSPORT、EMPTY_RESPONSE 等</text>
<line x1="76" y1="154" x2="76" y2="162" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-01-arrow)"/>
<rect x="48" y="164" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="68" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#5a6580" text-anchor="start">请求恢复</text>
<text x="68" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 2 层</text>
<text x="210" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">agent/request-error 交给重试策略；决定重试时写 llm/retry 与 llm/retry-started</text>
<line x1="76" y1="218" x2="76" y2="226" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-01-arrow)"/>
<rect x="48" y="228" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<rect x="48" y="228" width="4" height="54" rx="2" fill="#bf4520"/>
<text x="68" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="start">agent loop</text>
<text x="68" y="268" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 3 层</text>
<text x="210" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">turn/end 的 reason.error：LlmError 保留 failure，其余折成 message 加 code</text>
<line x1="76" y1="282" x2="76" y2="290" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-01-arrow)"/>
<rect x="48" y="292" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<rect x="48" y="292" width="4" height="54" rx="2" fill="#bf4520"/>
<text x="68" y="314" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#bf4520" text-anchor="start">工具流水线</text>
<text x="68" y="332" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 4 层</text>
<text x="210" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">toolErrorResult：content 里一句 Error: ...，isError 置真，error 里留 name 与 code</text>
<line x1="76" y1="346" x2="76" y2="354" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-01-arrow)"/>
<rect x="48" y="356" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="68" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#5a6580" text-anchor="start">会话日志</text>
<text x="68" y="396" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 5 层</text>
<text x="210" y="388" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">tool/result 带 error{name,code,reason}；非消息事件不进模型历史</text>
<line x1="76" y1="410" x2="76" y2="418" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f03-01-arrow)"/>
<rect x="48" y="420" width="864" height="54" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
<text x="68" y="442" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#5a6580" text-anchor="start">消费方</text>
<text x="68" y="460" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="400" fill="#5a6580" text-anchor="start">第 6 层</text>
<text x="210" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11.6" font-weight="400" fill="#2d3142" text-anchor="start">模型读 content；UI 读 reason；排障读 code 与 cause 链</text>
<text x="48" y="504" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#bf4520" text-anchor="start">橙色左边框：错误在这里被规范化成事件字段。</text>
<text x="48" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#5a6580" text-anchor="start">模型只读 surface 派生出的 message，看不到 error、reason 与 retry 事件。</text>
<text x="48" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#5a6580" text-anchor="start">UI 与排障工具读的是同一份日志，只是取的字段不同。</text>
</svg>
