<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="r1-title r1-desc">
  <title id="r1-title">一次 undo 的窗口：文件先动，历史后删</title>
  <desc id="r1-desc">按下 undo 后文件立刻恢复到边界之前，但消息只是被标记；直到用户提交下一条 prompt 才真正删除历史。redo 只能在这段窗口内把文件还原回去。</desc>

  <defs>
    <marker id="r1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="r1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">UNDO WINDOW</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">文件先动，历史后删——中间那段是 redo 唯一的机会</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">stage 当场写盘；commit 发生在你提交下一条 prompt 时——不是按下 undo 的时候</text>

  <!-- time axis -->
  <line x1="120" y1="120" x2="900" y2="120" stroke="#c9cdd6" stroke-width="1"/>
  <line x1="240" y1="112" x2="240" y2="128" stroke="#bf4520" stroke-width="1.2"/>
  <line x1="620" y1="112" x2="620" y2="128" stroke="#2d3142" stroke-width="1.2"/>
  <text x="240" y="106" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">T0 · /undo</text>
  <text x="620" y="106" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">T1 · 下一次提交</text>
  <text x="868" y="106" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8b93a7">t</text>

  <!-- lane labels -->
  <text x="112" y="166" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">工作区</text>
  <text x="112" y="256" text-anchor="end" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">会话历史</text>

  <!-- workspace lane -->
  <rect x="120" y="140" width="500" height="44" rx="5" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="132" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">文件已回到边界之前</text>
  <text x="132" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">每个文件取"边界之后最早一次 start"的树</text>

  <rect x="620" y="140" width="280" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="632" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">照常编辑，undo 不再改文件</text>
  <text x="632" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">历史删除与工作区无关</text>

  <!-- history lane -->
  <rect x="120" y="230" width="500" height="44" rx="5" fill="#ebeef3" stroke="#8b93a7" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="132" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">消息还在，只是被标记</text>
  <text x="132" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">TUI 把它们置灰保留；新消息不会追加在它们之后</text>

  <rect x="620" y="230" width="280" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="632" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">seq ≥ 边界的分支被删除</text>
  <text x="632" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8b93a7">收件箱回滚、blob 释放，不可撤销</text>

  <!-- vertical markers -->
  <line x1="240" y1="128" x2="240" y2="392" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="620" y1="128" x2="620" y2="392" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- action cards -->
  <rect x="120" y="330" width="220" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="134" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">① STAGE</text>
  <text x="134" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">先拍一张"现在"</text>
  <text x="134" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">capture 当前树存进 revert.snapshot</text>
  <text x="134" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">再按边界逐文件 restore</text>
  <text x="134" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">没有这张"现在"，clear 就无路可退</text>

  <rect x="380" y="330" width="220" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="394" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#2d3142">② COMMIT</text>
  <text x="394" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">提交时补删历史</text>
  <text x="394" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">投影删 seq ≥ 边界 的消息与收件箱</text>
  <text x="394" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">rewind 指令状态、释放不再引用的 blob</text>
  <text x="394" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">一旦提交，redo 就没了</text>

  <rect x="640" y="330" width="260" height="112" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <text x="654" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">③ REDO = CLEAR</text>
  <text x="654" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">把文件放回 stage 之前</text>
  <text x="654" y="390" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">用 ① 里那张 original 树逐文件还原</text>
  <text x="654" y="404" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">撤销标记，历史本来就没动</text>
  <text x="654" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">所以"重做"重做的是文件，不是消息</text>

  <text x="48" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">这三步各自独立：文件在 T0 就变了，历史在 T1 才变，redo 只在两端之间有效。窗口的长度由用户的下一步决定，不由代码决定。</text>
  <text x="48" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">这也是为什么"undo 完直接关掉编辑器"是一种稳定状态：文件退了，历史留着，下次打开还能再看到那些被标记的消息。</text>
</svg>
