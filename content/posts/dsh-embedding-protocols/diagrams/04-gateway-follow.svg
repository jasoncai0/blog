<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f04-title f04-desc">
  <title id="f04-title">图 4 · gateway 与 session-controller 的 follow 时序</title>
  <desc id="f04-desc">认证建 Peer，controller 先设游标再发快照，事件逐条入流；缺口由 listener 报错、由客户端分页修复。</desc>
  <defs>
    <marker id="f04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
    <marker id="f04-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="48" y="46" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">图 4 · gateway 与 session-controller 的 follow 时序</text>
  <text x="48" y="68" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" fill="#4f5d75">gateway 负责传输与鉴权，controller 负责快照、cursor 与缺口检测。</text>
  <rect x="36" y="96" width="148" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="110" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">浏览器</text>
  <line x1="110" y1="126" x2="110" y2="524" stroke="#d8d8d8" stroke-dasharray="3 4"/>
  <rect x="256" y="96" width="148" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="330" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">connection</text>
  <line x1="330" y1="126" x2="330" y2="524" stroke="#d8d8d8" stroke-dasharray="3 4"/>
  <rect x="446" y="96" width="148" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="520" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">gateway</text>
  <line x1="520" y1="126" x2="520" y2="524" stroke="#d8d8d8" stroke-dasharray="3 4"/>
  <rect x="616" y="96" width="148" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="690" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">session-controller</text>
  <line x1="690" y1="126" x2="690" y2="524" stroke="#d8d8d8" stroke-dasharray="3 4"/>
  <rect x="782" y="96" width="148" height="30" rx="4" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="856" y="116" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">listener</text>
  <line x1="856" y1="126" x2="856" y2="524" stroke="#d8d8d8" stroke-dasharray="3 4"/>
  <line x1="110" y1="158" x2="330" y2="158" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="220" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">POST /api  follow</text>
  <line x1="330" y1="186" x2="520" y2="186" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="425" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">认证 → Peer</text>
  <line x1="520" y1="214" x2="690" y2="214" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="605" y="207" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">按描述符分发</text>
  <line x1="690" y1="242" x2="856" y2="242" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="773" y="235" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">new listener + setCursor</text>
  <line x1="856" y1="278" x2="690" y2="278" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#f04-arrow2)"/>
  <text x="773" y="271" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">订阅事件</text>
  <line x1="690" y1="312" x2="520" y2="312" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#f04-arrow2)"/>
  <text x="605" y="305" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">snapshot(cursor)</text>
  <line x1="520" y1="340" x2="110" y2="340" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#f04-arrow2)"/>
  <text x="315" y="333" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">frame: snapshot</text>
  <line x1="856" y1="376" x2="690" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="773" y="369" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">event seq n</text>
  <line x1="690" y1="404" x2="520" y2="404" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f04-arrow)"/>
  <text x="605" y="397" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">frame seq n</text>
  <line x1="520" y1="432" x2="110" y2="432" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#f04-arrow2)"/>
  <text x="315" y="425" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">frame seq n</text>
  <text x="96" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#bf4520" text-anchor="start">seq 不连续 → RemoteError</text>
  <text x="96" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">客户端比较 cursor，分页补齐</text>
  <text x="96" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="#4f5d75" text-anchor="start">完整重复丢弃；倒置区间报错</text>
</svg>
