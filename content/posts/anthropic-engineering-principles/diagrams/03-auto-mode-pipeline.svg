<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="636" viewBox="0 0 1280 636" font-family='-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif' role="img" aria-labelledby="f3-t f3-d">
<title id="f3-t">Claude Code Auto Mode 权限分流与双阶段盲审管线</title>
<desc id="f3-d">展示请求从三级权限分流、双阶段 Sonnet 4.6 盲审分类器到输入探针和熔断退回的完整路径。</desc>
<defs>
<style>
  .f3-title { font-size: 23px; font-weight: 800; fill: #0F172A; }
  .f3-subtitle { font-size: 13px; fill: #475569; }
  .f3-hdr { font-size: 14.5px; font-weight: 700; fill: #FFFFFF; }
  .f3-hdr-sub { font-size: 11px; fill: rgba(255,255,255,0.88); }
  .f3-badge { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  .f3-tier-sub { font-size: 11.5px; font-weight: 600; fill: #334155; }
  .f3-card-t { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
  .f3-card-b { font-size: 11.2px; fill: #334155; }
  .f3-card-m { font-size: 10.5px; font-weight: 600; fill: #475569; }
  .f3-edge-lbl { font-size: 11px; font-weight: 700; fill: #334155; }
  .f3-footer { font-size: 11px; fill: #64748B; }
</style>
<filter id="f3-shadow" x="-5%" y="-5%" width="110%" height="115%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
</filter>
<marker id="f3-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
</marker>
<marker id="f3-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
</marker>
<marker id="f3-arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/>
</marker>
<marker id="f3-arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
</marker>

</defs>
<rect x="0.5" y="0.5" width="1279" height="635" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="12"/>
<text x="32" y="42" class="f3-title">Claude Code Auto Mode 权限分流与双阶段盲审管线</text>
<text x="32" y="65" class="f3-subtitle">剥离模型自述与工具返回阻断劝说和间接注入；Stage 1 单字快筛保召回、Stage 2 复用缓存降误报</text>
<rect x="32" y="88" width="200" height="38" rx="8" fill="#1E293B"/>
<text x="132.0" y="112" text-anchor="middle" class="f3-hdr">1. Agent 发起工具调用</text>
<rect x="262" y="88" width="260" height="38" rx="8" fill="#1A73E8"/>
<text x="392.0" y="112" text-anchor="middle" class="f3-hdr">2. 前置分级免审分流</text>
<rect x="554" y="88" width="420" height="38" rx="8" fill="#0F766E"/>
<text x="764.0" y="112" text-anchor="middle" class="f3-hdr">3. Tier 3 无推理盲审双阶段分类器</text>
<rect x="1006" y="88" width="242" height="38" rx="8" fill="#D97757"/>
<text x="1127.0" y="112" text-anchor="middle" class="f3-hdr">4. 执行、探针与熔断</text>
<rect x="32" y="220" width="200" height="195" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="47" y="245" class="f3-card-t">待执行动作与上下文</text>
<text x="47" y="267" class="f3-card-b">· 用户原始消息（保留）</text>
<text x="47" y="286" class="f3-card-b">· 工具调用载荷（保留）</text>
<text x="47" y="305" class="f3-card-b">· 模型自述理由（剥离！）</text>
<text x="47" y="324" class="f3-card-b">· 历史工具输出（剥离！）</text>
<text x="47" y="402" class="f3-card-m">防模型自我辩护与间接注入</text>
<rect x="262" y="148" width="260" height="118" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="277" y="173" class="f3-card-t">Tier 1：只读安全白名单</text>
<text x="277" y="195" class="f3-card-b">读文件、Grep/Glob 搜索、计划流转</text>
<text x="277" y="214" class="f3-card-b">注：进入时自动剥离 python/bash 通配豁免</text>
<text x="277" y="253" class="f3-card-m">零分类延迟 → 直接放行执行</text>
<rect x="262" y="282" width="260" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="277" y="307" class="f3-card-t">Tier 2：工作区内文件修改</text>
<text x="277" y="329" class="f3-card-b">当前 Git 仓库目录内的写文件与编辑</text>
<text x="277" y="348" class="f3-card-b">可经版本控制回滚审查，免调分类器</text>
<text x="277" y="377" class="f3-card-m">零分类延迟 → 直接放行执行</text>
<rect x="262" y="406" width="260" height="126" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f3-shadow)"/>
<rect x="262" y="406" width="5" height="126" rx="2" fill="#10B981"/>
<text x="277" y="431" class="f3-card-t">Tier 3：高风险外部副作用 ★</text>
<text x="277" y="453" class="f3-card-b">Shell 命令、联网请求、外部 MCP、</text>
<text x="277" y="472" class="f3-card-b">子代理派生、仓库外路径读写</text>
<text x="277" y="519" class="f3-card-m">进入右侧 Sonnet 4.6 盲审管线</text>
<rect x="554" y="148" width="420" height="384" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.4"/>
<rect x="574" y="168" width="380" height="152" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="589" y="193" class="f3-card-t">Stage 1：单 Token 保守快筛（Yes / No）</text>
<text x="589" y="215" class="f3-card-b">· 仅输出单 token 决策，指令设定「宁错拦勿漏放」</text>
<text x="589" y="234" class="f3-card-b">· 评估真实影响（穿透脚本拼接与 &amp;&amp; 链式载荷）</text>
<text x="589" y="253" class="f3-card-b">· 实测（n=10,000）：8.5% 误拦率（FPR），6.6% 漏报</text>
<text x="589" y="307" class="f3-card-m">未标红（91.5% 流量）→ 直接放行</text>
<rect x="574" y="352" width="380" height="160" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f3-shadow)"/>
<rect x="574" y="352" width="5" height="160" rx="2" fill="#10B981"/>
<text x="589" y="377" class="f3-card-t">Stage 2：共享前缀缓存 CoT 深度复核 ★</text>
<text x="589" y="399" class="f3-card-b">· 仅对 Stage 1 标红动作触发，几乎 100% 命中前缀缓存</text>
<text x="589" y="418" class="f3-card-b">· 按「阻断规则 → 豁免例外 → 用户明确授权」逐级推理</text>
<text x="589" y="437" class="f3-card-b">· 终局指标：日常 FPR 压至 0.4%，合成外传 FNR 5.7%</text>
<text x="589" y="499" class="f3-card-m">真实越权 FNR 17%（需配合底层 OS/VM 沙箱）</text>
<rect x="1006" y="148" width="242" height="178" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f3-shadow)"/>
<rect x="1006" y="148" width="5" height="178" rx="2" fill="#10B981"/>
<text x="1021" y="173" class="f3-card-t">沙箱执行 + 输入注入探针 ★</text>
<text x="1021" y="195" class="f3-card-b">· 动作放行后在沙箱内执行</text>
<text x="1021" y="214" class="f3-card-b">· 返回结果回流前经服务端探针扫描</text>
<text x="1021" y="233" class="f3-card-b">· 发现疑似注入自动附加警惕警告，</text>
<text x="1021" y="252" class="f3-card-b">  提示主模型重新锚定用户原始意图</text>
<text x="1021" y="313" class="f3-card-m">输入防劫持 + 输出防越权双重叠加</text>
<rect x="1006" y="352" width="242" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="1021" y="377" class="f3-card-t">拒绝恢复与熔断阈值</text>
<text x="1021" y="399" class="f3-card-b">· 判定危险：返回工具报错，指示模型</text>
<text x="1021" y="418" class="f3-card-b">  寻找更安全替代路径（不中断会话）</text>
<text x="1021" y="437" class="f3-card-b">· 连续 3 次被拒 或 累计 20 次被拒：</text>
<text x="1021" y="456" class="f3-card-b">  立即熔断并升级人工接管 / 终止进程</text>
<text x="1021" y="519" class="f3-card-m">让 0.4% 误拦只耗一次重试而非毁掉长任务</text>
<path d="M 232 318 C 248 318, 244 207, 256 207" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#f3-arr)"/>
<path d="M 232 318 C 248 318, 244 336, 256 336" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#f3-arr)"/>
<path d="M 232 318 C 248 318, 244 469, 256 469" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#f3-arr-blue)"/>
<path d="M 522 469 C 544 469, 540 244, 568 244" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#f3-arr-blue)"/>
<line x1="764" y1="320" x2="764" y2="346" stroke="#D97706" stroke-width="1.8" marker-end="url(#f3-arr-warn)"/>
<text x="776" y="339" class="f3-edge-lbl" fill="#B45309">标红升级 (8.5%)</text>
<line x1="954" y1="226" x2="1000" y2="226" stroke="#059669" stroke-width="1.8" marker-end="url(#f3-arr-ok)"/>
<path d="M 954 410 C 982 410, 976 260, 1000 260" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#f3-arr-ok)"/>
<line x1="954" y1="442" x2="1000" y2="442" stroke="#D97706" stroke-width="1.8" marker-end="url(#f3-arr-warn)"/>
<path d="M 1127 532 L 1127 572 L 132 572 L 132 422" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#f3-arr-warn)"/>
<text x="630" y="564" text-anchor="middle" class="f3-edge-lbl" fill="#B45309">拦截反馈回路：将拒绝原因作为 tool_result 退回主 Agent 换安全方案重试（未超 3 连拒 / 20 总拒阈值）</text>
<text x="32" y="614" class="f3-footer">★ 边界提示：子代理委派与返回两端同样执行该分类管线；但员工粘贴钓鱼指令等「合法意图越界」仍须靠底层沙箱与出站代理封堵。</text>
</svg>