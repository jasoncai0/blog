ath d="M801,366 L801.0,384.256" fill="none" stroke="#5a6580" stroke-width="1.1"/><polygon points="801,388 798.8796456440903,383.251937510376 803.1203543559097,383.251937510376" fill="#5a6580" stroke="none"/><text x="809" y="381" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="500" text-anchor="start" fill="#8a93a6">1:N</text><rect x="48" y="478" width="864" height="100" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="600" text-anchor="start" fill="#5a6580">区间</text><text x="110" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">整数 tick，半开 [start, end)；时间基 90000，不用浮点秒。</text><text x="64" y="524" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="600" text-anchor="start" fill="#5a6580">快照</text><text x="110" y="524" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">export 钉住 timeline_version；publication 钉住 export；召回按 publication 逐条处置。</text><text x="64" y="548" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="600" text-anchor="start" fill="#5a6580">嵌套</text><text x="110" y="548" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">clip.src_artifact 可以是另一条时间线的 export；版本不可变，遍历有向无环。</text><text x="60" y="600" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">artifact 的 content_hash 负责字节身份；clip 的区间负责时间身份；两者不能互相替代。</text></svg>