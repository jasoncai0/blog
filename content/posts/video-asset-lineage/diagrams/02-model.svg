<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="v2-t v2-d"><title id="v2-t">视频区间血缘的数据模型</title><desc id="v2-d">timeline_version 是不可变快照，clip 把源 artifact 的区间映射到目标时间线区间，export 从快照渲染，publication 指向导出，recall_item 记录每条投放的处置。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">DATA MODEL · TIMELINE / CLIP / RECALL</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">区间、快照与召回，各有一张表</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">clip 存两段区间和速度；export 钉快照；recall_item 钉到每一条投放</text><rect x="48" y="120" width="4" height="118" fill="#7a5aa8" rx="2"/><rect x="48" y="120" width="270" height="118" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="61" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9.0" font-weight="700" text-anchor="start" fill="#7a5aa8">timeline_version</text><text x="306" y="137" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="500" text-anchor="end" fill="#7a5aa8">IMMUTABLE</text><path d="M60,146 L306,146" fill="none" stroke="#e9e9e9" stroke-width="1"/><text x="61" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="400" text-anchor="start" fill="#5a6580">timeline_id</text><text x="140" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.7" font-weight="500" text-anchor="start" fill="#2d3142">tl-brand-30</text><text x="61" y="181" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="400" text-anchor="start"