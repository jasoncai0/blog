<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="v3-t v3-d"><title id="v3-t">一次模型撤稿的召回扇出与处置状态机</title><desc id="v3-d">从 LoRA v3 撤稿出发，反向找到 12 个生成作业、48 个产物、3 条时间线、18 个导出和 6 条投放；召回按 opened、scoped、contained、remediating、verified、closed 六个状态推进。</desc><rect width="100%" height="100%" fill="#f5f5f5"/><text x="48" y="36" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">RECALL · FAN OUT + STATE MACHINE</text><text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">召回不是删文件，是一次有状态的扇出</text><text x="48" y="88" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">先定界，再止血；每条投放都要有处置记录，而不是一张下架名单</text><rect x="48" y="104" width="864" height="182" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><rect x="60" y="140" width="3.5" height="60" fill="#bf4520" rx="1.5"/><rect x="60" y="140" width="108" height="60" rx="6" fill="#faf3f0" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 3"/><text x="71" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">TRIGGER · 11-11</text><text x="71" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#bf4520">LoRA 撤稿</text><text x="157" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#bf4520">1</text><rect x="190" y="140" width="3.5" height="60" fill="#3d5a80" rx="1.5"/><rect x="190" y="140" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="201" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">JOB</text><text x="201" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#3d5a80">generation</text><text x="283" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#3d5a80">12</text><rect x="314" y="140" width="3.5" height="60" fill="#2d3142" rx="1.5"/><rect x="314" y="140" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="325" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">ARTIFACT</text><text x="325" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#2d3142">output</text><text x="407" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#2d3142">48</text><rect x="438" y="140" width="3.5" height="60" fill="#7a5aa8" rx="1.5"/><rect x="438" y="140" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="449" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">TIMELINE</text><text x="449" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#7a5aa8">version</text><text x="531" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#7a5aa8">3</text><rect x="562" y="140" width="3.5" height="60" fill="#2f6f5e" rx="1.5"/><rect x="562" y="140" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="573" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">EXPORT</text><text x="573" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#2f6f5e">render</text><text x="655" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#2f6f5e">18</text><rect x="686" y="140" width="3.5" height="60" fill="#9a6a1f" rx="1.5"/><rect x="686" y="140" width="104" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="697" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.0" font-weight="500" text-anchor="start" fill="#8a93a6" letter-spacing="0.08em">PUBLICATION</text><text x="697" y="175" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="500" text-anchor="start" fill="#9a6a1f">placement</text><text x="779" y="177" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="end" fill="#9a6a1f">6</text><path d="M168,170 L186.256,170.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="190,170 185.251937510376,172.12035435590977 185.251937510376,167.87964564409023" fill="#5a6580" stroke="none"/><text x="179" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="600" text-anchor="middle" fill="#5a6580">12</text><path d="M292,170 L310.256,170.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="314,170 309.251937510376,172.12035435590977 309.251937510376,167.87964564409023" fill="#5a6580" stroke="none"/><text x="303" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="600" text-anchor="middle" fill="#5a6580">48</text><path d="M416,170 L434.256,170.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="438,170 433.251937510376,172.12035435590977 433.251937510376,167.87964564409023" fill="#5a6580" stroke="none"/><text x="427" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="600" text-anchor="middle" fill="#5a6580">3</text><path d="M540,170 L558.256,170.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="562,170 557.251937510376,172.12035435590977 557.251937510376,167.87964564409023" fill="#5a6580" stroke="none"/><text x="551" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="600" text-anchor="middle" fill="#5a6580">18</text><path d="M664,170 L682.256,170.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="686,170 681.251937510376,172.12035435590977 681.251937510376,167.87964564409023" fill="#5a6580" stroke="none"/><text x="675" y="163" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" font-weight="600" text-anchor="middle" fill="#5a6580">6</text><rect x="806" y="140" width="90" height="60" rx="6" fill="#faf4e8" stroke="#e3cfa8" stroke-width="1"/><text x="818" y="158" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="600" text-anchor="start" fill="#9a6a1f">live 4</text><text x="818" y="174" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.0" font-weight="500" text-anchor="start" fill="#9a6a1f">sched 2</text><text x="818" y="190" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">→ 逐条处置</text><text x="60" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">scope：把受影响集合冻结成一个 snapshot；cutoff 之后的新投放走 delta sweep。</text><text x="60" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">扇出深度 5，在线查询只做前 3 跳；训练数据 → 模型这条链走离线批处理。</text><text x="60" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.0" font-weight="400" text-anchor="start" fill="#5a6580">召回对象是 publication，不是 artifact：下架一张图，不等于六个渠道都停了。</text><rect x="48" y="340" width="864" height="216" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/><text x="64" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" text-anchor="start" fill="#2d3142">召回状态机</text><text x="148" y="368" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.8" font-weight="400" text-anchor="start" fill="#8a93a6">opened → scoped → contained → remediating → verified → closed</text><rect x="72" y="396" width="118" height="48" rx="6" fill="#faf3f0" stroke="#bf4520" stroke-width="1"/><text x="83" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#bf4520">opened</text><text x="83" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">触发</text><rect x="208" y="396" width="118" height="48" rx="6" fill="#faf4e8" stroke="#9a6a1f" stroke-width="1"/><text x="219" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#9a6a1f">scoped</text><text x="219" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">定界</text><rect x="344" y="396" width="118" height="48" rx="6" fill="#eef4f1" stroke="#2f6f5e" stroke-width="1"/><text x="355" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#2f6f5e">contained</text><text x="355" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">止血</text><rect x="480" y="396" width="118" height="48" rx="6" fill="#eef1f6" stroke="#3d5a80" stroke-width="1"/><text x="491" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#3d5a80">remediating</text><text x="491" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">修复</text><rect x="616" y="396" width="118" height="48" rx="6" fill="#f2eef8" stroke="#7a5aa8" stroke-width="1"/><text x="627" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#7a5aa8">verified</text><text x="627" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">复核</text><rect x="752" y="396" width="118" height="48" rx="6" fill="#f2f2f2" stroke="#5a6580" stroke-width="1"/><text x="763" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="600" text-anchor="start" fill="#5a6580">closed</text><text x="763" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.0" font-weight="500" text-anchor="start" fill="#2d3142">关闭</text><path d="M190,420.0 L198.256,420.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="202,420.0 197.251937510376,422.12035435590974 197.251937510376,417.87964564409026" fill="#5a6580" stroke="none"/><path d="M326,420.0 L334.256,420.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="338,420.0 333.251937510376,422.12035435590974 333.251937510376,417.87964564409026" fill="#5a6580" stroke="none"/><path d="M462,420.0 L470.256,420.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="474,420.0 469.251937510376,422.12035435590974 469.251937510376,417.87964564409026" fill="#5a6580" stroke="none"/><path d="M598,420.0 L606.256,420.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="610,420.0 605.251937510376,422.12035435590974 605.251937510376,417.87964564409026" fill="#5a6580" stroke="none"/><path d="M734,420.0 L742.256,420.0" fill="none" stroke="#5a6580" stroke-width="1.2"/><polygon points="746,420.0 741.251937510376,422.12035435590974 741.251937510376,417.87964564409026" fill="#5a6580" stroke="none"/><path d="M811,444 L811,474 L267,474" fill="none" stroke="#9a6a1f" stroke-width="1.0" stroke-dasharray="3 3"/><path d="M267,474 L267.0,447.6" fill="none" stroke="#9a6a1f" stroke-width="1.0" stroke-dasharray="3 3"/><polygon points="267,444 269.12035435590974,448.748062489624 264.87964564409026,448.748062489624" fill="#9a6a1f" stroke="none"/><text x="540" y="490" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="6.4" font-weight="400" text-anchor="middle" fill="#9a6a1f">delta sweep：定界之后的新投放，补扫进同一张 recall</text><rect x="72" y="508" width="190" height="34" rx="6" fill="#fafafa" stroke="#e6e6e6" stroke-width="1"/><text x="82" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="500" text-anchor="start" fill="#8a93a6">scope</text><text x="82" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" text-anchor="start" fill="#2d3142">9 min</text><rect x="278" y="508" width="190" height="34" rx="6" fill="#fafafa" stroke="#e6e6e6" stroke-width="1"/><text x="288" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="500" text-anchor="start" fill="#8a93a6">contain</text><text x="288" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" text-anchor="start" fill="#2d3142">42 min</text><rect x="484" y="508" width="190" height="34" rx="6" fill="#fafafa" stroke="#e6e6e6" stroke-width="1"/><text x="494" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="500" text-anchor="start" fill="#8a93a6">items</text><text x="494" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" text-anchor="start" fill="#2d3142">6</text><rect x="690" y="508" width="190" height="34" rx="6" fill="#fafafa" stroke="#e6e6e6" stroke-width="1"/><text x="700" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="500" text-anchor="start" fill="#8a93a6">completeness</text><text x="700" y="536" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" font-weight="600" text-anchor="start" fill="#2d3142">100%</text><text x="60" y="592" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#5a6580">状态推进要有 owner、截止时间和证据；只发一张「已下架」截图，不算完成召回。</text></svg>