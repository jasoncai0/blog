<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="td dd" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="td">从概率分布到下一个 token，中间有三步</title><desc id="dd">三步是串行的：先缩放锐度，再截断长尾，最后在剩下的核里采样</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DECODING · THREE STEPS</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">从概率分布到下一个 token，中间有三步</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">三步是串行的：先缩放锐度，再截断长尾，最后在剩下的核里采样</text>
<text x="46" y="140"  font-size="9.6" font-weight="600" text-anchor="start" fill="#3d5a80">原始分布</text><text x="46" y="156"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">softmax 之后的分布</text><text x="46" y="168"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">长尾很长</text><rect x="140" y="132" width="38" height="96" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="192" y="154" width="38" height="74" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="244" y="170" width="38" height="58" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="296" y="186" width="38" height="42" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="348" y="198" width="38" height="30" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="400" y="206" width="38" height="22" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="452" y="213" width="38" height="15" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><rect x="504" y="218" width="38" height="10" rx="1.5" fill="#dbe3ee" stroke="#3d5a80" stroke-width="0.8"/><line x1="130" y1="228" x2="572" y2="228" stroke="#c3c9d4" stroke-width="1"/><text x="46" y="260"  font-size="9.6" font-weight="600" text-anchor="start" fill="#a8752a">温度缩放</text><text x="46" y="276"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">温度 1.6 拉平</text><text x="46" y="288"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">长尾被抬起来</text><rect x="140" y="278" width="38" height="70" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="192" y="284" width="38" height="64" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="244" y="291" width="38" height="57" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="296" y="298" width="38" height="50" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="348" y="305" width="38" height="43" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="400" y="312" width="38" height="36" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="452" y="318" width="38" height="30" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><rect x="504" y="322" width="38" height="26" rx="1.5" fill="#f2ece2" stroke="#a8752a" stroke-width="0.8"/><line x1="130" y1="348" x2="572" y2="348" stroke="#c3c9d4" stroke-width="1"/><text x="46" y="380"  font-size="9.6" font-weight="600" text-anchor="start" fill="#2f6f5e">top-p 截断</text><text x="46" y="396"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">累积到 0.9 截断</text><text x="46" y="408"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">其余丢弃</text><rect x="140" y="398" width="38" height="70" rx="1.5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.8"/><rect x="192" y="404" width="38" height="64" rx="1.5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.8"/><rect x="244" y="411" width="38" height="57" rx="1.5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.8"/><rect x="296" y="418" width="38" height="50" rx="1.5" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="0.8"/><rect x="348" y="446" width="38" height="22" rx="1.5" fill="#eceef2" stroke="#d5d8e0" stroke-dasharray="3 3"/><text x="367" y="460"  font-size="6.8" font-weight="400" text-anchor="middle" fill="#8a93a6">丢弃</text><rect x="400" y="446" width="38" height="22" rx="1.5" fill="#eceef2" stroke="#d5d8e0" stroke-dasharray="3 3"/><text x="419" y="460"  font-size="6.8" font-weight="400" text-anchor="middle" fill="#8a93a6">丢弃</text><rect x="452" y="446" width="38" height="22" rx="1.5" fill="#eceef2" stroke="#d5d8e0" stroke-dasharray="3 3"/><text x="471" y="460"  font-size="6.8" font-weight="400" text-anchor="middle" fill="#8a93a6">丢弃</text><rect x="504" y="446" width="38" height="22" rx="1.5" fill="#eceef2" stroke="#d5d8e0" stroke-dasharray="3 3"/><text x="523" y="460"  font-size="6.8" font-weight="400" text-anchor="middle" fill="#8a93a6">丢弃</text><line x1="130" y1="468" x2="572" y2="468" stroke="#c3c9d4" stroke-width="1"/><line x1="393" y1="360" x2="393" y2="468" stroke="#2f6f5e" stroke-width="1" stroke-dasharray="4 3"/><text x="402" y="372"  font-size="7.2" font-weight="500" text-anchor="start" fill="#2f6f5e">切在这里</text><rect x="620" y="118" width="294" height="230" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="636" y="142"  font-size="9.6" font-weight="600" text-anchor="start" fill="#2d3142">三个参数管什么</text><text x="636" y="168"  font-size="8.8" font-weight="600" text-anchor="start" fill="#a8752a">温度 temperature</text><text x="636" y="183"  font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">缩放分布锐度，越高越散</text><text x="636" y="197"  font-size="7.8" font-weight="400" text-anchor="start" fill="#8a93a6">0.2 稳 / 1.0 常规 / 1.5 发散</text><text x="636" y="232"  font-size="8.8" font-weight="600" text-anchor="start" fill="#2f6f5e">top-p</text><text x="636" y="247"  font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">按累积概率截断，自适应</text><text x="636" y="261"  font-size="7.8" font-weight="400" text-anchor="start" fill="#8a93a6">0.9 左右，别乱动</text><text x="636" y="296"  font-size="8.8" font-weight="600" text-anchor="start" fill="#5b4b8a">top-k</text><text x="636" y="311"  font-size="7.8" font-weight="400" text-anchor="start" fill="#4f5d75">固定保留前 K 个</text><text x="636" y="325"  font-size="7.8" font-weight="400" text-anchor="start" fill="#8a93a6">通常不设，交给 top-p</text><rect x="620" y="362" width="294" height="86" rx="4" fill="#f7efe4" stroke="#e3c6bc"/><text x="636" y="384"  font-size="8.6" font-weight="600" text-anchor="start" fill="#bf4520">常见配置</text><text x="636" y="400"  font-size="8" font-weight="400" text-anchor="start" fill="#7a4a35">代码 / 精确问答 0–0.2</text><text x="636" y="414"  font-size="8" font-weight="400" text-anchor="start" fill="#7a4a35">日常对话 0.5–0.7</text><text x="636" y="428"  font-size="8" font-weight="400" text-anchor="start" fill="#7a4a35">创意写作 0.8–1.2</text><rect x="46" y="482" width="868" height="62" rx="3" fill="#e9eff6" stroke="#c9d6e6"/><text x="62" y="501"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">三个参数是叠加约束，不是加法</text><text x="62" y="518"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">同时调高温度又压低 top-p，等于先拉平再砍尾，输出既不稳也不可复现。默认做法是只调温度，top-p 保持 0.9 左右，top-k 不设。</text></svg>