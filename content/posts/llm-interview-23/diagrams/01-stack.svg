<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="ta da" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="ta">四层各管一段，别答成四个竞品</title><desc id="da">越往下越接近模型内部，越往上越接近用法</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">FOUR LAYERS · 23 QUESTIONS</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">四层各管一段，别答成四个竞品</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">越往下越接近模型内部，越往上越接近用法</text>
<rect x="46" y="118" width="620" height="92" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="126" width="3.5" height="76" rx="1.75" fill="#3d5a80"/><text x="64" y="144" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="500" text-anchor="start" fill="#8a93a6">L3</text><text x="100" y="145"  font-size="11.4" font-weight="600" text-anchor="start" fill="#2d3142">应用层 · 怎么用</text><text x="64" y="170"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">Prompt 怎么写、要不要 CoT、要不要检索、要不要工具</text><text x="64" y="192"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应题目：Q15 · Q16</text><text x="646" y="145"  font-size="7.6" font-weight="400" text-anchor="end" fill="#8a93a6">用法</text><rect x="46" y="218" width="620" height="92" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="226" width="3.5" height="76" rx="1.75" fill="#5b4b8a"/><text x="64" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="500" text-anchor="start" fill="#8a93a6">L2</text><text x="100" y="245"  font-size="11.4" font-weight="600" text-anchor="start" fill="#2d3142">推理层 · 怎么算</text><text x="64" y="270"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">注意力怎么省显存、MoE 怎么激活、每个 token 怎么采样</text><text x="64" y="292"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应题目：Q11–Q14 · Q23</text><text x="646" y="245"  font-size="7.6" font-weight="400" text-anchor="end" fill="#8a93a6">执行</text><rect x="46" y="318" width="620" height="92" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="326" width="3.5" height="76" rx="1.75" fill="#2f6f5e"/><text x="64" y="344" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="500" text-anchor="start" fill="#8a93a6">L1</text><text x="100" y="345"  font-size="11.4" font-weight="600" text-anchor="start" fill="#2d3142">训练层 · 参数从哪来</text><text x="64" y="370"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">预训练读文本、SFT 学格式、对齐学偏好、微调改行为</text><text x="64" y="392"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应题目：Q5–Q10 · Q22</text><text x="646" y="345"  font-size="7.6" font-weight="400" text-anchor="end" fill="#8a93a6">生产</text><rect x="46" y="418" width="620" height="92" rx="3" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="426" width="3.5" height="76" rx="1.75" fill="#a8752a"/><text x="64" y="444" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.6" font-weight="500" text-anchor="start" fill="#8a93a6">L0</text><text x="100" y="445"  font-size="11.4" font-weight="600" text-anchor="start" fill="#2d3142">底座 · 怎么表示</text><text x="64" y="470"  font-size="8.4" font-weight="400" text-anchor="start" fill="#6b7280">Tokenizer 切子词、位置编码注入顺序、Transformer 怎么混信息</text><text x="64" y="492"  font-size="7.6" font-weight="400" text-anchor="start" fill="#8a93a6">对应题目：Q1–Q4</text><text x="646" y="445"  font-size="7.6" font-weight="400" text-anchor="end" fill="#8a93a6">表示</text><text x="700" y="140"  font-size="8.6" font-weight="600" text-anchor="start" fill="#8a93a6">一句话</text><text x="700" y="160"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">下面三层是模型，</text><text x="700" y="174"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">上面一层是用法。</text><text x="700" y="188"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">面试问「为什么慢」，</text><text x="700" y="202"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">答案多半在 L1 或 L2，</text><text x="700" y="216"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">不在 L3。</text><text x="700" y="250"  font-size="8.6" font-weight="600" text-anchor="start" fill="#8a93a6">常见错答</text><text x="700" y="268"  font-size="7.8" font-weight="400" text-anchor="start" fill="#9b4b52">「Transformer 就是大模型」</text><text x="700" y="283"  font-size="7.8" font-weight="400" text-anchor="start" fill="#9b4b52">「微调能让模型学会新知识」</text><text x="700" y="298"  font-size="7.8" font-weight="400" text-anchor="start" fill="#9b4b52">「调高温度模型更聪明」</text><text x="700" y="313"  font-size="7.8" font-weight="400" text-anchor="start" fill="#9b4b52">「量化只影响显存不影响效果」</text><rect x="46" y="528" width="868" height="66" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="547"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">读法：题目编号固定，落点随题移动</text><text x="62" y="564"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">问「为什么长上下文贵」在 L2，问「为什么微调后变笨」在 L1，问「为什么输出重复」在 L2。同一句话在不同层被问，要换一套答法。</text></svg>