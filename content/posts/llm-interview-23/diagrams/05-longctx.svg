<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="te de" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="te">装得下，不等于用得好</title><desc id="de">横轴是证据在上下文里的位置，纵轴是模型找得到并据此答对的概率</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">LOST IN THE MIDDLE</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">装得下，不等于用得好</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">横轴是证据在上下文里的位置，纵轴是模型找得到并据此答对的概率</text>
<line x1="128" y1="400" x2="600" y2="400" stroke="#c3c9d4" stroke-width="1"/><line x1="128" y1="400" x2="128" y2="150" stroke="#c3c9d4" stroke-width="1"/><line x1="128" y1="400" x2="600" y2="400" stroke="#e6e8ee" stroke-width="1"/><text x="118" y="403"  font-size="7.4" font-weight="400" text-anchor="end" fill="#8a93a6">0%</text><line x1="128" y1="337.5" x2="600" y2="337.5" stroke="#e6e8ee" stroke-width="1"/><text x="118" y="340.5"  font-size="7.4" font-weight="400" text-anchor="end" fill="#8a93a6">25%</text><line x1="128" y1="275.0" x2="600" y2="275.0" stroke="#e6e8ee" stroke-width="1"/><text x="118" y="278.0"  font-size="7.4" font-weight="400" text-anchor="end" fill="#8a93a6">50%</text><line x1="128" y1="212.5" x2="600" y2="212.5" stroke="#e6e8ee" stroke-width="1"/><text x="118" y="215.5"  font-size="7.4" font-weight="400" text-anchor="end" fill="#8a93a6">75%</text><line x1="128" y1="150.0" x2="600" y2="150.0" stroke="#e6e8ee" stroke-width="1"/><text x="118" y="153.0"  font-size="7.4" font-weight="400" text-anchor="end" fill="#8a93a6">100%</text><text x="56" y="138"  font-size="7.6" font-weight="500" text-anchor="start" fill="#8a93a6">召回率</text><text x="170" y="418"  font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">开头</text><line x1="170" y1="400" x2="170" y2="405" stroke="#c3c9d4" stroke-width="1"/><text x="268" y="418"  font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">25%</text><line x1="268" y1="400" x2="268" y2="405" stroke="#c3c9d4" stroke-width="1"/><text x="364" y="418"  font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">中间 50%</text><line x1="364" y1="400" x2="364" y2="405" stroke="#c3c9d4" stroke-width="1"/><text x="458" y="418"  font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">75%</text><line x1="458" y1="400" x2="458" y2="405" stroke="#c3c9d4" stroke-width="1"/><text x="556" y="418"  font-size="7.8" font-weight="400" text-anchor="middle" fill="#8a93a6">结尾</text><line x1="556" y1="400" x2="556" y2="405" stroke="#c3c9d4" stroke-width="1"/><polyline points="170,200.0 268,260.0 364,300.0 458,265.0 556,205.0" fill="none" stroke="#a8752a" stroke-width="1.8" stroke-dasharray="5 4"/><polyline points="170,165.0 268,215.0 364,260.0 458,222.5 556,167.5" fill="none" stroke="#3d5a80" stroke-width="1.8"/><circle cx="170" cy="165.0" r="3" fill="#3d5a80"/><circle cx="268" cy="215.0" r="3" fill="#3d5a80"/><circle cx="364" cy="260.0" r="3" fill="#3d5a80"/><circle cx="458" cy="222.5" r="3" fill="#3d5a80"/><circle cx="556" cy="167.5" r="3" fill="#3d5a80"/><circle cx="170" cy="200.0" r="2.6" fill="#ffffff" stroke="#a8752a" stroke-width="1.4"/><circle cx="268" cy="260.0" r="2.6" fill="#ffffff" stroke="#a8752a" stroke-width="1.4"/><circle cx="364" cy="300.0" r="2.6" fill="#ffffff" stroke="#a8752a" stroke-width="1.4"/><circle cx="458" cy="265.0" r="2.6" fill="#ffffff" stroke="#a8752a" stroke-width="1.4"/><circle cx="556" cy="205.0" r="2.6" fill="#ffffff" stroke="#a8752a" stroke-width="1.4"/><line x1="130" y1="130" x2="150" y2="130" stroke="#3d5a80" stroke-width="2"/><text x="156" y="133" font-size="7.8" font-weight="500" fill="#3d5a80">无干扰：首尾高，中间塌</text><line x1="400" y1="130" x2="420" y2="130" stroke="#a8752a" stroke-width="2" stroke-dasharray="5 4"/><text x="426" y="133" font-size="7.8" font-weight="500" fill="#a8752a">强干扰：整体压低，中间最差</text><rect x="620" y="118" width="294" height="300" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="636" y="142"  font-size="9.6" font-weight="600" text-anchor="start" fill="#2d3142">为什么会塌</text><text x="636" y="166"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">· 训练时见过的长度偏短</text><text x="636" y="186"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">· 注意力本身带位置偏置</text><text x="636" y="206"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">· 无关内容稀释注意力</text><text x="636" y="226"  font-size="8.2" font-weight="400" text-anchor="start" fill="#4f5d75">· 跨段整合随距离变难</text><text x="636" y="262"  font-size="8.2" font-weight="600" text-anchor="start" fill="#bf4520">不是只怪位置编码</text><text x="636" y="280"  font-size="7.8" font-weight="400" text-anchor="start" fill="#6b7280">窗口大只是输入上限，</text><text x="636" y="294"  font-size="7.8" font-weight="400" text-anchor="start" fill="#6b7280">能不能用好看的是有效上下文。</text><rect x="636" y="312" width="262" height="88" rx="3" fill="#e9eff6"/><text x="648" y="332"  font-size="7.8" font-weight="600" text-anchor="start" fill="#3d5a80">一句话</text><text x="648" y="348"  font-size="7.6" font-weight="400" text-anchor="start" fill="#40566f">200K 是容量，不是质量；</text><text x="648" y="362"  font-size="7.6" font-weight="400" text-anchor="start" fill="#40566f">答「中间那段怎么找回来」</text><text x="648" y="376"  font-size="7.6" font-weight="400" text-anchor="start" fill="#40566f">才算是答到点上。</text><rect x="46" y="446" width="868" height="76" rx="3" fill="#e9eff6" stroke="#c9d6e6"/><text x="62" y="466"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">工程上先做减量，再做布局</text><text x="62" y="483"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">检索重排只留相关片段，用结构化摘要和分区替代整篇塞入，关键约束放开头或结尾；上线前用「不同长度 × 不同证据位置」的测试集验证。</text><text x="62" y="500"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">只拿「窗口 200K」当卖点，答不了「中间那段怎么找回来」。</text></svg>