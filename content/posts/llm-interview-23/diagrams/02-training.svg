<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="tb db" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="tb">三个阶段，三种数据，三个目标</title><desc id="db">缺一段模型就用不起来，这是最常见的一句追问</desc>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="46" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">THREE STAGES · ONE MODEL</text>
<text x="46" y="68" font-size="16" font-weight="600" fill="#2d3142">三个阶段，三种数据，三个目标</text>
<text x="46" y="90" font-size="9" fill="#8a93a6">缺一段模型就用不起来，这是最常见的一句追问</text>
<rect x="46" y="118" width="276" height="290" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="46" y="118" width="276" height="36" rx="4" fill="#e9eff6"/><rect x="46" y="146" width="276" height="8" fill="#e9eff6"/><text x="62" y="141" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#3d5a80">1</text><text x="80" y="141"  font-size="11.6" font-weight="600" text-anchor="start" fill="#3d5a80">预训练</text><text x="62" y="169"  font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6">读万卷书</text><text x="62" y="196"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">数据形态</text><text x="62" y="211"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">无标注连续文本，几万亿 token</text><text x="62" y="225"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">来自网页、书、代码</text><text x="62" y="252"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">训练目标</text><text x="62" y="267"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">预测下一个 token</text><text x="62" y="292"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">产物</text><text x="62" y="307"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">基础模型：语言与知识</text><text x="62" y="336"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">算力占比</text><text x="62" y="352"  font-size="8.4" font-weight="600" text-anchor="start" fill="#3d5a80">≈ 95%</text><rect x="62" y="362" width="212" height="7" rx="1.5" fill="#e8e9ee"/><rect x="62" y="362" width="201" height="7" rx="1.5" fill="#3d5a80"/><rect x="340" y="118" width="276" height="290" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="340" y="118" width="276" height="36" rx="4" fill="#e9f2ed"/><rect x="340" y="146" width="276" height="8" fill="#e9f2ed"/><text x="356" y="141" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#2f6f5e">2</text><text x="374" y="141"  font-size="11.6" font-weight="600" text-anchor="start" fill="#2f6f5e">SFT</text><text x="356" y="169"  font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6">学会问答</text><text x="356" y="196"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">数据形态</text><text x="356" y="211"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">指令-输入-期望输出三元组</text><text x="356" y="225"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">几万到几十万条</text><text x="356" y="252"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">训练目标</text><text x="356" y="267"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">给定指令，生成期望回答</text><text x="356" y="292"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">产物</text><text x="356" y="307"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">指令模型：学会跟随格式</text><text x="356" y="336"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">算力占比</text><text x="356" y="352"  font-size="8.4" font-weight="600" text-anchor="start" fill="#2f6f5e">≈ 4%</text><rect x="356" y="362" width="212" height="7" rx="1.5" fill="#e8e9ee"/><rect x="356" y="362" width="8" height="7" rx="1.5" fill="#2f6f5e"/><rect x="634" y="118" width="276" height="290" rx="4" fill="#ffffff" stroke="#d8d8d8"/><rect x="634" y="118" width="276" height="36" rx="4" fill="#f2ece2"/><rect x="634" y="146" width="276" height="8" fill="#f2ece2"/><text x="650" y="141" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" font-weight="600" text-anchor="start" fill="#a8752a">3</text><text x="668" y="141"  font-size="11.6" font-weight="600" text-anchor="start" fill="#a8752a">对齐</text><text x="650" y="169"  font-size="8" font-weight="400" text-anchor="start" fill="#8a93a6">好好说话</text><text x="650" y="196"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">数据形态</text><text x="650" y="211"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">同一问题的好回答与差回答</text><text x="650" y="225"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">偏好对，量小但标注贵</text><text x="650" y="252"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">训练目标</text><text x="650" y="267"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">让输出更符合人类偏好</text><text x="650" y="292"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">产物</text><text x="650" y="307"  font-size="8.1" font-weight="400" text-anchor="start" fill="#4f5d75">对齐模型：边界与风格</text><text x="650" y="336"  font-size="7.2" font-weight="400" text-anchor="start" fill="#8a93a6">算力占比</text><text x="650" y="352"  font-size="8.4" font-weight="600" text-anchor="start" fill="#a8752a">≈ 1%</text><rect x="650" y="362" width="212" height="7" rx="1.5" fill="#e8e9ee"/><rect x="650" y="362" width="6" height="7" rx="1.5" fill="#a8752a"/><line x1="330" y1="268" x2="342" y2="268" stroke="#c3c9d4" stroke-width="1"/><polygon points="348,268 341,264.4 341,271.6" fill="#c3c9d4"/><line x1="624" y1="268" x2="636" y2="268" stroke="#c3c9d4" stroke-width="1"/><polygon points="642,268 635,264.4 635,271.6" fill="#c3c9d4"/><rect x="46" y="438" width="868" height="70" rx="3" fill="#e9eff6" stroke="#c9d6e6" stroke-width="1"/><text x="62" y="457"  font-size="9" font-weight="600" text-anchor="start" fill="#3d5a80">为什么不能跳步</text><text x="62" y="474"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">预训练模型只会续写，问它问题它会接着编；只做 SFT，格式立住了但边界没了，遇到不该答的也答；没有 SFT 直接对齐，格式本身就不稳。</text><text x="62" y="489"  font-size="8.4" font-weight="400" text-anchor="start" fill="#40566f">能力天花板由预训练决定，后面的阶段只能把它引导出来，不能把它拉高。</text></svg>