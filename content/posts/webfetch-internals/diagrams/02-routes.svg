<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f2t f2d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f2t">Web Fetch 的三条技术路线</title>
<desc id="f2d">左：静态 HTTP 加 Readability 提纯。中：无头浏览器渲染后取 DOM。右：调用托管 Reader API。三条路线在拿到 HTML 之后汇合到提纯、转写与预算；差别在渲染在哪发生、成本谁付。</desc>
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="40" y="34" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">WEB FETCH / THREE ROUTES</text>
<text x="40" y="60" font-size="16" font-weight="600" fill="#2d3142">三条路线，差别在渲染发生在哪、成本由谁付</text>
<text x="40" y="82" font-size="10.5" fill="#5a6580">拿到 HTML 之后是同一套工序；选型实际在选「谁执行 JS」和「谁承担失败」</text>

<!-- A 静态 -->
<rect x="40" y="120" width="272" height="340" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="120" width="272" height="36" fill="#e9eff6"/>
<rect x="40" y="120" width="4" height="36" fill="#3d5a80"/>
<text x="58" y="143" font-size="11" font-weight="600" fill="#2d3142">静态 HTTP</text>
<text x="150" y="143" font-size="8.5" fill="#5a6580">最快、最省</text>

<rect x="54" y="172" width="244" height="44" fill="#f7f9fc" stroke="#3d5a80" stroke-width="1"/>
<text x="66" y="190" font-size="9.5" font-weight="600" fill="#2d3142">httpx / requests GET</text>
<text x="66" y="205" font-size="8.5" fill="#5a6580">UA、超时、5 MB 上限</text>

<rect x="54" y="224" width="244" height="44" fill="#f7f9fc" stroke="#3d5a80" stroke-width="1"/>
<text x="66" y="242" font-size="9.5" font-weight="600" fill="#2d3142">解析 HTML</text>
<text x="66" y="257" font-size="8.5" fill="#5a6580">lxml / BeautifulSoup</text>

<rect x="54" y="276" width="244" height="44" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
<text x="66" y="294" font-size="9.5" font-weight="600" fill="#2d3142">Readability 打分</text>
<text x="66" y="309" font-size="8.5" fill="#5a6580">正文容器 + 兄弟节点</text>

<rect x="54" y="328" width="244" height="44" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
<text x="66" y="346" font-size="9.5" font-weight="600" fill="#2d3142">markdownify</text>
<text x="66" y="361" font-size="8.5" fill="#5a6580">ATX 标题、围栏代码</text>

<text x="66" y="394" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">→ Markdown 文本</text>
<text x="54" y="428" font-size="8.5" fill="#9b4b52">失败：SPA 空白页、登录墙、403</text>
<text x="54" y="443" font-size="8.5" fill="#5a6580">延迟：一次往返 + 解析</text>

<!-- B 浏览器 -->
<rect x="344" y="120" width="272" height="340" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="344" y="120" width="272" height="36" fill="#efeaf6"/>
<rect x="344" y="120" width="4" height="36" fill="#5b4b8a"/>
<text x="362" y="143" font-size="11" font-weight="600" fill="#2d3142">无头浏览器</text>
<text x="462" y="143" font-size="8.5" fill="#5a6580">覆盖最全</text>

<rect x="358" y="172" width="244" height="44" fill="#f7f9fc" stroke="#5b4b8a" stroke-width="1"/>
<text x="370" y="190" font-size="9.5" font-weight="600" fill="#2d3142">启动 Chromium</text>
<text x="370" y="205" font-size="8.5" fill="#5a6580">Playwright / CDP</text>

<rect x="358" y="224" width="244" height="44" fill="#f7f9fc" stroke="#5b4b8a" stroke-width="1"/>
<text x="370" y="242" font-size="9.5" font-weight="600" fill="#2d3142">等页面稳定</text>
<text x="370" y="257" font-size="8.5" fill="#5a6580">networkidle / 选择器出现</text>

<rect x="358" y="276" width="244" height="44" fill="#f7f9fc" stroke="#5b4b8a" stroke-width="1"/>
<text x="370" y="294" font-size="9.5" font-weight="600" fill="#2d3142">取 DOM 或 a11y tree</text>
<text x="370" y="309" font-size="8.5" fill="#5a6580">JS 注入后的内容</text>

<rect x="358" y="328" width="244" height="44" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
<text x="370" y="346" font-size="9.5" font-weight="600" fill="#2d3142">同一套提纯</text>
<text x="370" y="361" font-size="8.5" fill="#5a6580">Readability → Markdown</text>

<text x="370" y="394" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">→ Markdown + 截图</text>
<text x="358" y="428" font-size="8.5" fill="#9b4b52">失败：验证码、挂起、内存</text>
<text x="358" y="443" font-size="8.5" fill="#5a6580">延迟：秒级到十秒级</text>

<!-- C Reader API -->
<rect x="648" y="120" width="272" height="340" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="648" y="120" width="272" height="36" fill="#e9f2ed"/>
<rect x="648" y="120" width="4" height="36" fill="#2f6f5e"/>
<text x="666" y="143" font-size="11" font-weight="600" fill="#2d3142">Reader API</text>
<text x="752" y="143" font-size="8.5" fill="#5a6580">最省运维</text>

<rect x="662" y="172" width="244" height="44" fill="#f7f9fc" stroke="#2f6f5e" stroke-width="1"/>
<text x="674" y="190" font-size="9.5" font-weight="600" fill="#2d3142">GET r.jina.ai/&lt;url&gt;</text>
<text x="674" y="205" font-size="8.5" fill="#5a6580">一次 HTTPS 请求</text>

<rect x="662" y="224" width="244" height="44" fill="#f7f9fc" stroke="#2f6f5e" stroke-width="1"/>
<text x="674" y="242" font-size="9.5" font-weight="600" fill="#2d3142">供应商渲染与提纯</text>
<text x="674" y="257" font-size="8.5" fill="#5a6580">引擎、等待、代理可选</text>

<rect x="662" y="276" width="244" height="44" fill="#f7f9fc" stroke="#2f6f5e" stroke-width="1"/>
<text x="674" y="294" font-size="9.5" font-weight="600" fill="#2d3142">返回 text 或 JSON</text>
<text x="674" y="309" font-size="8.5" fill="#5a6580">url / title / content / 时间戳</text>

<rect x="662" y="328" width="244" height="44" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1"/>
<text x="674" y="346" font-size="9.5" font-weight="600" fill="#2d3142">本地只剩预算</text>
<text x="674" y="361" font-size="8.5" fill="#5a6580">X-Token-Budget 超限即失败</text>

<text x="674" y="394" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" fill="#2f6f5e">→ Markdown / JSON</text>
<text x="662" y="428" font-size="8.5" fill="#9b4b52">失败：限流、故障、数据出境</text>
<text x="662" y="443" font-size="8.5" fill="#5a6580">延迟：官方标 7.9 s 平均</text>

<path d="M176 460 V486" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>
<path d="M480 460 V486" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>
<path d="M784 460 V486" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f2a)"/>

<rect x="40" y="490" width="880" height="78" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="490" width="4" height="78" fill="#2d3142"/>
<text x="62" y="514" font-size="11" font-weight="600" fill="#2d3142">汇合点：HTML 之后的工序是共用的</text>
<text x="62" y="534" font-size="9.5" fill="#4f5d75">提纯、转写、预算、回注四段不因路线改变；改变的只有「HTML 从哪来」和「渲染成本由谁付」。</text>
<text x="62" y="552" font-size="9.5" fill="#4f5d75">所以选型可以先定这三段的实现，再单独换抓取层；反过来把提纯写进抓取层，换路线就得重写。</text>

<text x="40" y="600" font-size="8.5" fill="#5a6580">Rate limit 与延迟数字取自 Jina Reader 官方文档；静态与浏览器两列是量级估计，不是同一台机器的基准测试。</text>
</svg>
