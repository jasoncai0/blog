<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="f3t f3d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f3t">一次 WebFetch 调用的时序：缓存、抓取、小模型</title>
<desc id="f3d">主 Agent 调用 fetch 工具，工具先查缓存；未命中则抓取源站，把 HTML 转成 Markdown 并取前 100000 字符，交给独立小模型按调用方的 prompt 作答，最后只把答案回给主 Agent，同时写入缓存。</desc>
<defs>
  <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="620" fill="#f5f5f5"/>

<text x="40" y="34" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">WEB FETCH / SEQUENCE</text>
<text x="40" y="60" font-size="16" font-weight="600" fill="#2d3142">主模型只拿到答案，页面留在工具侧</text>
<text x="40" y="82" font-size="10.5" fill="#5a6580">按 Claude Code 文档描述的行为画：15 分钟缓存、100,000 字符、独立的小模型调用</text>

<rect x="40" y="112" width="120" height="32" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="100" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">主 Agent</text>
<rect x="250" y="112" width="120" height="32" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="310" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">fetch 工具</text>
<rect x="455" y="112" width="120" height="32" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<text x="515" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">缓存</text>
<rect x="645" y="112" width="120" height="32" fill="#f7f9fc" stroke="#4f5d75" stroke-width="1.2"/>
<text x="705" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">源站</text>
<rect x="805" y="112" width="120" height="32" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="865" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#2d3142">小模型</text>

<line x1="100" y1="144" x2="100" y2="520" stroke="#c8cedb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="310" y1="144" x2="310" y2="520" stroke="#c8cedb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="515" y1="144" x2="515" y2="520" stroke="#c8cedb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="705" y1="144" x2="705" y2="520" stroke="#c8cedb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="865" y1="144" x2="865" y2="520" stroke="#c8cedb" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="100" y1="180" x2="306" y2="180" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="205" y="173" text-anchor="middle" font-size="8.5" fill="#5a6580">fetch(url, prompt)</text>

<line x1="310" y1="212" x2="511" y2="212" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="412" y="205" text-anchor="middle" font-size="8.5" fill="#5a6580">按 URL 查缓存</text>

<line x1="515" y1="244" x2="314" y2="244" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f3a)"/>
<text x="412" y="237" text-anchor="middle" font-size="8.5" fill="#5a6580">未命中</text>

<line x1="310" y1="278" x2="701" y2="278" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="507" y="271" text-anchor="middle" font-size="8.5" fill="#5a6580">GET（30 s/phase、5 MB 上限）</text>

<line x1="705" y1="310" x2="314" y2="310" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f3a)"/>
<text x="507" y="303" text-anchor="middle" font-size="8.5" fill="#5a6580">245 KB HTML</text>

<path d="M310 338 H338 V362 H312" fill="none" stroke="#5b4b8a" stroke-width="1.2" marker-end="url(#f3a)"/>
<text x="346" y="346" font-size="8.5" fill="#5a6580">Readability → Markdown</text>
<text x="346" y="359" font-size="8.5" fill="#5a6580">取前 100,000 字符</text>

<line x1="310" y1="402" x2="861" y2="402" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="590" y="395" text-anchor="middle" font-size="8.5" fill="#5a6580">全文 + prompt</text>

<line x1="865" y1="434" x2="314" y2="434" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f3a)"/>
<text x="590" y="427" text-anchor="middle" font-size="8.5" fill="#5a6580">答案（几百字）</text>

<line x1="310" y1="466" x2="511" y2="466" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f3a)"/>
<text x="412" y="459" text-anchor="middle" font-size="8.5" fill="#5a6580">存 Markdown（15 min）</text>

<line x1="310" y1="498" x2="104" y2="498" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#f3a)"/>
<text x="205" y="491" text-anchor="middle" font-size="8.5" fill="#2f6f5e">tool result：只有答案</text>

<rect x="40" y="540" width="880" height="62" fill="#ffffff" stroke="#e2e6ee"/>
<rect x="40" y="540" width="4" height="62" fill="#2f6f5e"/>
<text x="62" y="562" font-size="10.5" font-weight="600" fill="#2d3142">主上下文只增加第 10 步的几百字</text>
<text x="62" y="580" font-size="9.5" fill="#4f5d75">245 KB 原始 HTML、Markdown 全文、缓存副本都在工具侧。小模型读了 100k 字符，主模型读到的只是它按 prompt 提炼的答案。</text>
<text x="62" y="596" font-size="9.5" fill="#4f5d75">代价：主模型不知道自己没看到什么，换一个问题要重新调一次；收益：一次抓取只占几百 token。</text>

<text x="800" y="614" font-size="8" fill="#5a6580">实线 请求 · 虚线 返回</text>
</svg>
