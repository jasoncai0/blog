<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="f1t f1d" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif">
<title id="f1t">Web Fetch 的六段流水线</title>
<desc id="f1d">URL 准入、HTTP 取回、按 Content-Type 分流、正文提纯、HTML 转 Markdown、截断与回注六段。每段下方标注该段的典型失败模式；非 HTML 在分流后原样返回。</desc>
<defs>
  <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f5d75"/></marker>
</defs>
<rect width="960" height="470" fill="#f5f5f5"/>

<text x="40" y="34" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8.5" letter-spacing="1.6" fill="#5a6580">WEB FETCH / PIPELINE</text>
<text x="40" y="60" font-size="16" font-weight="600" fill="#2d3142">六段流水线，每段都能悄悄丢掉内容</text>
<text x="40" y="82" font-size="10.5" fill="#5a6580">每段各有失败模式；任何一段丢掉内容，模型都看不到，也不会报错</text>

<!-- 01 准入 -->
<rect x="30" y="120" width="140" height="104" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="44" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#3d5a80">01</text>
<text x="44" y="158" font-size="11" font-weight="600" fill="#2d3142">准入</text>
<text x="44" y="176" font-size="9" fill="#4f5d75">私网、回环地址拒绝</text>
<text x="44" y="191" font-size="9" fill="#4f5d75">域名规则决定放行</text>
<text x="44" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">10.0.0.0/8 拒绝</text>

<!-- 02 取回 -->
<rect x="182" y="120" width="140" height="104" fill="#e9eff6" stroke="#3d5a80" stroke-width="1.2"/>
<text x="196" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#3d5a80">02</text>
<text x="196" y="158" font-size="11" font-weight="600" fill="#2d3142">取回</text>
<text x="196" y="176" font-size="9" fill="#4f5d75">UA、超时、字节上限</text>
<text x="196" y="191" font-size="9" fill="#4f5d75">流式读，超限即断</text>
<text x="196" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">30 s/phase · 5 MB</text>

<!-- 03 分流 -->
<rect x="334" y="120" width="140" height="104" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="348" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5b4b8a">03</text>
<text x="348" y="158" font-size="11" font-weight="600" fill="#2d3142">分流</text>
<text x="348" y="176" font-size="9" fill="#4f5d75">HTML 进提纯</text>
<text x="348" y="191" font-size="9" fill="#4f5d75">PDF/JSON/文本原样</text>
<text x="348" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">text/html →</text>

<!-- 04 提纯 -->
<rect x="486" y="120" width="140" height="104" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="500" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5b4b8a">04</text>
<text x="500" y="158" font-size="11" font-weight="600" fill="#2d3142">提纯</text>
<text x="500" y="176" font-size="9" fill="#4f5d75">Readability 打分</text>
<text x="500" y="191" font-size="9" fill="#4f5d75">trafilatura 级联</text>
<text x="500" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">p → 祖先 ÷1/÷2</text>

<!-- 05 转写 -->
<rect x="638" y="120" width="140" height="104" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1.2"/>
<text x="652" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5b4b8a">05</text>
<text x="652" y="158" font-size="11" font-weight="600" fill="#2d3142">转写</text>
<text x="652" y="176" font-size="9" fill="#4f5d75">保留标题、列表、表格</text>
<text x="652" y="191" font-size="9" fill="#4f5d75">丢掉 class、style</text>
<text x="652" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">markdownify(ATX)</text>

<!-- 06 预算 -->
<rect x="790" y="120" width="140" height="104" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<text x="804" y="138" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#2f6f5e">06</text>
<text x="804" y="158" font-size="11" font-weight="600" fill="#2d3142">预算</text>
<text x="804" y="176" font-size="9" fill="#4f5d75">按字符数硬截</text>
<text x="804" y="191" font-size="9" fill="#4f5d75">留续读入口</text>
<text x="804" y="210" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="8" fill="#5a6580">max_length=5000</text>

<line x1="171" y1="172" x2="179" y2="172" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<line x1="323" y1="172" x2="331" y2="172" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<line x1="475" y1="172" x2="483" y2="172" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<line x1="627" y1="172" x2="635" y2="172" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>
<line x1="779" y1="172" x2="787" y2="172" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>

<text x="40" y="250" font-size="8.5" fill="#9b4b52">失败：校验后重解析 → 内网</text>
<text x="40" y="264" font-size="8.5" fill="#9b4b52">（DNS rebinding）</text>
<text x="192" y="250" font-size="8.5" fill="#9b4b52">失败：慢速滴流、重定向环</text>
<text x="192" y="264" font-size="8.5" fill="#9b4b52">压缩炸弹</text>
<text x="344" y="250" font-size="8.5" fill="#9b4b52">失败：类型谎报</text>
<text x="344" y="264" font-size="8.5" fill="#9b4b52">PDF 当 HTML 提纯</text>
<text x="496" y="250" font-size="8.5" fill="#9b4b52">失败：正文在无标签 div</text>
<text x="496" y="264" font-size="8.5" fill="#9b4b52">SSR 空白壳</text>
<text x="648" y="250" font-size="8.5" fill="#9b4b52">失败：表格错位</text>
<text x="648" y="264" font-size="8.5" fill="#9b4b52">代码围栏语言丢失</text>
<text x="800" y="250" font-size="8.5" fill="#9b4b52">失败：静默截断</text>
<text x="800" y="264" font-size="8.5" fill="#9b4b52">模型不知还有后文</text>

<!-- 回注 -->
<rect x="30" y="300" width="900" height="74" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1.2"/>
<rect x="30" y="300" width="4" height="74" fill="#2f6f5e"/>
<text x="54" y="326" font-size="11.5" font-weight="600" fill="#2d3142">回注：结果作为 untrusted 数据进入上下文</text>
<text x="54" y="346" font-size="9.5" fill="#4f5d75">页面里的「忽略之前的指令」是数据，不是指令；来源域名要跟着内容一起回注，权限提示才有依据。</text>
<text x="54" y="364" font-family="'Geist Mono','SFMono-Regular',ui-monospace,monospace" font-size="9" fill="#2f6f5e">Contents of https://example.com/post:</text>

<path d="M930 172 H946 V337 H934" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f1a)"/>

<text x="40" y="410" font-size="8.5" fill="#5a6580">缓存命中会跳过 02–05，直接到回注；非 HTML 在 03 分流后原样返回，不做提纯。</text>
<text x="40" y="428" font-size="8.5" fill="#5a6580">数字取自 modelcontextprotocol/servers 的 fetch server；245 KB → 5000 字符的压缩比约 49:1。</text>
</svg>
