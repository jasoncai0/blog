<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="f03-title f03-desc"><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker></defs>
<title id="f03-title">装载顺序</title>
<desc id="f03-desc">profile 选组合，bundle 给默认值，patch 按 id 覆盖，Loader 最后实例化。</desc>
<rect width="960" height="380" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLUGIN / LOAD ORDER</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">四层，每层都能替换</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">patch 替换的是整条 config，不是字段合并。</text>
<rect x="45" y="150" width="160" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="57" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">profile</text><text x="57" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">选 bundle 列表</text><line x1="207" y1="185" x2="231" y2="185" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="225" y="150" width="160" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="237" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">bundle</text><text x="237" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">默认 Config</text><line x1="387" y1="185" x2="411" y2="185" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="405" y="150" width="160" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="417" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">patch</text><text x="417" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">按 id 覆盖/插入</text><line x1="567" y1="185" x2="591" y2="185" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="585" y="150" width="160" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="597" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">Loader</text><text x="597" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">实例化与注入</text><line x1="747" y1="185" x2="771" y2="185" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f03-a)"/><rect x="765" y="150" width="160" height="70" rx="5" fill="#ffffff" stroke="#d8d8d8"/><text x="777" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.8" font-weight="600" fill="#2d3142">插件</text><text x="777" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">apply 执行</text><path d="M505,150 L505,106 L665,106 L665,146" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f03-a)"/><text x="520" y="98" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#bf4520">patch 命中后 Loader 重建实例</text><text x="45" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">patch 只按 id 匹配；改包名不会命中旧条目，会同时存在两份配置。</text><text x="45" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">插件不需要知道自己在第几层被替换，只需要保证 dispose 之后能重新 apply。</text><text x="40" y="362" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / LOAD ORDER</text>
</svg>
