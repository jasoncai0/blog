<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">四个导出，三条注册</title>
<desc id="f01-desc">配置在加载期校验，注册在 apply 里发生，卸载时按 disposer 逆序回收。</desc>
<rect width="960" height="356" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLUGIN / ANATOMY</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一个 function 插件的形状</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">样板来自 dsh-time-context。</text>
<rect x="60" y="116" width="220" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">package.json</text><text x="72" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">type: module</text><text x="72" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">peerDependencies</text><text x="72" y="181" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">dsh.bundle</text><rect x="340" y="116" width="250" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="352" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">exports</text><text x="352" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">name  · 诊断与 patch 定位</text><text x="352" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">inject  · 缺服务则不加载</text><text x="352" y="181" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">Config  · 加载期校验</text><text x="352" y="196" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">apply  · 唯一有副作用</text><rect x="650" y="116" width="250" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="662" y="136" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">runtime</text><text x="662" y="151" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.effect(disposer)</text><text x="662" y="166" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.on('agent/pre-step')</text><text x="662" y="181" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.tools.register()</text><line x1="282" y1="191" x2="336" y2="191" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="592" y1="191" x2="646" y2="191" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="60" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">混用 default 与命名导出会被 Loader 静默丢弃；没有 disposer 的注册在热重载后变成幽灵监听器。</text><line x1="0" y1="0" x2="0" y2="0" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="40" y="338" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / ANATOMY</text>
</svg>
