<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">三类扩展点</title>
<desc id="f02-desc">选错类型的症状很统一：重启后状态没了，或者模型看见了不该看见的东西。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLUGIN / EXTENSION POINTS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">事件、服务、会话事件</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">每类各有自己的「不要用」。</text>
<rect x="50" y="118" width="280" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="64" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142">事件</text><text x="64" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">agent/pre-step</text><text x="64" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">tools/pre-execute</text><text x="64" y="200" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">llm/stream</text><line x1="64" y1="230" x2="316" y2="230" stroke="#d8d8d8"/><text x="64" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">用来</text><text x="64" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">观察与改写</text><text x="64" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">不要用来</text><text x="64" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">改 system prompt 文本</text><rect x="342" y="118" width="280" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="356" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142">服务注册</text><text x="356" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">ctx.tools.register</text><text x="356" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">ctx.set(新 seam)</text><line x1="356" y1="230" x2="608" y2="230" stroke="#d8d8d8"/><text x="356" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">用来</text><text x="356" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">提供能力</text><text x="356" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">不要用来</text><text x="356" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">直接改注册表</text><rect x="634" y="118" width="280" height="210" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="648" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#2d3142">会话事件</text><text x="648" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">SessionEventMap</text><text x="648" y="185" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">session.append</text><line x1="648" y1="230" x2="900" y2="230" stroke="#d8d8d8"/><text x="648" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">用来</text><text x="648" y="266" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#2d3142">持久与回放</text><text x="648" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#bf4520">不要用来</text><text x="648" y="308" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">内存 Map</text><text x="50" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">判断标准：会不会影响模型看到的内容。会，就必须落成会话事件；不会，才可以用内存或事件。</text><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / EXTENSION POINTS</text>
</svg>
