<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="f01-d1-title f01-d1-desc">
  <title id="f01-d1-title">工具边界的四层与一条 provider 围栏</title>
  <desc id="f01-d1-desc">从左到右依次是模型 schema、注册表过滤、审批、OS 沙箱，最右侧是 FS provider 的策略围栏；每层标出它能挡住的攻击面与典型旁路，说明四层不是同心圆。</desc>

  <defs>
    <marker id="f01-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f01-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">11 / BOUNDARIES</text>
  <text x="40" y="62" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">四层边界，各挡一段，谁也不能替代谁</text>
  <text x="40" y="84" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">从模型意图到内核效果；最右侧的 FS 围栏不在沙箱之内，它守的是另一条写入路径</text>

  <!-- axis -->
  <line x1="40" y1="112" x2="920" y2="112" stroke="#d8d8d8" stroke-width="1"/>
  <text x="40" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#8a93a6">MODEL SIDE</text>
  <text x="876" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#8a93a6">KERNEL SIDE</text>

  <!-- L1 -->
  <rect x="40" y="128" width="164" height="248" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="40" y="128" width="164" height="34" rx="6" fill="#fdf6f2" stroke="#d8d8d8"/>
  <text x="56" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">01 SCHEMA</text>
  <text x="56" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">模型 schema</text>
  <text x="56" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">模型“看得懂”的参数</text>
  <line x1="56" y1="220" x2="188" y2="220" stroke="#d8d8d8"/>
  <text x="56" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：非法形状</text>
  <text x="56" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：未宣传的参数</text>
  <text x="56" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：注入</text>
  <text x="56" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：语义滥用</text>
  <text x="56" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">schema 只是广告，</text>
  <text x="56" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">不是防火墙</text>
  <rect x="56" y="344" width="132" height="18" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="64" y="357" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">tool-bash comment</text>

  <line x1="206" y1="252" x2="226" y2="252" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <!-- L2 -->
  <rect x="228" y="128" width="164" height="248" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="228" y="128" width="164" height="34" rx="6" fill="#fdf6f2" stroke="#d8d8d8"/>
  <text x="244" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">02 REGISTRY</text>
  <text x="244" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">注册表过滤</text>
  <text x="244" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">可见性 + 执行时拒绝</text>
  <line x1="244" y1="220" x2="376" y2="220" stroke="#d8d8d8"/>
  <text x="244" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：能力暴露</text>
  <text x="244" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：子 agent 提权</text>
  <text x="244" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：已可见工具滥用</text>
  <text x="244" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：参数级越界</text>
  <text x="244" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">过滤 = 交集；</text>
  <text x="244" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">被过滤者 = 不存在</text>
  <rect x="244" y="344" width="132" height="18" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="252" y="357" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">UNKNOWN_TOOL</text>

  <line x1="394" y1="252" x2="414" y2="252" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <!-- L3 -->
  <rect x="416" y="128" width="164" height="248" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <rect x="416" y="128" width="164" height="34" rx="6" fill="#fdf6f2" stroke="#bf4520"/>
  <text x="432" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">03 APPROVAL</text>
  <text x="432" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">审批</text>
  <text x="432" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">一次性授权</text>
  <line x1="432" y1="220" x2="564" y2="220" stroke="#d8d8d8"/>
  <text x="432" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：单次高风险动作</text>
  <text x="432" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：越权升级</text>
  <text x="432" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：用户点错</text>
  <text x="432" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：批准后的参数变体</text>
  <text x="432" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">allowed-once；</text>
  <text x="432" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">只对本次 callId 有效</text>
  <rect x="432" y="344" width="132" height="18" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="440" y="357" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">allowed-once</text>

  <line x1="582" y1="252" x2="602" y2="252" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <!-- L4 -->
  <rect x="604" y="128" width="150" height="248" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="604" y="128" width="150" height="34" rx="6" fill="#fdf6f2" stroke="#d8d8d8"/>
  <text x="620" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#bf4520">04 SANDBOX</text>
  <text x="620" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">OS 沙箱</text>
  <text x="620" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">只约束进程</text>
  <line x1="620" y1="220" x2="738" y2="220" stroke="#d8d8d8"/>
  <text x="620" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：进程越界写</text>
  <text x="620" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：子进程逃逸</text>
  <text x="620" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：FS API</text>
  <text x="620" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：读取</text>
  <text x="620" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">Landlock / seccomp</text>
  <text x="620" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">网络不在承诺内</text>
  <rect x="620" y="344" width="118" height="18" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="628" y="357" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">confine(argv)</text>

  <!-- dashed sidecar -->
  <line x1="756" y1="252" x2="776" y2="252" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f01-a)"/>

  <rect x="778" y="128" width="142" height="248" rx="6" fill="#ffffff" stroke="#2f6f5e" stroke-dasharray="4 3"/>
  <rect x="778" y="128" width="142" height="34" rx="6" fill="#f2f8f6" stroke="#2f6f5e" stroke-dasharray="4 3"/>
  <text x="792" y="150" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.1em" fill="#2f6f5e">SIDECAR</text>
  <text x="792" y="186" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">FS 策略围栏</text>
  <text x="792" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">provider 层 containment</text>
  <line x1="792" y1="220" x2="906" y2="220" stroke="#d8d8d8"/>
  <text x="792" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：五个变更操作越界</text>
  <text x="792" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">挡住：resolve 后替换</text>
  <text x="792" y="278" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：恶意代码</text>
  <text x="792" y="294" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">挡不住：TOCTOU 残余</text>
  <text x="792" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">不是内核边界；</text>
  <text x="792" y="330" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">只管路径，不管代码</text>
  <rect x="792" y="344" width="112" height="18" rx="4" fill="#f5f5f5" stroke="#d8d8d8"/>
  <text x="800" y="357" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">checkedTarget</text>

  <!-- bottom: two write paths -->
  <text x="40" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">TWO WRITE PATHS</text>

  <rect x="40" y="426" width="424" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="56" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">进程路径：bash → spawn → 内核</text>
  <text x="56" y="466" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">confine 之后才把 argv 交给 spawn；越界写被内核拒绝，</text>
  <text x="56" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">stderr 出现 denial signature，再被分类成 denied。</text>
  <text x="56" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">04 SANDBOX 是这条路径的唯一边界</text>

  <rect x="496" y="426" width="424" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="512" y="448" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" fill="#2d3142">API 路径：write/edit → FileSystem</text>
  <text x="512" y="466" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">没有进程，沙箱没有机会介入；checkedTarget 重新 realpath，</text>
  <text x="512" y="480" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">对每个可写根做 isPathUnder 判定。</text>
  <text x="512" y="500" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#8a93a6">SIDECAR 是这条路径的唯一边界</text>

  <text x="40" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#8a93a6">四层不构成同心圆：任意一层单独存在，都有一条完整的旁路。判据是“这条路径经过了哪几层”。</text>
  <text x="40" y="578" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.08em" fill="#bf4520">DSH TOOL EXECUTION PLANE / 11</text>
</svg>
