<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">编排框架与 OpenCode 的对照</title>
  <desc id="d2-desc">左侧是典型多智能体框架的构件：调度器、共享黑板、消息总线、角色投票、任务图。右侧是 OpenCode 的替代物：人格、子会话、并行工具、后台任务、父子文本通道。</desc>

  <defs>
    <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">FRAMEWORK VS OPENCODE</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">左边是框架的构件，右边是它的替代物</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">不是"实现了同一套东西"，而是"用更小的原语解决了同一批问题"</text>

  <rect x="60" y="112" width="340" height="332" rx="8" fill="#ffffff" stroke="rgba(79,93,117,0.4)" stroke-width="1"/>
  <text x="76" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">TYPICAL ORCHESTRATION</text>

  <text x="76" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">调度器 / supervisor</text>
  <text x="76" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">拆任务、分配、汇总</text>

  <text x="76" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">共享黑板 / 全局状态</text>
  <text x="76" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">所有 agent 读写同一份工作区</text>

  <text x="76" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">消息总线 / 角色间通信</text>
  <text x="76" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">任意两个 agent 可以互相发消息</text>

  <text x="76" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">投票 / 辩论 / 互评</text>
  <text x="76" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">同一问题多个角色给意见</text>

  <text x="76" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">任务图 / 检查点</text>
  <text x="76" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">编排层持久化执行计划</text>

  <text x="76" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">这些构件在 OpenCode 里大多不存在</text>

  <!-- arrow -->
  <line x1="410" y1="278" x2="540" y2="278" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <text x="418" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">替代</text>

  <rect x="550" y="112" width="350" height="332" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
  <text x="566" y="138" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#bf4520">WHAT OPENCODE HAS</text>

  <text x="566" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">人格（agent）</text>
  <text x="566" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">system + 权限 + 模型，同一会话内可切</text>

  <text x="566" y="222" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">子会话（subagent 工具）</text>
  <text x="566" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">一层委派，进出只有文本</text>

  <text x="566" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">并行工具调用</text>
  <text x="566" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">同一步内 fork 多个 fiber</text>

  <text x="566" y="326" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">后台任务 + 合成消息</text>
  <text x="566" y="344" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">异步开工，完成再唤醒父会话</text>

  <text x="566" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">会话树（parentID）</text>
  <text x="566" y="396" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580">只用来算深度与恢复，不做调度</text>

  <text x="566" y="424" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#bf4520">调度由模型自己完成：它决定派谁、派几次</text>

  <text x="60" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">差别的本质：框架把"怎么协作"写成代码，OpenCode 把"要不要协作、跟谁协作"留给模型，只提供原语与约束。</text>
</svg>
