<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">两个会话改同一个文件</title>
  <desc id="d3-desc">会话 A 持锁完成读改写，会话 B 在锁上等待；B 拿到锁时读到的是 A 的结果，oldString 不再匹配，于是收到一次 ToolFailure 并重读重试。换成 write 则没有失败，只有静默覆盖。</desc>

  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">WRITE CONFLICT</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">冲突不以"覆盖"出现，以"一次失败"出现</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">锁只保证互斥；真正把冲突暴露出来的是"oldString 必须唯一匹配"这条规则</text>

  <!-- lanes -->
  <text x="60" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">会话 A</text>
  <text x="60" y="246" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">会话 B</text>

  <line x1="110" y1="150" x2="900" y2="150" stroke="rgba(79,93,117,0.25)" stroke-width="1"/>
  <line x1="110" y1="256" x2="900" y2="256" stroke="rgba(79,93,117,0.25)" stroke-width="1"/>

  <!-- A blocks -->
  <rect x="110" y="118" width="70" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="145" y="139" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">取锁</text>

  <rect x="180" y="118" width="80" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="139" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">读 v0</text>

  <rect x="260" y="118" width="130" height="32" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <text x="325" y="139" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">写 v1 + 格式化</text>

  <rect x="390" y="118" width="70" height="32" rx="4" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="425" y="139" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">释放</text>

  <!-- B blocks -->
  <rect x="110" y="224" width="160" height="32" rx="4" fill="#ececec" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="190" y="245" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">在锁上等待</text>

  <rect x="270" y="224" width="60" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="300" y="245" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">取锁</text>

  <rect x="330" y="224" width="80" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="370" y="245" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">读 v1</text>

  <rect x="410" y="224" width="190" height="32" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
  <text x="505" y="245" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">oldString 不匹配 → ToolFailure</text>

  <rect x="600" y="224" width="220" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="245" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">模型重读、重新生成编辑，再试一次</text>

  <!-- release divider -->
  <line x1="390" y1="104" x2="390" y2="270" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="396" y="100" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">A 释放锁</text>

  <!-- note -->
  <rect x="60" y="300" width="860" height="76" rx="6" fill="#ffffff" stroke="rgba(79,93,117,0.35)" stroke-width="0.8"/>
  <text x="76" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">IF IT WERE write</text>
  <text x="76" y="348" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">write 的 diff 预览读发生在锁外，提交才加锁——B 的写会静默覆盖 A，没有失败，只有丢改动。</text>
  <text x="76" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">所以"edit 比 write 安全"不只是语义更精确，而是它把并发冲突转成了可观测的失败。</text>

  <text x="60" y="412" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">锁是进程内的：外部编辑器的写入、shell 里的 sed -i/git apply，都不在这把锁的范围内。</text>
  <text x="60" y="432" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#bf4520">锁也管不了"不同但相关"的文件——那是语义冲突，只能靠任务拆分避免。</text>
</svg>
