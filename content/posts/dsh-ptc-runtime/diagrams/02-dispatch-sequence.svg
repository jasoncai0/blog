<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f02-d1-title f02-d1-desc">
  <title id="f02-d1-title">一次 PTC 子调用的时序</title>
  <desc id="f02-d1-desc">程序发起绑定调用后，有序车道先追加 tool/ptc-dispatch-start 再 prepare，工具函数体在车道上并发运行，结果先回到程序，随后 tool/ptc-dispatch 作为旁路记账写入同一 turn。</desc>

  <defs>
    <marker id="f02-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="f02-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f5e"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f5f5f5"/>

  <text x="40" y="34" font-family="'SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.12em" fill="#bf4520">S3 / PTC</text>
  <text x="40" y="62" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#2d3142">一次子调用穿过流水线的时序</text>
  <text x="40" y="84" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">有序阶段排在同一条车道上，只有函数体并发；程序先拿到值，日志随后补齐</text>

  <!-- participants -->
  <rect x="90" y="112" width="120" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="150" y="137" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">程序</text>

  <rect x="330" y="112" width="120" height="40" rx="6" fill="#ffffff" stroke="#bf4520"/>
  <text x="390" y="137" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">有序车道</text>

  <rect x="570" y="112" width="120" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="630" y="137" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">工具</text>

  <rect x="790" y="112" width="120" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="850" y="137" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142">会话日志</text>

  <!-- lifelines -->
  <line x1="150" y1="152" x2="150" y2="596" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="390" y1="152" x2="390" y2="596" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="630" y1="152" x2="630" y2="596" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="850" y1="152" x2="850" y2="596" stroke="#d8d8d8" stroke-width="1"/>

  <!-- activation bars -->
  <rect x="143" y="192" width="14" height="290" fill="#eceff3" stroke="#d8d8d8"/>
  <rect x="383" y="192" width="14" height="330" fill="#eceff3" stroke="#bf4520"/>
  <rect x="623" y="312" width="14" height="130" fill="#eceff3" stroke="#d8d8d8"/>
  <rect x="843" y="502" width="14" height="88" fill="#eceff3" stroke="#d8d8d8"/>

  <!-- 1 invoke -->
  <line x1="154" y1="204" x2="382" y2="204" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <text x="268" y="196" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">tools.read_file(args)</text>

  <!-- 2 lane note -->
  <rect x="302" y="228" width="176" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="318" y="248" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#2d3142">append start 事件</text>
  <text x="318" y="264" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">prepare 在车道内等</text>
  <text x="318" y="278" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">下一个 pre-execute 排队</text>

  <!-- 3 prepare + dispatch -->
  <line x1="398" y1="320" x2="622" y2="320" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <text x="510" y="312" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">prepare → dispatch</text>

  <!-- 4 body runs -->
  <rect x="542" y="340" width="176" height="56" rx="6" fill="#ffffff" stroke="#2f6f5e"/>
  <text x="558" y="360" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2f6f5e">函数体运行</text>
  <text x="558" y="376" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">并行安全时最多 10 个</text>
  <text x="558" y="390" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">独占工具持屏障到提交</text>

  <!-- 5 result back -->
  <line x1="622" y1="430" x2="398" y2="430" stroke="#8a93a6" stroke-width="1.2" marker-end="url(#f02-a)"/>
  <text x="510" y="422" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">ToolExecutionResult</text>

  <!-- 6 resolve to program -->
  <line x1="382" y1="470" x2="158" y2="470" stroke="#bf4520" stroke-width="1.4" marker-end="url(#f02-a)"/>
  <text x="272" y="462" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">{ isError, value }</text>
  <text x="272" y="486" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">失败在这里折成 throw</text>

  <!-- 7 log record -->
  <line x1="398" y1="516" x2="842" y2="516" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#f02-a)"/>
  <text x="612" y="508" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">tool/ptc-dispatch 旁路记账</text>

  <!-- 8 log note -->
  <rect x="762" y="538" width="176" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="778" y="558" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#2d3142">写在父调用内部</text>
  <text x="778" y="574" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#8a93a6">收尾 drain 等它写完</text>

  <!-- wait bracket -->
  <path d="M 40 204 L 30 204 L 30 470 L 40 470" fill="none" stroke="#bf4520" stroke-width="1"/>
  <text x="22" y="337" text-anchor="middle" transform="rotate(-90 22 337)" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#bf4520">程序在这里等</text>

  <text x="40" y="618" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">实线是程序等待的路径；虚线是记账，程序的值不经过它。</text>
  <text x="700" y="618" font-family="'SF Mono',ui-monospace,monospace" font-size="7" fill="#8a93a6">ptc.ts:504-648</text>
</svg>
