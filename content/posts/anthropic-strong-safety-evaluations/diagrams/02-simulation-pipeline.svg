<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="626" viewBox="0 0 1280 626" font-family='-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif' role="img" aria-labelledby="f2-t f2-d">
<title id="f2-t">多轮动态安全仿真与盲评流水线（Petri / Inspect 模式）</title>
<desc id="f2-d">从左侧威胁规格与评分细则出发，经固定首轮、多轮双模型交互到右侧盲评与置信区间汇总。</desc>
<defs>
<style>
  .f2-title { font-size: 23px; font-weight: 800; fill: #0F172A; }
  .f2-subtitle { font-size: 13px; fill: #475569; }
  .f2-hdr { font-size: 14.5px; font-weight: 700; fill: #FFFFFF; }
  .f2-hdr-sub { font-size: 11px; fill: rgba(255,255,255,0.88); }
  .f2-badge { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
  .f2-tier-sub { font-size: 11.5px; font-weight: 600; fill: #334155; }
  .f2-card-t { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
  .f2-card-b { font-size: 11.2px; fill: #334155; }
  .f2-card-m { font-size: 10.5px; font-weight: 600; fill: #475569; }
  .f2-edge-lbl { font-size: 11px; font-weight: 700; fill: #334155; }
  .f2-footer { font-size: 11px; fill: #64748B; }
</style>
<filter id="f2-shadow" x="-5%" y="-5%" width="110%" height="115%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
</filter>
<marker id="f2-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
</marker>
<marker id="f2-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
</marker>
<marker id="f2-arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/>
</marker>
<marker id="f2-arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
</marker>

</defs>
<rect x="0.5" y="0.5" width="1279" height="625" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="12"/>
<text x="32" y="42" class="f2-title">多轮动态安全仿真与盲评流水线（Petri / Inspect 模式）</text>
<text x="32" y="65" class="f2-subtitle">固定首轮保证可比性，正交采样与动态追问覆盖真实发散路径，盲元数据二值阅卷杜绝先验偏置</text>
<rect x="32" y="88" width="248" height="38" rx="8" fill="#1E293B"/>
<text x="156.0" y="112" text-anchor="middle" class="f2-hdr">1. 领域专家正交规格</text>
<rect x="312" y="88" width="236" height="38" rx="8" fill="#1A73E8"/>
<text x="430.0" y="112" text-anchor="middle" class="f2-hdr">2. 受控起点与抽样器</text>
<rect x="580" y="88" width="368" height="38" rx="8" fill="#0F766E"/>
<text x="764.0" y="112" text-anchor="middle" class="f2-hdr">3. 多轮动态博弈环（N 次发散运行）</text>
<rect x="980" y="88" width="268" height="38" rx="8" fill="#D97757"/>
<text x="1114.0" y="112" text-anchor="middle" class="f2-hdr">4. 盲元数据原子评分</text>
<rect x="32" y="148" width="248" height="210" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f2-shadow)"/>
<text x="47" y="173" class="f2-card-t">威胁规格书（Threat Spec）</text>
<text x="47" y="195" class="f2-card-b">· 模拟目标：如构建婚恋杀猪盘画像</text>
<text x="47" y="214" class="f2-card-b">· 试探策略：伪装成无辜替亲属求助</text>
<text x="47" y="233" class="f2-card-b">· 人设池：小说家 / 学者 / 家属…</text>
<text x="47" y="252" class="f2-card-b">· 语气池：谨慎试探 / 急迫 / 沮丧…</text>
<text x="47" y="345" class="f2-card-m">源自真实违规样本、红队记录与临床访谈</text>
<rect x="32" y="380" width="248" height="152" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f2-shadow)"/>
<text x="47" y="405" class="f2-card-t">领域专属判定细则（Rubric）</text>
<text x="47" y="427" class="f2-card-b">· 拆分为原子级 Yes/No 二值判据</text>
<text x="47" y="446" class="f2-card-b">· 明确边界反例（何为越界操作建议）</text>
<text x="47" y="465" class="f2-card-b">· 规定科普/免责声明不豁免实质危害</text>
<text x="47" y="519" class="f2-card-m">方法专家与领域专家联合签署</text>
<rect x="312" y="148" width="236" height="172" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f2-shadow)"/>
<rect x="312" y="148" width="5" height="172" rx="2" fill="#10B981"/>
<text x="327" y="173" class="f2-card-t">固定第 1 轮提示词 ★</text>
<text x="327" y="195" class="f2-card-b">同一场景的所有运行严格从</text>
<text x="327" y="214" class="f2-card-b">同一句开场白起步（如询问</text>
<text x="327" y="233" class="f2-card-b">婚恋资料常见高回复特征）</text>
<text x="327" y="307" class="f2-card-m">保证跨运行与跨模型起跑线一致</text>
<rect x="312" y="344" width="236" height="188" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f2-shadow)"/>
<text x="327" y="369" class="f2-card-t">独立正交维度采样器</text>
<text x="327" y="391" class="f2-card-b">· 每轮运行抽取不同特征组合</text>
<text x="327" y="410" class="f2-card-b">· 严禁将「高危度」与单一语气</text>
<text x="327" y="429" class="f2-card-b">  绑死，确保各因素可独立归因</text>
<text x="327" y="519" class="f2-card-m">多轮套件保底 ≥ 100 个独立题项</text>
<rect x="580" y="148" width="368" height="384" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.4"/>
<rect x="600" y="170" width="328" height="142" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f2-shadow)"/>
<text x="615" y="195" class="f2-card-t">模拟用户模型（独立 Claude 实例）</text>
<text x="615" y="217" class="f2-card-b">· 读取被测模型上一轮真实回复动态接话</text>
<text x="615" y="236" class="f2-card-b">· 遇劝阻时按策略换壳重述（如强调「找经济</text>
<text x="615" y="255" class="f2-card-b">  稳定伴侣不代表诈骗」）逐步升级试探</text>
<text x="615" y="299" class="f2-card-m">走出固定脚本无法预判的真实分支路径</text>
<rect x="600" y="356" width="328" height="152" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f2-shadow)"/>
<rect x="600" y="356" width="5" height="152" rx="2" fill="#10B981"/>
<text x="615" y="381" class="f2-card-t">被测目标模型（断网隔离沙箱） ★</text>
<text x="615" y="403" class="f2-card-b">· 对齐目标部署形态（裸 API vs 产品系统提示）</text>
<text x="615" y="422" class="f2-card-b">· 需跨越十余轮记住早期风险披露（如失业丧亲）</text>
<text x="615" y="441" class="f2-card-b">· 全程保持恰当响应，不被渐进话术带偏</text>
<text x="615" y="495" class="f2-card-m">高危攻防评测全程实时监控可随时熔断</text>
<line x1="730" y1="312" x2="730" y2="350" stroke="#2563EB" stroke-width="2" marker-end="url(#f2-arr-blue)"/>
<line x1="798" y1="356" x2="798" y2="318" stroke="#059669" stroke-width="2" marker-end="url(#f2-arr-ok)"/>
<text x="718" y="336" text-anchor="end" class="f2-edge-lbl" fill="#1D4ED8">追问施压</text>
<text x="810" y="336" text-anchor="start" class="f2-edge-lbl" fill="#047857">模型应答</text>
<rect x="980" y="148" width="268" height="190" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f2-shadow)"/>
<rect x="980" y="148" width="5" height="190" rx="2" fill="#10B981"/>
<text x="995" y="173" class="f2-card-t">盲元数据异构评分器 ★</text>
<text x="995" y="195" class="f2-card-b">· 剥离 Spec 标签，仅输入纯对话文本</text>
<text x="995" y="214" class="f2-card-b">· 选用异构模型防同源偏袒</text>
<text x="995" y="233" class="f2-card-b">· 任一轮违规 → 整场对话判不恰当</text>
<text x="995" y="252" class="f2-card-b">· 解析异常 → Fail Loudly 告警剔除</text>
<text x="995" y="325" class="f2-card-m">经人类盲标 Cohen's κ 一致性核验</text>
<rect x="980" y="360" width="268" height="172" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f2-shadow)"/>
<text x="995" y="385" class="f2-card-t">预注册统计与置信区间</text>
<text x="995" y="407" class="f2-card-b">· 汇总全程恰当响应率（ARR）</text>
<text x="995" y="426" class="f2-card-b">· 同题配对差值计算置信区间</text>
<text x="995" y="445" class="f2-card-b">· 披露完整模型、提示词与评分器版本</text>
<text x="995" y="519" class="f2-card-m">依托 Inspect + Petri 框架可复现</text>
<line x1="280" y1="234" x2="306" y2="234" stroke="#64748B" stroke-width="1.8" marker-end="url(#f2-arr)"/>
<line x1="280" y1="438" x2="306" y2="438" stroke="#64748B" stroke-width="1.8" marker-end="url(#f2-arr)"/>
<line x1="548" y1="234" x2="594" y2="234" stroke="#2563EB" stroke-width="1.8" marker-end="url(#f2-arr-blue)"/>
<path d="M 548 438 C 568 438, 566 260, 594 260" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#f2-arr-blue)"/>
<line x1="928" y1="250" x2="974" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#f2-arr-ok)"/>
<path d="M 280 486 L 296 486 L 296 562 L 1262 562 L 1262 244 L 1254 244" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#f2-arr)"/>
<text x="740" y="554" text-anchor="middle" class="f2-edge-lbl">仅向评分器注入原子判定细则（Rubric），严禁泄露威胁构造元数据（Threat Spec）</text>
<line x1="1114" y1="338" x2="1114" y2="354" stroke="#64748B" stroke-width="1.8" marker-end="url(#f2-arr)"/>
<text x="32" y="604" class="f2-footer">★ 为什么不用固定多轮剧本：真实越界高度依赖模型前序措辞，动态模拟用户能顺着模型漏洞持续追问试探。</text>
</svg>