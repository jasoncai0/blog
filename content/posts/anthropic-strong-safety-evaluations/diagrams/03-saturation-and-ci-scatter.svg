  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
</filter>
<marker id="f3-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
</marker>
<marker id="f3-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
</marker>
<marker id="f3-arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/>
</marker>
<marker id="f3-arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
</marker>
<linearGradient id="f3-bgGrad" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.45"/>
  <stop offset="55%" stop-color="#EFF6FF" stop-opacity="0.45"/>
  <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0.55"/>
</linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1279" height="679" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="12"/>
<text x="32" y="42" class="f3-title">安全评测实测数据透视：单轮饱和带、多轮置信区间与 +34pp 配置落差</text>
<text x="32" y="65" class="f3-subtitle">引自 Anthropic System Card 三组真实评测案例：看清何时是题库饱和、何时是抽样噪声、何时是真实干预增益</text>
<rect x="130" y="108" width="1080" height="468" rx="8" fill="url(#f3-bgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="131" y="164.0" width="1078" height="32.0" fill="#9333EA" opacity="0.09"/>
<text x="146" y="130" text-anchor="start" class="f3-card-m" style="fill:#7E22CE;font-weight:700;">紫色阴影带：单轮评测饱和窄带（94%–98%，近期模型均挤在此区间，仅作防回归检查）</text>
<line x1="130" y1="148.0" x2="1210" y2="148.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="152.0" text-anchor="end" class="f3-card-m">100%</text>
<line x1="130" y1="228.0" x2="1210" y2="228.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="232.0" text-anchor="end" class="f3-card-m">90%</text>
<line x1="130" y1="308.0" x2="1210" y2="308.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="312.0" text-anchor="end" class="f3-card-m">80%</text>
<line x1="130" y1="388.0" x2="1210" y2="388.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="392.0" text-anchor="end" class="f3-card-m">70%</text>
<line x1="130" y1="468.0" x2="1210" y2="468.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="472.0" text-anchor="end" class="f3-card-m">60%</text>
<line x1="130" y1="548.0" x2="1210" y2="548.0" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
<text x="116" y="552.0" text-anchor="end" class="f3-card-m">50%</text>
<text x="46" y="342" text-anchor="middle" transform="rotate(-90 46 342)" class="f3-card-t">恰当 / 无害响应率（Appropriate / Harmless Response Rate）</text>
<line x1="285" y1="108" x2="285" y2="576" stroke="#E2E8F0" stroke-width="1"/>
<text x="285" y="600" text-anchor="middle" class="f3-card-t">实验一：API 单轮综合评测</text>
<text x="285" y="619" text-anchor="middle" class="f3-card-m">样本下限 ≥1,000 题 · 已高度饱和</text>
<line x1="645" y1="108" x2="645" y2="576" stroke="#E2E8F0" stroke-width="1"/>
<text x="645" y="600" text-anchor="middle" class="f3-card-t">实验二：多轮杀猪盘评测（统计噪声）</text>
<text x="645" y="619" text-anchor="middle" class="f3-card-m">Opus 5 (98%) vs Opus 5.5 (94%) 无显著差异</text>
<line x1="1015" y1="108" x2="1015" y2="576" stroke="#E2E8F0" stroke-width="1"/>
<text x="1015" y="600" text-anchor="middle" class="f3-card-t">实验三：Fable 5.1 自残多轮评测（配置效应）</text>
<text x="1015" y="619" text-anchor="middle" class="f3-card-m">裸 API (60%) vs 系统提示加固 (94%) 跃升 +34pp</text>
<line x1="285" y1="164.0" x2="285" y2="196.0" stroke="#9333EA" stroke-width="6" stroke-linecap="round"/>
<circle cx="285" cy="180.0" r="14" fill="#9333EA" opacity="0.18"/>
<circle cx="285" cy="180.0" r="8.5" fill="#9333EA" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="285" y="224.0" text-anchor="middle" class="f3-card-t" style="fill:#6B21A8;">近期各代模型：94%–98%</text>
<text x="285" y="242.0" text-anchor="middle" class="f3-card-b">区分度耗尽，需升级长程多轮任务</text>
<line x1="585" y1="148.0" x2="585" y2="228.0" stroke="#2563EB" stroke-width="2.4"/>
<line x1="577" y1="148.0" x2="593" y2="148.0" stroke="#2563EB" stroke-width="2.4"/>
<line x1="577" y1="228.0" x2="593" y2="228.0" stroke="#2563EB" stroke-width="2.4"/>
<circle cx="585" cy="164.0" r="13" fill="#2563EB" opacity="0.18"/>
<circle cx="585" cy="164.0" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="571" y="169.0" text-anchor="end" class="f3-card-t">Opus 5 (98%)</text>
<line x1="705" y1="156.0" x2="705" y2="276.0" stroke="#2563EB" stroke-width="2.4"/>
<line x1="697" y1="156.0" x2="713" y2="156.0" stroke="#2563EB" stroke-width="2.4"/>
<line x1="697" y1="276.0" x2="713" y2="276.0" stroke="#2563EB" stroke-width="2.4"/>
<circle cx="705" cy="196.0" r="13" fill="#2563EB" opacity="0.18"/>
<circle cx="705" cy="196.0" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="719" y="201.0" text-anchor="start" class="f3-card-t">Opus 5.5 (94%)</text>
<rect x="495" y="315" width="300" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#f3-shadow)"/>
<text x="510" y="340" class="f3-card-t">为什么不能宣称安全退化</text>
<text x="510" y="362" class="f3-card-b">多轮 API 评测置信区间常超 ±10pp；</text>
<text x="510" y="381" class="f3-card-b">两组误差棒大幅重叠，4pp 分差无统计显著性，</text>
<text x="510" y="400" class="f3-card-b">需扩充题库并用同题配对检验提升统计功效。</text>
<path d="M 905 456.0 C 905 236.0, 1025 196.0, 1081 196.0" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#f3-arr-ok)"/>
<circle cx="905" cy="468.0" r="14" fill="#D97757" opacity="0.18"/>
<circle cx="905" cy="468.0" r="8.5" fill="#D97757" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="905" y="494.0" text-anchor="middle" class="f3-card-t" style="fill:#9A3412;">裸 API：60%</text>
<text x="905" y="512.0" text-anchor="middle" class="f3-card-m">偶发隐性附和自残有效</text>
<circle cx="1095" cy="196.0" r="15" fill="#059669" opacity="0.2"/>
<circle cx="1095" cy="196.0" r="9" fill="#059669" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="1095" y="180.0" text-anchor="middle" class="f3-card-t" style="fill:#065F46;">claude.ai 加固后：94% ★</text>
<rect x="932" y="290" width="264" height="112" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.2" filter="url(#f3-shadow)"/>
<rect x="932" y="290" width="5" height="112" rx="2" fill="#10B981"/>
<text x="947" y="315" class="f3-card-t">系统提示词落差 +34pp ★</text>
<text x="947" y="337" class="f3-card-b">审阅日志后增补明确禁令</text>
<text x="947" y="356" class="f3-card-b">（不附和自残有效或有帮助），</text>
<text x="947" y="375" class="f3-card-b">恰当响应率跃升 34 个百分点；</text>
<text x="947" y="394" class="f3-card-b">跨端对比必须披露完整配置。</text>
<text x="32" y="658" class="f3-footer">★ 数据来源：Building strong safety evaluations（2026-11-13）；第二组误差棒示意多轮评测宽置信区间对小幅分差的覆盖。</text>
</svg>