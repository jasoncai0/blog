<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="dt dd">
  <title id="dt">一条流水线，一条账本</title>
  <desc id="dd">F1 到 F6 是环节，F7 是所有环节的落点。每个环节都有明确输入输出，缺一环整条链就断。</desc>
  <defs>
    <marker id="da" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="dacc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">CAPABILITY MAP · F1 → F6 · F7 横在底下</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">七个功能面，六个环节一个落点</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">账本不在流水线上，它在流水线下面</text>
  <rect x="43" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="55" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F1</text>
  <text x="55" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">收活</text>
  <text x="55" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">一句话 → 任务卡</text>
  <text x="55" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">七字段</text>
  <line x1="179" y1="160" x2="189" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#da)"/>
  <rect x="191" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="203" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F2</text>
  <text x="203" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">资产与品牌</text>
  <text x="203" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">约束块 + 指纹</text>
  <text x="203" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">约束不进召回</text>
  <line x1="327" y1="160" x2="337" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#da)"/>
  <rect x="339" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="351" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F3</text>
  <text x="351" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">路由</text>
  <text x="351" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">选 Agent 与预算</text>
  <text x="351" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">三档，越往后越贵</text>
  <line x1="475" y1="160" x2="485" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#da)"/>
  <rect x="487" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="499" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F4</text>
  <text x="499" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">评审</text>
  <text x="499" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">过不过 + 改哪里</text>
  <text x="499" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">三层，只有一层同步</text>
  <line x1="623" y1="160" x2="633" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#da)"/>
  <rect x="635" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="647" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F5</text>
  <text x="647" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">精修</text>
  <text x="647" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">局部重绘</text>
  <text x="647" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">增量校验</text>
  <line x1="771" y1="160" x2="781" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#da)"/>
  <rect x="783" y="108" width="134" height="104" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="795" y="128" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520" letter-spacing="1.1">F6</text>
  <text x="795" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#2d3142" font-weight="600">交付</text>
  <text x="795" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">尺寸与发布</text>
  <text x="795" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">幂等</text>
  <line x1="480" y1="216" x2="480" y2="238" stroke="#bf4520" stroke-width="1" marker-end="url(#dacc)"/>
  <rect x="43" y="240" width="874" height="78" fill="#ececec" stroke="rgba(45,49,66,0.12)"/>
  <text x="59" y="262" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">F7 账本 · 只追加 · 原件 + sha256</text>
  <text x="59" y="286" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142">event · project · deliverable · run · artifact · verdict · asset</text>
  <text x="59" y="304" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">三个查询：这条产物哪来的 / 同类任务上次怎么做 / 哪条约束老被违反</text>
  <text x="908" y="262" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" text-anchor="end">其它全是投影</text>
  
  <text x="36" y="356" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">F2 的约束在编译期注入，F4 的硬约束在产物侧校验。同一条约束要走两条腿，只走一条都会漏。</text>
  
  <text x="36" y="374" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">F5 的增量校验只跑受影响的规则：改文字查禁用词和溢出，改色查色板与对比度。</text>
  </svg>