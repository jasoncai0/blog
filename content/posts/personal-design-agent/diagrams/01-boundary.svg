<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="bt bd">
  <title id="bt">谁做决定，谁做像素</title>
  <desc id="bd">你在两端出现：给判断、签字。助手在中间做四件事，设计 Agent 只把 spec 变成像素。</desc>
  <defs>
    <marker id="ba" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="bacc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">BOUNDARY · 你 · 个人助手 · 设计 Agent</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">助手拿决定权，不拿画布</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">助手不拥有场景树，只读产物和 op</text>
  <rect x="36" y="96" width="120" height="244" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="48" y="118" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600">你</text>
  <text x="48" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">判断值不值</text>
  <text x="48" y="168" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">给风格参照</text>
  <text x="48" y="188" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">在卡口签字</text>
  <text x="48" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">判断不外包</text>
  <text x="48" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">声誉不可代押</text>
  <rect x="230" y="96" width="470" height="244" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="244" y="114" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">个人助手 · L2 决策 + L3 上下文</text>
  <rect x="244" y="124" width="442" height="44" fill="#ececec" stroke="rgba(45,49,66,0.10)"/>
  <text x="256" y="143" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">F1 收活</text>
  <text x="256" y="159" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">一句话 → 七字段任务卡</text>
  <rect x="244" y="176" width="442" height="44" fill="#ececec" stroke="rgba(45,49,66,0.10)"/>
  <text x="256" y="195" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">F3 路由</text>
  <text x="256" y="211" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">能力表 + 预算闸</text>
  <rect x="244" y="228" width="442" height="44" fill="#ececec" stroke="rgba(45,49,66,0.10)"/>
  <text x="256" y="247" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">F4 评审</text>
  <text x="256" y="263" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">六条规则 + 偏好分 + VLM 抽检</text>
  <rect x="244" y="280" width="442" height="44" fill="#ececec" stroke="rgba(45,49,66,0.10)"/>
  <text x="256" y="299" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600">F6 交付</text>
  <text x="256" y="315" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">尺寸矩阵 + 命名 + 回写</text>
  <text x="244" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">它拥有你的历史、约束、账，不拥有像素</text>
  <rect x="760" y="96" width="164" height="244" fill="#ffffff" stroke="rgba(45,49,66,0.18)"/>
  <text x="772" y="118" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600">设计 Agent</text>
  <text x="772" y="144" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">Lovart</text>
  <text x="772" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">OpenDesign</text>
  <text x="772" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">Figma MCP</text>
  <text x="772" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#4f5d75">图像模型</text>
  <text x="772" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">可替换</text>
  <text x="772" y="328" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">只出候选</text>
  <line x1="156" y1="150" x2="226" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#ba)"/>
  <text x="191" y="141" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580" text-anchor="middle">问 ≤3 个</text>
  <line x1="700" y1="150" x2="756" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#ba)"/>
  <text x="728" y="141" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580" text-anchor="middle">spec</text>
  <line x1="756" y1="192" x2="704" y2="192" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ba)"/>
  <text x="730" y="208" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580" text-anchor="middle">候选</text>
  <path d="M300 340 L300 376 L96 376 L96 346" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#bacc)"/>
  <text x="198" y="368" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" text-anchor="middle">推荐 + 三条理由 → 你签字</text>
  
  <text x="36" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">助手不解析 agent 的写文件请求；它读到的永远是落盘后的产物和 op，不是中间过程。</text>
  </svg>