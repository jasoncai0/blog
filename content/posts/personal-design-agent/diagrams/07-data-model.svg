  <text x="668" y="272" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#2d3142" font-weight="600">asset</text>
  <line x1="654" y1="280" x2="924" y2="280" stroke="rgba(45,49,66,0.12)"/>
  <text x="668" y="298" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#4f5d75">id</text>
  <text x="668" y="316" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#4f5d75">kind</text>
