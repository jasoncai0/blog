  <text x="668" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#4f5d75">used_in[]</text>
  <rect x="36" y="386" width="888" height="84" fill="#2d3142" stroke="#2d3142"/>
  <text x="52" y="410" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#ffffff" font-weight="600">event</text>
  <text x="108" y="410" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#d8dbe4">id · ts · actor · type · ref · payload(JSON 只写不查) · prev_hash</text>
  <text x="52" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#d8dbe4">type: spec.frozen | run.started | artifact.added | verdict.recorded | artifact.edited | delivered</text>
  <text x="52" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#ffffff">重放：deliverable / run / verdict / 版本树 / 能力排行 / 风格指纹，全部可重建</text>
  
  <text x="36" y="494" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">artifact.sha256 加唯一索引解决重复存；删除写 tombstone 保证可回滚；投影坏了能重建，事件丢了就真丢了。</text>
  </svg>