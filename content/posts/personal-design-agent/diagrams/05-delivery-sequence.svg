<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="ft fd">
  <title id="ft">三个同步点，其余全异步</title>
  <desc id="fd">收活一轮往返，生成一次调用，评审硬约束同步跑，品味与抽检异步预取，精修走局部，交付出三个尺寸并回写账本。</desc>
  <defs>
    <marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker>
    <marker id="facc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="36" y="28" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#5a6580" letter-spacing="1.1">SEQUENCE · 收活 → 生成 → 评审 → 精修 → 交付</text>
  <text x="36" y="54" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600">一次交付，三个同步点</text>
  <text x="924" y="54" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#5a6580" text-anchor="end" letter-spacing="1.1">同步点每多一个，助手就从顺手变成要等</text>
  <rect x="38.0" y="72" width="140" height="30" fill="#2d3142" stroke="#2d3142"/>
  <text x="108" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">你</text>
  <rect x="230.0" y="72" width="140" height="30" fill="#2d3142" stroke="#2d3142"/>
  <text x="300" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">助手</text>
  <rect x="422.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
  <text x="492" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">设计 Agent</text>
  <rect x="614.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
  <text x="684" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">评审</text>
  <rect x="788.0" y="72" width="140" height="30" fill="#ffffff" stroke="rgba(45,49,66,0.28)"/>
  <text x="858" y="91" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" text-anchor="middle">账本</text>
  <line x1="108" y1="102" x2="108" y2="600" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
  <line x1="300" y1="102" x2="300" y2="600" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
  <line x1="492" y1="102" x2="492" y2="600" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
  <line x1="684" y1="102" x2="684" y2="600" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
  <line x1="858" y1="102" x2="858" y2="600" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3 3"/>
  <line x1="108" y1="128" x2="296" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#fa)"/>
  <text x="116" y="121" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">截图 +「照这个感觉做张海报，周三发」</text>
  <line x1="300" y1="164" x2="112" y2="164" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#facc)"/>
  <text x="292" y="157" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" text-anchor="end">问两个：标题文案？主视觉用产品图还是场景？</text>
  <line x1="108" y1="200" x2="296" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#fa)"/>
  <text x="116" y="193" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">回答一句</text>
  <line x1="300" y1="236" x2="854" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text x="308" y="229" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">spec.frozen v1 ｜ 用途 · 渠道 · 900×383 · 必含 · 周三</text>
  <line x1="300" y1="272" x2="488" y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#fa)"/>
  <text x="308" y="265" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">run(spec, 约束 1.2k + 资产 3 条 + 先例 2 条) ｜ p95 90ms</text>
  <line x1="492" y1="308" x2="680" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text x="500" y="301" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">两个候选 + 原件 + sha256</text>
  <line x1="684" y1="344" x2="304" y2="344" stroke="#bf4520" stroke-width="1.2" marker-end="url(#facc)"/>
  <text x="308" y="337" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">硬约束 6/6 通过 · 40ms（同步）</text>
  <line x1="684" y1="380" x2="304" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text x="308" y="373" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">品味 0.62 / 0.71 · VLM 抽 B：标题压肩线</text>
  <line x1="300" y1="416" x2="112" y2="416" stroke="#bf4520" stroke-width="1.2" marker-end="url(#facc)"/>
  <text x="292" y="409" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520" text-anchor="end">推荐 B，标题上移 24px（附三条理由）</text>
  <line x1="108" y1="452" x2="296" y2="452" stroke="#4f5d75" stroke-width="1" marker-end="url(#fa)"/>
  <text x="116" y="445" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">接受，主色压深一档</text>
  <line x1="300" y1="488" x2="488" y2="488" stroke="#4f5d75" stroke-width="1" marker-end="url(#fa)"/>
  <text x="308" y="481" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">局部重绘：mask + 一条指令（不重生成）</text>
  <line x1="492" y1="524" x2="854" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text x="500" y="517" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">v3 入账 ｜ 只触发色板 + 对比度两条规则</text>
  <line x1="300" y1="560" x2="854" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#fa)"/>
  <text x="308" y="553" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75">delivered ｜ 900×383 · 1080×1080 · 1242×1660</text>
  <line x1="858" y1="596" x2="688" y2="596" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#facc)"/>
  <text x="692" y="589" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#bf4520">次日 02:00 抽 episode 进品味模型</text>
  
  <text x="36" y="622" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">红色是同步等待你的地方，只有三处：spec 冻结、推荐确认、交付确认。评审的规则层同步，模型层异步预取。</text>
  
  <text x="36" y="638" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">所有产物先落盘算哈希再进评审，评审读的是原件。只留 URL 的话，第三个月就断链。</text>
  </svg>