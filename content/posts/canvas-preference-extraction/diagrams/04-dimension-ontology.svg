<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d"><title id="t">40 个维度分六组，每组带观测来源</title><desc id="d">版式、字体、色彩、图像、流程、语言六组，共 40 个维度。来源标记决定这一维能拿到分布还是一句话。</desc><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker></defs><rect width="960" height="640" fill="#f5f5f5"/><text x="40" y="44" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.16em">ONTOLOGY · 6 GROUPS / 40 DIMENSIONS</text><text x="40" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600" text-anchor="start">40 个维度分六组，每个维度标出能从哪路数据看到</text><text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5a6580" font-weight="400" text-anchor="start">维度定死之后，提取结果才能比较、注入、失效。半衰期按组给，禁令不衰减</text><rect x="40" y="176" width="280" height="176" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><text x="56" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">版式</text><text x="90.0" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">8 个</text><text x="304" y="204" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="end">半衰期 180 天</text><circle cx="59" cy="227" r="3" fill="#3d5a80"/><circle cx="69" cy="227" r="3" fill="#2f6f5e"/><text x="80" y="230" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">标题对齐</text><circle cx="59" cy="246" r="3" fill="#3d5a80"/><ci