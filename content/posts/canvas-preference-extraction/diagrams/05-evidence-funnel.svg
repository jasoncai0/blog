<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d"><title id="t">三周 1240 条证据收敛到 12 条偏好</title><desc id="d">原始证据、候选、生效偏好、本次注入四级漏斗，每一级都有明确的淘汰理由。</desc><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker></defs><rect width="960" height="540" fill="#f5f5f5"/><text x="40" y="44" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.16em">FUNNEL · 3 WEEKS OF EVIDENCE</text><text x="40" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600" text-anchor="start">三周 1240 条证据，收敛成 12 条偏好</text><text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5a6580" font-weight="400" text-anchor="start">每一级的淘汰都有理由。淘汰不是丢弃，没到阈值的留在候选池里等更多证据</text><rect x="40" y="146" width="620" height="66" rx="6" fill="#e9eff6" stroke="#3d5a80" stroke-width="1" opacity="1"/><rect x="40" y="147" width="4" height="64" fill="#3d5a80"/><text x="58" y="183" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" fill="#3d5a80" font-weight="600" text-anchor="start">1,240</text><text x="112.80000000000001" y="179" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">条原始证据</text><text x="112.80000000000001" y="198" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="start">60 场会话 · 900 个画布操作 · 21 天</text><text x="678" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">只保留 actor = user 的操作</text><rect x="40" y="230" width="500" height="66" rx="6" fill="#efeaf6" stroke="#5b4b8a" stroke-width="1" opacity="1"/><rect x="40" y="231" width="4" height="64" fill="#5b4b8a"/><text x="58" y="267" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" fill="#5b4b8a" font-weight="600" text-anchor="start">86</text><text x="104" y="263" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">个候选</text><text x="104" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="start">同维度同取值合并，留最强的那几条</text><text x="558" y="268" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">归并去重，冲突的并列保留</text><rect x="40" y="314" width="380" height="66" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1" opacity="1"/><rect x="40" y="315" width="4" height="64" fill="#bf4520"/><text x="58" y="351" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" fill="#bf4520" font-weight="600" text-anchor="start">12</text><text x="104" y="347" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">条生效偏好</text><text x="104" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="start">S ≥ 0.75，带证据链与例图</text><text x="438" y="352" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">稳定性判定，阈值 0.75</text><rect x="40" y="398" width="280" height="66" rx="6" fill="#e9f2ed" stroke="#2f6f5e" stroke-width="1" opacity="1"/><rect x="40" y="399" width="4" height="64" fill="#2f6f5e"/><text x="58" y="435" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="16" fill="#2f6f5e" font-weight="600" text-anchor="start">8</text><text x="104" y="431" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">条本次注入</text><text x="104" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="start">按当前任务类型过滤后进上下文</text><text x="338" y="436" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">1.1k token 预算封顶</text><path d="M60,214 L60,228" fill="none" stroke="#8a93a6" stroke-width="1" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><path d="M60,298 L60,312" fill="none" stroke="#8a93a6" stroke-width="1" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><path d="M60,382 L60,396" fill="none" stroke="#8a93a6" stroke-width="1" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="478" x2="920" y2="478" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="500" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580" font-weight="400" text-anchor="start">剩下 74 条留在候选池：加一条证据就能升，或等半衰期掉出去</text><line x1="40" y1="498" x2="920" y2="498" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="518" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.12em">FUNNEL · EVIDENCE → CARD</text><text x="920" y="518" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="end">淘汰不等于删除</text></svg>