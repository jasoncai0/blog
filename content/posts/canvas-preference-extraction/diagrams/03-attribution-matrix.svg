<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d"><title id="t">归因四象限：只有一格能直接给出偏好取值</title><desc id="d">按产物来源与用户动作分四类，只有 agent 产物被用户改动的那一格带着 before 和 after。</desc><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="44" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.16em">ATTRIBUTION · 2 × 2</text><text x="40" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600" text-anchor="start">四象限里只有一格能直接给出偏好取值</text><text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5a6580" font-weight="400" text-anchor="start">横轴是改动对象的来源，纵轴是用户对它的动作。其余三格要么打折，要么丢弃</text><path d="M150,182 L664,182" fill="none" stroke="#8a93a6" stroke-width="1" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="273.0" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="middle">产物来源：agent 生成</text><text x="541.0" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="middle">产物来源：用户自建</text><path d="M126,466 L126,208" fill="none" stroke="#8a93a6" stroke-width="1" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="267.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">保留</text><text x="40" y="407.0" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#2d3142" font-weight="600" text-anchor="start">改动</text><text x="40" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">用户动作</text><rect x="150" y="208" width="246" height="118" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><text x="166" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">采纳</text><text x="380" y="238" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#8a93a6" font-weight="400" text-anchor="end">0.35</text><text x="166" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">用户没动，可能是满意，</text><text x="166" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">也可能是没看见。导出时</text><text x="166" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">还在才计正分</text><rect x="418" y="208" width="246" height="118" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><text x="434" y="238" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">定稿</text><text x="648" y="238" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#8a93a6" font-weight="400" text-anchor="end">0.80</text><text x="434" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">用户自己搭的，改到导出</text><text x="434" y="275" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">还在。四格里最干净的正向</text><rect x="150" y="348" width="246" height="118" rx="6" fill="#f7efe4" stroke="#bf4520" stroke-width="1.2" opacity="1"/><rect x="150" y="349" width="4" height="116" fill="#bf4520"/><text x="166" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">修正</text><text x="380" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#bf4520" font-weight="400" text-anchor="end">0.90</text><text x="166" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">改了什么就是偏好取值，</text><text x="166" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">before → after 直接可用</text><rect x="418" y="348" width="246" height="118" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><text x="434" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">探索</text><text x="648" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#8a93a6" font-weight="400" text-anchor="end">0.05</text><text x="434" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">多半在试。活到回合结束</text><text x="434" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">才算数，中途撤销的丢弃</text><text x="700" y="172" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="start">三个修饰项</text><text x="700" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">（乘在上面的权重上）</text><rect x="700" y="208" width="220" height="92" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="700" y="209" width="4" height="90" fill="#9b4b52"/><text x="716" y="234" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">撤销</text><text x="904" y="234" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#9b4b52" font-weight="400" text-anchor="end">−1.0</text><text x="716" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">最干净的否定信号</text><rect x="700" y="310" width="220" height="92" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="700" y="311" width="4" height="90" fill="#2f6f5e"/><text x="716" y="336" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">导出时留存</text><text x="904" y="336" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2f6f5e" font-weight="400" text-anchor="end">+0.9</text><text x="716" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">活到导出才算定稿</text><rect x="700" y="412" width="220" height="92" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="700" y="413" width="4" height="90" fill="#3d5a80"/><text x="716" y="438" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">跨回合沿用</text><text x="904" y="438" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#3d5a80" font-weight="400" text-anchor="end">+0.5</text><text x="716" y="460" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">下个回合同类元素沿用了同设置</text><line x1="40" y1="526" x2="920" y2="526" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580" font-weight="400" text-anchor="start">一条证据的强度</text><text x="150" y="556" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#2d3142" font-weight="400" text-anchor="start">strength  =  w_quadrant  ×  w_modifier  ×  w_persist</text><text x="700" y="556" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">四象限给基数，修饰项调档</text><line x1="40" y1="558" x2="920" y2="558" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="578" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.12em">ATTRIBUTION · EVIDENCE STRENGTH</text><text x="920" y="578" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="end">只有「修正」这一格带落点</text></svg>