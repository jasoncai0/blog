<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">六段管线：两路数据在信封这一步合流</title><desc id="d">采集、切分、归因、提取、判定、落卡，每段之间有明确的中间产物。</desc><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker></defs><rect width="960" height="520" fill="#f5f5f5"/><text x="40" y="44" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.16em">PIPELINE · CANVAS + CHAT → PREFERENCE</text><text x="40" y="74" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#2d3142" font-weight="600" text-anchor="start">两路数据在信封这一步合流，之后每一段都只处理归一化后的事件</text><text x="40" y="96" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#5a6580" font-weight="400" text-anchor="start">每个方框是一段处理，框下是它写出的表。中间产物决定了下一段能做到多细</text><rect x="40" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="40" y="151" width="4" height="106" fill="#3d5a80"/><text x="54" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">采集与信封</text><text x="54" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">op 流 · 对话</text><text x="54" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">两路各自进来，</text><text x="54" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">统一成事件格式</text><text x="100.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">canvas_op · chat_msg</text><rect x="192" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="192" y="151" width="4" height="106" fill="#5b4b8a"/><text x="206" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">回合切分</text><text x="206" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">按意图切段</text><text x="206" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">一条请求到一次</text><text x="206" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">导出算一个回合</text><text x="252.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">turn</text><rect x="344" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="344" y="151" width="4" height="106" fill="#5b4b8a"/><text x="358" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">动作归因</text><text x="358" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">四象限 + 强度</text><text x="358" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">谁产的产物，</text><text x="358" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">用户怎么动它</text><text x="404.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">evidence</text><rect x="496" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="496" y="151" width="4" height="106" fill="#5b4b8a"/><text x="510" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">三路提取</text><text x="510" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">计数 差分 对话</text><text x="510" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">分布、规则、</text><text x="510" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">结构化候选</text><text x="556.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">candidate</text><rect x="648" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="648" y="151" width="4" height="106" fill="#bf4520"/><text x="662" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">稳定判定</text><text x="662" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">阈值 0.75</text><text x="662" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">频次 · 跨度 ·</text><text x="662" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">跨项目 · 反向</text><text x="708.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">score</text><rect x="800" y="150" width="120" height="108" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="800" y="151" width="4" height="106" fill="#2f6f5e"/><text x="814" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">偏好卡</text><text x="814" y="194" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start">可注入</text><text x="814" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">一句话 + 证据链</text><text x="814" y="223.5" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75" font-weight="400" text-anchor="start">+ 两张例图</text><text x="860.0" y="284" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2f6f5e" font-weight="400" text-anchor="middle">preference_card</text><path d="M163,204.0 L187,204.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="176" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="middle">events</text><path d="M315,204.0 L339,204.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="328" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="middle">turns</text><path d="M467,204.0 L491,204.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="middle">evidence</text><path d="M619,204.0 L643,204.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="632" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="middle">candidates</text><path d="M771,204.0 L795,204.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#h)" stroke-linejoin="round" stroke-linecap="round"/><text x="784" y="140" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="middle">cards</text><line x1="40" y1="306" x2="920" y2="306" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="334" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#2d3142" font-weight="600" text-anchor="start">两条贯穿全流程的规则</text><rect x="40" y="352" width="880" height="44" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="40" y="353" width="4" height="42" fill="#9b4b52"/><text x="58" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">反自证</text><text x="104" y="379" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" font-weight="400" text-anchor="start">actor = agent 的事件不进入证据表；agent 说明自己「采用了复古风」，这句说明不算证据。</text><rect x="40" y="404" width="880" height="44" rx="6" fill="#ffffff" stroke="#d9dbe2" stroke-width="1" opacity="1"/><rect x="40" y="405" width="4" height="42" fill="#2f6f5e"/><text x="58" y="431" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" fill="#2d3142" font-weight="600" text-anchor="start">幂等</text><text x="104" y="431" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#4f5d75" font-weight="400" text-anchor="start">同一 batch_id 重放十次只落一条证据；重试机制不制造假证据，靠这一条。</text><line x1="40" y1="478" x2="920" y2="478" stroke="#d9dbe2" stroke-width="1"/><text x="40" y="498" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#8a93a6" font-weight="400" text-anchor="start" letter-spacing="0.12em">MEMORY EXTRACTION · PIPELINE</text><text x="920" y="498" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#5a6580" font-weight="400" text-anchor="end">画布 + 对话 → 证据 → 卡</text></svg>