<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d4-title d4-desc">
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
  </defs>
  <title id="d4-title">写入管线</title>
  <desc id="d4-desc">一次 turn 的轨迹经过采集、抽取、归并、判定、打分、落库六个阶段，默认只产生候选记忆；底部是三条写入门禁：幂等、溯源、反自证。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">WRITE PIPELINE · TURN → MEMORY ITEM</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">从一次 turn 到一条记忆，中间隔六道关</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">采集和抽取是廉价的，贵的是归并与判定：它们决定记忆会不会越用越脏</text>
  <text x="48" y="122" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">触发 turn.post，整条管线在后台跑；失败只丢这一批，不影响已经发生的 turn。</text>
  <rect x="48" y="168" width="122" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="60" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">01</text>
  <text x="60" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">采集</text>
  <text x="60" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">INGEST</text>
  <text x="60" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">用户原话、op 批次、</text>
  <text x="60" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">diff、撤销与重试</text>
  <path d="M170,220 L194,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="194" y="168" width="122" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="206" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">02</text>
  <text x="206" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">抽取</text>
  <text x="206" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">EXTRACT</text>
  <text x="206" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">按 schema 抽命题，</text>
  <text x="206" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">一条只表达一件事</text>
  <path d="M316,220 L340,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="340" y="168" width="122" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="352" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">03</text>
  <text x="352" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">归并</text>
  <text x="352" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">MERGE</text>
  <text x="352" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">同义合并、细化下钻、</text>
  <text x="352" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">泛化上提</text>
  <path d="M462,220 L486,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="486" y="168" width="122" height="116" rx="6" fill="#f6e7e1" stroke="#bf4520" stroke-width="1"/>
  <text x="498" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#bf4520" letter-spacing="0.1em">04</text>
  <text x="498" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">判定</text>
  <text x="498" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">ADJUDICATE</text>
  <text x="498" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">支持则加分，反驳</text>
  <text x="498" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">则进冲突队列</text>
  <path d="M608,220 L632,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="632" y="168" width="122" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="644" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">05</text>
  <text x="644" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">打分</text>
  <text x="644" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">SCORE</text>
  <text x="644" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">证据数 × 来源可靠度</text>
  <text x="644" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">× 时间衰减</text>
  <path d="M754,220 L778,220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="778" y="168" width="122" height="116" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="790" y="188" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.5" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">06</text>
  <text x="790" y="212" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3142">落库</text>
  <text x="790" y="226" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="5.8" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.08em">COMMIT</text>
  <text x="790" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">写 candidate，够阈值</text>
  <text x="790" y="264" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">才升 active</text>
  <text x="48" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">三条写入门禁</text>
  <text x="148" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#5a6580">少了任何一条，记忆都会在几个月内变成噪声</text>
  <rect x="48" y="356" width="272" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="64" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">幂等</text>
  <text x="64" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">同一 op 批次重放十次，</text>
  <text x="64" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">只产生一条事件、一条记忆</text>
  <rect x="344" y="356" width="272" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="360" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">溯源</text>
  <text x="360" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">每条记忆必须带 episode_id，</text>
  <text x="360" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">用户说「忘掉」时才删得干净</text>
  <rect x="640" y="356" width="272" height="78" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="656" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="start" fill="#2d3142">反自证</text>
  <text x="656" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">agent 自己的回复不能当证据，</text>
  <text x="656" y="415" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">只有用户行为与产物能</text>
  <text x="48" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">第 04 关是本设计的重点：多数记忆系统只做「写进去」，不做「和已有结论对质」。</text>
  <text x="48" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">代价是巩固 job 要跑冲突检测；收益是同一个用户说五次「左边」，库里只有一条置信度 0.82 的偏好。</text>
</svg>
