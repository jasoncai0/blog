<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="d6-title d6-desc">
  <defs>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
  </defs>
  <title id="d6-title">画布、品牌与资产的图模型</title>
  <desc id="d6-desc">画布是中心的可回放状态树，向上接受品牌的硬约束，向左被技能触发，向下展开为节点，节点引用素材；风格指纹从画布产物统计而来。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">ASSET GRAPH · CANVAS / BRAND / SKILL</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">画布不是一张图，是一棵能回放的状态树</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">品牌给硬约束，技能给做法，素材给零件，风格指纹从产物里统计出来</text>
  <rect x="385" y="112" width="190" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="401" y="138" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">品牌</text>
  <text x="401" y="154" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">BRAND KIT</text>
  <text x="401" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">12 个 token · 8 条硬规则</text>
  <rect x="385" y="248" width="190" height="80" rx="6" fill="#f6e7e1" stroke="#bf4520" stroke-width="1"/>
  <text x="401" y="274" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">画布 · 状态树</text>
  <text x="401" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">CANVAS</text>
  <text x="401" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">op 流 + 每 50 步一个快照</text>
  <rect x="100" y="254" width="190" height="68" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="116" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">技能</text>
  <text x="116" y="296" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">SKILL</text>
  <text x="116" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">触发条件 · 步骤 · 约束</text>
  <rect x="385" y="424" width="190" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="401" y="450" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">节点</text>
  <text x="401" y="466" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">NODE</text>
  <text x="401" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">frame / text / image / group</text>
  <rect x="700" y="124" width="200" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="716" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">素材</text>
  <text x="716" y="166" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">ASSET</text>
  <text x="716" y="182" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">跨项目复用 · 带 license</text>
  <rect x="700" y="372" width="200" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="716" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2d3142">风格指纹</text>
  <text x="716" y="414" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6" font-weight="400" text-anchor="start" fill="#5a6580" letter-spacing="0.1em">STYLE FP</text>
  <text x="716" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="400" text-anchor="start" fill="#4f5d75">从产物统计，不是用户自述</text>
  <path d="M480,176 L480,248" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arrow-a)"/>
  <text x="490" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" font-weight="600" text-anchor="start" fill="#bf4520">硬约束</text>
  <text x="490" y="218" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#5a6580">编译期注入，不走检索</text>
  <path d="M290,288 L385,288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="316.5" y="275.0" width="41.0" height="10.0" fill="#f5f5f5"/>
  <text x="337" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="middle" fill="#4f5d75">按条件匹配</text>
  <path d="M480,328 L480,424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <text x="490" y="370" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">rev 42</text>
  <text x="490" y="382" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#5a6580">含 op 批次与撤销记录</text>
  <path d="M575,454 L607.0,454.0 Q615,454 615.0,446.0 L615.0,164.0 Q615,156 623.0,156.0 L700,156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="647.0" y="143.0" width="20.0" height="10.0" fill="#f5f5f5"/>
  <text x="657" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="middle" fill="#4f5d75">引用</text>
  <path d="M575,300 L642.0,300.0 Q650,300 650.0,308.0 L650.0,396.0 Q650,404 658.0,404.0 L700,404" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-m)"/>
  <text x="656" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#4f5d75">统计</text>
  <text x="656" y="352" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" font-weight="400" text-anchor="start" fill="#5a6580">42 次</text>
  <text x="48" y="514" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">三者的失败代价不同：品牌漏一条就是事故，素材漏一个只是少个零件，指纹错一次会被下一条证据覆盖。</text>
  <text x="48" y="536" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#4f5d75">所以它们不该存在同一张表里，也不该用同一套检索权重。</text>
</svg>
