<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="d2-title d2-desc">
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
  </defs>
  <title id="d2-title">一个 turn 里的记忆时序</title>
  <desc id="d2-desc">用户改一句话后，同步路径依次经过运行时、上下文编译器、记忆库与模型，落到画布；turn 结束后的写入、蒸馏与预取全部异步。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">TURN LIFECYCLE · SYNC VS ASYNC</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">一个 turn 里，记忆只在两个位置是同步的</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">编译进上下文（读）与提交后落事件（写）；其余都在 turn 之外跑</text>
  <rect x="38" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="100" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">用户</text>
  <text x="100" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">USER</text>
  <line x1="100" y1="140" x2="100" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="188" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="250" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">Runtime</text>
  <text x="250" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">TURN LOOP</text>
  <line x1="250" y1="140" x2="250" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="338" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="400" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">上下文编译器</text>
  <text x="400" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">COMPILER</text>
  <line x1="400" y1="140" x2="400" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="498" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="560" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">记忆库</text>
  <text x="560" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">M1–M4</text>
  <line x1="560" y1="140" x2="560" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="653" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="715" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">模型</text>
  <text x="715" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">LLM</text>
  <line x1="715" y1="140" x2="715" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="808" y="100" width="124" height="40" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="870" y="119" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3142">画布</text>
  <text x="870" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="middle" fill="#5a6580" letter-spacing="0.12em">CANVAS</text>
  <line x1="870" y1="140" x2="870" y2="570" stroke="#dddddd" stroke-width="1" stroke-dasharray="3,4"/>
  <path d="M100,170 L250,170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="139.6" y="156.8" width="70.8" height="10.2" fill="#f5f5f5"/>
  <text x="175.0" y="164" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">把主视觉换成品牌蓝</text>
  <path d="M250,198 L400,198" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="269.6" y="184.8" width="110.8" height="10.2" fill="#f5f5f5"/>
  <text x="325.0" y="192" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">compile(turn, focus, 9.4k)</text>
  <text x="256" y="207" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">p95 74ms</text>
  <path d="M400,230 L560,230" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="427.6" y="216.8" width="104.8" height="10.2" fill="#f5f5f5"/>
  <text x="480.0" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">recall：画像 / 先例 / 品牌</text>
  <text x="406" y="239" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">3 路并行</text>
  <path d="M560,258 L400,258" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-m)"/>
  <rect x="441.3" y="244.8" width="77.4" height="10.2" fill="#f5f5f5"/>
  <text x="480.0" y="252" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">4 张卡 + 2 条硬约束</text>
  <path d="M400,296 L715,296" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-a)"/>
  <rect x="504.4" y="282.8" width="106.2" height="10.2" fill="#f5f5f5"/>
  <text x="557.5" y="290" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#bf4520">6 段上下文，按预算裁到 9.4k</text>
  <text x="406" y="305" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">p95 78ms</text>
  <path d="M715,330 L870,330" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-m)"/>
  <rect x="769.3" y="316.8" width="46.3" height="10.2" fill="#f5f5f5"/>
  <text x="792.5" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">apply(ops)</text>
  <path d="M870,356 L250,356" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-m)"/>
  <rect x="528.8" y="342.8" width="62.4" height="10.2" fill="#f5f5f5"/>
  <text x="560.0" y="350" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">commit(rev 41)</text>
  <text x="256" y="365" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">事件先落盘</text>
  <path d="M715,384 L100,384" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-m)"/>
  <rect x="368.5" y="370.8" width="78.0" height="10.2" fill="#f5f5f5"/>
  <text x="407.5" y="378" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#4f5d75">回复：已换，标题未动</text>
  <line x1="48" y1="410" x2="322" y2="410" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="660" y1="410" x2="912" y2="410" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="491" y="414" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="middle" fill="#bf4520">turn 结束 · 之后全部异步，不阻塞回复</text>
  <path d="M250,440 L560,440" fill="none" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-m)"/>
  <rect x="371.8" y="426.8" width="66.5" height="10.2" fill="#f5f5f5"/>
  <text x="405.0" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#5a6580">append(episode)</text>
  <text x="256" y="449" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">含 op 批次与 diff</text>
  <path d="M250,468 L560,468" fill="none" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-m)"/>
  <rect x="361.0" y="454.8" width="88.1" height="10.2" fill="#f5f5f5"/>
  <text x="405.0" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#5a6580">turn.post → 候选 3 条</text>
  <text x="256" y="477" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.2" font-weight="400" text-anchor="start" fill="#5a6580">抽取在后台</text>
  <path d="M560,506 L592.0,506.0 Q598,506 598.0,512.0 L598.0,528.0 Q598,534 592.0,534.0 L560,534" fill="none" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-m)"/>
  <text x="606" y="510" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#5a6580">巩固：合并 / 冲突 / 衰减</text>
  <text x="606" y="522" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#5a6580">从 M1 重算 M2，不在热路径上</text>
  <path d="M560,566 L400,566" fill="none" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-m)"/>
  <rect x="451.8" y="552.8" width="56.4" height="10.2" fill="#f5f5f5"/>
  <text x="480.0" y="560" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" font-weight="400" text-anchor="middle" fill="#5a6580">预取下一轮候选</text>
  <rect x="48" y="598" width="10" height="10" rx="1" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <text x="64" y="607" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">同步（阻断 turn）</text>
  <line x1="190" y1="603" x2="220" y2="603" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="228" y="607" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#4f5d75">异步（失败只降级）</text>
  <text x="912" y="607" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" font-weight="400" text-anchor="end" fill="#5a6580">t ↓</text>
</svg>
