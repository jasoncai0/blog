<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d10-title d10-desc">
  <title id="d10-title">灰度与 guardrail 自动回滚</title>
  <desc id="d10-desc">灰度按 1%、10%、50% 递增；指标连续三个窗口越过阈值即触发自动回滚到上一版本，回滚后指标回到基线。</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" fill="#5a6580" letter-spacing="0.16em">CANARY · GUARDRAIL</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#2d3142">灰度不是慢慢放量，是带着刹车放量</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5a6580">指标越线的第三个窗口，系统自己松手</text>
