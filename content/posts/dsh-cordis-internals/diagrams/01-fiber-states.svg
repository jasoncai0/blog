<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">fiber 的六个状态</title>
<desc id="f01-desc">PENDING / LOADING / ACTIVE / FAILED / DISPOSED / UNLOADING；四条优先级规则决定稳定态。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">CORDIS / FIBER</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一个插件就是一根 fiber</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">菱形是判定，方框是状态；虚线是内部迁移。</text>
<rect x="60" y="150" width="180" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">PENDING</text><text x="72" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">epoch = INACTIVE</text><text x="72" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">依赖未满足</text><rect x="390" y="150" width="180" height="74" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="402" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">ACTIVE</text><text x="402" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">epoch 非 INACTIVE</text><text x="402" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">依赖全部到位</text><rect x="720" y="150" width="180" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="732" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">FAILED</text><text x="732" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">_error 存在</text><text x="732" y="200" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">只能 update() 清除</text><rect x="60" y="330" width="180" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">DISPOSED</text><text x="72" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">uid === null</text><text x="72" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">不可再迁移</text><rect x="390" y="330" width="180" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="402" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">LOADING</text><text x="402" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">_reload() 进行中</text><text x="402" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">inertia 非空</text><rect x="720" y="330" width="180" height="74" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="732" y="350" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">UNLOADING</text><text x="732" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">_unload() 进行中</text><text x="732" y="380" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">等 dependents 清零</text><line x1="240" y1="187" x2="390" y2="187" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><text x="252" y="180" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#bf4520">epoch 变非 INACTIVE</text><line x1="390" y1="187" x2="240" y2="187" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(##4f5d75-a)"/><text x="252" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">依赖缺失</text><line x1="390" y1="224" x2="390" y2="330" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#f01-g)"/><line x1="480" y1="330" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#f01-g)"/><text x="492" y="300" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">epoch 恢复即 _reload</text><line x1="570" y1="367" x2="720" y2="187" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#f01-g)"/><text x="600" y="286" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">装载失败 → FAILED</text><line x1="120" y1="224" x2="120" y2="330" stroke="#bf4520" stroke-width="1.3" marker-end="url(##4f5d75-a)"/><text x="132" y="286" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">dispose()</text><line x1="720" y1="367" x2="240" y2="187" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(##4f5d75-a)"/><text x="430" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">卸载完成 → PENDING</text><rect x="60" y="440" width="840" height="72" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="462" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">_getState() 优先级</text><text x="76" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">uid === null → DISPOSED</text><text x="286" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">_error → FAILED</text><text x="496" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">epoch !== INACTIVE → ACTIVE</text><text x="706" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">否则 → PENDING</text><text x="76" y="504" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#5a6580">LOADING 与 UNLOADING 不在优先级里，由 _setEpoch() 显式设置，只为让 await() 有东西可等。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / FIBER</text>
</svg>
