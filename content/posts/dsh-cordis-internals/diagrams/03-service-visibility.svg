<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">服务只在提供者 ACTIVE 时可见</title>
<desc id="f03-desc">provide 走 fiber.effect 自动注销；读取时先按 isolate 取实现，再按状态决定是否可见。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">CORDIS / SERVICE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">一个名字，一根 fiber 写</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三个拒绝：未 provide、跨 fiber 写、提供者非 ACTIVE。</text>
<rect x="60" y="110" width="250" height="96" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Provider fiber</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">new Service(ctx, 'tools')</text><text x="72" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.reflect.provide(...)</text><rect x="60" y="250" width="250" height="84" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="270" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">fiber.effect 包裹</text><text x="72" y="285" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">卸载时自动注销</text><text x="72" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">无手写 teardown</text><line x1="185" y1="206" x2="185" y2="250" stroke="#bf4520" stroke-width="1.2" marker-end="url(##bf4520-a)"/><rect x="380" y="110" width="240" height="224" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="396" y="134" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.6" font-weight="600" fill="#2d3142">store（按 isolate 符号）</text><line x1="396" y1="192" x2="604" y2="192" stroke="#d8d8d8"/><text x="396" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#4f5d75">Symbol("tools")</text><text x="396" y="186" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#2d3142">implA · ACTIVE</text><line x1="396" y1="250" x2="604" y2="250" stroke="#d8d8d8"/><text x="396" y="228" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#4f5d75">Symbol("tools")@agent</text><text x="396" y="244" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#bf4520">implB · LOADING</text><line x1="396" y1="308" x2="604" y2="308" stroke="#d8d8d8"/><text x="396" y="286" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#4f5d75">Symbol("web")</text><text x="396" y="302" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.9" fill="#2d3142">implC · ACTIVE</text><rect x="700" y="140" width="200" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="712" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Consumer</text><text x="712" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.get('tools')</text><text x="712" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">strict 默认 true</text><rect x="700" y="260" width="200" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="712" y="280" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Consumer</text><text x="712" y="295" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">ctx.get('tools', false)</text><text x="712" y="310" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">绕过状态检查</text><line x1="620" y1="180" x2="700" y2="180" stroke="#bf4520" stroke-width="1.1" marker-end="url(##4f5d75-a)"/><line x1="620" y1="300" x2="700" y2="300" stroke="#bf4520" stroke-width="1.1" marker-end="url(##4f5d75-a)"/><text x="640" y="172" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">ACTIVE</text><text x="640" y="292" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#bf4520">LOADING</text><text x="700" y="250" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">返回实例</text><text x="700" y="372" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">返回实例（可能半初始化）</text><rect x="60" y="400" width="840" height="90" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="424" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.1em" fill="#bf4520">三个拒绝</text><text x="76" y="446" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">未 provide 时 set → cannot set property "X" without provide</text><text x="76" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">跨 fiber 写 → cannot set property "X" in multiple fibers</text><text x="76" y="482" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">provide 与已有声明不同类型 → property "X" is already declared as Y</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="502" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / SERVICE</text>
</svg>
