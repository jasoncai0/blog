<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">effect 树与逆序释放</title>
<desc id="f02-desc">外层先注册、内层后注册；拆除时从最内层开始，前一个返回 Promise 则链式等待。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">CORDIS / EFFECT</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">注册即副作用</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">四条 effect，两种拆除顺序：fiber 内按注册逆序，fiber 间按依赖反序。</text>
<rect x="60" y="110" width="300" height="64" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="130" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">ctx.plugin() · fiber A</text><text x="72" y="145" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">父 fiber，装载子插件</text><rect x="120" y="206" width="240" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="132" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">e1 · ctx.on(session/event)</text><text x="132" y="241" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">移除监听</text><rect x="180" y="286" width="180" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="192" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">e2 · ctx.provide(tools)</text><text x="192" y="321" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">注销服务</text><rect x="240" y="366" width="150" height="56" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="252" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">e3 · 子 fiber dispose</text><text x="252" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">拆子树</text><line x1="210" y1="174" x2="240" y2="206" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(##4f5d75-a)"/><line x1="240" y1="262" x2="270" y2="286" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(##4f5d75-a)"/><line x1="270" y1="342" x2="300" y2="366" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(##4f5d75-a)"/><text x="560" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.1em" fill="#bf4520">拆除顺序</text><rect x="560" y="140" width="340" height="52" rx="6" fill="#ffffff" stroke="#bf4520"/><circle cx="580" cy="166" r="11" fill="#bf4520" stroke="#bf4520"/><text x="580" y="170" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">1</text><text x="600" y="162" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">e3 子 fiber</text><text x="600" y="178" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">拆子树</text><line x1="730" y1="192" x2="730" y2="204" stroke="#bf4520" stroke-width="1.1" marker-end="url(##4f5d75-a)"/><rect x="560" y="204" width="340" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><circle cx="580" cy="230" r="11" fill="#f5f5f5" stroke="#bf4520"/><text x="580" y="234" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">2</text><text x="600" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">e2 服务</text><text x="600" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">注销</text><line x1="730" y1="256" x2="730" y2="268" stroke="#bf4520" stroke-width="1.1" marker-end="url(##4f5d75-a)"/><rect x="560" y="268" width="340" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><circle cx="580" cy="294" r="11" fill="#f5f5f5" stroke="#bf4520"/><text x="580" y="298" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">3</text><text x="600" y="290" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">e1 监听</text><text x="600" y="306" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">移除</text><line x1="730" y1="320" x2="730" y2="332" stroke="#bf4520" stroke-width="1.1" marker-end="url(##4f5d75-a)"/><rect x="560" y="332" width="340" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><circle cx="580" cy="358" r="11" fill="#f5f5f5" stroke="#bf4520"/><text x="580" y="362" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#bf4520">4</text><text x="600" y="354" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" font-weight="600" fill="#2d3142">fiber A</text><text x="600" y="370" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">PENDING</text><rect x="60" y="452" width="840" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="474" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.1em" fill="#bf4520">两条规则叠起来才是完整顺序</text><text x="76" y="492" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">fiber 内部：disposables.splice(0).reverse() 串行执行，清空后再跑，避免清理中新建的被卷入本轮。</text><text x="76" y="506" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.7" fill="#4f5d75">fiber 之间：_unload() 先 while (provisions.some(dependents.size)) 等依赖方卸载完，才拆自己的 effect。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / EFFECT</text>
</svg>
