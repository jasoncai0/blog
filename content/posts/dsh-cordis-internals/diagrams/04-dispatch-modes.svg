<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">五种派发，一种否决</title>
<desc id="f04-desc">emit / parallel / serial / bail / waterfall；waterfall 的两条硬规则决定 DSH 的拦截语义。</desc>
<rect width="960" height="540" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">CORDIS / EVENTS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">waterfall 不是「通知」</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">不调 next() 是否决，连内建行为一起否决。</text>
<rect x="60" y="104" width="840" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="126" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#2d3142">emit</text><text x="190" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不等待 Promise</text><text x="375" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">跑完为止</text><text x="560" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">抛出即中断</text><text x="745" y="126" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">session/event</text><rect x="60" y="162" width="840" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="184" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#2d3142">parallel</text><text x="190" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">等全部</text><text x="375" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">跑完为止</text><text x="560" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">聚合成 AggregateError</text><text x="745" y="184" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">并行通知</text><rect x="60" y="220" width="840" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="242" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#2d3142">serial</text><text x="190" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">逐个 await</text><text x="375" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">第一个 bail</text><text x="560" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">抛出即中断</text><text x="745" y="242" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">agent/turn-stopping</text><rect x="60" y="278" width="840" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="300" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#2d3142">bail</text><text x="190" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不等待</text><text x="375" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">第一个同步 bail</text><text x="560" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">抛出即中断</text><text x="745" y="300" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">同步短路查询</text><rect x="60" y="336" width="840" height="52" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="76" y="358" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8.2" fill="#bf4520">waterfall</text><text x="190" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">看实现</text><text x="375" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">不调 next() 即否决</text><text x="560" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">抛出即中断</text><text x="745" y="358" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">tools/pre-execute</text><rect x="60" y="410" width="560" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.1em" fill="#bf4520">waterfall 的实现要点</text><text x="76" y="454" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">inner = args.pop()：最后入参是内建行为，链跑完才落到它</text><text x="76" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">if (!callback) return inner()：没有监听器就直接跑内建</text><text x="76" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">不调 next()：dispatch 不再继续，inner 也不执行</text><text x="76" y="502" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">next() 第二次：抛 next() called multiple times</text><rect x="640" y="410" width="260" height="86" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="656" y="434" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" letter-spacing="0.1em" fill="#bf4520">isBailed(v)</text><text x="656" y="454" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#2d3142">v !== null &amp;&amp; v !== false</text><text x="656" y="470" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#2d3142">&amp;&amp; v !== undefined</text><text x="656" y="488" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">返回 false 与不返回都不算否决</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="522" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / EVENTS</text>
</svg>
