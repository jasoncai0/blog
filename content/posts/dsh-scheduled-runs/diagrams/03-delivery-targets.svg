<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">三种目标，三条时间线</title>
<desc id="f03-desc">session 复用；new_once 预留后复用；new 每次新建，失败重试仍用同一 id。</desc>
<rect width="960" height="440" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SCHEDULE / TARGETS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">复用还是新建</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">新建前先把 pending targetSessionId 落库。</text>
<text x="40" y="124" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">session</text><text x="40" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">不创建</text><rect x="200" y="110" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="212" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><line x1="354" y1="127" x2="386" y2="127" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="390" y="110" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="402" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><line x1="544" y1="127" x2="576" y2="127" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="580" y="110" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="592" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><text x="200" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580">固定会话承载全部投递</text><text x="40" y="224" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">new_once</text><text x="40" y="240" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">首次预留</text><rect x="200" y="210" width="150" height="34" rx="4" fill="#ffffff" stroke="#bf4520"/><text x="212" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><line x1="354" y1="227" x2="386" y2="227" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="390" y="210" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="402" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><line x1="544" y1="227" x2="576" y2="227" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="580" y="210" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="592" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><text x="200" y="260" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580">第一次创建后保存为 session</text><text x="40" y="324" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">new</text><text x="40" y="340" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">每次新建</text><rect x="200" y="310" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="212" y="332" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u1</text><line x1="354" y1="327" x2="386" y2="327" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="390" y="310" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="402" y="332" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u2</text><line x1="544" y1="327" x2="576" y2="327" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#f03-g)"/><rect x="580" y="310" width="150" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="592" y="332" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#4f5d75">u3</text><text x="200" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#5a6580">重试复用同一 pending id</text><text x="40" y="410" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.4" fill="#4f5d75">省略 target 时默认 new_once；嵌入环境没有会话创建能力时，新增 new/new_once 会在保存前被拒绝。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f03-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="422" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">03 / TARGETS</text>
</svg>
