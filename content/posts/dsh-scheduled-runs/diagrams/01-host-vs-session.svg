<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">任务属于宿主，投递才绑定会话</title>
<desc id="f01-desc">进程里只有一个定时器；任务库与会话解耦，tick 到点才解析目标。</desc>
<rect width="960" height="430" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SCHEDULE / TOPOLOGY</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">两个进程域</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">界面读任务库不需要启动会话。</text>
<rect x="40" y="96" width="580" height="230" rx="8" fill="#ffffff" stroke="#d8d8d8"/><text x="56" y="120" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.1em" fill="#bf4520">HOST 进程</text><rect x="64" y="140" width="230" height="96" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="76" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">schedule.json</text><text x="76" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">tasks[] · 领域 v2</text><text x="76" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">scheduledAt 规范 UTC</text><rect x="330" y="140" width="260" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="342" y="160" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">单个定时器</text><text x="342" y="175" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">指向最早的可投递时刻</text><text x="342" y="190" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">钳到 2_147_483_647 ms</text><rect x="64" y="262" width="526" height="48" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="282" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">drive() → deliverDue()：扫描、分组、恢复、写出、回执、释放槽位</text><rect x="656" y="246" width="264" height="96" rx="8" fill="#ffffff" stroke="#d8d8d8"/><text x="672" y="268" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" letter-spacing="0.1em" fill="#bf4520">会话 / SESSION</text><rect x="672" y="278" width="232" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="684" y="298" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">收件箱 + 日志</text><text x="684" y="313" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">followup 写 next-turn，flush 后落回执</text><line x1="294" y1="188" x2="330" y2="188" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="460" y1="236" x2="460" y2="262" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="590" y1="282" x2="656" y2="282" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f01-a)"/><line x1="656" y1="306" x2="590" y2="306" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><text x="612" y="300" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">flush + receipt</text><text x="612" y="276" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">target</text><text x="40" y="366" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">三种目标</text><rect x="40" y="374" width="280" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="50" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#2d3142">session</text><text x="50" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">固定会话，复用</text><rect x="340" y="374" width="280" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="350" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#2d3142">new_once</text><text x="350" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">预留 id，之后复用</text><rect x="640" y="374" width="280" height="34" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="650" y="388" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" fill="#2d3142">new</text><text x="650" y="401" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7" fill="#4f5d75">每次新建，重试复用</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="412" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / TOPOLOGY</text>
</svg>
