<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">一个改提示词，一个只记账</title>
<desc id="f04-desc">plan mode 决定模型此刻该怎么想；todo_write 记录模型打算怎么做。</desc>
<rect width="960" height="340" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">PLAN / TODO</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">同叫计划，两种东西</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">左边有准入与人，右边只有工具调用。</text>
<rect x="40" y="100" width="420" height="170" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="52" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">plan mode</text><text x="52" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">状态：plan/mode，{ active } 整值替换</text><text x="52" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">落库：会话事件日志，可回放</text><text x="52" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">上下文：激活时注入 plan:policy（order 500）</text><text x="52" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">入口：/plan 或模型声明退出</text><text x="52" y="195" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">出口：人工批准 / /plan off / 新用户消息</text><text x="52" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">强制力：软约束，只改提示词</text><text x="52" y="225" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">失败：忘记退出、把提交当批准</text><rect x="500" y="100" width="420" height="170" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="512" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">todo_write</text><text x="512" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">状态：todo/write，整张列表替换</text><text x="512" y="150" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">落库：会话事件日志，可回放</text><text x="512" y="165" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">上下文：不进提示词，只见工具结果</text><text x="512" y="180" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">入口：模型随时调用</text><text x="512" y="195" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">出口：下一次 turn/start 清空投影</text><text x="512" y="210" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">强制力：无，纯记账</text><text x="512" y="225" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">失败：只写不更新、进度漂移</text><line x1="460" y1="210" x2="500" y2="210" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#f04-g)"/><text x="470" y="202" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#4f5d75">对比</text><text x="40" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">判断：缺「该不该动手」用 plan mode；缺「拆没拆清楚、做到哪」用 todo_write；两者不互斥。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="322" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / PLAN VS TODO</text>
</svg>
