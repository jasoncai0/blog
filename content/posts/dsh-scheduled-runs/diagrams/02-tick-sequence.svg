<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">一次 tick 的十个动作</title>
<desc id="f02-desc">从上到下；红点表示写入了持久存储。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">SCHEDULE / TICK</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">十个动作</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">恢复与恢复后的重过滤是最容易漏的两步。</text>
<rect x="30" y="92" width="140" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="100" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">定时器</text><line x1="100" y1="120" x2="100" y2="508" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="230" y="92" width="140" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="300" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">到期集合</text><line x1="300" y1="120" x2="300" y2="508" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="430" y="92" width="140" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="500" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">目标解析</text><line x1="500" y1="120" x2="500" y2="508" stroke="#d8d8d8" stroke-dasharray="3 4"/><rect x="670" y="92" width="140" height="28" rx="4" fill="#ffffff" stroke="#d8d8d8"/><text x="740" y="110" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">会话 / 回执</text><line x1="740" y1="120" x2="740" y2="508" stroke="#d8d8d8" stroke-dasharray="3 4"/><text x="42" y="148" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">01</text><text x="108" y="148" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">clearTimeout；避免重入</text><text x="42" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">02</text><text x="308" y="176" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">扫描 active 且 scheduledAt ≤ now</text><text x="42" y="204" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">03</text><line x1="306" y1="204" x2="494" y2="204" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f02-g)"/><text x="400" y="198" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">按目标会话分组 batch</text><text x="42" y="232" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">04</text><text x="508" y="232" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">admission floor + 恢复未确认投递</text><text x="42" y="260" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">05</text><line x1="506" y1="260" x2="734" y2="260" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f02-g)"/><text x="620" y="254" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">resolveTarget：session / new_once / new</text><text x="42" y="288" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">06</text><text x="508" y="288" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">时钟回拨后重过滤</text><text x="42" y="316" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">07</text><text x="508" y="316" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">渲染提醒（source.kind=schedule）</text><text x="42" y="344" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">08</text><line x1="506" y1="344" x2="734" y2="344" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#f02-g)"/><text x="620" y="338" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">agent.followup → 写 next-turn</text><circle cx="620" cy="350" r="2.6" fill="#bf4520"/><text x="42" y="372" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">09</text><line x1="746" y1="372" x2="494" y2="372" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#f02-g)"/><text x="620" y="366" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.2" fill="#4f5d75">sessions.flush 拿 messageId</text><text x="42" y="400" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">10</text><text x="508" y="400" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">commit 回执 + 推进下次时点</text><text x="42" y="428" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">11</text><text x="508" y="428" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">settle 释放槽位（new 不占槽）</text><text x="42" y="456" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="6.6" fill="#5a6580">12</text><text x="108" y="456" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">重设 setTimeout（取最早）</text><text x="40" y="532" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">收件箱写成功、回执未写就崩溃时，重启会重复投递一次；两写之间没有分布式事务。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / TICK</text>
</svg>
