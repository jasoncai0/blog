<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="f06-02-title f06-02-desc">
  <title id="f06-02-title">Computer Use 的注册槽位与两级授权</title>
  <desc id="f06-02-desc">上图从 profile 到单槽注册表、provider、工具与桌面；下图从 User Questions 的应用同意到 consent policy 再到窗口操作。虚线表示策略由 provider 提供；底部说明系统权限由人在系统设置授予。</desc>
  <defs>
    <marker id="f06-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/>
    </marker>
    <marker id="f06-02-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="48" y="40" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#bf4520">FIG 02 / PROVIDER AND CONSENT</text>
  <text x="48" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="26" font-weight="600" fill="#2d3142">一个槽位，两级授权</text>
  <text x="48" y="104" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="13" fill="#5a6580">注册表只登记名字，工具、截图与动作全部由 provider 提供</text>

  <g font-family="'Geist','PingFang SC','Noto Sans SC',system-ui">
    <rect x="48" y="136" width="186" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="66" y="164" font-size="13" font-weight="600" fill="#2d3142">profile / preset</text>
    <text x="66" y="186" font-size="10.5" fill="#5a6580">选一个 provider</text>
    <text x="66" y="202" font-size="10.5" fill="#5a6580">launch 或 attach</text>

    <rect x="288" y="136" width="186" height="88" rx="6" fill="#ffffff" stroke="#bf4520"/>
    <text x="306" y="164" font-size="13" font-weight="600" fill="#2d3142">ctx.computerUse</text>
    <text x="306" y="186" font-size="10.5" fill="#5a6580">单槽注册</text>
    <text x="306" y="202" font-size="10.5" fill="#5a6580">第二次注册即失败</text>

    <rect x="528" y="136" width="186" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="546" y="164" font-size="13" font-weight="600" fill="#2d3142">provider</text>
    <text x="546" y="186" font-size="10.5" fill="#5a6580">cua · cua-macos</text>
    <text x="546" y="202" font-size="10.5" fill="#5a6580">mcp · native</text>

    <rect x="768" y="136" width="144" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="786" y="164" font-size="13" font-weight="600" fill="#2d3142">工具 + 桌面</text>
    <text x="786" y="186" font-size="10.5" fill="#5a6580">模型可见工具</text>
    <text x="786" y="202" font-size="10.5" fill="#5a6580">来自 provider</text>

    <rect x="288" y="284" width="186" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="306" y="312" font-size="13" font-weight="600" fill="#2d3142">User Questions</text>
    <text x="306" y="334" font-size="10.5" fill="#5a6580">应用级同意</text>
    <text x="306" y="350" font-size="10.5" fill="#5a6580">由人确认，不代答</text>

    <rect x="528" y="284" width="186" height="88" rx="6" fill="#ffffff" stroke="#bf4520"/>
    <text x="546" y="312" font-size="13" font-weight="600" fill="#2d3142">consent policy</text>
    <text x="546" y="334" font-size="10.5" fill="#5a6580">dispatch 之前执行</text>
    <text x="546" y="350" font-size="10.5" fill="#5a6580">按应用与操作范围判</text>

    <rect x="768" y="284" width="144" height="88" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
    <text x="786" y="312" font-size="13" font-weight="600" fill="#2d3142">窗口 / 应用</text>
    <text x="786" y="334" font-size="10.5" fill="#5a6580">动作送达</text>
    <text x="786" y="350" font-size="10.5" fill="#5a6580">取消不回收</text>
  </g>

  <line x1="234" y1="180" x2="282" y2="180" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f06-02-arrow)"/>
  <line x1="474" y1="180" x2="522" y2="180" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f06-02-arrow)"/>
  <line x1="714" y1="180" x2="762" y2="180" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f06-02-arrow)"/>
  <line x1="474" y1="328" x2="522" y2="328" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f06-02-arrow)"/>
  <line x1="714" y1="328" x2="762" y2="328" stroke="#5a6580" stroke-width="1.4" marker-end="url(#f06-02-arrow)"/>
  <line x1="621" y1="224" x2="621" y2="278" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#f06-02-arrow-accent)"/>
  <text x="633" y="256" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="10" fill="#bf4520">策略随 provider 注册</text>

  <rect x="48" y="404" width="864" height="76" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="66" y="430" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="12" font-weight="600" fill="#2d3142">系统权限走另一条路</text>
  <text x="66" y="452" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#5a6580">Accessibility 与 Screen Recording 由人在系统设置授予，provider 只检查状态并发起请求；</text>
  <text x="66" y="470" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#5a6580">session-only 授权留在 provider 内部，已保存的应用授权跨 provider 存在，撤销一条不影响另一条。</text>

  <rect x="48" y="496" width="864" height="60" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="66" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#5a6580">关闭工具与自有资源期间保留注册，启动失败才释放；MCP 断线期间保留注册，调用报连接错误。</text>
  <text x="66" y="540" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui" font-size="11" fill="#5a6580">一个 provider 不预留桌面，跨 Session 的 observe / act / verify 由调用方协调。</text>

  <text x="48" y="584" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="10" fill="#5a6580">SOURCE packages/computer-use/* · packages/experimental/cua/*</text>
</svg>
