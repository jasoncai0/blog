  <title id="f06-01-title">61 个实验包按七个功能域分组</title>
  <desc id="f06-01-desc">九宫格列出桌面执行 5 个、浏览器 4 个、集成桥 14 个、会话与检索 13 个、语音与翻译 6 个、卡片与交互 5 个、客户端面板 7 个、工程配套 7 个，合计 61 个目录；底部说明 bundle 只做组合。</desc>
