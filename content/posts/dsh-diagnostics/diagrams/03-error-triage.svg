<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="f03-title f03-desc">
<title id="f03-title">错误码分诊</title>
<desc id="f03-desc">先分谁的错，再分能不能重试，最后分谁来处置。</desc>
<rect width="960" height="520" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DIAGNOSTICS / TRIAGE</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">三步决定处置</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">同一个错误码在不同位置，处置可能相反。</text>
<text x="60" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.08em" fill="#bf4520">来源</text><text x="230" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.08em" fill="#bf4520">典型码</text><text x="470" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.08em" fill="#bf4520">可重试</text><text x="610" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.08em" fill="#bf4520">处置</text><text x="800" y="106" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.4" letter-spacing="0.08em" fill="#bf4520">谁做</text><rect x="52" y="112" width="856" height="34" fill="#ffffff"/><text x="60" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">提供方</text><text x="230" y="132" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">RATE_LIMIT / TIMEOUT</text><text x="470" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">是，有上限</text><text x="610" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">退避重试</text><text x="800" y="132" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">机器</text><text x="60" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">提供方</text><text x="230" y="170" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">QUOTA / INVALID_CREDENTIAL</text><text x="470" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">否</text><text x="610" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">换账号