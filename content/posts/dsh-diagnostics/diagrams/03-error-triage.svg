ext x="610" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">先核实外部状态</text><text x="800" y="284" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">人</text><text x="60" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">我方</text><text x="230" y="322" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">INVALID_PREPARED_CALL</text><text x="470" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">否</text><text x="610" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">修代码 + 测试</text><text x="800" y="322" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">开发者</text><rect x="52" y="340" width="856" height="34" fill="#ffffff"/><text x="60" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#2d3142">我方</text><text x="230" y="360" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.2" fill="#4f5d75">TOOL_ACTIVATION_FAILED</text><text x="470" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">否</text><text x="610" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">修条件函数</text><text x="800" y="360" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">开发者</text><text x="52" y="486" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">有副作用的那一类永远不自动重试：重试一次可能写两次文件。</text><defs><marker id="f03-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker 