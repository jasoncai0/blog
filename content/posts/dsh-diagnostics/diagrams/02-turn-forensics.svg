<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="f02-title f02-desc">
<title id="f02-title">一个坏 turn 的时间线</title>
<desc id="f02-desc">模型没回、工具没结、turn 以 error 收尾——三件事各有自己的事件。</desc>
<rect width="960" height="640" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DIAGNOSTICS / FORENSICS</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">坏在哪一段</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">左边是事件，右边是它证明的事实。</text>
<circle cx="72" cy="110" r="3.4" fill="#2d3142"/><text x="88" y="113" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">turn/start</text><text x="420" y="113" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">turn 打开，编号自增</text><circle cx="72" cy="152" r="3.4" fill="#2d3142"/><text x="88" y="155" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">step/start  step 0</text><text x="420" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">开始一次模型请求</text><circle cx="72" cy="194" r="3.4" fill="#2d3142"/><text x="88" y="197" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">user/message</text><text x="420" y="197" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">输入已进入历史</text><circle cx="72" cy="236" r="3.4" fill="#2d3142"/><text x="88" y="239" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">request/header</text><text x="420" y="239" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">header 与上一条不同（change）</text><circle cx="72" cy="278" r="3.4" fill="#bf4520"/><text x="88" y="281" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#bf4520">assistant/attempt{timeout}</text><text x="420" y="281" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">这次尝试失败，没有内容</text><circle cx="72" cy="320" r="3.4" fill="#2d3142"/><text x="88" y="323" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">step/end</text><text x="420" y="323" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">步关闭（失败也要关）</text><circle cx="72" cy="362" r="3.4" fill="#4f5d75"/><text x="88" y="365" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#4f5d75">tool/call{id:c1}</text><text x="420" y="365" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">调用已记录，但后面没有 result</text><circle cx="72" cy="404" r="3.4" fill="#2d3142"/><text x="88" y="407" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">step/start  step 1</text><text x="420" y="407" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">同一步的下一次尝试</text><circle cx="72" cy="446" r="3.4" fill="#2d3142"/><text x="88" y="449" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">assistant/message</text><text x="420" y="449" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">成功，但只到 max-tokens</text><circle cx="72" cy="488" r="3.4" fill="#2d3142"/><text x="88" y="491" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.6" fill="#2d3142">turn/end{max-tokens}</text><text x="420" y="491" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">轮次以预算结束，不是错误</text><line x1="72" y1="116" x2="72" y2="490" stroke="#d8d8d8"/><rect x="420" y="508" width="500" height="80" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="436" y="530" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">三处容易读错</text><text x="436" y="550" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.6" fill="#4f5d75">attempt 不是模型输出；turn/end 带 max-tokens 不是失败；tool/call 无 result 要看进程是否死在中间。</text><defs><marker id="f02-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f02-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="622" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">02 / FORENSICS</text>
</svg>
