<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f01-title f01-desc">
<title id="f01-title">五层证据，一层比一层派生</title>
<desc id="f01-desc">原始事实只有日志；投影、指标、追踪、复现都能从它重建。</desc>
<rect width="960" height="560" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DIAGNOSTICS / CHAIN</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">从现象回到事实</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">读日志的顺序与产生日志的顺序相反。</text>
<rect x="60" y="100" width="380" height="66" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="72" y="120" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">① 会话日志</text><text x="72" y="135" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">追加事件，永不改写</text><text x="470" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">唯一原始事实：谁在什么时候做了什么</text><line x1="250" y1="168" x2="250" y2="186" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="60" y="186" width="380" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="206" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">② 投影</text><text x="72" y="221" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">surface → 模型历史</text><text x="470" y="226" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">回答「模型当时看到什么」</text><line x1="250" y1="254" x2="250" y2="272" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="60" y="272" width="380" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="292" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">③ 指标</text><text x="72" y="307" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">token / 时延 / 重试次数</text><text x="470" y="312" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">回答「慢在哪、贵在哪」</text><line x1="250" y1="340" x2="250" y2="358" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="60" y="358" width="380" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="378" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">④ 追踪</text><text x="72" y="393" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">OTLP log record + (turn,step,callId)</text><text x="470" y="398" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">回答「跨进程谁调了谁」</text><line x1="250" y1="426" x2="250" y2="444" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f01-g)"/><rect x="60" y="444" width="380" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="464" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">⑤ 复现</text><text x="72" y="479" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">只读回放 / fork / 最小脚本</text><text x="470" y="484" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.4" fill="#4f5d75">回答「能不能稳定重现」</text><text x="60" y="520" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#5a6580">越往下越便宜：日志读一遍是分钟级，复现一次是小时级。</text><defs><marker id="f01-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f01-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="542" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">01 / CHAIN</text>
</svg>
