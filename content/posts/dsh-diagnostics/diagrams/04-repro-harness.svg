<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="f04-title f04-desc">
<title id="f04-title">复现的三条路</title>
<desc id="f04-desc">成本从左到右递增；能停在左边就别往右走。</desc>
<rect width="960" height="470" fill="#f5f5f5"/>
<text x="40" y="30" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" letter-spacing="0.16em" fill="#5a6580">DIAGNOSTICS / REPRO</text>
<text x="40" y="56" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="17" font-weight="600" fill="#2d3142">先读，再分叉，最后重写</text>
<text x="40" y="78" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">三条路都建立在同一份日志上。</text>
<rect x="60" y="120" width="260" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="72" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">回放</text><text x="72" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">从日志尾部重建 surface</text><text x="72" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">分钟级 · 只读</text><text x="72" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">怀疑投影或压缩</text><line x1="322" y1="195" x2="360" y2="195" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="360" y="120" width="260" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="372" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">fork</text><text x="372" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">在最后一个 turn/end 分叉</text><text x="372" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">十分钟级 · 新会话</text><text x="372" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">怀疑某一步之后走偏</text><line x1="622" y1="195" x2="660" y2="195" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#f04-g)"/><rect x="660" y="120" width="260" height="150" rx="6" fill="#ffffff" stroke="#bf4520"/><text x="672" y="140" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">最小脚本</text><text x="672" y="155" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">只保留失败那一步的输入</text><text x="672" y="170" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">小时级 · 写测试</text><text x="672" y="185" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">怀疑代码路径</text><rect x="60" y="300" width="840" height="96" rx="6" fill="#ffffff" stroke="#d8d8d8"/><text x="76" y="324" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="8" font-weight="600" fill="#2d3142">共同前提</text><text x="76" y="346" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">切点必须是最后一个 turn/end：在轮次中间分叉会得到没有结算的 turn，恢复时补一串合成事件，现场就没了。</text><text x="76" y="366" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">只读打开不发布后继日志；要保留现场，先复制文件再用，不要在生产会话上做实验。</text><text x="76" y="386" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="7.8" fill="#4f5d75">最小脚本要保留原始的 header 与 tool schema，否则复现的不是同一个请求。</text><defs><marker id="f04-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/></marker><marker id="f04-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker></defs><text x="40" y="452" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#4f5d75">04 / REPRO</text>
</svg>
