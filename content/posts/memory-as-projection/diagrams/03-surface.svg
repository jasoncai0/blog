<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="f3-ttl f3-desc">
  <title id="f3-ttl">日志是事实，surface 是投影</title>
  <desc id="f3-desc">15 条事件中，第 5 到第 10 条被一次 replace 遮蔽；第 15 条是携带摘要的新 user 消息。模型只看到下排的 9 个节点。</desc>
  <style>
    text { font-family: 'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif; fill:#2d3142; }
    .mono { font-family:'Geist Mono','SF Mono',ui-monospace,monospace; }
    .k { font-size:8px; letter-spacing:.16em; fill:#5a6580; }
    .h { font-size:16px; font-weight:600; }
    .s { font-size:9px; fill:#5a6580; }
    .b { font-size:9px; fill:#5a6580; }
    .ttl { font-size:10px; font-weight:600; }
    .lbl { font-size:7.5px; fill:#5a6580; }
    .tag { font-size:7.5px; letter-spacing:.06em; }
  </style>
  <defs>
    <marker id="f3-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f3-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f3-at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/></marker>
    <marker id="f3-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text class="k mono" x="48" y="38">MEMORY · SESSION LOG → SURFACE</text>
  <text class="h" x="48" y="66">日志是事实，surface 是投影</text>
  <text class="s" x="48" y="86">压缩不删除任何事件：它只在派生视图上盖住一段区间，并追加一条摘要消息</text>
  <text class="ttl" x="48" y="132">Session 日志（仅追加）</text>
  <text class="b" x="920" y="124" text-anchor="end">一条 replace 只改视图</text>
  <rect x="48" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
  <text class="mono" x="76.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">1</text>
  <text class="mono" x="76.0" y="184" text-anchor="middle" fill="#6b4f8a" font-size="8px">sys</text>
  <rect x="107" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
  <text class="mono" x="135.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">2</text>
  <text class="mono" x="135.0" y="184" text-anchor="middle" fill="#1f6f6b" font-size="8px">usr</text>
  <rect x="166" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
