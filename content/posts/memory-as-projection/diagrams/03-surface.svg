  <text class="mono" x="430.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">7</text>
  <text class="mono" x="430.0" y="184" text-anchor="middle" fill="#9a6b1f" font-size="8px">tool</text>
  <rect x="461" y="150" width="56" height="46" rx="4" fill="#e9e5dd" stroke="#b8b1a5" stroke-dasharray="4 3"/>
  <text class="mono" x="489.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">8</text>
  <text class="mono" x="489.0" y="184" text-anchor="middle" fill="#1f6f6b" font-size="8px">usr</text>
  <rect x="520" y="150" width="56" height="46" rx="4" fill="#e9e5dd" stroke="#b8b1a5" stroke-dasharray="4 3"/>
  <text class="mono" x="548.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">9</text>
  <text class="mono" x="548.0" y="184" text-anchor="middle" fill="#2d3142" font-size="8px">asst</text>
  <rect x="579" y="150" width="56" height="46" rx="4" fill="#e9e5dd" stroke="#b8b1a5" stroke-dasharray="4 3"/>
  <text class="mono" x="607.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">10</text>
  <text class="mono" x="607.0" y="184" text-anchor="middle" fill="#9a6b1f" font-size="8px">tool</text>
  <rect x="638" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
  <text class="mono" x="666.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">11</text>
  <text class="mono" x="666.0" y="184" text-anchor="middle" fill="#1f6f6b" font-size="8px">usr</text>
