  <text class="mono" x="725.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">12</text>
  <text class="mono" x="725.0" y="184" text-anchor="middle" fill="#2d3142" font-size="8px">asst</text>
  <rect x="756" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
  <text class="mono" x="784.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">13</text>
  <text class="mono" x="784.0" y="184" text-anchor="middle" fill="#1f6f6b" font-size="8px">usr</text>
  <rect x="815" y="150" width="56" height="46" rx="4" fill="#fff" stroke="#c9ced8"/>
  <text class="mono" x="843.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">14</text>
  <text class="mono" x="843.0" y="184" text-anchor="middle" fill="#2d3142" font-size="8px">asst</text>
  <rect x="874" y="150" width="56" height="46" rx="4" fill="#f8ddd4" stroke="#bf4520"/>
  <text class="mono" x="902.0" y="167" text-anchor="middle" fill="#5a6580" font-size="7px">15</text>
  <text class="mono" x="902.0" y="184" text-anchor="middle" fill="#bf4520" font-size="8px">sum</text>
  <path d="M284,204 L284,210 L635,210 L635,204" fill="none" stroke="#5a6580" stroke-width="1"/>
  <text class="lbl" x="459.5" y="226" text-anchor="middle">被遮蔽：仍留在日志，deriveMessages 不再返回</text>
  <text class="lbl" x="920" y="140" text-anchor="end" fill="#bf4520">第 15 条：摘要 + replace 操作</text>
  <path d="M480,240 L480,296" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f3-ai)"/>
  <text class="lbl" x="492" y="270">deriveMessages() 按 surface 顺序投影</text>
  <text class="ttl" x="48" y="320">Surface：模型实际看到的消息序列</text>
  <rect x="48" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="91.0" y="358" text-anchor="middle" fill="#6b4f8a" font-size="9px">system 0</text>
  <text class="mono" x="91.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 1</text>
  <rect x="144" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="187.0" y="358" text-anchor="middle" fill="#1f6f6b" font-size="9px">user</text>
  <text class="mono" x="187.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 2</text>
  <rect x="240" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="283.0" y="358" text-anchor="middle" fill="#2d3142" font-size="9px">assistant</text>
  <text class="mono" x="283.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 3</text>
  <rect x="336" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="379.0" y="358" text-anchor="middle" fill="#9a6b1f" font-size="9px">tool</text>
  <text class="mono" x="379.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 4</text>
  <rect x="432" y="336" width="86" height="54" rx="5" fill="#f8ddd4" stroke="#bf4520"/>
  <text class="ttl" x="475.0" y="358" text-anchor="middle" fill="#bf4520" font-size="9px">summary</text>
  <text class="mono" x="475.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 15</text>
  <rect x="528" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="571.0" y="358" text-anchor="middle" fill="#1f6f6b" font-size="9px">user</text>
  <text class="mono" x="571.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 11</text>
  <rect x="624" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="667.0" y="358" text-anchor="middle" fill="#2d3142" font-size="9px">assistant</text>
  <text class="mono" x="667.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 12</text>
  <rect x="720" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="763.0" y="358" text-anchor="middle" fill="#1f6f6b" font-size="9px">user</text>
  <text class="mono" x="763.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 13</text>
  <rect x="816" y="336" width="86" height="54" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="859.0" y="358" text-anchor="middle" fill="#2d3142" font-size="9px">assistant</text>
  <text class="mono" x="859.0" y="376" text-anchor="middle" fill="#5a6580" font-size="7px">seq 14</text>
  <path d="M48,398 L48,404 L902,404 L902,398" fill="none" stroke="#c9ced8" stroke-width="1"/>
  <text class="lbl" x="478" y="420" text-anchor="middle">9 个节点；摘要节点是 user 角色，排在保留区之前</text>
  <text class="ttl" x="48" y="442">KV 前缀复用</text>
  <rect x="48" y="452" width="390" height="18" rx="4" fill="#dceceb" stroke="#1f6f6b"/>
  <text class="lbl" x="243" y="465" text-anchor="middle" fill="#1f6f6b">可复用：seq 1–4 的 token 前缀</text>
  <rect x="438" y="452" width="464" height="18" rx="4" fill="#f3e2dc" stroke="#bf4520"/>
  <text class="lbl" x="670" y="465" text-anchor="middle" fill="#bf4520">从第一条被改写消息起失效：摘要请求要重新建立缓存</text>
  <line x1="48" y1="502" x2="912" y2="502" stroke="#c9ced8"/>
  <text class="b" x="48" y="524">· 替换只接受 { op:&#x27;replace&#x27;, startSeq, endSeq }，闭区间，按当前 surface 顺序解释；重复回放结果确定。</text>
  <text class="b" x="48" y="546">· compaction/start、compaction/summary、compaction/end 都只写日志，永远不出现在 surface 上。</text>
  <text class="b" x="48" y="568">· 因此「压缩后模型看到什么」可被日志完整重建：一条摘要消息 + 未被遮蔽的节点。</text>
</svg>
