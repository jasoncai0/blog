<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="f6-ttl f6-desc">
  <title id="f6-ttl">一条记忆的生命周期：可逆的遮蔽，与不可逆的删除</title>
  <desc id="f6-desc">两套系统都把「删除」放在文件系统或保留策略层；模型能做的，最狠也只是遮蔽与重建。</desc>
  <style>
    text { font-family: 'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif; fill:#2d3142; }
    .mono { font-family:'Geist Mono','SF Mono',ui-monospace,monospace; }
    .k { font-size:8px; letter-spacing:.16em; fill:#5a6580; }
    .h { font-size:16px; font-weight:600; }
    .s { font-size:9px; fill:#5a6580; }
    .b { font-size:9px; fill:#5a6580; }
    .ttl { font-size:10px; font-weight:600; }
    .lbl { font-size:7.5px; fill:#5a6580; }
    .tag { font-size:7.5px; letter-spacing:.06em; }
  </style>
  <defs>
    <marker id="f6-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f6-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f6-at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/></marker>
    <marker id="f6-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text class="k mono" x="48" y="38">MEMORY · LIFECYCLE &amp; RETENTION</text>
  <text class="h" x="48" y="66">一条记忆的生命周期：可逆的遮蔽，与不可逆的删除</text>
  <text class="s" x="48" y="86">写入之后，它可能被装配、被遮蔽、被检索，最后才在文件系统层消失</text>
  <rect x="48" y="112" width="164" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="58" y="130">① 写入</text>
  <text class="lbl" x="58" y="144">谁产生事实</text>
  <rect x="224" y="112" width="164" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="234" y="130">② 装配</text>
  <text class="lbl" x="234" y="144">进入请求</text>
  <rect x="400" y="112" width="164" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="410" y="130">③ 遮蔽 / 替换</text>
  <text class="lbl" x="410" y="144">离开请求</text>
  <rect x="576" y="112" width="164" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="586" y="130">④ 休眠</text>
  <text class="lbl" x="586" y="144">仍可检索或复制</text>
  <rect x="752" y="112" width="164" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="762" y="130">⑤ 物理删除</text>
  <text class="lbl" x="762" y="144">不可逆</text>
  <rect x="48" y="172" width="52" height="20" rx="4" fill="#1f6f6b"/>
  <text class="tag" x="74" y="186" text-anchor="middle" fill="#fff">DSH</text>
  <rect x="48" y="196" width="164" height="62" rx="6" fill="#fff" stroke="#1f6f6b"/>
  <text class="ttl" x="60" y="220" font-size="9px">写事件</text>
  <text class="lbl" x="60" y="240">user / tool / summary</text>
  <path d="M212,227 L224,227" fill="none" stroke="#1f6f6b" stroke-width="1.3" marker-end="url(#f6-at)"/>
  <rect x="224" y="196" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="236" y="220" font-size="9px">surface 投影</text>
  <text class="lbl" x="236" y="240">deriveMessages()</text>
  <path d="M388,227 L400,227" fill="none" stroke="#1f6f6b" stroke-width="1.3" marker-end="url(#f6-at)"/>
  <rect x="400" y="196" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="412" y="220" font-size="9px">replace 遮蔽</text>
  <text class="lbl" x="412" y="240">日志保留原文</text>
  <path d="M564,227 L576,227" fill="none" stroke="#5a6580" stroke-width="1.3" marker-end="url(#f6-am)"/>
  <rect x="576" y="196" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8" stroke-dasharray="4 3"/>
  <text class="ttl" x="588" y="220" font-size="9px">检索 / 复制</text>
  <text class="lbl" x="588" y="240">search、fork、decompress</text>
  <path d="M740,227 L752,227" fill="none" stroke="#5a6580" stroke-width="1.3" marker-end="url(#f6-am)"/>
  <rect x="752" y="196" width="164" height="62" rx="6" fill="#fff" stroke="#1f6f6b"/>
  <text class="ttl" x="764" y="220" font-size="9px">删文件</text>
  <text class="lbl" x="764" y="240">没有内置 TTL</text>
  <rect x="48" y="312" width="52" height="20" rx="4" fill="#bf4520"/>
  <text class="tag" x="74" y="326" text-anchor="middle" fill="#fff">CLAUDE</text>
  <rect x="48" y="336" width="164" height="62" rx="6" fill="#fff" stroke="#bf4520"/>
  <text class="ttl" x="60" y="360" font-size="9px">写文件</text>
  <text class="lbl" x="60" y="380">CLAUDE.md、auto memory</text>
  <path d="M212,367 L224,367" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f6-aa)"/>
  <rect x="224" y="336" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="236" y="360" font-size="9px">启动装配</text>
  <text class="lbl" x="236" y="380">system prompt + user 消息</text>
  <path d="M388,367 L400,367" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f6-aa)"/>
  <rect x="400" y="336" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="412" y="360" font-size="9px">压缩替换</text>
  <text class="lbl" x="412" y="380">transcript 保留原文</text>
  <path d="M564,367 L576,367" fill="none" stroke="#5a6580" stroke-width="1.3" marker-end="url(#f6-am)"/>
  <rect x="576" y="336" width="164" height="62" rx="6" fill="#fff" stroke="#c9ced8" stroke-dasharray="4 3"/>
  <text class="ttl" x="588" y="360" font-size="9px">磁盘留存</text>
  <text class="lbl" x="588" y="380">resume、rewind、branch</text>
  <path d="M740,367 L752,367" fill="none" stroke="#5a6580" stroke-width="1.3" marker-end="url(#f6-am)"/>
  <rect x="752" y="336" width="164" height="62" rx="6" fill="#fff" stroke="#bf4520"/>
  <text class="ttl" x="764" y="360" font-size="9px">保留期清理</text>
  <text class="lbl" x="764" y="380">cleanupPeriodDays</text>
  <path d="M610,258 C610,286 700,286 700,258" fill="none" stroke="#1f6f6b" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#f6-at)"/>
  <text class="lbl" x="712" y="284" fill="#1f6f6b">fork：复制前缀到新会话</text>
  <path d="M548,258 C548,310 460,310 460,258" fill="none" stroke="#1f6f6b" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#f6-at)"/>
  <text class="lbl" x="470" y="306" fill="#1f6f6b">decompress：重新激活</text>
  <path d="M610,398 C610,426 700,426 700,398" fill="none" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#f6-aa)"/>
  <text class="lbl" x="712" y="422" fill="#bf4520">/rewind：回到检查点</text>
  <path d="M548,398 C548,450 460,450 460,398" fill="none" stroke="#bf4520" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#f6-aa)"/>
  <text class="lbl" x="470" y="446" fill="#bf4520">/branch：复制 transcript</text>
  <line x1="48" y1="480" x2="912" y2="480" stroke="#c9ced8"/>
  <text class="b" x="48" y="504">差别不在「能不能删」，而在「删之前留下了什么」：DSH 留下完整事件日志，Claude Code 留下 transcript 与磁盘文件。</text>
  <text class="b" x="48" y="526">模型层唯一的删除是遮蔽；真正的过期要么是保留策略，要么是人手动删文件。</text>
</svg>
