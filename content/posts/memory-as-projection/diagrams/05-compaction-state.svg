<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="f5-ttl f5-desc">
  <title id="f5-ttl">压缩的状态机：正常路径只有五步，异常都在锁与边界上</title>
  <desc id="f5-desc">idle → measuring → pruning → summarizing → committing；失败与忙碌是两条旁路，overflow 是 idle 上的一种触发。</desc>
  <style>
    text { font-family: 'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif; fill:#2d3142; }
    .mono { font-family:'Geist Mono','SF Mono',ui-monospace,monospace; }
    .k { font-size:8px; letter-spacing:.16em; fill:#5a6580; }
    .h { font-size:16px; font-weight:600; }
    .s { font-size:9px; fill:#5a6580; }
    .b { font-size:9px; fill:#5a6580; }
    .ttl { font-size:10px; font-weight:600; }
    .lbl { font-size:7.5px; fill:#5a6580; }
    .tag { font-size:7.5px; letter-spacing:.06em; }
  </style>
  <defs>
    <marker id="f5-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f5-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f5-at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/></marker>
    <marker id="f5-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text class="k mono" x="48" y="38">MEMORY · COMPACTION STATE MACHINE</text>
  <text class="h" x="48" y="66">压缩的状态机：正常路径只有五步，异常都在锁与边界上</text>
  <text class="s" x="48" y="86">每次失败都恰好闭合一次；闭合失败会留下未匹配的 start，作为下一次的 busy 信号</text>
  <rect x="40" y="150" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="54" y="168" fill="#2d3142" font-size="10px">idle</text>
  <text class="b" x="54" y="184">没有压缩在进行</text>
  <rect x="220" y="150" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="234" y="168" fill="#2d3142" font-size="10px">measuring</text>
  <text class="b" x="234" y="184">token meter 计价</text>
  <rect x="400" y="150" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="414" y="168" fill="#2d3142" font-size="10px">pruning</text>
  <text class="b" x="414" y="184">修剪超大工具结果</text>
  <rect x="580" y="150" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="594" y="168" fill="#2d3142" font-size="10px">summarizing</text>
  <text class="b" x="594" y="184">一次摘要 LLM 调用</text>
  <rect x="760" y="150" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="774" y="168" fill="#2d3142" font-size="10px">committing</text>
  <text class="b" x="774" y="184">summary + replace + end</text>
  <rect x="400" y="330" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="414" y="348" fill="#2d3142" font-size="10px">blocked</text>
  <text class="b" x="414" y="364">未匹配 start；陈旧则清理</text>
  <rect x="580" y="330" width="150" height="56" rx="6" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="594" y="348" fill="#2d3142" font-size="10px">failed</text>
  <text class="b" x="594" y="364">end(error) 闭合</text>
  <path d="M190,178 L220,178" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f5-ai)"/>
  <text class="lbl" x="205" y="142" text-anchor="middle">触发</text>
  <path d="M370,178 L400,178" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f5-ai)"/>
  <text class="lbl" x="385" y="142" text-anchor="middle">≥ 阈值</text>
  <path d="M550,178 L580,178" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f5-ai)"/>
  <text class="lbl" x="565" y="142" text-anchor="middle">仍有压力</text>
  <path d="M730,178 L760,178" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f5-ai)"/>
  <text class="lbl" x="745" y="142" text-anchor="middle">摘要可用</text>
  <path d="M835,150 C835,104 115,104 115,150" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f5-ai)"/>
  <text class="lbl" x="475" y="112" text-anchor="middle">replace 成功；compaction/end 释放锁</text>
  <path d="M260,206 C260,246 145,246 145,206" fill="none" stroke="#5a6580" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#f5-am)"/>
  <text class="lbl" x="202" y="262" text-anchor="middle">低于阈值：不写日志</text>
  <path d="M300,206 L300,326" fill="none" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f5-aa)"/>
  <text class="lbl" x="290" y="270" text-anchor="end" fill="#bf4520">已有活动锁</text>
  <path d="M330,330 L330,206" fill="none" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f5-aa)"/>
  <path d="M655,206 L655,326" fill="none" stroke="#5a6580" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f5-am)"/>
  <text class="lbl" x="645" y="238" text-anchor="end">抛错 / 不缩小</text>
  <path d="M700,330 L700,206" fill="none" stroke="#5a6580" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f5-am)"/>
  <text class="lbl" x="712" y="318">重试</text>
  <line x1="48" y1="420" x2="912" y2="420" stroke="#c9ced8"/>
  <text class="b" x="48" y="444">· 五个正常状态共享一把日志锁：start 在摘要让出控制前追加，end 恰好闭合一次；replace 位于锁内。</text>
  <text class="b" x="48" y="468">· busy 不是错误：另一个请求正持有压缩权；陈旧的 start 只是上个生命周期的证据，可以被清理。</text>
  <text class="b" x="48" y="492">· overflow 是 idle 上的一种触发：request-error 报 CONTEXT_WINDOW_EXCEEDED 时绕过阈值与保留，做一次最大平衡头部缩减。</text>
  <text class="b" x="48" y="516">· 失败也要闭合：错误写进 compaction/end，模型历史保持上一次持久 surface；重试要等 replace generation 前进。</text>
</svg>
