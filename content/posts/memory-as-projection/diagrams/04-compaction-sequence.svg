<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="f4-ttl f4-desc">
  <title id="f4-ttl">一次压缩的时序：先上锁，再摘要，最后只改一次 surface</title>
  <desc id="f4-desc">自动触发从 agent/pre-step 的 token 测量开始；标记对包围整个操作，replace 在锁内发生。</desc>
  <style>
    text { font-family: 'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif; fill:#2d3142; }
    .mono { font-family:'Geist Mono','SF Mono',ui-monospace,monospace; }
    .k { font-size:8px; letter-spacing:.16em; fill:#5a6580; }
    .h { font-size:16px; font-weight:600; }
    .s { font-size:9px; fill:#5a6580; }
    .b { font-size:9px; fill:#5a6580; }
    .ttl { font-size:10px; font-weight:600; }
    .lbl { font-size:7.5px; fill:#5a6580; }
    .tag { font-size:7.5px; letter-spacing:.06em; }
  </style>
  <defs>
    <marker id="f4-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/></marker>
    <marker id="f4-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
    <marker id="f4-at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/></marker>
    <marker id="f4-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6580"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text class="k mono" x="48" y="38">MEMORY · COMPACTION SEQUENCE (DSH NATIVE)</text>
  <text class="h" x="48" y="66">一次压缩的时序：先上锁，再摘要，最后只改一次 surface</text>
  <text class="s" x="48" y="86">阈值 = min(W×0.8, W−O−B)；B=65536；保留预算 = (W−O)×16%</text>
  <rect x="74" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="130" y="128" text-anchor="middle" font-size="9px">agent loop</text>
  <text class="lbl" x="130" y="142" text-anchor="middle">turn / step</text>
  <line x1="130" y1="148" x2="130" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="204" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="260" y="128" text-anchor="middle" font-size="9px">token meter</text>
  <text class="lbl" x="260" y="142" text-anchor="middle">envelope 计价</text>
  <line x1="260" y1="148" x2="260" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="334" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="390" y="128" text-anchor="middle" font-size="9px">compaction-basic</text>
  <text class="lbl" x="390" y="142" text-anchor="middle">策略与摘要</text>
  <line x1="390" y1="148" x2="390" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="464" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="520" y="128" text-anchor="middle" font-size="9px">tool-result pruner</text>
  <text class="lbl" x="520" y="142" text-anchor="middle">8K 字符预算</text>
  <line x1="520" y1="148" x2="520" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="594" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="650" y="128" text-anchor="middle" font-size="9px">LLM</text>
  <text class="lbl" x="650" y="142" text-anchor="middle">摘要请求</text>
  <line x1="650" y1="148" x2="650" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="724" y="112" width="112" height="36" rx="5" fill="#fff" stroke="#c9ced8"/>
  <text class="ttl" x="780" y="128" text-anchor="middle" font-size="9px">session log</text>
  <text class="lbl" x="780" y="142" text-anchor="middle">仅追加</text>
  <line x1="780" y1="148" x2="780" y2="590" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M892,330 L900,330 L900,492 L892,492" fill="none" stroke="#bf4520" stroke-width="1.2"/>
  <text class="lbl" x="892" y="322" text-anchor="end" fill="#bf4520">日志锁范围</text>
  <path d="M130,184 L260,184" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f4-ai)"/>
  <text class="lbl" x="195.0" y="179" text-anchor="middle">price(最新 envelope)</text>
  <path d="M260,214 L130,214" fill="none" stroke="#5a6580" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f4-am)"/>
  <text class="lbl" x="195.0" y="209" text-anchor="middle">tokens ≥ 阈值？</text>
  <text class="lbl" x="268" y="232" fill="#5a6580">低于阈值：回到 idle</text>
  <path d="M130,258 L390,258" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f4-ai)"/>
  <text class="lbl" x="260.0" y="253" text-anchor="middle">compactIfNeeded(&#x27;pressure&#x27;)</text>
  <path d="M390,286 L520,286" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f4-ai)"/>
  <text class="lbl" x="455.0" y="281" text-anchor="middle">先修剪超大工具结果</text>
  <path d="M520,314 L780,314" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f4-ai)"/>
  <text class="lbl" x="650.0" y="309" text-anchor="middle">compaction/prune + tool/result replace</text>
  <path d="M390,342 L780,342" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f4-aa)"/>
  <text class="lbl" x="585.0" y="337" text-anchor="middle">compaction/start（取锁）</text>
  <path d="M390,372 L650,372" fill="none" stroke="#2d3142" stroke-width="1.3" marker-end="url(#f4-ai)"/>
  <text class="lbl" x="520.0" y="367" text-anchor="middle">stream(system 0 + 被遮蔽消息 + 工具 schema)</text>
  <text class="lbl" x="404" y="386">末尾追加 8 节摘要指令；复用热前缀</text>
  <path d="M390,410 L650,410" fill="none" stroke="#5a6580" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f4-am)"/>
  <text class="lbl" x="520.0" y="405" text-anchor="middle">8 节 Markdown + &lt;compacted-summary&gt;</text>
  <path d="M390,438 L780,438" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f4-aa)"/>
  <text class="lbl" x="585.0" y="433" text-anchor="middle">compaction/summary（原始摘要）</text>
  <path d="M390,466 L780,466" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f4-aa)"/>
  <text class="lbl" x="585.0" y="461" text-anchor="middle">user/message  replace [s,e]</text>
  <path d="M390,494 L780,494" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#f4-aa)"/>
  <text class="lbl" x="585.0" y="489" text-anchor="middle">compaction/end（释放）</text>
  <path d="M130,530 L650,530" fill="none" stroke="#5a6580" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f4-am)"/>
  <text class="lbl" x="390.0" y="525" text-anchor="middle">下一次请求：历史变短，前缀从第一条被改写消息起重建</text>
  <rect x="48" y="556" width="860" height="42" rx="5" fill="#fbf3ef" stroke="#bf4520" stroke-dasharray="4 3"/>
  <text class="ttl" x="62" y="574" fill="#bf4520">溢出分支</text>
  <text class="b" x="130" y="574">agent/request-error = CONTEXT_WINDOW_EXCEEDED → 绕过阈值与保留，做一次最大平衡头部缩减；只有 surface replace generation 前进后才允许重试。</text>
  <text class="b" x="130" y="590">换模型时若压缩失败：MODEL_SWITCH_COMPACTION_FAILED；手动失败抛 ManualCompactionError，code 稳定。</text>
</svg>
