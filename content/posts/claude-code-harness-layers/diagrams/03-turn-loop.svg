<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">一个 turn 里的主循环</title>
  <desc id="d3-desc">左侧是一个四步循环：组请求、流式生成、判断有没有工具调用、执行批次并回灌结果，然后回到组请求。右侧列出 stop_reason 的八个取值和各自的处理方式。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">L2 · THE TURN LOOP</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">turn 是循环的单位，一次 API 调用只是它的一圈</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">用户的每条消息开一个 turn；turn 里请求几次，由模型和 stop_reason 共同决定</text>

  <!-- loop -->
  <rect x="80" y="150" width="230" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="100" y="172" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">① 组请求</text>
  <text x="100" y="189" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">系统提示 · 消息历史 · 工具表</text>

  <rect x="80" y="232" width="230" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="100" y="254" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">② 流式生成</text>
  <text x="100" y="271" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">turn.step 是唯一的流式事件</text>

  <rect x="80" y="314" width="230" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="100" y="336" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">③ 这一圈怎么收尾？</text>
  <text x="100" y="353" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">看 stop_reason，不看"模型想不想继续"</text>

  <rect x="80" y="396" width="230" height="52" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="100" y="418" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="11" font-weight="600" fill="#2d3142">④ 执行批次</text>
  <text x="100" y="435" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">tool_result 按 tool_use_id 回灌</text>

  <line x1="195" y1="202" x2="195" y2="232" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="195" y1="284" x2="195" y2="314" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="195" y1="366" x2="195" y2="396" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>

  <path d="M80 422 L56 422 L56 176 L80 176" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr-accent)"/>
  <text x="34" y="300" transform="rotate(-90 34 300)" text-anchor="middle" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#bf4520">还有 tool_use 就再来一圈</text>

  <line x1="310" y1="340" x2="356" y2="340" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="320" y="332" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#5a6580">不是</text>
  <rect x="356" y="316" width="128" height="48" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520"/>
  <text x="374" y="337" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="9" fill="#bf4520">turn.complete</text>
  <text x="374" y="353" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">answer · usage · isAborted</text>

  <!-- exits -->
  <rect x="516" y="118" width="396" height="352" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="536" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.12em" fill="#5a6580">stop_reason · 八个出口</text>

  <g font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5">
    <g>
      <text x="536" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">tool_use</text>
      <text x="536" y="190" fill="#4f5d75">有工具要跑，继续循环</text>
      <text x="536" y="248" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">end_turn</text>
      <text x="536" y="262" fill="#4f5d75">正常收尾，交回控制权</text>
      <text x="536" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">max_tokens</text>
      <text x="536" y="334" fill="#4f5d75">被长度截断，续写或报错</text>
      <text x="536" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">stop_sequence</text>
      <text x="536" y="406" fill="#4f5d75">命中自定义停止串</text>
    </g>
    <g>
      <text x="722" y="176" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">pause_turn</text>
      <text x="722" y="190" fill="#4f5d75">服务端暂停，原样续发</text>
      <text x="722" y="248" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">compaction</text>
      <text x="722" y="262" fill="#4f5d75">压缩过上下文，继续</text>
      <text x="722" y="320" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">refusal</text>
      <text x="722" y="334" fill="#4f5d75">拒答，停止并说明</text>
      <text x="722" y="392" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#2d3142">model_context_window_exceeded</text>
      <text x="722" y="406" fill="#4f5d75">窗口耗尽，压或报错</text>
    </g>
  </g>

  <text x="48" y="490" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">循环的每一步都要重新计一次上下文：上一圈的工具结果已经进了历史，压缩就插在"组请求"之前。</text>
  <text x="48" y="508" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">打断是级联的：abort(turnId) 取消这个 turn 里所有还在跑的请求与工具，而不是只停当前那一个。</text>
  <text x="48" y="526" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#9aa3b5">types 2.1.277 · turn.start / turn.step / turn.complete</text>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#2d3142"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#bf4520"/>
    </marker>
  </defs>
</svg>
