<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="d6-title d6-desc">
  <title id="d6-title">权限判决管线与沙箱边界</title>
  <desc id="d6-desc">上方是从工具调用到判决的三道关口：规则表、权限模式、钩子，输出允许、询问、拒绝三种结果。中间说明规则先命中先赢。下方是沙箱边界，只包住 shell 命令，文件工具、MCP 与钩子在边界之外。</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="48" y="38" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" font-weight="500" letter-spacing="0.16em" fill="#5a6580">L3 · PERMISSION &amp; SANDBOX</text>
  <text x="48" y="66" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="600" fill="#2d3142">模型提议，引擎判决，操作系统兜底</text>
  <text x="48" y="86" font-family="'Geist','PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="9" fill="#5a6580">三道关口的顺序是固定的；钩子能加严，不能放宽</text>

  <!-- pipeline -->
  <rect x="60" y="118" width="130" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="78" y="142" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">tool_use</text>
  <text x="78" y="158" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">name + input</text>
  <text x="78" y="172" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#9aa3b5">模型只是提议</text>

  <line x1="190" y1="150" x2="232" y2="150" stroke="#2d3142" marker-end="url(#a6)"/>

  <rect x="240" y="118" width="190" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="258" y="142" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">① 规则表</text>
  <text x="258" y="158" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">deny → ask → allow</text>
  <text x="258" y="172" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#9aa3b5">五级 settings 合并</text>

  <line x1="430" y1="150" x2="462" y2="150" stroke="#2d3142" marker-end="url(#a6)"/>

  <rect x="470" y="118" width="170" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="488" y="142" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">② 权限模式</text>
  <text x="488" y="158" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">default · acceptEdits · plan</text>
  <text x="488" y="172" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">dontAsk · bypass · auto</text>

  <line x1="640" y1="150" x2="672" y2="150" stroke="#2d3142" marker-end="url(#a6)"/>

  <rect x="680" y="118" width="180" height="64" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="698" y="142" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="10" font-weight="600" fill="#2d3142">③ 钩子</text>
  <text x="698" y="158" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#4f5d75">PreToolUse 可以再加一道</text>
  <text x="698" y="172" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="7.5" fill="#9aa3b5">但压不过 deny，也救不了 plan</text>

  <text x="60" y="211" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" fill="#5a6580">输出</text>
  <g font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5">
    <rect x="100" y="196" width="120" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="160" y="211" text-anchor="middle" fill="#2d3142">allow → 执行</text>
    <rect x="228" y="196" width="120" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="288" y="211" text-anchor="middle" fill="#2d3142">ask → 弹窗</text>
    <rect x="356" y="196" width="170" height="22" rx="11" fill="rgba(191,69,32,0.07)" stroke="#bf4520"/>
    <text x="441" y="211" text-anchor="middle" fill="#bf4520">deny → 拒绝并说明原因</text>
  </g>

  <!-- rule order strip -->
  <rect x="48" y="236" width="864" height="66" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="68" y="258" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7" letter-spacing="0.1em" fill="#5a6580">命中顺序</text>
  <text x="68" y="282" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">先命中先赢，与规则写得多具体无关：</text>
  <text x="250" y="282" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#bf4520">Bash(rm *)</text>
  <text x="330" y="282" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">deny 会压过</text>
  <text x="392" y="282" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="8" fill="#2d3142">Bash(git status)</text>
  <text x="500" y="282" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">allow。</text>
  <text x="560" y="258" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">裸工具名 deny：工具从模型上下文里整个消失，模型不会去调它。</text>
  <text x="560" y="282" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#4f5d75">"以后都允许" = 把规则写进某个 settings 文件。</text>

  <!-- sandbox -->
  <rect x="48" y="318" width="864" height="132" rx="6" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="68" y="340" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" letter-spacing="0.1em" fill="#bf4520">沙箱 · 操作系统级，只包 shell</text>

  <rect x="68" y="352" width="330" height="82" rx="6" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="86" y="374" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Bash / PowerShell / Monitor + 子进程</text>
  <text x="86" y="392" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">写：工作目录 + 临时目录 + 追加目录</text>
  <text x="86" y="408" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">读：大部分机器（凭据文件可单独禁）</text>
  <text x="86" y="424" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">网：无直连，走本机代理按域名放行</text>

  <text x="424" y="368" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">边界之外，只受权限规则约束：</text>
  <g font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8">
    <rect x="424" y="378" width="92" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="470" y="393" text-anchor="middle" fill="#2d3142">Read / Edit</text>
    <rect x="524" y="378" width="60" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="554" y="393" text-anchor="middle" fill="#2d3142">MCP</text>
    <rect x="592" y="378" width="66" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="625" y="393" text-anchor="middle" fill="#2d3142">hooks</text>
    <rect x="666" y="378" width="52" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="692" y="393" text-anchor="middle" fill="#2d3142">LSP</text>
    <rect x="726" y="378" width="100" height="22" rx="11" fill="#ffffff" stroke="#c9c2bb"/>
    <text x="776" y="393" text-anchor="middle" fill="#2d3142">状态栏命令</text>
  </g>
  <text x="424" y="422" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">沙箱内命令可以免弹窗（auto-allow）；跑不通时带 </text>
  <text x="424" y="436" font-family="'Geist Mono','SF Mono',ui-monospace,monospace" font-size="7.5" fill="#bf4520">dangerouslyDisableSandbox</text>
  <text x="600" y="436" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8" fill="#4f5d75">重试，需再批一次</text>

  <text x="48" y="478" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#5a6580">权限管"能不能做"，沙箱管"真做起来能碰到什么"。两层都失效时，才轮到人盯着看。</text>
  <text x="48" y="496" font-family="'Geist','PingFang SC',system-ui,sans-serif" font-size="8.5" fill="#9aa3b5">沙箱默认关闭；macOS 用 Seatbelt，Linux/WSL2 用 bubblewrap + socat。</text>

  <defs>
    <marker id="a6" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#2d3142"/>
    </marker>
  </defs>
</svg>
