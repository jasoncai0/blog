{{ define "main" }}
<p class="back"><a href="{{ "/" | relURL }}">← 返回首页</a></p>
<h1>{{ .Title }}</h1>
<p class="post-meta">{{ .Date.Format "2006-01-02" }}</p>

{{- end }}
{{ end }}
{{ .Content }}
{{ end }}
